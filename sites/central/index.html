  function calendario(clienteId){
    const box = el('div');
    const ref = new Date(state.mesAgenda + '-01T00:00:00');
    const hoje = hojeIso();

    const topo = el('div',{class:'mes'});
    const rotuloMes = ref.toLocaleDateString('pt-BR',{ month:'long', year:'numeric' });
    topo.appendChild(el('span',{class:'nome'}, rotuloMes.charAt(0).toUpperCase() + rotuloMes.slice(1)));
    const setas = el('div',{class:'setas'});
    const anda = n => { const d = new Date(ref); d.setMonth(d.getMonth()+n);
      state.mesAgenda = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); render(); };
    setas.appendChild(el('button',{title:'mês anterior', onclick:()=>anda(-1)},'←'));
    setas.appendChild(el('button',{class:'hoje', onclick:()=>{ state.mesAgenda = hoje.slice(0,7); render(); }},'hoje'));
    setas.appendChild(el('button',{title:'próximo mês', onclick:()=>anda(1)},'→'));
    topo.appendChild(setas);
    box.appendChild(topo);

    const cab = el('div',{class:'semana'});
    ['seg','ter','qua','qui','sex','sáb','dom'].forEach(d => cab.appendChild(el('span',{},d)));
    box.appendChild(cab);

    // A grade começa na segunda-feira da semana do dia 1 e vai até completar
    // semanas inteiras — senão o mês fica torto e a leitura se perde.
    const primeiro = new Date(ref.getFullYear(), ref.getMonth(), 1);
    const desloca = (primeiro.getDay() + 6) % 7;   // 0 = segunda
    const inicio = new Date(primeiro); inicio.setDate(1 - desloca);
    const ultimo = new Date(ref.getFullYear(), ref.getMonth()+1, 0);
    const total = desloca + ultimo.getDate();
    const celulas = Math.ceil(total / 7) * 7;
    const fimGrade = new Date(inicio); fimGrade.setDate(inicio.getDate() + celulas - 1);

    const todas = tarefasVisiveis(clienteId).filter(t => !foiEscondido(t));
    const auto = derivados(iso(inicio), iso(fimGrade), clienteId);
    const grade = el('div',{class:'grade'});
    for(let i = 0; i < celulas; i++){
      const d = new Date(inicio); d.setDate(inicio.getDate() + i);
      const chave = iso(d);
      const fora = d.getMonth() !== ref.getMonth();
      const cel = el('div',{class:'dia'+(fora?' fora':'')+(chave===hoje?' hoje':''), 'data-dia':chave});

      const n = el('div',{class:'n'});
      n.appendChild(el('span',{}, String(d.getDate())));
      const doDia = todas.filter(t => t.data === chave).sort(porHora);
      const autoDoDia = auto.filter(x => x.data === chave);
      const abertas = doDia.filter(t => t.estado === 'pendente' || t.estado === 'fazendo').length;
      if(abertas) n.appendChild(el('em',{}, String(abertas)));
      cel.appendChild(n);

      const cabe = 3;
      doDia.slice(0, cabe).forEach(t => cel.appendChild(cartaoTarefa(t, true)));
      autoDoDia.slice(0, Math.max(0, cabe - doDia.length)).forEach(x => cel.appendChild(cartaoDerivado(x)));
      const sobra = Math.max(0, doDia.length + autoDoDia.length - cabe);
      if(sobra > 0) cel.appendChild(el('span',{class:'mais'}, '+' + sobra));

      // No celular a célula tem 40px de largura: cabe o número do dia e mais
      // nada. Em vez de espremer o título até virar reticências, o dia vira
      // bolinha por tarefa — dá pra ver a carga da semana de longe — e o toque
      // leva pra lista daquele dia, onde o texto cabe.
      if(doDia.length || autoDoDia.length){
        const pontos = el('div',{class:'pontos'});
        doDia.slice(0,6).forEach(t => pontos.appendChild(el('i',{class:t.estado})));
        if(autoDoDia.length) pontos.appendChild(el('i',{class:'auto'}));
        cel.appendChild(pontos);
      }

      cel.addEventListener('click', e=>{
        if(e.target.closest('.tar')) return;
        if(!estreito()) return;
        state.visaoAgenda = 'lista'; state.diaFoco = chave; render();
      });
      cel.addEventListener('dblclick', e=>{
        if(e.target.closest('.tar')) return;
        novaTarefa(chave, clienteId || undefined);
      });
      cel.addEventListener('dragover', e=>{ e.preventDefault(); cel.classList.add('alvo'); });
      cel.addEventListener('dragleave', ()=> cel.classList.remove('alvo'));
      cel.addEventListener('drop', async e=>{
        e.preventDefault(); cel.classList.remove('alvo');
        const id = e.dataTransfer.getData('text/plain');
        const t = state.tarefas.find(x => x.id === id);
        if(t) await moverTarefa(t, chave);
      });
      grade.appendChild(cel);
    }
    box.appendChild(grade);
    box.appendChild(el('p',{class:'dica', style:'margin-top:12px'},
      'Clique numa tarefa pra abrir o painel; no quadradinho, pra andar entre a fazer, fazendo e feito. '
      + 'Dois cliques num dia vazio criam uma tarefa nele. O número no canto é quanto falta fazer naquele dia. '
      + 'As linhas com <b>i</b> vêm de outro lugar da Central e se editam lá. '
      + 'No celular o dia vira bolinhas — um toque abre a lista dele.'));
    return box;
  }

  // O cartão do mês. O quadradinho da esquerda anda o estado; o resto do cartão
  // abre o painel. Antes o cartão inteiro girava o estado, e era fácil marcar
  // como feito uma tarefa que você só queria ler.
  function cartaoTarefa(t, curto){
    const c = el('div',{class:'tar '+t.estado+(t.prioridade === 'alta' ? ' urgente' : ''),
      draggable:'true', tabindex:'0',
      title: t.titulo + (t.hora ? ' · ' + soHora(t.hora) : '') + ' · ' + rotuloTipo(t.tipo)
        + ((t.passos || []).length ? ' · ' + (t.passos.filter(x=>x.ok).length) + '/' + t.passos.length + ' passos' : '')
        + (resumoTipo(t) ? ' · ' + resumoTipo(t) : '')});
    c.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', t.id); e.dataTransfer.effectAllowed='move';
      c.classList.add('arrastando');
    });
    c.addEventListener('dragend', ()=> c.classList.remove('arrastando'));
    const marca = el('button',{class:'ini '+classePessoa(t.responsavel),
      'aria-label':'Estado de ' + t.titulo + ': ' + (ESTADOS_TAREFA.find(e=>e[0]===t.estado)||['','?'])[1]
        + '. Clique pra mudar.'}, inicial(t.responsavel));
    marca.addEventListener('click', e=>{ e.stopPropagation(); girarEstado(t); });
    c.appendChild(marca);
    if(t.hora) c.appendChild(el('span',{class:'h'}, soHora(t.hora)));
    c.appendChild(el('span',{class:'t'}, esc(t.titulo)));
    const ps = t.passos || [];
    if(ps.length) c.appendChild(el('span',{class:'ps'}, ps.filter(p=>p.ok).length + '/' + ps.length));
    c.addEventListener('click', ()=>abrirPainel(t));
    c.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ e.preventDefault(); abrirPainel(t); }
      else if(e.key === ' '){ e.preventDefault(); girarEstado(t); }
    });
    return c;
  }

  function listaDias(clienteId){
    const box = el('div');
    const hoje = hojeIso();
    const todas = tarefasVisiveis(clienteId).filter(t => !foiEscondido(t)).slice()
      .sort((a,b)=> a.data.localeCompare(b.data) || porHora(a,b));

    // A janela da lista: de trinta dias atrás até noventa à frente. Sem janela,
    // as datas do sistema (pagamento todo mês, por exemplo) seriam infinitas.
    const de = new Date(); de.setDate(de.getDate() - 30);
    const ate = new Date(); ate.setDate(ate.getDate() + 90);
    const auto = derivados(iso(de), iso(ate), clienteId);

    if(!todas.length && !auto.length){
      const v = el('div',{class:'vazio'});
      v.appendChild(el('strong',{},'Nenhuma tarefa'));
      v.appendChild(el('span',{},'Use "+ tarefa hoje", ou dê dois cliques num dia do calendário.'));
      box.appendChild(v);
      return box;
    }

    const porDia = {};
    todas.forEach(t => { (porDia[t.data] = porDia[t.data] || { t:[], a:[] }).t.push(t); });
    auto.forEach(x => { (porDia[x.data] = porDia[x.data] || { t:[], a:[] }).a.push(x); });
    Object.keys(porDia).sort().forEach(dia=>{
      const d = new Date(dia + 'T00:00:00');
      const g = el('div',{class:'dia-lista'+(dia===hoje?' e-hoje':'')+(dia===state.diaFoco?' focado':''),
        'data-dia':dia});
      const cab = el('div',{class:'cab'});
      cab.appendChild(el('b',{}, d.toLocaleDateString('pt-BR',{ weekday:'long', day:'numeric', month:'long' })));
      if(dia === hoje) cab.appendChild(el('span',{},'hoje'));
      else if(dia < hoje) cab.appendChild(el('span',{style:'color:var(--al)'}, emDias(diasAte(dia))));
      else cab.appendChild(el('span',{}, emDias(diasAte(dia))));
      cab.appendChild(el('button',{class:'mais-dia', title:'nova tarefa nesse dia',
        'aria-label':'Nova tarefa em ' + d.toLocaleDateString('pt-BR'),
        onclick:()=>novaTarefa(dia, clienteId || undefined)},'+'));
      g.appendChild(cab);

      porDia[dia].t.forEach(t=>{
        const l = el('div',{class:'linha-tar '+t.estado+(t.prioridade === 'alta' ? ' urgente' : '')});
        l.appendChild(el('button',{class:'marca '+t.estado, title:'mudar estado',
          onclick:()=>girarEstado(t)}, t.estado === 'concluido' ? '✓' : (t.estado === 'fazendo' ? '•' : '')));
        const corpo = el('button',{class:'corpo', onclick:()=>abrirPainel(t)});
        const tit = el('div',{class:'tit'});
        if(t.hora) tit.appendChild(el('span',{class:'h'}, soHora(t.hora)
          + (t.hora_fim ? '–' + soHora(t.hora_fim) : '')));
        tit.appendChild(el('span',{}, esc(t.titulo)));
        corpo.appendChild(tit);
        const sub = el('div',{class:'sub'});
        sub.appendChild(el('span',{class:'ini '+classePessoa(t.responsavel)}, inicial(t.responsavel)));
        sub.appendChild(el('span',{}, esc(pessoa(t.responsavel))));
        if((t.tipo || 'tarefa') !== 'tarefa') sub.appendChild(el('span',{}, '· ' + esc(rotuloTipo(t.tipo))));
        const res = resumoTipo(t);
        if(res) sub.appendChild(el('span',{}, '· ' + esc(res)));
        const cli = t.cliente_id && state.clientes.find(c => c.id === t.cliente_id);
        if(cli) sub.appendChild(el('span',{}, '· ' + esc(cli.nome)));
        else if(clienteId === undefined) sub.appendChild(el('span',{},'· interno'));
        if(t.prioridade === 'alta') sub.appendChild(el('span',{style:'color:var(--al)'},'· prioridade alta'));
        const ps = t.passos || [];
        if(ps.length) sub.appendChild(el('span',{}, '· ' + ps.filter(p=>p.ok).length + '/' + ps.length + ' passos'));
        if(t.local) sub.appendChild(el('span',{}, '· ' + esc(t.local)));
        if(t.detalhe) sub.appendChild(el('span',{}, '· ' + esc(t.detalhe)));
        corpo.appendChild(sub);
        l.appendChild(corpo);
        l.appendChild(el('button',{class:'apagar', style:'background:none;border:none;color:var(--fraco)',
          title:'remover', onclick:async()=>{
            removerComVolta('tarefas', t.id, t.titulo, async()=>{ await carregarTudo(); render(); });
          }},'×'));
        g.appendChild(l);
      });

      porDia[dia].a.forEach(x=>{
        const l = el('button',{class:'linha-tar auto', onclick:x.ir});
        l.appendChild(el('span',{class:'marca auto'},'i'));
        const corpo = el('div',{class:'corpo'});
        corpo.appendChild(el('div',{class:'tit'}, esc(x.oq)));
        corpo.appendChild(el('div',{class:'sub'}, 'vem de ' + esc(x.de) + ' · clique pra abrir onde se edita'));
        l.appendChild(corpo);
        g.appendChild(l);
      });
      box.appendChild(g);
    });
    if(state.diaFoco) setTimeout(()=>{
      const alvo = box.querySelector('.dia-lista.focado');
      if(alvo) alvo.scrollIntoView({ block:'center' });
      state.diaFoco = null;
    }, 0);
    return box;
  }

  // Dentro da ficha do cliente: a mesma agenda, só o que é dele.
  function abaAgendaCliente(c){
    const box = el('div');
    const minhas = state.tarefas.filter(t => t.cliente_id === c.id);
    const hoje = hojeIso();
    if(minhas.length){
      box.appendChild(placar([
        { rotulo:'Abertas', valor:minhas.filter(t=>t.estado==='pendente'||t.estado==='fazendo').length, destaca:true },
        { rotulo:'Atrasadas', valor:minhas.filter(t=>t.data<hoje&&(t.estado==='pendente'||t.estado==='fazendo')).length, esconderSeZero:true },
        { rotulo:'Feitas', valor:minhas.filter(t=>t.estado==='concluido').length },
      ]));
    }
    box.appendChild(barraAgenda(c.id));
    box.appendChild(state.visaoAgenda === 'calendario' ? calendario(c.id) : listaDias(c.id));
    return box;
  }

  // ---------- economia ----------

  // Por que esta tela existe: a pesquisa da Fase 0 diz, em três lugares
  // diferentes, que a maioria das agências cobra 20 a 40% abaixo do que
  // deveria — e que a causa não é falta de coragem, é não saber o custo real
  // de entrega. Bloco F2: "você não pode precificar sem saber quantas horas
  // custa entregar". A tabela de horas existe desde o primeiro dia e tinha
  // duas linhas, porque lançar hora num formulário à parte é trabalho que não
  // aparece pra ninguém. A partir daqui o número nasce da tarefa que já
  // estava na agenda.
  const ECONOMIA_PADRAO = {
    custo_mensal:null, pessoas:2, horas_semana_pessoa:40,
    meta_utilizacao:0.72, margem_alvo:0.70,
  };
  const SEMANAS_MES = 4.345;   // 52 ÷ 12

  const CATEGORIA_DE_TIPO = {
    gravacao:'conteudo', edicao:'conteudo', publicacao:'conteudo', reuniao:'reuniao',
    entrega:'relatorio', cobranca:'admin', prazo:'outro', tarefa:'outro',
  };

  const horaDaTarefa = t => (state.tudo.horas || []).find(h => h.tarefa_id === t.id) || null;

  // Quanto tempo o horário marcado promete. Serve de sugestão, nunca de
  // verdade: o que conta é o que foi apontado.
  function minutosMarcados(t){
    if(!t.hora || !t.hora_fim) return null;
    const m = s => { const p = String(s).split(':'); return Number(p[0])*60 + Number(p[1]); };
    const d = m(t.hora_fim) - m(t.hora);
    return d > 0 ? d : null;
  }

  const emHoras = min => {
    if(min == null) return '—';
    if(min < 60) return min + ' min';
    const h = Math.floor(min/60), r = min % 60;
    return r ? h + 'h' + String(r).padStart(2,'0') : h + ' h';
  };
  const reais = v => v == null ? '—' :
    'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits:0, maximumFractionDigits:0 });
  const porcento = v => v == null ? '—' : Math.round(v*100) + '%';

  // Um lançamento por tarefa, garantido por índice único no banco: apertar
  // duas vezes não conta o trabalho duas vezes.
  async function apontarTempo(t, minutos, faturavel){
    const linha = horaDaTarefa(t);
    if(minutos == null){
      if(!linha) return true;
      const { error } = await sb.from('horas').delete().eq('id', linha.id);
      if(error){ toast('Não deu: ' + error.message); return false; }
      state.tudo.horas = (state.tudo.horas || []).filter(h => h.id !== linha.id);
      return true;
    }
    const campos = {
      cliente_id: t.cliente_id || null,
      data: t.data,
      minutos: Math.max(1, Math.round(minutos)),
      atividade: (t.titulo || '').trim() || 'Tarefa sem nome',
      categoria: CATEGORIA_DE_TIPO[t.tipo || 'tarefa'] || 'outro',
      quem: pessoa(t.responsavel),
      faturavel: faturavel !== undefined ? faturavel
        : (linha ? linha.faturavel : !!t.cliente_id),
      tarefa_id: t.id,
    };
    if(linha){
      const { error } = await sb.from('horas').update(campos).eq('id', linha.id);
      if(error){ toast('Não deu: ' + error.message); return false; }
      Object.assign(linha, campos);
    } else {
      const { data, error } = await sb.from('horas').insert(campos).select().single();
      if(error){ toast('Não deu: ' + error.message); return false; }
      (state.tudo.horas = state.tudo.horas || []).push(Object.assign({}, campos, { id:data.id }));
    }
    return true;
  }

  // ---------- as contas ----------

  function contasDoMes(mes){
    const e = state.economia || ECONOMIA_PADRAO;
    const pessoas = Number(e.pessoas) || 0;
    const horaSem = Number(e.horas_semana_pessoa) || 0;
    const utilAlvo = Number(e.meta_utilizacao) || 0.72;
    const margemAlvo = Number(e.margem_alvo) || 0.70;
    const custoMensal = e.custo_mensal == null || e.custo_mensal === '' ? null : Number(e.custo_mensal);

    const horasDisponiveis = pessoas * horaSem * SEMANAS_MES;
    const horasFaturaveis = horasDisponiveis * utilAlvo;
    const custoHora = (custoMensal != null && horasFaturaveis > 0) ? custoMensal / horasFaturaveis : null;

    const noMes = (state.tudo.horas || []).filter(h => String(h.data || '').slice(0,7) === mes);
    const soma = ls => ls.reduce((s,l)=> s + (Number(l.minutos) || 0), 0);
    const minTotal = soma(noMes);
    const minCliente = soma(noMes.filter(h => h.cliente_id));
    const minFaturavel = soma(noMes.filter(h => h.faturavel));

    const ativos = state.clientes.filter(c => ['onboarding','ativo','pausado'].includes(c.estagio));
    const porCliente = ativos.map(c=>{
      const meus = noMes.filter(h => h.cliente_id === c.id);
      const min = soma(meus);
      const horas = min/60;
      const receita = Number(c.valor_mensal) || 0;
      const custo = custoHora == null ? null : horas * custoHora;
      const margem = (custo == null || !receita) ? null : (receita - custo) / receita;
      return { c, min, horas, receita, custo, margem,
        reaisHora: horas > 0 && receita ? receita / horas : null,
        lancamentos: meus.length };
    }).sort((a,b)=>{
      if(a.margem == null && b.margem == null) return b.min - a.min;
      if(a.margem == null) return 1;
      if(b.margem == null) return -1;
      return a.margem - b.margem;    // pior margem no topo: é onde se olha primeiro
    });

    const receitaMes = porCliente.reduce((s,l)=> s + l.receita, 0);
    const comHoras = porCliente.filter(l => l.min > 0);
    const mediaMinCliente = comHoras.length ? soma(noMes.filter(h=>h.cliente_id)) / comHoras.length : null;

    // Quanto dado existe. Sem isso a tela viraria uma máquina de conclusões
    // sobre três lançamentos — que é exatamente o erro que a pesquisa aponta
    // nas fontes fracas que ela mesma cataloga.
    const dias = new Set(noMes.map(h => h.data)).size;
    const confianca = noMes.length === 0 ? 'nada'
      : (noMes.length < 8 || dias < 5) ? 'pouco'
      : (noMes.length < 25) ? 'indicio' : 'ok';

    // Quanto custa uma peça. Conta só o que foi ao ar (tarefa de publicação
    // concluída), contra as horas de conteúdo do mês — que incluem gravar e
    // editar. Contar peça na gravação E na edição contaria a mesma peça duas
    // vezes, e o número serve justamente pra decidir preço.
    const publicadas = state.tarefas.filter(x =>
      (x.tipo === 'publicacao') && x.estado === 'concluido' && String(x.data || '').slice(0,7) === mes);
    const pecas = publicadas.reduce((n,x)=> n + (Number((x.campos || {}).quantidade) || 1), 0);
    const minConteudo = soma(noMes.filter(h => h.categoria === 'conteudo'));

    return {
      e, mes, pessoas, horaSem, utilAlvo, margemAlvo, custoMensal,
      horasDisponiveis, horasFaturaveis, custoHora,
      noMes, minTotal, minCliente, minFaturavel, dias, confianca,
      porCliente, receitaMes, pecas, minConteudo, publicadas,
      utilizacaoMedida: minTotal ? minCliente / minTotal : null,
      cabem: (mediaMinCliente && horasFaturaveis) ? (horasFaturaveis * 60) / mediaMinCliente : null,
      mediaMinCliente,
    };
  }

  // Uma barra por linha, todas da mesma cor. A cor aqui não identifica nada —
  // o que a barra diz é tamanho, e tamanho já está no comprimento. Pintar cada
  // uma de um jeito gastaria o único canal livre repetindo o que o olho já vê.
  function barras(itens, formata){
    const maior = itens.reduce((m,i)=> Math.max(m, i.valor), 0) || 1;
    const box = el('div',{class:'barras'});
    itens.forEach(i=>{
      const l = el('div',{class:'barra-l', title: i.rotulo + ' · ' + formata(i.valor)});
      l.appendChild(el('span',{class:'rot-b'}, esc(i.rotulo)));
      const trilho = el('div',{class:'trilho'});
      trilho.appendChild(el('i',{style:'width:' + Math.max(2, Math.round((i.valor/maior)*100)) + '%'}));
      l.appendChild(trilho);
      l.appendChild(el('span',{class:'val-b'}, formata(i.valor)));
      box.appendChild(l);
    });
    return box;
  }

  // Uma razão contra um limite: medidor, não gráfico. O número e a palavra vão
  // junto sempre — cor sozinha não conta nada a quem não a enxerga.
  function medidor(valor, alvo){
    const box = el('div',{class:'medidor'});
    const cheio = Math.max(0, Math.min(1, valor));
    const como = valor >= alvo ? 'ok' : (valor >= alvo - 0.15 ? 'es' : 'al');
    const t = el('div',{class:'trilho ' + como});
    t.appendChild(el('i',{style:'width:' + Math.round(cheio*100) + '%'}));
    t.appendChild(el('u',{style:'left:' + Math.round(Math.min(1,alvo)*100) + '%', title:'alvo: ' + porcento(alvo)}));
    box.appendChild(t);
    box.appendChild(el('span',{class:'lab ' + como},
      porcento(valor) + ' · ' + (valor >= alvo ? 'no alvo' : 'abaixo do alvo')));
    return box;
  }

            : 'Já dá pra ver tendência, mas ainda não pra mexer em preço. A conta fica firme com o mês fechado.')));
      }

    }

    // --- falta o custo mensal
    if(x.custoHora == null){
      const f = el('div',{class:'bloco falta'});
      f.appendChild(el('p',{class:'rot laranja'},'Falta um número'));
      f.appendChild(el('h2',{class:'titulo-bloco'},'Quanto a Bora custa por mês'));
      f.appendChild(el('p',{class:'intro'},

        + 'contador, internet, e o pró-labore que vocês dois querem tirar. É um alvo, não um extrato — '
        + 'melhor um número aproximado hoje que nenhum número.'));

        'Preencher agora'));

      { rotulo:'Custo por hora', valor: x.custoHora == null ? '—' : reais(x.custoHora), destaca:true },
      { rotulo:'Receita contratada', valor: reais(x.receitaMes) },
      { rotulo:'Horas apontadas', valor: emHoras(x.minTotal) },
      { rotulo:'Delas, em cliente', valor: emHoras(x.minCliente),
        parte:x.minCliente, de:Math.max(x.minTotal,1) },

    const p = el('div',{class:'corpo-expl'});
    p.appendChild(el('p',{},
      x.pessoas + (x.pessoas === 1 ? ' pessoa' : ' pessoas') + ' × ' + x.horaSem + ' h por semana × 4,345 semanas = <b>'
      + x.horasDisponiveis.toFixed(0) + ' h por mês</b> de tempo existente.'));
    p.appendChild(el('p',{},
      'Nem todo esse tempo é entregável: proposta, reunião interna, erro e conserto não viram fatura. '

    nums.appendChild(conta);
    m.appendChild(nums);

    // --- margem por cliente
    const mc = el('div',{class:'bloco'});
    mc.appendChild(el('p',{class:'rot'},'Margem de entrega, cliente por cliente'));
    mc.appendChild(el('p',{class:'intro', style:'margin-bottom:16px'},

      + ' por conta vem da pesquisa (Parakeeto, via Bloco A). Quem está no topo da lista é quem está pior.'));
    if(!x.porCliente.length){
      mc.appendChild(el('p',{class:'dica'},'Nenhum cliente ativo, em onboarding ou pausado.'));

      const tab = el('div',{class:'rolagem'});

      t.innerHTML = '<thead><tr><th>Cliente</th><th>Recebe</th><th>Horas</th>'

      const tb = el('tbody');
      x.porCliente.forEach(l=>{
        const tr = el('tr');
        const td1 = el('td');
        td1.appendChild(el('button',{class:'linkbtn', onclick:()=>abrirCliente(l.c.id,'horas')}, esc(l.c.nome)));
        if(!l.min) td1.appendChild(el('span',{class:'dica', style:'display:block;margin:2px 0 0'},'sem horas apontadas'));

        tr.appendChild(el('td',{class:'num-col'}, l.receita ? reais(l.receita) : '<span class="dica">sem valor na ficha</span>'));

        tr.appendChild(el('td',{class:'num-col'}, l.reaisHora == null ? '—' : reais(l.reaisHora)));
        tr.appendChild(el('td',{class:'num-col'}, l.custo == null ? '—' : reais(l.custo)));
        const tdm = el('td');
        if(l.margem == null) tdm.appendChild(el('span',{class:'dica'},

      });
      t.appendChild(tb);
      tab.appendChild(t);
      mc.appendChild(tab);
      const pior = x.porCliente.find(l => l.margem != null && l.margem < x.margemAlvo);
      if(pior && x.confianca === 'ok'){
        mc.appendChild(el('p',{class:'intro', style:'margin-top:16px'},
          '<b>' + esc(pior.c.nome) + '</b> está abaixo do alvo. As saídas são três, nesta ordem: '
          + 'cortar escopo (o que está sendo entregue e não foi combinado?), '
          + 'reduzir o tempo por entrega, ou reajustar o preço no fim do contrato. '
          + 'A pesquisa avisa que retainer sem escopo definido vira contrato ilimitado, '
          + 'e que os maiores clientes acabam sendo os menos lucrativos justamente por isso.'));

    m.appendChild(mc);

    // --- onde vai o tempo

        if(state.visaoTempo === 'cliente'){

    // --- quanto custa uma peça

        + (x.custoHora == null ? '.' : ', ou <b>' + reais((porPeca/60) * x.custoHora) + ' de custo cada uma</b>.')));
      pp.appendChild(el('p',{class:'dica', style:'margin-top:12px'},
        'Conta as peças das tarefas de publicação concluídas — o que foi ao ar de verdade. '
        + 'Contar de novo na gravação e na edição contaria a mesma peça três vezes, e é esse número '
        + 'que decide se o pacote de dez peças cabe no preço.'));
      m.appendChild(pp);
    }

    // --- capacidade
    const cap = el('div',{class:'bloco'});
    cap.appendChild(el('p',{class:'rot'},'Quanto ainda cabe'));
    if(x.cabem == null){
      cap.appendChild(el('p',{class:'intro'},

    } else {
      cap.appendChild(el('p',{class:'intro'},
        'Um cliente consumiu, em média, <b>' + emHoras(Math.round(x.mediaMinCliente)) + '</b> neste mês. '
        + 'Com ' + x.horasFaturaveis.toFixed(0) + ' h faturáveis, cabem <b>'

          : 'Sobram ' + (Math.floor(x.cabem) - jaTem) + ' vagas pela conta das horas — o gargalo real pode ser outro.')));
    }
    m.appendChild(cap);

    // --- o que a fábrica gastou no mesmo mês (Claude e tempo nos apps), por cliente

    else if(!state.fabrica) carregarFabrica().then(render);

    // --- configuração

    return m;
  }

  function blocoConfigEconomia(x){
    const box = el('div',{class:'bloco'});

      'Mudar aqui muda todas as contas desta tela. Ficam guardados; não precisa repetir todo mês.'));

    const grava = async (campo, valor)=>{
      const campos = {}; campos[campo] = valor;
      campos.atualizado_em = new Date().toISOString();
      const { error } = await sb.from('economia_bora').update(campos).eq('id', true);
      if(error){ toast('Não deu: ' + error.message); return false; }
      state.economia = Object.assign({}, state.economia || ECONOMIA_PADRAO, campos);
      toast('Salvo.'); render();
      return true;
    };

    const campos = [
      { c:'custo_mensal', r:'Custo da Bora por mês', id:'custo-mensal', passo:'50',
        d:'Ferramentas, impostos, contador, internet e o pró-labore que vocês querem tirar. Alvo, não extrato.' },
      { c:'pessoas', r:'Quantas pessoas', passo:'1',
        d:'Quem entrega. Hoje, dois.' },
      { c:'horas_semana_pessoa', r:'Horas por semana, por pessoa', passo:'1',
        d:'O que cada um consegue trabalhar de verdade numa semana.' },
      { c:'meta_utilizacao', r:'Quanto do tempo é faturável', pct:true, passo:'1',
        d:'A pesquisa põe o sustentável entre 70% e 75%. Acima disso, queima gente — e ~30% do tempo nunca vira fatura, então precisa estar no preço.' },
      { c:'margem_alvo', r:'Margem de entrega desejada', pct:true, passo:'1',
        d:'Quanto da mensalidade deve sobrar depois de pagar as horas. O alvo de mercado por conta é 70%.' },
    ];
    const grade = el('div',{class:'props economia'});
    campos.forEach(f=>{
      const e = state.economia || ECONOMIA_PADRAO;
      const linha = el('div',{class:'prop alto'});
      const rot = el('div');
      rot.appendChild(el('span',{}, esc(f.r)));
      rot.appendChild(el('span',{class:'dica', style:'display:block;margin:3px 0 0;max-width:44ch'}, esc(f.d)));
      linha.appendChild(rot);
      const cx = el('div',{class:'v', style:'display:flex;gap:8px;align-items:center'});
      const bruto = e[f.c];
      const i = el('input',{ type:'number', step:f.passo, min:'0',
        value: bruto == null || bruto === '' ? '' : (f.pct ? Math.round(Number(bruto)*100) : bruto) });
      if(f.id) i.id = f.id;
      i.addEventListener('change', async ()=>{
        const txt = i.value.trim();
        if(txt === ''){ if(f.c === 'custo_mensal') await grava(f.c, null); return; }
        let v = Number(txt);
        if(f.pct){
          if(v <= 0 || v > 100){ toast('Use um número entre 1 e 100.'); i.value = Math.round(Number(bruto)*100); return; }
          v = v/100;
        }
        if(!f.pct && v <= 0 && f.c !== 'custo_mensal'){ toast('Precisa ser maior que zero.'); i.value = bruto; return; }
        await grava(f.c, v);
      });
      cx.appendChild(i);
      if(f.pct) cx.appendChild(el('span',{class:'dica', style:'margin:0'},'%'));
      if(f.c === 'custo_mensal') cx.appendChild(el('span',{class:'dica', style:'margin:0'},'por mês'));
      linha.appendChild(cx);
      grade.appendChild(linha);
    });
    box.appendChild(grade);
    return box;
  }

  // ---------- por onde se perde (funil) ----------

  // A oportunidade guardava só onde está. Agora um gatilho no banco anota toda
  // mudança de etapa, e isso responde duas perguntas que antes não tinham
  // resposta: onde a conversa morre, e quanto tempo leva do primeiro contato
  // até fechar. Não dava pra reconstruir depois — por isso o registro começou
  // antes de o funil encher.
  function blocoPorOndeSePerde(){
    const ev = state.funilEventos || [];
    const box = el('div',{class:'bloco'});
    box.appendChild(el('p',{class:'rot'},'Por onde se perde'));

    const porOp = {};
    ev.forEach(e => { (porOp[e.oportunidade_id] = porOp[e.oportunidade_id] || []).push(e); });
    const trilhas = Object.keys(porOp).map(id => porOp[id].slice()
      .sort((a,b)=> String(a.em).localeCompare(String(b.em))));

    const fechados = trilhas.filter(t => t[t.length-1].para === 'fechado');
    const perdidos = trilhas.filter(t => t[t.length-1].para === 'perdido');

    if(trilhas.length < 5){
      box.appendChild(el('p',{class:'intro'},
        'A Central passou a anotar cada mudança de etapa. Com ' + trilhas.length
        + (trilhas.length === 1 ? ' oportunidade registrada' : ' oportunidades registradas')
        + ', ainda não há o que ler aqui — mas o histórico já está sendo guardado, '
        + 'e ele não daria pra reconstruir depois. Volte quando tiver umas quinze.'));
      return box;
    }

    const ORDEM = ['mapeado','contatado','conversando','reuniao','proposta'];
    const itens = ORDEM.map(et=>{
      const passaram = trilhas.filter(t => t.some(e => e.para === et)).length;
      const morreram = perdidos.filter(t=>{
        const i = t.findIndex(e => e.para === et);
        return i >= 0 && t[i+1] && t[i+1].para === 'perdido';
      }).length;
      return { etapa:et, passaram, morreram };
    }).filter(i => i.passaram);

    box.appendChild(el('p',{class:'intro', style:'margin-bottom:16px'},
      trilhas.length + ' oportunidades registradas · ' + fechados.length + ' fecharam · '
      + perdidos.length + ' se perderam.'));
    box.appendChild(barras(
      itens.map(i => ({ rotulo: rotulo('etapa_funil', i.etapa) + ' — perdeu ' + i.morreram + ' de ' + i.passaram,
        valor: i.passaram ? i.morreram / i.passaram : 0 })),
      v => Math.round(v*100) + '%'));

    if(fechados.length){
      const dias = fechados.map(t=>
        Math.round((new Date(t[t.length-1].em) - new Date(t[0].em)) / 86400000)).sort((a,b)=>a-b);
      const meio = dias[Math.floor(dias.length/2)];
      box.appendChild(el('p',{class:'intro', style:'margin-top:16px'},
        'Do primeiro registro até fechar, a mediana é de <b>' + meio
        + (meio === 1 ? ' dia' : ' dias') + '</b>. É esse o prazo que precisa caber no seu caixa.'));
    }
    return box;
  }

  // ---------- criar (a fábrica, pela equipe) ----------
  //
  // A arte não se desenha mais aqui. A equipe pede a peça — imagem ou vídeo,
  // pra qualquer cliente — e ela entra na mesma fila e na mesma fábrica do
  // app do cliente: os apps da ArtCraft fazem, a conferência de marca confere,
  // e a peça volta pra cá com prévia, versões e editável. Ajuste se pede por
  // escrito ou por atalho; quando precisa de mão, o editável abre no app da
  // ArtCraft neste PC e a versão corrigida sobe de volta, conferida igual.

  const TIPOS_CRIAR = [
    { k:'post',       tipo:'post-feed', nome:'Post',                 sub:'Uma imagem pro feed, em pé',            midia:'imagem' },
    { k:'carrossel',  tipo:'carrossel', nome:'Carrossel',            sub:'De 3 a 10 imagens em sequência',         midia:'imagem' },
    { k:'capa',       tipo:'capa',      nome:'Capa de vídeo',        sub:'Três opções e dois títulos',             midia:'imagem' },
    { k:'reel',       tipo:'reel',      formato:'bruto',     nome:'Reel do vídeo gravado', sub:'Corta pausas e legenda na marca', midia:'vídeo' },
    { k:'abertura',   tipo:'reel',      formato:'abertura',  nome:'Abertura animada',      sub:'10 s com o tema animado',         midia:'vídeo' },
    { k:'carvideo',   tipo:'reel',      formato:'carrossel', nome:'Carrossel em vídeo',    sub:'De um carrossel já aprovado',     midia:'vídeo' },
    { k:'cartaz',     tipo:'cartaz',    nome:'Cartaz para imprimir', sub:'A4 ou A3, PDF pronto pra gráfica', midia:'impressão' },
    { k:'guia',       tipo:'material',  formato:'guia',    nome:'Guia em PDF',      sub:'A5, de 6 a 12 páginas, uma ideia por página', midia:'páginas' },
    { k:'folheto',    tipo:'material',  formato:'folheto', nome:'Folheto dobrável', sub:'A4 em três, PDF/X-4 pra gráfica',            midia:'impressão' },
  ];
  // As frases contam como na fábrica e no banco: pedaços entre . ; : ! ? ou quebra de linha, com duas palavras ou mais.
  const frasesDoPedido = t => String(t || '').split(/[.;:!?\n]+/).map(f => f.trim()).filter(f => f.split(/\s+/).length >= 2);
  const IDEIAS_PRECISA = n => n.tipo === 'guia' ? n.paginas - 2 : n.tipo === 'folheto' ? 3 : 0;
  const ESTADOS_PEDIDO = { rascunho:'Rascunho', produzindo:'Fazendo', para_aprovar:'Para aprovar', aprovado:'Aprovado',
    agendado:'Agendado', publicado:'Publicado', cancelado:'Cancelado' };
  const COR_ESTADO = { produzindo:'andamento', para_aprovar:'espera', aprovado:'ok', agendado:'ok', publicado:'ok', cancelado:'neutro' };
  // No vídeo, a fábrica sem o Claude troca a cor da legenda e mexe na música.
  const ATALHOS_CRIAR = tipo => tipo === 'reel' ? [['outra cor da marca','Outra cor da marca'], ['música mais baixa','Música mais baixa'], ['sem música','Sem música']]
    : tipo === 'cartaz' || tipo === 'material' ? [['mais curto','Mais curto'], ['outra cor da marca','Outra cor da marca']]
    : [['mais curto','Mais curto'], ['outra cor da marca','Outra cor da marca'], ['mais sério','Mais sério'], ['troca a foto','Troca a foto']];
  // Qual app da ArtCraft abre cada editável.
  const APP_DO_ARQUIVO = { psd:'PhotoCraft', fcproj:'FilmCraft', ecproj:'EffectCraft', zip:'SoundCraft (descompacte)', vectorcraft:'VectorCraft', ai:'VectorCraft ou Illustrator', designcraft:'DesignCraft', idml:'DesignCraft ou InDesign' };
  const COLUNAS_PEDIDO = 'id, cliente_id, tipo, titulo, briefing, estado, publicar_em, ajustes, job_aprovado, escolha, aprovado_em, '
    + 'assumido_por, assumido_em, pela_equipe, criado_em, atualizado_em, '
    + 'jobs!jobs_pedido_id_fkey(id, rodada, skill, estado, etapa, progresso, restam_segundos, saidas, erro, tentativas, max_tentativas, criado_em, atualizado_em)';
  const LIMITE_VIDEO_MB = 50, LIMITE_VIDEO_SEG = 90;

  const C = () => state.criar || (state.criar = { pedidos:[], carregado:false, urls:{}, textos:{}, aba:'pecas', filtro:'todos',
    cliente:'', novo:null, versao:{}, ajuste:null, escolha:{}, eventos:{}, editando:{}, enviando:null });

  const formatoDe = p => (p.briefing && p.briefing.formato) || (p.tipo === 'reel' ? 'bruto' : null);
  const tipoCriarDe = p => TIPOS_CRIAR.find(t => t.tipo === p.tipo && (!t.formato || t.formato === formatoDe(p))) || { nome:p.tipo };
  const jobsDe = p => (p.jobs || []).slice().sort((a, b) => Date.parse(a.criado_em) - Date.parse(b.criado_em));
  const prontosDe = p => jobsDe(p).filter(j => j.estado === 'pronto');
  const andamentoDe = p => jobsDe(p).filter(j => j.estado === 'na_fila' || j.estado === 'rodando').pop() || null;
  const saidasDe = (j, papel) => ((j && j.saidas) || []).filter(s => !papel || s.papel === papel).sort((a, b) => a.caminho.localeCompare(b.caminho));
  const arquivoDe = (j, nome) => saidasDe(j, 'saida').find(s => s.caminho.endsWith('/' + nome));
  const imagensDe = j => saidasDe(j, 'saida').filter(s => /png|jpeg/.test(s.mime || ''));
  const versaoVistaDe = p => { const v = prontosDe(p), id = C().versao[p.id];
    return v.find(x => x.id === id) || (p.job_aprovado && v.find(x => x.id === p.job_aprovado)) || v[v.length - 1] || null; };
  const precisaDaEquipe = p => { const u = jobsDe(p).pop(); return p.estado === 'produzindo' && !p.assumido_por && u && u.estado === 'falhou'; };

  // Uma leitura por vez: a tela se redesenha enquanto lê, e cada redesenho
  // sem a lista pediria de novo.
  let lendoPedidos = null;
  function carregarPedidos(){
    if(lendoPedidos) return lendoPedidos;
    lendoPedidos = (async () => {
      const { data, error } = await sb.from('pedidos').select(COLUNAS_PEDIDO).order('criado_em', { ascending:false }).limit(150);
      if(error){ toast('Não deu pra ler os pedidos: ' + error.message); return; }
      C().pedidos = data || [];
      C().carregado = true;
      escutarFabrica();
      await garantirUrlsCriar();
    })().finally(() => { lendoPedidos = null; });
    return lendoPedidos;
  }

  // O balde é fechado: tudo chega por link assinado, de uma hora. O texto
  // (legenda, títulos) é baixado uma vez e fica na memória.
  async function garantirUrlsCriar(extras){
    const c = C();
    const faltam = new Set(extras || []);
    for(const p of c.pedidos) for(const j of jobsDe(p)) for(const s of saidasDe(j, 'saida')) if(!c.urls[s.caminho]) faltam.add(s.caminho);
    if(!faltam.size) return;
    const { data } = await sb.storage.from('pedidos').createSignedUrls([...faltam], 3600);
    for(const d of data || []) if(d.signedUrl) c.urls[d.path] = d.signedUrl;
    await Promise.all((data || []).filter(d => d.signedUrl && d.path.endsWith('.txt') && c.textos[d.path] == null).map(async d => {
      try { c.textos[d.path] = await (await fetch(d.signedUrl)).text(); } catch { /* tenta de novo no próximo render */ }
    }));
  }

  async function carregarEventosDe(p){
    const ids = (p.jobs || []).map(j => j.id);
    if(!ids.length){ C().eventos[p.id] = []; return; }
    // A equipe vê tudo: o que o cliente lê e os erros de cada tentativa.
    const { data } = await sb.from('job_eventos').select('id, job_id, mensagem, nivel, visivel_cliente, criado_em')
      .in('job_id', ids).or('visivel_cliente.eq.true,nivel.eq.erro').order('id');
    C().eventos[p.id] = data || [];
  }

  // O vídeo é redesenhado junto com a tela, e um <video> novo volta pro
  // começo. Guardado aqui, o mesmo elemento só muda de lugar.
  const videosCriar = new Map();
  function videoCriar(url, cls){
    let v = videosCriar.get(url);
    if(!v){ v = document.createElement('video'); v.src = url; v.controls = true; v.preload = 'metadata'; v.playsInline = true; videosCriar.set(url, v); }
    v.className = cls || 'cr-video';
    return v;
  }

  function miniaturaCriar(p){
    const c = C(), v = versaoVistaDe(p);
    const img = imagensDe(v)[0], vid = arquivoDe(v, 'reel.mp4');
    if(img && c.urls[img.caminho]) return el('img',{class:'cr-mini', src:c.urls[img.caminho], alt:''});
    if(vid && c.urls[vid.caminho]){ const x = el('video',{class:'cr-mini', src:c.urls[vid.caminho] + '#t=0.5', preload:'metadata', 'aria-hidden':'true'}); x.muted = true; return x; }
    return el('span',{class:'cr-mini vazia', 'aria-hidden':'true'});
  }

  function telaCriar(){
    const c = C();
    const m = el('main');
    const cabeca = el('div',{class:'bloco'});
    cabeca.appendChild(el('p',{class:'rot laranja'},'Produção'));
    cabeca.appendChild(el('h1',{class:'page'},'Criar'));
    cabeca.appendChild(el('p',{class:'intro'},
      'Peça uma imagem ou um vídeo pra qualquer cliente. A fábrica faz com os apps da ArtCraft, na marca dele; '
      + 'você acompanha, pede ajuste, edita à mão no app quando precisar e aprova.'));
    cabeca.appendChild(avisoDaFabrica());
    const abas = el('div',{class:'visao', style:'margin-top:18px'});
    [['pecas','Peças'],['nova','Nova peça'],['lote','Produzir o mês'],['marca','Marca']].forEach(([k, rot])=>{
      abas.appendChild(el('button',{'aria-selected':String(c.aba === k), onclick:()=>{ c.aba = k; render(); }}, rot));
    });
    cabeca.appendChild(abas);
    m.appendChild(cabeca);

    if(c.aba === 'marca'){ if(!state.estudio) state.estudio = {}; m.appendChild(telaMarca()); return m; }
    if(c.aba === 'nova'){ m.appendChild(formNovaPeca()); return m; }
    if(c.aba === 'lote'){ m.appendChild(telaLote()); return m; }
    if(!c.carregado){ m.appendChild(el('div',{class:'bloco'}, '<p class="muted">Carregando…</p>')); carregarPedidos().then(render); return m; }
    m.appendChild(listaDePecas());
    return m;
  }

  function listaDePecas(){
    const c = C();
    const b = el('div',{class:'bloco'});
    const fer = el('div',{class:'ferramentas'});
    const filtros = el('div',{class:'visao'});
    [['todos','Todas'],['precisa','Precisam da equipe'],['produzindo','Fazendo'],['para_aprovar','Para aprovar'],['aprovado','Aprovadas']].forEach(([k, rot])=>{
      filtros.appendChild(el('button',{'aria-selected':String(c.filtro === k), onclick:()=>{ c.filtro = k; render(); }}, rot));
    });
    fer.appendChild(filtros);
    const sel = el('select',{'aria-label':'Cliente'});
    sel.appendChild(el('option',{value:''}, 'Todos os clientes'));
    state.clientes.forEach(x => { const o = el('option',{value:x.id}); o.textContent = x.nome; if(x.id === c.cliente) o.selected = true; sel.appendChild(o); });
    sel.addEventListener('change', ()=>{ c.cliente = sel.value; render(); });
    fer.appendChild(sel);
    fer.appendChild(el('button',{class:'btn small', onclick:()=>{ c.aba = 'nova'; render(); }}, '+ Nova peça'));
    b.appendChild(fer);

    const lista = c.pedidos.filter(p => (!c.cliente || p.cliente_id === c.cliente) && (
      c.filtro === 'todos' ? true
      : c.filtro === 'precisa' ? precisaDaEquipe(p)
      : c.filtro === 'aprovado' ? ['aprovado','agendado','publicado'].includes(p.estado)
      : p.estado === c.filtro));
    if(!lista.length){ b.appendChild(el('div',{class:'vazio'}, 'Nenhuma peça aqui. Comece em "Nova peça".')); return b; }
    const ul = el('div',{class:'cr-lista'});
    lista.forEach(p=>{
      const linha = el('button',{class:'cr-linha' + (precisaDaEquipe(p) ? ' precisa' : ''), onclick:()=>ir({tipo:'pedido', id:p.id})});
      linha.appendChild(miniaturaCriar(p));
      const t = el('span',{class:'cr-txt'});
      const tit = el('b'); tit.textContent = p.titulo || tipoCriarDe(p).nome;
      const sub = el('span',{class:'muted'});
      const cli = state.clientes.find(x => x.id === p.cliente_id);
      sub.textContent = (cli ? cli.nome : 'cliente') + ' · ' + tipoCriarDe(p).nome + ' · ' + (p.pela_equipe ? 'pedido pela equipe' : 'pedido pelo cliente') + ' · ' + dataBR(p.criado_em);
      t.appendChild(tit); t.appendChild(sub);
      linha.appendChild(t);
      const est = precisaDaEquipe(p) ? ['Precisa da equipe','alerta'] : p.assumido_por && p.estado === 'produzindo' ? ['Com a equipe','roxo']
        : [ESTADOS_PEDIDO[p.estado] || p.estado, COR_ESTADO[p.estado] || 'neutro'];
      const ch = el('span',{class:'chip ' + est[1]}); ch.textContent = est[0];
      linha.appendChild(ch);
      ul.appendChild(linha);
    });
    b.appendChild(ul);
    return b;
  }

  // ---------- nova peça ----------

  function formNovaPeca(){
    const c = C();
    if(!c.novo) c.novo = { cliente:'', tipo:'post', texto:'', slides:5, objetivo:null, tom:null, data:'', video:null, deCarrossel:'', trilha:'', folha:'a4', paginas:8 };
    const n = c.novo;
    const t = TIPOS_CRIAR.find(x => x.k === n.tipo);
    const b = el('div',{class:'bloco'});

    const campo = (rot, dentro, dica) => {
      const w = el('div',{class:'cr-campo'});
      const l = el('label'); l.textContent = rot; w.appendChild(l); w.appendChild(dentro);
      if(dica){ const d = el('p',{class:'dica'}); d.textContent = dica; w.appendChild(d); }
      b.appendChild(w);
      return w;
    };

    const sel = el('select',{id:'cr-cliente'});
    sel.appendChild(el('option',{value:''}, 'Escolha o cliente'));
    state.clientes.forEach(x => { const o = el('option',{value:x.id}); o.textContent = x.nome; if(x.id === n.cliente) o.selected = true; sel.appendChild(o); });
    sel.addEventListener('change', ()=>{ n.cliente = sel.value; n.deCarrossel = ''; n.trilha = ''; render(); });
    campo('Pra quem', sel).querySelector('label').setAttribute('for', 'cr-cliente');

    const tipos = el('div',{class:'cr-tipos', role:'group', 'aria-label':'O que fazer'});
    TIPOS_CRIAR.forEach(x=>{
      const bt = el('button',{class:'cr-tipo', type:'button', 'aria-pressed':String(n.tipo === x.k), onclick:()=>{ n.tipo = x.k; render(); }});
      const nm = el('b'); nm.textContent = x.nome;
      const sb2 = el('span'); sb2.textContent = x.sub + ' · ' + x.midia;
      bt.appendChild(nm); bt.appendChild(sb2);
      tipos.appendChild(bt);
    });
    campo('O que fazer', tipos);

    // O que muda por tipo.
    if(n.tipo === 'reel') b.appendChild(campoVideoCriar(n));
    if(n.tipo === 'carvideo'){
      const aprov = C().pedidos.filter(p => p.cliente_id === n.cliente && p.tipo === 'carrossel' && ['aprovado','agendado','publicado'].includes(p.estado));
      const s = el('select',{id:'cr-decarrossel'});
      s.appendChild(el('option',{value:''}, aprov.length ? 'Escolha o carrossel' : 'Este cliente ainda não tem carrossel aprovado'));
      aprov.forEach(p => { const o = el('option',{value:p.id}); o.textContent = (p.titulo || 'Carrossel') + ' · ' + dataBR(p.criado_em); if(p.id === n.deCarrossel) o.selected = true; s.appendChild(o); });
      s.addEventListener('change', ()=>{ n.deCarrossel = s.value; const p = aprov.find(x => x.id === s.value);
        if(p && !n.texto) n.texto = (p.briefing && p.briefing.texto) || p.titulo || ''; render(); });
      campo('Qual carrossel', s, 'As imagens aprovadas entram na ordem, sobre o fundo da marca.');
      if(!C().carregado) carregarPedidos().then(render);
    }

    if(t.midia === 'vídeo' && n.cliente){
      const w = campo('Música', escolhaDeMusica(n.cliente, n.trilha || '', v => { n.trilha = v; }, 'cr-musica'),
        n.tipo === 'reel' ? 'Fica por baixo da fala e abaixa sozinha onde a pessoa fala.' : 'Do começo ao fim, sumindo no último segundo.');
      w.querySelector('label').setAttribute('for', 'cr-musica');
    }

    const area = el('textarea',{rows:'3', maxlength:'800', id:'cr-texto',
      placeholder: n.tipo === 'abertura' ? 'Ex.: Turma nova do laboratório, inscrições abertas.' : 'Ex.: Abrimos turma nova no laboratório, inscrições até sexta.'});
    area.value = n.texto;
    area.addEventListener('input', ()=>{ n.texto = area.value; botao.disabled = !podePedir(); contarIdeias(); });
    const caixaTexto = campo(n.tipo === 'abertura' ? 'O que a abertura vai dizer' : n.tipo === 'reel' ? 'Em uma frase, sobre o que é o vídeo'
      : IDEIAS_PRECISA(n) ? 'O título e uma ideia por frase' : 'O que a peça precisa dizer', area);
    caixaTexto.querySelector('label').setAttribute('for', 'cr-texto');
    // Guia e folheto: a fábrica não escreve conteúdo; o pedido traz uma ideia por página ou painel.
    const contagem = el('p',{class:'dica', id:'cr-ideias', 'aria-live':'polite'});
    function contarIdeias(){
      const precisa = IDEIAS_PRECISA(n);
      if(!precisa){ contagem.textContent = ''; return; }
      const tem = Math.max(0, frasesDoPedido(n.texto).length - 1);
      contagem.textContent = 'Depois do título: ' + tem + ' de ' + precisa + (precisa === 1 ? ' ideia' : ' ideias') + (tem >= precisa ? '.' : ' — falta' + (precisa - tem > 1 ? 'm ' : ' ') + (precisa - tem) + '.');
    }
    caixaTexto.appendChild(contagem);
    contarIdeias();

    if(n.tipo === 'guia'){
      const g = el('div',{class:'chips', role:'group', 'aria-label':'Páginas do guia'});
      [6, 8, 10, 12].forEach(q => g.appendChild(el('button',{class:'chip-p', type:'button', 'aria-pressed':String(n.paginas === q), onclick:()=>{ n.paginas = q; render(); }}, String(q))));
      campo('Páginas', g, 'A capa, uma ideia por página e o contato no fim: o guia de 8 páginas leva 6 ideias.');
    }
    if(n.tipo === 'cartaz'){
      const g = el('div',{class:'chips', role:'group', 'aria-label':'Tamanho do cartaz'});
      [['a4','A4'],['a3','A3']].forEach(([k, rot]) => g.appendChild(el('button',{class:'chip-p', type:'button', 'aria-pressed':String(n.folha === k), onclick:()=>{ n.folha = k; render(); }}, rot)));
      campo('Tamanho', g, 'A4 é a folha comum; A3 é o dobro, pra parede. Sai com 3 mm de sangria e marcas de corte.');
    }
    if(n.tipo === 'carrossel'){
      const g = el('div',{class:'chips'});
      [3,5,7,10].forEach(q => g.appendChild(el('button',{class:'chip-p', type:'button', 'aria-pressed':String(n.slides === q), onclick:()=>{ n.slides = q; render(); }}, String(q))));
      campo('Quantas imagens', g);
    }
    const escolhas = (rot, opcoes, chave) => {
      const g = el('div',{class:'chips'});
      opcoes.forEach(o => g.appendChild(el('button',{class:'chip-p', type:'button', 'aria-pressed':String(n[chave] === o),
        onclick:()=>{ n[chave] = n[chave] === o ? null : o; render(); }}, esc(o))));
      campo(rot, g);
    };
    escolhas('Pra que serve', ['Atrair gente nova','Vender','Ensinar algo','Contar uma novidade'], 'objetivo');
    escolhas('Jeito', ['Mais sério','Mais leve'], 'tom');
    const data = el('input',{type:'date', id:'cr-data', min: hojeIso()});
    data.value = n.data;
    data.addEventListener('input', ()=>{ n.data = data.value; });
    campo('Vai ao ar (se já souber)', data).querySelector('label').setAttribute('for', 'cr-data');

    function podePedir(){
      if(!n.cliente || n.texto.trim().length < 3 || c.pedindo) return false;
      if(n.tipo === 'reel') return !!(n.video && n.video.estado === 'pronto');
      if(n.tipo === 'carvideo') return !!n.deCarrossel;
      if(IDEIAS_PRECISA(n)) return frasesDoPedido(n.texto).length - 1 >= IDEIAS_PRECISA(n);
      return true;
    }
    const botao = el('button',{class:'btn', onclick:pedirCriar}, c.pedindo ? 'Pedindo…' : 'Pedir à fábrica');
    botao.disabled = !podePedir();
    const rodape = el('div',{class:'cr-acoes'});
    rodape.appendChild(botao);
    const d = el('p',{class:'dica'});
    d.textContent = t.midia === 'vídeo' ? 'Sai com prévia antes do vídeo inteiro. Vídeo do cliente: até 1 minuto e meio e 50 MB.'
      : n.tipo === 'folheto' ? 'Sai o PDF/X-4 pra gráfica, a prévia de cada lado e o editável (DesignCraft e IDML, que abre no InDesign).'
      : t.midia === 'páginas' ? 'Sai o PDF leve pra mandar no WhatsApp, uma prévia por página e o editável (DesignCraft e IDML).'
      : t.midia === 'impressão' ? 'Sai o PDF pra gráfica, uma imagem pro WhatsApp e o editável (VectorCraft e .ai).'
      : 'Sai em poucos minutos, com a legenda pronta. Você aprova antes do cliente ver como pronta.';
    rodape.appendChild(d);
    b.appendChild(rodape);
    return b;
  }

  // O vídeo do reel sobe assim que é escolhido; vai por XHR porque só ele conta
  // quanto já subiu. Pasta de envios do cliente, que o banco diz qual é.
  function campoVideoCriar(n){
    const w = el('div',{class:'cr-campo'});
    const l = el('label',{for:'cr-video'}); l.textContent = 'O vídeo que o cliente gravou'; w.appendChild(l);
    const inp = el('input',{type:'file', id:'cr-video', accept:'video/*'});
    inp.addEventListener('change', ()=>{ const f = inp.files && inp.files[0]; if(f) enviarVideoCriar(n, f); });
    w.appendChild(inp);
    const v = n.video;
    if(v){
      const p = el('p',{class: v.estado === 'erro' ? 'erro' : 'dica', id:'cr-envio', 'aria-live':'polite'});
      p.textContent = v.nome + ' · ' + (v.estado === 'enviando' ? 'enviando… ' + Math.round(v.progresso * 100) + '%' : v.estado === 'pronto' ? 'recebido' : v.erro);
      w.appendChild(p);
    }
    return w;
  }

  async function enviarVideoCriar(n, arquivo){
    const ext = (arquivo.name.split('.').pop() || '').toLowerCase();
    const mb = arquivo.size / 1048576;
    const v = n.video = { nome:arquivo.name, progresso:0, estado:'enviando', caminho:null, erro:null };
    const falhar = (t) => { v.estado = 'erro'; v.erro = t; render(); };
    if(!['mp4','mov','m4v','webm'].includes(ext)) return falhar('não parece um vídeo; mande em MP4 ou MOV');
    if(mb > LIMITE_VIDEO_MB) return falhar(Math.round(mb) + ' MB; o limite agora é ' + LIMITE_VIDEO_MB + ' MB');
    render();
    const [{ data:pasta, error }, { data:{ session } }] = await Promise.all([sb.rpc('pasta_de_envio', { p_cliente: n.cliente }), sb.auth.getSession()]);
    if(error || !session) return falhar(error ? error.message : 'sessão expirada; entre de novo');
    const caminho = pasta + '/bruto.' + ext;
    const xhr = new XMLHttpRequest();
    xhr.open('POST', SUPABASE_URL + '/storage/v1/object/pedidos/' + caminho);
    xhr.setRequestHeader('Authorization', 'Bearer ' + session.access_token);
    xhr.setRequestHeader('apikey', SUPABASE_KEY);
    xhr.setRequestHeader('x-upsert', 'false');
    xhr.setRequestHeader('Content-Type', arquivo.type || 'video/mp4');
    xhr.upload.onprogress = (e) => { if(e.lengthComputable){ v.progresso = e.loaded / e.total;
      const p = document.getElementById('cr-envio'); if(p) p.textContent = v.nome + ' · enviando… ' + Math.round(v.progresso * 100) + '%'; } };
    xhr.onload = () => { if(xhr.status >= 200 && xhr.status < 300){ v.estado = 'pronto'; v.caminho = caminho; render(); } else falhar('não subiu (' + xhr.status + ')'); };
    xhr.onerror = () => falhar('sem conexão');
    xhr.send(arquivo);
  }

  async function pedirCriar(){
    const c = C(), n = c.novo;
    const t = TIPOS_CRIAR.find(x => x.k === n.tipo);
    const briefing = { texto: n.texto.trim() };
    if(n.objetivo) briefing.objetivo = n.objetivo;
    if(n.tom) briefing.tom = n.tom;
    if(t.tipo === 'carrossel') briefing.slides = n.slides;
    if(t.formato) briefing.formato = t.formato;
    if(t.formato === 'bruto') briefing.anexo = n.video.caminho;
    if(t.formato === 'carrossel') briefing.de_pedido = n.deCarrossel;
    if(t.tipo === 'reel' && n.trilha) briefing.trilha = n.trilha;
    if(t.tipo === 'cartaz') briefing.folha = n.folha;
    if(n.tipo === 'guia') briefing.paginas = n.paginas;
    c.pedindo = true; render();
    const { data, error } = await sb.rpc('criar_pedido', { p_cliente: n.cliente, p_tipo: t.tipo, p_briefing: briefing,
      p_publicar_em: n.data ? new Date(n.data + 'T12:00:00').toISOString() : null });
    c.pedindo = false;
    if(error){ toast('Não deu: ' + error.message); render(); return; }
    c.novo = null; c.aba = 'pecas';
    await carregarPedidos();
    ir({tipo:'pedido', id:data});
  }

  // ---------- produzir o mês ----------
  // A pauta do Plano do mês vira pedidos de uma vez: um tema por linha, cada
  // um no formato que a equipe escolher, pela mesma fila e pela mesma fábrica.
  // O pedido guarda de que tema veio; tema que já virou pedido não sai de novo.

  // Só o que sai do texto do tema: o reel do vídeo gravado e o carrossel em
  // vídeo precisam de material, e esses se pedem em "Nova peça".
  const FORMATOS_LOTE = ['post', 'carrossel', 'capa', 'abertura', 'cartaz'];
  // Um palpite pelo texto do tema; a equipe troca na lista antes de mandar.
  const formatoSugerido = tema => /carross/i.test(tema) ? 'carrossel' : /\bcapa\b/i.test(tema) ? 'capa'
    : /\b(cartaz|panfleto|flyer|impress)/i.test(tema) ? 'cartaz'
    : /\b(reels?|v[ií]deo)\b/i.test(tema) ? 'abertura' : 'post';

  async function carregarLote(){
    const l = C().lote, cliente = l.cliente;
    l.carregando = true;
    const { data, error } = await sb.rpc('sugestoes_do_mes', { p_cliente: cliente });
    l.carregando = false;
    if(C().lote !== l) return;
    if(error){ l.erro = error.message; return; }
    l.temas = data || [];
    l.temas.forEach(t => {
      if(l.marcados[t.tema] == null) l.marcados[t.tema] = !t.pedido_id;
      if(!l.formatos[t.tema]) l.formatos[t.tema] = formatoSugerido(t.tema);
    });
  }

  function telaLote(){
    const c = C();
    if(!c.lote) c.lote = { cliente:'' };
    const l = c.lote;
    l.marcados = l.marcados || {}; l.formatos = l.formatos || {};
    const b = el('div',{class:'bloco'});
    const intro = el('p',{class:'dica', style:'margin-top:0'});
    intro.textContent = 'A pauta do Plano do mês vira peças de uma vez: marque os temas, escolha o formato de cada um e mande pra fábrica. '
      + 'Cada peça sai na marca do cliente e aparece em Peças.';
    b.appendChild(intro);

    const w = el('div',{class:'cr-campo'});
    const rot = el('label',{for:'lote-cliente'}); rot.textContent = 'Pra quem';
    const sel = el('select',{id:'lote-cliente'});
    sel.appendChild(el('option',{value:''}, 'Escolha o cliente'));
    state.clientes.forEach(x => { const o = el('option',{value:x.id}); o.textContent = x.nome; if(x.id === l.cliente) o.selected = true; sel.appendChild(o); });
    sel.addEventListener('change', ()=>{ c.lote = { cliente:sel.value }; render(); });
    w.appendChild(rot); w.appendChild(sel);
    b.appendChild(w);
    if(!l.cliente) return b;

    if(l.erro){ const e = el('p',{class:'erro'}); e.textContent = 'Não deu pra ler a pauta: ' + l.erro; b.appendChild(e); return b; }
    if(!l.temas){
      if(!l.carregando) carregarLote().then(render);
      b.appendChild(el('p',{class:'muted'}, 'Lendo a pauta…'));
      return b;
    }
    const abrirPlano = () => abrirCliente(l.cliente, 'plano');
    if(!l.temas.length){
      const v = el('div',{class:'vazio'});
      v.appendChild(el('p',{style:'margin:0 0 10px'}, 'Este cliente ainda não tem pauta neste mês. A pauta se escreve no Plano do mês, na ficha dele — um tema por linha.'));
      v.appendChild(el('button',{class:'btn small', onclick:abrirPlano}, 'Abrir o Plano do mês'));
      b.appendChild(v);
      return b;
    }

    const lista = el('div',{class:'lote-lista', role:'group', 'aria-label':'Temas da pauta'});
    l.temas.forEach(t => {
      const linha = el('div',{class:'lote-linha' + (t.pedido_id ? ' feito' : '')});
      const id = 'lote-tema-' + t.ordem;
      if(t.pedido_id){
        const tx = el('span',{class:'lote-tema'}); tx.textContent = t.tema;
        linha.appendChild(tx);
        linha.appendChild(el('button',{class:'btn ghost small', onclick:()=>ir({tipo:'pedido', id:t.pedido_id})}, 'Já virou pedido →'));
      } else {
        const ck = el('input',{type:'checkbox', id});
        ck.checked = !!l.marcados[t.tema];
        ck.disabled = !!l.pedindo;
        ck.addEventListener('change', ()=>{ l.marcados[t.tema] = ck.checked; render(); });
        const tx = el('label',{class:'lote-tema', for:id}); tx.textContent = t.tema;
        const fs = el('select',{'aria-label':'Formato'});
        fs.disabled = !!l.pedindo;
        FORMATOS_LOTE.forEach(k => { const tc = TIPOS_CRIAR.find(x => x.k === k);
          const o = el('option',{value:k}); o.textContent = tc.nome; if(l.formatos[t.tema] === k) o.selected = true; fs.appendChild(o); });
        fs.addEventListener('change', ()=>{ l.formatos[t.tema] = fs.value; render(); });
        linha.appendChild(ck); linha.appendChild(tx); linha.appendChild(fs);
      }
      lista.appendChild(linha);
    });
    b.appendChild(lista);

    if(l.falhas && l.falhas.length){
      const f = el('div',{class:'lote-falhas', role:'alert'});
      f.appendChild(el('p',{style:'margin:0 0 6px'}, '<b>Estes não foram:</b>'));
      l.falhas.forEach(x => { const p = el('p',{class:'erro', style:'margin:2px 0'}); p.textContent = x.tema + ' — ' + x.erro; f.appendChild(p); });
      b.appendChild(f);
    }

    // A música das aberturas do mês: uma escolha só pra todas.
    if(l.temas.some(t => !t.pedido_id && l.marcados[t.tema] && l.formatos[t.tema] === 'abertura')){
      const w = el('div',{class:'cr-campo'});
      const r = el('label',{for:'lote-musica'}); r.textContent = 'Música das aberturas';
      w.appendChild(r);
      w.appendChild(escolhaDeMusica(l.cliente, l.trilha || '', v => { l.trilha = v; }, 'lote-musica'));
      b.appendChild(w);
    }

    const rodape = el('div',{class:'cr-acoes'});
    const botao = el('button',{class:'btn', onclick:pedirLote});
    const escolhidos = () => l.temas.filter(t => !t.pedido_id && l.marcados[t.tema]);
    function contar(){
      const n = escolhidos().length;
      botao.textContent = l.pedindo ? 'Pedindo… ' + l.feitos + ' de ' + l.total
        : n === 1 ? 'Pedir 1 peça à fábrica' : 'Pedir ' + n + ' peças à fábrica';
      botao.disabled = !!l.pedindo || !n;
    }
    contar();
    rodape.appendChild(botao);
    rodape.appendChild(el('button',{class:'btn ghost small', onclick:abrirPlano}, 'Mudar a pauta'));
    b.appendChild(rodape);
    return b;
  }

  // Um pedido por vez, na ordem da pauta: se a fila encher no meio, o que já
  // foi fica feito e o resto espera, marcado, pra mandar depois.
  async function pedirLote(){
    const c = C(), l = c.lote;
    const temas = l.temas.filter(t => !t.pedido_id && l.marcados[t.tema]);
    if(!temas.length || l.pedindo) return;
    Object.assign(l, { pedindo:true, falhas:[], feitos:0, total:temas.length });
    render();
    for(const t of temas){
      const tc = TIPOS_CRIAR.find(x => x.k === l.formatos[t.tema]);
      const briefing = { texto: t.tema };
      if(tc.tipo === 'carrossel') briefing.slides = 5;
      if(tc.formato) briefing.formato = tc.formato;
      if(tc.tipo === 'reel' && l.trilha) briefing.trilha = l.trilha;
      const { error } = await sb.rpc('criar_pedido', { p_cliente: l.cliente, p_tipo: tc.tipo, p_briefing: briefing,
        p_origem_plano: t.plano_id, p_origem_tema: t.tema });
      if(error){
        l.falhas.push({ tema:t.tema, erro:error.message });
        if(error.code === '53400') break;
        continue;
      }
      l.feitos++;
      if(C().lote === l) render();
    }
    l.pedindo = false;
    const feitos = l.feitos;
    await carregarPedidos();
    if(feitos) toast(feitos === 1 ? '1 peça foi pra fábrica.' : feitos + ' peças foram pra fábrica.');
    if(!l.falhas.length){
      c.lote = null; c.aba = 'pecas'; c.cliente = l.cliente; c.filtro = 'todos';
    } else {
      l.temas = null;
    }
    render();
  }

  // ---------- o pedido aberto ----------

  function telaPedidoCriar(){
    const c = C();
    const p = c.pedidos.find(x => x.id === state.vista.id);
    const m = el('main');
    const volta = el('button',{class:'btn ghost small', onclick:()=>ir({tipo:'criar'})}, '← Peças');
    if(!p){
      m.appendChild(volta);
      if(!c.carregado) carregarPedidos().then(render);
      m.appendChild(el('div',{class:'vazio'}, c.carregado ? 'Não achamos esse pedido.' : 'Carregando…'));
      return m;
    }
    if(!c.eventos[p.id]) carregarEventosDe(p).then(render);
    const cli = state.clientes.find(x => x.id === p.cliente_id);
    const andamento = andamentoDe(p);
    const vista = versaoVistaDe(p);
    const ultimo = jobsDe(p).pop();
    const jaAprovado = ['aprovado','agendado','publicado'].includes(p.estado);

    const cab = el('div',{class:'bloco'});
    cab.appendChild(volta);
    const tt = el('div',{class:'fab-topo', style:'margin-top:14px'});
    const h = el('h1',{class:'page'}); h.textContent = p.titulo || tipoCriarDe(p).nome;
    tt.appendChild(h);
    const est = precisaDaEquipe(p) ? ['Precisa da equipe','alerta'] : p.assumido_por && p.estado === 'produzindo' ? ['Com a equipe','roxo']
      : [ESTADOS_PEDIDO[p.estado] || p.estado, COR_ESTADO[p.estado] || 'neutro'];
    const ch = el('span',{class:'chip ' + est[1]}); ch.textContent = est[0];
    tt.appendChild(ch);
    cab.appendChild(tt);
    const sub = el('p',{class:'muted'});
    sub.textContent = (cli ? cli.nome : '') + ' · ' + tipoCriarDe(p).nome + ' · ' + (p.pela_equipe ? 'pedido pela equipe' : 'pedido pelo cliente')
      + ' · ' + dataBR(p.criado_em) + (p.publicar_em ? ' · vai ao ar ' + dataBR(p.publicar_em) : '');
    cab.appendChild(sub);
    if(p.briefing && p.briefing.texto){ const q = el('p',{class:'cr-briefing'}); q.textContent = '“' + p.briefing.texto + '”'; cab.appendChild(q); }
    m.appendChild(cab);

    // Andamento, com quanto falta quando o render mede.
    if(andamento){
      const b = el('div',{class:'bloco'});
      const pct = Math.round(Number(andamento.progresso) || 0);
      const etapa = andamento.estado === 'na_fila' ? 'Esperando a vez' : (andamento.etapa || 'preparando');
      const e = el('p',{class:'cr-etapa', 'aria-live':'polite'}); e.textContent = etapa.charAt(0).toUpperCase() + etapa.slice(1);
      b.appendChild(e);
      const barra = el('div',{class:'barra', role:'progressbar', 'aria-valuemin':'0', 'aria-valuemax':'100', 'aria-valuenow':String(pct), 'aria-label':'Andamento'});
      barra.appendChild(el('i',{style:'width:' + Math.max(pct, 4) + '%'}));
      b.appendChild(barra);
      const f = el('p',{class:'dica'});
      f.textContent = (andamento.rodada === 'da_bora' ? 'Conferindo a versão da equipe. ' : '')
        + (andamento.restam_segundos != null ? (andamento.restam_segundos < 60 ? 'Falta menos de um minuto.' : 'Faltam uns ' + Math.max(2, Math.ceil(andamento.restam_segundos / 60)) + ' minutos.') : '')
        + ' Tentativa ' + (andamento.tentativas || 1) + ' de ' + andamento.max_tentativas + '.';
      b.appendChild(f);
      const pv = arquivoDe(andamento, 'previa.mp4');
      if(pv && c.urls[pv.caminho]){ b.appendChild(videoCriar(c.urls[pv.caminho], 'cr-video')); b.appendChild(el('p',{class:'dica'}, 'Prévia: o começo do vídeo.')); }
      else if(pv) garantirUrlsCriar().then(render);
      m.appendChild(b);
    } else if(precisaDaEquipe(p)){
      const b = el('div',{class:'bloco aviso-falhou'});
      const t2 = el('p'); t2.textContent = 'A fábrica tentou ' + (ultimo.tentativas || 3) + ' vezes e não passou na conferência. Edite à mão ou peça de novo com outro texto.';
      b.appendChild(t2);
      m.appendChild(b);
    }

    // A versão na tela: imagens, opções de capa ou vídeo.
    if(vista){
      const b = el('div',{class:'bloco'});
      const antiga = andamento && andamento.rodada !== 'producao';
      const reel = arquivoDe(vista, 'reel.mp4');
      const imgs = imagensDe(vista);
      if(reel){
        if(c.urls[reel.caminho]) b.appendChild(videoCriar(c.urls[reel.caminho], 'cr-video' + (antiga ? ' antiga' : '')));
      } else if(p.tipo === 'capa'){
        const marcada = jaAprovado ? p.escolha : c.escolha[p.id];
        const g = el('div',{class:'cr-opcoes'});
        imgs.forEach((s, i)=>{
          const num = i + 1;
          const op = el('button',{class:'cr-opcao', type:'button', 'aria-pressed':String(marcada === num),
            onclick:()=>{ c.escolha[p.id] = num; render(); }});
          // O el() desta página põe qualquer valor como atributo — até null — então disabled vai pela propriedade.
          op.disabled = p.estado !== 'para_aprovar';
          if(c.urls[s.caminho]) op.appendChild(el('img',{src:c.urls[s.caminho], alt:'Opção ' + num}));
          op.appendChild(el('span',{}, 'Opção ' + num + (jaAprovado && marcada === num ? ' · a escolhida' : '')));
          g.appendChild(op);
        });
        b.appendChild(g);
      } else {
        const g = el('div',{class:'cr-imagens' + (antiga ? ' antiga' : '')});
        imgs.forEach((s, i) => { if(c.urls[s.caminho]) g.appendChild(el('img',{src:c.urls[s.caminho], alt:'Imagem ' + (i + 1) + ' de ' + imgs.length})); });
        b.appendChild(g);
      }
      if(antiga) b.appendChild(el('p',{class:'dica'}, 'Versão anterior. A nova está sendo feita.'));
      const leg = arquivoDe(vista, 'legenda.txt'), legT = leg && c.textos[leg.caminho];
      if(legT){
        b.appendChild(el('p',{class:'rot', style:'margin-top:18px'}, p.tipo === 'capa' ? 'Descrição do vídeo' : 'Legenda'));
        const pre = el('p',{class:'cr-legenda'}); pre.textContent = legT.trim(); b.appendChild(pre);
        b.appendChild(el('button',{class:'btn ghost small', onclick:()=>{ navigator.clipboard.writeText(legT.trim()).then(()=>toast('Copiada.')); }}, 'Copiar'));
      }
      const tit = arquivoDe(vista, 'titulos.txt'), titT = tit && c.textos[tit.caminho];
      if(titT){ b.appendChild(el('p',{class:'rot', style:'margin-top:18px'}, 'Títulos pro vídeo'));
        titT.split('\n').map(x => x.trim()).filter(Boolean).forEach(x => { const l = el('p'); l.textContent = x; b.appendChild(l); }); }
      const versoes = prontosDe(p);
      if(versoes.length > 1){
        b.appendChild(el('p',{class:'rot', style:'margin-top:18px'}, 'Versões'));
        const vv = el('div',{class:'visao'});
        versoes.forEach((v, i) => vv.appendChild(el('button',{'aria-selected':String(v.id === vista.id), onclick:()=>{ c.versao[p.id] = v.id; render(); }},
          (v.rodada === 'da_bora' ? 'Equipe ' : 'Versão ') + (i + 1))));
        b.appendChild(vv);
      }
      m.appendChild(b);
    }

    // O que dá pra fazer agora.
    const acoes = el('div',{class:'bloco'});
    if(p.estado === 'para_aprovar' && !c.ajuste){
      const r = el('div',{class:'cr-acoes'});
      const capa = p.tipo === 'capa';
      const aprovar = el('button',{class:'btn', onclick:()=>aprovarCriar(p)},
        capa ? (c.escolha[p.id] ? 'Aprovar a opção ' + c.escolha[p.id] : 'Escolha uma opção') : 'Aprovar');
      aprovar.disabled = capa && !c.escolha[p.id];
      r.appendChild(aprovar);
      r.appendChild(el('button',{class:'btn ghost', onclick:()=>{ c.ajuste = { pedido:p.id, texto:'', atalhos:new Set() }; render(); }}, 'Pedir ajuste'));
      r.appendChild(el('button',{class:'btn ghost', onclick:()=>editarAMao(p)}, 'Editar à mão'));
      acoes.appendChild(r);
    }
    if(c.ajuste && c.ajuste.pedido === p.id) acoes.appendChild(formAjusteCriar(p));
    if(p.estado === 'produzindo' && !andamento && !p.assumido_por){
      acoes.appendChild(el('button',{class:'btn ghost', onclick:()=>editarAMao(p)}, 'Editar à mão'));
    }
    if(p.assumido_por && p.estado === 'produzindo') acoes.appendChild(painelEdicao(p, vista || ultimo, andamento));
    if(jaAprovado) acoes.appendChild(painelAprovado(p, vista));
    if(acoes.childNodes.length) m.appendChild(acoes);

    // O que aconteceu, com os erros de cada tentativa (o cliente só vê a parte dele).
    const ev = c.eventos[p.id] || [];
    if(ev.length){
      const b = el('div',{class:'bloco'});
      b.appendChild(el('p',{class:'rot'}, 'O que aconteceu'));
      const ol = el('ol',{class:'cr-historico'});
      ev.slice().reverse().forEach(e => { const li = el('li',{class: e.nivel === 'erro' ? 'erro' : ''});
        const hr = el('time'); hr.textContent = new Date(e.criado_em).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
        const tx = el('span'); tx.textContent = e.mensagem + (e.visivel_cliente ? '' : ' · só a equipe vê');
        li.appendChild(hr); li.appendChild(tx); ol.appendChild(li); });
      b.appendChild(ol);
      m.appendChild(b);
    }
    return m;
  }

  function formAjusteCriar(p){
    const c = C(), a = c.ajuste;
    const w = el('div',{class:'cr-ajuste'});
    w.appendChild(el('p',{class:'rot'}, 'O que mudar'));
    const g = el('div',{class:'chips'});
    ATALHOS_CRIAR(p.tipo).forEach(([k, rot]) => g.appendChild(el('button',{class:'chip-p', type:'button', 'aria-pressed':String(a.atalhos.has(k)),
      onclick:()=>{ a.atalhos.has(k) ? a.atalhos.delete(k) : a.atalhos.add(k); render(); }}, esc(rot))));
    w.appendChild(g);
    const t = el('textarea',{rows:'3', maxlength:'600', placeholder:'Ou com as suas palavras. Ex.: troca "turma" por "grupo".', 'aria-label':'O que mudar'});
    t.value = a.texto;
    t.addEventListener('input', ()=>{ a.texto = t.value; });
    w.appendChild(t);
    const d = el('p',{class:'dica'}); d.textContent = 'Sem o Claude, a fábrica aplica os atalhos; o texto livre fica registrado e, se precisar, edite à mão.'; w.appendChild(d);
    const r = el('div',{class:'cr-acoes'});
    r.appendChild(el('button',{class:'btn', onclick:async()=>{
      if(!a.atalhos.size && a.texto.trim().length < 3){ toast('Diga o que mudar, ou escolha um atalho.'); return; }
      const { error } = await sb.rpc('pedir_ajuste', { p_pedido: p.id, p_texto: a.texto.trim(), p_atalhos: [...a.atalhos] });
      if(error){ toast('Não deu: ' + error.message); return; }
      c.ajuste = null; delete c.versao[p.id];
      await carregarPedidos(); await carregarEventosDe(c.pedidos.find(x => x.id === p.id) || p); render();
      toast('Ajuste pedido. A nova versão aparece aqui.');
    }}, 'Enviar ajuste'));
    r.appendChild(el('button',{class:'btn ghost', onclick:()=>{ c.ajuste = null; render(); }}, 'Cancelar'));
    w.appendChild(r);
    return w;
  }

  async function aprovarCriar(p){
    const { error } = await sb.rpc('aprovar_pedido', { p_pedido: p.id, p_escolha: p.tipo === 'capa' ? C().escolha[p.id] : null });
    if(error){ toast('Não deu: ' + error.message); return; }
    await carregarPedidos(); render();
    toast('Aprovado.');
  }

  // Editar à mão: a fábrica para de mexer (o pedido é assumido) e a versão
  // corrigida sobe pela entrega da equipe, que passa pela mesma conferência.
  async function editarAMao(p){
    if(!confirm('Editar à mão? A fábrica para de mexer neste pedido e o cliente vê que a equipe está finalizando.')) return;
    const { error } = await sb.rpc('assumir_pedido', { p_pedido: p.id });
    if(error){ toast('Não deu: ' + error.message); return; }
    await carregarPedidos(); render();
  }

  function painelEdicao(p, versao, andamento){
    const c = C();
    const w = el('div',{class:'cr-edicao'});
    w.appendChild(el('p',{class:'rot laranja'}, 'Editar à mão'));
    if(andamento){ w.appendChild(el('p',{class:'dica'}, 'Conferindo a versão que você subiu…')); return w; }
    const ultimo = jobsDe(p).pop();
    if(ultimo && ultimo.rodada === 'da_bora' && ultimo.estado === 'falhou' && ultimo.erro){
      const e = el('p',{class:'erro'}); e.textContent = 'A última versão não passou: ' + ultimo.erro; w.appendChild(e);
    }
    const passo = (n, txt) => { const x = el('p',{class:'cr-passo'}); x.innerHTML = '<b>' + n + '.</b> '; x.appendChild(document.createTextNode(txt)); w.appendChild(x); };
    const comArquivo = jobsDe(p).slice().reverse().find(j => (j.saidas || []).length);
    passo(1, comArquivo ? 'Baixe os arquivos da última versão:' : 'Esta peça ainda não tem versão com arquivo. Monte do zero no app e suba com os nomes de entrega da peça.');
    if(comArquivo){
      const caminhos = saidasDe(comArquivo).map(s => s.caminho);
      const faltam = caminhos.filter(x => !c.urls[x]);
      if(faltam.length) garantirUrlsCriar(faltam).then(render);
      const l = el('div',{class:'fab-arquivos'});
      saidasDe(comArquivo).forEach(s=>{
        const nome = s.caminho.split('/').pop(), ext = nome.split('.').pop();
        if(!c.urls[s.caminho]) return;
        const a = el('a',{href:c.urls[s.caminho], download:nome, target:'_blank', rel:'noopener', class:'tag'});
        a.textContent = nome + (APP_DO_ARQUIVO[ext] ? ' · abre no ' + APP_DO_ARQUIVO[ext] : '');
        l.appendChild(a);
      });
      w.appendChild(l);
    }
    passo(2, 'Abra o editável no app da ArtCraft deste PC (PhotoCraft pra .psd, FilmCraft pra .fcproj, EffectCraft pra .ecproj, VectorCraft pra .vectorcraft, DesignCraft pra .designcraft, SoundCraft pro som.zip descompactado), corrija e exporte de novo.');
    passo(3, 'Suba todos os arquivos da entrega, com os mesmos nomes. Antes de chegar no cliente, passam pela conferência de marca.');
    if(c.enviando && c.enviando.pedido === p.id){
      const x = el('p',{class:'dica'}); x.textContent = 'Subindo ' + c.enviando.feitos + ' de ' + c.enviando.total + '…'; w.appendChild(x);
      return w;
    }
    const inp = el('input',{type:'file', multiple:'', id:'cr-entrega-' + p.id});
    const lab = el('label',{for:'cr-entrega-' + p.id, class:'muted'}, 'Arquivos corrigidos');
    w.appendChild(lab); w.appendChild(inp);
    w.appendChild(el('button',{class:'btn', onclick:()=>entregarCorrecao(p, [...inp.files])}, 'Entregar a versão corrigida'));
    return w;
  }

  /** Sobe a versão corrigida numa pasta da equipe dentro do pedido e manda conferir. */
  async function entregarCorrecao(p, arquivos){
    const c = C();
    const cli = state.clientes.find(x => x.id === p.cliente_id);
    if(!cli || !arquivos.length){ toast('Escolha os arquivos.'); return; }
    const pasta = cli.conta_id + '/' + p.cliente_id + '/' + p.id + '/bora/' + crypto.randomUUID();
    c.enviando = { pedido:p.id, feitos:0, total:arquivos.length };
    render();
    for(const a of arquivos){
      const { error } = await sb.storage.from('pedidos').upload(pasta + '/' + a.name, a, { contentType: a.type || undefined });
      if(error){ c.enviando = null; toast('Não subiu ' + a.name + ': ' + error.message); render(); return; }
      c.enviando.feitos++; render();
    }
    const { error } = await sb.rpc('entregar_pela_bora', { p_pedido: p.id, p_pasta: pasta });
    c.enviando = null;
    if(error){ toast('Não deu: ' + error.message); render(); return; }
    toast('Enviado. A fábrica confere e, passando, vai pro cliente aprovar.');
    await carregarPedidos(); render();
  }
