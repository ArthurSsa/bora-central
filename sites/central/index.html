<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central Bora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --black:#0A0A0A; --white:#FFF; --orange:#FF5E00; --purple:#8800FF;
    --gray:#6E6E6E; --line:#E2E2E2; --bg:#FAFAFA; --soft:#F2F2F2;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--black);
    font-family:'Archivo',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:'Archivo',sans-serif; font-size:0.9rem; }
  .mono{ font-family:'Space Mono',monospace; }
  .grotesk{ font-family:'Space Grotesk',sans-serif; }

  .topbar{
    background:var(--black); color:var(--white);
    padding:0 20px; height:56px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:20;
  }
  .topbar .brand{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:0.95rem;
    letter-spacing:0.08em; text-transform:uppercase; display:flex; align-items:center; gap:9px;
  }
  .topbar .brand .dot{ width:9px; height:9px; background:var(--orange); display:inline-block; }
  .topbar .who{ font-family:'Space Mono',monospace; font-size:0.72rem; color:#B5B5B5; display:flex; align-items:center; gap:14px; }
  .linkbtn{ background:none; border:none; color:var(--orange); font-size:0.72rem; font-family:'Space Mono',monospace; padding:0; text-decoration:underline; }

  .shell{ display:grid; grid-template-columns:288px 1fr; min-height:calc(100vh - 56px); }
  @media (max-width:860px){ .shell{ grid-template-columns:1fr; } .side{ border-right:none !important; border-bottom:2px solid var(--black); } }

  .side{ border-right:2px solid var(--black); background:var(--white); min-height:calc(100vh - 56px); padding:18px 0 40px; }
  .side h4{
    font-family:'Space Mono',monospace; font-size:0.66rem; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--gray); margin:22px 18px 8px; display:flex; justify-content:space-between; align-items:center;
  }
  .side h4:first-child{ margin-top:0; }
  .pill{ background:var(--orange); color:#fff; font-size:0.62rem; padding:2px 6px; letter-spacing:0.04em; }
  .navitem{
    display:block; width:100%; text-align:left; background:none; border:none;
    padding:9px 18px; font-size:0.92rem; border-left:3px solid transparent; line-height:1.35;
  }
  .navitem:hover{ background:var(--soft); }
  .navitem.active{ border-left-color:var(--orange); background:var(--soft); font-weight:600; }
  .navitem .sub{ display:block; font-family:'Space Mono',monospace; font-size:0.64rem; color:var(--gray); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px; }
  .side .act{ margin:12px 18px 0; }

  main{ padding:26px 30px 80px; max-width:1000px; }
  h1.page{ font-family:'Space Grotesk',sans-serif; font-size:1.7rem; margin:0 0 4px; letter-spacing:-0.01em; }
  .eyebrow{ font-family:'Space Mono',monospace; font-size:0.66rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--orange); margin:0 0 10px; }
  .muted{ color:var(--gray); font-size:0.9rem; }

  .tabs{ display:flex; gap:2px; flex-wrap:wrap; border-bottom:2px solid var(--black); margin:22px 0 0; }
  .tab{
    background:none; border:2px solid transparent; border-bottom:none; padding:8px 14px;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:0.84rem; color:var(--gray);
    margin-bottom:-2px;
  }
  .tab.active{ border-color:var(--black); background:var(--white); color:var(--black); }

  .panel{ background:var(--white); border:2px solid var(--black); border-top:none; padding:22px; }

  .card{ background:var(--white); border:2px solid var(--black); padding:18px; margin-bottom:16px; }
  .card.flat{ border-width:1px; border-color:var(--line); }

  table{ width:100%; border-collapse:collapse; font-size:0.88rem; }
  th{ text-align:left; font-family:'Space Mono',monospace; font-size:0.64rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--gray); padding:0 10px 7px 0; border-bottom:1px solid var(--line); font-weight:400; white-space:nowrap; }
  td{ padding:9px 10px 9px 0; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.45; }
  tr:last-child td{ border-bottom:none; }
  .wrap{ overflow-x:auto; }

  .btn{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:0.82rem;
    padding:9px 15px; border:2px solid var(--black); background:var(--black); color:#fff;
  }
  .btn:hover{ background:var(--orange); border-color:var(--orange); }
  .btn.ghost{ background:transparent; color:var(--black); }
  .btn.ghost:hover{ background:var(--black); color:#fff; }
  .btn.small{ font-size:0.72rem; padding:6px 10px; border-width:1.5px; }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }
  *:focus-visible{ outline:3px solid var(--purple); outline-offset:1px; }

  .field{ margin-bottom:12px; }
  .field label{ display:block; font-family:'Space Mono',monospace; font-size:0.64rem; letter-spacing:0.09em; text-transform:uppercase; color:var(--gray); margin-bottom:4px; }
  .field input, .field select, .field textarea{
    width:100%; padding:8px 9px; border:1.5px solid var(--black); background:#fff;
  }
  .field textarea{ min-height:64px; resize:vertical; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  .grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 14px; }
  @media (max-width:640px){ .grid2,.grid3{ grid-template-columns:1fr; } }

  .tag{ font-family:'Space Mono',monospace; font-size:0.62rem; text-transform:uppercase; letter-spacing:0.07em; padding:3px 7px; border:1px solid var(--black); }
  .tag.on{ background:var(--orange); color:#fff; border-color:var(--orange); }
  .tag.off{ background:#fff; color:var(--gray); border-color:var(--line); }
  .tag.roxo{ background:var(--purple); color:#fff; border-color:var(--purple); }

  /* Cores de estado. Separadas do laranja e do roxo da marca de propósito:
     laranja é "olha aqui" e roxo é "isso é do cliente"; estado é outra coisa. */
  .chip{
    display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
    font-size:0.74rem; font-weight:600; padding:3px 9px 3px 7px; border-radius:2px;
    border:1px solid transparent; line-height:1.3;
  }
  .chip::before{ content:''; width:7px; height:7px; border-radius:50%; background:currentColor; flex:0 0 auto; }
  .chip.ok{      background:#E7F4EC; color:#0E6B3D; border-color:#BFE0CD; }
  .chip.alerta{  background:#FBEAE7; color:#A93226; border-color:#F0CCC6; }
  .chip.espera{  background:#FCF2DF; color:#8A5A05; border-color:#EEDCB4; }
  .chip.andamento{ background:#E7EEF8; color:#1B4F8F; border-color:#C6D8EE; }
  .chip.neutro{  background:#F1F0EE; color:#5F5B57; border-color:#E0DEDA; }
  .chip.roxo{    background:#F2E8FF; color:#6A00C7; border-color:#DFC9F7; }

  /* Termômetro de onboarding */
  .termo{ border:2px solid var(--black); background:var(--white); margin-top:18px; }
  .termo .topo{
    display:flex; justify-content:space-between; align-items:baseline; gap:14px; flex-wrap:wrap;
    padding:14px 16px 12px; border-bottom:1px solid var(--line);
  }
  .termo .topo .quanto{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.05rem; }
  .barra{ height:6px; background:var(--soft); display:flex; }
  .barra i{ display:block; background:var(--orange); }
  .etapas{ display:grid; grid-template-columns:repeat(6,1fr); }
  @media (max-width:820px){ .etapas{ grid-template-columns:repeat(3,1fr); } }
  @media (max-width:480px){ .etapas{ grid-template-columns:repeat(2,1fr); } }
  .etapa{
    background:none; border:none; border-right:1px solid var(--line); border-top:1px solid var(--line);
    padding:12px 12px 14px; text-align:left; display:block; width:100%;
  }
  .etapa:hover{ background:var(--soft); }
  .etapa .n{
    font-family:'Space Mono',monospace; font-size:0.62rem; letter-spacing:0.1em;
    display:flex; align-items:center; gap:6px; color:var(--gray); margin-bottom:6px;
  }
  .etapa .bola{ width:12px; height:12px; border:2px solid var(--line); border-radius:50%; flex:0 0 auto; }
  .etapa.feito .bola{ background:#0E6B3D; border-color:#0E6B3D; }
  .etapa.meio .bola{ background:linear-gradient(90deg,#B8860B 50%, #fff 50%); border-color:#B8860B; }
  .etapa.falta .bola{ background:#fff; border-color:#D6D2CD; }
  .etapa .rot{ font-size:0.82rem; font-weight:600; line-height:1.25; }
  .etapa.falta .rot{ color:var(--gray); font-weight:500; }
  .etapa .sub{ font-family:'Space Mono',monospace; font-size:0.62rem; color:var(--gray); margin-top:3px; display:block; }

  /* Cabeçalho explicativo de cada aba */
  .expl{ display:flex; gap:12px; align-items:flex-start; margin:0 0 20px; padding-bottom:16px; border-bottom:1px solid var(--line); }
  .expl .marca{ width:4px; align-self:stretch; background:var(--orange); flex:0 0 auto; }
  .expl h3{ font-family:'Space Grotesk',sans-serif; font-size:1.02rem; margin:0 0 3px; }
  .expl p{ margin:0; font-size:0.87rem; color:var(--gray); line-height:1.5; max-width:66ch; }
  .expl .quando{ display:block; margin-top:6px; font-family:'Space Mono',monospace; font-size:0.64rem; letter-spacing:0.07em; text-transform:uppercase; color:var(--black); }

  /* Resumos numéricos no topo das abas */
  .placares{ display:flex; gap:10px; flex-wrap:wrap; margin:0 0 20px; }
  .placares .p{ border:1px solid var(--line); padding:9px 13px; min-width:96px; }
  .placares .p b{ font-family:'Space Grotesk',sans-serif; font-size:1.35rem; display:block; line-height:1.05; }
  .placares .p span{ font-family:'Space Mono',monospace; font-size:0.6rem; letter-spacing:0.09em; text-transform:uppercase; color:var(--gray); }
  .placares .p.destaca{ border-color:var(--black); border-width:2px; }

  .minibarra{ height:5px; background:var(--soft); margin-top:7px; width:100%; }
  .minibarra i{ display:block; height:100%; background:#0E6B3D; }

  .dica{ display:block; font-size:0.76rem; color:var(--gray); line-height:1.4; margin-top:4px; }
  td .forte{ font-weight:600; }
  .vazio strong{ display:block; font-family:'Space Grotesk',sans-serif; color:var(--black); font-size:0.98rem; margin-bottom:5px; }

  .qa{ margin-bottom:16px; padding-left:13px; border-left:2.5px solid var(--orange); }
  .qa.vazia{ border-left-color:var(--line); }
  .qa .q{ font-size:0.8rem; color:var(--gray); margin-bottom:3px; line-height:1.35; }
  .qa .a{ font-size:0.98rem; white-space:pre-wrap; line-height:1.5; }
  .qa.vazia .a{ color:#BFBFBF; font-style:italic; }
  .secname{ font-family:'Space Mono',monospace; font-size:0.66rem; letter-spacing:0.11em; text-transform:uppercase; color:var(--orange); border-bottom:2px solid var(--black); padding-bottom:5px; margin:26px 0 14px; }
  .secname:first-child{ margin-top:0; }

  .login{ max-width:380px; margin:9vh auto; background:#fff; border:2px solid var(--black); box-shadow:9px 9px 0 var(--orange); padding:32px; }
  .erro{ background:#FFF1EA; border-left:3px solid var(--orange); padding:10px 12px; font-size:0.85rem; margin:12px 0; }
  .vazio{ padding:26px; text-align:center; color:var(--gray); font-size:0.9rem; border:1px dashed var(--line); }

  /* Agora: uma pendência por linha, clicável, a urgência na barra da esquerda */
  .pend{
    display:block; width:100%; text-align:left; background:#fff; border:1.5px solid var(--line);
    border-left-width:5px; padding:12px 14px; margin-bottom:8px; line-height:1.4;
  }
  .pend:hover{ background:var(--soft); border-color:var(--black); }
  .pend.alta{ border-left-color:var(--orange); }
  .pend.media{ border-left-color:var(--purple); }
  .pend.baixa{ border-left-color:var(--line); }
  .pend .quem{ font-family:'Space Mono',monospace; font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--gray); }
  .pend .oq{ font-size:0.96rem; font-weight:600; margin-top:2px; }
  .pend .porq{ font-size:0.84rem; color:var(--gray); margin-top:3px; }
  .placar{ display:flex; gap:10px; flex-wrap:wrap; margin:18px 0 6px; }
  .placar .n{ border:2px solid var(--black); padding:10px 14px; min-width:104px; }
  .placar .n b{ font-family:'Space Grotesk',sans-serif; font-size:1.5rem; display:block; line-height:1; }
  .placar .n span{ font-family:'Space Mono',monospace; font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--gray); }
  .placar .n.alta{ border-color:var(--orange); }
  .placar .n.media{ border-color:var(--purple); }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%,16px);
    background:var(--black); color:#fff; padding:11px 20px; border:2px solid var(--orange);
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:0.85rem;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  const SUPABASE_URL = 'https://yxewmauwnxnrrhevlbtc.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_G_FuzadzmX2BwkRO81H3mw_xoYnthod';

  // Mesma estrutura do formulário "Conhecendo Você(s) e Seu Trabalho".
  // Existe aqui para o painel mostrar cada resposta com a pergunta que a gerou.
  const SECOES = [
    { titulo:'Sobre você(s)', perguntas:[
      ['nome_pref','Como você(s) prefere ser chamado(a)?'],
      ['tempo_trabalho','Há quanto tempo você(s) faz esse trabalho?'],

    { titulo:'Sobre o trabalho de vocês', perguntas:[
      ['o_que_faz','Em poucas palavras, o que você(s) faz ou oferece?'],
      ['cliente_ideal','Como é o cliente ideal de vocês?'],
      ['faz_procurar','O que geralmente faz alguém procurar você(s)?'],
      ['diferencial','O que diferencia você(s) de outras pessoas que fazem algo parecido?'],
      ['como_encontram','Como as pessoas encontram você(s) hoje?'],
      ['entrega_orgulho','Qual foi um resultado ou entrega que deixou você(s) mais orgulhoso(a)?'],

    { titulo:'Sobre público e valores', perguntas:[
      ['preco_atual','Quanto você(s) cobra hoje pelo que faz?'],
      ['forma_precificacao','Como você(s) decide o preço de um produto ou serviço?'],
      ['ticket_medio','Qual costuma ser o ticket médio dos clientes de vocês?'],
      ['forma_pagamento','Existe alguma forma de pagamento ou parcelamento que você(s) oferece hoje?'],
      ['percepcao_preco','Na percepção de vocês, o preço cobrado é justo, está abaixo ou acima do mercado?'],
      ['cliente_mais_lucro','Que tipo de cliente costuma pagar mais ou dar mais lucro pra você(s)?'],

    { titulo:'Olhando pra frente', perguntas:[
      ['visao_futuro','Se pudesse escolher, como seria o trabalho de vocês daqui a 2 anos?'],
      ['sonho_maior','Existe algum sonho maior por trás desse trabalho, além do dinheiro?'],
      ['ajuda_esperada','O que você(s) imagina que a gente poderia ajudar a alcançar?'],
      ['referencia_inspiracao','Tem alguma referência (pessoa, marca, estilo) que inspira você(s) profissionalmente?'],
      ['espaco_livre','Tem mais alguma coisa que você(s) queira contar sobre você(s) ou o trabalho de vocês?'],
    ]},
  ];

  // Cada aba carrega a explicação do que ela é. Painel sem isso vira sete tabelas
  // iguais, e quem abre não sabe por onde começar nem por que aquilo existe.
  const ABAS = [
    ['respostas','Respostas', 'O que eles escreveram no formulário',
      'A matéria-prima de todo o resto. Baseline, metas e conteúdo saem daqui — quando tiver dúvida do que fazer, releia isto.',
      'Chega sozinho quando alguém envia o formulário'],
    ['acessos','Acessos', 'Quais contas já estão na nossa mão',
      'É o que mais trava onboarding de agência, e trava por um motivo bobo: ninguém sabe quem detém o quê. Costuma estar com um sobrinho, um ex-funcionário ou a agência anterior.',
      'Preencher no primeiro dia, junto com o contrato'],
    ['metas','Metas', 'O que perseguimos, escrito antes de começar',
      'O campo "o que contaria como fracasso" é o coração da aba. Sem ele, qualquer número do dia 90 vira história contada a favor de quem fez o trabalho.',
      'Preencher no kickoff, antes de publicar qualquer coisa'],
    ['baseline','Baseline', 'De onde estamos saindo, congelado',
      'Números anotados antes de mexermos em nada, com a limitação de cada um declarada na hora. Depois não dá para congelar: o que passou, passou.',
      'Preencher antes da primeira publicação'],
    ['marcos','Marcos', 'A ordem das coisas, com data e dono',
      'Três a cinco marcos, cada um com data e com quem é responsável. Os que forem do cliente aparecem na página que ele lê.',
      'Preencher no kickoff'],
    ['conformidade','Conformidade', 'O que pode e o que não pode ser publicado',
      'Profissão regulada tem regra de publicação. Aprovação registrada, com quem aprovou e quando, é o que protege a agência e o cliente.',
      'Preencher antes da primeira peça sair'],
    ['horas','Horas', 'Quanto custa entregar um mês',
      'Medido, não estimado. É o número que falta para o preço deixar de ser opinião — e para saber o que vale a pena automatizar.',
      'Lançar toda semana, senão vira chute'],
    ['pagina','Página do cliente', 'O plano de 90 dias que o cliente lê',
      'Monta com os dados desta ficha a página que vira relatório no dia 90. Baixa um arquivo pronto para publicar.',
      'Gerar depois do kickoff, e de novo nos dias 30, 60 e 90'],
  ];

  // Tradução do banco para português. O painel nunca mostra o valor cru:
  // "nao_conforme" não diz nada a quem abre o painel às sete da manhã.
  const ROTULOS = {
    acessos_status: {
      pendente:      ['Ainda não pedimos','espera'],
      solicitado:    ['Pedimos, esperando','andamento'],
      recebido:      ['Na nossa mão','ok'],
      bloqueado:     ['Travado','alerta'],
      nao_aplicavel: ['Não se aplica','neutro'],
    },
    conformidade_status: {
      pendente:      ['Sem veredito','espera'],
      conforme:      ['Pode publicar','ok'],
      nao_conforme:  ['Não pode publicar','alerta'],
      nao_aplicavel: ['Não se aplica','neutro'],

    metas_tipo: {

      resultado:   ['Resultado','neutro'],
    },
    marcos_responsavel: {
      bora:    ['Nós','neutro'],
      cliente: ['Cliente','roxo'],
    },
    estagio: {
      prospect:   ['Ainda não assinou','neutro'],
      onboarding: ['Primeiros 90 dias','andamento'],
      ativo:      ['Em andamento','ok'],
      pausado:    ['Pausado','espera'],
      encerrado:  ['Encerrado','neutro'],
    },
    baselines_fonte: {
      perfil_empresa:'Perfil da Empresa (Google)', instagram:'Instagram', whatsapp:'WhatsApp',
      site:'Site', negocio:'Do próprio negócio', outro:'Outra fonte',
    },
    horas_categoria: {
      coleta:'Coleta de dados', relatorio:'Relatório', conteudo:'Conteúdo', reuniao:'Reunião',
      conformidade:'Conformidade', comercial:'Comercial', admin:'Administrativo', outro:'Outro',
    },
  };

  const rotulo = (grupo, valor) => {
    const g = ROTULOS[grupo] || {};
    const r = g[valor];
    if(!r) return valor || '—';
    return Array.isArray(r) ? r[0] : r;
  };
  const corDe = (grupo, valor) => {
    const r = (ROTULOS[grupo] || {})[valor];
    return Array.isArray(r) ? r[1] : 'neutro';
  };
  // Devolve o HTML de um chip já escapado.
  const chip = (grupo, valor) =>
    '<span class="chip '+corDe(grupo,valor)+'">'+esc(rotulo(grupo,valor))+'</span>';
  // Opções de select no formato [valor, rótulo], para o banco continuar recebendo o enum.
  const opcoesDe = grupo => Object.keys(ROTULOS[grupo]).map(k => [k, rotulo(grupo,k)]);

  // Lista padrão de acessos. Existe para ninguém descobrir no dia 20 que faltava um.
  const ACESSOS_PADRAO = [
    'Perfil da Empresa (Google)',
    'Instagram',
    'WhatsApp comercial',
    'Site e hospedagem',
    'Domínio e DNS',
    'Meta Business Suite',
    'Google Analytics',
    'Banco de fotos e material de marca',
  ];

  const ESTAGIOS = ['prospect','onboarding','ativo','pausado','encerrado'];

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const state = {
    user:null, membro:false, carregando:true,
    clientes:[], inbox:[], vista:{ tipo:'agora' }, aba:'respostas',
    detalhe:{ onboarding:null, metas:[], baselines:[], marcos:[], conformidade:[], horas:[], acessos:[] },
    erro:null, modoLogin:'link', linkEnviadoPara:null, editandoPV:false,
    tudo:{ acessos:[], metas:[], baselines:[], marcos:[], conformidade:[], horas:[] },
  };

  const app = document.getElementById('app');
  const el = (t, a, h) => { const n=document.createElement(t); if(a) for(const k in a){ if(k==='class') n.className=a[k]; else if(k.startsWith('on')) n.addEventListener(k.slice(2), a[k]); else n.setAttribute(k, a[k]); } if(h!==undefined) n.innerHTML=h; return n; };
  const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  let toastTimer;
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2800);
  }

  const dataBR = s => { if(!s) return '—'; const d = new Date(s); return isNaN(d) ? s : d.toLocaleDateString('pt-BR'); };
  const soData = s => s ? String(s).slice(0,10).split('-').reverse().join('/') : '—';

  // ---------- dados ----------

  async function carregarTudo(){
    state.erro = null;
    // As seis tabelas vêm inteiras, sem filtro de cliente: é o que a tela Agora
    // precisa pra cruzar tudo. São dezenas de linhas no total, não milhares —
    // no dia em que forem, isso vira uma view no banco, não mais selects aqui.
    const [cli, inbox, ac, me, ba, ma, co, ho] = await Promise.all([
      sb.from('clientes').select('*').order('nome'),
      sb.from('onboarding_respostas').select('*').is('cliente_id', null).order('recebido_em', { ascending:false }),
      sb.from('acessos').select('*'),
      sb.from('metas').select('*'),
      sb.from('baselines').select('*'),
      sb.from('marcos').select('*'),
      sb.from('conformidade_itens').select('*'),
      sb.from('horas').select('*'),
    ]);
    if(cli.error) state.erro = cli.error.message;
    state.clientes = cli.data || [];
    state.inbox = inbox.data || [];
    state.tudo = {
      acessos: ac.data || [], metas: me.data || [], baselines: ba.data || [],
      marcos: ma.data || [], conformidade: co.data || [], horas: ho.data || [],
    };
  }

  async function carregarDetalhe(clienteId){
    const d = state.detalhe;
    const [on, me, ba, ma, co, ho, ac] = await Promise.all([
      sb.from('onboarding_respostas').select('*').eq('cliente_id', clienteId).order('recebido_em',{ascending:false}).limit(1),
      sb.from('metas').select('*').eq('cliente_id', clienteId).order('registrado_em'),
      sb.from('baselines').select('*').eq('cliente_id', clienteId).order('congelado_em'),
      sb.from('marcos').select('*').eq('cliente_id', clienteId).order('ordem').order('data_prevista'),
      sb.from('conformidade_itens').select('*').eq('cliente_id', clienteId).order('norma'),
      sb.from('horas').select('*').eq('cliente_id', clienteId).order('data',{ascending:false}),
      sb.from('acessos').select('*').eq('cliente_id', clienteId).order('ordem').order('recurso'),
    ]);
    d.onboarding = (on.data && on.data[0]) || null;
    d.metas = me.data || []; d.baselines = ba.data || []; d.marcos = ma.data || [];
    d.conformidade = co.data || []; d.horas = ho.data || []; d.acessos = ac.data || [];
  }

  async function inserir(tabela, linha){
    const { error } = await sb.from(tabela).insert(linha);
    if(error){ toast('Não deu: ' + error.message); return false; }
    toast('Salvo.');
    return true;
  }

  async function atualizar(tabela, id, campos){
    const { error } = await sb.from(tabela).update(campos).eq('id', id);
    if(error){ toast('Não deu: ' + error.message); return false; }
    return true;
  }

  async function apagar(tabela, id){
    const { error } = await sb.from(tabela).delete().eq('id', id);
    if(error){ toast('Não deu: ' + error.message); return false; }
    toast('Removido.');
    return true;
  }

  // ---------- render ----------

  function render(){
    app.innerHTML = '';
    if(state.carregando){ app.appendChild(el('div',{class:'vazio'},'Carregando…')); return; }
    if(!state.user){ app.appendChild(telaLogin()); return; }
    app.appendChild(topbar());
    if(!state.membro){ app.appendChild(telaSemAcesso()); return; }
    const shell = el('div',{class:'shell'});
    shell.appendChild(lateral());
    shell.appendChild(conteudo());
    app.appendChild(shell);
  }

  function topbar(){
    const bar = el('div',{class:'topbar'});
    bar.appendChild(el('span',{class:'brand'},'<span class="dot"></span>Central Bora'));
    const who = el('div',{class:'who'});
    who.appendChild(el('span',{},esc(state.user.email)));
    who.appendChild(el('button',{class:'linkbtn', onclick:sair},'sair'));
    bar.appendChild(who);
    return bar;
  }

  function telaLogin(){
    const box = el('div',{class:'login'});
    box.appendChild(el('p',{class:'eyebrow'},'Uso interno da Bora Postar'));
    box.appendChild(el('h1',{class:'page'},'Central Bora'));

    // Confirmação depois de enviar o link
    if(state.linkEnviadoPara){
      box.appendChild(el('p',{class:'muted'},
        'Link enviado para <strong>'+esc(state.linkEnviadoPara)+'</strong>. Abra o e-mail e clique nele — você volta pra cá já conectado. O link vale por 1 hora e serve uma vez só.'));
      const acoes = el('div',{style:'margin-top:18px;display:flex;gap:10px;flex-wrap:wrap'});
      acoes.appendChild(el('button',{class:'btn ghost small', onclick:()=>{ state.linkEnviadoPara=null; state.erro=null; render(); }},'Usar outro e-mail'));
      box.appendChild(acoes);
      return box;
    }

    const porSenha = state.modoLogin === 'senha';
    box.appendChild(el('p',{class:'muted'}, porSenha
      ? 'Entre com a senha da sua conta do Supabase.'
      : 'Digite seu e-mail que a gente manda um link de acesso. Sem senha pra lembrar nem pra compartilhar.'));

    const form = el('form');
    form.appendChild(campo('E-mail','email','email'));
    if(porSenha) form.appendChild(campo('Senha','senha','password'));
    if(state.erro) form.appendChild(el('div',{class:'erro'}, esc(state.erro)));

    const btn = el('button',{class:'btn', type:'submit'}, porSenha ? 'Entrar' : 'Enviar link de acesso');
    form.appendChild(btn);

    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const email = form.querySelector('[name=email]').value.trim();
      if(!email){ state.erro = 'Falta o e-mail.'; render(); return; }
      btn.disabled = true;
      state.erro = null;

      if(porSenha){
        btn.textContent = 'Entrando…';
        const password = form.querySelector('[name=senha]').value;
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if(error){ state.erro = 'E-mail ou senha não conferem.'; render(); return; }
        await iniciarSessao();
        return;
      }

      btn.textContent = 'Enviando…';
      // shouldCreateUser: false — só entra quem já foi criado no Supabase.
      // Sem isso, qualquer pessoa criaria conta neste projeto, que é o mesmo do app.
      const { error } = await sb.auth.signInWithOtp({
        email,
        options: { shouldCreateUser: false, emailRedirectTo: window.location.origin },
      });
      if(error){
        const m = (error.message || '').toLowerCase();
        if(m.includes('not allowed') || m.includes('signups')){
          state.erro = 'Não existe conta com esse e-mail. Peça pra criarem a sua no Supabase antes.';
        } else if(m.includes('rate') || m.includes('limit') || m.includes('seconds')){
          state.erro = 'Muitos pedidos seguidos. Espere alguns minutos e tente de novo.';
        } else {
          state.erro = 'Não deu pra enviar o link agora: ' + error.message;
        }
        render();
        return;
      }
      state.linkEnviadoPara = email;
      render();
    });

    box.appendChild(form);

    const alt = el('p',{style:'margin:18px 0 0'});
    alt.appendChild(el('button',{class:'linkbtn', type:'button', style:'color:#6E6E6E',
      onclick:()=>{ state.modoLogin = porSenha ? 'link' : 'senha'; state.erro=null; render(); }},
      porSenha ? 'voltar pro link por e-mail' : 'entrar com senha'));
    box.appendChild(alt);
    return box;
  }

  function campo(rot, nome, tipo, valor, dica){
    const f = el('div',{class:'field'});
    f.appendChild(el('label',{for:'f_'+nome},esc(rot)));
    f.appendChild(el('input',{id:'f_'+nome, name:nome, type:tipo||'text', value:valor==null?'':valor}));
    if(dica) f.appendChild(el('span',{class:'dica'}, esc(dica)));
    return f;
  }

  function telaSemAcesso(){
    const m = el('main');
    m.appendChild(el('p',{class:'eyebrow'},'Acesso'));
    m.appendChild(el('h1',{class:'page'},'Esta conta não é da agência'));
    m.appendChild(el('p',{class:'muted'},'A Central é restrita a quem tem <code>is_agency</code> marcado no perfil. Se você deveria estar aqui, peça pra marcarem sua conta.'));
    m.appendChild(el('p',{},'')).appendChild(el('button',{class:'btn ghost', onclick:sair},'Sair'));
    return m;
  }

  function lateral(){
    const s = el('div',{class:'side'});

    const pend = pendencias();
    const altas = pend.filter(p => p.urgencia === 'alta').length;
    s.appendChild(el('h4',{},'Painel'));
    const ba = el('button',{class:'navitem'+(state.vista.tipo==='agora'?' active':''), onclick:()=>{ state.vista={tipo:'agora'}; render(); }});
    ba.innerHTML = 'Agora<span class="sub">'+(pend.length
      ? (altas ? altas+' urgente'+(altas===1?'':'s')+' de '+pend.length : pend.length+' em aberto')
      : 'nada em aberto')+'</span>';
    s.appendChild(ba);

    const h1 = el('h4',{},'Caixa de entrada');
    if(state.inbox.length) h1.appendChild(el('span',{class:'pill'}, String(state.inbox.length)));
    s.appendChild(h1);
    const bi = el('button',{class:'navitem'+(state.vista.tipo==='inbox'?' active':''), onclick:()=>{ state.vista={tipo:'inbox'}; render(); }});
    bi.innerHTML = state.inbox.length
      ? 'Respostas sem cliente<span class="sub">'+state.inbox.length+' aguardando</span>'
      : 'Respostas sem cliente<span class="sub">nada pendente</span>';
    s.appendChild(bi);

    s.appendChild(el('h4',{},'Clientes'));

      s.appendChild(el('div',{class:'navitem muted'},'Nenhum cliente ainda'));
    } else {
      state.clientes.forEach(c=>{
        const b = el('button',{class:'navitem'+(state.vista.tipo==='cliente'&&state.vista.id===c.id?' active':''), onclick:()=>abrirCliente(c.id)});
        b.innerHTML = esc(c.nome)+'<span class="sub">'+esc(rotulo('estagio',c.estagio))+(c.vertical?' · '+esc(c.vertical):'')+'</span>';
        s.appendChild(b);

    const wrap = el('div',{class:'act'});
    wrap.appendChild(el('button',{class:'btn ghost small', onclick:()=>{ state.vista={tipo:'novo'}; render(); }},'+ Novo cliente'));

  function conteudo(){
    if(state.vista.tipo==='agora') return telaAgora();
    if(state.vista.tipo==='inbox') return telaInbox();
    if(state.vista.tipo==='novo') return telaNovoCliente();
    return telaCliente();
  }

  // ---------- agora ----------

  // Regra: uma pendência só existe se der pra apontar o que fazer e onde.
  // "Melhorar o Instagram" não é pendência. "Acesso ao Meta Business bloqueado
  // há 12 dias" é. Nada aqui é opinião: tudo sai de um campo vazio, um status
  // ou uma data no banco.
  const HOJE = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
  const diasAte = iso => {
    if(!iso) return null;
    const d = new Date(String(iso).slice(0,10) + 'T00:00:00');
    return isNaN(d) ? null : Math.round((d - HOJE()) / 86400000);
  };
  const emDias = n => n === 0 ? 'hoje' : (n > 0 ? 'em ' + n + (n===1?' dia':' dias') : 'há ' + Math.abs(n) + (n===-1?' dia':' dias'));

  function pendencias(){
    const p = [];
    const t = state.tudo || { acessos:[], metas:[], baselines:[], marcos:[], conformidade:[], horas:[] };
    const add = (urgencia, cliente, aba, oq, porq) => p.push({ urgencia, cliente, aba, oq, porq });

    // 1. Respostas que chegaram e não viraram cliente. Começa a envelhecer no minuto um.
    state.inbox.forEach(sub=>{
      const d = diasAte(sub.recebido_em);
      const velho = d !== null && d <= -3;
      add(velho ? 'alta' : 'media', null, null,
        'Vincular a resposta de ' + (sub.nome_informado || 'alguém sem nome'),
        'Chegou pelo formulário ' + (d === null ? '' : emDias(d)) + ' e ainda não está ligada a nenhum cliente.');
    });

    const ativos = state.clientes.filter(c => c.estagio === 'onboarding' || c.estagio === 'ativo');

    ativos.forEach(c=>{
      const meus = tab => t[tab].filter(l => l.cliente_id === c.id);

      // 2. Acessos. O gargalo mais documentado do onboarding (Lacuna #5).
      const ac = meus('acessos');
      const bloq = ac.filter(l => l.status === 'bloqueado');
      if(bloq.length) add('alta', c, 'acessos',
        bloq.length + ' acesso' + (bloq.length===1?'':'s') + ' bloqueado' + (bloq.length===1?'':'s'),
        bloq.map(l => l.recurso).join(', ') + '. Bloqueado não destrava sozinho: precisa de uma ligação, não de mais um lembrete.');
      const parados = ac.filter(l => l.status === 'solicitado' && diasAte(l.solicitado_em) !== null && diasAte(l.solicitado_em) <= -5);
      if(parados.length) add('alta', c, 'acessos',
        parados.length + ' acesso' + (parados.length===1?'':'s') + ' pedido' + (parados.length===1?'':'s') + ' e sem resposta',
        parados.map(l => l.recurso + ' (' + emDias(diasAte(l.solicitado_em)) + ')').join(', ') + '.');
      const naoPedidos = ac.filter(l => l.status === 'pendente');
      if(naoPedidos.length) add('media', c, 'acessos',
        naoPedidos.length + ' acesso' + (naoPedidos.length===1?'':'s') + ' que ninguém pediu ainda',
        naoPedidos.map(l => l.recurso).join(', ') + '.');
      if(!ac.length) add('media', c, 'acessos',
        'Nenhum acesso registrado',
        'Sem a lista de acessos, a primeira semana descobre o que falta no pior momento possível.');

      // 3. Baseline. Congelar antes de mexer, ou não há como provar nada depois (Lacuna #3).
      if(!meus('baselines').length) add('alta', c, 'baseline',
        'Baseline não congelado',
        'Qualquer coisa publicada antes disso vira resultado que não dá pra provar. Congelar é a primeira tarefa, não a última.');

      // 4. Metas pre-registradas.
      const metas = meus('metas');
      if(!metas.length) add('media', c, 'metas',
        'Nenhuma meta pré-registrada',
        'Sem sucesso e fracasso escritos antes, os números do dia 90 se explicam sozinhos — e sempre a favor da agência.');
      else {
        const semFracasso = metas.filter(m => !(m.fracasso || '').trim());
        if(semFracasso.length) add('media', c, 'metas',
          semFracasso.length + ' meta' + (semFracasso.length===1?'':'s') + ' sem critério de fracasso',
          semFracasso.map(m => m.metrica).join(', ') + '. Meta sem fracasso declarado não é meta, é torcida.');
      }

      // 5. Primeiro valor: a promessa pequena com data (Lacuna #5).
      const pv = (c.primeiro_valor_prometido || '').trim();
      if(!pv) add('alta', c, 'respostas',
        'Primeiro valor não definido',
        'Precisa estar dito no kickoff, com data entre 14 e 30 dias. Depois disso já é tarde.');
      else if(!c.primeiro_valor_data) add('alta', c, 'respostas',
        'Primeiro valor sem data',
        '"' + pv + '" — promessa sem data não cobra ninguém.');
      else {
        const d = diasAte(c.primeiro_valor_data);
        if(d < 0) add('alta', c, 'respostas', 'Primeiro valor atrasado ' + emDias(d),
          '"' + pv + '". Atrasar isso custa mais que atrasar um post: é a promessa que sustenta a relação até o número se mexer.');
        else if(d <= 7) add('media', c, 'respostas', 'Primeiro valor vence ' + emDias(d),
          '"' + pv + '"');
      }

      // 6. Conformidade. Não conforme é publicação que pode ter que sair do ar.
      const co = meus('conformidade');
      const ruins = co.filter(l => l.status === 'nao_conforme');
      if(ruins.length) add('alta', c, 'conformidade',
        ruins.length + ' item' + (ruins.length===1?'':'s') + ' fora da norma',
        ruins.map(l => (l.norma ? l.norma + ': ' : '') + l.item).join(' | '));
      const aVer = co.filter(l => l.status === 'pendente');
      if(aVer.length) add('media', c, 'conformidade',
        aVer.length + ' item' + (aVer.length===1?'':'s') + ' de conformidade sem veredito',
        aVer.map(l => l.item).join(' | '));

      // 7. Marcos com data.
      meus('marcos').filter(m => !m.data_cumprida && m.data_prevista).forEach(m=>{
        const d = diasAte(m.data_prevista);
        const dele = m.responsavel === 'cliente';
        if(d < 0) add('alta', c, 'marcos', 'Marco atrasado ' + emDias(d) + ': ' + m.titulo,
          dele ? 'É do cliente. Atraso do cliente não se cobra por mensagem no dia seguinte ao prazo, se combina de novo com data nova.' : 'É nosso.');
        else if(d <= 7) add('media', c, 'marcos', 'Marco vence ' + emDias(d) + ': ' + m.titulo,
          dele ? 'Depende do cliente — avisar hoje, não no dia.' : 'É nosso.');
      });

      // 8. Horas. Bloco G: só dá pra decidir o que automatizar sabendo onde o tempo vai.
      if(c.estagio === 'ativo'){
        const ult = meus('horas').map(h => diasAte(h.data)).filter(x => x !== null).sort((a,b)=>b-a)[0];
        if(ult === undefined) add('baixa', c, 'horas', 'Nenhuma hora lançada',
          'Sem horas, não dá pra saber se o cliente dá lucro nem o que vale automatizar.');
        else if(ult <= -14) add('baixa', c, 'horas', 'Sem horas lançadas ' + emDias(ult),
          'O último lançamento foi ' + emDias(ult) + '. Registro que atrasa duas semanas vira chute.');
      }
    });

    const peso = { alta:0, media:1, baixa:2 };
    return p.sort((a,b)=> peso[a.urgencia] - peso[b.urgencia]
      || String(a.cliente ? a.cliente.nome : '').localeCompare(String(b.cliente ? b.cliente.nome : '')));
  }

  function telaAgora(){
    const m = el('main');
    m.appendChild(el('p',{class:'eyebrow'},'O que está esperando por nós'));
    m.appendChild(el('h1',{class:'page'},'Agora'));
    m.appendChild(el('p',{class:'muted'},'Tudo o que o banco sabe que está em aberto, em uma lista só. Cada linha leva direto pro lugar de resolver.'));

    const pend = pendencias();
    if(!pend.length){
      m.appendChild(el('div',{class:'vazio', style:'margin-top:22px'},'Nada em aberto. Ou está tudo em dia, ou falta registrar — as duas coisas parecem iguais daqui.'));
      return m;
    }

    const conta = u => pend.filter(p => p.urgencia === u).length;
    const resumo = el('div',{class:'placar'});
    [['alta','urgente'],['media','esta semana'],['baixa','quando der']].forEach(([u,rot])=>{
      const n = conta(u);
      if(!n) return;
      const b = el('div',{class:'n '+u});
      b.appendChild(el('b',{}, String(n)));
      b.appendChild(el('span',{}, rot));
      resumo.appendChild(b);
    });
    m.appendChild(resumo);

    let atual = null;
    pend.forEach(p=>{
      if(p.urgencia !== atual){
        atual = p.urgencia;
        const rot = { alta:'Urgente', media:'Esta semana', baixa:'Quando der' }[atual];
        m.appendChild(el('div',{class:'secname'}, rot));
      }
      const b = el('button',{class:'pend '+p.urgencia, onclick:()=>{
        if(p.cliente) abrirCliente(p.cliente.id, p.aba);
        else { state.vista = { tipo:'inbox' }; render(); }
      }});
      b.appendChild(el('div',{class:'quem'}, p.cliente ? esc(p.cliente.nome) : 'Caixa de entrada'));
      b.appendChild(el('div',{class:'oq'}, esc(p.oq)));
      if(p.porq) b.appendChild(el('div',{class:'porq'}, esc(p.porq)));
      m.appendChild(b);
    });

    return m;
  }

  // ---------- caixa de entrada ----------

  function telaInbox(){
    const m = el('main');
    m.appendChild(el('p',{class:'eyebrow'},'Chegou pelo formulário'));
    m.appendChild(el('h1',{class:'page'},'Respostas sem cliente'));
    m.appendChild(el('p',{class:'muted'},'Cada envio do formulário cai aqui. Vincule a um cliente que já existe ou crie um a partir das respostas.'));

    if(!state.inbox.length){
      m.appendChild(el('div',{class:'vazio', style:'margin-top:22px'},'Nada pendente. Quando alguém enviar o formulário, aparece aqui.'));
      return m;
    }

    state.inbox.forEach(sub=>{
      const c = el('div',{class:'card', style:'margin-top:18px'});
      const cab = el('div',{style:'display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:baseline'});
      cab.appendChild(el('div',{},'<strong class="grotesk" style="font-size:1.1rem">'+esc(sub.nome_informado||'Sem nome informado')+'</strong>'));
      cab.appendChild(el('span',{class:'mono muted', style:'font-size:0.7rem'}, dataBR(sub.recebido_em)+' · '+contarRespondidas(sub.respostas)+'/24 respondidas'));
      c.appendChild(cab);

      const previa = (sub.respostas && (sub.respostas.o_que_faz || sub.respostas.cliente_ideal)) || '';
      if(previa) c.appendChild(el('p',{class:'muted', style:'margin:10px 0 0'}, esc(previa.slice(0,240))));

      const acoes = el('div',{style:'margin-top:16px;display:flex;gap:9px;flex-wrap:wrap;align-items:center'});
      acoes.appendChild(el('button',{class:'btn small', onclick:()=>criarClienteDaSubmissao(sub)},'Criar cliente com estas respostas'));

      if(state.clientes.length){
        const sel = el('select',{style:'padding:6px 8px;border:1.5px solid #0A0A0A'});
        sel.appendChild(el('option',{value:''},'vincular a um cliente…'));
        state.clientes.forEach(c2=> sel.appendChild(el('option',{value:c2.id}, esc(c2.nome))));
        sel.addEventListener('change', async ()=>{
          if(!sel.value) return;
          if(await atualizar('onboarding_respostas', sub.id, { cliente_id: sel.value })){
            toast('Vinculado.');
            await carregarTudo(); abrirCliente(sel.value);
          }
        });
        acoes.appendChild(sel);
      }
      c.appendChild(acoes);

      const det = el('details',{style:'margin-top:14px'});
      det.appendChild(el('summary',{class:'mono', style:'font-size:0.7rem;cursor:pointer;letter-spacing:0.08em;text-transform:uppercase;color:#6E6E6E'},'ver as 24 respostas'));
      det.appendChild(blocoRespostas(sub.respostas));
      c.appendChild(det);
      m.appendChild(c);
    });
    return m;
  }

  function contarRespondidas(r){
    if(!r) return 0;
    return Object.values(r).filter(v=>typeof v==='string' && v.trim()).length;
  }

  async function criarClienteDaSubmissao(sub){
    const nome = (sub.nome_informado || '').trim() || 'Cliente sem nome';
    const { data, error } = await sb.from('clientes')
      .insert({ nome, nome_preferido: sub.nome_informado || null, estagio:'prospect' })
      .select('id').single();
    if(error){ toast('Não deu: ' + error.message); return; }
    await atualizar('onboarding_respostas', sub.id, { cliente_id: data.id });
    toast('Cliente criado.');
    await carregarTudo();
    abrirCliente(data.id);
  }

  // ---------- novo cliente ----------

  function telaNovoCliente(){
    const m = el('main');
    m.appendChild(el('p',{class:'eyebrow'},'Cadastro'));
    m.appendChild(el('h1',{class:'page'},'Novo cliente'));
    const form = el('form',{class:'card', style:'margin-top:18px'});
    const g = el('div',{class:'grid2'});
    g.appendChild(campo('Nome','nome'));
    g.appendChild(campo('Como prefere ser chamado','nome_preferido'));
    g.appendChild(campo('Vertical','vertical'));
    g.appendChild(campoSelect('Em que pé está','estagio',opcoesDe('estagio'),'prospect',
      'Só quem está em "primeiros 90 dias" ou "em andamento" aparece na tela Agora.'));
    g.appendChild(campo('Responsável na Bora','responsavel'));
    g.appendChild(campo('Início do contrato','inicio_contrato','date'));
    form.appendChild(g);
    const btn = el('button',{class:'btn', type:'submit'},'Criar');
    form.appendChild(btn);
    form.addEventListener('submit', async e=>{
      e.preventDefault();
      const dados = lerForm(form);
      if(!dados.nome){ toast('O nome é obrigatório.'); return; }
      btn.disabled = true;
      const { data, error } = await sb.from('clientes').insert(dados).select('id').single();
      if(error){ toast('Não deu: '+error.message); btn.disabled=false; return; }
      await carregarTudo(); abrirCliente(data.id);
    });
    m.appendChild(form);
    return m;
  }

  // Aceita 'valor' solto ou o par ['valor_no_banco','Rótulo em português'].
  function campoSelect(rot, nome, opcoes, valor, dica){
    const f = el('div',{class:'field'});
    f.appendChild(el('label',{for:'f_'+nome},esc(rot)));
    const s = el('select',{id:'f_'+nome, name:nome});
    opcoes.forEach(o=>{
      const v = Array.isArray(o) ? o[0] : o;
      const t = Array.isArray(o) ? o[1] : o;
      const op = el('option',{value:v}, esc(t));
      if(v===valor) op.setAttribute('selected','selected');
      s.appendChild(op);
    });
    f.appendChild(s);
    if(dica) f.appendChild(el('span',{class:'dica'}, esc(dica)));
    return f;
  }

  function lerForm(form){
    const out = {};
    form.querySelectorAll('input,select,textarea').forEach(i=>{
      if(!i.name) return;
      if(i.type==='checkbox'){ out[i.name] = i.checked; return; }
      const v = i.value.trim();
      out[i.name] = v === '' ? null : (i.type==='number' ? Number(v) : v);
    });
    return out;
  }

  // ---------- ficha do cliente ----------

  async function abrirCliente(id, aba){
    state.vista = { tipo:'cliente', id };
    state.aba = (aba && ABAS.some(a => a[0] === aba)) ? aba : 'respostas';
    state.editandoPV = false;
    render();
    await carregarDetalhe(id);
    render();
  }

  function clienteAtual(){ return state.clientes.find(c=>c.id===state.vista.id); }

  function telaCliente(){
    const c = clienteAtual();
    const m = el('main');
    if(!c){ m.appendChild(el('div',{class:'vazio'},'Cliente não encontrado.')); return m; }

    m.appendChild(el('p',{class:'eyebrow'}, esc(c.vertical || 'sem vertical definida')));
    m.appendChild(el('h1',{class:'page'}, esc(c.nome)));

    const meta = el('div',{style:'display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:10px'});
    const sel = el('select',{style:'padding:5px 8px;border:1.5px solid #0A0A0A;font-size:0.78rem'});
    ESTAGIOS.forEach(e2=>{ const o = el('option',{value:e2}, rotulo('estagio',e2)); if(e2===c.estagio) o.setAttribute('selected','selected'); sel.appendChild(o); });
    sel.addEventListener('change', async ()=>{
      if(await atualizar('clientes', c.id, { estagio: sel.value })){ toast('Estágio atualizado.'); await carregarTudo(); render(); }
    });
    meta.appendChild(sel);
    if(c.inicio_contrato) meta.appendChild(el('span',{class:'tag off'},'início '+soData(c.inicio_contrato)));
    if(c.responsavel) meta.appendChild(el('span',{class:'tag off'},'resp. '+esc(c.responsavel)));
    if(c.brand_profile_id) meta.appendChild(el('span',{class:'tag roxo'},'marca vinculada no app'));
    m.appendChild(meta);

    m.appendChild(termometro(c));
    m.appendChild(blocoPrimeiroValor(c));

    const tabs = el('div',{class:'tabs'});
    ABAS.forEach(([k,rot])=>{
      const b = el('button',{class:'tab'+(state.aba===k?' active':''), onclick:()=>{ state.aba=k; render(); }}, rot);
      tabs.appendChild(b);
    });
    m.appendChild(tabs);

    const p = el('div',{class:'panel'});
    p.appendChild(explicacaoAba(state.aba));
    if(state.aba==='respostas') p.appendChild(abaRespostas());
    if(state.aba==='pagina') p.appendChild(abaPagina(c));
    if(state.aba==='acessos') p.appendChild(abaAcessos(c));
    if(state.aba==='metas') p.appendChild(abaMetas(c));
    if(state.aba==='baseline') p.appendChild(abaBaseline(c));
    if(state.aba==='marcos') p.appendChild(abaMarcos(c));
    if(state.aba==='conformidade') p.appendChild(abaConformidade(c));
    if(state.aba==='horas') p.appendChild(abaHoras(c));
    m.appendChild(p);
    return m;
  }

  // Diz, em uma linha, o que a aba é e quando se preenche. Sem isso são sete
  // tabelas idênticas e ninguém sabe por onde começar.
  function explicacaoAba(chave){
    const a = ABAS.find(x => x[0] === chave);
    const box = el('div',{class:'expl'});
    if(!a) return box;
    box.appendChild(el('div',{class:'marca'}));
    const txt = el('div');
    txt.appendChild(el('h3',{}, esc(a[2])));
    txt.appendChild(el('p',{}, esc(a[3]) + '<span class="quando">' + esc(a[4]) + '</span>'));
    box.appendChild(txt);
    return box;
  }

  // Termômetro: as seis etapas que precisam estar de pé antes de o trabalho
  // virar rotina. Cada uma leva para a aba onde se resolve.
  function etapasDoCliente(c){
    const d = state.detalhe;
    const acessosUteis = d.acessos.filter(a => a.status !== 'nao_aplicavel');
    const acessosOk = acessosUteis.filter(a => a.status === 'recebido').length;
    const metasComFracasso = d.metas.filter(m => (m.fracasso || '').trim()).length;
    const confSemVeredito = d.conformidade.filter(i => i.status === 'pendente').length;
    const temPV = !!(c.primeiro_valor_prometido || '').trim() && !!c.primeiro_valor_data;

    return [
      { rot:'Respostas', aba:'respostas',
        feito: d.onboarding ? 1 : 0, total:1,
        sub: d.onboarding ? contarRespondidas(d.onboarding.respostas) + ' de 24' : 'nada vinculado' },
      { rot:'Acessos', aba:'acessos',
        feito: acessosOk, total: acessosUteis.length || 1,
        sub: acessosUteis.length ? acessosOk + ' de ' + acessosUteis.length : 'lista não criada' },
      { rot:'Baseline', aba:'baseline',
        feito: d.baselines.length ? 1 : 0, total:1,
        sub: d.baselines.length ? d.baselines.length + ' congelados' : 'nada congelado' },
      { rot:'Metas', aba:'metas',
        feito: metasComFracasso, total: d.metas.length || 1,
        sub: d.metas.length ? metasComFracasso + ' de ' + d.metas.length + ' completas' : 'nenhuma meta' },
      { rot:'Primeiro valor', aba:'respostas',
        feito: temPV ? 1 : 0, total:1,
        sub: temPV ? 'até ' + soData(c.primeiro_valor_data) : 'sem promessa com data' },
      { rot:'Conformidade', aba:'conformidade',
        feito: d.conformidade.length ? d.conformidade.length - confSemVeredito : 0,
        total: d.conformidade.length || 1,
        sub: d.conformidade.length ? (confSemVeredito ? confSemVeredito + ' sem veredito' : 'tudo avaliado') : 'nada avaliado' },
    ];
  }

  function termometro(c){
    const etapas = etapasDoCliente(c);
    const prontas = etapas.filter(e => e.feito >= e.total).length;
    const pct = Math.round((prontas / etapas.length) * 100);

    const box = el('div',{class:'termo'});
    const topo = el('div',{class:'topo'});
    topo.appendChild(el('p',{class:'eyebrow', style:'margin:0'},'Como está o onboarding'));
    topo.appendChild(el('span',{class:'quanto'}, prontas + ' de ' + etapas.length + ' etapas de pé'));
    box.appendChild(topo);

    const barra = el('div',{class:'barra'});
    barra.appendChild(el('i',{style:'width:'+pct+'%'}));
    box.appendChild(barra);

    const grade = el('div',{class:'etapas'});
    etapas.forEach((e2, i)=>{
      const estado = e2.feito >= e2.total ? 'feito' : (e2.feito > 0 ? 'meio' : 'falta');
      const b = el('button',{class:'etapa '+estado, onclick:()=>{ state.aba = e2.aba; render(); }});
      b.innerHTML = '<span class="n"><span class="bola"></span>' + String(i+1).padStart(2,'0') + '</span>'
        + '<span class="rot">' + esc(e2.rot) + '</span>'
        + '<span class="sub">' + esc(e2.sub) + '</span>';
      grade.appendChild(b);
    });
    box.appendChild(grade);
    return box;
  }

  // Primeiro valor: a promessa pequena com data marcada que sustenta a relacao
  // enquanto o numero que o cliente quer ver ainda nao se moveu (Lacuna #5).
  function blocoPrimeiroValor(c){
    const box = el('div',{class:'card', style:'margin-top:18px;border-width:2px'});
    const tem = !!(c.primeiro_valor_prometido || '').trim();

    const topo = el('div',{style:'display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:baseline'});
    topo.appendChild(el('p',{class:'eyebrow', style:'margin:0'},'Primeiro valor prometido'));
    topo.appendChild(el('button',{class:'linkbtn', style:'color:#6E6E6E',
      onclick:()=>{ state.editandoPV = !state.editandoPV; render(); }}, state.editandoPV ? 'cancelar' : (tem ? 'editar' : 'definir')));
    box.appendChild(topo);

    if(!state.editandoPV){
      if(tem){
        box.appendChild(el('p',{style:'margin:8px 0 0;font-size:1.05rem;line-height:1.45'}, esc(c.primeiro_valor_prometido)));
        const linha = el('div',{style:'margin-top:10px;display:flex;gap:9px;flex-wrap:wrap;align-items:center'});
        if(c.primeiro_valor_data){
          const hoje = new Date(); hoje.setHours(0,0,0,0);
          const alvo = new Date(c.primeiro_valor_data + 'T00:00:00');
          const dias = Math.round((alvo - hoje) / 86400000);
          linha.appendChild(el('span',{class:'tag off'},'até ' + soData(c.primeiro_valor_data)));
          if(dias > 0) linha.appendChild(el('span',{class:'tag off'}, 'faltam ' + dias + (dias === 1 ? ' dia' : ' dias')));
          else if(dias === 0) linha.appendChild(el('span',{class:'tag on'},'é hoje'));
          else linha.appendChild(el('span',{class:'tag on'}, 'atrasado há ' + Math.abs(dias) + (dias === -1 ? ' dia' : ' dias')));
        } else {
          linha.appendChild(el('span',{class:'tag on'},'sem data — promessa sem data não conta'));
        }
        box.appendChild(linha);
      } else {
        box.appendChild(el('p',{class:'muted', style:'margin:10px 0 0'},
          'Nada declarado ainda. Primeiro valor não é o resultado prometido: é a primeira vez que o cliente percebe que a decisão foi certa — e precisa acontecer entre 14 e 30 dias, com data dita no kickoff.'));
      }
      return box;
    }

    const form = el('form',{style:'margin-top:14px'});
    const g = el('div',{class:'grid2'});
    g.appendChild(campo('O que ele vai perceber, e quando','primeiro_valor_prometido','text', c.primeiro_valor_prometido || ''));
    g.appendChild(campo('Data prometida','primeiro_valor_data','date', c.primeiro_valor_data || ''));
    form.appendChild(g);
    form.appendChild(el('p',{class:'muted', style:'margin:0 0 12px;font-size:0.84rem'},
      'Candidatos que funcionam em 14 dias: ele passa a saber quantas pessoas chegam por dia e por onde; o tempo de resposta cai de horas para minutos; o diagnóstico de conformidade; o perfil corrigido com antes e depois. Ranqueamento e cliente novo não servem — chegam tarde demais.'));
    form.appendChild(el('button',{class:'btn small', type:'submit'},'Salvar'));
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const d = lerForm(form);
      if(await atualizar('clientes', c.id, d)){
        toast('Primeiro valor registrado.');
        state.editandoPV = false;
        await carregarTudo(); render();
      }
    });
    box.appendChild(form);
    return box;
  }

  // Placar reaproveitado no topo das abas: número grande, rótulo pequeno.
  function placar(itens){
    const box = el('div',{class:'placares'});
    itens.forEach(i=>{
      if(i.esconderSeZero && !i.valor) return;
      const p = el('div',{class:'p'+(i.destaca?' destaca':'')});
      p.appendChild(el('b',{}, String(i.valor)));
      p.appendChild(el('span',{}, esc(i.rotulo)));
      if(i.de){
        const b = el('div',{class:'minibarra'});
        b.appendChild(el('i',{style:'width:'+Math.round((i.parte/i.de)*100)+'%'}));
        p.appendChild(b);
      }
      box.appendChild(p);
    });
    return box;
  }

  function abaAcessos(c){
    const box = el('div');
    const linhas = state.detalhe.acessos;
    const uteis = linhas.filter(l => l.status !== 'nao_aplicavel');
    const recebidos = uteis.filter(l => l.status === 'recebido').length;
    const travados = linhas.filter(l => l.status === 'bloqueado').length;
    const naoPedidos = linhas.filter(l => l.status === 'pendente').length;

    if(linhas.length){
      box.appendChild(placar([
        { rotulo:'Na nossa mão', valor: recebidos + ' de ' + uteis.length, destaca:true,
          parte:recebidos, de:Math.max(uteis.length,1) },
        { rotulo:'Travados', valor: travados, esconderSeZero:true },
        { rotulo:'Ninguém pediu', valor: naoPedidos, esconderSeZero:true },
      ]));
    } else {
      const wrap = el('div',{style:'margin:0 0 18px'});
      wrap.appendChild(el('button',{class:'btn small', onclick:async()=>{
        const novas = ACESSOS_PADRAO.map((recurso, i) => ({ cliente_id:c.id, recurso, ordem:i }));
        if(await inserir('acessos', novas)){ await carregarDetalhe(c.id); render(); }
      }},'Criar a lista padrão de acessos'));
      wrap.appendChild(el('span',{class:'dica'},'Cria as 8 contas que a gente sempre precisa, todas como "ainda não pedimos". Depois é só ir mudando o status.'));
      box.appendChild(wrap);
    }

    box.appendChild(secao({
      tabela:'acessos', cliente:c, linhas,
      vazio:{ titulo:'Nenhum acesso mapeado ainda',
              texto:'Comece pela lista padrão acima e vá marcando quem detém cada conta.' },
      rotuloAdd:'+ adicionar acesso',
      colunas:[
        {rotulo:'Conta', chave:'recurso', forte:true},
        {rotulo:'Situação', chave:'status', chip:'acessos_status'},
        {rotulo:'Com quem está', chave:'quem_detem'},
        {rotulo:'Pedimos em', valor:l=> l.solicitado_em ? soData(l.solicitado_em) : null},
        {rotulo:'Chegou em', valor:l=> l.recebido_em ? soData(l.recebido_em) : null},
        {rotulo:'Observação', chave:'nota'},
      ],
      campos:[
        {rotulo:'Qual conta', nome:'recurso', dica:'Ex.: Instagram, WhatsApp comercial, Perfil da Empresa'},
        {rotulo:'Situação', nome:'status', grupo:'acessos_status', padrao:'pendente'},
        {rotulo:'Com quem está', nome:'quem_detem', dica:'A pessoa de verdade. "Sobrinho da dona" é resposta válida e útil.'},
        {rotulo:'Pedimos em', nome:'solicitado_em', tipo:'date'},
        {rotulo:'Chegou em', nome:'recebido_em', tipo:'date'},
        {rotulo:'Observação', nome:'nota', tipo:'textarea', dica:'O que está atrapalhando, ou o que precisa ser feito antes.'},
      ],
      validar:d=> d.recurso ? null : 'Diga qual é o acesso.',
    }));
    return box;
  }

  function abaRespostas(){
    const on = state.detalhe.onboarding;
    if(!on){
      const v = el('div',{class:'vazio'});
      v.appendChild(el('strong',{},'Nenhuma resposta vinculada'));
      v.appendChild(el('span',{},'Quando alguém enviar o formulário, a resposta cai na caixa de entrada. De lá, você liga ela a este cliente.'));
      return v;
    }
    const box = el('div');
    box.appendChild(el('p',{class:'mono muted', style:'font-size:0.7rem;margin:0 0 18px'},
      'Recebido em '+dataBR(on.recebido_em)+' · '+contarRespondidas(on.respostas)+' de 24 respondidas'));
    box.appendChild(blocoRespostas(on.respostas));
    return box;
  }

  function blocoRespostas(respostas){
    const box = el('div');
    const r = respostas || {};
    SECOES.forEach(sec=>{
      box.appendChild(el('p',{class:'secname'}, esc(sec.titulo)));
      sec.perguntas.forEach(([chave, pergunta])=>{
        const v = (r[chave]||'').trim();
        const d = el('div',{class:'qa'+(v?'':' vazia')});
        d.appendChild(el('div',{class:'q'}, esc(pergunta)));
        d.appendChild(el('div',{class:'a'}, v ? esc(v) : 'Não respondido'));
        box.appendChild(d);
      });
    });
    return box;
  }

  // ---------- página de 90 dias do cliente ----------

  // Monta o arquivo que o cliente lê. Mesmo objeto em dois momentos: no dia 0 é o
  // plano, no dia 90 é o relatório. Sai daqui com os dados desta ficha, sem
  // ninguém redigitar nada — e sem inventar: o que não está no banco não aparece.
  function montarPaginaCliente(c){
    const d = state.detalhe;
    const nome = c.nome_preferido || c.nome;
    const base = c.inicio_contrato ? new Date(c.inicio_contrato + 'T00:00:00') : HOJE();
    const dia = Math.max(0, Math.round((HOJE() - base) / 86400000));
    const maisDias = n => {
      const x = new Date(base); x.setDate(x.getDate() + n);
      return x.toLocaleDateString('pt-BR', { day:'2-digit', month:'short' }).replace('.','');
    };
    const E = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const porExtenso = iso => {
      if(!iso) return '';
      const x = new Date(String(iso).slice(0,10) + 'T00:00:00');
      return x.toLocaleDateString('pt-BR', { day:'numeric', month:'long', year:'numeric' });
    };

    // --- ponto de partida
    const linhasBase = d.baselines.map(b => '<tr>'
      + '<td class="metrica">' + E(b.metrica) + '</td>'
      + '<td class="num">' + E(b.valor != null ? b.valor + (b.unidade ? ' ' + b.unidade : '') : (b.valor_texto || '?')) + '</td>'
      + '<td>' + E(rotulo('baselines_fonte', b.fonte)) + '</td>'
      + '<td class="ressalva">' + E(b.limitacao || '—') + '</td>'
      + '</tr>').join('\n          ');

    // --- pré-registro
    const blocosMeta = d.metas.map(m => {
      const frac = (m.fracasso || '').trim();
      return '<div class="meta">'
        + '<h3>' + E(m.metrica) + '<span class="tipo">' + E(rotulo('metas_tipo', m.tipo)) + '</span></h3>'
        + '<div class="marcos-meta">'
        +   '<div><p class="rotulo">Dia 30</p><p>' + E(m.sucesso_30 || 'Sem meta') + '</p></div>'
        +   '<div><p class="rotulo">Dia 90</p><p>' + E(m.sucesso_90 || 'Sem meta') + '</p></div>'
        + '</div>'
        + (frac ? '<div class="fracasso"><b>Deu errado se</b>' + E(frac) + '</div>' : '')
        + '</div>';
    }).join('\n      ');

    // --- ordem das coisas
    const passos = d.marcos.slice().sort((a,b)=>
      String(a.data_prevista||'9999').localeCompare(String(b.data_prevista||'9999')) || (a.ordem||0)-(b.ordem||0)
    ).map(m => {
      const deles = m.responsavel === 'cliente';
      const quando = m.data_prevista
        ? new Date(m.data_prevista + 'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.','')
        : '—';
      return '<div class="passo' + (deles ? ' deles' : '') + '">'
        + '<div class="quando">' + E(quando) + (m.data_cumprida ? '<br><span class="feito">feito</span>' : '') + '</div>'
        + '<div class="conteudo">'
        +   '<h3>' + E(m.titulo) + '<span class="dono ' + (deles ? 'cliente' : 'nos') + '">' + (deles ? 'vocês' : 'nós') + '</span></h3>'
        +   (m.descricao ? '<p>' + E(m.descricao) + '</p>' : '')
        + '</div></div>';
    }).join('\n      ');

    // --- a coluna deles: acessos que faltam + marcos do cliente em aberto
    const faltando = d.acessos.filter(a => a.status === 'pendente' || a.status === 'solicitado' || a.status === 'bloqueado');
    const marcosDeles = d.marcos.filter(m => m.responsavel === 'cliente' && !m.data_cumprida);
    const itensDeles = faltando.map(a => ({
      oq: 'Acesso ao ' + a.recurso,
      obs: [a.quem_detem ? 'Está com ' + a.quem_detem + '.' : '', a.nota || ''].filter(Boolean).join(' '),
    })).concat(marcosDeles.map(m => ({ oq: m.titulo, obs: m.descricao || '' })));

    const listaDeles = itensDeles.length
      ? itensDeles.map(i => '<div class="item"><div class="caixa"></div><div>'
          + '<div class="oq">' + E(i.oq) + '</div>'
          + (i.obs ? '<div class="obs">' + E(i.obs) + '</div>' : '')
          + '</div></div>').join('\n        ')
      : '<p class="obs">Nada pendente do lado de vocês no momento.</p>';

    const pv = (c.primeiro_valor_prometido || '').trim();

    return '<!doctype html>\n<html lang="pt-BR">\n<head>\n<meta charset="utf-8">\n'
+ '<meta name="viewport" content="width=device-width,initial-scale=1">\n'
+ '<title>' + E(nome) + ' — 90 dias com a Bora Postar</title>\n'
+ '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Archivo:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap">\n'
+ '<style>\n' + CSS_PAGINA_CLIENTE + '</style>\n</head>\n<body>\n<div class="folha">\n'
+ '  <header>\n'
+ '    <p class="rotulo laranja">Bora Postar · plano de trabalho</p>\n'
+ '    <h1>Noventa dias com <em>' + E(nome) + '</em></h1>\n'
+ '    <div class="subcab">'
+       (c.vertical ? '<span>' + E(c.vertical) + '</span>' : '')
+       '<span>Dia <b>' + dia + '</b> de 90</span></div>\n'
+ '    <p class="aviso">Esta página é o plano hoje e o relatório no dia 90 — mesmo link, atualizado por nós. Enquanto os números não se movem ela mostra o que combinamos e o que falta. Quando começarem a se mover, mostra o que aconteceu, incluindo o que não deu certo.</p>\n'
+ '  </header>\n'
+ (pv ? ('  <section>\n    <p class="rotulo">A primeira coisa que vocês vão perceber</p>\n'
+ '    <div class="promessa">\n      <p class="rotulo">Primeiro valor prometido</p>\n'
+ '      <p>' + E(pv) + '</p>\n'
+ '      <div class="data">' + (c.primeiro_valor_data
        ? 'Até <b>' + E(porExtenso(c.primeiro_valor_data)) + '</b> · se não acontecer até lá, cobrem da gente'
        : 'Sem data marcada') + '</div>\n    </div>\n  </section>\n') : '')
+ (d.baselines.length ? ('  <section>\n    <p class="rotulo">Ponto de partida</p>\n'
+ '    <h2>De onde estamos saindo</h2>\n'
+ '    <p class="intro">Congelado antes de mexermos em qualquer coisa. A última coluna é o que há de frágil em cada número — dizemos agora para ninguém tratar estimativa como medida daqui a três meses.</p>\n'
+ '    <div class="rolagem"><table>\n      <thead><tr><th>O que</th><th>Hoje</th><th>Onde medimos</th><th>O que essa medida não garante</th></tr></thead>\n'
+ '      <tbody>\n          ' + linhasBase + '\n      </tbody>\n    </table></div>\n  </section>\n') : '')
+ (d.metas.length ? ('  <section>\n    <p class="rotulo">Pré-registro</p>\n'
+ '    <h2>O que vamos perseguir, e o que conta como ter dado errado</h2>\n'
+ '    <p class="intro">Escrito antes de começar, de propósito. Se só combinássemos o sucesso, qualquer número do dia 90 se explicaria — e sempre a favor de quem fez o trabalho. O critério de fracasso está aí para vocês poderem cobrar.</p>\n'
+ '      ' + blocosMeta + '\n  </section>\n') : '')
+ (d.marcos.length ? ('  <section>\n    <p class="rotulo">Ordem das coisas</p>\n'
+ '    <h2>Os primeiros passos</h2>\n'
+ '    <p class="intro">A barra preta é nossa, a roxa é de vocês.</p>\n'
+ '    <div class="trilhos">\n      ' + passos + '\n    </div>\n  </section>\n') : '')
+ '  <section>\n    <div class="voces">\n      <p class="rotulo">Sua parte</p>\n'
+ '      <h2>O que depende de vocês agora</h2>\n'
+ '      <p>' + (itensDeles.length
      ? itensDeles.length + (itensDeles.length === 1 ? ' coisa, e o plano espera por ela.' : ' coisas, e o plano inteiro espera por elas.')
      : 'Nada travado do lado de vocês.') + '</p>\n'
+ '      <div class="lista">\n        ' + listaDeles + '\n      </div>\n    </div>\n  </section>\n'
+ '  <section>\n    <p class="rotulo">Resultados</p>\n'
+ (dia < 30
    ? ('    <h2>Ainda não há o que mostrar</h2>\n'
+ '    <p class="intro">E é assim que deve estar no começo. Esta seção fica vazia até existir número comparável com o ponto de partida — colocar gráfico bonito aqui antes disso seria enfeite.</p>\n'
+ '    <div class="vazio">\n      <p class="rotulo">Primeira leitura</p>\n'
+ '      <p>A primeira medição real sai no dia 30. Ela vem com o que subiu, o que não subiu e o que a gente errou — nessa ordem, porque a terceira é a parte que faz as outras duas valerem alguma coisa.</p>\n'
+ '      <div class="datas"><span>Dia 30 · ' + maisDias(30) + '</span><span>Dia 60 · ' + maisDias(60) + '</span><span>Dia 90 · ' + maisDias(90) + '</span></div>\n    </div>\n')
    : ('    <h2>O que aconteceu até aqui</h2>\n'
+ '    <div class="vazio">\n      <p class="rotulo">A preencher</p>\n'
+ '      <p>Estamos no dia ' + dia + '. Escreva aqui, à mão, o que subiu, o que não subiu e o que erramos — nessa ordem. Compare com o ponto de partida e com o critério de fracasso que está logo acima, sem editar nenhum dos dois.</p>\n    </div>\n'))
+ '  </section>\n'
+ '  <footer>\n    <span>Bora Postar · Fortaleza</span>\n'
+ '    <span>Atualizado em <b>' + E(new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'})) + '</b></span>\n'
+ '  </footer>\n</div>\n</body>\n</html>\n';
  }

  function abaPagina(c){
    const box = el('div');
    const d = state.detalhe;
    const faltas = [];
    if(!(c.primeiro_valor_prometido||'').trim()) faltas.push(['O primeiro valor prometido','respostas']);
    if(!d.baselines.length) faltas.push(['O ponto de partida (baseline)','baseline']);
    if(!d.metas.length) faltas.push(['As metas com critério de fracasso','metas']);
    if(!d.marcos.length) faltas.push(['Os marcos com data','marcos']);

    box.appendChild(placar([
      { rotulo:'Números de partida', valor:d.baselines.length },
      { rotulo:'Metas', valor:d.metas.length },
      { rotulo:'Passos', valor:d.marcos.length },
      { rotulo:'Pendências do cliente', valor:
        d.acessos.filter(a=>['pendente','solicitado','bloqueado'].includes(a.status)).length
        + d.marcos.filter(m=>m.responsavel==='cliente' && !m.data_cumprida).length, destaca:true },
    ]));

    if(faltas.length){
      const av = el('div',{class:'erro', style:'margin:0 0 18px'});
      av.innerHTML = 'A página sai mesmo assim, mas sem estas partes: <strong>'
        + faltas.map(f=>esc(f[0])).join('</strong>, <strong>') + '</strong>. Seção sem dado simplesmente não aparece — nada é inventado.';
      box.appendChild(av);
    }

    const acoes = el('div',{style:'display:flex;gap:10px;flex-wrap:wrap;align-items:center'});
    acoes.appendChild(el('button',{class:'btn', onclick:()=>{
      const html = montarPaginaCliente(c);
      const nome = (c.nome_preferido || c.nome || 'cliente').toLowerCase()
        .normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').slice(0,40).replace(/^-|-$/g,'');
      const url = URL.createObjectURL(new Blob([html], { type:'text/html;charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url; a.download = '90-dias-' + (nome || 'cliente') + '.html';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      toast('Página baixada.');
    }},'Baixar a página'));
    acoes.appendChild(el('button',{class:'btn ghost', onclick:()=>{
      const w = window.open('', '_blank');
      if(!w){ toast('O navegador bloqueou a janela. Libere pop-up para este site.'); return; }
      w.document.write(montarPaginaCliente(c)); w.document.close();
    }},'Ver antes de baixar'));
    box.appendChild(acoes);

    box.appendChild(el('p',{class:'dica', style:'margin-top:12px;max-width:66ch'},
      'O arquivo é um HTML só, sem nada de fora. Dá pra mandar por WhatsApp, subir na Vercel ou anexar no e-mail. '
      + 'Gere de novo nos dias 30, 60 e 90 — o pré-registro continua igual, e é isso que permite conferir o que foi prometido.'));
    return box;
  }

  function secao(opts){
    // opts: { ajuda, linhas, colunas, campos, tabela, cliente, vazio:{titulo,texto} }
    const box = el('div');
    if(opts.ajuda) box.appendChild(el('p',{class:'muted', style:'margin:0 0 16px'}, opts.ajuda));

    if(!opts.linhas.length){
      const v = el('div',{class:'vazio'});
      if(opts.vazio && opts.vazio.titulo){
        v.appendChild(el('strong',{}, esc(opts.vazio.titulo)));
        v.appendChild(el('span',{}, esc(opts.vazio.texto || '')));
      } else {
        v.textContent = (opts.vazio && opts.vazio.texto) || opts.vazio || 'Nada registrado ainda.';
      }
      box.appendChild(v);
    } else {
      const w = el('div',{class:'wrap'});
      const t = el('table');
      const thead = el('thead'); const trh = el('tr');
      opts.colunas.forEach(col=> trh.appendChild(el('th',{}, esc(col.rotulo))));
      trh.appendChild(el('th',{},''));
      thead.appendChild(trh); t.appendChild(thead);
      const tb = el('tbody');
      opts.linhas.forEach(l=>{
        const tr = el('tr');
        opts.colunas.forEach(col=>{
          const td = el('td');
          if(col.chip){
            td.innerHTML = chip(col.chip, l[col.chave]);
          } else {
            const v = col.valor ? col.valor(l) : l[col.chave];
            const vazio = (v===null||v===undefined||v==='');
            td.innerHTML = vazio ? '<span class="muted">—</span>'
              : (col.forte ? '<span class="forte">'+esc(v)+'</span>' : esc(v));
          }
          tr.appendChild(td);
        });
        const acao = el('td',{style:'text-align:right;white-space:nowrap'});
        acao.appendChild(el('button',{class:'btn ghost small', onclick:async()=>{
          if(await apagar(opts.tabela, l.id)){ await carregarDetalhe(opts.cliente.id); render(); }
        }},'remover'));
        tr.appendChild(acao);
        tb.appendChild(tr);
      });
      t.appendChild(tb); w.appendChild(t); box.appendChild(w);
    }

    const det = el('details',{style:'margin-top:22px'});
    det.appendChild(el('summary',{class:'mono', style:'font-size:0.7rem;cursor:pointer;letter-spacing:0.08em;text-transform:uppercase;color:#6E6E6E'}, opts.rotuloAdd || '+ adicionar'));
    const form = el('form',{class:'card flat', style:'margin-top:12px'});
    const g = el('div',{class: opts.colunasForm===3 ? 'grid3' : 'grid2'});
    opts.campos.forEach(c=>{
      const opcoes = c.grupo ? opcoesDe(c.grupo) : c.opcoes;
      if(opcoes) g.appendChild(campoSelect(c.rotulo, c.nome, opcoes, c.padrao, c.dica));
      else if(c.tipo==='textarea'){
        const f = el('div',{class:'field', style:'grid-column:1/-1'});
        f.appendChild(el('label',{for:'f_'+c.nome}, esc(c.rotulo)));
        f.appendChild(el('textarea',{id:'f_'+c.nome, name:c.nome}));
        if(c.dica) f.appendChild(el('span',{class:'dica'}, esc(c.dica)));
        g.appendChild(f);
      }
      else g.appendChild(campo(c.rotulo, c.nome, c.tipo, c.padrao, c.dica));
    });
    form.appendChild(g);
    form.appendChild(el('button',{class:'btn small', type:'submit'},'Salvar'));
    form.addEventListener('submit', async e=>{
      e.preventDefault();
      const dados = lerForm(form);
      dados.cliente_id = opts.cliente.id;
      if(opts.validar){ const erro = opts.validar(dados); if(erro){ toast(erro); return; } }
      if(await inserir(opts.tabela, dados)){
        await carregarDetalhe(opts.cliente.id); render();
      }
    });
    det.appendChild(form);
    box.appendChild(det);
    return box;
  }

  function abaMetas(c){

        box.appendChild(el('div',{class:'erro', style:'margin:0 0 18px'},
          (linhas.length - completas) + (linhas.length - completas === 1 ? ' meta está' : ' metas estão')

    }

      tabela:'metas', cliente:c, linhas,

        {rotulo:'Em 30 dias', chave:'sucesso_30'},
        {rotulo:'Em 90 dias', chave:'sucesso_90'},
        {rotulo:'Deu errado se', valor:l=> (l.fracasso||'').trim() || null},

      ],

  function abaMarcos(c){

      box.appendChild(placar([
        { rotulo:'Cumpridos', valor: cumpridos + ' de ' + linhas.length, destaca:true, parte:cumpridos, de:linhas.length },
        { rotulo:'Atrasados', valor: atrasados, esconderSeZero:true },
        { rotulo:'Do cliente', valor: linhas.filter(l=>l.responsavel==='cliente').length },
      ]));
    }
    box.appendChild(secao({
      tabela:'marcos', cliente:c, linhas,
      vazio:{ titulo:'Nenhum marco definido',
              texto:'Três a cinco passos com data e dono. Os que forem do cliente entram na página que ele lê.' },
      rotuloAdd:'+ adicionar marco',
      colunas:[
        {rotulo:'Passo', chave:'titulo', forte:true},
        {rotulo:'Quem faz', chave:'responsavel', chip:'marcos_responsavel'},

  function abaHoras(c){
    const linhas = state.detalhe.horas;
    const total = linhas.reduce((s,l)=>s+(l.minutos||0),0);
    const fat = linhas.filter(l=>l.faturavel).reduce((s,l)=>s+(l.minutos||0),0);
    const box = el('div');
    if(linhas.length){
      box.appendChild(placar([
        { rotulo:'Horas no total', valor:(total/60).toFixed(1)+' h', destaca:true },
        { rotulo:'Faturáveis', valor:(fat/60).toFixed(1)+' h', parte:fat, de:Math.max(total,1) },
        { rotulo:'Lançamentos', valor:linhas.length },
      ]));
    }
    box.appendChild(secao({
      tabela:'horas', cliente:c, linhas,
      vazio:{ titulo:'Nenhuma hora lançada',
              texto:'Sem isso não dá pra saber se o preço cobre o custo, nem o que vale a pena automatizar.' },
      rotuloAdd:'+ lançar horas',
      colunasForm:3,
      colunas:[
        {rotulo:'Dia', valor:l=> soData(l.data)},
        {rotulo:'O que foi feito', chave:'atividade', forte:true},
        {rotulo:'Tipo', valor:l=> rotulo('horas_categoria', l.categoria)},
        {rotulo:'Tempo', valor:l=> l.minutos >= 60 ? (l.minutos/60).toFixed(1)+' h' : l.minutos+' min'},
        {rotulo:'Quem', chave:'quem'},
        {rotulo:'Cobra do cliente', valor:l=> l.faturavel ? 'Sim' : 'Não'},
      ],
      campos:[
        {rotulo:'Dia', nome:'data', tipo:'date', padrao:new Date().toISOString().slice(0,10)},
        {rotulo:'Quantos minutos', nome:'minutos', tipo:'number', dica:'Uma hora e meia = 90'},
        {rotulo:'Quem fez', nome:'quem'},
        {rotulo:'Tipo', nome:'categoria', grupo:'horas_categoria', padrao:'conteudo'},
        {rotulo:'Cobra do cliente', nome:'faturavel', opcoes:[['true','Sim'],['false','Não']], padrao:'true',
         dica:'Reunião de venda e retrabalho nosso não se cobra — mas se lança, senão a conta do custo mente.'},
        {rotulo:'O que foi feito', nome:'atividade'},
      ],
      validar:d=>{
        if(!d.atividade) return 'Descreva a atividade.';
        if(!d.minutos || d.minutos<=0) return 'Minutos precisa ser maior que zero.';
        d.faturavel = String(d.faturavel) === 'true';
        return null;
      },
    }));
    return box;
  }

  // ---------- sessão ----------

  // O link de acesso volta com os tokens no fragmento da URL. O supabase-js consome
  // sozinho; aqui a gente só pesca o erro (link expirado, já usado) e limpa a barra.
  function lerRetornoDoLink(){
    const h = window.location.hash || '';
    if(h.includes('error')){
      const p = new URLSearchParams(h.replace(/^#/, ''));
      const d = (p.get('error_description') || '').toLowerCase();
      state.erro = (d.includes('expired') || d.includes('invalid'))
        ? 'Esse link expirou ou já foi usado. Peça um novo.'
        : 'O link não funcionou: ' + (p.get('error_description') || p.get('error'));
    }
    if(h.includes('access_token') || h.includes('error')){
      history.replaceState(null, '', window.location.pathname + window.location.search);
    }
  }

  async function iniciarSessao(){
    state.carregando = true; render();
    lerRetornoDoLink();
    const { data:{ session } } = await sb.auth.getSession();
    state.user = session ? session.user : null;
    if(state.user){
      const { data, error } = await sb.rpc('is_bora_member');
      state.membro = !error && data === true;
      if(state.membro) await carregarTudo();
    }
    state.carregando = false;
    render();
  }

  async function sair(){
    await sb.auth.signOut();
    state.user = null; state.membro = false; state.clientes = []; state.inbox = [];
    state.tudo = { acessos:[], metas:[], baselines:[], marcos:[], conformidade:[], horas:[] };
    state.vista = { tipo:'agora' };
    state.linkEnviadoPara = null; state.modoLogin = 'link'; state.erro = null;
    render();
  }

  iniciarSessao();
})();
