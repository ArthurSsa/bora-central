  const TIPOS_ARQUIVO = [
    ['manual', 'Manual da marca'],
    ['logo',   'Logo'],
    ['fonte',  'Fonte'],
    ['foto',   'Foto oficial'],
    ['outro',  'Outro'],
  ];

  // O navegador manda fonte com tipo vazio ou com um tipo antigo que o balde
  // recusa. O balde tem lista de tipos permitidos de propósito — é o que
  // impede alguém de guardar um executável ali — então quem corrige é aqui,
  // pela extensão, e não a lista lá.
  const MIME_POR_EXT = {
    pdf:'application/pdf', png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg',
    svg:'image/svg+xml', webp:'image/webp', ttf:'font/ttf', otf:'font/otf',
    woff:'font/woff', woff2:'font/woff2', zip:'application/zip',
  };
  const extDe = nome => String(nome || '').split('.').pop().toLowerCase();
  const mimeDe = f => MIME_POR_EXT[extDe(f.name)] || f.type || 'application/octet-stream';
  const peso = b => !b ? '' : b < 1048576 ? Math.max(1, Math.round(b/1024)) + ' KB'
    : (b/1048576).toFixed(b < 10485760 ? 1 : 0) + ' MB';

  // O que a fábrica põe na peça de verdade: o logo no canto, o selo, a foto
  // oficial. Balde à parte do manual — a fábrica baixa só estes, e precisa do
  // tamanho de cada um pra pôr o logo com 140 px sem adivinhar a escala; o
  // tamanho se mede aqui, na hora de subir. A fábrica usa o primeiro logo.
  const TIPOS_ELEMENTO = [['logo','Logo'], ['selo','Selo'], ['foto','Foto']];
  const MIMES_ELEMENTO = ['image/png', 'image/jpeg', 'image/webp', 'image/svg+xml', 'application/pdf', 'application/postscript'];
  // Em vetor o logo fica nítido em qualquer tamanho e ganha a versão de uma cor;
  // o navegador não mede PDF, AI e EPS — quem mede é a fábrica, no VectorCraft.
  const VETOR_ELEMENTO = /\.(svg|pdf|ai|eps)$/i;
  const mimeDoElemento = f => ({ ai:'application/postscript', eps:'application/postscript' })[extDe(f.name)] || mimeDe(f);

  function medirImagem(f){
    return new Promise((ok, falha) => {
      const url = URL.createObjectURL(f);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); ok([img.naturalWidth, img.naturalHeight]); };
      img.onerror = () => { URL.revokeObjectURL(url); falha(new Error('não abriu como imagem')); };
      img.src = url;
    });
  }

  function blocoElementos(c, box){
    box.appendChild(el('p',{class:'rot laranja', style:'margin-top:26px'},'O que entra nas peças'));
    box.appendChild(el('p',{class:'dica', style:'margin:6px 0 10px'},
      'O logo, o selo e as fotos oficiais que a fábrica põe nas peças deste cliente. O logo de preferência em vetor (SVG, PDF, AI ou EPS): '
      + 'fica nítido em qualquer tamanho, até no cartaz, e quando uma cor dele some no fundo a fábrica usa a versão de uma cor. '
      + 'Senão, PNG com fundo transparente. Sem logo aqui, a peça sai sem logo: a fábrica não desenha nem inventa um.'));
    let tipo = 'logo';
    const tipos = el('div',{class:'chips', style:'margin-bottom:10px', role:'group', 'aria-label':'O que é a imagem'});
    TIPOS_ELEMENTO.forEach(([k, nome]) => tipos.appendChild(el('button',{class:'chip-p', type:'button', 'aria-pressed':String(k === tipo),
      onclick:()=>{ tipo = k; tipos.querySelectorAll('.chip-p').forEach((b, i) => b.setAttribute('aria-pressed', String(TIPOS_ELEMENTO[i][0] === k))); }}, nome)));
    box.appendChild(tipos);
    const entrada = el('input',{type:'file', class:'el-entrada', style:'display:none', accept:'.png,.jpg,.jpeg,.webp,.svg,.pdf,.ai,.eps'});
    const botao = el('button',{class:'btn small', type:'button', onclick:()=>entrada.click()}, 'Subir imagem');
    box.appendChild(botao); box.appendChild(entrada);
    const lista = el('div',{class:'idv-arqs el-lista'});
    box.appendChild(lista);

    // A tela de Criar se redesenha sozinha (sinal da fábrica, eventos da fila)
    // e cada redesenho recria este bloco. A lista e os links ficam no estado,
    // por cliente: o redesenho pinta na hora o que já se sabe.
    const E = state.estudio;
    const cache = E.elementos || (E.elementos = {});
    const urls = E.urlsElementos || (E.urlsElementos = {});
    const subidos = E.elementosSubidos || (E.elementosSubidos = new Set());
    const itens = () => cache[c.id] || [];
    entrada.addEventListener('change', ()=>{ const f = entrada.files && entrada.files[0]; entrada.value = ''; if(f) subir(f); });
    async function subir(f){
      const mime = mimeDoElemento(f);
      if(!MIMES_ELEMENTO.includes(mime)){ toast('Aqui entra SVG, PDF, AI, EPS, PNG, JPEG ou WebP.'); return; }
      if(f.size > 20 * 1048576){ toast('Passa de 20 MB. Exporte menor.'); return; }
      const vetor = VETOR_ELEMENTO.test(f.name);
      let medida = [null, null];
      if(!vetor){ try { medida = await medirImagem(f); } catch(e){ toast('Não deu pra abrir: ' + e.message); return; } }
      botao.disabled = true; botao.textContent = 'Subindo ' + peso(f.size) + '…';
      const pronto = () => { botao.disabled = false; botao.textContent = 'Subir imagem'; };
      const caminho = c.id + '/' + Date.now() + '-' + f.name.replace(/[^\w.\-]+/g,'-').slice(-80);
      const up = await sb.storage.from('elementos').upload(caminho, f, { contentType:mime, upsert:false });
      if(up.error){ pronto(); toast('Não subiu: ' + up.error.message); return; }
      const { data, error } = await sb.from('marca_elementos').insert({ cliente_id:c.id, tipo, caminho, nome:f.name,
        bytes:f.size, mime, largura:medida[0], altura:medida[1] }).select().single();
      pronto();
      if(error){ await sb.storage.from('elementos').remove([caminho]); toast('Não deu: ' + error.message); return; }
      subidos.add(data.id);
      cache[c.id] = [...itens(), data];
      toast('Guardado. Entra nas próximas peças.');
      // A tela pode ter se redesenhado durante o envio: quem mostra é o bloco que está nela agora.
      render();
    }

    async function pintar(){
      if(!itens().length){
        lista.innerHTML = '';
        const p = el('p',{class:'dica', style:'margin-top:12px'}); p.textContent = 'Nenhuma imagem ainda para ' + (c.nome_preferido || c.nome) + '.';
        lista.appendChild(p);
        return;
      }
      const faltam = itens().map(x => x.caminho).filter(k => !urls[k]);
      if(faltam.length){
        const { data } = await sb.storage.from('elementos').createSignedUrls(faltam, 3600);
        for(const d of data || []) if(d.signedUrl) urls[d.path] = d.signedUrl;
      }
      lista.innerHTML = '';
      itens().forEach(a => {
        const l = el('div',{class:'idv-arq el-item'});
        // PDF, AI e EPS o navegador não desenha: a miniatura fica vazia, e o "vetor" ao lado diz o que é.
        l.appendChild(urls[a.caminho] && !/\.(pdf|ai|eps)$/i.test(a.caminho) ? el('img',{class:'el-mini', src:urls[a.caminho], alt:''}) : el('span',{class:'el-mini'}));
        const tag = el('span',{class:'tag'}); tag.textContent = (TIPOS_ELEMENTO.find(t => t[0] === a.tipo) || [a.tipo, a.tipo])[1];
        const nm = el('span',{class:'nm'}); nm.textContent = a.nome;
        const pq = el('span',{class:'pq'}); pq.textContent = (VETOR_ELEMENTO.test(a.caminho) ? 'vetor · ' : a.largura && a.altura ? a.largura + '×' + a.altura + ' · ' : '') + peso(a.bytes);
        [tag, nm, pq].forEach(n => l.appendChild(n));
        l.appendChild(el('button',{class:'lixo', 'aria-label':'Apagar ' + a.nome, onclick:async()=>{
          if(!confirm('Apagar "' + a.nome + '"? As próximas peças saem sem ele.')) return;
          const r = await sb.from('marca_elementos').delete().eq('id', a.id);
          if(r.error){ toast('Não deu: ' + r.error.message); return; }
          await sb.storage.from('elementos').remove([a.caminho]);
          cache[c.id] = itens().filter(x => x.id !== a.id);
          toast('Apagado.'); render();
        }},'×'));
        lista.appendChild(l);
      });
    }
    pintar();
    // A mesma ordem em que a fábrica lê: o primeiro logo é o que vai pra peça.
    // Uma leitura que saiu antes de um envio terminar não apaga o que subiu.
    sb.from('marca_elementos').select('*').eq('cliente_id', c.id).order('criado_em')
      .then(({ data, error }) => {
        if(error) return;
        const lidos = new Set((data || []).map(x => x.id));
        cache[c.id] = [...(data || []), ...itens().filter(x => subidos.has(x.id) && !lidos.has(x.id))];
        if(lista.isConnected) pintar();
      });
  }

  // ---------- trilhas da marca ----------
  // A música que entra nos vídeos: a abertura e o carrossel em vídeo saem com
  // ela, e no reel ela fica por baixo da fala, abaixando onde há legenda. Só
  // música que o cliente tem direito de usar — cada uma diz de onde vem a
  // licença. Nada aqui gera música: sem trilha, o vídeo sai sem.
  const EXT_TRILHA = { mp3:'audio/mpeg', wav:'audio/wav', flac:'audio/flac', aif:'audio/aiff', aiff:'audio/aiff', ogg:'audio/ogg' };
  const trilhasLidas = () => state.trilhas || (state.trilhas = {});
  const trilhasDe = id => trilhasLidas()[id];   // undefined: ainda não leu
  const lendoTrilhas = {};
  function carregarTrilhas(clienteId){
    if(lendoTrilhas[clienteId]) return lendoTrilhas[clienteId];
    return lendoTrilhas[clienteId] = (async () => {
      const { data, error } = await sb.from('marca_trilhas').select('*').eq('cliente_id', clienteId).order('criado_em');
      if(error){ toast('Não deu pra ler as trilhas: ' + error.message); trilhasLidas()[clienteId] = []; return; }
      trilhasLidas()[clienteId] = data || [];
    })().finally(() => { delete lendoTrilhas[clienteId]; });
  }
  const mmss = s => s == null ? '' : Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0');

  function duracaoDoAudio(f){
    return new Promise(ok => {
      const url = URL.createObjectURL(f);
      const a = new Audio();
      const fim = v => { URL.revokeObjectURL(url); ok(v); };
      a.preload = 'metadata';
      a.onloadedmetadata = () => fim(isFinite(a.duration) ? Math.round(a.duration * 10) / 10 : null);
      a.onerror = () => fim(null);
      a.src = url;
    });
  }

  function blocoTrilhas(c, box){
    box.appendChild(el('p',{class:'rot laranja', style:'margin-top:26px'},'Trilhas dos vídeos'));
    box.appendChild(el('p',{class:'dica', style:'margin:6px 0 10px'},
      'A música que entra na abertura, no carrossel em vídeo e por baixo da fala do reel — abaixando onde a pessoa fala. '
      + 'Só música que o cliente tem direito de usar: anote de onde vem a licença. A padrão entra quando o pedido não escolhe; '
      + 'sem trilha, o vídeo sai sem música.'));
    const lista = el('div',{class:'idv-arqs tr-lista'});
    const lidas = trilhasDe(c.id);
    if(!lidas){ lista.appendChild(el('p',{class:'muted'},'Lendo as trilhas…')); carregarTrilhas(c.id).then(()=>{ if(lista.isConnected) render(); }); }
    else if(!lidas.length) lista.appendChild(el('p',{class:'dica', style:'margin:0 0 10px'},'Nenhuma trilha ainda.'));
    else lidas.forEach(t => lista.appendChild(linhaDaTrilha(c, t)));
    box.appendChild(lista);

    const form = el('div',{class:'tr-form'});
    const arq = el('input',{type:'file', class:'tr-arquivo', style:'display:none', accept:'.mp3,.wav,.flac,.aif,.aiff,.ogg', 'aria-label':'Arquivo da trilha'});
    const escolher = el('button',{class:'btn ghost small', type:'button', onclick:()=>arq.click()}, 'Escolher a música');
    const escolhido = el('span',{class:'tr-escolhido'}); escolhido.textContent = 'MP3, WAV, FLAC, AIFF ou OGG, até 30 MB.';
    const nome = el('input',{type:'text', class:'tr-nome', maxlength:'120', placeholder:'Nome (ex.: Violão calmo)', 'aria-label':'Nome da trilha'});
    const licenca = el('input',{type:'text', class:'tr-licenca', maxlength:'300', placeholder:'De onde vem o direito de uso (ex.: Artlist, licença 4821)', 'aria-label':'Licença da trilha'});
    arq.addEventListener('change', ()=>{
      const f = arq.files && arq.files[0];
      if(!f) return;
      escolhido.textContent = f.name + ' · ' + peso(f.size);
      if(!nome.value.trim()) nome.value = f.name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ').slice(0, 120);
    });
    const botao = el('button',{class:'btn small', type:'button'}, 'Subir trilha');
    botao.addEventListener('click', async ()=>{
      const f = arq.files && arq.files[0];
      if(!f){ toast('Escolha o arquivo da música.'); return; }
      const ext = extDe(f.name);
      if(!EXT_TRILHA[ext]){ toast('Aqui entra MP3, WAV, FLAC, AIFF ou OGG.'); return; }
      if(f.size > 30 * 1048576){ toast('Passa de 30 MB. Mande em MP3.'); return; }
      if(licenca.value.trim().length < 3){ toast('Diga de onde vem o direito de usar esta música.'); licenca.focus(); return; }
      botao.disabled = true; botao.textContent = 'Subindo ' + peso(f.size) + '…';
      const pronto = () => { botao.disabled = false; botao.textContent = 'Subir trilha'; };
      const segundos = await duracaoDoAudio(f);
      const caminho = c.id + '/' + Date.now() + '-' + f.name.replace(/[^\w.\-]+/g,'-').slice(-80);
      const up = await sb.storage.from('trilhas').upload(caminho, f, { contentType:EXT_TRILHA[ext], upsert:false });
      if(up.error){ pronto(); toast('Não subiu: ' + up.error.message); return; }
      const primeira = !(trilhasDe(c.id) || []).length;
      const { data, error } = await sb.from('marca_trilhas').insert({ cliente_id:c.id, nome:nome.value.trim() || f.name, licenca:licenca.value.trim(),
        caminho, bytes:f.size, mime:EXT_TRILHA[ext], segundos, padrao:primeira }).select().single();
      pronto();
      if(error){ await sb.storage.from('trilhas').remove([caminho]); toast('Não deu: ' + error.message); return; }
      trilhasLidas()[c.id] = [...(trilhasDe(c.id) || []), data];
      toast(primeira ? 'Guardada, e é a padrão dele.' : 'Guardada.');
      render();
    });
    [escolher, escolhido, arq, nome, licenca, botao].forEach(n => form.appendChild(n));
    box.appendChild(form);
  }

  function linhaDaTrilha(c, t){
    const l = el('div',{class:'idv-arq tr-item'});
    const tag = el('span',{class:'tag'}); tag.textContent = t.padrao ? 'Padrão' : 'Trilha';
    const nm = el('span',{class:'nm'}); nm.textContent = t.nome;
    const lic = el('span',{class:'pq'}); lic.textContent = (t.segundos ? mmss(t.segundos) + ' · ' : '') + 'licença: ' + t.licenca;
    [tag, nm, lic].forEach(n => l.appendChild(n));
    l.appendChild(el('button',{class:'btn ghost small', type:'button', onclick:async (e)=>{
      // O balde é fechado: o link pra ouvir é assinado na hora.
      const botao = e.currentTarget;
      const { data, error } = await sb.storage.from('trilhas').createSignedUrl(t.caminho, 600);
      if(error){ toast('Não consegui abrir: ' + error.message); return; }
      const a = el('audio',{controls:'', src:data.signedUrl, class:'tr-player'});
      botao.replaceWith(a); a.play().catch(()=>{});
    }}, 'Ouvir'));
    if(!t.padrao) l.appendChild(el('button',{class:'btn ghost small', type:'button', onclick:async ()=>{
      // Uma padrão por cliente: a de antes sai primeiro.
      const a = await sb.from('marca_trilhas').update({ padrao:false }).eq('cliente_id', c.id).eq('padrao', true);
      const b = a.error ? a : await sb.from('marca_trilhas').update({ padrao:true }).eq('id', t.id);
      if(b.error){ toast('Não deu: ' + b.error.message); return; }
      trilhasLidas()[c.id] = (trilhasDe(c.id) || []).map(x => Object.assign({}, x, { padrao: x.id === t.id }));
      toast('Agora é a padrão.'); render();
    }}, 'Usar como padrão'));
    l.appendChild(el('button',{class:'lixo', 'aria-label':'Apagar ' + t.nome, onclick:async ()=>{
      if(!confirm('Apagar "' + t.nome + '"? Pedido que escolheu esta trilha sai sem música.')) return;
      const r = await sb.from('marca_trilhas').delete().eq('id', t.id);
      if(r.error){ toast('Não deu: ' + r.error.message); return; }
      await sb.storage.from('trilhas').remove([t.caminho]);
      trilhasLidas()[c.id] = (trilhasDe(c.id) || []).filter(x => x.id !== t.id);
      toast('Apagada.'); render();
    }},'×'));
    return l;
  }

  /**
   * A escolha de música de um pedido de vídeo: a padrão da marca, uma
   * trilha dela, ou sem música. Devolve o campo pronto (ou uma dica, se o
   * cliente não tem trilha). valor: '' é a padrão, 'nenhuma' é sem música.
   */
  function escolhaDeMusica(clienteId, valor, aoMudar, id){
    const ts = trilhasDe(clienteId);
    if(!ts){ carregarTrilhas(clienteId).then(render); return el('p',{class:'muted'},'Lendo as trilhas…'); }
    if(!ts.length){
      const d = el('p',{class:'dica', style:'margin:0'});
      d.textContent = 'Este cliente ainda não tem trilha na Marca: o vídeo sai sem música.';
      return d;
    }
    const padrao = ts.find(t => t.padrao);
    const s = el('select',{id, 'aria-label':'Música'});
    const opcao = (v, rot) => { const o = el('option',{value:v}); o.textContent = rot; if(v === valor) o.selected = true; s.appendChild(o); };
    opcao('', padrao ? 'A padrão da marca (' + padrao.nome + ')' : 'A padrão da marca (nenhuma escolhida: sem música)');
    ts.filter(t => !t.padrao).forEach(t => opcao(t.id, t.nome));
    opcao('nenhuma', 'Sem música');
    s.addEventListener('change', ()=>aoMudar(s.value));
    return s;
  }

  function blocoIdentidade(c, aoMudar){
    const box = el('div',{class:'bloco', style:'margin-top:18px'});
    box.appendChild(el('p',{class:'rot'},'Identidade visual'));
    box.appendChild(el('p',{class:'intro', style:'margin:6px 0 4px'},
      'O manual dele, traduzido pro que a peça usa. Preenchido uma vez, vale pra todas as peças: '
      + 'é o que faz “mudar rápido” ser mudar rápido, e não refazer tudo.'));

    const m0 = marcaDe(c);
    const grava = async campos => {
      if(await salvarMarca(c, campos)){ toast('Salvo.'); if(aoMudar) aoMudar(); return true; }
      return false;
    };

    // ---- 1. o arquivo ----

    box.appendChild(el('p',{class:'rot laranja', style:'margin-top:22px'},'O arquivo da identidade'));

    const solta = el('div',{class:'idv-solta'});
    const espera = el('div',{class:'idv-espera'});
    espera.innerHTML =
      '<b>O que mandar aqui</b>'
      + '<ul>'
      + '<li>O <b>manual / identidade visual</b> em PDF — o arquivo do Canva exportado serve.</li>'
      + '<li>O <b>logo</b> em PNG com fundo transparente, ou em SVG.</li>'
      + '<li>A <b>fonte</b> da marca em .otf ou .ttf, se vocês tiverem o direito de uso dela.</li>'
      + '<li>As <b>fotos oficiais</b> que se repetem: retrato, bastidor, o que sempre volta.</li>'
      + '</ul>'
      + '<p style="margin:12px 0 0"><b>O que a Central faz com ele:</b> guarda como referência, e só. '
      + 'Ninguém lê o PDF nem adivinha regra nenhuma de dentro dele. '
      + 'O que a fábrica <b>aplica</b> nas peças é o que estiver preenchido logo abaixo — as imagens de '
      + '“O que entra nas peças”, a paleta, os conjuntos, a tipografia e os obrigatórios. O arquivo serve '
      + 'pra preencher isso uma vez e pra conferir depois, quando alguém perguntar de onde saiu aquela cor.</p>'
      + '<p style="margin:10px 0 0">Até 100 MB por arquivo. Fica guardado em pasta fechada: '
      + 'só a equipe abre.</p>';
    solta.appendChild(espera);

    const escolhaTipo = el('div',{class:'chips', style:'margin-bottom:10px'});
    let tipoAtual = 'manual';
    TIPOS_ARQUIVO.forEach(([k, nome])=>{
      escolhaTipo.appendChild(el('button',{class:'chip-p', 'aria-pressed':String(k === tipoAtual),
        onclick:()=>{ tipoAtual = k;
          escolhaTipo.querySelectorAll('.chip-p').forEach((b,i)=>
            b.setAttribute('aria-pressed', String(TIPOS_ARQUIVO[i][0] === k))); }}, esc(nome)));
    });
    solta.appendChild(el('p',{class:'dica', style:'margin:0 0 6px'},'O que é este arquivo:'));
    solta.appendChild(escolhaTipo);

    const entrada = el('input',{type:'file', style:'display:none',
      accept:'.pdf,.png,.jpg,.jpeg,.svg,.webp,.ttf,.otf,.woff,.woff2,.zip'});
    const btnMandar = el('button',{class:'btn small', onclick:()=>entrada.click()},'Escolher arquivo');
    solta.appendChild(btnMandar);
    solta.appendChild(entrada);
    solta.appendChild(el('span',{class:'dica', style:'margin-top:8px'},
      'Ou arraste o arquivo pra cima desta caixa.'));

    const lista = el('div',{class:'idv-arqs'});
    solta.appendChild(lista);
    box.appendChild(solta);

    // Arrastar pra cima da caixa. O preventDefault no dragover é obrigatório:
    // sem ele o navegador abre o PDF numa aba e o arquivo não chega aqui.
    ['dragenter','dragover'].forEach(ev => solta.addEventListener(ev, e=>{
      e.preventDefault(); solta.classList.add('sobre'); }));
    ['dragleave','drop'].forEach(ev => solta.addEventListener(ev, e=>{
      e.preventDefault(); solta.classList.remove('sobre'); }));
    solta.addEventListener('drop', e=>{
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if(f) mandar(f);
    });
    entrada.addEventListener('change', ()=>{
      if(entrada.files && entrada.files[0]) mandar(entrada.files[0]);
      entrada.value = '';
    });

    async function mandar(f){
      const mime = mimeDe(f);
      if(!Object.values(MIME_POR_EXT).includes(mime)){
        toast('Esse tipo de arquivo não entra aqui: ' + extDe(f.name)); return;
      }
      if(f.size > 100 * 1048576){ toast('Passa de 100 MB. Exporte em qualidade menor.'); return; }
      btnMandar.disabled = true;
      btnMandar.textContent = 'Mandando ' + peso(f.size) + '…';
      // O caminho leva o id do cliente na frente: é isso que deixa a política
      // do balde e a limpeza por cliente serem uma coisa só.
      const limpo = f.name.replace(/[^\w.\-]+/g,'-').slice(-80);
      const caminho = c.id + '/' + Date.now() + '-' + limpo;
      const up = await sb.storage.from('identidades').upload(caminho, f, { contentType:mime, upsert:false });
      if(up.error){
        btnMandar.disabled = false; btnMandar.textContent = 'Escolher arquivo';
        toast('Não subiu: ' + up.error.message); return;
      }
      const { data, error } = await sb.from('marca_arquivos').insert({
        cliente_id:c.id, tipo:tipoAtual, caminho, nome:f.name, bytes:f.size, mime,
      }).select().single();
      btnMandar.disabled = false; btnMandar.textContent = 'Escolher arquivo';
      if(error){
        // A linha não entrou: o arquivo solto no balde vira lixo que ninguém
        // mais enxerga. Tira ele de volta em vez de deixar acumular.
        await sb.storage.from('identidades').remove([caminho]);
        toast('Não deu: ' + error.message); return;
      }
      arquivos.unshift(data);
      toast('Guardado.');
      pintarLista();
    }

    let arquivos = [];
    function pintarLista(){
      lista.innerHTML = '';
      if(!arquivos.length){
        lista.appendChild(el('p',{class:'dica', style:'margin-top:12px'},
          'Nada guardado ainda para ' + esc(c.nome_preferido || c.nome) + '.'));
        return;
      }
      arquivos.forEach(a=>{
        const l = el('div',{class:'idv-arq'});
        l.appendChild(el('span',{class:'tag'},
          esc((TIPOS_ARQUIVO.find(t => t[0] === a.tipo) || ['','—'])[1])));
        l.appendChild(el('span',{class:'nm'}, esc(a.nome)));
        l.appendChild(el('span',{class:'pq'}, esc(peso(a.bytes))));
        l.appendChild(el('button',{class:'btn ghost small', onclick:async()=>{
          // Link assinado, curto. O balde é fechado: sem isto não há URL que
          // abra, e é assim que tem que ser — manual de cliente não fica
          // servido num endereço que qualquer um adivinha.
          const { data, error } = await sb.storage.from('identidades').createSignedUrl(a.caminho, 120);
          if(error){ toast('Não consegui abrir: ' + error.message); return; }
          window.open(data.signedUrl, '_blank', 'noopener');
        }},'Abrir'));
        l.appendChild(el('button',{class:'lixo', 'aria-label':'Apagar ' + esc(a.nome), onclick:async()=>{
          if(!confirm('Apagar "' + a.nome + '"? Isso não volta.')) return;
          const r = await sb.from('marca_arquivos').delete().eq('id', a.id);
          if(r.error){ toast('Não deu: ' + r.error.message); return; }
          await sb.storage.from('identidades').remove([a.caminho]);
          arquivos = arquivos.filter(x => x.id !== a.id);
          toast('Apagado.'); pintarLista();
        }},'×'));
        lista.appendChild(l);
      });
    }
    pintarLista();
    sb.from('marca_arquivos').select('*').eq('cliente_id', c.id)
      .order('enviado_em', { ascending:false })
      .then(({ data, error })=>{
        if(error) return;
        arquivos = data || [];
        pintarLista();
      });

    blocoElementos(c, box);
    blocoTrilhas(c, box);

    // ---- 2. a paleta ----

    box.appendChild(el('p',{class:'rot laranja', style:'margin-top:26px'},'A paleta do manual'));
    box.appendChild(el('p',{class:'dica', style:'margin:6px 0 0'},
      'Cada cor com o nome que o manual dá a ela e com o uso que o manual manda. '
      + 'O uso é a parte que vale: cor sem uso é só um código, e código solto é como alguém '
      + 'acaba usando a cor de posicionamento numa peça de rua.'));
    const palCx = el('div');
    box.appendChild(palCx);

    function pintarPaleta(){
      palCx.innerHTML = '';
      const pal = (marcaDe(c).paleta || []).slice();
      const salvar = () => grava({ paleta: pal });
      pal.forEach((p, i)=>{
        const l = el('div',{class:'pal-linha'});
        const cor = el('input',{type:'color', value: p.cor || '#000000'});
        cor.addEventListener('change', ()=>{ pal[i].cor = cor.value; salvar().then(pintarConjuntos); });
        const nome = el('input',{type:'text', value:p.nome || '', placeholder:'Nome (ex.: Roxo)'});
        nome.addEventListener('change', ()=>{ pal[i].nome = nome.value.trim(); salvar(); });
        const uso = el('input',{type:'text', class:'uso', value:p.uso || '',
          placeholder:'Pra que o manual manda usar'});
        uso.addEventListener('change', ()=>{ pal[i].uso = uso.value.trim(); salvar(); });
        const x = el('button',{class:'lixo', 'aria-label':'Tirar esta cor', onclick:()=>{
          pal.splice(i,1); salvar().then(()=>{ pintarPaleta(); pintarConjuntos(); });
        }},'×');
        [cor, nome, uso, x].forEach(n => l.appendChild(n));
        palCx.appendChild(l);
      });
      palCx.appendChild(el('button',{class:'btn ghost small', style:'margin-top:12px', onclick:()=>{
        pal.push({ nome:'', cor: c.cor || '#FF5E00', uso:'' });
        salvar().then(()=>{ pintarPaleta(); pintarConjuntos(); });
      }}, pal.length ? '+ outra cor' : '+ primeira cor'));
    }
    pintarPaleta();

    // ---- 3. os conjuntos ----

    box.appendChild(el('p',{class:'rot laranja', style:'margin-top:28px'},'Conjuntos prontos'));
    box.appendChild(el('p',{class:'dica', style:'margin:6px 0 0'},
      'Um conjunto é uma combinação já aprovada: qual fundo com qual texto, e em que tipo de assunto. '
      + 'É o que o manual realmente diz — ele quase nunca diz “a cor da marca é esta”, ele diz em que '
      + 'situação usa qual. Com os conjuntos preenchidos, a peça deixa de ser derivada de uma cor só e '
      + 'passa a ser escolhida numa lista de três ou quatro.'));
    const conjCx = el('div');
    box.appendChild(conjCx);

    function pintarConjuntos(){
      conjCx.innerHTML = '';
      const mm = marcaDe(c);
      const cjs = (mm.conjuntos || []).slice();
      const pal = mm.paleta || [];
      const salvar = () => grava({ conjuntos: cjs });
      const grade = el('div',{class:'conj-grade'});

      cjs.forEach((j, i)=>{
        const cart = el('div',{class:'conj-cartao'});

        const am = el('div',{class:'conj-amostra'});
        function pintarAmostra(){
          const fundo = j.fundo || '#F5F2EC';
          const tinta = j.tinta || tintaPara(fundo, j.destaque || c.cor || '#FF5E00', 7);
          am.style.background = fundo;
          am.innerHTML = '';
          const t = el('div',{class:'t'}, esc(j.nome || 'Sem nome ainda'));
          t.style.color = tinta;
          const a = el('div',{class:'a'}, esc(j.quando || 'em que assunto se usa'));
          // O "quando" usa a cor do TEXTO, não a de destaque. Parece detalhe e
          // não é: rosa sobre roxo é uma combinação legítima do manual pra uma
          // faixa, e ilegível pra uma linha de texto — pintar a linha com a cor
          // de destaque fazia o próprio cartão do conjunto virar exemplo do
          // erro que ele existe pra evitar.
          a.style.color = tinta;
          const barras = el('div',{style:'display:flex;gap:6px;align-items:center'});
          [j.destaque, j.faixa].filter(Boolean).forEach(cor=>{
            const f = el('div',{class:'f'});
            f.style.background = cor;
            barras.appendChild(f);
          });
          am.appendChild(t); am.appendChild(a); am.appendChild(barras);
          // A conta de contraste é a mesma da norma, e aparece aqui porque um
          // conjunto do manual pode simplesmente não ler — manual feito pra
          // cartaz de rua não pensou em texto de 28px no celular. O Estúdio
          // não conserta a escolha dele; avisa, e quem decide é a pessoa.
          const r = contraste(tinta, fundo);
          const av = el('div',{class:'a', style:'margin-top:4px;opacity:.85'},
            r >= 4.5 ? '✓ lê bem (' + r.toFixed(1) + ':1)'
                     : '⚠ contraste baixo (' + r.toFixed(1) + ':1) — o mínimo da norma é 4,5:1');
          av.style.color = r >= 4.5 ? tinta : (contraste('#B00020', fundo) >= 3 ? '#B00020' : tinta);
          am.appendChild(av);
        }
        pintarAmostra();
        cart.appendChild(am);

        const corpo = el('div',{class:'conj-corpo'});
        const nome = el('input',{type:'text', value:j.nome || '', placeholder:'Nome (ex.: Tema leve)'});
        nome.addEventListener('input', ()=>{ j.nome = nome.value; pintarAmostra(); });
        nome.addEventListener('change', ()=>{ j.nome = nome.value.trim(); salvar(); });
        corpo.appendChild(nome);
        const quando = el('input',{type:'text', value:j.quando || '',
          placeholder:'Quando usar (ex.: dia a dia, pauta leve)'});
        quando.addEventListener('input', ()=>{ j.quando = quando.value; pintarAmostra(); });
        quando.addEventListener('change', ()=>{ j.quando = quando.value.trim(); salvar(); });
        corpo.appendChild(quando);

        const cores = el('div',{class:'conj-cores'});
        [['fundo','Fundo'],['tinta','Texto'],['destaque','Destaque'],['faixa','Faixa']].forEach(([k, rot])=>{
          const cx = el('div',{class:'conj-cor'});
          cx.appendChild(el('span',{}, rot));
          const inp = el('input',{type:'color', value: j[k] || (k === 'fundo' ? '#F5F2EC' : '#1A1815')});
          inp.addEventListener('input', ()=>{ j[k] = inp.value; pintarAmostra(); });
          inp.addEventListener('change', ()=>{ j[k] = inp.value; salvar(); });
          cx.appendChild(inp);
          cores.appendChild(cx);
        });
        corpo.appendChild(cores);

        // Puxar da paleta. Sem isto, as cores do conjunto são digitadas de novo
        // e acabam divergindo por um dígito do que está lá em cima — e paleta
        // que diverge do conjunto é pior do que paleta nenhuma.
        if(pal.length){
          corpo.appendChild(el('p',{class:'dica', style:'margin:2px 0 0'},'Pôr uma cor da paleta no fundo:'));
          const puxa = el('div',{class:'chips'});
          pal.forEach(p=>{
            const b = el('button',{class:'chip-p', title: esc(p.uso || ''), onclick:()=>{
              j.fundo = p.cor;
              // O texto acompanha, calculado em cima do fundo novo: trocar o
              // fundo e deixar o texto velho é o jeito mais rápido de gerar
              // um conjunto ilegível sem perceber.
              j.tinta = tintaPara(p.cor, j.destaque || c.cor || p.cor, 7);
              salvar().then(pintarConjuntos);
            }}, esc(p.nome || p.cor));
            b.style.borderLeft = '10px solid ' + p.cor;
            puxa.appendChild(b);
          });
          corpo.appendChild(puxa);
        }

        const pe = el('div',{class:'conj-pe'});
        const ehPadrao = (marcaDe(c).conjuntoPadrao || '') === j.k;
        pe.appendChild(el('button',{class:'chip-p', 'aria-pressed':String(ehPadrao), onclick:()=>{
          grava({ conjuntoPadrao: ehPadrao ? '' : j.k }).then(pintarConjuntos);
        }}, ehPadrao ? 'É o padrão dele' : 'Usar como padrão'));
        pe.appendChild(el('button',{class:'lixo', 'aria-label':'Tirar este conjunto', onclick:()=>{
          cjs.splice(i,1);
          const extra = (marcaDe(c).conjuntoPadrao || '') === j.k ? { conjuntoPadrao:'' } : {};
          salvarMarca(c, Object.assign({ conjuntos:cjs }, extra)).then(ok=>{
            if(ok){ toast('Salvo.'); if(aoMudar) aoMudar(); pintarConjuntos(); }
          });
        }},'×'));
        corpo.appendChild(pe);

        cart.appendChild(corpo);
        grade.appendChild(cart);
      });
      conjCx.appendChild(grade);

      conjCx.appendChild(el('button',{class:'btn ghost small', style:'margin-top:12px', onclick:()=>{
        const base = pal[0] ? pal[0].cor : (c.cor || '#FF5E00');
        cjs.push({
          k: 'j' + Date.now().toString(36),
          nome:'', quando:'',
          fundo:'#F5F2EC',
          tinta: tintaPara('#F5F2EC', base, 7),
          destaque: base,
          faixa: base,
        });
        salvar().then(pintarConjuntos);
      }}, cjs.length ? '+ outro conjunto' : '+ primeiro conjunto'));

      if(!cjs.length) conjCx.appendChild(el('p',{class:'dica', style:'margin-top:10px'},
        'Sem conjunto, a peça continua funcionando: a fábrica deriva tudo da cor principal, '
        + 'como sempre fez. O conjunto só entra quando existe manual dizendo outra coisa.'));
    }
    pintarConjuntos();

    // ---- 4. tipografia e obrigatórios ----

    box.appendChild(el('p',{class:'rot laranja', style:'margin-top:28px'},'Tipografia e obrigatórios'));

    const linhaCampo = (rot, dentro, dica)=>{
      const l = el('div',{class:'campo-p'});
      l.appendChild(el('span',{}, esc(rot)));
      l.appendChild(dentro);
      box.appendChild(l);
      if(dica) box.appendChild(el('p',{class:'dica campo-dica'}, esc(dica)));
    };

    const fm = el('input',{type:'text', value:m0.fonteMarca || '', placeholder:'Ex.: Garet'});
    fm.addEventListener('change', ()=>grava({ fonteMarca: fm.value.trim() }));
    linhaCampo('Fonte da marca', fm,
      'O nome que está no manual. Se ela estiver instalada no PC da fábrica, as peças saem nela; '
      + 'se não, sai a substituta abaixo. Escrever aqui não instala a fonte.');

    const gf = el('div',{class:'chips'});
    [['','Nenhuma']].concat(FONTES.map(f=>[f[0], f[1]])).forEach(([k, nome])=>{
      gf.appendChild(el('button',{class:'chip-p', 'aria-pressed':String((marcaDe(c).fonteFalback || '') === k),
        onclick:()=>{ grava({ fonteFalback:k }).then(()=>render()); }}, esc(nome)));
    });
    linhaCampo('Substituta', gf,
      'Qual destas fica mais perto da fonte da marca. É a que sai quando a da marca não está no PC da fábrica.');

    const ob = el('div',{class:'campo-longo', style:'margin-top:14px'});
    ob.appendChild(el('span',{},'O que não pode faltar'));
    const obT = el('textarea',{rows:'3',
      placeholder:'Ex.: a estrela amarela em toda peça; o número sempre no canto; o logo no último slide.'});
    obT.value = m0.obrigatorios || '';
    obT.addEventListener('change', ()=>grava({ obrigatorios: obT.value.trim() }));
    ob.appendChild(obT);
    box.appendChild(ob);
    box.appendChild(el('p',{class:'dica campo-dica'},
      'A fábrica recebe esta lista junto com cada pedido, mas não promete desenhar tudo dela — '
      + 'confira na peça antes de aprovar. Prometer que o programa põe a estrela seria mentira; lembrar que '
      + 'ela falta é o que dá pra fazer de verdade e é o que evita a peça voltar.'));

    return box;
  }


  // ---------- listas ----------

  const ESTADOS_ITEM = [
    ['aberto','Pendente'], ['fazendo','Em andamento'], ['concluido','Concluído'], ['arquivado','Arquivado'],
  ];
  const corItem = { aberto:'espera', fazendo:'andamento', concluido:'ok', arquivado:'neutro' };

  function listaAtual(){
    return state.listas.find(l => l.id === state.listaAberta) || state.listas[0] || null;
  }

  function telaListas(){
    const m = el('main');
    const cabeca = el('div',{class:'bloco'});
    cabeca.appendChild(el('p',{class:'rot laranja'},'Arquivo'));
    cabeca.appendChild(el('h1',{class:'page'},'Listas'));
    cabeca.appendChild(el('p',{class:'intro'},
      'Onde mora tudo o que precisa ficar guardado: contratos, fornecedores, senhas de equipamento, o que vier. '
      + 'Cada item tem estado e as tags que você quiser.'));
    m.appendChild(cabeca);

    const bloco = el('div',{class:'bloco'});
    const abas = el('div',{class:'abas-lista'});
    state.listas.forEach(l=>{
      abas.appendChild(el('button',{class:'tab', 'aria-selected':String(listaAtual() && listaAtual().id === l.id),
        onclick:()=>{ state.listaAberta = l.id; render(); }}, esc(l.nome)));
    });
    abas.appendChild(el('button',{class:'tab', style:'border-style:dashed', onclick:novaLista},'+ nova lista'));
    bloco.appendChild(abas);

    const L = listaAtual();
    if(!L){
      bloco.appendChild(el('div',{class:'vazio'},'Nenhuma lista ainda. Crie a primeira acima.'));
      m.appendChild(bloco);
      return m;
    }

    if(L.descricao) bloco.appendChild(el('p',{class:'intro', style:'margin-top:0'}, esc(L.descricao)));

    const barra = el('div',{style:'display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px'});
    const visao = el('div',{class:'visao'});
    [['lista','Lista'],['kanban','Kanban']].forEach(([k,rot])=>{
      visao.appendChild(el('button',{'aria-selected':String(state.visaoLista===k),
        onclick:()=>{ state.visaoLista = k; render(); }}, rot));
    });
    barra.appendChild(visao);
    barra.appendChild(el('button',{class:'btn ghost small', onclick:()=>novoItemLista(L.id)},'+ item'));
    if(state.listas.length > 1){
      barra.appendChild(el('button',{class:'btn ghost small', onclick:async()=>{
        if(!confirm('Apagar a lista "' + L.nome + '" e tudo dentro dela?')) return;
        if(await apagar('listas', L.id)){ state.listaAberta = null; await carregarTudo(); render(); }
      }},'apagar lista'));
    }
    bloco.appendChild(barra);

    const itens = state.listaItens.filter(i => i.lista_id === L.id && !foiEscondido(i));
    bloco.appendChild(state.visaoLista === 'kanban' ? kanbanLista(L, itens) : listaSimples(L, itens));
    m.appendChild(bloco);
    return m;

  function listaSimples(L, itens){
    const box = el('div');
    if(!itens.length){
      const v = el('div',{class:'vazio'});
      v.appendChild(el('strong',{},'Lista vazia'));
      v.appendChild(el('span',{},'Use "+ item" pra começar.'));
      box.appendChild(v);
      return box;
    }
    const peso = { aberto:0, fazendo:1, concluido:2, arquivado:3 };
    itens.slice().sort((a,b)=> peso[a.estado]-peso[b.estado] || String(a.titulo).localeCompare(String(b.titulo)))
      .forEach(i => box.appendChild(cartaoItem(i)));
    return box;
  }

  function kanbanLista(L, itens){
    const box = el('div',{class:'kanban'});
    ESTADOS_ITEM.forEach(([chave, rot])=>{
      const col = el('div',{class:'coluna', 'data-estado':chave});
      const desses = itens.filter(i => i.estado === chave);
      const cab = el('div',{class:'cab'});
      cab.appendChild(el('span',{class:'titulo'}, rot));
      cab.appendChild(el('span',{class:'conta'}, String(desses.length)));
      col.appendChild(cab);
      const pilha = el('div',{class:'pilha'});
      desses.forEach(i => pilha.appendChild(cartaoItem(i, true)));
      if(!desses.length) pilha.appendChild(el('p',{class:'mini', style:'padding:4px 2px'},'vazio'));
      col.appendChild(pilha);
      col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('alvo'); });
      col.addEventListener('dragleave', ()=> col.classList.remove('alvo'));
      col.addEventListener('drop', async e=>{
        e.preventDefault(); col.classList.remove('alvo');
        const id = e.dataTransfer.getData('text/plain');
        const it = state.listaItens.find(x => x.id === id);
        if(it && it.estado !== chave){
          it.estado = chave; render();
          await sb.from('lista_itens').update({ estado:chave }).eq('id', it.id);
          await carregarTudo(); render();
        }
      });
      box.appendChild(col);
    });
    return box;
  }

  function cartaoItem(i, compacto){
    const c = el('div',{class:'item-l '+i.estado});
    if(compacto){ c.setAttribute('draggable','true'); c.style.cursor='grab'; c.style.marginBottom='0';
      c.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', i.id); });
    }
    const corpo = el('div',{class:'corpo'});
    corpo.appendChild(el('div',{class:'tit'}, esc(i.titulo)));
    if(i.detalhe) corpo.appendChild(el('div',{class:'det'}, esc(i.detalhe)));

    const meta = el('div',{class:'meta'});
    const sel = el('select',{style:'font-size:0.74rem;padding:3px 8px;border:1px solid var(--linha);border-radius:100px;background:var(--sup2)'});
    ESTADOS_ITEM.forEach(([v,rot])=>{
      const o = el('option',{value:v}, rot);
      if(i.estado===v) o.setAttribute('selected','selected');
      sel.appendChild(o);
    });
    sel.addEventListener('change', async ()=>{
      i.estado = sel.value; render();
      await sb.from('lista_itens').update({ estado:sel.value }).eq('id', i.id);
      await carregarTudo(); render();
    });
    meta.appendChild(sel);

    if(i.valor != null) meta.appendChild(el('span',{class:'cifra-l'}, esc(dinheiro(i.valor))));
    const cli = i.cliente_id && state.clientes.find(x => x.id === i.cliente_id);
    if(cli) meta.appendChild(el('span',{class:'tag'}, esc(cli.nome)));
    if(i.data_fim){
      const d = diasAte(i.data_fim);
      const t = el('span',{class:'tag'}, 'termina ' + soData(i.data_fim) + (d !== null && d <= 30 ? ' · ' + emDias(d) : ''));
      if(d !== null && d <= 30) t.style.borderColor = 'var(--al-b)', t.style.color = 'var(--al)';
      meta.appendChild(t);
    }
    (i.tags || []).forEach(tg=>{
      const t = el('span',{class:'tag'}, esc(tg));
      t.appendChild(el('button',{title:'tirar tag', onclick:()=>tirarTag(i, tg)},'×'));
      meta.appendChild(t);
    });
    meta.appendChild(el('button',{class:'tag add', onclick:()=>porTag(i)},'+ tag'));
    corpo.appendChild(meta);
    c.appendChild(corpo);

    c.appendChild(el('button',{style:'background:none;border:none;color:var(--fraco);font-size:1rem',
      title:'remover', onclick:async()=>{
        removerComVolta('lista_itens', i.id, i.titulo, async()=>{ await carregarTudo(); render(); });
      }},'×'));
    return c;
  }

  async function porTag(i){
    const tg = prompt('Tag (ex.: renovar, urgente, assinado):');
    if(!tg || !tg.trim()) return;
    const novas = (i.tags || []).concat([tg.trim()]);
    const { error } = await sb.from('lista_itens').update({ tags:novas }).eq('id', i.id);
    if(error){ toast('Não deu: ' + error.message); return; }
    await carregarTudo(); render();
  }

  async function tirarTag(i, tg){
    const novas = (i.tags || []).filter(x => x !== tg);
    const { error } = await sb.from('lista_itens').update({ tags:novas }).eq('id', i.id);
    if(error){ toast('Não deu: ' + error.message); return; }
    await carregarTudo(); render();
  }

  async function novaLista(){
    const nome = prompt('Nome da lista (ex.: Fornecedores, Equipamentos, Ideias):');
    if(!nome || !nome.trim()) return;
    const { data, error } = await sb.from('listas')
      .insert({ nome:nome.trim(), ordem:state.listas.length }).select('id').single();
    if(error){ toast('Não deu: ' + error.message); return; }
    state.listaAberta = data.id;
    await carregarTudo(); render();
  }

  async function novoItemLista(listaId){
    const titulo = prompt('O que você quer guardar?');
    if(!titulo || !titulo.trim()) return;
    const { error } = await sb.from('lista_itens').insert({ lista_id:listaId, titulo:titulo.trim() });
    if(error){ toast('Não deu: ' + error.message); return; }
    await carregarTudo(); render();
  }

  // ---------- captação ----------

  // As etapas do funil, na ordem em que acontecem. A ordem é o que dá sentido
  // ao "avançar" e ao "voltar" — e ao arrastar.
  const ETAPAS_FUNIL = [
    ['mapeado',     'Mapeado',     'Está na lista, ninguém falou ainda'],
    ['contatado',   'Contatado',   'Mandamos mensagem, sem resposta'],
    ['conversando', 'Conversando', 'Respondeu, conversa aberta'],
    ['reuniao',     'Reunião',     'Reunião marcada ou feita'],
    ['proposta',    'Proposta',    'Proposta enviada, esperando resposta'],
    ['fechado',     'Fechou',      'Virou cliente'],
    ['perdido',     'Perdido',     'Não vai acontecer, e sabemos por quê'],
  ];
  const ETAPA_ROT = Object.fromEntries(ETAPAS_FUNIL.map(e => [e[0], e[1]]));
  const idxEtapa = e => ETAPAS_FUNIL.findIndex(x => x[0] === e);

  const dinheiro = v => v == null || v === ''
    ? '—'
    : Number(v).toLocaleString('pt-BR', { style:'currency', currency:'BRL', maximumFractionDigits:0 });

  async function salvarOportunidade(id, campos){
    const { error } = await sb.from('oportunidades').update(campos).eq('id', id);
    if(error){ toast('Não deu: ' + error.message); return false; }
    return true;
  }

  async function moverOportunidade(o, etapa){
    if(o.etapa === etapa) return;
    const antes = o.etapa;
    o.etapa = etapa;                         // otimista: a tela responde na hora
    o.movido_em = new Date().toISOString();
    render();
    if(!await salvarOportunidade(o.id, { etapa })){
      o.etapa = antes;                       // não gravou: desfaz
      render();
      return;
    }
    if(etapa === 'fechado' && !o.cliente_id){
      toast('Fechou. Crie o cliente pelo botão do cartão.');
    }
    await carregarTudo();
    render();
  }

  // ---------- funil ----------

  function telaFunil(){
    const m = el('main');
    const cabeca = el('div',{class:'bloco'});
    cabeca.appendChild(el('p',{class:'rot laranja'},'Captação'));
    cabeca.appendChild(el('h1',{class:'page'},'Funil'));
    cabeca.appendChild(el('p',{class:'intro'},
      'Todo mundo que pode virar cliente, e em que pé está. Arraste o cartão entre as colunas, '
      + 'ou use as setas nele — o teclado faz a mesma coisa que o mouse.'));

    const ativos = state.oportunidades.filter(o => o.etapa !== 'perdido' && o.etapa !== 'fechado');
    const valorEmJogo = ativos.reduce((s,o)=> s + (Number(o.valor_mensal) || 0), 0);
    const semAcao = ativos.filter(o => !(o.proxima_acao || '').trim()).length;
    const atrasadas = ativos.filter(o => o.proxima_acao_em && diasAte(o.proxima_acao_em) < 0).length;

    const fila = el('div',{class:'capa-fila'});
    const cif = (grande, pequeno, rot, destaque) => {
      const d = el('div');
      d.innerHTML = '<span class="cifra">' + (destaque ? '<u>' : '') + esc(grande) + (destaque ? '</u>' : '')
        + (pequeno ? '<em>' + esc(pequeno) + '</em>' : '') + '</span><p class="rot">' + esc(rot) + '</p>';
      return d;
    };
    fila.appendChild(cif(ativos.length, '', 'Em jogo', true));
    fila.appendChild(cif(dinheiro(valorEmJogo).replace(/\s/g,' '), '/mês', 'Se todos fecharem'));
    fila.appendChild(cif(state.oportunidades.filter(o => o.etapa === 'fechado').length, '', 'Fecharam'));
    cabeca.appendChild(fila);
    m.appendChild(cabeca);

    if(semAcao || atrasadas){
      const av = el('div',{class:'bloco', style:'padding:16px 20px'});
      const partes = [];
      if(atrasadas) partes.push(atrasadas + (atrasadas===1 ? ' com próxima ação atrasada' : ' com próxima ação atrasada'));
      if(semAcao) partes.push(semAcao + (semAcao===1 ? ' sem próxima ação marcada' : ' sem próxima ação marcada'));
      av.appendChild(el('div',{class:'erro'},
        partes.join(' e ') + '. Oportunidade sem próxima ação com data é oportunidade que morre sozinha.'));
      m.appendChild(av);
    }

    const bloco = el('div',{class:'bloco'});
    const grade = el('div',{class:'funil'});
    ETAPAS_FUNIL.forEach(([chave, rot, ajuda])=>{
      grade.appendChild(colunaFunil(chave, rot, ajuda));
    });
    bloco.appendChild(grade);
    m.appendChild(bloco);
    m.appendChild(blocoPorOndeSePerde());
    return m;
  }

  function colunaFunil(chave, rot, ajuda){
    const col = el('div',{class:'coluna', 'data-etapa':chave});
    const linhas = state.oportunidades
      .filter(o => o.etapa === chave && !foiEscondido(o))
      .sort((a,b)=> (a.ordem||0) - (b.ordem||0) || String(a.nome).localeCompare(String(b.nome)));

    const cab = el('div',{class:'cab'});
    cab.appendChild(el('span',{class:'titulo'}, esc(rot)));
    cab.appendChild(el('span',{class:'conta'}, String(linhas.length)));
    col.appendChild(cab);
    col.appendChild(el('p',{class:'soma'}, esc(ajuda)));

    const pilha = el('div',{class:'pilha'});
    linhas.forEach(o => pilha.appendChild(cartaoLead(o)));
    if(!linhas.length) pilha.appendChild(el('p',{class:'mini', style:'padding:4px 2px'},'vazio'));
    col.appendChild(pilha);

    const novo = el('button',{class:'novo', onclick:()=>novaOportunidade(chave)},'+ oportunidade');
    col.appendChild(novo);

    // Arrastar: a coluna aceita o cartão e se marca enquanto ele está por cima.
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('alvo'); });
    col.addEventListener('dragleave', ()=> col.classList.remove('alvo'));
    col.addEventListener('drop', async e=>{
      e.preventDefault(); col.classList.remove('alvo');
      const id = e.dataTransfer.getData('text/plain');
      const o = state.oportunidades.find(x => x.id === id);
      if(o) await moverOportunidade(o, chave);
    });
    return col;
  }

  function cartaoLead(o){
    const c = el('div',{class:'lead', draggable:'true', tabindex:'0'});
    c.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', o.id);
      e.dataTransfer.effectAllowed = 'move';
      c.classList.add('arrastando');
    });
    c.addEventListener('dragend', ()=> c.classList.remove('arrastando'));

    c.appendChild(el('div',{class:'nome'}, esc(o.nome)));

    const linha = el('div',{class:'linha'});
    if(o.valor_mensal != null) linha.appendChild(el('span',{class:'valor'}, esc(dinheiro(o.valor_mensal))));
    if(o.bairro) linha.appendChild(el('span',{class:'mini'}, esc(o.bairro)));
    if(o.origem) linha.appendChild(el('span',{class:'mini'}, esc(o.origem)));
    if(linha.childNodes.length) c.appendChild(linha);

    const parado = o.movido_em ? Math.abs(diasAte(o.movido_em)) : null;
    if((o.proxima_acao || '').trim()){
      const d = o.proxima_acao_em ? diasAte(o.proxima_acao_em) : null;
      const quando = d === null ? 'sem data' : emDias(d);
      const atrasada = d !== null && d < 0;
      const p = el('p',{class:'acao'});
      p.innerHTML = '<b>' + esc(o.proxima_acao) + '</b><br>' + esc(quando);
      if(atrasada) p.style.color = 'var(--al)';
      c.appendChild(p);
    } else if(o.etapa !== 'fechado' && o.etapa !== 'perdido'){
      c.appendChild(el('p',{class:'acao', style:'color:var(--es)'},'Sem próxima ação'));
    }

    if(parado !== null && parado >= 7 && o.etapa !== 'fechado' && o.etapa !== 'perdido'){
      c.appendChild(el('p',{class:'mini', style:'margin-top:6px'},'parado há ' + parado + ' dias'));
    }
    if(o.etapa === 'perdido' && (o.perdido_motivo||'').trim()){
      c.appendChild(el('p',{class:'acao'}, esc(o.perdido_motivo)));
    }

    // Alternativa ao arrastar. Existe por acessibilidade, mas na prática é o
    // que se usa no celular, onde arrastar entre colunas é sofrimento.
    const i = idxEtapa(o.etapa);

  function listaFiltrada(){
    const q = (state.buscaLista || '').trim().toLowerCase();
    let linhas = state.oportunidades.filter(o => !foiEscondido(o));
    if(q) linhas = linhas.filter(o => COLUNAS_LISTA.some(c =>
      String(o[c.chave] == null ? '' : o[c.chave]).toLowerCase().includes(q)));
    const { campo, desc } = state.ordemLista;
    linhas.sort((a,b)=>{
      let x = a[campo], y = b[campo];
      if(campo === 'etapa'){ x = idxEtapa(x); y = idxEtapa(y); }
      // Vazio vai sempre pro fim, nos dois sentidos. Ordenar por valor e ver
      // primeiro quem não tem valor nenhum é o oposto do que se quer.
      const vx = x == null || x === '', vy = y == null || y === '';
      if(vx && vy) return 0;
      if(vx) return 1;
      if(vy) return -1;
      const r = (typeof x === 'number' && typeof y === 'number')
        ? x - y : String(x).localeCompare(String(y), 'pt-BR', { numeric:true });
      return desc ? -r : r;
    });
    return linhas;
  }

  function gradeLista(){
    const box = el('div',{class:'planilha'});

  function celula(o, c){
    const td = el('td');
    if(c.tipo === 'select'){
      const s = el('select',{class:'cel'});
      c.grupo.forEach(([v, rot])=>{
        const op = el('option',{value:v}, rot);
        if(o[c.chave] === v) op.setAttribute('selected','selected');
        s.appendChild(op);
      });
      s.addEventListener('change', ()=> moverOportunidade(o, s.value));
      td.appendChild(s);
      return td;
    }
    const i = el('input',{
      class:'cel' + (c.tipo === 'number' ? ' num' : ''),
      type: c.tipo === 'number' ? 'number' : (c.tipo === 'date' ? 'date' : 'text'),
      value: o[c.chave] == null ? '' : o[c.chave],
    });
    // Salva ao sair da célula, não a cada tecla: uma gravação por edição em vez
    // de uma por letra digitada.
    i.addEventListener('change', async ()=>{
      const v = i.value.trim();
      const novo = v === '' ? null : (c.tipo === 'number' ? Number(v) : v);
      if(String(o[c.chave] == null ? '' : o[c.chave]) === String(novo == null ? '' : novo)) return;
      const campos = {}; campos[c.chave] = novo;
      if(await salvarOportunidade(o.id, campos)){ o[c.chave] = novo; toast('Salvo.'); }
      else i.value = o[c.chave] == null ? '' : o[c.chave];
    });
    // Enter desce pra mesma coluna da linha de baixo, como em planilha.
    i.addEventListener('keydown', e=>{
      if(e.key !== 'Enter') return;
      e.preventDefault();
      i.blur();
      const linha = td.parentNode, prox = linha.nextElementSibling;
      if(prox){
        const alvo = prox.children[Array.prototype.indexOf.call(linha.children, td)];
        const campo = alvo && alvo.querySelector('.cel');
        if(campo) campo.focus();
      }
    });
    td.appendChild(i);
    return td;
  }

  function baixarCsv(){
    const linhas = listaFiltrada();
    if(!linhas.length){ toast('Nada pra baixar.'); return; }
    const aspas = v => '"' + String(v == null ? '' : v).replace(/"/g,'""') + '"';
    const csv = [ COLUNAS_LISTA.map(c => aspas(c.rot)).join(';') ]
      .concat(linhas.map(o => COLUNAS_LISTA.map(c =>
        aspas(c.chave === 'etapa' ? ETAPA_ROT[o.etapa] : o[c.chave])).join(';')))
      .join('\r\n');
    // BOM na frente: sem ele o Excel em português abre os acentos errados.
    const url = URL.createObjectURL(new Blob(['﻿' + csv], { type:'text/csv;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'captacao-bora-postar.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast('CSV baixado.');
  }

  function campoSelect(rot, nome, opcoes, valor, dica){
    const f = el('div',{class:'field'});

  function lerForm(form){
    const out = {};
    form.querySelectorAll('input,select,textarea').forEach(i=>{
      if(!i.name) return;
      if(i.type==='checkbox'){ out[i.name] = i.checked; return; }
      const v = i.value.trim();
      out[i.name] = v === '' ? null : (i.type==='number' ? Number(v) : v);
    });
    return out;
  }

  function telaCliente(){

    });

    if(c.brand_profile_id) selos.appendChild(el('span',{class:'selo'},'marca vinculada no app'));
    capa.appendChild(selos);

    const etapas = etapasDoCliente(c);
    const prontas = etapas.filter(e => e.feito >= e.total).length;
    const dia = c.inicio_contrato ? Math.max(0, -diasAte(c.inicio_contrato)) : null;
    const acessosUteis = state.detalhe.acessos.filter(a => a.status !== 'nao_aplicavel');

    fila.appendChild(cifra(prontas, '/' + etapas.length, 'Etapas de pé', true));
    if(dia !== null){
      fila.appendChild(dia <= 90
        ? cifra(dia, '/90', 'Dias de contrato')
        : cifra(Math.floor(dia/30), ' meses', 'Tempo de casa'));
    }
    if(acessosUteis.length) fila.appendChild(cifra(acessosOk, '/' + acessosUteis.length, 'Acessos em mãos'));
    if(c.valor_mensal != null) fila.appendChild(cifra(dinheiro(c.valor_mensal).replace(/\s/g,' '), '/mês', 'Valor do contrato'));
    capa.appendChild(fila);
    m.appendChild(capa);

    m.appendChild(blocoPropriedades(c));
    m.appendChild(termometro(c));
    m.appendChild(blocoPrimeiroValor(c));

    // ---- abas: lista de verdade, com estado visível e navegação por teclado
    const caixaAbas = el('div',{class:'abas-caixa'});
    const tabs = el('div',{class:'abas', role:'tablist', 'aria-label':'Seções do cliente'});
    ABAS.forEach(([k,rot])=>{
      const est = estadoDaAba(k, c);
      const b = el('button',{
        class:'tab', role:'tab', id:'tab-'+k,
        'aria-selected': String(state.aba===k),
        tabindex: state.aba===k ? '0' : '-1',
        onclick:()=>irAba(k),
      });
      b.innerHTML = '<span class="ponto ' + est + '"></span>' + esc(rot);
      tabs.appendChild(b);
    });
    // Setas andam entre as abas, Home e End vão pras pontas. É o que a lista
    // de abas deve fazer, e é de graça pra quem navega sem mouse.
    tabs.addEventListener('keydown', (e)=>{
      const i = ABAS.findIndex(a => a[0] === state.aba);
      let j = null;
      if(e.key === 'ArrowRight') j = (i + 1) % ABAS.length;
      else if(e.key === 'ArrowLeft') j = (i - 1 + ABAS.length) % ABAS.length;
      else if(e.key === 'Home') j = 0;
      else if(e.key === 'End') j = ABAS.length - 1;
      if(j === null) return;
      e.preventDefault();
      irAba(ABAS[j][0]);
      const alvo = document.getElementById('tab-' + ABAS[j][0]);
      if(alvo){ alvo.focus(); alvo.scrollIntoView({ block:'nearest', inline:'center' }); }
    });
    caixaAbas.appendChild(tabs);
    m.appendChild(caixaAbas);

    const p = el('div',{class:'bloco entra', role:'tabpanel', 'aria-labelledby':'tab-'+state.aba});
    const sec = el('div',{class:'sec'});
    sec.appendChild(el('span',{class:'num'}, String(ABAS.findIndex(a=>a[0]===state.aba) + 1).padStart(2,'0')));
    const dentro = el('div');
    dentro.appendChild(explicacaoAba(state.aba));
    if(state.aba==='respostas') dentro.appendChild(abaRespostas());
    if(state.aba==='plano') dentro.appendChild(abaPlano(c));
    if(state.aba==='agenda') dentro.appendChild(abaAgendaCliente(c));
    if(state.aba==='pagina') dentro.appendChild(abaPagina(c));
    if(state.aba==='acessos') dentro.appendChild(abaAcessos(c));
    if(state.aba==='metas') dentro.appendChild(abaMetas(c));
    if(state.aba==='baseline') dentro.appendChild(abaBaseline(c));
    if(state.aba==='marcos') dentro.appendChild(abaMarcos(c));
    if(state.aba==='conformidade') dentro.appendChild(abaConformidade(c));
    if(state.aba==='horas') dentro.appendChild(abaHoras(c));
    sec.appendChild(dentro);
    p.appendChild(sec);
    m.appendChild(p);
    return m;
  }

  function irAba(k){
    if(state.aba === k) return;
    state.aba = k;
    ir(state.vista, { aba:k, substituir:true });   // trocar de aba não enche o histórico
    // Sem isso você troca de aba e continua olhando o meio do conteúdo anterior.
    const caixa = document.querySelector('.abas-caixa');
    if(caixa){
      const y = caixa.getBoundingClientRect().top + window.scrollY - 62;
      if(window.scrollY > y) window.scrollTo({ top:Math.max(0,y), behavior:'smooth' });
      const ativa = document.querySelector('.tab[aria-selected="true"]');
      if(ativa) ativa.scrollIntoView({ block:'nearest', inline:'center', behavior:'smooth' });
    }
  }

  // O pontinho na aba diz se aquilo está resolvido, pela metade ou vazio —
  // então dá pra ver onde estão os buracos sem clicar em nada.
  function estadoDaAba(k, c){
    const d = state.detalhe;
    if(k === 'respostas') return d.onboarding ? 'cheio' : '';
    if(k === 'plano'){
      if(!d.onboarding) return '';
      const pl = d.plano;
      if(!pl) return '';
      return (pl.plano && pl.pauta) ? 'cheio' : 'meio';
    }
    if(k === 'acessos'){
      if(!d.acessos.length) return '';
      if(d.acessos.some(a => a.status === 'bloqueado')) return 'alerta';
      const uteis = d.acessos.filter(a => a.status !== 'nao_aplicavel');
      const ok = uteis.filter(a => a.status === 'recebido').length;
      return ok >= uteis.length ? 'cheio' : (ok ? 'meio' : '');
    }
    if(k === 'metas'){
      if(!d.metas.length) return '';
      const completas = d.metas.filter(x => (x.fracasso||'').trim()).length;
      return completas >= d.metas.length ? 'cheio' : 'meio';
    }
    if(k === 'baseline') return d.baselines.length ? 'cheio' : '';
    if(k === 'marcos'){
      if(!d.marcos.length) return '';
      const atrasado = d.marcos.some(x => !x.data_cumprida && x.data_prevista && diasAte(x.data_prevista) < 0);
      if(atrasado) return 'alerta';
      return d.marcos.every(x => x.data_cumprida) ? 'cheio' : 'meio';
    }
    if(k === 'conformidade'){
      if(!d.conformidade.length) return '';
      if(d.conformidade.some(x => x.status === 'nao_conforme')) return 'alerta';
      return d.conformidade.some(x => x.status === 'pendente') ? 'meio' : 'cheio';
    }
    if(k === 'horas') return d.horas.length ? 'cheio' : '';
    if(k === 'pagina') return (d.pagina && d.pagina.gerada_em) ? 'cheio' : '';
    return '';
  }

    { c:'como_chegou',  r:'Como chegou',   t:'text',   p:'Indicação, mapa, Instagram…' },

    // profissão com conselho ele é obrigatório em toda peça publicada, e é
    // daqui que a assinatura entra sozinha.
    { c:'registro_profissional', r:'Registro no conselho', t:'text', p:'CREF 000000-G/CE' },

  function blocoPropriedades(c){
    const box = el('div',{class:'bloco'});

    box.appendChild(topo);

    const grade = el('div',{class:'props'});
    let escondidos = 0;
    PROPS_CLIENTE.forEach(pr=>{
      const v = c[pr.c];
      const vazio = v == null || v === '';
      if(vazio && !state.verTudo){ escondidos++; return; }
      const linha = el('div',{class:'prop'});
      linha.appendChild(el('span',{}, esc(pr.r)));
      const cx = el('div',{class:'v', style:'display:flex;gap:8px;align-items:center'});

      i.addEventListener('change', async ()=>{
        const txt = i.value.trim();
        const novo = txt === '' ? null : (pr.t === 'number' ? Number(txt) : txt);
        if(String(c[pr.c] == null ? '' : c[pr.c]) === String(novo == null ? '' : novo)) return;
        const campos = {}; campos[pr.c] = novo;
        if(await atualizar('clientes', c.id, campos)){
          c[pr.c] = novo; toast('Salvo.'); await carregarTudo(); render();
        } else i.value = vazio ? '' : v;
      });
      cx.appendChild(i);
      if(pr.link && !vazio){
        cx.appendChild(el('a',{ href:pr.link(v), target:'_blank', rel:'noopener noreferrer' }, pr.lr || 'abrir'));
      }
      linha.appendChild(cx);
      grade.appendChild(linha);
    });
    box.appendChild(grade);
    if(escondidos && !state.verTudo){
      box.appendChild(el('p',{class:'dica', style:'margin-top:12px'},
        escondidos + (escondidos === 1 ? ' campo vazio escondido.' : ' campos vazios escondidos.')

    }
    return box;

  // Diz, em uma linha, o que a aba é e quando se preenche. Sem isso são sete
  // tabelas idênticas e ninguém sabe por onde começar.
  function explicacaoAba(chave){
    const a = ABAS.find(x => x[0] === chave);
    const box = el('div',{class:'expl'});
    if(!a) return box;
    box.appendChild(el('h3',{}, esc(a[2])));

  // Termômetro: as seis etapas que precisam estar de pé antes de o trabalho
  // virar rotina. Cada uma leva para a aba onde se resolve.
  function etapasDoCliente(c){
    const d = state.detalhe;
    const acessosUteis = d.acessos.filter(a => a.status !== 'nao_aplicavel');
    const acessosOk = acessosUteis.filter(a => a.status === 'recebido').length;
    const metasComFracasso = d.metas.filter(m => (m.fracasso || '').trim()).length;
    const confSemVeredito = d.conformidade.filter(i => i.status === 'pendente').length;
    const temPV = !!(c.primeiro_valor_prometido || '').trim() && !!c.primeiro_valor_data;
    const respondidas = d.onboarding ? contarRespondidas(d.onboarding.respostas) : 0;
    const diasPV = c.primeiro_valor_data ? diasAte(c.primeiro_valor_data) : null;

    return [
      { rot:'Respostas', aba:'respostas', feito: d.onboarding ? 1 : 0, total:1,
        cifra: d.onboarding ? respondidas + '/24' : '—', qual: d.onboarding ? 'respondidas' : 'nada vinculado' },
      { rot:'Acessos', aba:'acessos', feito: acessosOk, total: acessosUteis.length || 1,
        cifra: acessosUteis.length ? acessosOk + '/' + acessosUteis.length : '—',
        qual: acessosUteis.length ? 'em mãos' : 'lista não criada' },
      { rot:'Baseline', aba:'baseline', feito: d.baselines.length ? 1 : 0, total:1,
        cifra: d.baselines.length ? String(d.baselines.length) : '—',
        qual: d.baselines.length ? 'congelados' : 'nada congelado' },
      { rot:'Metas', aba:'metas', feito: metasComFracasso, total: d.metas.length || 1,
        cifra: d.metas.length ? metasComFracasso + '/' + d.metas.length : '—',
        qual: d.metas.length ? 'com fracasso' : 'nenhuma meta' },
      { rot:'Primeiro valor', aba:'respostas', feito: temPV ? 1 : 0, total:1,
        cifra: diasPV === null ? '—' : (diasPV < 0 ? Math.abs(diasPV) + 'd' : diasPV + 'd'),
        qual: diasPV === null ? 'sem data' : (diasPV < 0 ? 'de atraso' : 'pra vencer') },
      { rot:'Conformidade', aba:'conformidade',
        feito: d.conformidade.length ? d.conformidade.length - confSemVeredito : 0,
        total: d.conformidade.length || 1,
        cifra: d.conformidade.length ? (d.conformidade.length - confSemVeredito) + '/' + d.conformidade.length : '—',
        qual: d.conformidade.length ? 'com veredito' : 'nada avaliado' },
    ];
  }

  function termometro(c){
    const etapas = etapasDoCliente(c);
    const prontas = etapas.filter(e => e.feito >= e.total).length;
    const pct = Math.round((prontas / etapas.length) * 100);

    const box = el('div',{class:'bloco'});
    const topo = el('div',{class:'termo-topo'});
    topo.appendChild(el('p',{class:'rot'},'Como está o onboarding'));
    topo.appendChild(el('span',{style:'font-family:var(--display);font-weight:700;font-size:1.05rem'},
      prontas + ' de ' + etapas.length + ' etapas de pé'));
    box.appendChild(topo);

    const barra = el('div',{class:'trilha'});
    barra.appendChild(el('i',{style:'width:'+pct+'%'}));
    box.appendChild(barra);

    const grade = el('div',{class:'etapas'});
    etapas.forEach((e2, i)=>{
      const estado = e2.feito >= e2.total ? 'feito' : (e2.feito > 0 ? 'meio' : 'falta');
      const b = el('button',{class:'etapa '+estado, onclick:()=>irAba(e2.aba)});
      b.innerHTML = '<span class="cab"><span class="bola"></span><em>' + String(i+1).padStart(2,'0') + ' ' + esc(e2.rot.toUpperCase()) + '</em></span>'
        + '<span class="n">' + esc(e2.cifra) + '</span>'
        + '<span class="q">' + esc(e2.qual) + '</span>';
      grade.appendChild(b);
    });
    box.appendChild(grade);
    return box;
  }

  // Primeiro valor: a promessa pequena com data marcada que sustenta a relacao
  // enquanto o numero que o cliente quer ver ainda nao se moveu (Lacuna #5).
  function blocoPrimeiroValor(c){
    const box = el('div',{class:'card', style:'margin-top:18px;border-width:2px'});
    const tem = !!(c.primeiro_valor_prometido || '').trim();

    const topo = el('div',{style:'display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:baseline'});
    topo.appendChild(el('p',{class:'rot laranja', style:'margin:0'},'Primeiro valor prometido'));
    topo.appendChild(el('button',{class:'linkbtn', style:'color:var(--fraco)',
      onclick:()=>{ state.editandoPV = !state.editandoPV; render(); }}, state.editandoPV ? 'cancelar' : (tem ? 'editar' : 'definir')));
    box.appendChild(topo);

    if(!state.editandoPV){
      if(tem){
        box.appendChild(el('p',{style:'margin:8px 0 0;font-size:1.05rem;line-height:1.45'}, esc(c.primeiro_valor_prometido)));
        const linha = el('div',{style:'margin-top:10px;display:flex;gap:9px;flex-wrap:wrap;align-items:center'});
        if(c.primeiro_valor_data){
          const hoje = new Date(); hoje.setHours(0,0,0,0);
          const alvo = new Date(c.primeiro_valor_data + 'T00:00:00');
          const dias = Math.round((alvo - hoje) / 86400000);
          linha.appendChild(el('span',{class:'selo'},'até ' + soData(c.primeiro_valor_data)));
          if(dias > 0) linha.appendChild(el('span',{class:'selo'}, 'faltam ' + dias + (dias === 1 ? ' dia' : ' dias')));
          else if(dias === 0) linha.appendChild(el('span',{class:'selo aviso'},'é hoje'));
          else linha.appendChild(el('span',{class:'selo aviso'}, 'atrasado há ' + Math.abs(dias) + (dias === -1 ? ' dia' : ' dias')));
        } else {
          linha.appendChild(el('span',{class:'selo aviso'},'sem data — promessa sem data não conta'));
        }
        box.appendChild(linha);
      } else {
        box.appendChild(el('p',{class:'muted', style:'margin:10px 0 0'},
          'Nada declarado ainda. Primeiro valor não é o resultado prometido: é a primeira vez que o cliente percebe que a decisão foi certa — e precisa acontecer entre 14 e 30 dias, com data dita no kickoff.'));
      }
      return box;
    }

    const form = el('form',{style:'margin-top:14px'});
    const g = el('div',{class:'grid2'});
    g.appendChild(campo('O que ele vai perceber, e quando','primeiro_valor_prometido','text', c.primeiro_valor_prometido || ''));
    g.appendChild(campo('Data prometida','primeiro_valor_data','date', c.primeiro_valor_data || ''));
    form.appendChild(g);
    form.appendChild(el('p',{class:'muted', style:'margin:0 0 12px;font-size:0.84rem'},
      'Candidatos que funcionam em 14 dias: ele passa a saber quantas pessoas chegam por dia e por onde; o tempo de resposta cai de horas para minutos; o diagnóstico de conformidade; o perfil corrigido com antes e depois. Ranqueamento e cliente novo não servem — chegam tarde demais.'));
    form.appendChild(el('button',{class:'btn small', type:'submit'},'Salvar'));
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const d = lerForm(form);
      if(await atualizar('clientes', c.id, d)){
        toast('Primeiro valor registrado.');
        state.editandoPV = false;
        await carregarTudo(); render();
      }
    });
    box.appendChild(form);
    return box;
  }

  // Placar reaproveitado no topo das abas: número grande, rótulo pequeno.
  function placar(itens){
    const box = el('div',{class:'placares'});
    itens.forEach(i=>{
      if(i.esconderSeZero && !i.valor) return;
      const p = el('div',{class:'p'+(i.destaca?' destaca':'')});
      p.appendChild(el('b',{}, String(i.valor)));
      p.appendChild(el('span',{}, esc(i.rotulo)));
      if(i.de){
        const b = el('div',{class:'minibarra'});
        b.appendChild(el('i',{style:'width:'+Math.round((i.parte/i.de)*100)+'%'}));
        p.appendChild(b);
      }
      box.appendChild(p);
    });
    return box;
  }

      box.appendChild(placar([
        { rotulo:'Na nossa mão', valor: recebidos + ' de ' + uteis.length, destaca:true,
          parte:recebidos, de:Math.max(uteis.length,1) },
        { rotulo:'Travados', valor: travados, esconderSeZero:true },

      box.appendChild(wrap);

    box.appendChild(secao({
      tabela:'acessos', cliente:c, linhas,
      vazio:{ titulo:'Nenhum acesso mapeado ainda',
              texto:'Comece pela lista padrão acima e vá marcando quem detém cada conta.' },
      rotuloAdd:'+ adicionar acesso',
      colunas:[
        {rotulo:'Conta', chave:'recurso', forte:true},
        {rotulo:'Situação', chave:'status', chip:'acessos_status'},
        {rotulo:'Com quem está', chave:'quem_detem'},
        {rotulo:'Pedimos em', valor:l=> l.solicitado_em ? soData(l.solicitado_em) : null},
        {rotulo:'Chegou em', valor:l=> l.recebido_em ? soData(l.recebido_em) : null},
        {rotulo:'Observação', chave:'nota'},
      ],
      campos:[
        {rotulo:'Qual conta', nome:'recurso', dica:'Ex.: Instagram, WhatsApp comercial, Perfil da Empresa'},
        {rotulo:'Situação', nome:'status', grupo:'acessos_status', padrao:'pendente'},
        {rotulo:'Com quem está', nome:'quem_detem', dica:'A pessoa de verdade. "Sobrinho da dona" é resposta válida e útil.'},
        {rotulo:'Pedimos em', nome:'solicitado_em', tipo:'date'},
        {rotulo:'Chegou em', nome:'recebido_em', tipo:'date'},
        {rotulo:'Observação', nome:'nota', tipo:'textarea', dica:'O que está atrapalhando, ou o que precisa ser feito antes.'},
      ],
      validar:d=> d.recurso ? null : 'Diga qual é o acesso.',
    }));
    return box;
  }

  function abaRespostas(){
    const on = state.detalhe.onboarding;
    if(!on){
      const v = el('div',{class:'vazio'});
      v.appendChild(el('strong',{},'Nenhuma resposta vinculada'));
      v.appendChild(el('span',{},'Quando alguém enviar o formulário, a resposta cai na caixa de entrada. De lá, você liga ela a este cliente.'));
      return v;
    }
    const box = el('div');
    box.appendChild(el('p',{class:'mono muted', style:'font-size:0.7rem;margin:0 0 18px'},
      'Recebido em '+dataBR(on.recebido_em)+' · '+contarRespondidas(on.respostas)+' de 24 respondidas'));
    box.appendChild(blocoRespostas(on.respostas));
    return box;
  }

  function blocoRespostas(respostas){
    const box = el('div');
    const r = respostas || {};
    SECOES.forEach(sec=>{
      box.appendChild(el('p',{class:'secname'}, esc(sec.titulo)));
      sec.perguntas.forEach(([chave, pergunta])=>{
        const v = (r[chave]||'').trim();
        const d = el('div',{class:'qa'+(v?'':' vazia')});
        d.appendChild(el('div',{class:'q'}, esc(pergunta)));
        d.appendChild(el('div',{class:'a'}, v ? esc(v) : 'Não respondido'));
        box.appendChild(d);
      });
    });
    return box;
  }

    --linha:#2C2924; --linha2:#232019; --laranja:#FF7A2E; --laranja-forte:#FF8A3C;

  /* ---- linha do tempo dos 90 dias ----
     Um eixo só, dia 0 a 90. Cada marco é um ponto na data em que cai;
     cheio quando já aconteceu, vazado quando ainda não. Preto é nosso,
     roxo é de vocês — e cada ponto tem a palavra "nós" ou "vocês" na
     lista logo abaixo, porque cor sozinha não pode carregar a informação. */
  .eixo{ background:var(--sup); border-radius:var(--r); box-shadow:var(--s1); padding:30px 26px 20px; margin-bottom:22px; }
  .pista{ position:relative; height:46px; margin:0 6px; }
  .pista .base{ position:absolute; left:0; right:0; top:22px; height:2px; background:var(--linha); border-radius:2px; }
  .pista .feito{ position:absolute; left:0; top:22px; height:2px; background:var(--nosso); border-radius:2px; }
  .pista .marca{
    position:absolute; top:16px; width:14px; height:14px; border-radius:50%;
    transform:translateX(-7px); border:2px solid var(--nosso); background:var(--papel);
    box-shadow:0 0 0 3px var(--sup);
  }
  .pista .marca.ok{ background:var(--nosso); }
  .pista .marca.cli{ border-color:var(--deles); }
  .pista .marca.cli.ok{ background:var(--deles); }
  .pista .hoje{
    position:absolute; top:2px; bottom:2px; width:2px; background:var(--laranja);
    transform:translateX(-1px);

    font-family:var(--dado); font-size:0.55rem; letter-spacing:0.14em; text-transform:uppercase;

  #barra[hidden], .tirar[hidden], .tirar-secao[hidden], .mais-item[hidden]{ display:none !important; }
