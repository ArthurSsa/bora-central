  // ---------- fábrica (Visão Bora) ----------
  //
  // A fila inteira, o motivo de cada reprovação, o custo, e se a fábrica — que
  // roda num PC da Bora — está ligada. Abrir um pedido leva pra tela dele,
  // onde se assume, edita e entrega.

  function mesAtualFabrica(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }

  async function carregarFabrica(){
    const f = state.fabrica || (state.fabrica = { fila:[], custos:[], mes:mesAtualFabrica() });
    const [y, mm] = f.mes.split('-').map(Number);
    const fim = new Date(y, mm, 0).getDate();
    const [fila, custos, sinais] = await Promise.all([
      sb.rpc('fila_da_fabrica'),
      sb.rpc('custos_da_fabrica', { p_de: f.mes + '-01', p_ate: f.mes + '-' + String(fim).padStart(2,'0') }),
      sb.rpc('sinais_da_fabrica'),
    ]);
    if(fila.error) toast('Não deu pra ler a fila: ' + fila.error.message);
    f.fila = fila.data || [];
    f.custos = custos.data || [];
    f.sinais = sinais.data || [];
    f.lidoEm = Date.now();
    escutarFabrica();
  }

  // Um canal só pra fila e pros pedidos, com recarga agrupada: um render de
  // vídeo manda atualização a cada 2 s.
  let canalFabrica = null, recargaFabrica = null;
  function escutarFabrica(){
    if(canalFabrica) return;
    const recarregar = () => {
      clearTimeout(recargaFabrica);
      recargaFabrica = setTimeout(async () => {
        const antes = precisamDaEquipe();
        await Promise.all([state.fabrica ? carregarFabrica() : null, C().carregado ? carregarPedidos() : null]);
        const p = state.vista.tipo === 'pedido' && C().pedidos.find(x => x.id === state.vista.id);
        if(p) await carregarEventosDe(p);
        if(['criar','pedido','fabrica'].includes(state.vista.tipo) || precisamDaEquipe() !== antes) render();
      }, 600);
    };
    canalFabrica = sb.channel('central-fabrica')
      .on('postgres_changes', { event:'*', schema:'public', table:'jobs' }, recarregar)
      .on('postgres_changes', { event:'*', schema:'public', table:'pedidos' }, recarregar)
      .subscribe();
  }

  const precisamDaEquipe = () => ((state.fabrica || {}).fila || []).filter(x => x.job_estado === 'falhou' && !x.assumido_por).length;

  // Ligada é ter dado sinal no último minuto e meio (o worker manda a cada 30 s),
  // contado no relógio do banco.
  function situacaoDaFabrica(){
    const f = state.fabrica || {};
    if(!f.sinais) return { ligada:null, texto:'Conferindo se a fábrica está ligada…' };
    const s = f.sinais[0];
    if(!s) return { ligada:false, texto:'A fábrica nunca deu sinal. Ligue no PC da Bora: npm run fabrica:ligar' };
    const ha = Number(s.segundos_sem_sinal || 0) + Math.round((Date.now() - (f.lidoEm || Date.now())) / 1000);
    const hora = new Date(s.visto_em).toLocaleString('pt-BR', { weekday:'short', hour:'2-digit', minute:'2-digit' });
    if(ha <= 90) return { ligada:true, texto:'Fábrica ligada em ' + (s.maquina || 'um PC') + (s.agente === 'roteiro' ? ', sem o Claude' : ', com o Claude')
      + ' · ' + (s.ocupado_com ? 'fazendo um pedido agora' : 'esperando pedido') };
    return { ligada:false, texto:'Fábrica desligada desde ' + hora + '. Os pedidos esperam na fila até o PC da Bora ser ligado.' };
  }

  function avisoDaFabrica(){
    if(!state.fabrica) carregarFabrica().then(render);
    const sit = situacaoDaFabrica();
    const p = el('p',{class:'fab-sinal ' + (sit.ligada === null ? 'conferindo' : sit.ligada ? 'ligada' : 'desligada'), role:'status'});
    p.textContent = sit.texto;
    // O sinal muda sem nada acontecer na fila (o PC desliga em silêncio): relê a cada 30 s.
    clearTimeout(avisoDaFabrica.t);
    avisoDaFabrica.t = setTimeout(async () => { if(['criar','fabrica','pedido'].includes(state.vista.tipo)){ await carregarFabrica(); render(); } }, 30_000);
    return p;
  }

  function cartaoFabrica(x){
    const c = el('div',{class:'card fab' + (x.job_estado === 'falhou' && !x.assumido_por ? ' precisa' : ''), 'data-pedido': x.pedido_id});
    const topo = el('div',{class:'fab-topo'});
    const t = el('div',{style:'min-width:0'});
    const tit = el('div',{class:'fab-tit'}); tit.textContent = x.titulo || x.tipo;
    const sub = el('div',{class:'muted'});
    sub.textContent = x.cliente + ' · ' + x.tipo + (x.skill ? ' · ' + x.skill : '') + ' · pedido em ' + dataBR(x.criado_em);
    t.appendChild(tit); t.appendChild(sub);
    topo.appendChild(t);
    const estado = x.assumido_por ? ['Com a equipe','roxo'] : x.job_estado === 'falhou' ? ['Precisa da equipe','alerta']
      : x.job_estado === 'rodando' ? ['Fazendo','andamento'] : x.job_estado === 'na_fila' ? ['Na fila','espera']
      : x.pedido_estado === 'para_aprovar' ? ['Com o cliente','ok'] : [x.pedido_estado,'neutro'];
    const selo = el('span',{class:'chip ' + estado[1]}); selo.textContent = estado[0];
    topo.appendChild(selo);
    c.appendChild(topo);
    const linha = el('p',{class:'muted fab-linha'});
    const partes = [];
    if(x.rodada) partes.push(x.rodada === 'da_bora' ? 'entrega da equipe' : x.rodada === 'ajuste' ? 'ajuste' : 'produção');
    if(x.job_estado === 'rodando' && x.etapa) partes.push(x.etapa + ' · ' + Math.round(x.progresso) + '%');
    if(x.tentativas) partes.push('tentativa ' + x.tentativas + ' de ' + x.max_tentativas);
    partes.push('US$ ' + Number(x.custo_usd || 0).toFixed(2) + ' · ' + Math.round(Number(x.render_segundos || 0)) + ' s nos apps');
    linha.textContent = partes.join(' · ');
    c.appendChild(linha);
    if((x.motivos || []).length){
      c.appendChild(el('p',{class:'rot', style:'margin-top:12px'},'Por que não passou'));
      const ol = el('ol',{class:'fab-motivos'});
      x.motivos.forEach(mo => { const li = el('li'); li.textContent = mo; ol.appendChild(li); });
      c.appendChild(ol);
    }
    const acoes = el('div',{class:'fab-acoes'});
    acoes.appendChild(el('button',{class:'btn small', onclick:()=>ir({tipo:'pedido', id:x.pedido_id})}, 'Abrir o pedido'));
    c.appendChild(acoes);
    return c;
  }

  function telaFabrica(){
    const m = el('main');
    const f = state.fabrica;
    const cabeca = el('div',{class:'bloco'});
    cabeca.appendChild(el('p',{class:'rot laranja'},'Visão Bora'));
    cabeca.appendChild(el('h1',{class:'page'},'Fábrica'));
    cabeca.appendChild(el('p',{class:'intro'},
      'Tudo o que a fábrica está fazendo pelos clientes. Ela refaz sozinha duas vezes quando a conferência reprova; '
      + 'na terceira, o pedido cai em "Precisa da equipe". Abra o pedido pra editar à mão ou pedir de novo.'));
    cabeca.appendChild(avisoDaFabrica());
    if(!f){ m.appendChild(cabeca); return m; }
    const fila = f.fila;
    const precisa = fila.filter(x => x.job_estado === 'falhou' && !x.assumido_por);
    const comEquipe = fila.filter(x => x.assumido_por && x.pedido_estado === 'produzindo');
    const naFabrica = fila.filter(x => !x.assumido_por && (x.job_estado === 'na_fila' || x.job_estado === 'rodando'));
    const comCliente = fila.filter(x => x.pedido_estado === 'para_aprovar' && !(x.job_estado === 'na_fila' || x.job_estado === 'rodando'));
    const cifras = el('div',{class:'capa-fila'});
    const cif = (g,r,d)=>{ const x=el('div');
      x.innerHTML = '<span class="cifra">'+(d?'<u>':'')+esc(g)+(d?'</u>':'')+'</span><p class="rot">'+esc(r)+'</p>'; return x; };
    cifras.appendChild(cif(precisa.length, 'Precisam da equipe', precisa.length > 0));
    cifras.appendChild(cif(comEquipe.length, 'Com a equipe'));
    cifras.appendChild(cif(naFabrica.length, 'Na fábrica agora'));
    cifras.appendChild(cif(comCliente.length, 'Esperando aprovação'));
    cabeca.appendChild(cifras);
    m.appendChild(cabeca);
    const secao = (titulo, lista, vazio) => {
      const b = el('div',{class:'bloco'});
      const h = el('h3',{}); h.textContent = titulo; b.appendChild(h);
      if(!lista.length) b.appendChild(el('div',{class:'vazio'}, vazio));
      lista.forEach(x => b.appendChild(cartaoFabrica(x)));
      m.appendChild(b);
    };
    secao('Precisam da equipe', precisa, 'Nada parado. A fábrica está dando conta.');
    secao('Com a equipe', comEquipe, 'Ninguém da equipe está com pedido na mão.');
    secao('Na fábrica agora', naFabrica, 'Fila vazia.');
    if(comCliente.length) secao('Esperando aprovação', comCliente, '');
    m.appendChild(blocoCustosFabrica());
    return m;
  }

  // O Claude em dólar e o tempo dentro dos apps, por cliente — a Economia usa o mesmo bloco.
  function blocoCustosFabrica(mesFixo){
    const f = state.fabrica;
    const bc = el('div',{class:'bloco'});
    const cab = el('div',{class:'fab-topo'});
    cab.appendChild(el('h3',{},'Custos da fábrica no mês'));
    if(!mesFixo){
      const mes = el('input',{type:'month', value:f.mes, 'aria-label':'Mês dos custos'});
      mes.addEventListener('change', async ()=>{ f.mes = mes.value || mesAtualFabrica(); await carregarFabrica(); render(); });
      cab.appendChild(mes);
    }
    bc.appendChild(cab);
    if(!f || !f.custos.length){ bc.appendChild(el('div',{class:'vazio'},'Nenhuma rodada neste mês.')); return bc; }
    const tb = el('table',{class:'fab-custos'});
    tb.innerHTML = '<thead><tr><th>Cliente</th><th>Pedidos</th><th>Rodadas</th><th>Tentativas</th><th>Falharam</th><th>Da equipe</th><th>Claude</th><th>Nos apps</th></tr></thead>';
    const corpo = el('tbody');
    let usd = 0, seg = 0;
    f.custos.forEach(r => {
      usd += Number(r.custo_usd); seg += Number(r.render_segundos);
      const tr = el('tr');
      [r.cliente, r.pedidos, r.rodadas, r.tentativas, r.falharam, r.da_bora, 'US$ ' + Number(r.custo_usd).toFixed(2), Math.round(Number(r.render_segundos) / 6) / 10 + ' min']
        .forEach(v => { const td = el('td'); td.textContent = String(v); tr.appendChild(td); });
      corpo.appendChild(tr);
    });
    tb.appendChild(corpo);
    bc.appendChild(tb);
    const tot = el('p',{class:'muted', style:'margin-top:10px'});
    tot.textContent = 'No mês: US$ ' + usd.toFixed(2) + ' com o Claude e ' + Math.round(seg / 6) / 10 + ' min dentro dos apps. Rodadas sem o Claude (roteiro) custam US$ 0.';
    bc.appendChild(tot);
    return bc;
  }

  // ---------- estúdio ----------

  // O que este lugar é e o que ele não é. Ele monta e exporta a peça — o
  // trabalho chato de diagramar dez slides no mesmo padrão, contar caractere de
  // legenda e lembrar da assinatura obrigatória. Ele NÃO escreve por você: não
  // há modelo de linguagem aqui, e não vai haver enquanto a chave tiver que
  // morar dentro de uma página estática, onde qualquer um lê o código-fonte.
  // O que ele faz é sair do papel em branco: escolhe o formato, preenche o
  // esqueleto com o que a ficha do cliente já sabe, e deixa você reescrever.

  // As cinco fontes que a peça pode usar. É uma lista fechada de propósito:
  // fonte é o que mais rápido faz um perfil parecer amador, e escolher entre
  // cinco que combinam entre si é melhor que escolher entre mil.
  const FONTES = [
    ['display', 'Space Grotesk', '"Space Grotesk","Segoe UI",sans-serif',   'Títulos. É a fonte da Bora.'],
    ['corpo',   'Archivo',       '"Archivo","Helvetica Neue",Arial,sans-serif', 'Texto corrido, fácil de ler.'],
    ['impacto', 'Anton',         '"Anton","Arial Narrow",Impact,sans-serif', 'Condensada e pesada, pra manchete curta.'],
    ['serif',   'Playfair',      '"Playfair Display",Georgia,serif',         'Séria e clássica. Cai bem em direito, saúde, imóvel.'],
    ['mono',    'Space Mono',    '"Space Mono","SFMono-Regular",Consolas,monospace', 'Dado, etiqueta, número.'],
  ];
  const famDe = k => (FONTES.find(f => f[0] === k) || FONTES[0])[2];

  const FORMATOS_PECA = [
    ['4:5', 'Retrato', 1080, 1350, 'O que ocupa mais tela no feed'],
    ['1:1', 'Quadrado', 1080, 1080, 'Clássico, cabe em qualquer lugar'],
    ['9:16','Story',   1080, 1920, 'Story e reels'],
  ];
  const medidas = f => FORMATOS_PECA.find(x => x[0] === f) || FORMATOS_PECA[0];

  // ---------- cor ----------

  // Por que OKLab e não HSL. Em HSL, clarear um verde e clarear um azul pelo
  // mesmo tanto dá resultados de brilho bem diferentes, e a matiz escorrega no
  // caminho — é assim que sai aquele tom "sujo" que denuncia paleta feita no
  // olho. OKLab é feito pra que passos iguais pareçam iguais, e é a diferença
  // entre uma escada de tons que combina e uma que quase combina.

  const srgbParaLinear = v => v <= 0.04045 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
  const linearParaSrgb = v => v <= 0.0031308 ? v*12.92 : 1.055*Math.pow(v, 1/2.4) - 0.055;

  function hexParaRgb(hex){
    const h = String(hex || '#000000').replace('#','');
    const n = h.length === 3 ? h.split('').map(x=>x+x).join('') : h.slice(0,6);
    return [0,2,4].map(i => parseInt(n.slice(i,i+2),16) / 255);
  }
  const rgbParaHex = rgb => '#' + rgb
    .map(v => Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2,'0')).join('');

  function paraOklab(hex){
    const [r,g,b] = hexParaRgb(hex).map(srgbParaLinear);
    const l = Math.cbrt(0.4122214708*r + 0.5363325363*g + 0.0514459929*b);
    const m = Math.cbrt(0.2119034982*r + 0.6806995451*g + 0.1073969566*b);
    const s = Math.cbrt(0.0883024619*r + 0.2817188376*g + 0.6299787005*b);
    return [
      0.2104542553*l + 0.7936177850*m - 0.0040720468*s,
      1.9779984951*l - 2.4285922050*m + 0.4505937099*s,
      0.0259040371*l + 0.7827717662*m - 0.8086757660*s,
    ];
  }
  function deOklab(lab){
    const [L,a,b] = lab;
    const l = Math.pow(L + 0.3963377774*a + 0.2158037573*b, 3);
    const m = Math.pow(L - 0.1055613458*a - 0.0638541728*b, 3);
    const s = Math.pow(L - 0.0894841775*a - 1.2914855480*b, 3);
    return rgbParaHex([
      +4.0767416621*l - 3.3077115913*m + 0.2309699292*s,
      -1.2684380046*l + 2.6097574011*m - 0.3413193965*s,
      -0.0041960863*l - 0.7034186147*m + 1.7076147010*s,
    ].map(linearParaSrgb));
  }

  // Luminância relativa da WCAG, que é outra conta — serve pro contraste, não
  // pra escolher tom.
  function luz(hex){
    const [r,g,b] = hexParaRgb(hex).map(srgbParaLinear);
    return 0.2126*r + 0.7152*g + 0.0722*b;
  }
  function contraste(a, b){
    const [x,y] = [luz(a), luz(b)];
    return (Math.max(x,y) + 0.05) / (Math.min(x,y) + 0.05);
  }

  // A escada: mesma matiz, croma amansado nas pontas. Sem amansar, o tom bem
  // claro fica fluorescente e o bem escuro fica lama.
  function escadaDe(cor){
    const [ , a, b] = paraOklab(cor);
    const croma = Math.sqrt(a*a + b*b) || 0.0001;
    const ang = Math.atan2(b, a);
    const passo = (L, k) => {
      const c = croma * k;
      return deOklab([L, Math.cos(ang) * c, Math.sin(ang) * c]);
    };
    return {
      nevoa:  passo(0.965, 0.22),
      claro:  passo(0.905, 0.38),
      suave:  passo(0.78,  0.62),
      base:   cor,
      forte:  passo(0.52,  1.0),
      fundo:  passo(0.30,  0.78),
      breu:   passo(0.19,  0.55),
    };
  }

  // A cor de texto que se lê em cima de um fundo, escolhida por conta e não por
  // chute. Tenta os dois sentidos — clarear e escurecer — porque em cima de um
  // laranja médio o preto dá 7:1 e o branco dá 3:1, e olhar só para um lado é
  // como se escolhe branco sobre laranja e se descobre depois que não lê.
  function tintaPara(fundo, cor, alvo){
    alvo = alvo || 4.5;
    const [ , a, b] = paraOklab(cor || fundo);
    const croma = Math.sqrt(a*a + b*b) || 0.0001;
    const ang = Math.atan2(b, a);
    const naMatiz = (L, k) => deOklab([L, Math.cos(ang)*croma*k, Math.sin(ang)*croma*k]);
    let melhor = null, melhorRazao = 0;
    // Do mais próximo do fundo para o mais distante, nos dois sentidos — e
    // "próximo do fundo" é a claridade do fundo mesmo, não um ponto fixo no
    // meio da escala. Saindo de um ponto fixo, 7:1 e 4,5:1 caíam na mesma
    // volta e devolviam a mesma cor: o apoio saía igual ao texto principal, e
    // apoio que não parece apoio não hierarquiza nada — o slide vira um bloco só.
    const Lf = paraOklab(fundo)[0];
    for(let i = 1; i <= 34; i++){
      [Lf - i*0.018, Lf + i*0.018].forEach(L=>{
        if(L < 0.02 || L > 0.995) return;
        const t = naMatiz(L, L < 0.5 ? 0.55 : 0.42);
        const r = contraste(t, fundo);
        if(r > melhorRazao){ melhorRazao = r; melhor = t; }
      });
      if(melhorRazao >= alvo) return melhor;
    }
    // A matiz não deu conta: cai no puro que render mais.
    const preto = contraste('#141210', fundo), branco = contraste('#FFFFFF', fundo);
    if(Math.max(preto, branco) > melhorRazao) return preto >= branco ? '#141210' : '#FFFFFF';
    return melhor || '#141210';
  }

  // Compatibilidade: o resto do arquivo ainda chama estes dois.
  const tintaSobre = fundo => luz(fundo) > 0.42 ? '#141210' : '#FFFFFF';
  const misturar = (a, b, t) => {
    const [x, y] = [hexParaRgb(a), hexParaRgb(b)];
    return rgbParaHex([0,1,2].map(i => x[i]*(1-t) + y[i]*t));
  };

  // O visual do carrossel. Fundo escolhido pelo preset; texto e apoio
  // CALCULADOS pra bater o contraste em cima dele, em vez de fixados na mão —
  // é o que faz a cor do cliente poder ser qualquer uma sem quebrar a leitura.
  function coresDoDeck(deck){
    const cor = deck.cor || '#FF5E00';
    const c2 = deck.cor2 || cor;
    const e = escadaDe(cor);
    const monta = fundo => {
      const destaque = contraste(cor, fundo) >= 3 ? cor : tintaPara(fundo, cor, 3.2);
      return {
        fundo,
        tinta:  tintaPara(fundo, cor, 7),     // texto principal, com folga
        apoio:  tintaPara(fundo, cor, 4.5),   // apoio, no mínimo da norma
        destaque,
        faixa:  contraste(c2, fundo) >= 2 ? c2 : destaque,
        escada: e,
        breu:   e.breu,   // ponta escura da marca, usada no duotone da foto
      };
    };
    if(deck.preset === 'tinta')   return monta('#141210');
    if(deck.preset === 'nevoa')   return monta(e.nevoa);
    if(deck.preset === 'breu')    return monta(e.breu);
    if(deck.preset === 'cliente') return monta(cor);
    return monta('#F5F2EC');
  }

  // ---------- o modelo de elementos ----------

  let seqEl = 0;
  const novoId = () => 'e' + (++seqEl) + '-' + Date.now().toString(36).slice(-4);

  function elementoTexto(extra){
    return Object.assign({
      id:novoId(), tipo:'texto', papel:'livre', txt:'Texto novo',
      x:92, y:400, w:896, fonte:'display', tam:72, peso:700, cor:null,
      alinha:'esq', alt:1.14, caixa:'normal', realce:null, opac:1,
    }, extra || {});
  }
  // Um contexto 2d de rascunho, só pra medir texto fora da tela. Serve pra
  // empilhar título e apoio sem que um caia por cima do outro.
  let ctxRascunho = null;
  const contextoDeMedida = () =>
    ctxRascunho || (ctxRascunho = document.createElement('canvas').getContext('2d'));

  // Peças antigas guardavam só título e texto por slide. Convertidas na
  // abertura, sem perder nada: o que era título vira um elemento de texto, e os
  // dois são empilhados de verdade — medindo a altura de cada um, porque um
  // título de duas linhas com posição fixa cai em cima da linha de apoio.
  function migrarSlide(s, deck){
    if(s && Array.isArray(s.elementos)) return s;
    s = s || {};
    const [ , , L, A] = medidas(deck.formato);
    const m = deck.margem === 'compacta' ? 66 : 92;
    const capa = s.tipo === 'capa' || s.tipo === 'fim';
    const al = deck.alinha === 'centro' ? 'centro' : 'esq';
    const els = [];
    if(s.titulo) els.push(elementoTexto({ papel:'titulo', txt:s.titulo, x:m, w:L - m*2, y:0,
      tam: capa ? 96 : 62, fonte:'display', peso:700, alinha:al }));
    if(s.texto) els.push(elementoTexto({ papel:'texto', txt:s.texto, x:m, w:L - m*2, y:0,
      tam: capa ? 40 : 44, fonte:'corpo', peso:400, alinha:al }));
    const g = contextoDeMedida();
    const alturas = els.map(e => medirTexto(g, e).altura);
    const vao = 30;
    const total = alturas.reduce((h, x) => h + x, 0) + vao * Math.max(0, els.length - 1);
    // Capa e fecho assentam embaixo, como cartaz, acima da assinatura; conteúdo
    // fica no miolo, que é onde o polegar para quando o carrossel passa.
    let y = capa ? (A - m - 84 - total) : Math.max(m + 150, (A - total) / 2);
    els.forEach((e, i)=>{ e.y = Math.round(y); y += alturas[i] + vao; });
    return { tipo:s.tipo || 'conteudo', fundo:{ cor:null, src:null, ajuste:'cobrir', escurecer:0 }, elementos:els };
  }
  // ---------- layouts de slide ----------

  // Um layout é um arranjo pronto: onde entra o título, onde entra a foto, o
  // que fica grande e o que fica pequeno. É a diferença entre "editor onde dá
  // pra mexer em tudo" e "estúdio onde a peça sai rápido" — e é também o que
  // faz o perfil do cliente parecer um perfil só, porque a repetição do
  // arranjo é o que o olho reconhece de longe.
  //
  // Aplicar um layout NÃO apaga o que já está escrito: o texto que existe é
  // encaixado nos lugares do arranjo novo, pelo papel de cada um.

  // Empilha uma lista de elementos de texto medindo cada um, e devolve a altura
  // total. `base` diz onde o bloco assenta: 'baixo' encosta no rodapé (cartaz),
  // 'meio' centra no miolo, 'cima' começa no topo.
  function empilhar(els, caixa){
    const g = contextoDeMedida();
    const espaco = caixa.base - caixa.topo;
    const tamOriginal = els.map(e => e.tam);
    const vaoOriginal = els.map(e => e._vao == null ? 28 : e._vao);
    const medir = ()=>{
      const alturas = els.map(e => e.tipo === 'texto' ? medirTexto(g, e).altura : e.h);
      let total = alturas.reduce((h, x) => h + x, 0);
      els.forEach((e, i)=>{ if(i < els.length - 1) total += (e._vao == null ? 28 : e._vao); });
      return { alturas, total };
    };
    let m = medir();
    // Não coube: encolhe o conjunto inteiro até caber, com piso. Encolher junto
    // preserva a hierarquia entre título e apoio; encolher só o que estourou
    // destrói a hierarquia, que é o que a peça tem de mais valioso.
    let escala = 1, voltas = 0;
    while(m.total > espaco && escala > 0.66 && voltas++ < 16){
      escala -= 0.04;
      els.forEach((e, i)=>{
        if(e.tipo === 'texto') e.tam = Math.max(16, Math.round(tamOriginal[i] * escala));
        e._vao = Math.round(vaoOriginal[i] * escala);
      });
      m = medir();
    }
    let y = caixa.topo;
    if(caixa.modo === 'baixo') y = caixa.base - m.total;
    else if(caixa.modo === 'meio') y = caixa.topo + Math.max(0, (espaco - m.total) / 2);
    y = Math.max(caixa.topo, y);
    els.forEach((e, i)=>{
      e.y = Math.round(y);
      y += m.alturas[i] + (e._vao == null ? 28 : e._vao);
      delete e._vao;
    });
    return m.total;
  }

  // ---------- tipografia ----------

  // Uma escala só, em vez de números escolhidos a dedo. Todo tamanho da peça
  // sai de uma razão fixa a partir do corpo do texto, e é isso que faz os
  // tamanhos parecerem parentes em vez de vizinhos por acaso.
  const RAZAO = 1.22;
  const passo = (A, n) => Math.round(A * 0.0295 * Math.pow(RAZAO, n));

  // Tracking óptico. Fonte grande precisa de menos espaço entre letras, e
  // maiúscula precisa de mais — é a diferença entre um título desenhado e um
  // título digitado. Onde o navegador não suportar, ele ignora, e o texto sai
  // sem o ajuste em vez de sair quebrado.
  function trackingDe(e){
    if(e.letra != null) return e.letra;
    if(e.caixa === 'alta') return 0.07;
    if(e.tam >= 84) return -0.028;
    if(e.tam >= 56) return -0.017;
    if(e.tam >= 36) return -0.006;
    return 0;
  }
  function comTracking(g, e){
    const em = trackingDe(e);
    try { g.letterSpacing = (em * e.tam).toFixed(2) + 'px'; } catch(err){ /* navegador antigo */ }
  }
  const semTracking = g => { try { g.letterSpacing = '0px'; } catch(err){} };

  // Palavras que não podem terminar uma linha. Preposição, artigo e conjunção
  // penduradas no fim da linha é o erro de tipografia mais comum em português
  // e o mais fácil de ver depois que alguém aponta.
  const PRESAS = new Set(('de da do das dos e ou a o as os em no na nos nas um uma uns umas '
    + 'com por para pra que se ao aos à às pelo pela pelos pelas sem sob sobre entre até').split(' '));

  function quebrar(g, texto, larg){
    const linhas = [];
    String(texto == null ? '' : texto).split('\n').forEach(par=>{
      let linha = '';
      const bruto = [];
      par.split(/\s+/).filter(Boolean).forEach(p=>{
        const tent = linha ? linha + ' ' + p : p;
        if(linha && g.measureText(tent).width > larg){ bruto.push(linha); linha = p; }
        else linha = tent;
      });
      bruto.push(linha);
      linhas.push.apply(linhas, arrumarLinhas(g, bruto, larg));
    });
    return linhas;
  }

  // Duas correções depois da quebra bruta:
  //   viúva  — uma palavra curta sozinha na última linha
  //   presa  — linha terminando em preposição, artigo ou conjunção
  //
  // A correção é sempre a mesma: empurrar a última palavra da linha pra linha
  // de baixo. Mas empurrar transborda — a linha que recebeu pode estourar e
  // precisa empurrar a dela, em cascata. E só se aceita o resultado se ele
  // tiver MENOS problemas que o anterior, o que garante que isso termina.
  function fimPreso(linha){
    const pal = linha.split(' ');
    if(pal.length < 2) return false;
    return PRESAS.has(pal[pal.length-1].toLowerCase().replace(/[^a-zà-ú]/g,''));
  }
  function problemas(l){
    let n = 0;
    for(let i = 0; i < l.length - 1; i++) if(fimPreso(l[i])) n++;
    if(l.length > 1){
      const ult = l[l.length-1].split(' ');
      if(ult.length === 1 && ult[0].length <= 12) n++;
    }
    return n;
  }
  function empurrarCascata(g, l, i, larg){
    const cabe = t => g.measureText(t).width <= larg;
    const pal = l[i].split(' ');
    if(pal.length < 2) return null;
    const out = l.slice();
    const desce = pal.pop();
    out[i] = pal.join(' ');
    if(i + 1 >= out.length) out.push(desce);
    else out[i+1] = desce + ' ' + out[i+1];
    for(let k = i + 1; k < out.length; k++){
      let voltas = 0;
      while(!cabe(out[k]) && out[k].split(' ').length > 1 && voltas++ < 40){
        const p2 = out[k].split(' ');
        const d2 = p2.pop();
        out[k] = p2.join(' ');
        if(k + 1 >= out.length) out.push(d2);
        else out[k+1] = d2 + ' ' + out[k+1];
      }
    }
    // Ganhar duas linhas pra consertar uma preposição é mau negócio.
    if(out.length > l.length + 1) return null;
    return out;
  }
  function arrumarLinhas(g, linhas, larg){
    let l = linhas.slice();
    let restante = problemas(l);
    for(let volta = 0; volta < 8 && restante > 0; volta++){
      let melhorou = false;
      for(let i = l.length - 2; i >= 0 && !melhorou; i--){
        const ehPresa = fimPreso(l[i]);
        const ehViuva = i === l.length - 2 &&
          l[l.length-1].split(' ').length === 1 && l[l.length-1].length <= 12;
        if(!ehPresa && !ehViuva) continue;
        const tent = empurrarCascata(g, l, i, larg);
        if(!tent) continue;
        const n = problemas(tent);
        if(n < restante){ l = tent; restante = n; melhorou = true; }
      }
      if(!melhorou) break;
    }
    return l;
  }

  // Imagens ficam num cache por src: sem isto cada tecla digitada recarregaria
  // a foto e a prévia piscaria.
  const cacheImg = {};
  const focoGuardado = src => (cacheImg[src] && cacheImg[src].foco) || { x:0.5, y:0.5 };
  function imagemDe(src, aoCarregar){
    if(!src) return null;
    if(cacheImg[src]) return cacheImg[src].completo ? cacheImg[src].img : null;
    const img = new Image();
    const reg = { img, completo:false };
    cacheImg[src] = reg;
    img.onload = ()=>{
      reg.completo = true;
      try { reg.foco = focoDe(img); } catch(e){ reg.foco = { x:0.5, y:0.5 }; }
      if(aoCarregar) aoCarregar();
    };
    img.onerror = ()=>{ reg.completo = false; };
    img.src = src;
    return null;
  }

  // Desenha uma imagem cobrindo ou cabendo dentro da caixa, com canto
  // arredondado opcional. Mesma conta usada na prévia e na exportação.
  // ---------- tratamento e enquadramento da foto ----------

  // Onde está o assunto da foto. Cortar sempre pelo meio é o que decepa cabeça
  // em foto de retrato: o centro geométrico quase nunca é o centro do interesse.
  // A conta é grosseira de propósito — mede onde a imagem tem mais variação,
  // que é onde costuma estar a pessoa, e não onde tem parede.
  function focoDe(img){
    const L = 64, A = Math.max(1, Math.round(L * img.height / img.width));
    const cv = document.createElement('canvas');
    cv.width = L; cv.height = A;
    const g = cv.getContext('2d', { willReadFrequently:true });
    g.drawImage(img, 0, 0, L, A);
    let px;
    try { px = g.getImageData(0, 0, L, A).data; } catch(e){ return { x:0.5, y:0.5 }; }
    const cinza = new Float32Array(L * A);
    for(let i = 0; i < L*A; i++)
      cinza[i] = 0.2126*px[i*4] + 0.7152*px[i*4+1] + 0.0722*px[i*4+2];
    let sx = 0, sy = 0, soma = 0;
    for(let yy = 1; yy < A-1; yy++) for(let xx = 1; xx < L-1; xx++){
      const i = yy*L + xx;
      const e = Math.abs(cinza[i] - cinza[i+1]) + Math.abs(cinza[i] - cinza[i+L]);
      // o peso dá preferência ao terço de cima, que é onde fica rosto
      const peso = e * (yy < A*0.55 ? 1.25 : 1);
      sx += xx * peso; sy += yy * peso; soma += peso;
    }
    if(soma < 1) return { x:0.5, y:0.5 };
    // puxado pro centro: foco cru demais corta torto em foto de paisagem
    const bruto = { x: sx/soma/L, y: sy/soma/A };
    return { x: 0.5 + (bruto.x - 0.5) * 0.7, y: 0.5 + (bruto.y - 0.5) * 0.7 };
  }

  // O tratamento roda uma vez por (foto, tratamento, cores) e fica guardado.
  // Sem isso, mexer num cursor recalcularia dois milhões de pixels por quadro.
  function tratarImagem(src, img, trat, a, b){
    if(!trat || trat === 'nenhum') return img;
    const reg = cacheImg[src];
    if(!reg) return img;
    const chave = trat + '|' + a + '|' + b;
    reg.tratadas = reg.tratadas || {};
    if(reg.tratadas[chave]) return reg.tratadas[chave];
    const cv = document.createElement('canvas');
    cv.width = img.width; cv.height = img.height;
    const g = cv.getContext('2d', { willReadFrequently:true });
    g.drawImage(img, 0, 0);
    let d;
    try { d = g.getImageData(0, 0, cv.width, cv.height); } catch(e){ return img; }
    const px = d.data;
    const ca = hexParaRgb(a).map(v => v*255), cb = hexParaRgb(b).map(v => v*255);
    for(let i = 0; i < px.length; i += 4){
      const lum = (0.2126*px[i] + 0.7152*px[i+1] + 0.0722*px[i+2]) / 255;
      if(trat === 'pb'){
        const v = lum * 255;
        px[i] = v; px[i+1] = v; px[i+2] = v;
      } else if(trat === 'duotone'){
        px[i]   = ca[0] + (cb[0] - ca[0]) * lum;
        px[i+1] = ca[1] + (cb[1] - ca[1]) * lum;
        px[i+2] = ca[2] + (cb[2] - ca[2]) * lum;
      } else { // véu: mantém a foto e puxa a cor por cima
        px[i]   = px[i]   * 0.45 + cb[0] * lum * 0.55;
        px[i+1] = px[i+1] * 0.45 + cb[1] * lum * 0.55;
        px[i+2] = px[i+2] * 0.45 + cb[2] * lum * 0.55;
      }
    }
    g.putImageData(d, 0, 0);
    reg.tratadas[chave] = cv;
    return cv;
  }

  function pintarImagem(g, img, x, y, w, h, ajuste, raio, foco){
    g.save();
    if(raio > 0){
      const r = Math.min(raio, w/2, h/2);
      g.beginPath();
      g.moveTo(x+r, y);
      g.arcTo(x+w, y, x+w, y+h, r);
      g.arcTo(x+w, y+h, x, y+h, r);
      g.arcTo(x, y+h, x, y, r);
      g.arcTo(x, y, x+w, y, r);
      g.closePath();
      g.clip();
    } else {
      g.beginPath(); g.rect(x, y, w, h); g.clip();
    }
    const rc = img.width / img.height, rb = w / h;
    let dw, dh;
    if(ajuste === 'conter' ? rc > rb : rc < rb){ dw = w; dh = w / rc; }
    else { dh = h; dw = h * rc; }
    // Enquadramento: o ponto de foco da foto vai pro meio da caixa, preso nas
    // bordas pra nunca sobrar buraco. Sem foco, cai no centro de sempre.
    const f = foco || { x:0.5, y:0.5 };
    const px = Math.min(x, Math.max(x + w - dw, x + w/2 - f.x*dw));
    const py = Math.min(y, Math.max(y + h - dh, y + h/2 - f.y*dh));
    g.drawImage(img, dw >= w ? px : x + (w - dw)/2, dh >= h ? py : y + (h - dh)/2, dw, dh);
    g.restore();
  }

  // Mede um elemento de texto sem pintar. Serve pro acerto de clique e pra
  // moldura de seleção saberem onde o texto realmente está.
  function medirTexto(g, e, c){
    g.font = (e.peso || 400) + ' ' + e.tam + 'px ' + famDe(e.fonte);
    comTracking(g, e);
    const txt = e.caixa === 'alta' ? String(e.txt || '').toUpperCase() : String(e.txt || '');
    const linhas = quebrar(g, txt, e.w);
    const lh = e.tam * (e.alt || 1.14);
    semTracking(g);
    return { linhas, lh, altura: linhas.length * lh };
  }

  // ---------- o deck precisa parecer um deck ----------

  // Um carrossel bom é uma peça só em dez quadros: os internos repetem o mesmo
  // desenho e a capa é que destoa, de propósito. Então a conferência olha só os
  // slides internos, junta os textos pelo papel que cada um faz — título com
  // título, apoio com apoio — e reclama quando um foge do que os outros fazem.
  // É o erro que ninguém vê slide a slide e todo mundo vê quando o carrossel
  // passa no feed.

  function desenharSlide(cv, slide, deck, i, escala, opts){
    opts = opts || {};
    // Peça antiga (título e texto por slide) é convertida na hora de desenhar,
    // pra prévia da Marca e peça guardada em setembro continuarem abrindo.
    slide = migrarSlide(slide || {}, deck);
    const [ , , L, A] = medidas(deck.formato);
    escala = escala || 1;
    cv.width = Math.round(L * escala);
    cv.height = Math.round(A * escala);
    const g = cv.getContext('2d');
    g.save();
    g.scale(escala, escala);
    const c = coresDoDeck(deck);
    const fundo = slide.fundo || {};

    g.fillStyle = fundo.cor || c.fundo;
    g.fillRect(0, 0, L, A);
    if(fundo.src){
      const img = imagemDe(fundo.src, opts.aoCarregar);
      if(img) pintarImagem(g, tratarImagem(fundo.src, img, fundo.trat, c.breu || c.fundo, c.destaque),
        0, 0, L, A, fundo.ajuste || 'cobrir', 0, fundo.foco || focoGuardado(fundo.src));
    }
    if(fundo.escurecer){
      g.fillStyle = 'rgba(0,0,0,' + Math.min(0.85, fundo.escurecer) + ')';
      g.fillRect(0, 0, L, A);
    }

    const m = deck.margem === 'compacta' ? 66 : 92;

    // Faixa e numeração continuam automáticas e sempre no mesmo lugar: são
    // assinatura, não decoração solta. O registro do conselho depende disso.
    if(deck.faixa !== false){
      g.fillStyle = c.faixa;
      g.fillRect(m, m, 108, 8);
    }
    const total = (deck.slides || []).length;
    if(total > 1 && deck.numerar !== false){
      g.fillStyle = fundo.src || fundo.escurecer ? '#FFFFFF' : c.apoio;
      g.globalAlpha = fundo.src ? 0.85 : 1;
      g.font = '700 26px ' + famDe('mono');
      g.textAlign = 'right';
      g.fillText(String(i+1).padStart(2,'0') + '/' + String(total).padStart(2,'0'), L - m, m + 12);
      g.textAlign = 'left';
      g.globalAlpha = 1;
    }

    (slide.elementos || []).forEach(e=>{
      g.save();
      g.globalAlpha = e.opac == null ? 1 : e.opac;
      if(e.tipo === 'imagem'){
        const img = imagemDe(e.src, opts.aoCarregar);
        if(img) pintarImagem(g, tratarImagem(e.src, img, e.trat, c.breu || c.fundo, c.destaque),
          e.x, e.y, e.w, e.h, e.ajuste || 'cobrir', e.raio || 0, e.foco || focoGuardado(e.src));
        else {
          // Lugar de foto ainda vazio. Fica dito na peça, senão vira um
          // retângulo cinza que ninguém sabe se é buraco ou desenho.
          g.fillStyle = 'rgba(128,128,128,.16)';
          g.fillRect(e.x, e.y, e.w, e.h);
          g.fillStyle = 'rgba(128,128,128,.75)';
          g.font = '700 ' + Math.max(18, Math.round(Math.min(e.w, e.h) * 0.1)) + 'px ' + famDe('mono');
          g.textAlign = 'center';
          g.fillText('FOTO', e.x + e.w/2, e.y + e.h/2);
          g.textAlign = 'left';
        }
        e._caixa = { x:e.x, y:e.y, w:e.w, h:e.h };
      } else if(e.tipo === 'forma'){
        g.fillStyle = e.cor || c.destaque;
        if(e.forma === 'circulo'){
          g.beginPath();
          g.ellipse(e.x + e.w/2, e.y + e.h/2, e.w/2, e.h/2, 0, 0, Math.PI*2);
          g.fill();
        } else if(e.raio){
          const r = Math.min(e.raio, e.w/2, e.h/2);
          g.beginPath();
          g.moveTo(e.x+r, e.y);
          g.arcTo(e.x+e.w, e.y, e.x+e.w, e.y+e.h, r);
          g.arcTo(e.x+e.w, e.y+e.h, e.x, e.y+e.h, r);
          g.arcTo(e.x, e.y+e.h, e.x, e.y, r);
          g.arcTo(e.x, e.y, e.x+e.w, e.y, r);
          g.closePath(); g.fill();
        } else {
          g.fillRect(e.x, e.y, e.w, e.h);
        }
        e._caixa = { x:e.x, y:e.y, w:e.w, h:e.h };
      } else {
        const med = medirTexto(g, e, c);
        comTracking(g, e);   // medirTexto devolve o contexto limpo; aqui vai pintar
        const cor = e.cor || (fundo.src || fundo.escurecer ? '#FFFFFF' : (e.papel === 'texto' ? c.apoio : c.tinta));
        const xTexto = e.alinha === 'centro' ? e.x + e.w/2 : (e.alinha === 'dir' ? e.x + e.w : e.x);
        g.textAlign = e.alinha === 'centro' ? 'center' : (e.alinha === 'dir' ? 'right' : 'left');
        // Realce: a tarja atrás do texto, linha a linha, como se fosse
        // marca-texto. Ela acompanha a largura de cada linha e não a da caixa.
        if(e.realce){
          g.fillStyle = e.realce;
          med.linhas.forEach((l, k)=>{
            const larg = g.measureText(l).width;
            const lx = e.alinha === 'centro' ? xTexto - larg/2 : (e.alinha === 'dir' ? xTexto - larg : xTexto);
            g.fillRect(lx - 12, e.y + k*med.lh + e.tam*0.16, larg + 24, e.tam * 1.02);
          });
        }
        g.fillStyle = cor;
        med.linhas.forEach((l, k)=>{ g.fillText(l, xTexto, e.y + k*med.lh + e.tam); });
        e._caixa = { x:e.x, y:e.y, w:e.w, h:Math.max(e.tam, med.altura) };
        semTracking(g);
        g.textAlign = 'left';
      }
      g.restore();
    });

    // Assinatura: sempre no mesmo canto, sempre presente. É o que faz a regra
    // de registro profissional não depender de ninguém lembrar dela.
    if(deck.assinatura){
      // A assinatura fica sempre no mesmo canto, e por isso um layout com faixa
      // embaixo passaria por cima dela. Em vez de proibir a faixa, a assinatura
      // olha o que está atrás e escolhe a cor que se lê — é obrigação de norma,
      // não pode depender de ninguém reparar.
      let corAssin = fundo.src || fundo.escurecer ? 'rgba(255,255,255,.85)' : c.apoio;
      const atras = elementoEm({ elementos:(slide.elementos || []).filter(x => x.tipo !== 'texto') },
        m + 4, A - m - 10);
      if(atras && (atras.opac == null || atras.opac > 0.6)){
        corAssin = atras.tipo === 'imagem' ? 'rgba(255,255,255,.9)'
          : misturar(tintaSobre(atras.cor || c.destaque), atras.cor || c.destaque, 0.28);
      }
      g.fillStyle = corAssin;
      g.font = '400 24px ' + famDe('mono');
      g.fillText(String(deck.assinatura).slice(0, 64), m, A - m);
    }

    // As linhas de encaixe. Como a moldura, só na tela.
    (opts.guias || []).forEach(gg=>{
      g.strokeStyle = '#FF5E00';
      g.lineWidth = 2 / escala;
      g.setLineDash([]);
      g.beginPath();
      if(gg.eixo === 'v'){ g.moveTo(gg.pos, 0); g.lineTo(gg.pos, A); }
      else { g.moveTo(0, gg.pos); g.lineTo(L, gg.pos); }
      g.stroke();
    });

    // Moldura de seleção. Só na tela, nunca no arquivo exportado.
    if(opts.selecionado){
      const sel = (slide.elementos || []).find(x => x.id === opts.selecionado);
      if(sel && sel._caixa){
        // Espessura constante na tela: a moldura tem que se ver igual na
        // miniatura de 11% e no palco de 80%.
        g.strokeStyle = '#FF5E00';
        g.lineWidth = 3 / escala;
        g.setLineDash([11 / escala, 8 / escala]);
        g.strokeRect(sel._caixa.x - 8, sel._caixa.y - 8, sel._caixa.w + 16, sel._caixa.h + 16);
        g.setLineDash([]);
      }
    }
    g.restore();
    return cv;
  }

  // Qual elemento está debaixo do dedo. De cima pra baixo: o que está por
  // último foi desenhado por cima, então ganha o clique.
  function elementoEm(slide, x, y){
    const els = slide.elementos || [];
    for(let i = els.length - 1; i >= 0; i--){
      const b = els[i]._caixa;
      if(!b) continue;
      if(x >= b.x - 8 && x <= b.x + b.w + 8 && y >= b.y - 8 && y <= b.y + b.h + 8) return els[i];
    }
    return null;
  }

  // ---------- a marca de cada cliente ----------

  // Toda peça começa com o jeito daquele cliente já aplicado. Sem isto, cada
  // carrossel sai um pouco diferente do anterior — e é justamente a repetição
  // visual que faz um perfil parecer profissional sem parecer publicidade.
  const MARCA_PADRAO = {
    cor2:'', preset:'papel', formato:'4:5', alinha:'esq', margem:'folgada',
    numerar:true, faixa:true,
    tom:'', evitar:'', chamada:'', hashtags:'', publico:'',
  };
  function marcaDe(c){
    return Object.assign({}, MARCA_PADRAO, (c && c.marca) || {});
  }
  async function salvarMarca(c, campos){
    const nova = Object.assign({}, marcaDe(c), campos);
    const { error } = await sb.from('clientes').update({ marca:nova }).eq('id', c.id);
    if(error){ toast('Não deu: ' + error.message); return false; }
    c.marca = nova;
    return true;
  }

  // ---------- o que o formulário dele já respondeu ----------

  const respostasDe = id => {
    const r = (state.respostas || []).find(x => x.cliente_id === id);
    return (r && r.respostas) || null;
  };

  // Frases inteiras, do jeito que a pessoa escreveu. É de propósito: a melhor
  // linha de abertura que um cliente tem quase sempre já está dita por ele na
  // resposta do formulário, e reescrever costuma piorar.
  function frasesDe(texto){
    return String(texto || '')
      .split(/(?<=[.!?…])\s+|\n+/)
      .map(x => x.trim().replace(/^["“”'\-–—\s]+|["“”'\s]+$/g,''))
      .filter(x => x.length >= 24 && x.length <= 190);
  }

  // Cada sugestão diz de qual pergunta veio. Sem a origem, vira palpite; com
  // ela, dá pra conferir se está sendo bem usada.
  const FONTES_SUGESTAO = [
    { chave:'motivo_comeco',       oq:'gancho',  rot:'O que fez começar' },
    { chave:'gosta_mais',          oq:'gancho',  rot:'O que mais gosta' },
    { chave:'elogio_frequente',    oq:'tema',    rot:'O elogio que sempre recebem' },
    { chave:'diferencial',         oq:'tema',    rot:'O diferencial' },
    { chave:'entrega_orgulho',     oq:'tema',    rot:'A entrega de que se orgulham' },
    { chave:'faz_procurar',        oq:'objecao', rot:'O que faz procurarem' },
    { chave:'pesa_cansa',          oq:'objecao', rot:'O que pesa no dia a dia' },
    { chave:'cliente_ideal',       oq:'publico', rot:'O cliente ideal' },
    { chave:'descricao_outros',    oq:'tom',     rot:'Como descrevem o jeito deles' },
    { chave:'referencia_inspiracao', oq:'tom',   rot:'A referência que inspira' },
    { chave:'sonho_maior',         oq:'gancho',  rot:'O sonho por trás' },
    { chave:'espaco_livre',        oq:'gancho',  rot:'O que quiseram contar' },
  ];
  function sugestoesDe(cliente, oQue){
    const r = respostasDe(cliente && cliente.id);
    if(!r) return [];
    const fora = [];
    FONTES_SUGESTAO.filter(f => !oQue || f.oq === oQue).forEach(f=>{
      frasesDe(r[f.chave]).slice(0,2).forEach(fr=>{
        if(!fora.some(x => x.frase === fr)) fora.push({ frase:fr, de:f.rot, chave:f.chave, oq:f.oq });
      });
    });
    return fora;
  }

  // O painel de sugestões. Aparece em toda ferramenta do estúdio quando há um
  // cliente escolhido e ele já respondeu o formulário.
  function blocoSugestoes(cliente, oQue, usar){
    const box = el('div',{class:'bloco-conf sugestoes'});
    box.appendChild(el('p',{class:'rot'},'Do formulário dele'));
    if(!cliente){
      box.appendChild(el('p',{class:'dica', style:'margin:8px 0 0'},
        'Escolha um cliente aí em cima e as respostas dele viram sugestão aqui.'));
      return box;
    }
    const sug = sugestoesDe(cliente, oQue);
    if(!sug.length){
      box.appendChild(el('p',{class:'dica', style:'margin:8px 0 0'},
        respostasDe(cliente.id)
          ? 'Ele respondeu o formulário, mas as respostas úteis pra este tipo de peça vieram curtas demais.'
          : 'Este cliente ainda não tem formulário respondido ligado à ficha dele.'));
      return box;
    }
    box.appendChild(el('p',{class:'dica', style:'margin:8px 0 14px'},
      'Frases que eles mesmos escreveram. Usar a palavra do cliente soa melhor que reescrever — '
      + 'e é a única prova social que não depende de depoimento.'));
    sug.slice(0,8).forEach(s=>{
      const l = el('div',{class:'sugest'});
      const c = el('div',{class:'corpo'});
      c.appendChild(el('p',{class:'frase'}, '“' + esc(s.frase) + '”'));
      c.appendChild(el('p',{class:'de'}, esc(s.de)));
      l.appendChild(c);
      if(usar) l.appendChild(el('button',{class:'btn ghost small', onclick:()=>usar(s)},'usar'));
      l.appendChild(el('button',{class:'linkbtn', onclick:async()=>{
        try { await navigator.clipboard.writeText(s.frase); toast('Copiado.'); }
        catch(e){ toast('O navegador não deixou copiar.'); }
      }},'copiar'));
      box.appendChild(l);
    });
    return box;
  }

  // ---------- a tela ----------

  function assinaturaDe(c){
    if(!c) return '';
    const reg = String(c.registro_profissional || '').trim();
    if(!reg) return '';
    const quem = String(c.contato_nome || c.nome_preferido || c.nome || '').trim();
    return quem ? quem + ' · ' + reg : reg;
  }

  // ---------- a marca, por cliente ----------

  // Mesma estrutura do formulário "Conhecendo Você(s) e Seu Trabalho".
  // Existe aqui para o painel mostrar cada resposta com a pergunta que a gerou.
  // Espelho do formulário "Conhecendo Você(s) e Seu Trabalho", que tem duas
  // trilhas desde 21/09. Existe aqui para o painel mostrar cada resposta com a
  // pergunta que a gerou — e as perguntas mudam conforme quem respondeu.
  //
  // As chaves compartilhadas têm o MESMO nome nas duas trilhas: é por elas que
  // a marca, as sugestões e o pedido pra IA funcionam sem saber de trilha.

  // simulação do feed, e o registro entra na assinatura obrigatória. Um
  // termômetro que mede outra coisa é enfeite.
  function prontoPraProduzir(c){
    const m = c.marca || {};
    const itens = [
      ['o formulário', state.respostas.some(r => r.cliente_id === c.id)],
      ['o tom da marca', !!String(m.tom || '').trim()],
      ['a cor', !!c.cor],
      ['o arroba', !!String(c.instagram || '').trim()],
    ];

    // tecnologia não tem CREF nem CRO, e cobrar isso dela deixava o medidor
    // preso em 4/5 pra sempre — medidor que nunca fecha é medidor que a pessoa
    // aprende a ignorar, e aí ele para de servir pro que foi feito.
    if(conselhoDe(c)) itens.push(['a assinatura', !!String(c.registro_profissional || '').trim()]);
    return {
      prontas: itens.filter(x => x[1]).length,
      total: itens.length,
      falta: itens.filter(x => !x[1]).map(x => x[0]),
    };
  }

        'A peça traz nome do advogado ou da sociedade e o número de inscrição na OAB?',
        'Se cita título ("Dr.", mestre, pós-graduado), você consegue comprovar à OAB se for solicitado?',
        'Se é anúncio pago: o criativo informa, em vez de ofertar serviço?',
        'Se menciona um caso: ele já era público na imprensa e a manifestação foi espontânea? (o sigilo é de ordem pública — autorização do cliente NÃO libera)',
        'O tom da peça é sóbrio e discreto, ou soa como captação?',
      ],
    },
  ];

  const PACOTE_GENERICO = {
    id:'generico', nome:'Sem conselho profissional', conselho:null,
    conferido_em:'2026-09-16', revisado_por:null, normas:[], regras:[], confirme:[],
  };

  function pacoteDe(cliente){
    const v = String((cliente && cliente.vertical) || '').toLowerCase();
    if(!v) return PACOTE_GENERICO;
    return PACOTES_REGRA.find(p => p.casa.some(c => new RegExp(c, 'i').test(v))) || PACOTE_GENERICO;
  }
  const conselhoDe = c => (pacoteDe(c).conselho || null);

  const conjuntosDe = c => (marcaDe(c).conjuntos || []).filter(j => j && j.k);
  // A peça leva uma CÓPIA do conjunto, não o apelido dele. É de propósito, e é
  // a mesma decisão que já valia pra cor e pro preset: um carrossel aprovado em
  // setembro não pode mudar de cara sozinho porque alguém mexeu no manual em
  // outubro. Quem quiser a versão nova aperta "Voltar ao padrão".
  function conjuntoPadraoDe(c){
    const k = marcaDe(c).conjuntoPadrao;
    const j = k && conjuntosDe(c).find(x => x.k === k);
    return j ? JSON.parse(JSON.stringify(j)) : null;
  }
  // A pergunta que gerou a resposta. Procura na trilha certa primeiro e cai na
  // outra: uma chave compartilhada tem texto diferente em cada trilha, e mostrar
  // "há quanto tempo VOCÊ faz esse trabalho" na ficha de uma empresa é o tipo de
  // detalhe que faz o painel parecer que não sabe com quem está falando.
  const PERGUNTA = (chave, trilha) => {
    const ordem = trilha === 'empresa'
      ? ['empresa','solo'] : ['solo','empresa'];
    for(const t of ordem){
      let achou = '';
      SECOES_POR_TRILHA[t].forEach(s => s.perguntas.forEach(([k, p]) => { if(k === chave) achou = p; }));
      if(achou) return achou;
    }
    return '';
  };

  // Os pilares saem das respostas, não de um modelo de marketing: cada um é
  // uma pergunta do formulário que, respondida, dá assunto pro mês inteiro.
  const PILARES = [
    { k:'problema', nome:'O problema que faz procurar', de:['faz_procurar'],
      porque:'É o que a pessoa está vivendo quando digita o nome de vocês. Abre gancho sem precisar inventar.' },
    { k:'prova', nome:'Prova do que já aconteceu', de:['entrega_orgulho','elogio_frequente'],
      porque:'Resultado contado com detalhe é a única prova social que não depende de depoimento.' },
    { k:'diferenca', nome:'O que só vocês fazem', de:['diferencial'],
      porque:'Sem isso o conteúdo serve igual pra vocês e pro concorrente.' },
    { k:'bastidor', nome:'Quem faz, e como', de:['motivo_comeco','gosta_mais','pesa_cansa'],
      porque:'Bastidor é o que faz seguir uma marca em vez de só consumir o que ela publica.' },
    { k:'objecao', nome:'A objeção, respondida antes da reunião', de:['objecao_comum','alternativa_cliente'],
      so:'empresa',
      porque:'Em venda B2B o conteúdo raramente fecha; o que ele faz é chegar na reunião com a objeção já derrubada.' },
    { k:'comofunciona', nome:'Como vocês provam que funciona', de:['prova_tecnica'],
      so:'empresa',
      porque:'Comprador técnico não compra promessa: compra demonstração, piloto ou dado.' },
  ];

  const PALAVRAS_GENERICAS = ['qualidade','atendimento','compromisso','excelência','excelencia',
    'dedicação','dedicacao','profissionalismo','melhor preço','melhor preco','seriedade'];

  const temDigito = t => /\d/.test(String(t || ''));
  const palavras = t => String(t || '').trim().split(/\s+/).filter(Boolean).length;

  function diagnosticoDe(cliente){
    const sub = (state.respostas || []).filter(x => x.cliente_id === (cliente && cliente.id))
      .sort((a,b)=> String(b.recebido_em).localeCompare(String(a.recebido_em)))[0];
    const r = (sub && sub.respostas) || {};
    const trilha = sub ? trilhaDa(r) : ((cliente && cliente.tipo_cliente) === 'empresa' ? 'empresa' : 'solo');
    const secoes = SECOES_POR_TRILHA[trilha];
    const cheia = k => String(r[k] || '').trim();

    // --- o que foi respondido, por seção
    const porSecao = secoes.map(sec=>{
      const n = sec.perguntas.filter(([k]) => cheia(k)).length;
      return { titulo:sec.titulo, respondidas:n, total:sec.perguntas.length };
    });
    const total = porSecao.reduce((a,x)=> a + x.total, 0);
    const respondidas = porSecao.reduce((a,x)=> a + x.respondidas, 0);

    const vazias = [];
    secoes.forEach(sec => sec.perguntas.forEach(([k, q])=>{
      if(!cheia(k)) vazias.push({ chave:k, pergunta:q, secao:sec.titulo });
    }));

    // --- achados, separados por quanto a máquina pode afirmar
    //   vejo    — está escrito ali, dá pra apontar com o dedo
    //   pergunte — o texto sugere, mas quem conclui é uma pessoa
    const achados = [];
    // Todo achado diz de onde saiu. Quando não sai de uma pergunta específica —
    // é o caso do tamanho do formulário — a origem vem escrita à mão, porque
    // achado sem origem é achado com o qual ninguém consegue discordar.
    const vejo = (texto, de, origem) => achados.push({ nivel:'vejo', texto, de, origem });
    const pergunte = (texto, de, origem) => achados.push({ nivel:'pergunte', texto, de, origem });

    if(sub && respondidas < total * 0.6){
      vejo('Só ' + respondidas + ' de ' + total + ' perguntas foram respondidas. '
        + 'O que vem abaixo é o que dá pra concluir com isso — e não é muito.',
        [], 'o formulário inteiro');
    }

    const canal = cheia('como_encontram');
    if(canal){
      const sohIndicacao = /indica|boca a boca|amig|conhecid|networking/i.test(canal)
        && !/instagram|google|site|anúncio|anuncio|linkedin|youtube|busca|tráfego|trafego/i.test(canal);
      if(sohIndicacao) vejo('Os clientes chegam por indicação, e nenhum canal próprio aparece na resposta. '
        + 'Conteúdo aqui não gera demanda nova de imediato: ele faz quem foi indicado confirmar a escolha '
        + 'antes de falar com vocês.', ['como_encontram']);
    }

    const prova = cheia('entrega_orgulho');
    if(prova && !temDigito(prova))
      pergunte('A entrega de que mais se orgulham está contada sem nenhum número. '
        + 'Número é o que separa prova de elogio — vale perguntar quantos, em quanto tempo, de quanto pra quanto.',
        ['entrega_orgulho']);

    const dif = cheia('diferencial');
    if(dif){
      const generico = PALAVRAS_GENERICAS.some(w => dif.toLowerCase().includes(w));
      if(generico || palavras(dif) < 8)
        pergunte('O diferencial declarado é curto ou usa palavra que todo concorrente também usa. '
          + 'Serve de conteúdo só depois de virar uma frase que o concorrente não conseguiria assinar.',
          ['diferencial']);
    }

    if(trilha === 'empresa'){
      const decide = cheia('quem_decide');
      if(decide && /\b(e|mas|porém|porem|,)\b/i.test(decide) && palavras(decide) >= 6)
        vejo('Quem usa e quem assina não são a mesma pessoa, segundo a resposta de vocês. '
          + 'São dois públicos, e uma peça que fala com os dois ao mesmo tempo não fala com nenhum.',
          ['quem_decide']);

      const ciclo = cheia('ciclo_venda');
      if(/m[êe]s|mes(es)?|ano|semestre|trimestre/i.test(ciclo))
        vejo('O ciclo de venda é contado em meses. Nenhuma peça publicada este mês fecha contrato este mês — '
          + 'o que ela faz é encurtar o ciclo de quem já está conversando.', ['ciclo_venda']);

      const obj = cheia('objecao_comum');
      if(obj) vejo('Existe uma objeção que aparece quase sempre, e ela está escrita. '
        + 'É a peça de maior retorno do mês: responder antes da reunião economiza a reunião inteira.',
        ['objecao_comum']);

      if(!cheia('porta_voz'))
        vejo('Ninguém está definido pra aparecer ou assinar texto técnico. '
          + 'Conteúdo técnico sem rosto perde metade da autoridade, e é o rosto que faz o comprador confiar.',
          ['porta_voz']);

      if(/edital|licita/i.test(cheia('canal_venda')))
        vejo('Parte da venda passa por edital ou licitação. Conteúdo não ganha edital, mas quem avalia '
          + 'pesquisa o fornecedor — e o que ele acha é o que existe publicado.', ['canal_venda']);
    }

    // --- material que dá pra citar literalmente
    const frases = sugestoesDe(cliente).slice(0, 8);

    // --- pilares com e sem material
    const pilares = PILARES.filter(pi => !pi.so || pi.so === trilha).map(pi=>{
      const fontes = pi.de.filter(k => cheia(k));
      return { k:pi.k, nome:pi.nome, porque:pi.porque, fontes,
        tem: fontes.length > 0,
        falta: pi.de.filter(k => !cheia(k)).map(k => PERGUNTA(k, trilha)) };
    });

    return { trilha, sub, respostas:r, porSecao, total, respondidas, vazias,
      achados, frases, pilares, pronto: cliente ? prontoPraProduzir(cliente) : null };
  }

  // A pauta sugerida. É uma DISTRIBUIÇÃO, não uma fórmula validada: reparte as
  // peças do mês entre os pilares que têm material, dando mais peso ao problema
  // (que é o que abre gancho) e garantindo pelo menos uma de prova. Quem mexe
  // nisso depois é a pessoa, e a tela diz isso com todas as letras.
  function pautaSugerida(diag, quantas){
    const comMaterial = diag.pilares.filter(x => x.tem);
    if(!comMaterial.length) return [];
    const peso = { problema:3, objecao:2, prova:2, diferenca:2, comofunciona:2, bastidor:1 };
    // Reparte em rodadas, e não em blocos: enfileirar o peso de cada pilar de
    // uma vez dava "1. problema, 2. problema, 3. problema, 4. prova" — que lido
    // no mês vira três semanas falando da mesma coisa, e lido na tela parece
    // defeito. Uma rodada por vez alterna os pilares e mantém a proporção.
    const resta = new Map(comMaterial.map(pi => [pi.k, peso[pi.k] || 1]));
    const fora = [];
    while(fora.length < quantas){
      let deuAlgum = false;
      for(const pi of comMaterial){
        if(fora.length >= quantas) break;
        if(resta.get(pi.k) > 0){ fora.push(pi); resta.set(pi.k, resta.get(pi.k) - 1); deuAlgum = true; }
      }
      // Acabou o peso de todos e ainda falta peça: recarrega e roda de novo.
      if(!deuAlgum) comMaterial.forEach(pi => resta.set(pi.k, peso[pi.k] || 1));
    }
    return fora;
  }

  function promptDoPlano(cliente, diag){
    const L = [];
    const cheia = k => String(diag.respostas[k] || '').trim();
    L.push('Você é estrategista de conteúdo. Vou te dar o que um cliente respondeu num');
    L.push('formulário e o que já foi lido dessas respostas. Sua tarefa é escrever o PLANO DE');
    L.push('AÇÃO DO MÊS pra ele.');
    L.push('');
    L.push('Responda em português do Brasil. Sem introdução, sem elogio e sem comentário sobre');
    L.push('a tarefa. Vá direto pro plano.');
    L.push('');
    L.push('REGRA QUE NÃO PODE SER QUEBRADA: não invente fato sobre o cliente. Se uma');
    L.push('recomendação depende de algo que não está nas respostas, escreva a PERGUNTA que');
    L.push('precisa ser feita em vez de supor a resposta.');
    L.push('');
    L.push('## O CLIENTE');
    L.push('Nome: ' + (cliente.nome || '—') + (cliente.vertical ? ' — ' + cliente.vertical : ''));
    L.push('Tipo: ' + (diag.trilha === 'empresa'
      ? 'empresa, venda B2B com mais de um decisor' : 'profissional que trabalha por conta'));
    L.push('');
    L.push('## O QUE ELE RESPONDEU');
    SECOES_POR_TRILHA[diag.trilha].forEach(sec=>{
      const linhas = sec.perguntas.filter(([k]) => cheia(k));
      if(!linhas.length) return;
      L.push('');
      L.push('### ' + sec.titulo);
      linhas.forEach(([k, q]) => L.push('- ' + q + '\n  ' + cheia(k).replace(/\n+/g, ' ')));
    });
    L.push('');
    if(diag.vazias.length){
      L.push('## O QUE ELE NÃO RESPONDEU');
      L.push('Não preencha isto por conta: use pra saber o que ainda precisa ser perguntado.');
      diag.vazias.slice(0, 12).forEach(v => L.push('- ' + v.pergunta));
      L.push('');
    }
    if(diag.achados.length){
      L.push('## O QUE JÁ FOI LIDO DAS RESPOSTAS');
      diag.achados.forEach(a => L.push('- ' + (a.nivel === 'vejo' ? '[está escrito] ' : '[a confirmar] ') + a.texto));
      L.push('');
    }
    L.push('## FORMATO DA RESPOSTA (exatamente assim, sem nada além disso)');
    L.push('');
    L.push('ONDE ELE ESTÁ:');
    L.push('Três a cinco linhas, sem adjetivo, dizendo o que dá pra afirmar sobre a situação');
    L.push('dele hoje. Cada afirmação tem que caber numa resposta que ele deu.');
    L.push('');
    L.push('O QUE FAZER ESTE MÊS:');
    L.push('De três a cinco ações, cada uma numa linha começando por verbo. Ação que não dá');
    L.push('pra marcar como feita até o fim do mês não entra.');
    L.push('');
    L.push('O QUE PERGUNTAR PRA ELE:');
    L.push('As perguntas que precisam ser respondidas antes de decidir o resto. Se não houver,');
    L.push('escreva "nenhuma".');
    L.push('');
    L.push('PAUTA:');
    L.push('Um tema por linha, de 6 a 10 temas, cada um do tamanho de um título de post.');
    L.push('Sem numeração e sem marcador — só o tema, uma linha cada.');
    return L.join('\n');
  }

  function lerPlano(texto){
    const t = String(texto || '').replace(/\r/g, '');
    const semAcento = x => x.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
    const rotulos = ['ONDE ELE ESTÁ','O QUE FAZER ESTE MÊS','O QUE PERGUNTAR PRA ELE','PAUTA'];
    const alvo = semAcento(t);
    const pos = rotulos.map(r => ({ r, i: alvo.indexOf(semAcento(r) + ':') })).filter(x => x.i >= 0);
    if(!pos.length) return null;
    const fora = {};
    pos.forEach(x=>{
      const fim = pos.reduce((f, y) => (y.i > x.i && y.i < f) ? y.i : f, t.length);
      fora[x.r] = t.slice(x.i, fim).replace(/^[^:]*:\s*/, '').trim();
    });
    return {
      plano: rotulos.slice(0, 3).filter(r => fora[r])
        .map(r => r + ':\n' + fora[r]).join('\n\n'),
      pauta: (fora['PAUTA'] || '').split('\n')
        .map(x => x.replace(/^\s*[-•\d.)]+\s*/, '').trim()).filter(Boolean).join('\n'),
    };
  }

  // O que dá pra ler das respostas, os pilares e o pedido pra IA: só existe
  // com formulário. O plano em si, não — esse a equipe escreve de qualquer jeito.
  function leituraDoPlano(c, diag, mes){
    const w = el('div');
    // --- 1. o que a máquina leu
    const lido = el('div',{class:'bloco-conf'});
    lido.appendChild(el('p',{class:'rot'},'O que dá pra ler das respostas'));
    lido.appendChild(el('p',{class:'dica', style:'margin:6px 0 16px'},
      'Isto não é opinião nem estratégia: é o que está escrito nas respostas dele, e o que está faltando. '
      + 'Cada linha diz de qual pergunta saiu, pra você poder discordar.'));

    const placar = el('div',{class:'capa-fila', style:'margin-bottom:18px'});
    const cif = (g, p2, r2) => { const x = el('div');
      x.innerHTML = '<span class="cifra">' + esc(g) + (p2 ? '<em>' + esc(p2) + '</em>' : '')
        + '</span><p class="rot">' + esc(r2) + '</p>'; return x; };
    placar.appendChild(cif(diag.respondidas, '/' + diag.total, 'Respondidas'));
    placar.appendChild(cif(diag.pilares.filter(x => x.tem).length, '/' + diag.pilares.length, 'Pilares com material'));
    placar.appendChild(cif(diag.frases.length, '', 'Frases pra citar'));
    lido.appendChild(placar);

    if(diag.achados.length){
      diag.achados.forEach(a=>{
        const l = el('div',{class:'achado ' + a.nivel});
        l.appendChild(el('span',{class:'selo'}, a.nivel === 'vejo' ? 'está escrito' : 'a confirmar'));
        l.appendChild(el('p',{}, esc(a.texto)));
        l.appendChild(el('p',{class:'de'}, 'de: ' + (a.origem
          || (a.de || []).map(k => PERGUNTA(k, diag.trilha)).join(' · ')
          || 'o formulário inteiro')));
        lido.appendChild(l);
      });
    } else {
      lido.appendChild(el('p',{class:'dica', style:'margin:0'},
        'Nada saltou das respostas — o que é bom sinal, ou sinal de que respondeu pouco.'));
    }

    // seções fracas
    const fracas = diag.porSecao.filter(x => x.respondidas < x.total);
    if(fracas.length){
      lido.appendChild(el('p',{class:'rot', style:'margin:22px 0 8px'},'Onde o formulário ficou raso'));
      fracas.forEach(f=>{
        lido.appendChild(el('p',{class:'dica', style:'margin:0 0 4px'},
          f.titulo + ' — ' + f.respondidas + ' de ' + f.total));
      });
    }
    w.appendChild(lido);

    // --- 2. pilares
    const pil = el('div',{class:'bloco-conf'});
    pil.appendChild(el('p',{class:'rot'},'Sobre o que dá pra falar'));
    pil.appendChild(el('p',{class:'dica', style:'margin:6px 0 16px'},
      'Cada pilar é uma pergunta do formulário que, respondida, dá assunto pro mês inteiro. '
      + 'Os apagados são os que ele ainda não respondeu.'));
    diag.pilares.forEach(x=>{
      const l = el('div',{class:'pilar' + (x.tem ? '' : ' sem')});
      l.appendChild(el('b',{}, esc(x.nome)));
      l.appendChild(el('p',{}, esc(x.porque)));
      if(!x.tem) l.appendChild(el('p',{class:'de'},
        'sem material: ' + x.falta.join(' · ')));
      pil.appendChild(l);
    });
    w.appendChild(pil);

    // --- 3. pedir o plano pra uma IA
    const ped = el('div',{class:'bloco-conf prompt-ia'});
    ped.appendChild(el('p',{class:'rot'},'Pedir o plano pra uma IA'));
    ped.appendChild(el('p',{class:'dica', style:'margin:6px 0 14px'},
      'O que está acima é leitura. O julgamento — o que priorizar, com que ângulo — '
      + 'vem daqui: o pedido leva as respostas, o que falta e o que já foi lido, e proíbe '
      + 'a IA de inventar fato sobre ele.'));
    const acoes = el('div',{style:'display:flex;gap:10px;flex-wrap:wrap'});
    acoes.appendChild(el('button',{class:'btn', onclick:async()=>{
      const txt = promptDoPlano(c, diag);
      try { await navigator.clipboard.writeText(txt); toast('Pedido copiado — ' + txt.length + ' caracteres.'); }
      catch(e){ toast('O navegador não deixou copiar. Abra "ver o pedido" e copie à mão.'); }
    }},'Copiar o pedido'));
    ped.appendChild(acoes);
    const ver = el('details',{class:'expl'});
    ver.appendChild(el('summary',{},'ver o pedido'));
    const pre = el('pre',{class:'prompt-cru'});
    ver.addEventListener('toggle', ()=>{ if(ver.open) pre.textContent = promptDoPlano(c, diag); });
    ver.appendChild(pre);
    ped.appendChild(ver);

    const colar = el('div',{class:'colar-resposta', style:'margin-top:16px'});
    const ta = el('textarea',{rows:'4', placeholder:'Cole aqui o que a IA respondeu, no formato que o pedido pediu.'});
    colar.appendChild(ta);
    colar.appendChild(el('button',{class:'btn small', onclick:async()=>{
      const lido2 = lerPlano(ta.value);
      if(!lido2){ toast('Não reconheci o formato. Confira se veio como o pedido pediu.'); return; }
      await salvarPlano(c, mes, diag, lido2.plano, lido2.pauta);
      ta.value = '';
    }},'Preencher com a resposta'));
    ped.appendChild(colar);
    w.appendChild(ped);
    return w;
  }

  function abaPlano(c){
    const box = el('div');
    const diag = diagnosticoDe(c);
    const P = state.planoAberto || {};
    const mes = P.mes || primeiroDoMes(hojeIso());

    // --- cabeça: o mês e o estado
    const topo = el('div',{class:'plano-topo'});
    const selMes = el('input',{type:'month', value:String(mes).slice(0,7),
      'aria-label':'Mês do plano'});
    selMes.addEventListener('change', ()=>{
      state.planoAberto = { mes: (selMes.value || String(mes).slice(0,7)) + '-01' };
      carregarPlano(c.id).then(render);
    });
    topo.appendChild(el('p',{class:'rot', style:'margin:0'},'Mês'));
    topo.appendChild(selMes);
    box.appendChild(topo);

    if(!diag.sub){
      const v = el('div',{class:'vazio', style:'margin-top:18px'});
      v.appendChild(el('strong',{},'Sem formulário, não há o que ler'));
      v.appendChild(el('span',{},'A leitura do plano sai das respostas dele. Ligue uma resposta a este cliente '
        + 'na caixa de entrada, ou mande o formulário. O plano e a pauta dá pra escrever à mão aqui embaixo.'));
      box.appendChild(v);
    } else {
      box.appendChild(leituraDoPlano(c, diag, mes));
    }

    // --- 4. o plano em si
    // Antes de ler o plano guardado, o campo vazio apagaria o que já existe.
    if(state.detalhe.planoDe !== c.id + '|' + mes){
      box.appendChild(el('p',{class:'muted', style:'margin-top:18px'},'Lendo o plano do mês…'));
      return box;
    }
    const atual = state.detalhe.plano;
    const pl = el('div',{class:'bloco-conf'});
    pl.appendChild(el('p',{class:'rot'},'O plano deste mês'));
    const taPlano = el('textarea',{rows:'10', class:'campo-plano', 'aria-label':'O plano deste mês',
      placeholder:'Escreva aqui, ou cole a resposta da IA acima. Isto é o que você vai seguir no mês.'});
    taPlano.value = (atual && atual.plano) || '';
    pl.appendChild(taPlano);

    pl.appendChild(el('p',{class:'rot', style:'margin:22px 0 8px'},'Pauta do mês'));
    pl.appendChild(el('p',{class:'dica', style:'margin:0 0 10px'},
      'Um tema por linha. Em Criar → Produzir o mês, cada linha vira uma peça.'));
    const taPauta = el('textarea',{rows:'8', class:'campo-plano', 'aria-label':'Pauta do mês',
      placeholder:'Um tema por linha.'});
    taPauta.value = (atual && atual.pauta) || '';
    pl.appendChild(taPauta);

    const sug = pautaSugerida(diag, 8);
    if(sug.length && !String(taPauta.value).trim()){
      const cx = el('div',{style:'margin-top:12px'});
      cx.appendChild(el('p',{class:'dica', style:'margin:0 0 8px'},
        'Sem pauta ainda. Uma distribuição possível entre os pilares que têm material — '
        + 'é um ponto de partida pra mexer, não uma fórmula:'));
      const lista = el('div',{class:'chips'});
      sug.forEach((x, i)=> lista.appendChild(el('span',{class:'chip-p'}, (i+1) + '. ' + x.nome)));
      cx.appendChild(lista);
      pl.appendChild(cx);
    }

    const pe = el('div',{class:'pe-editor'});
    pe.appendChild(el('button',{class:'btn', onclick:async()=>{
      await salvarPlano(c, mes, diag, taPlano.value, taPauta.value);
    }},'Guardar o plano'));
    // A pauta vira peças de uma vez: o plano é guardado e a tela de produzir
    // o mês abre com este cliente, um tema por linha, cada um no seu formato.
    pe.appendChild(el('button',{class:'btn ghost small', onclick:async()=>{
      if(!String(taPauta.value || '').trim()){ toast('Escreva a pauta primeiro — um tema por linha.'); return; }
      // A fábrica produz a pauta do mês corrente; a do mês que vem espera ele chegar.
      if(mes !== primeiroDoMes(hojeIso())){ toast('Só a pauta deste mês vira peças. Guarde esta e produza quando o mês chegar.'); return; }
      if(!(await salvarPlano(c, mes, diag, taPlano.value, taPauta.value))) return;
      const cr = C(); cr.aba = 'lote'; cr.lote = { cliente:c.id };
      ir({tipo:'criar'});
    }},'Produzir o mês'));
    pe.appendChild(el('span',{style:'flex:1'}));
    pe.appendChild(el('button',{class:'btn ghost small', onclick:()=>{
      baixarPlano(c, mes, diag, taPlano.value, taPauta.value);
    }},'Baixar versão pro cliente'));
    pl.appendChild(pe);
    box.appendChild(pl);

    return box;
  }

  const primeiroDoMes = iso2 => String(iso2).slice(0, 7) + '-01';

  async function carregarPlano(clienteId){
    const mes = (state.planoAberto && state.planoAberto.mes) || primeiroDoMes(hojeIso());
    const { data } = await sb.from('planos').select('*')
      .eq('cliente_id', clienteId).eq('mes', mes).limit(1);
    state.detalhe.plano = (data && data[0]) || null;
    state.detalhe.planoDe = clienteId + '|' + mes;
  }

  async function salvarPlano(c, mes, diag, plano, pauta){
    // O diagnóstico vai junto, congelado: um plano escrito contra respostas que
    // mudaram depois vira um texto que não bate com nada, e ninguém sabe dizer
    // por quê. Guardar a leitura do dia é o que deixa a conversa possível.
    const linha = { cliente_id:c.id, mes,
      diagnostico: { trilha:diag.trilha, respondidas:diag.respondidas, total:diag.total,
        achados:diag.achados, pilares:diag.pilares.map(x=>({ k:x.k, nome:x.nome, tem:x.tem })) },
      plano: String(plano || '').trim() || null,
      pauta: String(pauta || '').trim() || null };
    // Um plano por cliente e mês: guardar é sempre o mesmo registro, mesmo que
    // a leitura dele ainda não tenha chegado nesta tela.
    const { error } = await sb.from('planos').upsert(linha, { onConflict:'cliente_id,mes' });
    if(error){ toast('Não deu: ' + error.message); return false; }
    toast('Plano guardado.');
    await carregarPlano(c.id);
    render();
    return true;
  }

  // A versão pro cliente. Sai sem o bastidor: sem "o formulário ficou raso",
  // sem o que a máquina leu, sem pauta em rascunho. O que ele recebe é o que
  // foi decidido, não como se chegou lá.
  function baixarPlano(c, mes, diag, plano, pauta){
    const texto = String(plano || '').trim();
    if(!texto){ toast('Escreva o plano antes de baixar.'); return; }
    const nomeMes = new Date(mes + 'T00:00:00')
      .toLocaleDateString('pt-BR', { month:'long', year:'numeric' });
    const temas = String(pauta || '').split('\n').map(x=>x.trim()).filter(Boolean);
    const L = [];
    L.push('# Plano de ' + nomeMes);
    L.push('');
    L.push(c.nome);
    L.push('');
    L.push('---');
    L.push('');
    L.push(texto);
    if(temas.length){
      L.push('');
      L.push('## O que vai ao ar');
      L.push('');
      temas.forEach((t, i)=> L.push((i+1) + '. ' + t));
    }
    L.push('');
    L.push('---');
    L.push('');
    L.push('Feito em ' + new Date().toLocaleDateString('pt-BR') + '.');
    const nome = 'plano-' + String(mes).slice(0,7) + '-'
      + (c.nome || 'cliente').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
        .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) + '.md';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([L.join('\n')], { type:'text/markdown;charset=utf-8' }));
    a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(a.href), 2000);
    toast('Baixado: ' + nome);
  }
