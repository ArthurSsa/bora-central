  function abaPagina(c){
    const box = el('div');
    const d = state.detalhe;
    const faltas = [];
    if(!(c.primeiro_valor_prometido||'').trim()) faltas.push('o primeiro valor prometido');
    if(!d.baselines.length) faltas.push('o ponto de partida');
    if(!d.metas.length) faltas.push('as metas');
    if(!d.marcos.length) faltas.push('os passos');

    const gerada = d.pagina && d.pagina.gerada_em;
    box.appendChild(placar([
      { rotulo:'Números de partida', valor:d.baselines.length },
      { rotulo:'Metas', valor:d.metas.length },
      { rotulo:'Passos', valor:d.marcos.length },
      { rotulo:'Textos seus na página', valor:Object.keys((d.pagina && d.pagina.blocos) || {}).length },
      { rotulo:'Correções', valor:(d.correcoes||[]).length, esconderSeZero:true },
    ]));

    if(faltas.length){
      const av = el('div',{class:'erro', style:'margin:0 0 18px'});
      av.innerHTML = 'A página sai mesmo assim, mas sem <strong>' + faltas.map(esc).join('</strong>, <strong>')
        + '</strong>. Seção sem dado simplesmente não aparece — nada é inventado.';
      box.appendChild(av);
    }
    if(gerada){
      box.appendChild(el('p',{class:'muted', style:'margin:0 0 18px;font-size:0.86rem'},
        'Já gerada em ' + dataBR(gerada) + '. A partir daqui, mudar meta ou baseline é correção do que o cliente já leu — a página passa a mostrar a data da correção.'));
    }

    const acoes = el('div',{style:'display:flex;gap:10px;flex-wrap:wrap;align-items:center'});
    const gerar = async (comEditor)=>{
      const html = montarPaginaCliente(c);
      if(!gerada) await marcarGerada(c);
      return html;
    };
    acoes.appendChild(el('button',{class:'btn', onclick:async()=>{
      const html = await gerar();
      const slug = (c.nome_preferido || c.nome || 'cliente').toLowerCase()
        .normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').slice(0,40).replace(/^-|-$/g,'');
      const url = URL.createObjectURL(new Blob([html], { type:'text/html;charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url; a.download = '90-dias-' + (slug || 'cliente') + '.html';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      toast('Página baixada.');
    }},'Baixar a página'));
    acoes.appendChild(el('button',{class:'btn ghost', onclick:async()=>{
      const html = await gerar();
      const url = URL.createObjectURL(new Blob([html], { type:'text/html;charset=utf-8' }));
      const w = window.open(url + '#editar', '_blank');
      if(!w) toast('O navegador bloqueou a janela. Libere pop-up para este site.');
      setTimeout(()=>URL.revokeObjectURL(url), 60000);
    }},'Abrir para editar'));
    box.appendChild(acoes);

    box.appendChild(el('p',{class:'dica', style:'margin-top:12px;max-width:68ch'},
      '"Abrir para editar" abre a página com o modo de edição ligado: clique em qualquer texto e escreva. '
      + 'Lá dentro dá pra acrescentar seções e itens, baixar a versão editada e copiar as alterações pra colar aqui embaixo. '
      + 'O que o cliente recebe é o arquivo baixado, sem barra de edição — ela só aparece com #editar no fim do endereço.'));

    box.appendChild(caixaColar(c));
    if((d.correcoes||[]).length) box.appendChild(listaCorrecoes());
    return box;
  }

  // Insert ou update explícito. Upsert resolveria, mas depende de o servidor
  // preservar coluna ausente do payload — e perder gerada_em em silêncio
  // apagaria justamente o que marca que o cliente já leu a página.
  async function salvarPagina(c, campos){
    const existente = state.detalhe.pagina;
    const { error } = existente
      ? await sb.from('paginas').update(campos).eq('cliente_id', c.id)
      : await sb.from('paginas').insert(Object.assign({ cliente_id:c.id }, campos));
    if(error){ toast('Não deu pra salvar a página: ' + error.message); return false; }
    return true;
  }

  async function marcarGerada(c){
    if(await salvarPagina(c, { gerada_em:new Date().toISOString() })) await carregarDetalhe(c.id);
  }

  // Cola das alterações feitas na página. Nunca aplica direto: mostra o que vai
  // mudar e espera confirmação, porque isto é texto colado de fora.
  function caixaColar(c){
    const box = el('div',{class:'card flat', style:'margin-top:26px'});
    box.appendChild(el('p',{class:'rot laranja', style:'margin:0 0 4px'},'Trazer alterações da página'));
    box.appendChild(el('p',{class:'muted', style:'margin:0 0 12px;font-size:0.87rem'},
      'Cole aqui o que o botão "Copiar alterações" da página gerou. Nada é salvo antes de você conferir a lista.'));

    const ta = el('textarea',{style:'width:100%;min-height:80px;padding:9px;border:1.5px solid #0A0A0A;font-family:monospace;font-size:0.78rem'});
    box.appendChild(ta);
    const saida = el('div');
    const btn = el('button',{class:'btn small', style:'margin-top:10px'},'Conferir alterações');
    btn.addEventListener('click', ()=>{
      saida.innerHTML = '';
      let pacote;
      try{ pacote = JSON.parse(ta.value.trim()); }
      catch(err){ toast('Isso não parece o texto copiado da página.'); return; }
      if(!pacote || pacote.v !== 1){ toast('Formato não reconhecido.'); return; }
      if(pacote.cliente !== c.id){ toast('Esse texto é da página de outro cliente.'); return; }
      saida.appendChild(revisao(c, pacote));
    });
    box.appendChild(btn);
    box.appendChild(saida);
    return box;
  }

  function revisao(c, pacote){
    const box = el('div',{style:'margin-top:18px'});
    const mudancas = Array.isArray(pacote.mudancas) ? pacote.mudancas : [];
    const blocos = pacote.blocos || {};
    const nBlocos = Object.keys(blocos).length;

    if(!mudancas.length && !nBlocos){
      box.appendChild(el('div',{class:'vazio'},'Nada mudou em relação ao que já está aqui.'));
      return box;
    }

    if(nBlocos){
      box.appendChild(el('p',{class:'rot laranja', style:'margin:0 0 8px'}, nBlocos + (nBlocos===1?' texto da página':' textos da página')));
      box.appendChild(el('p',{class:'muted', style:'margin:0 0 16px;font-size:0.86rem'},
        'Títulos, aberturas, seções e itens escritos por você. Ficam guardados e voltam toda vez que a página for gerada de novo.'));
    }

    const delicadas = mudancas.filter(m => m.t === 'metas' || m.t === 'baselines');
    const campoMotivo = {};
    if(mudancas.length){
      box.appendChild(el('p',{class:'rot laranja', style:'margin:18px 0 8px'}, mudancas.length + (mudancas.length===1?' mudança nos dados':' mudanças nos dados')));
      mudancas.forEach((m, i)=>{
        const linha = el('div',{class:'card flat', style:'margin-bottom:10px;padding:12px 14px'});
        const delicada = m.t === 'metas' || m.t === 'baselines';
        const cab = el('div',{style:'display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px'});
        cab.innerHTML = '<span class="chip ' + (delicada ? 'espera' : 'neutro') + '">'
          + esc({metas:'Meta', baselines:'Ponto de partida', marcos:'Passo', acessos:'Acesso', clientes:'Primeiro valor'}[m.t] || m.t)
          + '</span><span class="mono muted" style="font-size:0.66rem">' + esc(m.c) + '</span>';
        linha.appendChild(cab);
        linha.appendChild(el('p',{style:'margin:0;font-size:0.86rem;color:#6E6E6E;text-decoration:line-through'}, esc(m.de || '(vazio)')));
        linha.appendChild(el('p',{style:'margin:4px 0 0;font-size:0.93rem'}, esc(m.para || '(vazio)')));
        if(delicada && state.detalhe.pagina && state.detalhe.pagina.gerada_em){
          const f = el('div',{class:'field', style:'margin:12px 0 0'});
          f.appendChild(el('label',{},'Por que está mudando'));
          const inp = el('input',{type:'text', placeholder:'Aparece na página, ao lado do que foi corrigido'});
          f.appendChild(inp);
          f.appendChild(el('span',{class:'dica'},'O cliente já leu a versão anterior. Sem motivo, a correção não é registrada.'));
          linha.appendChild(f);
          campoMotivo[i] = inp;
        }
        box.appendChild(linha);
      });
    }

    if(delicadas.length && state.detalhe.pagina && state.detalhe.pagina.gerada_em){
      box.appendChild(el('div',{class:'erro', style:'margin:14px 0'},
        'Meta e ponto de partida são o pré-registro: foram escritos antes de começar, e o cliente já leu. '
        + 'Mudar não é proibido, mas fica registrado com data e motivo na própria página.'));
    }

    const aplicar = el('button',{class:'btn', style:'margin-top:8px'},'Aplicar tudo');
    aplicar.addEventListener('click', async ()=>{
      aplicar.disabled = true;
      const exigeMotivo = Object.keys(campoMotivo).some(i => !campoMotivo[i].value.trim());
      if(exigeMotivo){ toast('Escreva o motivo de cada correção antes de aplicar.'); aplicar.disabled = false; return; }

      if(nBlocos){
        const juntos = Object.assign({}, (state.detalhe.pagina && state.detalhe.pagina.blocos) || {}, blocos);
        if(!await salvarPagina(c, { blocos:juntos })){ aplicar.disabled = false; return; }
      }

      for(let i = 0; i < mudancas.length; i++){
        const m = mudancas[i];
        if(!['metas','baselines','marcos','acessos','clientes'].includes(m.t)) continue;
        const campos = {}; campos[m.c] = m.para === '' ? null : m.para;
        const { error } = await sb.from(m.t).update(campos).eq('id', m.id);
        if(error){ toast('Não deu em ' + m.t + ': ' + error.message); aplicar.disabled = false; return; }
        if(campoMotivo[i]){
          await sb.from('correcoes').insert({
            cliente_id:c.id, tabela:m.t, registro_id:m.id, campo:m.c,
            valor_antigo:m.de || null, valor_novo:m.para || null,
            motivo:campoMotivo[i].value.trim(),
            corrigido_por:(state.user && state.user.email) || null,
          });
        }
      }

      toast('Alterações aplicadas.');
      await carregarTudo();
      await carregarDetalhe(c.id);
      render();
    });
    box.appendChild(aplicar);
    return box;
  }

  function listaCorrecoes(){
    const box = el('div',{style:'margin-top:26px'});
    box.appendChild(el('p',{class:'rot laranja', style:'margin:0 0 10px'},'Correções depois de o cliente ler'));
    const w = el('div',{class:'wrap'});
    const t = el('table');
    t.innerHTML = '<thead><tr><th>Quando</th><th>O que</th><th>Antes</th><th>Depois</th><th>Motivo</th><th>Quem</th></tr></thead>';
    const tb = el('tbody');
    state.detalhe.correcoes.slice().reverse().forEach(x=>{
      const tr = el('tr');
      [ soData(x.corrigido_em), x.campo, x.valor_antigo || '—', x.valor_novo || '—', x.motivo || '—', x.corrigido_por || '—' ]
        .forEach(v => tr.appendChild(el('td',{}, esc(v))));
      tb.appendChild(tr);
    });
    t.appendChild(tb); w.appendChild(t); box.appendChild(w);
    return box;
  }

  function secao(opts){
    // opts: { ajuda, linhas, colunas, campos, tabela, cliente, vazio:{titulo,texto} }
    const box = el('div');
    if(opts.ajuda) box.appendChild(el('p',{class:'muted', style:'margin:0 0 16px'}, opts.ajuda));

    if(!opts.linhas.length){
      const v = el('div',{class:'vazio'});
      if(opts.vazio && opts.vazio.titulo){
        v.appendChild(el('strong',{}, esc(opts.vazio.titulo)));
        v.appendChild(el('span',{}, esc(opts.vazio.texto || '')));
      } else {
        v.textContent = (opts.vazio && opts.vazio.texto) || opts.vazio || 'Nada registrado ainda.';
      }
      box.appendChild(v);
    } else {
      const w = el('div',{class:'wrap'});
      const t = el('table');
      const thead = el('thead'); const trh = el('tr');
      opts.colunas.forEach(col=> trh.appendChild(el('th',{}, esc(col.rotulo))));
      trh.appendChild(el('th',{},''));
      thead.appendChild(trh); t.appendChild(thead);
      const tb = el('tbody');
      opts.linhas.forEach(l=>{
        const tr = el('tr');
        opts.colunas.forEach(col=>{
          const td = el('td');
          if(col.chip){
            td.innerHTML = chip(col.chip, l[col.chave]);
          } else {
            const v = col.valor ? col.valor(l) : l[col.chave];
            const vazio = (v===null||v===undefined||v==='');
            td.innerHTML = vazio ? '<span class="muted">—</span>'
              : (col.forte ? '<span class="forte">'+esc(v)+'</span>' : esc(v));
          }
          tr.appendChild(td);
        });
        const acao = el('td',{style:'text-align:right;white-space:nowrap'});
        acao.appendChild(el('button',{class:'btn ghost small', onclick:async()=>{
          if(await apagar(opts.tabela, l.id)){ await carregarDetalhe(opts.cliente.id); render(); }
        }},'remover'));
        tr.appendChild(acao);
        tb.appendChild(tr);
      });
      t.appendChild(tb); w.appendChild(t); box.appendChild(w);
    }

    const det = el('details',{style:'margin-top:22px'});
    det.appendChild(el('summary',{class:'mono', style:'font-size:0.7rem;cursor:pointer;letter-spacing:0.08em;text-transform:uppercase;color:#6E6E6E'}, opts.rotuloAdd || '+ adicionar'));
    const form = el('form',{class:'card flat', style:'margin-top:12px'});
    const g = el('div',{class: opts.colunasForm===3 ? 'grid3' : 'grid2'});
    opts.campos.forEach(c=>{
      const opcoes = c.grupo ? opcoesDe(c.grupo) : c.opcoes;
      if(opcoes) g.appendChild(campoSelect(c.rotulo, c.nome, opcoes, c.padrao, c.dica));
      else if(c.tipo==='textarea'){
        const f = el('div',{class:'field', style:'grid-column:1/-1'});
        f.appendChild(el('label',{for:'f_'+c.nome}, esc(c.rotulo)));
        f.appendChild(el('textarea',{id:'f_'+c.nome, name:c.nome}));
        if(c.dica) f.appendChild(el('span',{class:'dica'}, esc(c.dica)));
        g.appendChild(f);
      }
      else g.appendChild(campo(c.rotulo, c.nome, c.tipo, c.padrao, c.dica));
    });
    form.appendChild(g);
    form.appendChild(el('button',{class:'btn small', type:'submit'},'Salvar'));
    form.addEventListener('submit', async e=>{
      e.preventDefault();
      const dados = lerForm(form);
      dados.cliente_id = opts.cliente.id;
      if(opts.validar){ const erro = opts.validar(dados); if(erro){ toast(erro); return; } }
      if(await inserir(opts.tabela, dados)){
        await carregarDetalhe(opts.cliente.id); render();
      }
    });
    det.appendChild(form);
    box.appendChild(det);
    return box;
  }

  function abaHoras(c){

    const fat = linhas.filter(l=>l.faturavel).reduce((s,l)=>s+(l.minutos||0),0);
    const box = el('div');
    if(linhas.length){
      box.appendChild(placar([
        { rotulo:'Horas no total', valor:(total/60).toFixed(1)+' h', destaca:true },
        { rotulo:'Faturáveis', valor:(fat/60).toFixed(1)+' h', parte:fat, de:Math.max(total,1) },
        { rotulo:'Lançamentos', valor:linhas.length },
      ]));
    }
    box.appendChild(secao({
      tabela:'horas', cliente:c, linhas,
      vazio:{ titulo:'Nenhuma hora lançada',
              texto:'Sem isso não dá pra saber se o preço cobre o custo, nem o que vale a pena automatizar.' },

      colunasForm:3,

        {rotulo:'Dia', valor:l=> soData(l.data)},

      ],

        {rotulo:'Dia', nome:'data', tipo:'date', padrao:new Date().toISOString().slice(0,10)},
        {rotulo:'Quantos minutos', nome:'minutos', tipo:'number', dica:'Uma hora e meia = 90'},
        {rotulo:'Quem fez', nome:'quem'},
        {rotulo:'Tipo', nome:'categoria', grupo:'horas_categoria', padrao:'conteudo'},
        {rotulo:'Cobra do cliente', nome:'faturavel', opcoes:[['true','Sim'],['false','Não']], padrao:'true',
         dica:'Reunião de venda e retrabalho nosso não se cobra — mas se lança, senão a conta do custo mente.'},
        {rotulo:'O que foi feito', nome:'atividade'},
      ],
      validar:d=>{
        if(!d.atividade) return 'Descreva a atividade.';
        if(!d.minutos || d.minutos<=0) return 'Minutos precisa ser maior que zero.';
        d.faturavel = String(d.faturavel) === 'true';
        return null;
      },
    }));
    return box;
  }

  // ---------- sessão ----------

  // O link de acesso volta com os tokens no fragmento da URL. O supabase-js consome
  // sozinho; aqui a gente só pesca o erro (link expirado, já usado) e limpa a barra.
  function lerRetornoDoLink(){
    const h = window.location.hash || '';
    if(h.includes('error')){
      const p = new URLSearchParams(h.replace(/^#/, ''));
      const d = (p.get('error_description') || '').toLowerCase();
      state.erro = (d.includes('expired') || d.includes('invalid'))
        ? 'Esse link expirou ou já foi usado. Peça um novo.'
        : 'O link não funcionou: ' + (p.get('error_description') || p.get('error'));
    }
    if(h.includes('access_token') || h.includes('error')){
      history.replaceState(null, '', window.location.pathname + window.location.search);
    }
  }

  async function iniciarSessao(){
    state.carregando = true; render();
    lerRetornoDoLink();
    const { data:{ session } } = await sb.auth.getSession();
    state.user = session ? session.user : null;
    if(state.user){
      const { data, error } = await sb.rpc('is_bora_member');
      state.membro = !error && data === true;
      if(state.membro){
        await carregarTudo();
        // Respeita o endereço com que a pessoa chegou: link mandado pela Bia,
        // aba recarregada, favorito. Cliente que não existe mais cai no Agora.
        const r = rotaAtual();
        if(r.tipo === 'cliente' && state.clientes.some(c => c.id === r.id)){
          state.vista = { tipo:'cliente', id:r.id };
          state.aba = (r.aba && ABAS.some(a => a[0] === r.aba)) ? r.aba : 'respostas';
          carregarDetalhe(r.id).then(render);
        } else if(r.tipo === 'inbox' || r.tipo === 'novo'){
          state.vista = { tipo:r.tipo };
        } else {
          state.vista = { tipo:'agora' };
        }
      }
    }
    state.carregando = false;
    render();
  }

  async function sair(){
    await sb.auth.signOut();
    state.user = null; state.membro = false; state.clientes = []; state.inbox = [];
    state.tudo = { acessos:[], metas:[], baselines:[], marcos:[], conformidade:[], horas:[] };
    state.vista = { tipo:'agora' };
    state.linkEnviadoPara = null; state.modoLogin = 'link'; state.erro = null;
    render();
  }

  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape' && state.gaveta){ state.gaveta = false; render(); }
  });

  iniciarSessao();
})();
