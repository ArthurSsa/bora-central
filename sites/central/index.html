  // Busca uma coisa só: qualquer coisa. Cliente, oportunidade, tarefa, item de
  // lista. Com pouco dado uma busca por seção seria quatro caixas; com uma só,
  // quem procura não precisa saber onde a coisa mora.
  function buscaGlobal(){
    const cx = el('div',{class:'buscatopo'});
    const inp = el('input',{type:'search', placeholder:'Buscar…', value:state.busca, 'aria-label':'Buscar em tudo'});
    inp.addEventListener('input', ()=>{ state.busca = inp.value; desenharAchados(cx, inp); });
    inp.addEventListener('focus', ()=> desenharAchados(cx, inp));
    inp.addEventListener('keydown', e=>{
      if(e.key === 'Escape'){ inp.value = ''; state.busca = ''; desenharAchados(cx, inp); inp.blur(); }
    });
    cx.appendChild(inp);
    if(state.busca) setTimeout(()=>desenharAchados(cx, inp), 0);
    return cx;
  }

  function desenharAchados(cx, inp){
    const velho = cx.querySelector('.achados');
    if(velho) velho.remove();
    const q = (state.busca || '').trim().toLowerCase();
    if(q.length < 2) return;

    const bate = s => String(s == null ? '' : s).toLowerCase().includes(q);
    const grupos = [
      ['Clientes', state.clientes.filter(c => bate(c.nome) || bate(c.vertical) || bate(c.contato_nome)),
        c => ({ t:c.nome, s:rotulo('estagio', c.estagio), ir:()=>abrirCliente(c.id) })],
      ['Captação', state.oportunidades.filter(o => bate(o.nome) || bate(o.bairro) || bate(o.origem)),
        o => ({ t:o.nome, s:rotulo('etapa_funil', o.etapa) + (o.bairro ? ' · ' + o.bairro : ''),
                ir:()=>{ state.buscaLista = o.nome; ir({tipo:'lista'}); } })],
      ['Agenda', state.tarefas.filter(t => bate(t.titulo)),
        t => ({ t:t.titulo, s:soData(t.data) + ' · ' + pessoa(t.responsavel), ir:()=>ir({tipo:'agenda'}) })],
      ['Arquivo', state.listaItens.filter(i => bate(i.titulo) || (i.tags||[]).some(bate)),
        i => ({ t:i.titulo, s:(state.listas.find(l => l.id === i.lista_id) || {}).nome || '',
                ir:()=>{ state.listaAberta = i.lista_id; ir({tipo:'listas'}); } })],
    ];

    const box = el('div',{class:'achados'});
    let total = 0;
    grupos.forEach(([rot, linhas, montar])=>{
      if(!linhas.length) return;
      box.appendChild(el('h6',{}, rot));
      linhas.slice(0,5).forEach(x=>{
        const d = montar(x); total++;
        const b = el('button',{onclick:()=>{
          state.busca = ''; inp.value = '';
          d.ir();
        }});
        b.innerHTML = esc(d.t) + (d.s ? '<span>' + esc(d.s) + '</span>' : '');
        box.appendChild(b);
      });
    });
    if(!total) box.appendChild(el('p',{class:'muted', style:'padding:12px;margin:0;font-size:0.85rem'},
      'Nada com "' + esc(state.busca) + '".'));
    cx.appendChild(box);
  }

  // ---------- lateral contextual ----------
  // Dentro de um cliente ela lista as seções dele. Fora, lista o que faz
  // sentido pra área aberta. Antes ela tentava ser tudo ao mesmo tempo.
  function lateral(){
    const s = el('div',{class:'side'+(state.gaveta?' aberta':'')});
    const t = state.vista.tipo;

    if(t === 'cliente'){
      const c = clienteAtual();
      s.appendChild(el('h4',{},'Cliente'));
      const volta = el('button',{class:'navitem', onclick:()=>ir({tipo:'clientes'})});
      volta.innerHTML = '<b>&larr; Todos os clientes</b><span class="sub">'+state.clientes.length+' no total</span>';
      s.appendChild(volta);
      if(c){
        s.appendChild(el('h4',{},'Seções'));
        ABAS.forEach(([k,rot])=>{
          const est = estadoDaAba(k, c);
          const b = el('button',{class:'navitem'+(state.aba===k?' active':''), onclick:()=>irAba(k)});
          b.innerHTML = '<b><span class="ponto '+est+'" style="display:inline-block;margin-right:7px"></span>'+esc(rot)+'</b>';
          s.appendChild(b);
        });
      }
      return s;
    }

    if(t === 'funil' || t === 'lista'){
      s.appendChild(el('h4',{},'Captação'));
      const emJogo = state.oportunidades.filter(o => o.etapa !== 'perdido' && o.etapa !== 'fechado');
      const bf = el('button',{class:'navitem'+(t==='funil'?' active':''), onclick:()=>ir({tipo:'funil'})});
      bf.innerHTML = '<b>Funil</b><span class="sub">'+(emJogo.length ? emJogo.length+' em jogo' : 'ninguém no funil')+'</span>';
      s.appendChild(bf);
      const bl = el('button',{class:'navitem'+(t==='lista'?' active':''), onclick:()=>ir({tipo:'lista'})});
      bl.innerHTML = '<b>Planilha</b><span class="sub">'+state.oportunidades.length+' no total</span>';
      s.appendChild(bl);
      return s;
    }

    if(t === 'clientes' || t === 'inbox' || t === 'novo'){
      s.appendChild(el('h4',{},'Clientes'));
      const bt = el('button',{class:'navitem'+(t==='clientes'?' active':''), onclick:()=>ir({tipo:'clientes'})});
      bt.innerHTML = '<b>Todos</b><span class="sub">'+state.clientes.length+'</span>';
      s.appendChild(bt);
      const h = el('h4',{},'Caixa de entrada');
      if(state.inbox.length) h.appendChild(el('span',{class:'pill'}, String(state.inbox.length)));
      s.appendChild(h);
      const bi = el('button',{class:'navitem'+(t==='inbox'?' active':''), onclick:()=>ir({tipo:'inbox'})});
      bi.innerHTML = '<b>Respostas sem cliente</b><span class="sub">'
        + (state.inbox.length ? state.inbox.length+' aguardando' : 'nada pendente')+'</span>';
      s.appendChild(bi);
      const w = el('div',{class:'act'});
      w.appendChild(el('button',{class:'btn ghost small', onclick:()=>ir({tipo:'novo'})},'+ Novo cliente'));
      s.appendChild(w);
      return s;
    }

    // Agora e Agenda: atalho para os clientes ativos, que é o que se abre a seguir.
    s.appendChild(el('h4',{},'Ir direto pra'));
    const ativos = state.clientes.filter(c => c.estagio === 'onboarding' || c.estagio === 'ativo');
    if(!ativos.length) s.appendChild(el('div',{class:'navitem muted'},'Nenhum cliente ativo'));
    ativos.forEach(c=>{
      const b = el('button',{class:'navitem', onclick:()=>abrirCliente(c.id)});
      b.innerHTML = '<b>'+esc(c.nome)+'</b><span class="sub">'+esc(rotulo('estagio',c.estagio))+'</span>';
      s.appendChild(b);
    });
    const w = el('div',{class:'act'});
    w.appendChild(el('button',{class:'btn ghost small', onclick:()=>ir({tipo:'clientes'})},'Ver todos'));
    s.appendChild(w);
    return s;
  }

  function cartaoCliente(c){
    const b = el('button',{class:'cli-cartao', onclick:()=>abrirCliente(c.id)});

    const topo = el('div',{class:'topo'});
    const ini = (c.nome || '?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
    topo.appendChild(el('span',{class:'marca-cli'}, esc(ini)));
    const t = el('div',{style:'min-width:0'});
    t.appendChild(el('div',{class:'nome'}, esc(c.nome)));
    t.appendChild(el('div',{class:'sub'}, esc(c.vertical || 'sem ramo definido')));
    topo.appendChild(t);
    b.appendChild(topo);

    // A barra só faz sentido pra quem está em onboarding ou ativo; nos outros
    // estágios ela seria um número inventado.
    if(c.estagio === 'onboarding' || c.estagio === 'ativo'){
      const e = etapasDoResumo(c);
      const barra = el('div',{class:'barra'});
      barra.appendChild(el('i',{style:'width:'+Math.round((e.prontas/e.total)*100)+'%'}));
      b.appendChild(barra);
    }

    const pes = el('div',{class:'pes'});
    if(c.valor_mensal != null) pes.appendChild(el('b',{}, esc(dinheiro(c.valor_mensal))));
    if(c.inicio_contrato){
      // Passados os 90 dias, "dia 140 de 90" não quer dizer nada: o primeiro
      // ciclo acabou e o que importa vira há quanto tempo ele está na casa.
      const d = Math.max(0, -diasAte(c.inicio_contrato));
      pes.appendChild(el('span',{}, d <= 90 ? 'dia ' + d + ' de 90'
        : 'há ' + Math.floor(d/30) + ' meses'));
    }
    if(c.responsavel) pes.appendChild(el('span',{}, esc(c.responsavel)));
    if(pes.childNodes.length) b.appendChild(pes);

    const al = el('div',{class:'alertas'});
    const meus = pendencias().filter(p => p.cliente && p.cliente.id === c.id);
    const altas = meus.filter(p => p.urgencia === 'alta').length;
    if(altas) al.appendChild(el('span',{class:'chip alerta'}, altas + (altas===1?' urgente':' urgentes')));
    else if(meus.length) al.appendChild(el('span',{class:'chip espera'}, meus.length + ' em aberto'));
    else if(c.estagio === 'onboarding' || c.estagio === 'ativo') al.appendChild(el('span',{class:'chip ok'},'em dia'));
    const tarefas = state.tarefas.filter(x => x.cliente_id === c.id && (x.estado==='pendente'||x.estado==='fazendo')).length;
    if(tarefas) al.appendChild(el('span',{class:'chip neutro'}, tarefas + (tarefas===1?' tarefa':' tarefas')));
    if(al.childNodes.length) b.appendChild(al);
    return b;
  }

  // Versão leve do termômetro para o cartão: só a contagem, sem montar a tela
  // toda (o cartão não tem os detalhes carregados, só o que veio de clientes).
  function etapasDoResumo(c){
    const t = state.tudo;
    const uteis = t.acessos.filter(a => a.cliente_id === c.id && a.status !== 'nao_aplicavel');
    const ok = uteis.filter(a => a.status === 'recebido').length;
    const metas = t.metas.filter(m => m.cliente_id === c.id);
    const comFracasso = metas.filter(m => (m.fracasso||'').trim()).length;
    const conf = t.conformidade.filter(i => i.cliente_id === c.id);
    const marcas = [
      state.inbox.length >= 0 && t.baselines.some(b => b.cliente_id === c.id),
      uteis.length > 0 && ok >= uteis.length,
      metas.length > 0 && comFracasso >= metas.length,
      !!(c.primeiro_valor_prometido || '').trim() && !!c.primeiro_valor_data,
      conf.length > 0 && !conf.some(i => i.status === 'pendente'),
      t.marcos.some(m => m.cliente_id === c.id),
    ];
    return { prontas: marcas.filter(Boolean).length, total: marcas.length };
  }

  function conteudo(){
    if(state.vista.tipo==='agora') return telaAgora();
    if(state.vista.tipo==='perfil') return telaPerfil();
    if(state.vista.tipo==='clientes') return telaClientes();
    if(state.vista.tipo==='agenda') return telaAgenda();
    if(state.vista.tipo==='economia') return telaEconomia();
    if(state.vista.tipo==='estudio') return telaEstudio();
    if(state.vista.tipo==='listas') return telaListas();
    if(state.vista.tipo==='funil') return telaFunil();
    if(state.vista.tipo==='lista') return telaLista();
    if(state.vista.tipo==='inbox') return telaInbox();
    if(state.vista.tipo==='novo') return telaNovoCliente();
    return telaCliente();
  }

  // ---------- agora ----------

  // Regra: uma pendência só existe se der pra apontar o que fazer e onde.
  // "Melhorar o Instagram" não é pendência. "Acesso ao Meta Business bloqueado
  // há 12 dias" é. Nada aqui é opinião: tudo sai de um campo vazio, um status
  // ou uma data no banco.
  const HOJE = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
  const diasAte = iso => {
    if(!iso) return null;
    const d = new Date(String(iso).slice(0,10) + 'T00:00:00');
    return isNaN(d) ? null : Math.round((d - HOJE()) / 86400000);
  };
  const emDias = n => n === 0 ? 'hoje' : (n > 0 ? 'em ' + n + (n===1?' dia':' dias') : 'há ' + Math.abs(n) + (n===-1?' dia':' dias'));

  function pendencias(){
    const p = [];
    const t = state.tudo || { acessos:[], metas:[], baselines:[], marcos:[], conformidade:[], horas:[] };
    const add = (urgencia, cliente, aba, oq, porq, destino) => p.push({ urgencia, cliente, aba, oq, porq, destino });

    // 1. Respostas que chegaram e não viraram cliente. Começa a envelhecer no minuto um.
    state.inbox.forEach(sub=>{
      const d = diasAte(sub.recebido_em);
      const velho = d !== null && d <= -3;
      add(velho ? 'alta' : 'media', null, null,
        'Vincular a resposta de ' + (sub.nome_informado || 'alguém sem nome'),
        'Chegou pelo formulário ' + (d === null ? '' : emDias(d)) + ' e ainda não está ligada a nenhum cliente.');
    });

    // 0. Captação. Vem antes dos clientes porque, com dois na casa, o trabalho
    // do dia é conseguir o terceiro — e lead esquecido não avisa que esfriou.
    const emJogo = state.oportunidades.filter(o => o.etapa !== 'perdido' && o.etapa !== 'fechado');
    emJogo.forEach(o=>{
      const d = o.proxima_acao_em ? diasAte(o.proxima_acao_em) : null;
      if((o.proxima_acao || '').trim() && d !== null && d < 0){
        add('alta', null, null, 'Combinado com ' + o.nome + ' venceu ' + emDias(d),
          '"' + o.proxima_acao + '". Prazo que você mesmo marcou.', 'funil');
      } else if((o.proxima_acao || '').trim() && d !== null && d <= 2){
        add('media', null, null, o.nome + ': ' + o.proxima_acao,
          'Marcado pra ' + emDias(d) + '.', 'funil');
      } else if(!(o.proxima_acao || '').trim()){
        const parado = o.movido_em ? Math.abs(diasAte(o.movido_em)) : 0;
        add(parado >= 14 ? 'alta' : 'media', null, null,
          o.nome + ' está sem próxima ação',
          'Em "' + rotulo('etapa_funil', o.etapa) + '"' + (parado ? ' há ' + parado + ' dias' : '')
          + '. Oportunidade sem próxima ação com data morre sozinha.', 'funil');
      }
    });
    state.oportunidades.filter(o => o.etapa === 'fechado' && !o.cliente_id).forEach(o=>{
      add('alta', null, null, o.nome + ' fechou e ainda não virou cliente',
        'Sem a ficha, nada do onboarding começa: nem acesso, nem baseline, nem promessa.', 'funil');
    });

    // Agenda. Tarefa que passou da data não avisa sozinha, e é a coisa mais
    // barata de resolver: ou se faz, ou se remarca.
    const hj = hojeIso();
    const atrasadas = state.tarefas.filter(t => t.data < hj && (t.estado === 'pendente' || t.estado === 'fazendo'));
    if(atrasadas.length){
      const porQuem = {};
      atrasadas.forEach(t => { porQuem[t.responsavel] = (porQuem[t.responsavel] || 0) + 1; });
      add('alta', null, null,
        atrasadas.length + (atrasadas.length === 1 ? ' tarefa passou da data' : ' tarefas passaram da data'),
        Object.keys(porQuem).map(q => porQuem[q] + ' de ' + pessoa(q)).join(', ')
        + '. Ou se faz hoje, ou se remarca — deixar parada é a única opção ruim.', 'agenda');
    }
    const deHoje = state.tarefas.filter(t => t.data === hj && (t.estado === 'pendente' || t.estado === 'fazendo'));
    if(deHoje.length) add('media', null, null,
      deHoje.length + (deHoje.length === 1 ? ' tarefa marcada pra hoje' : ' tarefas marcadas pra hoje'),
      deHoje.slice(0,4).map(t => t.titulo).join(' · ') + (deHoje.length > 4 ? ' e mais ' + (deHoje.length-4) : ''), 'agenda');

    // Gravação sem roteiro. Não é opinião sobre o roteiro: é o campo vazio.
    // Chegar no estúdio sem ele custa uma segunda ida, que é o erro mais caro
    // que uma agência de dois faz na semana.
    const gravar = state.tarefas.filter(t=>{
      if((t.tipo || '') !== 'gravacao') return false;
      if(t.estado === 'concluido' || t.estado === 'cancelado') return false;
      const d = diasAte(t.data);
      if(d === null || d < 0 || d > 3) return false;
      return !((t.campos || {}).roteiro || '').trim();
    });
    if(gravar.length) add('media', null, null,
      gravar.length + (gravar.length === 1 ? ' gravação sem roteiro' : ' gravações sem roteiro'),
      gravar.map(t => t.titulo + ' (' + emDias(diasAte(t.data)) + ')').join(' · ')
      + '. Ir gravar sem roteiro é gravar de novo depois.', 'agenda');

    // Listas: o que tem data de fim chegando. Contrato que vence sem ninguém
    // olhar vira renovação automática ruim ou cliente perdido em silêncio.
    state.listaItens.filter(i => i.data_fim && i.estado !== 'arquivado' && i.estado !== 'concluido').forEach(i=>{
      const d = diasAte(i.data_fim);
      if(d === null || d > 30) return;
      const L = state.listas.find(l => l.id === i.lista_id);
      add(d < 0 ? 'alta' : 'media', null, null,
        i.titulo + (d < 0 ? ' venceu ' + emDias(d) : ' termina ' + emDias(d)),
        (L ? L.nome + '. ' : '') + 'Decidir agora se renova, encerra ou renegocia.', 'listas');
    });

    const ativos = state.clientes.filter(c => c.estagio === 'onboarding' || c.estagio === 'ativo');

    ativos.forEach(c=>{
      const meus = tab => t[tab].filter(l => l.cliente_id === c.id);

      // 2. Acessos. O gargalo mais documentado do onboarding (Lacuna #5).
      const ac = meus('acessos');
      const bloq = ac.filter(l => l.status === 'bloqueado');
      if(bloq.length) add('alta', c, 'acessos',
        bloq.length + ' acesso' + (bloq.length===1?'':'s') + ' bloqueado' + (bloq.length===1?'':'s'),
        bloq.map(l => l.recurso).join(', ') + '. Bloqueado não destrava sozinho: precisa de uma ligação, não de mais um lembrete.');
      const parados = ac.filter(l => l.status === 'solicitado' && diasAte(l.solicitado_em) !== null && diasAte(l.solicitado_em) <= -5);
      if(parados.length) add('alta', c, 'acessos',
        parados.length + ' acesso' + (parados.length===1?'':'s') + ' pedido' + (parados.length===1?'':'s') + ' e sem resposta',
        parados.map(l => l.recurso + ' (' + emDias(diasAte(l.solicitado_em)) + ')').join(', ') + '.');
      const naoPedidos = ac.filter(l => l.status === 'pendente');
      if(naoPedidos.length) add('media', c, 'acessos',
        naoPedidos.length + ' acesso' + (naoPedidos.length===1?'':'s') + ' que ninguém pediu ainda',
        naoPedidos.map(l => l.recurso).join(', ') + '.');
      if(!ac.length) add('media', c, 'acessos',
        'Nenhum acesso registrado',
        'Sem a lista de acessos, a primeira semana descobre o que falta no pior momento possível.');

      // 3. Baseline. Congelar antes de mexer, ou não há como provar nada depois (Lacuna #3).
      if(!meus('baselines').length) add('alta', c, 'baseline',
        'Baseline não congelado',
        'Qualquer coisa publicada antes disso vira resultado que não dá pra provar. Congelar é a primeira tarefa, não a última.');

      // 4. Metas pre-registradas.
      const metas = meus('metas');
      if(!metas.length) add('media', c, 'metas',
        'Nenhuma meta pré-registrada',
        'Sem sucesso e fracasso escritos antes, os números do dia 90 se explicam sozinhos — e sempre a favor da agência.');
      else {
        const semFracasso = metas.filter(m => !(m.fracasso || '').trim());
        if(semFracasso.length) add('media', c, 'metas',
          semFracasso.length + ' meta' + (semFracasso.length===1?'':'s') + ' sem critério de fracasso',
          semFracasso.map(m => m.metrica).join(', ') + '. Meta sem fracasso declarado não é meta, é torcida.');
      }

      // 5. Primeiro valor: a promessa pequena com data (Lacuna #5).
      const pv = (c.primeiro_valor_prometido || '').trim();
      if(!pv) add('alta', c, 'respostas',
        'Primeiro valor não definido',
        'Precisa estar dito no kickoff, com data entre 14 e 30 dias. Depois disso já é tarde.');
      else if(!c.primeiro_valor_data) add('alta', c, 'respostas',
        'Primeiro valor sem data',
        '"' + pv + '" — promessa sem data não cobra ninguém.');
      else {
        const d = diasAte(c.primeiro_valor_data);
        if(d < 0) add('alta', c, 'respostas', 'Primeiro valor atrasado ' + emDias(d),
          '"' + pv + '". Atrasar isso custa mais que atrasar um post: é a promessa que sustenta a relação até o número se mexer.');
        else if(d <= 7) add('media', c, 'respostas', 'Primeiro valor vence ' + emDias(d),
          '"' + pv + '"');
      }

      // 6. Conformidade. Não conforme é publicação que pode ter que sair do ar.
      const co = meus('conformidade');
      const ruins = co.filter(l => l.status === 'nao_conforme');
      if(ruins.length) add('alta', c, 'conformidade',
        ruins.length + ' item' + (ruins.length===1?'':'s') + ' fora da norma',
        ruins.map(l => (l.norma ? l.norma + ': ' : '') + l.item).join(' | '));
      const aVer = co.filter(l => l.status === 'pendente');
      if(aVer.length) add('media', c, 'conformidade',
        aVer.length + ' item' + (aVer.length===1?'':'s') + ' de conformidade sem veredito',
        aVer.map(l => l.item).join(' | '));

      // 7. Marcos com data.
      meus('marcos').filter(m => !m.data_cumprida && m.data_prevista).forEach(m=>{
        const d = diasAte(m.data_prevista);
        const dele = m.responsavel === 'cliente';
        if(d < 0) add('alta', c, 'marcos', 'Marco atrasado ' + emDias(d) + ': ' + m.titulo,
          dele ? 'É do cliente. Atraso do cliente não se cobra por mensagem no dia seguinte ao prazo, se combina de novo com data nova.' : 'É nosso.');
        else if(d <= 7) add('media', c, 'marcos', 'Marco vence ' + emDias(d) + ': ' + m.titulo,
          dele ? 'Depende do cliente — avisar hoje, não no dia.' : 'É nosso.');
      });

      // 8. Horas. Bloco G: só dá pra decidir o que automatizar sabendo onde o tempo vai.
      if(c.estagio === 'ativo'){
        const ult = meus('horas').map(h => diasAte(h.data)).filter(x => x !== null).sort((a,b)=>b-a)[0];
        if(ult === undefined) add('baixa', c, 'horas', 'Nenhuma hora lançada',
          'Sem horas, não dá pra saber se o cliente dá lucro nem o que vale automatizar. '
          + 'O caminho curto: marque hora de começo e fim nas tarefas dele — ao concluir, o tempo se aponta sozinho.');
        else if(ult <= -14) add('baixa', c, 'horas', 'Sem horas lançadas ' + emDias(ult),
          'O último lançamento foi ' + emDias(ult) + '. Registro que atrasa duas semanas vira chute.');
      }
    });

    const peso = { alta:0, media:1, baixa:2 };
    return p.sort((a,b)=> peso[a.urgencia] - peso[b.urgencia]
      || String(a.cliente ? a.cliente.nome : '').localeCompare(String(b.cliente ? b.cliente.nome : '')));
  }

  function telaAgora(){
    const m = el('main');
    m.appendChild(el('p',{class:'rot laranja'},'O que está esperando por nós'));
    m.appendChild(el('h1',{class:'page'},'Agora'));
    m.appendChild(el('p',{class:'muted'},'Tudo o que o banco sabe que está em aberto, em uma lista só. Cada linha leva direto pro lugar de resolver.'));

    const pend = pendencias();
    if(!pend.length){
      m.appendChild(el('div',{class:'vazio', style:'margin-top:22px'},'Nada em aberto. Ou está tudo em dia, ou falta registrar — as duas coisas parecem iguais daqui.'));
      return m;
    }

    const conta = u => pend.filter(p => p.urgencia === u).length;
    const resumo = el('div',{class:'placar'});
    [['alta','urgente'],['media','esta semana'],['baixa','quando der']].forEach(([u,rot])=>{
      const n = conta(u);
      if(!n) return;
      const b = el('div',{class:'n '+u});
      b.appendChild(el('b',{}, String(n)));
      b.appendChild(el('span',{}, rot));
      resumo.appendChild(b);
    });
    m.appendChild(resumo);

    let atual = null;
    pend.forEach(p=>{
      if(p.urgencia !== atual){
        atual = p.urgencia;
        const rot = { alta:'Urgente', media:'Esta semana', baixa:'Quando der' }[atual];
        m.appendChild(el('div',{class:'secname'}, rot));
      }
      const b = el('button',{class:'pend '+p.urgencia, onclick:()=>{
        if(p.cliente){ state.voltarPara = 'agora'; abrirCliente(p.cliente.id, p.aba); }
        else if(p.destino) ir({tipo:p.destino});
        else ir({tipo:'inbox'});
      }});
      const de = { funil:'Captação', agenda:'Agenda', listas:'Arquivo' };
      b.appendChild(el('div',{class:'quem'},
        p.cliente ? esc(p.cliente.nome) : (de[p.destino] || 'Caixa de entrada')));
      b.appendChild(el('div',{class:'oq'}, esc(p.oq)));
      if(p.porq) b.appendChild(el('div',{class:'porq'}, esc(p.porq)));
      m.appendChild(b);
    });

    return m;
  }

  // ---------- agenda ----------

  // A equipe. Fica aqui porque são dois; no dia em que forem cinco, isto vira
  // tabela. Cor não distingue pessoa de propósito: cor é reservada pro estado,
  // que é o que precisa saltar aos olhos. Pessoa é a inicial.
  const EQUIPE = [
    ['arthur', 'Arthur', 'A', 'a'],
    ['bia',    'Bia',    'B', 'b'],
    ['os_dois','Os dois','AB',''],
  ];
  const pessoa = v => (EQUIPE.find(e => e[0] === v) || [v, v || '—', '?', ''])[1];
  const inicial = v => (EQUIPE.find(e => e[0] === v) || [v, v, '?', ''])[2];
  const classePessoa = v => (EQUIPE.find(e => e[0] === v) || ['','','',''])[3];

  const ESTADOS_TAREFA = [
    ['pendente','A fazer'], ['fazendo','Fazendo'], ['concluido','Feito'], ['cancelado','Cancelado'],
  ];

  // O que cabe numa agenda de agência. O tipo não ganha cor: cor aqui é do
  // estado, que é o que precisa saltar aos olhos numa grade de trinta dias. O
  // tipo ganha nome — e é por ele que dá pra olhar uma semana e ver que tem
  // gravação demais e edição de menos.
  const TIPOS_TAREFA = [
    ['tarefa',     'Tarefa',     'Qualquer coisa que precisa ser feita'],
    ['gravacao',   'Gravação',   'Dia de gravar, com o cliente ou sem'],
    ['edicao',     'Edição',     'Cortar, legendar, finalizar'],
    ['reuniao',    'Reunião',    'Conversa marcada, com hora'],
    ['publicacao', 'Publicação', 'O que vai ao ar naquele dia'],
    ['entrega',    'Entrega',    'O que o cliente recebe na mão'],
    ['cobranca',   'Cobrança',   'Boleto, nota, cobrança'],
    ['prazo',      'Prazo',      'Data limite de alguma coisa'],
  ];
  const rotuloTipo = v => (TIPOS_TAREFA.find(x => x[0] === v) || [v,'Tarefa'])[1];

  const PRIORIDADES = [
    ['baixa','Baixa','Se sobrar tempo'],
    ['normal','Normal','O ritmo de sempre'],
    ['alta','Alta','Sai na frente do resto do dia'],
  ];

  // O formulário de cada tipo. Uma gravação e uma cobrança não têm as mesmas
  // perguntas, e mostrar as trinta de uma vez seria pior do que não ter
  // nenhuma. Cada campo aqui existe porque a falta dele custa uma volta: ir
  // gravar sem roteiro é gravar três vezes; editar sem saber onde estão os
  // brutos é mandar mensagem e esperar.
  //
  // Nada disto é somado nem filtrado entre tarefas — por isso mora num jsonb,

  const CAMPOS_POR_TIPO = {

      { c:'acabamento', r:'Acabamento', t:'escolha', op:['Legenda queimada','Só corte','Com trilha','Completo'] },

        d:'Reunião sem pauta escrita é reunião que vira conversa e volta sem decisão.' },
      { c:'decisoes', r:'O que foi decidido', t:'longo',

      { c:'canal', r:'Onde vai ao ar', t:'escolha',
        op:['Instagram feed','Reels','Stories','TikTok','YouTube','Perfil da Empresa'] },
      { c:'legenda', r:'Legenda', t:'longo', p:'O texto que vai junto…' },

        d:'O que a pessoa deve fazer depois de ver. Peça sem chamada não gera nada mensurável.' },
      { c:'aprovado_por', r:'Aprovado por', t:'texto', p:'Nome de quem liberou',
        d:'Em profissão regulada, quem aprovou e quando é o que protege os dois lados.' },
    ],
    entrega: [
      { c:'o_que', r:'O que está sendo entregue', t:'longo' },
      { c:'como', r:'Por onde', t:'escolha', op:['WhatsApp','E-mail','Drive','Na reunião','Impresso'] },
      { c:'confirmado_por', r:'Quem confirmou o recebimento', t:'texto' },
    ],
    cobranca: [
      { c:'valor', r:'Valor', t:'numero', p:'0' },
      { c:'vencimento', r:'Vence em', t:'data' },

        d:'Prazo sem consequência escrita é prazo que ninguém respeita.' },
    ],

  };

  // Listas prontas, uma por tipo. Não é automação: é um modelo que alguém
  // aperta quando quer, e que dá pra apagar linha por linha. O Bloco G da
  // pesquisa é sobre não automatizar processo pouco rodado — isto não decide
  // nada sozinho, só evita redigitar a mesma checklist toda semana.
  const PASSOS_PADRAO = {
    gravacao: ['Bateria e cartão','Tripé e luz','Microfone testado','Roteiro na mão',
               'Autorização de imagem','Backup dos brutos no fim'],
    edicao: ['Escolher os melhores takes','Cortar','Legendar','Revisar o áudio',
             'Exportar','Mandar pra aprovação'],
    reuniao: ['Confirmar na véspera','Mandar a pauta antes','Anotar as decisões',
              'Mandar o resumo depois'],
    publicacao: ['Legenda revisada','Conformidade conferida','Aprovado pelo cliente',
                 'Agendado','Conferir no ar'],
    entrega: ['Conferir contra o que foi combinado','Enviar','Confirmar que recebeu'],
    cobranca: ['Emitir a nota','Mandar a cobrança','Conferir se caiu'],
  };

  const camposDoTipo = tipo => CAMPOS_POR_TIPO[tipo || 'tarefa'] || [];

  // O que dá pra dizer da tarefa em uma linha, com o que o tipo dela guarda.
  function resumoTipo(t){
    const cs = t.campos || {};
    const p = [];
    if(cs.quantidade) p.push(cs.quantidade + (Number(cs.quantidade) === 1 ? ' peça' : ' peças'));
    if(cs.formato) p.push(cs.formato);
    if(cs.canal) p.push(cs.canal);
    if(cs.quem_aparece) p.push('com ' + cs.quem_aparece);
    if(cs.de_quem) p.push(String(cs.de_quem).toLowerCase());
    if(cs.valor) p.push(dinheiro(cs.valor));
    if(cs.vencimento) p.push('vence ' + soData(cs.vencimento));
    return p.join(' · ');
  }

  const iso = d => {
    const x = new Date(d);
    return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0');
  };
  const hojeIso = () => iso(new Date());
  const soHora = h => h ? String(h).slice(0,5) : '';
  // Onde a grade do mês deixa de caber: abaixo disso a célula vira bolinha.
  const estreito = () => window.matchMedia('(max-width:700px)').matches;

  async function salvarTarefa(id, campos){
    const { error } = await sb.from('tarefas').update(campos).eq('id', id);
    if(error){ toast('Não deu: ' + error.message); return false; }
    return true;
  }

  // Um clique percorre os estados na ordem em que a vida acontece.
  async function girarEstado(t){
    const ordem = ['pendente','fazendo','concluido'];
    const i = ordem.indexOf(t.estado);
    const novo = ordem[(i + 1) % ordem.length];
    t.estado = novo; render(); pintarPainel();
    if(!await salvarTarefa(t.id, { estado:novo })){ await carregarTudo(); render(); return; }
    // Concluiu e tinha horário marcado? O tempo se aponta sozinho. É aqui que a
    // conta de custo da tela Economia deixa de depender de alguém lembrar de
    // preencher um formulário — que é a razão de ela estar vazia até hoje.
    if(novo === 'concluido' && !horaDaTarefa(t)){
      const m = minutosMarcados(t);
      if(m && await apontarTempo(t, m)) toast('Feito. Apontei ' + emHoras(m) + ' — dá pra mudar no painel.');
    }
    await carregarTudo(); render();
  }

  async function moverTarefa(t, dia){
    if(t.data === dia) return;
    const antes = t.data;
    t.data = dia; render(); pintarPainel();
    if(!await salvarTarefa(t.id, { data:dia })){ t.data = antes; render(); return; }
    await carregarTudo(); render();
  }

  // Uma tarefa nova nasce dentro do painel, em rascunho: só vira linha no banco
  // quando tem nome. Antes disso, fechar sem preencher não deixa lixo.
  function novaTarefa(dia, clienteId){
    abrirPainel({
      nova:true, titulo:'', tipo:'tarefa', estado:'pendente', prioridade:'normal',
      data: dia || hojeIso(),
      responsavel: state.filtroQuem === 'todos' ? 'os_dois' : state.filtroQuem,
      cliente_id: clienteId || null, passos:[], campos:{},
    });
  }

  function tarefasVisiveis(clienteId){
    let t = state.tarefas;
    if(clienteId !== undefined) t = t.filter(x => x.cliente_id === clienteId);
    if(state.filtroQuem !== 'todos'){
      t = t.filter(x => x.responsavel === state.filtroQuem || x.responsavel === 'os_dois');
    }
    if(state.filtroTipo !== 'todos') t = t.filter(x => (x.tipo || 'tarefa') === state.filtroTipo);
    return t;
  }

  // Ordem dentro do dia: quem tem hora vai primeiro, na ordem do relógio; o
  // resto vem depois, na ordem em que foi criado.
  const porHora = (a,b) =>
    (a.hora ? 0 : 1) - (b.hora ? 0 : 1)
    || String(a.hora||'').localeCompare(String(b.hora||''))
    || String(a.criado_em||'').localeCompare(String(b.criado_em||''));

  // ---------- o que a Central já sabe ----------

  // Datas que já estão guardadas em outro lugar e que ninguém deveria ter que
  // digitar de novo na agenda: o dia de pagamento de cada cliente, o fim do
  // contrato, a data do primeiro valor prometido, a próxima ação de cada
  // oportunidade e os marcos do plano. Entram como leitura — clicar leva pro
  // lugar onde aquilo se edita de verdade, que continua sendo um só.
  function derivados(de, ate, clienteId){
    const fim = [];
    const dentro = d => d && d >= de && d <= ate;
    const cliente = id => state.clientes.find(c => c.id === id);

    state.clientes.forEach(c=>{
      if(clienteId !== undefined && c.id !== clienteId) return;
      if(c.dia_pagamento){
        // Um por mês dentro da janela. Dia 31 em mês de 30 cai no último dia:
        // é o que o banco faz na prática, e é o que a pessoa espera.
        const d0 = new Date(de + 'T00:00:00'), d1 = new Date(ate + 'T00:00:00');
        for(let a = new Date(d0.getFullYear(), d0.getMonth(), 1); a <= d1; a.setMonth(a.getMonth()+1)){
          const ultimo = new Date(a.getFullYear(), a.getMonth()+1, 0).getDate();
          const dia = iso(new Date(a.getFullYear(), a.getMonth(), Math.min(c.dia_pagamento, ultimo)));
          if(dentro(dia)) fim.push({ data:dia, oq:'Pagamento — ' + c.nome, de:'contrato',
            ir:()=>abrirCliente(c.id, 'respostas') });
        }
      }
      if(dentro(c.fim_contrato)) fim.push({ data:c.fim_contrato, oq:'Fim do contrato — ' + c.nome,
        de:'contrato', ir:()=>abrirCliente(c.id, 'respostas') });
      if(dentro(c.primeiro_valor_data)) fim.push({ data:c.primeiro_valor_data,
        oq:'Primeiro valor prometido — ' + c.nome, de:'promessa', ir:()=>abrirCliente(c.id, 'plano') });
    });

    (state.tudo.marcos || []).forEach(m=>{
      if(clienteId !== undefined && m.cliente_id !== clienteId) return;
      if(!dentro(m.data_prevista) || m.data_cumprida) return;
      const c = cliente(m.cliente_id);
      fim.push({ data:m.data_prevista, oq:m.titulo + (c ? ' — ' + c.nome : ''), de:'plano',
        ir:()=> c && abrirCliente(c.id, 'plano') });
    });

    if(clienteId === undefined){
      state.oportunidades.forEach(o=>{
        if(!dentro(o.proxima_acao_em) || o.etapa === 'perdido' || o.etapa === 'cliente') return;
        fim.push({ data:o.proxima_acao_em, oq:(o.proxima_acao || 'Próxima ação') + ' — ' + o.nome,
          de:'captação', ir:()=>ir({tipo:'funil'}) });
      });
    }
    return state.verDerivados === false ? [] : fim;
  }

  function cartaoDerivado(x){
    const c = el('button',{class:'tar auto', title:x.oq + ' · vem de ' + x.de, onclick:x.ir});
    c.appendChild(el('span',{class:'ini auto'},'i'));
    c.appendChild(el('span',{class:'t'}, esc(x.oq)));
    return c;
  }

  // ---------- painel da tarefa ----------

  // Uma tarefa deixou de ser uma linha de texto: tem tipo, hora de começo e de
  // fim, prioridade, cliente, passos, lugar, link e anotação. Nada disso cabe
  // num prompt(), e espalhar quinze campos na grade do mês tornaria o mês
  // ilegível. Por isso o painel: a grade continua sendo a grade, e o detalhe
  // abre ao lado, com o dia ainda à vista.
  let painelAberto = null;

  function pintarPainel(){
    if(painelAberto && painelAberto.repintar) painelAberto.repintar();
  }

  function fecharPainel(){
    if(!painelAberto) return;
    const { caixa, fundo, voltarFoco } = painelAberto;
    painelAberto = null;
    caixa.remove(); fundo.remove();
    document.body.classList.remove('travado');
    if(voltarFoco && document.contains(voltarFoco)) voltarFoco.focus();
    carregarTudo().then(render);
  }

  function abrirPainel(t){
    if(painelAberto) fecharPainel();
    const voltarFoco = document.activeElement;
    const fundo = el('div',{class:'painel-fundo', onclick:fecharPainel});
    const caixa = el('div',{class:'painel', role:'dialog', 'aria-modal':'true',
      'aria-label': t.nova ? 'Nova tarefa' : 'Detalhes da tarefa'});
    document.body.appendChild(fundo);
    document.body.appendChild(caixa);
    document.body.classList.add('travado');
    painelAberto = { caixa, fundo, voltarFoco, tarefa:t, repintar:null };

    // Grava um campo. Enquanto é rascunho fica só na memória; a linha nasce no
    // banco no "Criar", com tudo de uma vez. Depois disso cada campo grava ao
    // sair dele — formulário com botão de salvar no fim é o que faz ninguém
    // preencher a metade de baixo.
    async function grava(campos){
      Object.assign(t, campos);
      if(t.nova){ pintarCabeca(); return true; }
      if(!await salvarTarefa(t.id, campos)){ return false; }
      const viva = state.tarefas.find(x => x.id === t.id);
      if(viva) Object.assign(viva, campos);
      pintarCabeca(); render();
      return true;
    }

    const cab = el('div',{class:'cab'});
    caixa.appendChild(cab);
    const corpo = el('div',{class:'corpo'});
    caixa.appendChild(corpo);
    const pe = el('div',{class:'pe'});
    caixa.appendChild(pe);

    function pintarCabeca(){
      cab.innerHTML = '';
      const esq = el('div',{style:'min-width:0'});
      esq.appendChild(el('p',{class:'rot laranja'}, t.nova ? 'Nova' : rotuloTipo(t.tipo)));
      const quando = el('p',{class:'quando'});
      const d = new Date(t.data + 'T00:00:00');
      quando.textContent = d.toLocaleDateString('pt-BR',{ weekday:'long', day:'numeric', month:'long' })
        + (t.hora ? ' · ' + soHora(t.hora) + (t.hora_fim ? ' às ' + soHora(t.hora_fim) : '') : '');
      esq.appendChild(quando);
      cab.appendChild(esq);
      cab.appendChild(el('button',{class:'fechar', 'aria-label':'Fechar o painel',
        onclick:fecharPainel},'×'));
    }
    painelAberto.repintar = pintarCabeca;
    pintarCabeca();

    // --- uma seção
    const secao = (rot, dica) => {
      const s = el('section',{class:'secao'});
      s.appendChild(el('p',{class:'rot'}, esc(rot)));
      if(dica) s.appendChild(el('p',{class:'dica', style:'margin:6px 0 12px'}, esc(dica)));
      corpo.appendChild(s);
      return s;
    };
    const linha = (s, rot, ctrl) => {
      const l = el('label',{class:'campo-p'});
      l.appendChild(el('span',{}, esc(rot)));
      l.appendChild(ctrl);
      s.appendChild(l);
      return l;
    };
    const chips = (s, rot, opcoes, atual, aoEscolher) => {
      const cx = el('div',{class:'campo-p'});
      cx.appendChild(el('span',{}, esc(rot)));
      const g = el('div',{class:'chips'});
      opcoes.forEach(([k, nome, ajuda])=>{
        const b = el('button',{class:'chip-p', 'aria-pressed':String(atual() === k),
          title: ajuda || nome, onclick:async()=>{
            if(atual() === k) return;
            if(await aoEscolher(k)) g.querySelectorAll('.chip-p').forEach((x,i)=>
              x.setAttribute('aria-pressed', String(opcoes[i][0] === k)));
          }}, esc(nome));
        g.appendChild(b);
      });
      cx.appendChild(g);
      s.appendChild(cx);
      return g;
    };
    const texto = (s, rot, campo, tipo, dica) => {
      const i = el('input',{ type:tipo || 'text', value: t[campo] == null ? '' : t[campo],
        placeholder: dica || '' });
      i.addEventListener('change', async ()=>{
        const v = i.value.trim();
        await grava({ [campo]: v === '' ? null : v });
      });
      linha(s, rot, i);
      return i;
    };

    // --- o quê
    const sOq = secao('O quê');
    const tit = el('input',{ type:'text', value:t.titulo || '', placeholder:'Ex.: Gravar 4 reels com o Rafa',
      class:'titulo-p' });
    tit.addEventListener('change', ()=>grava({ titulo: tit.value.trim() }));
    linha(sOq, 'Nome', tit);
    chips(sOq, 'Tipo', TIPOS_TAREFA, ()=>t.tipo || 'tarefa', async k=>{
      if(!await grava({ tipo:k })) return false;
      desenharCamposDoTipo();
      desenharPassos();
      return true;
    });

    // --- o que só este tipo pede
    // A seção troca junto com o tipo. O que foi escrito num tipo anterior não
    // é apagado: fica guardado e volta se o tipo voltar — trocar de tipo por
    // engano não pode custar o roteiro que alguém acabou de escrever.
    const sTipo = secao('');
    corpo.insertBefore(sTipo, sOq.nextSibling);

    function gravaCampo(chave, valor){
      const cs = Object.assign({}, t.campos || {});
      if(valor === null || valor === '') delete cs[chave]; else cs[chave] = valor;
      return grava({ campos:cs });
    }

    function desenharCamposDoTipo(){
      const tipo = t.tipo || 'tarefa';
      const lista = camposDoTipo(tipo);
      sTipo.innerHTML = '';
      sTipo.hidden = !lista.length;
      if(!lista.length){
        // Nada a pedir pra este tipo — mas se sobrou coisa escrita de outro,
        // é melhor dizer do que deixar a pessoa achar que perdeu.
        const sobrou = Object.keys(t.campos || {}).length;
        if(sobrou){
          sTipo.hidden = false;
          sTipo.appendChild(el('p',{class:'rot'},'Guardado'));
          sTipo.appendChild(el('p',{class:'dica', style:'margin:6px 0 0'},
            sobrou + (sobrou === 1 ? ' campo preenchido' : ' campos preenchidos')
            + ' de outro tipo continuam guardados. Volte o tipo pra vê-los.'));
        }
        return;
      }
      sTipo.appendChild(el('p',{class:'rot'}, esc(rotuloTipo(tipo))));
      const cs = t.campos || {};
      lista.forEach(f=>{
        const v = cs[f.c];
        if(f.t === 'escolha'){
          const cx = el('div',{class:'campo-p'});
          cx.appendChild(el('span',{}, esc(f.r)));
          const g = el('div',{class:'chips'});
          f.op.forEach(op=>{
            const b = el('button',{class:'chip-p', 'aria-pressed':String(v === op),
              onclick:async()=>{
                // Clicar no que já está escolhido limpa: sem isso não há como
                // desfazer uma escolha feita por engano.
                if(await gravaCampo(f.c, v === op ? null : op)) desenharCamposDoTipo();
              }}, esc(op));
            g.appendChild(b);
          });
          cx.appendChild(g);
          sTipo.appendChild(cx);
        } else if(f.t === 'longo'){
          const cx = el('div',{class:'campo-longo'});
          cx.appendChild(el('span',{}, esc(f.r)));
          const ta = el('textarea',{rows: f.c === 'roteiro' ? '6' : '4', placeholder: f.p || ''});
          ta.value = v == null ? '' : v;
          ta.addEventListener('change', ()=>gravaCampo(f.c, ta.value.trim() || null));
          cx.appendChild(ta);
          sTipo.appendChild(cx);
        } else {
          const i = el('input',{
            type: f.t === 'numero' ? 'number' : (f.t === 'data' ? 'date' : 'text'),
            value: v == null ? '' : v, placeholder: f.p || '' });
          if(f.t === 'numero') i.min = '0';
          i.addEventListener('change', async ()=>{
            const txt = i.value.trim();
            await gravaCampo(f.c, txt === '' ? null : (f.t === 'numero' ? Number(txt) : txt));
          });
          const l = el('label',{class:'campo-p'});
          l.appendChild(el('span',{}, esc(f.r)));
          l.appendChild(i);
          sTipo.appendChild(l);
        }
        if(f.d) sTipo.appendChild(el('p',{class:'dica campo-dica'}, esc(f.d)));
      });

      // Publicação de cliente em profissão regulada: o veredito de
      // conformidade já está guardado na ficha dele, e é aqui que ele
      // precisa ser lembrado — antes de a peça ir ao ar, não depois.
      if(tipo === 'publicacao' && t.cliente_id){
        const itens = (state.tudo.conformidade || []).filter(x => x.cliente_id === t.cliente_id);
        const barrados = itens.filter(x => x.status === 'nao_conforme').length;
        const abertos = itens.filter(x => x.status === 'pendente').length;
        if(itens.length){
          const av = el('p',{class:'dica campo-dica' + (barrados ? ' grave' : '')},
            barrados ? barrados + (barrados === 1 ? ' item marcado como "não pode publicar" na ficha deste cliente.' : ' itens marcados como "não pode publicar" na ficha deste cliente.')
            : (abertos ? abertos + (abertos === 1 ? ' item de conformidade ainda sem veredito.' : ' itens de conformidade ainda sem veredito.')
              : 'Conformidade deste cliente está toda com veredito.'));
          sTipo.appendChild(av);
        }
      }
    }
    desenharCamposDoTipo();

    // --- quando
    const sQuando = secao('Quando');
    const dt = el('input',{ type:'date', value:t.data });
    dt.addEventListener('change', async ()=>{
      if(!dt.value){ dt.value = t.data; return; }
      await grava({ data: dt.value });
    });
    linha(sQuando, 'Dia', dt);
    const h1 = el('input',{ type:'time', value: soHora(t.hora) });
    const h2 = el('input',{ type:'time', value: soHora(t.hora_fim) });
    const gravaHoras = async ()=>{
      const a = h1.value || null, b = h2.value || null;
      if(a && b && b < a){ toast('A hora de terminar veio antes da de começar.'); h2.value = soHora(t.hora_fim); return; }
      await grava({ hora:a, hora_fim:b });
    };
    h1.addEventListener('change', gravaHoras);
    h2.addEventListener('change', gravaHoras);
    const duplo = el('div',{class:'duplo'});
    duplo.appendChild(h1); duplo.appendChild(el('span',{class:'ate'},'até')); duplo.appendChild(h2);
    linha(sQuando, 'Hora', duplo);

    // --- quem
    const sQuem = secao('Quem');
    chips(sQuem, 'Responsável', EQUIPE.map(e=>[e[0], e[1]]), ()=>t.responsavel, k=>grava({ responsavel:k }));
    const sel = el('select');
    sel.appendChild(el('option',{value:''},'Interno (sem cliente)'));
    state.clientes.forEach(c => sel.appendChild(el('option',{value:c.id}, esc(c.nome))));
    sel.value = t.cliente_id || '';
    sel.addEventListener('change', ()=>grava({ cliente_id: sel.value || null }));
    linha(sQuem, 'Cliente', sel);

    // --- como está
    const sEstado = secao('Como está');
    chips(sEstado, 'Situação', ESTADOS_TAREFA, ()=>t.estado, k=>grava({ estado:k }));
    chips(sEstado, 'Prioridade', PRIORIDADES, ()=>t.prioridade || 'normal', k=>grava({ prioridade:k }));

    // --- tempo gasto
    // Não é controle de ponto: é o único jeito de o preço parar de ser palpite.
    // Um clique, na hora em que a tarefa acaba e você ainda lembra quanto durou.
    const sTempo = secao('Tempo gasto',
      'O que faz a tela Economia existir. Sem isto não dá pra saber se o cliente dá lucro.');
    const linhaTempo = el('div',{class:'tempo-lin'});
    sTempo.appendChild(linhaTempo);

    function desenharTempo(){
      linhaTempo.innerHTML = '';
      if(t.nova){
        linhaTempo.appendChild(el('p',{class:'dica', style:'margin:0'},
          'Depois de criar a tarefa dá pra apontar o tempo aqui.'));
        return;
      }
      const reg = horaDaTarefa(t);
      const marcado = minutosMarcados(t);
      const atalhos = [15, 30, 60, 90, 120];
      const grade = el('div',{class:'chips'});
      if(marcado && (!reg || reg.minutos !== marcado)){
        grade.appendChild(el('button',{class:'chip-p', onclick:async()=>{
          if(await apontarTempo(t, marcado)){ desenharTempo(); render(); }
        }}, 'o horário marcado (' + emHoras(marcado) + ')'));
      }
      atalhos.forEach(a=>{
        grade.appendChild(el('button',{class:'chip-p', 'aria-pressed':String(!!reg && reg.minutos === a),
          onclick:async()=>{ if(await apontarTempo(t, a)){ desenharTempo(); render(); } }}, emHoras(a)));
      });
      linhaTempo.appendChild(grade);

      const exato = el('div',{class:'campo-p', style:'margin-top:12px'});
      exato.appendChild(el('span',{},'Minutos'));
      const cx = el('div',{style:'display:flex;gap:8px;align-items:center'});
      const im = el('input',{type:'number', min:'1', step:'5', placeholder:'—',
        value: reg ? String(reg.minutos) : ''});
      im.addEventListener('change', async ()=>{
        const v = im.value.trim();
        if(v === ''){ if(await apontarTempo(t, null)){ desenharTempo(); render(); } return; }
        const n = Number(v);
        if(!(n > 0)){ toast('Precisa ser maior que zero.'); im.value = reg ? reg.minutos : ''; return; }
        if(await apontarTempo(t, n)){ desenharTempo(); render(); }
      });
      cx.appendChild(im);
      if(reg) cx.appendChild(el('button',{class:'linkbtn', onclick:async()=>{
        if(await apontarTempo(t, null)){ desenharTempo(); render(); }
      }},'apagar o apontamento'));
      exato.appendChild(cx);
      linhaTempo.appendChild(exato);

      const fat = el('div',{class:'campo-p'});
      fat.appendChild(el('span',{},'Cobra?'));
      const gf = el('div',{class:'chips'});
      [[true,'Cobra do cliente'],[false,'Não cobra']].forEach(([v,rot])=>{
        gf.appendChild(el('button',{class:'chip-p',
          'aria-pressed':String(!!reg && reg.faturavel === v),
          onclick:async()=>{
            if(!reg){ toast('Aponte o tempo primeiro.'); return; }
            if(await apontarTempo(t, reg.minutos, v)){ desenharTempo(); render(); }
          }}, rot));
      });
      fat.appendChild(gf);
      linhaTempo.appendChild(fat);
      linhaTempo.appendChild(el('p',{class:'dica', style:'margin:10px 0 0'},
        reg
          ? 'Apontado: ' + emHoras(reg.minutos) + (reg.faturavel ? ', cobrado do cliente.' : ', por nossa conta.')
          : 'Nada apontado ainda. Retrabalho e reunião interna também contam — se ficarem de fora, a conta do custo mente.'));
    }
    desenharTempo();

    // --- passos
    // O checklist é o que transforma "gravar reels" em uma coisa que dá pra
    // parar no meio e retomar sem perder onde estava.
    const sPassos = secao('Passos', 'Quebre a tarefa no que dá pra marcar um a um.');
    const listaPassos = el('div',{class:'passos'});
    sPassos.appendChild(listaPassos);
    const novoPasso = el('input',{ type:'text', placeholder:'+ acrescentar passo', class:'novo-passo' });
    novoPasso.addEventListener('keydown', async e=>{
      if(e.key !== 'Enter') return;
      const v = novoPasso.value.trim();
      if(!v) return;
      const ps = (t.passos || []).concat([{ t:v, ok:false }]);
      if(await grava({ passos:ps })){ novoPasso.value = ''; desenharPassos(); novoPasso.focus(); }
    });
    sPassos.appendChild(novoPasso);

    function desenharPassos(){
      const ps = t.passos || [];
      listaPassos.innerHTML = '';
      if(!ps.length){
        listaPassos.appendChild(el('p',{class:'dica', style:'margin:0 0 10px'},'Nenhum passo ainda.'));
        const modelo = PASSOS_PADRAO[t.tipo || 'tarefa'];
        if(modelo && modelo.length){
          listaPassos.appendChild(el('button',{class:'btn ghost small', style:'margin-bottom:12px',
            onclick:async()=>{
              const novos = modelo.map(x => ({ t:x, ok:false }));
              if(await grava({ passos:novos })) desenharPassos();
            }}, 'usar a lista de ' + rotuloTipo(t.tipo).toLowerCase()));
          listaPassos.appendChild(el('p',{class:'dica', style:'margin:0 0 10px'},
            'São ' + modelo.length + ' passos que se repetem nesse tipo de trabalho. '
            + 'Depois de colocar dá pra apagar e trocar o que não servir.'));
        }
      }
      ps.forEach((p, i)=>{
        const l = el('div',{class:'passo'+(p.ok?' ok':'')});
        l.appendChild(el('button',{class:'marca'+(p.ok?' concluido':''), 'aria-pressed':String(!!p.ok),
          'aria-label': (p.ok ? 'Desmarcar: ' : 'Marcar: ') + p.t,
          onclick:async()=>{
            const novos = ps.map((x,j)=> j===i ? { t:x.t, ok:!x.ok } : x);
            if(await grava({ passos:novos })) desenharPassos();
          }}, p.ok ? '✓' : ''));
        const cam = el('input',{ type:'text', value:p.t });
        cam.addEventListener('change', async ()=>{
          const v = cam.value.trim();
          const novos = v ? ps.map((x,j)=> j===i ? { t:v, ok:x.ok } : x) : ps.filter((x,j)=> j!==i);
          if(await grava({ passos:novos })) desenharPassos();
        });
        l.appendChild(cam);
        l.appendChild(el('button',{class:'x', 'aria-label':'Remover o passo ' + p.t, onclick:async()=>{
          const novos = ps.filter((x,j)=> j!==i);
          if(await grava({ passos:novos })) desenharPassos();
        }},'×'));
        listaPassos.appendChild(l);
      });
      const feitos = ps.filter(p=>p.ok).length;
      if(ps.length) listaPassos.appendChild(el('p',{class:'dica', style:'margin:8px 0 0'},
        feitos + ' de ' + ps.length + ' ' + (feitos === 1 ? 'passo feito' : 'passos feitos') + '.'));
    }
    desenharPassos();

    // --- onde
    const sOnde = secao('Onde');
    texto(sOnde, 'Lugar', 'local', 'text', 'Estúdio, endereço, "na loja dele"…');
    const lk = texto(sOnde, 'Link', 'link', 'url', 'Chamada, pasta, referência…');
    const verLink = el('a',{ class:'abrir', target:'_blank', rel:'noopener noreferrer' },'abrir');
    const arrumaLink = ()=>{
      const v = (t.link || '').trim();
      verLink.hidden = !v;
      if(v) verLink.href = /^https?:/i.test(v) ? v : 'https://' + v;
    };
    lk.parentNode.appendChild(verLink);
    lk.addEventListener('change', ()=>setTimeout(arrumaLink, 0));
    arrumaLink();

    // --- anotações
    const sNota = secao('Anotação', 'O que não cabe no nome: o combinado, o que deu errado da última vez.');
    const ta = el('textarea',{ rows:'4', placeholder:'Escreva aqui…' });
    ta.value = t.detalhe || '';
    ta.addEventListener('change', ()=>grava({ detalhe: ta.value.trim() || null }));
    sNota.appendChild(ta);

    // --- pé
    function pintarPe(){
      pe.innerHTML = '';
      if(t.nova){
        const criar = el('button',{class:'btn'},'Criar tarefa');
        criar.addEventListener('click', async ()=>{
          const nome = tit.value.trim();
          if(!nome){ toast('Dê um nome pra tarefa antes de criar.'); tit.focus(); return; }
          criar.disabled = true;
          const linha = { titulo:nome, tipo:t.tipo, data:t.data, hora:t.hora || null,
            hora_fim:t.hora_fim || null, responsavel:t.responsavel, cliente_id:t.cliente_id || null,
            estado:t.estado, prioridade:t.prioridade, local:t.local || null, link:t.link || null,
            detalhe:t.detalhe || null, passos:t.passos || [], campos:t.campos || {} };
          const { data, error } = await sb.from('tarefas').insert(linha).select().single();
          if(error){ toast('Não deu: ' + error.message); criar.disabled = false; return; }
          t.nova = false; t.id = data.id;
          state.tarefas.push(Object.assign({}, linha, { id:data.id }));
          toast('Criada.'); render(); pintarCabeca(); pintarPe();
        });
        pe.appendChild(criar);
        pe.appendChild(el('button',{class:'btn ghost', onclick:fecharPainel},'Cancelar'));
        return;
      }
      const cli = t.cliente_id && state.clientes.find(c => c.id === t.cliente_id);
      if(cli) pe.appendChild(el('button',{class:'btn ghost small',
        onclick:()=>{ fecharPainel(); abrirCliente(cli.id, 'agenda'); }}, 'Abrir ' + esc(cli.nome)));
      pe.appendChild(el('span',{style:'flex:1'}));
      pe.appendChild(el('button',{class:'btn ghost small perigo', onclick:()=>{
        const id = t.id, nome = t.titulo;
        fecharPainel();
        removerComVolta('tarefas', id, nome, async()=>{ await carregarTudo(); render(); });
      }},'Remover'));
      pe.appendChild(el('button',{class:'btn small', onclick:fecharPainel},'Fechar'));
    }
    pintarPe();

    // Foco preso dentro do painel enquanto ele está aberto: quem navega por Tab
    // não pode cair sem aviso na tela de trás, que está inerte.
    caixa.addEventListener('keydown', e=>{
      if(e.key === 'Escape'){ e.preventDefault(); fecharPainel(); return; }
      if(e.key !== 'Tab') return;
      const alvos = [...caixa.querySelectorAll('button, input, select, textarea, a[href]')]
        .filter(n => !n.hidden && n.offsetParent !== null && !n.disabled);
      if(!alvos.length) return;
      const primeiro = alvos[0], ultimo = alvos[alvos.length - 1];
      if(e.shiftKey && document.activeElement === primeiro){ e.preventDefault(); ultimo.focus(); }
      else if(!e.shiftKey && document.activeElement === ultimo){ e.preventDefault(); primeiro.focus(); }
    });
    setTimeout(()=>tit.focus(), 0);
  }

  // ---------- telas ----------

  function telaAgenda(){

  function calendario(clienteId){
    const box = el('div');
    const ref = new Date(state.mesAgenda + '-01T00:00:00');
    const hoje = hojeIso();

    const topo = el('div',{class:'mes'});
    const rotuloMes = ref.toLocaleDateString('pt-BR',{ month:'long', year:'numeric' });
    topo.appendChild(el('span',{class:'nome'}, rotuloMes.charAt(0).toUpperCase() + rotuloMes.slice(1)));
    const setas = el('div',{class:'setas'});
    const anda = n => { const d = new Date(ref); d.setMonth(d.getMonth()+n);
      state.mesAgenda = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); render(); };
    setas.appendChild(el('button',{title:'mês anterior', onclick:()=>anda(-1)},'←'));
    setas.appendChild(el('button',{class:'hoje', onclick:()=>{ state.mesAgenda = hoje.slice(0,7); render(); }},'hoje'));
    setas.appendChild(el('button',{title:'próximo mês', onclick:()=>anda(1)},'→'));
    topo.appendChild(setas);
    box.appendChild(topo);

    const cab = el('div',{class:'semana'});
    ['seg','ter','qua','qui','sex','sáb','dom'].forEach(d => cab.appendChild(el('span',{},d)));
    box.appendChild(cab);

    // A grade começa na segunda-feira da semana do dia 1 e vai até completar
    // semanas inteiras — senão o mês fica torto e a leitura se perde.
    const primeiro = new Date(ref.getFullYear(), ref.getMonth(), 1);
    const desloca = (primeiro.getDay() + 6) % 7;   // 0 = segunda
    const inicio = new Date(primeiro); inicio.setDate(1 - desloca);
    const ultimo = new Date(ref.getFullYear(), ref.getMonth()+1, 0);
    const total = desloca + ultimo.getDate();
    const celulas = Math.ceil(total / 7) * 7;
    const fimGrade = new Date(inicio); fimGrade.setDate(inicio.getDate() + celulas - 1);

    const todas = tarefasVisiveis(clienteId).filter(t => !foiEscondido(t));
    const auto = derivados(iso(inicio), iso(fimGrade), clienteId);
    const grade = el('div',{class:'grade'});
    for(let i = 0; i < celulas; i++){
      const d = new Date(inicio); d.setDate(inicio.getDate() + i);
      const chave = iso(d);
      const fora = d.getMonth() !== ref.getMonth();
      const cel = el('div',{class:'dia'+(fora?' fora':'')+(chave===hoje?' hoje':''), 'data-dia':chave});

      const n = el('div',{class:'n'});
      n.appendChild(el('span',{}, String(d.getDate())));
      const doDia = todas.filter(t => t.data === chave).sort(porHora);
      const autoDoDia = auto.filter(x => x.data === chave);
      const abertas = doDia.filter(t => t.estado === 'pendente' || t.estado === 'fazendo').length;
      if(abertas) n.appendChild(el('em',{}, String(abertas)));
      cel.appendChild(n);

      const cabe = 3;
      doDia.slice(0, cabe).forEach(t => cel.appendChild(cartaoTarefa(t, true)));
      autoDoDia.slice(0, Math.max(0, cabe - doDia.length)).forEach(x => cel.appendChild(cartaoDerivado(x)));
      const sobra = Math.max(0, doDia.length + autoDoDia.length - cabe);
      if(sobra > 0) cel.appendChild(el('span',{class:'mais'}, '+' + sobra));

      // No celular a célula tem 40px de largura: cabe o número do dia e mais
      // nada. Em vez de espremer o título até virar reticências, o dia vira
      // bolinha por tarefa — dá pra ver a carga da semana de longe — e o toque
      // leva pra lista daquele dia, onde o texto cabe.
      if(doDia.length || autoDoDia.length){
        const pontos = el('div',{class:'pontos'});
        doDia.slice(0,6).forEach(t => pontos.appendChild(el('i',{class:t.estado})));
        if(autoDoDia.length) pontos.appendChild(el('i',{class:'auto'}));
        cel.appendChild(pontos);
      }

      cel.addEventListener('click', e=>{
        if(e.target.closest('.tar')) return;
        if(!estreito()) return;
        state.visaoAgenda = 'lista'; state.diaFoco = chave; render();
      });
      cel.addEventListener('dblclick', e=>{
        if(e.target.closest('.tar')) return;
        novaTarefa(chave, clienteId || undefined);
      });
      cel.addEventListener('dragover', e=>{ e.preventDefault(); cel.classList.add('alvo'); });
      cel.addEventListener('dragleave', ()=> cel.classList.remove('alvo'));
      cel.addEventListener('drop', async e=>{
        e.preventDefault(); cel.classList.remove('alvo');
        const id = e.dataTransfer.getData('text/plain');
        const t = state.tarefas.find(x => x.id === id);
        if(t) await moverTarefa(t, chave);
      });
      grade.appendChild(cel);
    }
    box.appendChild(grade);
    box.appendChild(el('p',{class:'dica', style:'margin-top:12px'},
      'Clique numa tarefa pra abrir o painel; no quadradinho, pra andar entre a fazer, fazendo e feito. '
      + 'Dois cliques num dia vazio criam uma tarefa nele. O número no canto é quanto falta fazer naquele dia. '
      + 'As linhas com <b>i</b> vêm de outro lugar da Central e se editam lá. '
      + 'No celular o dia vira bolinhas — um toque abre a lista dele.'));
    return box;
  }

  // O cartão do mês. O quadradinho da esquerda anda o estado; o resto do cartão
  // abre o painel. Antes o cartão inteiro girava o estado, e era fácil marcar
  // como feito uma tarefa que você só queria ler.
  function cartaoTarefa(t, curto){
    const c = el('div',{class:'tar '+t.estado+(t.prioridade === 'alta' ? ' urgente' : ''),
      draggable:'true', tabindex:'0',
      title: t.titulo + (t.hora ? ' · ' + soHora(t.hora) : '') + ' · ' + rotuloTipo(t.tipo)
        + ((t.passos || []).length ? ' · ' + (t.passos.filter(x=>x.ok).length) + '/' + t.passos.length + ' passos' : '')
        + (resumoTipo(t) ? ' · ' + resumoTipo(t) : '')});
    c.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', t.id); e.dataTransfer.effectAllowed='move';
      c.classList.add('arrastando');
    });
    c.addEventListener('dragend', ()=> c.classList.remove('arrastando'));
    const marca = el('button',{class:'ini '+classePessoa(t.responsavel),
      'aria-label':'Estado de ' + t.titulo + ': ' + (ESTADOS_TAREFA.find(e=>e[0]===t.estado)||['','?'])[1]
        + '. Clique pra mudar.'}, inicial(t.responsavel));
    marca.addEventListener('click', e=>{ e.stopPropagation(); girarEstado(t); });
    c.appendChild(marca);
    if(t.hora) c.appendChild(el('span',{class:'h'}, soHora(t.hora)));
    c.appendChild(el('span',{class:'t'}, esc(t.titulo)));
    const ps = t.passos || [];
    if(ps.length) c.appendChild(el('span',{class:'ps'}, ps.filter(p=>p.ok).length + '/' + ps.length));
    c.addEventListener('click', ()=>abrirPainel(t));
    c.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ e.preventDefault(); abrirPainel(t); }
      else if(e.key === ' '){ e.preventDefault(); girarEstado(t); }
    });
    return c;
  }

  function listaDias(clienteId){
    const box = el('div');
    const hoje = hojeIso();
    const todas = tarefasVisiveis(clienteId).filter(t => !foiEscondido(t)).slice()
      .sort((a,b)=> a.data.localeCompare(b.data) || porHora(a,b));

    // A janela da lista: de trinta dias atrás até noventa à frente. Sem janela,
    // as datas do sistema (pagamento todo mês, por exemplo) seriam infinitas.
    const de = new Date(); de.setDate(de.getDate() - 30);
    const ate = new Date(); ate.setDate(ate.getDate() + 90);
    const auto = derivados(iso(de), iso(ate), clienteId);

    if(!todas.length && !auto.length){
      const v = el('div',{class:'vazio'});
      v.appendChild(el('strong',{},'Nenhuma tarefa'));
      v.appendChild(el('span',{},'Use "+ tarefa hoje", ou dê dois cliques num dia do calendário.'));
      box.appendChild(v);
      return box;
    }

    const porDia = {};
    todas.forEach(t => { (porDia[t.data] = porDia[t.data] || { t:[], a:[] }).t.push(t); });
    auto.forEach(x => { (porDia[x.data] = porDia[x.data] || { t:[], a:[] }).a.push(x); });
    Object.keys(porDia).sort().forEach(dia=>{
      const d = new Date(dia + 'T00:00:00');

        'data-dia':dia});
      const cab = el('div',{class:'cab'});
      cab.appendChild(el('b',{}, d.toLocaleDateString('pt-BR',{ weekday:'long', day:'numeric', month:'long' })));
      if(dia === hoje) cab.appendChild(el('span',{},'hoje'));
      else if(dia < hoje) cab.appendChild(el('span',{style:'color:var(--al)'}, emDias(diasAte(dia))));
      else cab.appendChild(el('span',{}, emDias(diasAte(dia))));
      cab.appendChild(el('button',{class:'mais-dia', title:'nova tarefa nesse dia',
        'aria-label':'Nova tarefa em ' + d.toLocaleDateString('pt-BR'),
        onclick:()=>novaTarefa(dia, clienteId || undefined)},'+'));
      g.appendChild(cab);

      porDia[dia].t.forEach(t=>{
        const l = el('div',{class:'linha-tar '+t.estado+(t.prioridade === 'alta' ? ' urgente' : '')});
        l.appendChild(el('button',{class:'marca '+t.estado, title:'mudar estado',
          onclick:()=>girarEstado(t)}, t.estado === 'concluido' ? '✓' : (t.estado === 'fazendo' ? '•' : '')));
        const corpo = el('button',{class:'corpo', onclick:()=>abrirPainel(t)});
        const tit = el('div',{class:'tit'});
        if(t.hora) tit.appendChild(el('span',{class:'h'}, soHora(t.hora)
          + (t.hora_fim ? '–' + soHora(t.hora_fim) : '')));
        tit.appendChild(el('span',{}, esc(t.titulo)));
        corpo.appendChild(tit);
        const sub = el('div',{class:'sub'});
        sub.appendChild(el('span',{class:'ini '+classePessoa(t.responsavel)}, inicial(t.responsavel)));
        sub.appendChild(el('span',{}, esc(pessoa(t.responsavel))));
        if((t.tipo || 'tarefa') !== 'tarefa') sub.appendChild(el('span',{}, '· ' + esc(rotuloTipo(t.tipo))));
        const res = resumoTipo(t);
        if(res) sub.appendChild(el('span',{}, '· ' + esc(res)));
        const cli = t.cliente_id && state.clientes.find(c => c.id === t.cliente_id);
        if(cli) sub.appendChild(el('span',{}, '· ' + esc(cli.nome)));
        else if(clienteId === undefined) sub.appendChild(el('span',{},'· interno'));
        if(t.prioridade === 'alta') sub.appendChild(el('span',{style:'color:var(--al)'},'· prioridade alta'));
        const ps = t.passos || [];
        if(ps.length) sub.appendChild(el('span',{}, '· ' + ps.filter(p=>p.ok).length + '/' + ps.length + ' passos'));
        if(t.local) sub.appendChild(el('span',{}, '· ' + esc(t.local)));
        if(t.detalhe) sub.appendChild(el('span',{}, '· ' + esc(t.detalhe)));
        corpo.appendChild(sub);
        l.appendChild(corpo);
        l.appendChild(el('button',{class:'apagar', style:'background:none;border:none;color:var(--fraco)',
          title:'remover', onclick:async()=>{
            removerComVolta('tarefas', t.id, t.titulo, async()=>{ await carregarTudo(); render(); });
          }},'×'));
        g.appendChild(l);
      });

      porDia[dia].a.forEach(x=>{
        const l = el('button',{class:'linha-tar auto', onclick:x.ir});
        l.appendChild(el('span',{class:'marca auto'},'i'));
        const corpo = el('div',{class:'corpo'});
        corpo.appendChild(el('div',{class:'tit'}, esc(x.oq)));
        corpo.appendChild(el('div',{class:'sub'}, 'vem de ' + esc(x.de) + ' · clique pra abrir onde se edita'));
        l.appendChild(corpo);
        g.appendChild(l);
      });
      box.appendChild(g);
    });
    if(state.diaFoco) setTimeout(()=>{
      const alvo = box.querySelector('.dia-lista.focado');
      if(alvo) alvo.scrollIntoView({ block:'center' });
      state.diaFoco = null;
    }, 0);
    return box;
  }

  // Dentro da ficha do cliente: a mesma agenda, só o que é dele.
  function abaAgendaCliente(c){
    const box = el('div');
    const minhas = state.tarefas.filter(t => t.cliente_id === c.id);
    const hoje = hojeIso();
    if(minhas.length){
      box.appendChild(placar([
        { rotulo:'Abertas', valor:minhas.filter(t=>t.estado==='pendente'||t.estado==='fazendo').length, destaca:true },
        { rotulo:'Atrasadas', valor:minhas.filter(t=>t.data<hoje&&(t.estado==='pendente'||t.estado==='fazendo')).length, esconderSeZero:true },
        { rotulo:'Feitas', valor:minhas.filter(t=>t.estado==='concluido').length },

  // ---------- economia ----------

  // Por que esta tela existe: a pesquisa da Fase 0 diz, em três lugares
  // diferentes, que a maioria das agências cobra 20 a 40% abaixo do que
  // deveria — e que a causa não é falta de coragem, é não saber o custo real
  // de entrega. Bloco F2: "você não pode precificar sem saber quantas horas
  // custa entregar". A tabela de horas existe desde o primeiro dia e tinha
  // duas linhas, porque lançar hora num formulário à parte é trabalho que não
  // aparece pra ninguém. A partir daqui o número nasce da tarefa que já
  // estava na agenda.
  const ECONOMIA_PADRAO = {
    custo_mensal:null, pessoas:2, horas_semana_pessoa:40,
    meta_utilizacao:0.72, margem_alvo:0.70,
  };
  const SEMANAS_MES = 4.345;   // 52 ÷ 12

  const CATEGORIA_DE_TIPO = {
    gravacao:'conteudo', edicao:'conteudo', publicacao:'conteudo', reuniao:'reuniao',
    entrega:'relatorio', cobranca:'admin', prazo:'outro', tarefa:'outro',
  };

  const horaDaTarefa = t => (state.tudo.horas || []).find(h => h.tarefa_id === t.id) || null;

  // Quanto tempo o horário marcado promete. Serve de sugestão, nunca de
  // verdade: o que conta é o que foi apontado.
  function minutosMarcados(t){
    if(!t.hora || !t.hora_fim) return null;
    const m = s => { const p = String(s).split(':'); return Number(p[0])*60 + Number(p[1]); };
    const d = m(t.hora_fim) - m(t.hora);
    return d > 0 ? d : null;
  }

  const emHoras = min => {
    if(min == null) return '—';
    if(min < 60) return min + ' min';
    const h = Math.floor(min/60), r = min % 60;
    return r ? h + 'h' + String(r).padStart(2,'0') : h + ' h';
  };
  const reais = v => v == null ? '—' :
    'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits:0, maximumFractionDigits:0 });
  const porcento = v => v == null ? '—' : Math.round(v*100) + '%';

  // Um lançamento por tarefa, garantido por índice único no banco: apertar
  // duas vezes não conta o trabalho duas vezes.
  async function apontarTempo(t, minutos, faturavel){
    const linha = horaDaTarefa(t);
    if(minutos == null){
      if(!linha) return true;
      const { error } = await sb.from('horas').delete().eq('id', linha.id);
      if(error){ toast('Não deu: ' + error.message); return false; }
      state.tudo.horas = (state.tudo.horas || []).filter(h => h.id !== linha.id);
      return true;
    }
    const campos = {
      cliente_id: t.cliente_id || null,
      data: t.data,
      minutos: Math.max(1, Math.round(minutos)),
      atividade: (t.titulo || '').trim() || 'Tarefa sem nome',
      categoria: CATEGORIA_DE_TIPO[t.tipo || 'tarefa'] || 'outro',
      quem: pessoa(t.responsavel),
      faturavel: faturavel !== undefined ? faturavel
        : (linha ? linha.faturavel : !!t.cliente_id),
      tarefa_id: t.id,
    };
    if(linha){
      const { error } = await sb.from('horas').update(campos).eq('id', linha.id);
      if(error){ toast('Não deu: ' + error.message); return false; }
      Object.assign(linha, campos);
    } else {
      const { data, error } = await sb.from('horas').insert(campos).select().single();
      if(error){ toast('Não deu: ' + error.message); return false; }
      (state.tudo.horas = state.tudo.horas || []).push(Object.assign({}, campos, { id:data.id }));
    }
    return true;
  }

  // ---------- as contas ----------

  function contasDoMes(mes){
    const e = state.economia || ECONOMIA_PADRAO;
    const pessoas = Number(e.pessoas) || 0;
    const horaSem = Number(e.horas_semana_pessoa) || 0;
    const utilAlvo = Number(e.meta_utilizacao) || 0.72;
    const margemAlvo = Number(e.margem_alvo) || 0.70;
    const custoMensal = e.custo_mensal == null || e.custo_mensal === '' ? null : Number(e.custo_mensal);

    const horasDisponiveis = pessoas * horaSem * SEMANAS_MES;
    const horasFaturaveis = horasDisponiveis * utilAlvo;
    const custoHora = (custoMensal != null && horasFaturaveis > 0) ? custoMensal / horasFaturaveis : null;

    const noMes = (state.tudo.horas || []).filter(h => String(h.data || '').slice(0,7) === mes);
    const soma = ls => ls.reduce((s,l)=> s + (Number(l.minutos) || 0), 0);
    const minTotal = soma(noMes);
    const minCliente = soma(noMes.filter(h => h.cliente_id));
    const minFaturavel = soma(noMes.filter(h => h.faturavel));

    const ativos = state.clientes.filter(c => ['onboarding','ativo','pausado'].includes(c.estagio));
    const porCliente = ativos.map(c=>{
      const meus = noMes.filter(h => h.cliente_id === c.id);
      const min = soma(meus);
      const horas = min/60;
      const receita = Number(c.valor_mensal) || 0;
      const custo = custoHora == null ? null : horas * custoHora;
      const margem = (custo == null || !receita) ? null : (receita - custo) / receita;
      return { c, min, horas, receita, custo, margem,
        reaisHora: horas > 0 && receita ? receita / horas : null,
        lancamentos: meus.length };
    }).sort((a,b)=>{
      if(a.margem == null && b.margem == null) return b.min - a.min;
      if(a.margem == null) return 1;
      if(b.margem == null) return -1;
      return a.margem - b.margem;    // pior margem no topo: é onde se olha primeiro
    });

    const receitaMes = porCliente.reduce((s,l)=> s + l.receita, 0);
    const comHoras = porCliente.filter(l => l.min > 0);
    const mediaMinCliente = comHoras.length ? soma(noMes.filter(h=>h.cliente_id)) / comHoras.length : null;

    // Quanto dado existe. Sem isso a tela viraria uma máquina de conclusões
    // sobre três lançamentos — que é exatamente o erro que a pesquisa aponta
    // nas fontes fracas que ela mesma cataloga.
    const dias = new Set(noMes.map(h => h.data)).size;
    const confianca = noMes.length === 0 ? 'nada'
      : (noMes.length < 8 || dias < 5) ? 'pouco'
      : (noMes.length < 25) ? 'indicio' : 'ok';

    // Quanto custa uma peça. Conta só o que foi ao ar (tarefa de publicação
    // concluída), contra as horas de conteúdo do mês — que incluem gravar e
    // editar. Contar peça na gravação E na edição contaria a mesma peça duas
    // vezes, e o número serve justamente pra decidir preço.
    const publicadas = state.tarefas.filter(x =>
      (x.tipo === 'publicacao') && x.estado === 'concluido' && String(x.data || '').slice(0,7) === mes);
    const pecas = publicadas.reduce((n,x)=> n + (Number((x.campos || {}).quantidade) || 1), 0);
    const minConteudo = soma(noMes.filter(h => h.categoria === 'conteudo'));

    return {
      e, mes, pessoas, horaSem, utilAlvo, margemAlvo, custoMensal,
      horasDisponiveis, horasFaturaveis, custoHora,
      noMes, minTotal, minCliente, minFaturavel, dias, confianca,
      porCliente, receitaMes, pecas, minConteudo, publicadas,
      utilizacaoMedida: minTotal ? minCliente / minTotal : null,
      cabem: (mediaMinCliente && horasFaturaveis) ? (horasFaturaveis * 60) / mediaMinCliente : null,
      mediaMinCliente,
    };
  }

  // Uma barra por linha, todas da mesma cor. A cor aqui não identifica nada —
  // o que a barra diz é tamanho, e tamanho já está no comprimento. Pintar cada
  // uma de um jeito gastaria o único canal livre repetindo o que o olho já vê.
  function barras(itens, formata){
    const maior = itens.reduce((m,i)=> Math.max(m, i.valor), 0) || 1;
    const box = el('div',{class:'barras'});
    itens.forEach(i=>{
      const l = el('div',{class:'barra-l', title: i.rotulo + ' · ' + formata(i.valor)});
      l.appendChild(el('span',{class:'rot-b'}, esc(i.rotulo)));
      const trilho = el('div',{class:'trilho'});
      trilho.appendChild(el('i',{style:'width:' + Math.max(2, Math.round((i.valor/maior)*100)) + '%'}));
      l.appendChild(trilho);
      l.appendChild(el('span',{class:'val-b'}, formata(i.valor)));
      box.appendChild(l);
    });
    return box;
  }

  // Uma razão contra um limite: medidor, não gráfico. O número e a palavra vão
  // junto sempre — cor sozinha não conta nada a quem não a enxerga.
  function medidor(valor, alvo){
    const box = el('div',{class:'medidor'});
    const cheio = Math.max(0, Math.min(1, valor));
    const como = valor >= alvo ? 'ok' : (valor >= alvo - 0.15 ? 'es' : 'al');
    const t = el('div',{class:'trilho ' + como});
    t.appendChild(el('i',{style:'width:' + Math.round(cheio*100) + '%'}));
    t.appendChild(el('u',{style:'left:' + Math.round(Math.min(1,alvo)*100) + '%', title:'alvo: ' + porcento(alvo)}));
    box.appendChild(t);
    box.appendChild(el('span',{class:'lab ' + como},
      porcento(valor) + ' · ' + (valor >= alvo ? 'no alvo' : 'abaixo do alvo')));
    return box;
  }

  function telaEconomia(){

        av.appendChild(el('p',{class:'intro'},
