<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central Bora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Anton&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  /* ==================================================================
     Central Bora — papel de revista
     Papel morno com blocos que flutuam (profundidade em vez de contorno),
     e dentro deles o contraste de escala de revista: número enorme,
     rótulo minúsculo e espaçado. As cores de estado são separadas do
     laranja e do roxo da marca de propósito: laranja quer dizer "olha
     aqui", roxo quer dizer "isso é do cliente"; estado é outra coisa.
     ================================================================== */
  :root{
    --papel:#F5F2EC;
    --sup:#FFFFFF;
    --sup2:#FBF9F5;
    --tinta:#1A1815;
    --fraco:#6E675F;
    --linha:#E8E2D8;
    --linha2:#F0EBE2;
    --laranja:#FF5E00;
    --laranja-forte:#B84300;
    --laranja-fraco:#FFF1E8;
    --roxo:#8800FF;
    --roxo-fraco:#F4EAFF;

    --ok:#1C6B45;    --ok-f:#EAF3EE;   --ok-b:#CBE3D6;
    --al:#A93226;    --al-f:#FBEAE7;   --al-b:#F1CFC9;
    --es:#8A5A05;    --es-f:#FBF1DE;   --es-b:#EEDFBC;
    --an:#1B4F8F;    --an-f:#E9F0F9;   --an-b:#CBDCF0;
    --nt:#6D665F;    --nt-f:#F1EEE8;   --nt-b:#E2DDD4;

    --s1:0 1px 2px rgba(26,24,21,.04), 0 6px 22px rgba(26,24,21,.06);
    --s2:0 2px 4px rgba(26,24,21,.05), 0 14px 40px rgba(26,24,21,.09);
    --r:14px;
    --display:'Space Grotesk','Segoe UI',sans-serif;
    --corpo:'Archivo','Helvetica Neue',Arial,sans-serif;
    --dado:'Space Mono','SFMono-Regular',Consolas,monospace;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; background:var(--papel); color:var(--tinta);
    font-family:var(--corpo); font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:var(--corpo); font-size:0.9rem; }
  *:focus-visible{ outline:2.5px solid var(--roxo); outline-offset:2px; border-radius:3px; }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *,*::before,*::after{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }

  /* ---------- vocabulário tipográfico ---------- */
  .rot{
    font-family:var(--dado); font-size:0.58rem; letter-spacing:0.16em;
    text-transform:uppercase; color:var(--fraco); margin:0;
  }
  /* A laranja da marca sobre branco dá 3,06:1 — abaixo do mínimo pra texto.
     Estes rótulos são pequenos, maiúsculos e espaçados: usam a versão forte,
     como a página do cliente já fazia. */
  .rot.laranja{ color:var(--laranja-forte); }
  .cifra{
    font-family:var(--display); font-weight:700; letter-spacing:-0.035em;
    font-size:2.4rem; line-height:0.92; font-variant-numeric:tabular-nums;
  }
  .cifra em{ font-style:normal; font-size:0.46em; color:var(--fraco); letter-spacing:-0.01em; }
  .cifra u{ text-decoration:none; color:var(--laranja); }

  /* ---------- topo ---------- */
  .linkbtn{ background:none; border:none; color:var(--laranja-forte); font-size:0.72rem; font-family:var(--dado); padding:0; text-decoration:underline; }

  .menu-btn{
    display:none; background:none; border:1px solid var(--linha); border-radius:8px;
    padding:7px 12px; font-family:var(--display); font-weight:600; font-size:0.78rem; color:var(--tinta);
  }

  /* ---------- moldura ---------- */
  .shell{ display:grid; grid-template-columns:262px minmax(0,1fr); gap:20px; padding:20px; align-items:start; max-width:1420px; margin:0 auto; }

  /* ---------- lateral ---------- */
  .side{
    background:var(--sup); border-radius:var(--r); box-shadow:var(--s1); padding:14px 0 16px;
    position:sticky; top:80px;
  }
  .side h4{
    font-family:var(--dado); font-size:0.56rem; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--fraco); margin:18px 18px 6px; display:flex; justify-content:space-between; align-items:center; font-weight:400;
  }
  .side h4:first-child{ margin-top:2px; }
  .pill{ background:var(--laranja-forte); color:#fff; font-size:0.6rem; padding:1px 7px; border-radius:100px; font-family:var(--dado); }
  .navitem{
    display:block; width:calc(100% - 20px); margin:2px 10px; text-align:left; background:none; border:none;
    padding:9px 12px; border-radius:9px; font-size:0.92rem; line-height:1.3; color:inherit;
    transition:background .14s ease;
  }
  .navitem:hover{ background:var(--sup2); }
  .navitem.active{ background:var(--laranja-fraco); }
  .navitem b{ display:block; font-weight:600; }
  .navitem.active b{ color:var(--laranja-forte); }
  .navitem .sub{ display:block; font-size:0.72rem; color:var(--fraco); margin-top:1px; }
  .side .act{ margin:14px 10px 0; }

  /* ---------- área de conteúdo ---------- */
  main{ min-width:0; display:grid; grid-template-columns:minmax(0,1fr); gap:18px; align-content:start; }
  .bloco{ background:var(--sup); border-radius:var(--r); box-shadow:var(--s1); padding:24px 26px; }
  .bloco.alto{ box-shadow:var(--s2); }
  .bloco.escuro{ background:linear-gradient(135deg,#211E1A,#0F0D0B); color:#F7F4EF; box-shadow:var(--s2); }
  .bloco.escuro .rot{ color:#FF8A3C; }
  .bloco.escuro .muted{ color:#B3ADA5; }

  h1.page{ font-family:var(--display); font-size:2rem; margin:6px 0 0; letter-spacing:-0.03em; line-height:1.05; text-wrap:balance; }
  h1.page.capa{ text-transform:uppercase; font-size:clamp(1.8rem,4vw,2.7rem); letter-spacing:-0.04em; }
  .muted{ color:var(--fraco); font-size:0.9rem; }
  .intro{ color:var(--fraco); font-size:0.9rem; margin:6px 0 0; max-width:64ch; }

  /* ---------- capa da ficha: contraste de escala ---------- */
  .capa-fila{ display:flex; gap:34px; flex-wrap:wrap; margin-top:22px; padding-top:20px; border-top:1px solid var(--linha2); }
  .capa-fila > div p{ margin:8px 0 0; }
  .selo{
    display:inline-flex; align-items:center; gap:6px; font-size:0.75rem; font-weight:600;
    padding:5px 12px; border-radius:100px; background:var(--nt-f); color:var(--nt); white-space:nowrap;
  }
  .selo.on{ background:var(--ok-f); color:var(--ok); }
  .selo.aviso{ background:var(--es-f); color:var(--es); }
  .selo select{ background:none; border:none; font-size:0.75rem; font-weight:600; color:inherit; padding:0; }

  /* ---------- termômetro ---------- */
  .termo-topo{ display:flex; justify-content:space-between; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .trilha{ height:8px; background:var(--linha2); border-radius:100px; margin:16px 0 20px; overflow:hidden; }
  .trilha i{ display:block; height:100%; border-radius:100px; background:linear-gradient(90deg,#FF8A3C,var(--laranja)); transition:width .45s cubic-bezier(.2,.7,.3,1); }
  .etapas{ display:grid; grid-template-columns:repeat(6,1fr); gap:10px; }
  @media (max-width:1180px){ .etapas{ grid-template-columns:repeat(3,1fr); } }
  @media (max-width:520px){ .etapas{ grid-template-columns:repeat(2,1fr); } }
  .etapa{
    background:var(--sup2); border:1px solid var(--linha); border-radius:11px; padding:12px 13px 13px;
    text-align:left; color:inherit; transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
  }
  .etapa:hover{ background:var(--sup); box-shadow:var(--s1); transform:translateY(-2px); }
  .etapa .cab{ display:flex; align-items:center; gap:6px; }
  .etapa .bola{ width:11px; height:11px; border-radius:50%; border:2px solid var(--linha); flex:0 0 auto; }
  .etapa.feito .bola{ background:#2E9E63; border-color:#2E9E63; }
  .etapa.meio .bola{ background:linear-gradient(90deg,#D89A2A 50%,#fff 50%); border-color:#D89A2A; }
  .etapa .cab em{ font-style:normal; font-family:var(--dado); font-size:0.55rem; letter-spacing:0.14em; color:var(--fraco); }
  .etapa .n{ font-family:var(--display); font-weight:700; font-size:1.55rem; letter-spacing:-0.035em; line-height:1; margin:9px 0 2px; font-variant-numeric:tabular-nums; }
  .etapa.falta .n{ color:#8F877E; }
  .etapa .q{ display:block; font-family:var(--dado); font-size:0.55rem; letter-spacing:0.11em; text-transform:uppercase; color:var(--fraco); }

  /* ---------- abas ---------- */
  .abas-caixa{ position:sticky; top:60px; z-index:30; background:var(--papel); padding:8px 0 2px; margin:-8px 0 -2px; }
  .abas{ display:flex; gap:5px; overflow-x:auto; scrollbar-width:none; padding:2px; }
  .abas::-webkit-scrollbar{ display:none; }
  .tab{
    display:flex; align-items:center; gap:8px; white-space:nowrap; flex:0 0 auto;
    background:var(--sup); border:1px solid var(--linha); border-radius:100px; padding:8px 15px;
    font-family:var(--display); font-weight:600; font-size:0.83rem; color:var(--fraco);
    transition:background .14s ease, color .14s ease, border-color .14s ease;
  }
  .tab:hover{ background:var(--sup2); color:var(--tinta); }
  .tab[aria-selected="true"]{ background:var(--tinta); border-color:var(--tinta); color:#fff; box-shadow:var(--s1); }
  .tab .ponto{ width:7px; height:7px; border-radius:50%; background:var(--linha); flex:0 0 auto; }
  .tab .ponto.cheio{ background:#2E9E63; }
  .tab .ponto.meio{ background:#D89A2A; }
  .tab .ponto.alerta{ background:#C0392B; }
  .tab[aria-selected="true"] .ponto{ box-shadow:0 0 0 2px rgba(255,255,255,.25); }

  /* ---------- volta contextual ---------- */
  .voltar{
    display:inline-flex; align-items:center; gap:7px; background:var(--laranja-fraco); border:none;
    border-radius:100px; padding:6px 14px 6px 11px; color:var(--laranja-forte);
    font-family:var(--dado); font-size:0.66rem; letter-spacing:0.08em; text-transform:uppercase;
  }
  .voltar:hover{ background:#FFE3D2; }

  /* ---------- seções numeradas dentro da aba ---------- */
  .sec{ display:grid; grid-template-columns:44px minmax(0,1fr); gap:0 18px; }
  @media (max-width:640px){ .sec{ grid-template-columns:minmax(0,1fr); gap:10px; } .sec .num{ display:none; } }
  .sec .num{ font-family:var(--display); font-weight:700; font-size:1.15rem; color:var(--laranja-forte); letter-spacing:-0.02em; line-height:1.2; }
  .sec h3{ font-family:var(--display); font-size:1.12rem; margin:0 0 4px; letter-spacing:-0.015em; }
  .sec .quando{
    display:block; margin-top:8px; font-family:var(--dado); font-size:0.58rem;
    letter-spacing:0.1em; text-transform:uppercase; color:var(--tinta);
  }

  /* ---------- placares ---------- */
  .placares{ display:flex; gap:10px; flex-wrap:wrap; margin:24px 0 22px; }
  .placares .p{ background:var(--sup2); border:1px solid var(--linha); border-radius:11px; padding:13px 16px; min-width:112px; }
  .placares .p b{ display:block; font-family:var(--display); font-size:1.7rem; font-weight:700; letter-spacing:-0.035em; line-height:1; font-variant-numeric:tabular-nums; }
  .placares .p span{ font-family:var(--dado); font-size:0.55rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--fraco); }
  .placares .p.destaca{ background:var(--sup); box-shadow:var(--s1); border-color:transparent; }
  .minibarra{ height:4px; border-radius:100px; background:var(--linha2); margin-top:9px; }
  .minibarra i{ display:block; height:100%; border-radius:100px; background:#2E9E63; }

  /* ---------- estados ---------- */
  .chip{
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
    font-size:0.76rem; font-weight:600; padding:4px 11px; border-radius:100px;
    border:1px solid transparent; line-height:1.3;
  }
  .chip::before{ content:''; width:6px; height:6px; border-radius:50%; background:currentColor; flex:0 0 auto; }
  .chip.ok{ background:var(--ok-f); color:var(--ok); border-color:var(--ok-b); }
  .chip.alerta{ background:var(--al-f); color:var(--al); border-color:var(--al-b); }
  .chip.espera{ background:var(--es-f); color:var(--es); border-color:var(--es-b); }
  .chip.andamento{ background:var(--an-f); color:var(--an); border-color:var(--an-b); }
  .chip.neutro{ background:var(--nt-f); color:var(--nt); border-color:var(--nt-b); }
  .chip.roxo{ background:var(--roxo-fraco); color:#6A00C7; border-color:#E3D0F8; }

  /* ---------- tabelas ---------- */
  table{ width:100%; border-collapse:separate; border-spacing:0; font-size:0.89rem; }
  th{
    text-align:left; font-family:var(--dado); font-size:0.55rem; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--fraco); padding:0 14px 10px 0; font-weight:400; white-space:nowrap;
  }
  td{ padding:14px 14px 14px 0; border-top:1px solid var(--linha2); vertical-align:top; line-height:1.45; }
  td .forte{ font-weight:600; }
  .wrap{ overflow-x:auto; }

  /* ---------- botões ---------- */
  .btn{
    font-family:var(--display); font-weight:700; font-size:0.82rem;
    padding:10px 17px; border-radius:100px; border:1.5px solid var(--tinta);
    background:var(--tinta); color:#fff; transition:transform .12s ease, box-shadow .14s ease, background .14s ease;
  }
  .btn:hover{ background:var(--laranja-forte); border-color:var(--laranja-forte); box-shadow:var(--s1); transform:translateY(-1px); }
  .btn.ghost{ background:transparent; color:var(--tinta); border-color:var(--linha); }
  .btn.ghost:hover{ background:var(--sup2); color:var(--tinta); border-color:var(--tinta); box-shadow:none; }
  .btn.small{ font-size:0.74rem; padding:7px 13px; }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; transform:none; }

  /* ---------- formulários ---------- */
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-family:var(--dado); font-size:0.58rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--fraco); margin-bottom:5px; }
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px; border:1px solid var(--linha); border-radius:9px; background:var(--sup2);
    transition:border-color .14s ease, background .14s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ background:var(--sup); border-color:var(--tinta); }
  .field textarea{ min-height:70px; resize:vertical; }
  .grid2{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:0 16px; }
  .grid3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0 16px; }
  @media (max-width:640px){ .grid2,.grid3{ grid-template-columns:minmax(0,1fr); } }
  .dica{ display:block; font-size:0.76rem; color:var(--fraco); line-height:1.4; margin-top:5px; }

  details > summary{
    list-style:none; cursor:pointer; display:inline-flex; align-items:center; gap:7px;
    font-family:var(--dado); font-size:0.64rem; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--fraco); background:var(--sup2); border:1px dashed var(--linha); border-radius:100px; padding:8px 15px;
  }
  details > summary::-webkit-details-marker{ display:none; }
  details > summary:hover{ color:var(--tinta); border-color:var(--tinta); }
  details[open] > summary{ background:var(--tinta); color:#fff; border-style:solid; border-color:var(--tinta); }
  .card{ background:var(--sup); border-radius:var(--r); box-shadow:var(--s1); padding:20px 22px; margin-bottom:16px; }
  /* Fábrica (Visão Bora): cada pedido na fila; o que precisa da equipe ganha a borda de alerta. */
  .card.fab{ margin:14px 0 0; box-shadow:none; border:1px solid var(--linha); }
  .card.fab.precisa{ border-color:var(--al-b); }
  .fab-topo{ display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap; }
  .fab-tit{ font-family:var(--display); font-weight:600; font-size:1rem; overflow-wrap:anywhere; }
  .fab-linha{ margin:8px 0 0; font-size:0.84rem; }
  .fab-motivos{ margin:6px 0 0; padding-left:20px; font-size:0.86rem; display:grid; gap:4px; overflow-wrap:anywhere; }
  .fab-acoes{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .fab-arquivos{ display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
  .fab-custos td, .fab-custos th{ text-align:left; }
  .fab-sinal{ margin:14px 0 0; padding:9px 13px; border-radius:10px; font-size:0.86rem; display:inline-flex; gap:8px; align-items:center; }
  .fab-sinal::before{ content:""; width:8px; height:8px; border-radius:50%; background:currentColor; flex-shrink:0; }
  .fab-sinal.ligada{ background:var(--ok-f); color:var(--ok); }
  .fab-sinal.desligada{ background:var(--al-f); color:var(--al); }
  .fab-sinal.conferindo{ background:var(--sup2); color:var(--fraco); }
  /* Criar: a lista de peças, o pedido e a edição à mão. */
  .cr-lista{ display:grid; gap:8px; }
  .cr-linha{ display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--sup); border:1px solid var(--linha); border-radius:12px; padding:10px 14px; color:var(--tinta); font:inherit; cursor:pointer; }
  .cr-linha:hover{ border-color:var(--tinta); }
  .cr-linha.precisa{ border-color:var(--al-b); }
  .cr-mini{ width:48px; height:60px; border-radius:7px; object-fit:cover; background:var(--sup2); border:1px solid var(--linha); flex-shrink:0; display:block; }
  .cr-txt{ display:grid; gap:2px; min-width:0; flex:1; }
  .cr-txt b{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cr-txt .muted{ font-size:0.8rem; }
  .cr-campo{ display:grid; gap:7px; margin-bottom:18px; max-width:760px; }
  .cr-campo > label{ font-weight:600; font-size:0.9rem; }
  .cr-campo select, .cr-campo textarea, .cr-campo input[type=date]{ max-width:520px; }
  .cr-tipos{ display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:8px; }
  .cr-tipo{ display:grid; gap:3px; text-align:left; padding:12px 14px; border:1px solid var(--linha); border-radius:12px; background:var(--sup); color:var(--tinta); font:inherit; cursor:pointer; }
  .cr-tipo span{ font-size:0.78rem; color:var(--fraco); }
  .cr-tipo[aria-pressed="true"]{ border-color:var(--laranja-forte); box-shadow:0 0 0 1px var(--laranja-forte) inset; }
  .cr-acoes{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .lote-lista{ display:grid; gap:8px; margin-bottom:18px; max-width:760px; }
  .lote-linha{ display:flex; align-items:center; gap:12px; background:var(--sup); border:1px solid var(--linha); border-radius:12px; padding:10px 14px; }
  .lote-linha input[type=checkbox]{ width:18px; height:18px; flex:none; }
  .lote-tema{ flex:1; min-width:0; }
  .lote-linha select{ width:auto; flex:none; }
  .lote-linha.feito .lote-tema{ color:var(--cinza); }
  .lote-falhas{ margin-bottom:18px; max-width:760px; }
  .tr-form{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:10px 0 4px; max-width:760px; }
  .tr-form input[type=text]{ flex:1 1 200px; min-width:0; width:auto; }
  .tr-escolhido{ flex:1 1 100%; font-size:0.84rem; color:var(--fraco); }
  .tr-player{ height:32px; max-width:240px; }
  .el-mini{ width:44px; height:44px; flex:none; object-fit:contain; border-radius:8px; border:1px solid var(--linha);
    background:repeating-conic-gradient(var(--linha) 0 25%, var(--sup) 0 50%) 0 0 / 12px 12px; }
  @media (max-width:560px){ .lote-linha{ flex-wrap:wrap; } .lote-linha select{ width:100%; } }
  .cr-briefing{ margin:12px 0 0; font-style:italic; color:var(--fraco); max-width:70ch; }
  .cr-etapa{ font-family:var(--display); font-weight:600; font-size:1.05rem; margin:0 0 10px; }
  .cr-imagens{ display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; }
  .cr-imagens img{ height:360px; width:auto; border-radius:10px; border:1px solid var(--linha); flex-shrink:0; }
  .cr-imagens.antiga, .cr-video.antiga{ opacity:.55; }
  .cr-video{ display:block; height:min(62vh, 560px); aspect-ratio:9/16; background:#000; border-radius:12px; margin-top:12px; }
  .cr-opcoes{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:10px; }
  .cr-opcao{ display:grid; gap:6px; padding:0; border:2px solid transparent; border-radius:12px; background:none; text-align:left; font:inherit; color:var(--tinta); cursor:pointer; }
  .cr-opcao img{ width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:10px; }
  .cr-opcao[aria-pressed="true"]{ border-color:var(--laranja-forte); }
  .cr-legenda{ white-space:pre-wrap; line-height:1.55; max-width:70ch; }
  .cr-ajuste, .cr-edicao, .cr-aprovado{ display:grid; gap:10px; margin-top:14px; justify-items:start; max-width:760px; }
  .cr-ajuste textarea{ width:100%; }
  .cr-passo{ margin:0; max-width:70ch; }
  .cr-historico{ list-style:none; margin:8px 0 0; padding:0; display:grid; gap:6px; font-size:0.86rem; }
  .cr-historico li{ display:flex; gap:12px; }
  .cr-historico li.erro{ color:var(--al); background:none; border:none; padding:0; }
  .cr-historico time{ color:var(--fraco); font-variant-numeric:tabular-nums; flex-shrink:0; }
  .aviso-falhou{ border:1px solid var(--al-b); }
  .barra[role="progressbar"]{ height:10px; border-radius:10px; background:var(--linha); overflow:hidden; max-width:520px; }
  .barra[role="progressbar"] i{ display:block; height:100%; background:var(--laranja); border-radius:10px; transition:width .5s ease; }
  .card.flat{ background:var(--sup2); box-shadow:none; border:1px solid var(--linha); }

  /* ---------- respostas do formulário ---------- */
  .qa{ margin-bottom:18px; padding-left:15px; border-left:2px solid var(--laranja); }
  .qa.vazia{ border-left-color:var(--linha); }
  .qa .q{ font-size:0.78rem; color:var(--fraco); margin-bottom:3px; line-height:1.35; }
  .qa .a{ font-size:0.97rem; white-space:pre-wrap; line-height:1.5; }
  .qa.vazia .a{ color:var(--fraco); font-style:italic; }
  .secname{
    font-family:var(--dado); font-size:0.58rem; letter-spacing:0.15em; text-transform:uppercase;
    color:var(--laranja-forte); border-bottom:1px solid var(--linha); padding-bottom:7px; margin:30px 0 16px;
  }
  .secname:first-child{ margin-top:0; }

  /* ---------- agora ---------- */
  .pend{
    display:block; width:100%; text-align:left; background:var(--sup); border:1px solid var(--linha);
    border-left:4px solid var(--linha); border-radius:11px; padding:13px 16px; margin-bottom:9px; line-height:1.4;
    color:inherit; transition:transform .14s ease, box-shadow .14s ease;
  }
  .pend:hover{ box-shadow:var(--s1); transform:translateX(3px); }
  .pend.alta{ border-left-color:var(--laranja); }
  .pend.media{ border-left-color:var(--roxo); }
  .pend.baixa{ border-left-color:var(--linha); }
  .pend .quem{ font-family:var(--dado); font-size:0.56rem; letter-spacing:0.13em; text-transform:uppercase; color:var(--fraco); }
  .pend .oq{ font-size:0.97rem; font-weight:600; margin-top:3px; }
  .pend .porq{ font-size:0.84rem; color:var(--fraco); margin-top:3px; }
  .placar{ display:flex; gap:10px; flex-wrap:wrap; margin:20px 0 8px; }
  .placar .n{ background:var(--sup2); border:1px solid var(--linha); border-radius:11px; padding:12px 16px; min-width:106px; }
  .placar .n b{ font-family:var(--display); font-size:1.7rem; font-weight:700; display:block; line-height:1; letter-spacing:-0.035em; }
  .placar .n span{ font-family:var(--dado); font-size:0.55rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--fraco); }
  .placar .n.alta{ background:var(--laranja-fraco); border-color:#FFD9C2; }
  .placar .n.media{ background:var(--roxo-fraco); border-color:#E3D0F8; }

  /* ---------- explicação da aba ---------- */
  .expl{ margin:0 0 4px; }
  .expl p{ margin:0; font-size:0.87rem; color:var(--fraco); line-height:1.5; max-width:66ch; }

  /* ---------- diversos ---------- */
  .vazio{ padding:30px 24px; text-align:center; color:var(--fraco); font-size:0.9rem; border:1px dashed var(--linha); border-radius:11px; background:var(--sup2); }
  .vazio strong{ display:block; font-family:var(--display); color:var(--tinta); font-size:1rem; margin-bottom:5px; }
  .erro{ background:var(--al-f); border:1px solid var(--al-b); border-radius:10px; padding:12px 15px; font-size:0.86rem; color:var(--al); }
  .login{ max-width:400px; margin:9vh auto; background:var(--sup); border-radius:18px; box-shadow:var(--s2); padding:34px; }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%,16px);
    background:var(--tinta); color:#fff; padding:12px 22px; border-radius:100px;
    font-family:var(--display); font-weight:700; font-size:0.85rem; box-shadow:var(--s2);
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  /* ---------- transição de conteúdo ---------- */
  @keyframes sobe{ from{ opacity:0; transform:translateY(7px); } to{ opacity:1; transform:none; } }
  .entra{ animation:sobe .26s cubic-bezier(.2,.7,.3,1) both; }

  /* ---------- busca na lateral ---------- */
  .busca{ margin:2px 10px 8px; position:relative; }
  .busca input{
    width:100%; padding:8px 12px 8px 30px; border:1px solid var(--linha); border-radius:9px;
    background:var(--sup2); font-size:0.86rem;
  }
  .busca input:focus{ background:var(--sup); border-color:var(--tinta); }
  .busca::before{
    content:''; position:absolute; left:11px; top:50%; margin-top:-5px;
    width:9px; height:9px; border:1.5px solid var(--fraco); border-radius:50%;
  }
  .busca::after{
    content:''; position:absolute; left:19px; top:50%; margin-top:3px;
    width:5px; height:1.5px; background:var(--fraco); transform:rotate(45deg);
  }

  /* ---------- funil ---------- */
  .funil{ display:grid; grid-auto-flow:column; grid-auto-columns:266px; gap:12px; overflow-x:auto; padding:2px 2px 12px; }
  .coluna{ background:var(--sup2); border:1px solid var(--linha); border-radius:var(--r); display:flex; flex-direction:column; min-height:180px; }
  .coluna.alvo{ border-color:var(--laranja); background:var(--laranja-fraco); }
  .coluna > .cab{
    display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    padding:13px 14px 10px; border-bottom:1px solid var(--linha);
  }
  .coluna .titulo{ font-family:var(--display); font-weight:700; font-size:0.86rem; }
  .coluna .conta{ font-family:var(--dado); font-size:0.6rem; letter-spacing:0.1em; color:var(--fraco); }
  .coluna .soma{ font-family:var(--dado); font-size:0.58rem; letter-spacing:0.08em; color:var(--fraco); padding:0 14px 10px; }
  .coluna .pilha{ padding:10px; display:grid; gap:8px; flex:1 1 auto; align-content:start; }
  .coluna .novo{
    margin:0 10px 12px; background:none; border:1px dashed var(--linha); border-radius:9px; color:var(--fraco);
    font-family:var(--dado); font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase; padding:8px;
  }
  .coluna .novo:hover{ border-color:var(--tinta); color:var(--tinta); }

  .lead{
    background:var(--sup); border:1px solid var(--linha); border-radius:10px; padding:11px 12px;
    box-shadow:var(--s1); cursor:grab; text-align:left; width:100%; color:inherit; display:block;
    transition:transform .12s ease, box-shadow .14s ease;
  }
  .lead:hover{ transform:translateY(-1px); box-shadow:var(--s2); }
  .lead:active{ cursor:grabbing; }
  .lead.arrastando{ opacity:.4; }
  .lead .nome{ font-weight:600; font-size:0.9rem; line-height:1.3; }
  .lead .linha{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:7px; }
  .lead .mini{ font-family:var(--dado); font-size:0.56rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--fraco); }
  .lead .acao{ font-size:0.78rem; color:var(--fraco); margin-top:6px; line-height:1.35; }
  .lead .acao b{ color:var(--tinta); font-weight:600; }
  .lead .valor{ font-family:var(--display); font-weight:700; font-size:0.86rem; }
  .lead .setas{ display:flex; gap:4px; margin-top:9px; }
  .lead .setas button{
    background:var(--sup2); border:1px solid var(--linha); border-radius:6px; width:24px; height:22px;
    font-size:0.7rem; line-height:1; color:var(--fraco); padding:0;
  }
  .lead .setas button:hover{ border-color:var(--tinta); color:var(--tinta); }
  .lead .setas button[disabled]{ opacity:.3; cursor:not-allowed; }

  /* ---------- planilha ---------- */
  .planilha{ overflow-x:auto; border:1px solid var(--linha); border-radius:11px; background:var(--sup); }
  .planilha table{ font-size:0.86rem; }
  .planilha th{
    padding:11px 12px; border-bottom:1px solid var(--linha); background:var(--sup2);
    position:sticky; top:0; z-index:2;
  }
  .planilha th button{
    background:none; border:none; padding:0; font:inherit; color:inherit; letter-spacing:inherit;
    text-transform:inherit; display:inline-flex; gap:5px; align-items:center;
  }
  .planilha th button:hover{ color:var(--tinta); }
  .planilha th .ord{ color:var(--laranja); }
  .planilha td{ padding:0; border-top:1px solid var(--linha2); border-bottom:none; }
  .planilha tbody tr:hover td{ background:var(--sup2); }
  .cel{
    width:100%; border:none; background:none; padding:11px 12px; font:inherit; color:inherit;
    min-width:110px; border-radius:0;
  }
  .cel:focus{ background:var(--laranja-fraco); outline:2px solid var(--laranja); outline-offset:-2px; }
  select.cel{ min-width:132px; }
  .planilha .num{ text-align:right; font-variant-numeric:tabular-nums; }
  .planilha .apagar{
    background:none; border:none; color:var(--fraco); font-size:0.95rem; padding:8px 10px; line-height:1;
  }
  .planilha .apagar:hover{ color:var(--al); }
  .ferramentas{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:0 0 16px; }
  .ferramentas input[type="search"]{
    padding:8px 12px; border:1px solid var(--linha); border-radius:100px; background:var(--sup2); min-width:200px;
  }
  .ferramentas input[type="search"]:focus{ background:var(--sup); border-color:var(--tinta); }
  .colar textarea{
    width:100%; min-height:110px; padding:11px; border:1px solid var(--linha); border-radius:10px;
    background:var(--sup2); font-family:var(--dado); font-size:0.76rem; resize:vertical;
  }

  /* ---------- agenda ---------- */
  .mes{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .mes .nome{ font-family:var(--display); font-weight:700; font-size:1.15rem; }
  .mes .setas{ display:flex; gap:6px; }
  .mes .setas button{
    background:var(--sup2); border:1px solid var(--linha); border-radius:8px; width:32px; height:30px;
    color:var(--fraco); font-size:0.85rem; line-height:1;
  }
  .mes .setas button:hover{ border-color:var(--tinta); color:var(--tinta); }
  .mes .setas button.hoje{ width:auto; padding:0 12px; font-family:var(--display); font-weight:600; font-size:0.76rem; }

  .semana{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; margin-bottom:6px; }
  .semana span{
    font-family:var(--dado); font-size:0.55rem; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--fraco); text-align:center; padding:2px 0;
  }
  .grade{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; }
  .dia{
    background:var(--sup2); border:1px solid var(--linha); border-radius:10px; padding:7px 7px 8px;
    min-height:96px; display:flex; flex-direction:column; gap:5px; text-align:left; color:inherit;
    transition:border-color .14s ease, background .14s ease;
  }
  .dia.fora{ opacity:.62; }
  .dia.hoje{ border-color:var(--laranja); border-width:2px; background:var(--laranja-fraco); }
  .dia.alvo{ border-color:var(--laranja); background:var(--laranja-fraco); }
  .dia .n{
    font-family:var(--display); font-weight:700; font-size:0.9rem; line-height:1;
    display:flex; justify-content:space-between; align-items:center;
  }
  .dia .n em{ font-style:normal; font-family:var(--dado); font-size:0.55rem; color:var(--fraco); }
  .dia.hoje .n{ color:var(--laranja-forte); }
  .tar{
    display:flex; gap:5px; align-items:flex-start; background:var(--sup); border:1px solid var(--linha);
    border-left:3px solid var(--fraco); border-radius:6px; padding:4px 6px; cursor:grab;
    font-size:0.72rem; line-height:1.25; text-align:left; width:100%; color:inherit;
  }
  .tar:hover{ border-color:var(--tinta); }
  .tar.arrastando{ opacity:.4; }
  .tar.pendente{ border-left-color:#D89A2A; }
  .tar.fazendo{ border-left-color:#1B4F8F; }
  .tar.concluido{ border-left-color:#2E9E63; }
  .tar.concluido .t{ text-decoration:line-through; color:var(--fraco); }
  .tar.cancelado{ border-left-color:var(--linha); opacity:.55; }
  .tar.cancelado .t{ text-decoration:line-through; }
  .tar .t{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ini{
    flex:0 0 auto; width:17px; height:17px; border-radius:50%; background:var(--nt-f); color:var(--nt);
    font-family:var(--dado); font-size:0.52rem; font-weight:700; display:inline-flex; align-items:center;
    justify-content:center; letter-spacing:0;
  }
  .ini.a{ background:#E7EEF8; color:#1B4F8F; }
  .ini.b{ background:#F2E8FF; color:#6A00C7; }
  .dia .mais{ font-family:var(--dado); font-size:0.55rem; color:var(--fraco); }

  .visao{ display:flex; gap:4px; background:var(--sup2); border:1px solid var(--linha); border-radius:100px; padding:3px; width:fit-content; }
  .visao button{
    background:none; border:none; border-radius:100px; padding:6px 14px; color:var(--fraco);
    font-family:var(--display); font-weight:600; font-size:0.78rem;
  }
  .visao button[aria-selected="true"]{ background:var(--tinta); color:#fff; }

  .dia-lista{ border-top:1px solid var(--linha2); padding:14px 0; }
  .dia-lista:first-child{ border-top:none; padding-top:0; }
  .dia-lista .cab{
    display:flex; gap:10px; align-items:baseline; margin-bottom:9px;
    font-family:var(--dado); font-size:0.6rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--fraco);
  }
  .dia-lista .cab b{ font-family:var(--display); font-size:0.95rem; letter-spacing:0; text-transform:none; color:var(--tinta); }
  .dia-lista.e-hoje .cab b{ color:var(--laranja-forte); }
  .linha-tar{
    display:flex; gap:11px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--linha2);
  }
  .linha-tar:first-of-type{ border-top:none; }
  .linha-tar .marca{
    flex:0 0 auto; width:19px; height:19px; border-radius:6px; border:2px solid var(--linha);
    background:var(--sup); margin-top:2px; padding:0; line-height:1; font-size:0.7rem; color:#fff;
  }
  .linha-tar .marca.concluido, .passo .marca.concluido{ background:#1F7A4B; border-color:#1F7A4B; }
  .linha-tar .marca.fazendo{ background:#1B4F8F; border-color:#1B4F8F; }
  .linha-tar .corpo{ flex:1 1 auto; min-width:0; }
  .linha-tar .tit{ font-weight:600; font-size:0.94rem; line-height:1.3; }
  .linha-tar.concluido .tit{ text-decoration:line-through; color:var(--fraco); }
  .linha-tar .sub{ font-size:0.8rem; color:var(--fraco); margin-top:2px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

  /* O cartão do mês passou a mostrar hora e passos, e o quadradinho da esquerda
     virou botão. Cor continua sendo do estado — prioridade alta é a moldura,
     não uma cor nova, senão a grade vira semáforo e ninguém lê nada. */
  .tar .h{ font-family:var(--dado); font-size:0.58rem; color:var(--fraco); flex:0 0 auto; padding-top:1px; }
  .tar .ps{ font-family:var(--dado); font-size:0.54rem; color:var(--fraco); flex:0 0 auto; padding-top:1px; }
  /* Na grade do mês a célula tem ~140px: iniciais + hora + contador de passos
     não deixam nada pro título. O contador fica só na lista e no rótulo do
     cartão, onde há espaço. */
  .grade .tar .ps{ display:none; }
  .tar.urgente{ border-color:var(--al); }
  .tar button.ini{ border:none; padding:0; cursor:pointer; }
  .tar button.ini:hover{ outline:2px solid var(--tinta); outline-offset:1px; }
  .tar.auto{ border-style:dashed; border-left-color:var(--linha); background:none; cursor:pointer; }
  .ini.auto{ background:var(--an-f); color:var(--an); }
  .barra-agenda{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px; }
  .filtro-tipo{
    background:var(--sup2); border:1px solid var(--linha); border-radius:100px; padding:8px 14px;
    font-family:var(--display); font-weight:600; font-size:0.78rem; color:var(--tinta);
  }
  .linha-tar .tit .h{ font-family:var(--dado); font-size:0.78rem; color:var(--fraco); margin-right:8px; }
  .linha-tar button.corpo{ background:none; border:none; padding:0; text-align:left; color:inherit; font:inherit; }
  .linha-tar.urgente .tit{ box-shadow:inset 2px 0 0 var(--al); padding-left:8px; margin-left:-8px; }
  button.linha-tar{
    width:100%; background:none; border:none; border-top:1px solid var(--linha2);
    text-align:left; color:inherit; font:inherit; padding:9px 0;
  }
  .linha-tar .marca.auto{
    display:inline-flex; align-items:center; justify-content:center; background:var(--an-f);
    color:var(--an); border-color:var(--an-b); font-family:var(--dado); font-size:0.62rem;
  }
  .linha-tar.auto .tit{ font-weight:500; }

  /* ---------- painel da tarefa ---------- */
  /* Gaveta, e não caixa no meio da tela: com o painel na lateral o dia que você
     estava olhando continua à vista enquanto você mexe na tarefa. */
  .painel-fundo{ position:fixed; inset:0; z-index:60; background:rgba(26,24,21,.34); }
  .painel{
    position:fixed; z-index:61; top:0; right:0; bottom:0; width:min(460px,100%);
    background:var(--sup); border-left:1px solid var(--linha); box-shadow:var(--s2);
    display:flex; flex-direction:column;
  }
  @media (prefers-reduced-motion:no-preference){
    .painel{ animation:entraPainel .2s cubic-bezier(.2,.7,.3,1); }
  }
  @keyframes entraPainel{ from{ transform:translateX(26px); opacity:0; } to{ transform:none; opacity:1; } }
  body.travado{ overflow:hidden; }
  .painel .cab{ display:flex; gap:12px; align-items:flex-start; padding:20px 22px 16px; border-bottom:1px solid var(--linha2); }
  .painel .cab .quando{ margin:6px 0 0; font-size:0.92rem; font-weight:600; font-family:var(--display); }
  .painel .cab .fechar{
    margin-left:auto; flex:0 0 auto; width:30px; height:30px; border-radius:50%;
    background:none; border:1px solid var(--linha); color:var(--fraco); font-size:1rem; line-height:1;
  }
  .painel .cab .fechar:hover{ border-color:var(--tinta); color:var(--tinta); }
  .painel .corpo{ flex:1 1 auto; overflow-y:auto; padding:2px 22px 20px; }
  .painel .secao{ padding:16px 0; border-top:1px solid var(--linha2); }
  .painel .secao:first-child{ border-top:none; }
  .painel .pe{
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    padding:13px 22px; border-top:1px solid var(--linha); background:var(--sup2);
  }
  .campo-p{ display:grid; grid-template-columns:92px minmax(0,1fr); gap:10px; align-items:center; margin-top:10px; }
  .campo-p > span:first-child{
    font-family:var(--dado); font-size:0.58rem; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--fraco);
  }
  .campo-p input, .campo-p select, .painel textarea, .tr-form input[type=text]{
    width:100%; background:var(--sup2); border:1px solid var(--linha); border-radius:9px;
    padding:9px 11px; font-family:var(--corpo); font-size:0.9rem; color:var(--tinta);
  }
  .campo-p input:focus, .campo-p select:focus, .painel textarea:focus, .tr-form input[type=text]:focus{ border-color:var(--laranja); background:var(--sup); }
  .painel textarea{ margin-top:6px; resize:vertical; line-height:1.5; }
  .titulo-p{ font-family:var(--display) !important; font-weight:600 !important; font-size:1rem !important; }
  .duplo{ display:flex; gap:8px; align-items:center; }
  .duplo .ate{ font-size:0.76rem; color:var(--fraco); flex:0 0 auto; }
  /* Nome próprio: .chip já é o selo de estado do resto da Central, e reusar a
     classe repintaria todos eles. Foi assim que .num quebrou a tabela antes. */
  .chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip-p{
    background:var(--sup2); border:1px solid var(--linha); border-radius:100px; padding:6px 12px;
    font-family:var(--display); font-weight:600; font-size:0.76rem; color:var(--fraco);
  }
  .chip-p:hover{ border-color:var(--tinta); color:var(--tinta); }
  .chip-p[aria-pressed="true"]{ background:var(--laranja-forte); border-color:var(--laranja-forte); color:#fff; }
  .passos{ margin-top:8px; }
  .passo{ display:flex; gap:9px; align-items:center; padding:3px 0; }
  .passo .marca{
    flex:0 0 auto; width:19px; height:19px; border-radius:6px; border:2px solid var(--linha);
    background:var(--sup); padding:0; font-size:0.7rem; line-height:1; color:#fff;
  }
  .passo input{
    flex:1 1 auto; min-width:0; background:none; border:none; border-bottom:1px solid transparent;
    padding:5px 2px; font-family:var(--corpo); font-size:0.88rem; color:inherit;
  }
  .passo input:focus{ border-bottom-color:var(--laranja); }
  .passo.ok input{ text-decoration:line-through; color:var(--fraco); }
  .passo .x{ background:none; border:none; color:var(--fraco); flex:0 0 auto; }
  .passo .x:hover{ color:var(--al); }
  .novo-passo{
    width:100%; margin-top:9px; background:var(--sup2); border:1px dashed var(--linha);
    border-radius:9px; padding:9px 11px; font-family:var(--corpo); font-size:0.88rem; color:var(--tinta);
  }
  .campo-p .abrir{ grid-column:2; font-size:0.76rem; color:var(--laranja-forte); }
  .btn.perigo{ color:var(--al); border-color:var(--al-b); }
  .btn.perigo:hover{ background:var(--al); border-color:var(--al); color:#fff; }
  @media (max-width:620px){
    .painel{
      top:auto; left:0; right:0; bottom:0; width:auto; max-height:92vh;
      border-left:none; border-top:1px solid var(--linha); border-radius:18px 18px 0 0;
    }
    @media (prefers-reduced-motion:no-preference){
      .painel{ animation:sobePainel .22s cubic-bezier(.2,.7,.3,1); }
    }
    .campo-p{ grid-template-columns:minmax(0,1fr); gap:5px; align-items:start; }
    .campo-p .abrir{ grid-column:1; }
  }
  @keyframes sobePainel{ from{ transform:translateY(30px); opacity:0; } to{ transform:none; opacity:1; } }

  /* A grade do mês no celular. Sete colunas em 390px dão 40px por dia: cabe o
     número e mais nada. O cartão de texto sai e entram bolinhas — a carga da
     semana continua legível de longe —, e o toque leva pra lista do dia. */
  .pontos{ display:none; gap:3px; flex-wrap:wrap; margin-top:auto; }
  .pontos i{ width:6px; height:6px; border-radius:50%; background:var(--fraco); display:block; }
  .pontos i.pendente{ background:#D89A2A; }
  .pontos i.fazendo{ background:#1B4F8F; }
  .pontos i.concluido{ background:#2E9E63; }
  .pontos i.cancelado{ background:var(--linha); }
  .pontos i.auto{ background:none; border:1px dashed var(--fraco); }
  .dia-lista .cab .mais-dia{
    margin-left:auto; background:none; border:1px solid var(--linha); border-radius:50%;
    width:22px; height:22px; line-height:1; color:var(--fraco); font-size:0.85rem; flex:0 0 auto;
  }
  .dia-lista .cab .mais-dia:hover{ border-color:var(--laranja); color:var(--laranja-forte); }
  .dia-lista.focado{ box-shadow:inset 3px 0 0 var(--laranja); padding-left:12px; }
  @media (max-width:700px){
    .grade .tar, .dia .mais{ display:none; }
    .dia{ min-height:58px; cursor:pointer; }
    .pontos{ display:flex; }
  }

  /* ---------- economia ---------- */
  /* Barras horizontais de magnitude. Todas da mesma cor de propósito: a barra
     já diz o tamanho no comprimento, e pintar cada uma de um jeito gastaria o
     único canal livre repetindo o que o olho enxerga. Laranja forte, e não a
     laranja da marca, porque essa dá 2,9:1 no papel claro — abaixo do mínimo
     de 3:1 pra uma forma. */
  .barras{ display:grid; gap:9px; }
  .barra-l{ display:grid; grid-template-columns:minmax(120px,26%) minmax(0,1fr) auto; gap:12px; align-items:center; }
  .barra-l .rot-b{ font-size:0.84rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .barra-l .trilho{ height:9px; border-radius:100px; background:var(--linha2); overflow:hidden; }
  .barra-l .trilho i{ display:block; height:100%; border-radius:100px; background:var(--laranja-forte); }
  .barra-l .val-b{ font-family:var(--dado); font-size:0.72rem; color:var(--fraco); white-space:nowrap; }
  @media (max-width:560px){
    .barra-l{ grid-template-columns:minmax(0,1fr) auto; }
    .barra-l .trilho{ grid-column:1 / -1; }
  }

  /* Uma razão contra um limite. A marca do alvo é um traço no trilho; o estado
     vem escrito ao lado, porque cor sozinha não conta nada pra quem não a vê. */
  .medidor{ display:flex; gap:10px; align-items:center; min-width:180px; }
  .medidor .trilho{ position:relative; flex:1 1 auto; height:9px; border-radius:100px; background:var(--linha2); }
  .medidor .trilho i{ display:block; height:100%; border-radius:100px; background:var(--nt); }
  .medidor .trilho.ok i{ background:var(--ok); }
  .medidor .trilho.es i{ background:var(--es); }
  .medidor .trilho.al i{ background:var(--al); }
  .medidor .trilho u{
    position:absolute; top:-3px; width:2px; height:15px; background:var(--tinta);
    border-radius:2px; margin-left:-1px; opacity:.55;
  }
  .medidor .lab{ font-family:var(--dado); font-size:0.66rem; white-space:nowrap; }
  .medidor .lab.ok{ color:var(--ok); }
  .medidor .lab.es{ color:var(--es); }
  .medidor .lab.al{ color:var(--al); }

  .rolagem{ overflow-x:auto; }
  td.num-col{ font-family:var(--dado); font-size:0.86rem; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .titulo-bloco{ font-family:var(--display); font-size:1.2rem; margin:6px 0 0; letter-spacing:-0.015em; }
  .bloco.aviso-dado{ border-left:3px solid var(--es); background:var(--es-f); }
  .bloco.aviso-dado .intro{ color:var(--tinta); }
  .bloco.falta{ border-left:3px solid var(--laranja); }
  .corpo-expl{ padding:12px 0 2px; display:grid; gap:9px; }
  .corpo-expl p{ margin:0; font-size:0.87rem; color:var(--fraco); line-height:1.55; max-width:66ch; }
  .corpo-expl b{ color:var(--tinta); }
  /* Os campos de economia levam uma explicação junto — cabem em coluna larga,
     não na grade estreita das propriedades do cliente. */
  .props.economia{ grid-template-columns:repeat(auto-fill, minmax(min(400px,100%),1fr)); gap:4px 34px; }
  .prop.alto{ align-items:start; padding:14px 0; }
  .prop.alto > div:first-child{ flex:1 1 auto; min-width:0; }
  .prop.alto > div:first-child > span:first-child{
    font-family:var(--display); font-weight:600; font-size:0.9rem; letter-spacing:0;
    text-transform:none; color:var(--tinta);
  }
  .prop.alto .v{ flex:0 0 auto; width:150px; }
  .prop.alto input{ border-color:var(--linha); background:var(--sup2); text-align:right; }
  .tempo-lin{ margin-top:4px; }
  /* Campo de texto longo dentro do painel: o rótulo em cima, e não ao lado,
     porque um roteiro precisa da largura toda. */
  .campo-longo{ display:grid; gap:5px; margin-top:12px; }
  .campo-longo > span{
    font-family:var(--dado); font-size:0.58rem; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--fraco);
  }
  .campo-longo textarea{
    width:100%; background:var(--sup2); border:1px solid var(--linha); border-radius:9px;
    padding:10px 11px; font-family:var(--corpo); font-size:0.9rem; color:var(--tinta);
    line-height:1.55; resize:vertical;
  }
  .campo-longo textarea:focus{ border-color:var(--laranja); background:var(--sup); }
  .campo-dica{ margin:5px 0 0; }
  .campo-dica.grave{ color:var(--al); font-weight:600; }

  /* ---------- estúdio ---------- */
  /* Editor à esquerda, peça à direita, e a peça acompanha a digitação. Ver o
     slide mudando enquanto se escreve é o que evita exportar dez PNG pra
     descobrir que o título vazou. */
  .estudio{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,320px); gap:26px; margin-top:20px; }
  @media (max-width:900px){ .estudio{ grid-template-columns:minmax(0,1fr); } }
  .lado-previa{ position:sticky; top:76px; align-self:start; }
  .previa-cv{
    display:block; margin:0 auto; max-width:100%; height:auto; border-radius:10px;
    box-shadow:var(--s2); background:var(--sup2);
  }
  .topo-editor{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .topo-editor input{ flex:1 1 240px; min-width:0; }
  .topo-editor input, .topo-editor select, .lado-prop input[type=text],
  .lado-prop input[type=number]{
    background:var(--sup2); border:1px solid var(--linha); border-radius:9px;
    padding:9px 11px; font-family:var(--corpo); font-size:0.9rem; color:var(--tinta); width:100%;
  }
  .topo-editor select{ width:auto; flex:0 0 auto; }
  .topo-editor input:focus, .topo-editor select:focus,
  .lado-prop input:focus{ border-color:var(--laranja); background:var(--sup); }
  .campo-largo{
    width:100%; margin:0 0 4px; background:var(--sup2); border:1px solid var(--linha);
    border-radius:9px; padding:11px 13px; color:var(--tinta);
  }
  .campo-largo:focus{ border-color:var(--laranja); background:var(--sup); }
  .cor-peca{ width:56px !important; height:34px; padding:2px; }
  /* Sem cor escolhida ainda: o quadradinho não deve fingir que preto é a cor. */
  .cor-peca.vazia{ opacity:.45; }
  .linkbtn[disabled]{ opacity:.5; cursor:default; text-decoration:none; }

  .item-peca{ display:flex; gap:12px; align-items:center; padding:11px 0; border-top:1px solid var(--linha2); }
  .item-peca:first-of-type{ border-top:none; }
  .item-peca .corpo{ flex:1 1 auto; min-width:0; background:none; border:none; text-align:left; color:inherit; padding:0; }
  .item-peca .tit{ font-weight:600; font-size:0.94rem; }
  .item-peca .sub{ font-size:0.8rem; color:var(--fraco); margin-top:2px; }

  .relogio{
    font-family:var(--dado); font-size:0.72rem; color:var(--fraco);
    margin:14px 0 0; padding:9px 12px; background:var(--sup2); border-radius:9px;
  }
  .relogio.longo{ background:var(--es-f); color:var(--es); }

  .bloco-conf{ margin-top:24px; padding-top:18px; border-top:1px solid var(--linha2); }
  .bloco-conf.dobra > summary{
    cursor:pointer; list-style:none; display:flex; gap:12px; align-items:center; flex-wrap:wrap;
  }
  .bloco-conf.dobra > summary::-webkit-details-marker{ display:none; }
  .bloco-conf.dobra > summary::before{
    content:'▸'; color:var(--fraco); font-size:0.8rem; line-height:1;
  }
  .bloco-conf.dobra[open] > summary::before{ content:'▾'; }
  .resumo-conf{ font-size:0.82rem; color:var(--fraco); }
  .resumo-conf.trava{ color:var(--al); font-weight:600; }
  .confere{ display:grid; gap:8px; margin-top:10px; }
  .aviso-conf{
    margin:0; font-size:0.85rem; line-height:1.5; padding:10px 13px; border-radius:9px;
    background:var(--nt-f); color:var(--tinta); border-left:3px solid var(--nt);
  }
  .aviso-conf.grave{ background:var(--al-f); border-left-color:var(--al); }
  .aviso-conf.aviso{ background:var(--es-f); border-left-color:var(--es); }
  .aviso-conf b{ font-family:var(--display); }
  /* O artigo citado. É ele que separa ferramenta de chute — fica em destaque
     de propósito, porque é o que a pessoa copia pra defesa. */
  .aviso-conf .norma{
    font-family:var(--dado); font-size:0.72rem; letter-spacing:0.02em;
    color:var(--fraco); display:inline-block; margin-right:6px;
  }
  .aviso-conf.grave .norma{ color:var(--al); }
  .pac{
    background:var(--sup2); border:1px solid var(--linha); border-radius:11px;
    padding:13px 15px; margin-top:10px;
  }
  .pac a{ color:var(--laranja-forte); }
  .confirme{ margin-top:6px; }
  .item-confirme{
    display:flex; gap:10px; align-items:flex-start; padding:8px 0;
    border-top:1px solid var(--linha2); font-size:0.87rem; line-height:1.45; cursor:pointer;
  }
  .item-confirme:first-of-type{ border-top:none; }
  .item-confirme input{ margin-top:3px; flex:0 0 auto; accent-color:var(--laranja); }
  .aviso-conf.grave b{ color:var(--al); }
  .aviso-conf.aviso b{ color:var(--es); }

  .sugest{ display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--linha2); }
  .sugest:first-of-type{ border-top:none; }
  .sugest .corpo{ flex:1 1 auto; min-width:0; }
  .sugest .frase{ margin:0; font-size:0.9rem; line-height:1.45; }
  .sugest .de{
    margin:3px 0 0; font-family:var(--dado); font-size:0.58rem; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--fraco);
  }
  .prompt-cru{
    margin:12px 0 0; padding:14px; background:var(--sup2); border:1px solid var(--linha);
    border-radius:10px; font-family:var(--dado); font-size:0.72rem; line-height:1.55;
    color:var(--tinta); white-space:pre-wrap; max-height:340px; overflow:auto;
  }
  .pe-editor{
    display:flex; gap:9px; align-items:center; flex-wrap:wrap;
    margin-top:24px; padding-top:18px; border-top:1px solid var(--linha);
  }

  /* ---------- o editor da peça ---------- */
  /* A peça fica à esquerda e as opções do que estiver selecionado à direita.
     Clicar num elemento é o que abre as opções dele: sem isso o editor vira
     um formulário comprido em que ninguém acha o que quer mudar. */
  .estudio-ed{ display:grid; grid-template-columns:minmax(0,1fr) minmax(min(330px,100%),0.62fr);
    gap:24px; margin-top:20px; align-items:start; }
  @media (max-width:960px){ .estudio-ed{ grid-template-columns:minmax(0,1fr); } }
  .lado-palco{ min-width:0; }
  .barra-el{ display:flex; gap:7px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .palco{
    display:block; width:100%; height:auto; border-radius:12px; box-shadow:var(--s2);
    background:var(--sup2); cursor:default; touch-action:none;
  }
  .palco:focus{ outline:2px solid var(--laranja); outline-offset:3px; }
  .tira{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .mini{
    position:relative; padding:0; width:56px; border:1px solid var(--linha); border-radius:8px;
    background:var(--sup2); overflow:hidden; line-height:0; cursor:pointer;
  }
  .mini canvas{ display:block; width:100%; height:auto; }
  .mini.on{ border-color:var(--laranja); box-shadow:var(--s1); }
  .mini .n{
    position:absolute; left:3px; bottom:3px; font-family:var(--dado); font-size:0.58rem;
    line-height:1; padding:2px 4px; border-radius:4px; background:rgba(20,18,16,.72); color:#fff;
  }
  .mini.add{
    width:38px; min-height:46px; display:flex; align-items:center; justify-content:center;
    font-size:1.1rem; color:var(--fraco); line-height:1;
  }
  .lado-prop{
    min-width:0; background:var(--sup2); border:1px solid var(--linha); border-radius:12px;
    padding:14px 16px 18px; position:sticky; top:76px; max-height:calc(100vh - 96px); overflow:auto;
  }
  @media (max-width:960px){ .lado-prop{ position:static; max-height:none; } }
  .lado-prop .campo-p{ grid-template-columns:minmax(0,1fr); gap:5px; align-items:start; }
  .lado-prop .campo-p textarea{
    background:var(--sup); border:1px solid var(--linha); border-radius:9px; padding:9px 11px;
    font-family:var(--corpo); font-size:0.88rem; color:var(--tinta); width:100%; resize:vertical;
  }
  .lado-prop .campo-p textarea:focus{ border-color:var(--laranja); }
  /* O display:flex da classe vence o [hidden] do navegador, então some de
     verdade só com esta linha. Sem ela o aviso fica na tela depois de resolvido. */
  .aviso-palco[hidden]{ display:none !important; }
  .aviso-palco{
    display:flex; gap:11px; align-items:center; flex-wrap:wrap;
    margin-top:11px; padding:9px 13px; border-radius:9px;
    background:var(--es-f); color:var(--tinta); font-size:0.85rem;
    border-left:3px solid var(--es);
  }
  /* Mesma razão do .aviso-palco: o display da classe vence o [hidden]. */
  .aviso-deck[hidden]{ display:none !important; }
  .aviso-deck{
    display:grid; gap:7px; margin-top:12px; padding:11px 13px; border-radius:9px;
    background:var(--sup); border:1px solid var(--linha); font-size:0.85rem;
  }
  .aviso-deck .rot{ margin:0; }
  .lin-deck{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .lin-deck > span{ flex:1 1 220px; min-width:0; color:var(--tinta); }

  .num-lin{ display:flex; gap:9px; align-items:center; }
  .num-lin input[type=range]{ flex:1 1 auto; min-width:0; accent-color:var(--laranja); }
  .num-lin input[type=number]{ flex:0 0 68px; width:68px; }
  .pos-el{ margin-top:16px; padding-top:12px; border-top:1px solid var(--linha2); }
  .ordem-el{ display:flex; gap:7px; flex-wrap:wrap; margin-top:18px; padding-top:14px;
    border-top:1px solid var(--linha2); }

  /* As cores que a peça já tem, à mão. Escolher no quadradinho do sistema é
     como uma peça sai com um azul que não é o azul do cliente. */
  .cor-cx{ display:grid; gap:8px; }
  .paleta{ display:flex; gap:5px; flex-wrap:wrap; }
  .amostra{
    width:22px; height:22px; padding:0; border-radius:6px; cursor:pointer;
    border:1px solid var(--linha); box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);
  }
  .amostra.on{ box-shadow:0 0 0 2px var(--laranja); }

  /* Os arranjos: escolhe-se pela figura, não pelo nome. */
  .arranjos{ display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:8px; }
  .arranjo{
    padding:0; border:1px solid var(--linha); border-radius:8px; background:var(--sup);
    overflow:hidden; cursor:pointer; display:grid; gap:0; line-height:0; text-align:center;
  }
  .arranjo canvas{ display:block; width:100%; height:auto; }
  .arranjo .nome{
    display:block; padding:4px 3px 5px; font-size:0.58rem; line-height:1.25;
    color:var(--fraco); font-family:var(--dado);
  }
  .arranjo:hover{ border-color:var(--tinta); }
  .arranjo.on{ border-color:var(--laranja); box-shadow:var(--s1); }
  .arranjo.on .nome{ color:var(--laranja-forte); }
  .btn.perigo{ color:var(--al); border-color:var(--al); }

  /* ---------- como fica no Instagram ---------- */
  /* A peça sozinha engana. No feed ela vem com foto de perfil em cima, o "1/3"
     no canto e a legenda cortada no "mais" — e é aí que se descobre que o
     título ficou embaixo do ícone do carrossel. */
  .insta{
    max-width:390px; margin:0 auto; border:1px solid var(--linha); border-radius:14px;
    background:var(--sup); overflow:hidden;
  }
  .insta .cab{ display:flex; gap:9px; align-items:center; padding:10px 12px; }
  .insta .cab b{ font-size:0.86rem; }
  .insta .cab .mais-i{ margin-left:auto; color:var(--fraco); letter-spacing:0.1em; }
  .insta .av{
    width:30px; height:30px; border-radius:50%; background:var(--laranja-forte); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--display); font-size:0.8rem; font-weight:700;
  }
  .insta .quadro{ position:relative; line-height:0; background:var(--sup2); }
  .insta .quadro canvas{ display:block; width:100%; height:auto; }
  .insta .conta-i{
    position:absolute; top:10px; right:10px; padding:3px 9px; border-radius:12px;
    background:rgba(20,18,16,.68); color:#fff; font-family:var(--dado); font-size:0.66rem; line-height:1.4;
  }
  .insta .acoes{ display:flex; gap:13px; align-items:center; padding:9px 12px 4px; font-size:1.05rem; }
  .insta .acoes .cor{ color:var(--al); }
  .insta .pontos-i{ display:flex; gap:4px; margin:0 auto; transform:translateX(-14px); }
  .insta .pt{
    width:6px; height:6px; padding:0; border-radius:50%; border:none;
    background:var(--linha); cursor:pointer;
  }
  .insta .pt.on{ background:var(--laranja-forte); }
  .insta .leg-i{ margin:0; padding:2px 12px 14px; font-size:0.84rem; line-height:1.45; }
  .insta .leg-i b{ font-weight:600; }
  .insta .mais-leg{ color:var(--fraco); }

  /* ---------- listas ---------- */
  .abas-lista{ display:flex; gap:5px; flex-wrap:wrap; margin-bottom:18px; }
  .item-l{
    background:var(--sup); border:1px solid var(--linha); border-radius:11px; padding:14px 16px;
    display:flex; gap:14px; align-items:flex-start; margin-bottom:9px;
  }
  .item-l:hover{ box-shadow:var(--s1); }
  .item-l .corpo{ flex:1 1 auto; min-width:0; }
  .item-l .tit{ font-weight:600; font-size:0.98rem; line-height:1.3; }
  .item-l.concluido .tit, .item-l.arquivado .tit{ color:var(--fraco); text-decoration:line-through; }
  .item-l .meta{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  .item-l .det{ font-size:0.85rem; color:var(--fraco); margin-top:5px; line-height:1.45; }
  .tag{
    font-family:var(--dado); font-size:0.58rem; letter-spacing:0.08em; text-transform:uppercase;
    background:var(--sup2); border:1px solid var(--linha); border-radius:100px; padding:3px 9px; color:var(--fraco);
  }
  .tag button{ background:none; border:none; color:inherit; padding:0 0 0 5px; font-size:0.7rem; line-height:1; }
  .tag button:hover{ color:var(--al); }
  .tag.add{ border-style:dashed; cursor:pointer; }
  .tag.add:hover{ border-color:var(--tinta); color:var(--tinta); }
  .cifra-l{ font-family:var(--display); font-weight:700; font-size:1rem; }

  .kanban{ display:grid; grid-auto-flow:column; grid-auto-columns:270px; gap:12px; overflow-x:auto; padding:2px 2px 12px; }

  /* ---------- barra de cima: agora ela navega ---------- */
  .topbar{
    background:var(--sup); box-shadow:var(--s1);
    padding:0 20px; height:60px; display:flex; align-items:center; gap:22px;
    position:sticky; top:0; z-index:40;
  }
  .topbar .brand{
    font-family:var(--display); font-weight:700; font-size:0.82rem;
    letter-spacing:0.15em; text-transform:uppercase; display:flex; align-items:center; gap:9px;
    background:none; border:none; padding:0; color:inherit; white-space:nowrap; flex:0 0 auto;
  }
  .topbar .brand .dot{ width:8px; height:8px; border-radius:50%; background:var(--laranja); display:inline-block; flex:0 0 auto; }

  .navtopo{ display:flex; gap:3px; flex:1 1 auto; min-width:0; overflow-x:auto; scrollbar-width:none; }
  .navtopo::-webkit-scrollbar{ display:none; }
  .navtopo button{
    display:flex; align-items:center; gap:7px; white-space:nowrap; flex:0 0 auto;
    background:none; border:none; border-radius:9px; padding:8px 13px; color:var(--fraco);
    font-family:var(--display); font-weight:600; font-size:0.88rem;
    transition:background .14s ease, color .14s ease;
  }
  .navtopo button:hover{ background:var(--sup2); color:var(--tinta); }
  .navtopo button[aria-current="page"]{ background:var(--laranja-fraco); color:var(--laranja-forte); }
  .navtopo .conta{
    font-family:var(--dado); font-size:0.58rem; background:var(--laranja-forte); color:#fff;
    border-radius:100px; padding:1px 6px; letter-spacing:0;
  }
  .navtopo button[aria-current="page"] .conta{ background:var(--tinta); }

  .topbar .fim{ display:flex; align-items:center; gap:12px; flex:0 0 auto; }
  .topbar .who{ font-family:var(--dado); font-size:0.66rem; color:var(--fraco); }

  /* busca global */
  .buscatopo{ position:relative; flex:0 0 auto; }
  .buscatopo input{
    width:190px; padding:8px 12px 8px 30px; border:1px solid var(--linha); border-radius:100px;
    background:var(--sup2); font-size:0.84rem;
  }
  .buscatopo input:focus{ background:var(--sup); border-color:var(--tinta); width:250px; }
  .buscatopo input{ transition:width .16s ease, background .14s ease, border-color .14s ease; }
  .buscatopo::before{
    content:''; position:absolute; left:11px; top:50%; margin-top:-5px;
    width:9px; height:9px; border:1.5px solid var(--fraco); border-radius:50%; pointer-events:none;
  }
  .buscatopo::after{
    content:''; position:absolute; left:19px; top:50%; margin-top:3px;
    width:5px; height:1.5px; background:var(--fraco); transform:rotate(45deg); pointer-events:none;
  }
  .achados{
    position:absolute; top:calc(100% + 8px); right:0; width:min(340px, calc(100vw - 40px));
    background:var(--sup); border-radius:12px; box-shadow:var(--s2); padding:8px; z-index:50;
    max-height:60vh; overflow-y:auto;
  }
  .achados h6{
    font-family:var(--dado); font-size:0.54rem; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--fraco); margin:10px 10px 4px; font-weight:400;
  }
  .achados h6:first-child{ margin-top:4px; }
  .achados button{
    display:block; width:100%; text-align:left; background:none; border:none; border-radius:8px;
    padding:8px 10px; font-size:0.88rem; color:inherit; line-height:1.3;
  }
  .achados button:hover{ background:var(--sup2); }
  .achados button span{ display:block; font-size:0.74rem; color:var(--fraco); }

  /* ---------- índice de clientes ---------- */
  .grupo-cli{ margin-bottom:26px; }
  .grupo-cli > h3{
    font-family:var(--dado); font-size:0.58rem; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--fraco); margin:0 0 12px; display:flex; gap:9px; align-items:center; font-weight:400;
  }
  .cartoes{ display:grid; grid-template-columns:repeat(auto-fill, minmax(272px,1fr)); gap:12px; }
  .cli-cartao{
    background:var(--sup); border:1px solid var(--linha); border-radius:13px; padding:16px 17px;
    text-align:left; color:inherit; display:flex; flex-direction:column; gap:11px;
    transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
  }
  .cli-cartao:hover{ transform:translateY(-2px); box-shadow:var(--s2); border-color:transparent; }
  .cli-cartao .topo{ display:flex; gap:11px; align-items:flex-start; }
  .marca-cli{
    flex:0 0 auto; width:38px; height:38px; border-radius:10px; display:flex; align-items:center;
    justify-content:center; font-family:var(--display); font-weight:700; font-size:0.98rem;
    background:var(--sup2); color:var(--fraco);
  }
  .cli-cartao .nome{ font-family:var(--display); font-weight:700; font-size:1.02rem; line-height:1.2; letter-spacing:-0.015em; }
  .cli-cartao .sub{ font-size:0.78rem; color:var(--fraco); margin-top:2px; }
  .cli-cartao .barra{ height:5px; background:var(--linha2); border-radius:100px; overflow:hidden; }
  .cli-cartao .barra i{ display:block; height:100%; border-radius:100px; background:linear-gradient(90deg,#FF8A3C,var(--laranja)); }
  .cli-cartao .pes{
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    font-family:var(--dado); font-size:0.56rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--fraco);
  }
  .cli-cartao .pes b{ font-family:var(--display); font-size:0.82rem; letter-spacing:0; text-transform:none; color:var(--tinta); }
  .cli-cartao .alertas{ display:flex; gap:6px; flex-wrap:wrap; }

  /* ---------- propriedades do perfil ---------- */
  .props{ display:grid; grid-template-columns:repeat(auto-fill, minmax(min(310px,100%),1fr)); gap:2px 26px; }
  .prop{ display:flex; gap:10px; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--linha2); }
  .prop > span{
    flex:0 0 96px; font-family:var(--dado); font-size:0.56rem; letter-spacing:0.11em;
    text-transform:uppercase; color:var(--fraco);
  }
  .prop .v{ flex:1 1 auto; min-width:0; }
  .prop input, .prop select{
    width:100%; border:1px solid transparent; border-radius:7px; background:none; padding:4px 7px;
    font-size:0.89rem; color:inherit; margin-left:-7px;
  }
  .prop input:hover, .prop select:hover{ background:var(--sup2); }
  .prop input:focus, .prop select:focus{ background:var(--sup); border-color:var(--tinta); }
  .prop input::placeholder{ color:#BDB6AD; }
  .prop a{ color:var(--laranja-forte); font-size:0.8rem; text-decoration:none; white-space:nowrap; }
  .prop a:hover{ text-decoration:underline; }

  /* ---------- notas ---------- */
  .nota-nova textarea{
    width:100%; min-height:72px; padding:12px 14px; border:1px solid var(--linha); border-radius:11px;
    background:var(--sup2); font-family:var(--corpo); font-size:0.92rem; line-height:1.5; resize:vertical;
  }
  .nota-nova textarea:focus{ background:var(--sup); border-color:var(--tinta); }
  .nota{
    border-left:2px solid var(--linha); padding:0 0 0 16px; margin:18px 0 0; position:relative;
  }
  .nota.fixa{ border-left-color:var(--laranja); }
  .nota .cab{
    display:flex; gap:9px; align-items:center; flex-wrap:wrap;
    font-family:var(--dado); font-size:0.56rem; letter-spacing:0.11em; text-transform:uppercase; color:var(--fraco);
  }
  .nota .cab button{ background:none; border:none; color:var(--fraco); font-size:0.62rem; padding:0; }
  .nota .cab button:hover{ color:var(--tinta); }
  .nota .cab button.fixar.on{ color:var(--laranja-forte); }
  .nota p{ margin:6px 0 0; font-size:0.94rem; line-height:1.55; white-space:pre-wrap; }

  /* ---------- grupos de aba ---------- */
  .grupo-abas{ display:flex; gap:14px; align-items:center; flex:0 0 auto; }
  .grupo-abas .sep{ width:1px; height:20px; background:var(--linha); flex:0 0 auto; }

  @media (max-width:900px){
    .topbar{ height:auto; flex-wrap:wrap; padding:10px 14px; gap:10px 12px; }
    /* order vale entre irmãos: .buscatopo é filha de .fim, não da barra.
       Quem se ordena aqui é .fim, e a busca cresce dentro dela. */
    .topbar .fim{ order:2; flex:1 1 100%; gap:10px; }
    .buscatopo{ flex:1 1 auto; }
    .buscatopo input, .buscatopo input:focus{ width:100%; }
    .navtopo{ order:3; width:100%; }
    .topbar .who{ display:none; }
    .topbar .brand{ flex:1 1 auto; }
  }

  /* ==================================================================
     Modo escuro. Só os tokens mudam — nenhum componente sabe que existe
     um segundo tema, e é isso que impede o "no escuro aquela tela ficou
     branca". Três estados: escolha explícita clara, escolha explícita
     escura, e "sistema", que segue o aparelho.
     Contraste conferido: o par mais apertado é 6,2:1 (texto fraco sobre
     cartão), acima dos 4,5 exigidos para texto normal.
     ================================================================== */
  :root[data-tema="escuro"], :root[data-tema="sistema"].escuro{
    --papel:#12100E;
    --sup:#1B1815;
    --sup2:#221E1A;
    --tinta:#F2EEE8;
    --fraco:#A09890;
    --linha:#302B26;
    --linha2:#262119;
    --laranja:#FF7A2E;
    --laranja-forte:#FF9A5C;
    --laranja-fraco:#2E1B0E;
    --roxo:#B166FF;
    --roxo-fraco:#241634;

    --ok:#7FD6A6;    --ok-f:#16291F;   --ok-b:#24422F;
    --al:#FF9382;    --al-f:#2E1714;   --al-b:#4A2620;
    --es:#EFC873;    --es-f:#2B2110;   --es-b:#463620;
    --an:#9CC0F2;    --an-f:#152131;   --an-b:#25384F;
    --nt:#B8B0A7;    --nt-f:#262119;   --nt-b:#3A342C;

    --s1:0 1px 2px rgba(0,0,0,.5), 0 6px 22px rgba(0,0,0,.4);
    --s2:0 2px 5px rgba(0,0,0,.55), 0 16px 44px rgba(0,0,0,.5);
    color-scheme:dark;
  }
  /* No claro a sombra separa a barra da página; no escuro sombra não aparece,
     e sem isso o topo e o conteúdo viram a mesma mancha preta. */
  :root[data-tema="escuro"] .topbar,
  :root[data-tema="sistema"].escuro .topbar{ border-bottom:1px solid var(--linha); }

  /* Peças que fixavam cor à mão, e por isso não seguiam os tokens. */
  :root[data-tema="escuro"] .bloco.escuro,
  :root[data-tema="sistema"].escuro .bloco.escuro{ background:linear-gradient(135deg,#241F1A,#141210); }
  :root[data-tema="escuro"] .tab[aria-selected="true"],
  :root[data-tema="sistema"].escuro .tab[aria-selected="true"]{ background:var(--laranja); border-color:var(--laranja); color:#12100E; }
  :root[data-tema="escuro"] .btn,
  :root[data-tema="sistema"].escuro .btn{ background:var(--tinta); color:var(--papel); border-color:var(--tinta); }
  :root[data-tema="escuro"] .btn:hover,
  :root[data-tema="sistema"].escuro .btn:hover{ background:var(--laranja); border-color:var(--laranja); color:#12100E; }
  :root[data-tema="escuro"] .btn.ghost,
  :root[data-tema="sistema"].escuro .btn.ghost{ background:transparent; color:var(--tinta); border-color:var(--linha); }
  :root[data-tema="escuro"] .visao button[aria-selected="true"],
  :root[data-tema="sistema"].escuro .visao button[aria-selected="true"],
  :root[data-tema="escuro"] details[open] > summary,
  :root[data-tema="sistema"].escuro details[open] > summary{ background:var(--laranja); color:#12100E; border-color:var(--laranja); }
  :root[data-tema="escuro"] .toast,
  :root[data-tema="sistema"].escuro .toast{ background:var(--sup2); color:var(--tinta); border:1px solid var(--linha); }
  :root[data-tema="escuro"] .navtopo button[aria-current="page"] .conta,
  :root[data-tema="sistema"].escuro .navtopo button[aria-current="page"] .conta{ background:var(--laranja); color:#12100E; }
  :root[data-tema="escuro"] .pill,
  :root[data-tema="sistema"].escuro .pill,
  :root[data-tema="escuro"] .navtopo .conta,
  :root[data-tema="sistema"].escuro .navtopo .conta{ color:#12100E; }
  :root[data-tema="escuro"] .etapa.meio .bola,
  :root[data-tema="sistema"].escuro .etapa.meio .bola{ background:linear-gradient(90deg,#D89A2A 50%,var(--sup2) 50%); }
  :root[data-tema="escuro"] .tar,
  :root[data-tema="sistema"].escuro .tar{ background:var(--sup2); }
  :root[data-tema="escuro"] .marca-cli,
  :root[data-tema="sistema"].escuro .marca-cli{ background:var(--linha2); color:var(--fraco); }
  :root[data-tema="escuro"] .dono.cliente,
  :root[data-tema="sistema"].escuro .dono.cliente{ color:#12100E; }
  :root[data-tema="escuro"] .tar.auto,
  :root[data-tema="sistema"].escuro .tar.auto{ background:none; }
  :root[data-tema="escuro"] .chip-p[aria-pressed="true"],
  :root[data-tema="sistema"].escuro .chip-p[aria-pressed="true"],
  :root[data-tema="escuro"] .btn.perigo:hover,
  :root[data-tema="sistema"].escuro .btn.perigo:hover{ color:#12100E; }
  :root[data-tema="escuro"] .linha-tar .marca.concluido,
  :root[data-tema="sistema"].escuro .linha-tar .marca.concluido,
  :root[data-tema="escuro"] .passo .marca.concluido,
  :root[data-tema="sistema"].escuro .passo .marca.concluido{ background:var(--ok); border-color:var(--ok); color:#12100E; }
  :root[data-tema="escuro"] .barra-l .trilho i,
  :root[data-tema="sistema"].escuro .barra-l .trilho i{ background:var(--laranja); }
  :root[data-tema="escuro"] .bloco.aviso-dado .intro,
  :root[data-tema="sistema"].escuro .bloco.aviso-dado .intro{ color:var(--es); }
  :root[data-tema="escuro"] .painel-fundo,
  :root[data-tema="sistema"].escuro .painel-fundo{ background:rgba(0,0,0,.62); }
  :root[data-tema="escuro"] .ini.a,
  :root[data-tema="sistema"].escuro .ini.a{ background:var(--an-f); color:var(--an); }
  :root[data-tema="escuro"] .ini.b,
  :root[data-tema="sistema"].escuro .ini.b{ background:var(--roxo-fraco); color:var(--roxo); }

  /* ---------- perfil ---------- */
  .cabeca-perfil{ display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
  .retrato{
    width:88px; height:88px; border-radius:50%; object-fit:cover; flex:0 0 auto;
    background:var(--sup2); border:1px solid var(--linha);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--display); font-weight:700; font-size:1.9rem; color:var(--fraco);
  }
  .escolhas{ display:grid; gap:8px; }
  .opcoes{ display:flex; gap:8px; flex-wrap:wrap; }
  .opcao{
    background:var(--sup2); border:1px solid var(--linha); border-radius:11px; padding:12px 16px;
    text-align:left; color:inherit; min-width:132px; transition:border-color .14s ease, background .14s ease;
  }
  .opcao:hover{ border-color:var(--tinta); }
  .opcao[aria-pressed="true"]{ border-color:var(--laranja); background:var(--laranja-fraco); }
  .opcao b{ display:block; font-family:var(--display); font-weight:600; font-size:0.9rem; }
  .opcao span{ display:block; font-size:0.76rem; color:var(--fraco); margin-top:3px; line-height:1.35; }
  .opcao[aria-pressed="true"] b{ color:var(--laranja-forte); }
  .amostra{ display:flex; gap:6px; margin-top:9px; }
  .amostra i{ width:15px; height:15px; border-radius:4px; border:1px solid rgba(128,128,128,.35); display:block; }

  /* ---------- densidade compacta ---------- */
  :root[data-densidade="compacto"] .bloco{ padding:16px 18px; }
  :root[data-densidade="compacto"] main{ gap:12px; }
  :root[data-densidade="compacto"] .shell{ gap:14px; padding:14px; }
  :root[data-densidade="compacto"] td{ padding:9px 12px 9px 0; }
  :root[data-densidade="compacto"] .prop{ padding:4px 0; }
  :root[data-densidade="compacto"] .item-l{ padding:10px 13px; margin-bottom:6px; }
  :root[data-densidade="compacto"] .linha-tar{ padding:6px 0; }
  :root[data-densidade="compacto"] .pend{ padding:10px 13px; margin-bottom:6px; }
  :root[data-densidade="compacto"] h1.page{ font-size:1.6rem; }
  :root[data-densidade="compacto"] .cifra{ font-size:1.9rem; }

  /* ---------- logo ---------- */
  /* A marca é um logotipo de dois andares, não um ícone: em 30px o "RA" de
     baixo vira borrão. Por isso ela vem por altura (36px) e largura
     automática, respeitando a proporção do arquivo. */
  .logo{ display:flex; align-items:center; gap:11px; flex:0 0 auto; background:none; border:none; padding:0; color:inherit; }
  .logo svg{ height:36px; width:auto; display:block; flex:0 0 auto; }
  .logo .nome{
    font-family:var(--display); font-weight:700; font-size:0.78rem;
    letter-spacing:0.14em; text-transform:uppercase; white-space:nowrap;
    padding-left:11px; border-left:1px solid var(--linha);
  }
  @media (max-width:520px){ .logo .nome{ display:none; } .logo svg{ height:32px; } }
  .logo-login svg{ height:76px; width:auto; display:block; margin-bottom:22px; }

  /* ---------- avatar no topo ---------- */
  .euzinho{
    display:flex; align-items:center; gap:8px; background:none; border:1px solid transparent;
    border-radius:100px; padding:4px 10px 4px 4px; color:inherit;
  }
  .euzinho:hover{ border-color:var(--linha); background:var(--sup2); }
  .euzinho[aria-current="page"]{ border-color:var(--laranja); background:var(--laranja-fraco); }
  .euzinho img, .euzinho .ini-foto{
    width:28px; height:28px; border-radius:50%; object-fit:cover; flex:0 0 auto;
    background:var(--sup2); border:1px solid var(--linha);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--dado); font-size:0.6rem; font-weight:700; color:var(--fraco);
  }
  .euzinho span{ font-size:0.82rem; font-weight:600; white-space:nowrap; }
  @media (max-width:900px){ .euzinho span{ display:none; } }

  /* ---------- desfazer ---------- */
  /* O toast comum é click-through (pointer-events:none), senão ele engole o
     clique de quem está trabalhando embaixo. O de desfazer TEM um botão, então
     precisa receber clique — sem esta linha o botão aparece e não funciona. */
  .toast.comdesfazer{ display:flex; align-items:center; gap:16px; padding-right:14px; }
  .toast.comdesfazer.show{ pointer-events:auto; }
  .toast .desfazer{
    background:none; border:1px solid rgba(255,255,255,.35); border-radius:100px;
    color:inherit; font-family:var(--display); font-weight:700; font-size:0.76rem; padding:5px 12px;
  }
  .toast .desfazer:hover{ background:rgba(255,255,255,.15); }

  /* ---------- celular: a lateral vira gaveta ---------- */
  @media (max-width:900px){
    .shell{ grid-template-columns:minmax(0,1fr); padding:14px; gap:14px; }
    .menu-btn{ display:inline-block; }
    .side{
      position:fixed; inset:auto 0 auto 0; top:116px; z-index:35; border-radius:0 0 var(--r) var(--r);
      box-shadow:var(--s2); max-height:calc(100vh - 116px); overflow-y:auto;
      transform:translateY(-8px); opacity:0; visibility:hidden; pointer-events:none;
      transition:opacity .18s ease, transform .18s ease, visibility .18s;
    }
    /* visibility, e não só opacity: gaveta fechada não pode ser alcançada pelo
       Tab nem lida por leitor de tela. */
    .side.aberta{ transform:none; opacity:1; visibility:visible; pointer-events:auto; }
    .abas-caixa{ top:0; }
    .bloco{ padding:20px 18px; }
  }
  @media (max-width:680px){
    .topbar{ padding:0 14px; gap:10px; }
    .topbar .brand{ white-space:nowrap; font-size:0.76rem; letter-spacing:0.1em; }
    /* O e-mail não cabe e não é informação de que se precisa no celular;
       o botão de sair, sim. */
    .topbar .who span{ display:none; }
  }

  /* Plano do mês */
  .plano-topo{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:6px; }
  .plano-topo input[type=month]{ min-width:170px; }
