<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central Bora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  /* ==================================================================
     Central Bora — papel de revista
     Papel morno com blocos que flutuam (profundidade em vez de contorno),
     e dentro deles o contraste de escala de revista: número enorme,
     rótulo minúsculo e espaçado. As cores de estado são separadas do
     laranja e do roxo da marca de propósito: laranja quer dizer "olha
     aqui", roxo quer dizer "isso é do cliente"; estado é outra coisa.
     ================================================================== */
  :root{
    --papel:#F5F2EC;
    --sup:#FFFFFF;
    --sup2:#FBF9F5;
    --tinta:#1A1815;
    --fraco:#78716A;
    --linha:#E8E2D8;
    --linha2:#F0EBE2;
    --laranja:#FF5E00;
    --laranja-forte:#C24700;
    --laranja-fraco:#FFF1E8;
    --roxo:#8800FF;
    --roxo-fraco:#F4EAFF;

    --ok:#1C6B45;    --ok-f:#EAF3EE;   --ok-b:#CBE3D6;
    --al:#A93226;    --al-f:#FBEAE7;   --al-b:#F1CFC9;
    --es:#8A5A05;    --es-f:#FBF1DE;   --es-b:#EEDFBC;
    --an:#1B4F8F;    --an-f:#E9F0F9;   --an-b:#CBDCF0;
    --nt:#6D665F;    --nt-f:#F1EEE8;   --nt-b:#E2DDD4;

    --s1:0 1px 2px rgba(26,24,21,.04), 0 6px 22px rgba(26,24,21,.06);
    --s2:0 2px 4px rgba(26,24,21,.05), 0 14px 40px rgba(26,24,21,.09);
    --r:14px;
    --display:'Space Grotesk','Segoe UI',sans-serif;
    --corpo:'Archivo','Helvetica Neue',Arial,sans-serif;
    --dado:'Space Mono','SFMono-Regular',Consolas,monospace;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; background:var(--papel); color:var(--tinta);
    font-family:var(--corpo); font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:var(--corpo); font-size:0.9rem; }
  *:focus-visible{ outline:2.5px solid var(--roxo); outline-offset:2px; border-radius:3px; }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *,*::before,*::after{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }

  /* ---------- vocabulário tipográfico ---------- */
  .rot{
    font-family:var(--dado); font-size:0.58rem; letter-spacing:0.16em;
    text-transform:uppercase; color:var(--fraco); margin:0;
  }
  .rot.laranja{ color:var(--laranja); }
  .cifra{
    font-family:var(--display); font-weight:700; letter-spacing:-0.035em;
    font-size:2.4rem; line-height:0.92; font-variant-numeric:tabular-nums;
  }
  .cifra em{ font-style:normal; font-size:0.46em; color:var(--fraco); letter-spacing:-0.01em; }
  .cifra u{ text-decoration:none; color:var(--laranja); }

  /* ---------- topo ---------- */
  .topbar{
    background:var(--sup); box-shadow:var(--s1);
    padding:0 22px; height:56px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:40;
  }
  .topbar .brand{
    font-family:var(--display); font-weight:700; font-size:0.85rem;
    letter-spacing:0.16em; text-transform:uppercase; display:flex; align-items:center; gap:10px;
    background:none; border:none; padding:0; color:inherit;
  }
  .topbar .brand .dot{ width:8px; height:8px; border-radius:50%; background:var(--laranja); display:inline-block; flex:0 0 auto; }
  .topbar .who{ font-family:var(--dado); font-size:0.68rem; color:var(--fraco); display:flex; align-items:center; gap:14px; }
  .linkbtn{ background:none; border:none; color:var(--laranja-forte); font-size:0.72rem; font-family:var(--dado); padding:0; text-decoration:underline; }

  .menu-btn{
    display:none; background:none; border:1px solid var(--linha); border-radius:8px;
    padding:7px 12px; font-family:var(--display); font-weight:600; font-size:0.78rem; color:var(--tinta);
  }

  /* ---------- moldura ---------- */
  .shell{ display:grid; grid-template-columns:262px minmax(0,1fr); gap:20px; padding:20px; align-items:start; max-width:1420px; margin:0 auto; }

  /* ---------- lateral ---------- */
  .side{
    background:var(--sup); border-radius:var(--r); box-shadow:var(--s1); padding:14px 0 16px;
    position:sticky; top:76px;
  }
  .side h4{
    font-family:var(--dado); font-size:0.56rem; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--fraco); margin:18px 18px 6px; display:flex; justify-content:space-between; align-items:center; font-weight:400;
  }
  .side h4:first-child{ margin-top:2px; }
  .pill{ background:var(--laranja); color:#fff; font-size:0.6rem; padding:1px 7px; border-radius:100px; font-family:var(--dado); }
  .navitem{
    display:block; width:calc(100% - 20px); margin:2px 10px; text-align:left; background:none; border:none;
    padding:9px 12px; border-radius:9px; font-size:0.92rem; line-height:1.3; color:inherit;
    transition:background .14s ease;
  }
  .navitem:hover{ background:var(--sup2); }
  .navitem.active{ background:var(--laranja-fraco); }
  .navitem b{ display:block; font-weight:600; }
  .navitem.active b{ color:var(--laranja-forte); }
  .navitem .sub{ display:block; font-size:0.72rem; color:var(--fraco); margin-top:1px; }
  .side .act{ margin:14px 10px 0; }

  /* ---------- área de conteúdo ---------- */
  main{ min-width:0; display:grid; grid-template-columns:minmax(0,1fr); gap:18px; align-content:start; }
  .bloco{ background:var(--sup); border-radius:var(--r); box-shadow:var(--s1); padding:24px 26px; }
  .bloco.alto{ box-shadow:var(--s2); }
  .bloco.escuro{ background:linear-gradient(135deg,#211E1A,#0F0D0B); color:#F7F4EF; box-shadow:var(--s2); }
  .bloco.escuro .rot{ color:#FF8A3C; }
  .bloco.escuro .muted{ color:#B3ADA5; }

  h1.page{ font-family:var(--display); font-size:2rem; margin:6px 0 0; letter-spacing:-0.03em; line-height:1.05; text-wrap:balance; }
  h1.page.capa{ text-transform:uppercase; font-size:clamp(1.8rem,4vw,2.7rem); letter-spacing:-0.04em; }
  .muted{ color:var(--fraco); font-size:0.9rem; }
  .intro{ color:var(--fraco); font-size:0.9rem; margin:6px 0 0; max-width:64ch; }

  /* ---------- capa da ficha: contraste de escala ---------- */
  .capa-fila{ display:flex; gap:34px; flex-wrap:wrap; margin-top:22px; padding-top:20px; border-top:1px solid var(--linha2); }
  .capa-fila > div p{ margin:8px 0 0; }
  .selo{
    display:inline-flex; align-items:center; gap:6px; font-size:0.75rem; font-weight:600;
    padding:5px 12px; border-radius:100px; background:var(--nt-f); color:var(--nt); white-space:nowrap;
  }
  .selo.on{ background:var(--ok-f); color:var(--ok); }
  .selo.aviso{ background:var(--es-f); color:var(--es); }
  .selo select{ background:none; border:none; font-size:0.75rem; font-weight:600; color:inherit; padding:0; }

  /* ---------- termômetro ---------- */
  .termo-topo{ display:flex; justify-content:space-between; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .trilha{ height:8px; background:var(--linha2); border-radius:100px; margin:16px 0 20px; overflow:hidden; }
  .trilha i{ display:block; height:100%; border-radius:100px; background:linear-gradient(90deg,#FF8A3C,var(--laranja)); transition:width .45s cubic-bezier(.2,.7,.3,1); }
  .etapas{ display:grid; grid-template-columns:repeat(6,1fr); gap:10px; }
  @media (max-width:1180px){ .etapas{ grid-template-columns:repeat(3,1fr); } }
  @media (max-width:520px){ .etapas{ grid-template-columns:repeat(2,1fr); } }
  .etapa{
    background:var(--sup2); border:1px solid var(--linha); border-radius:11px; padding:12px 13px 13px;
    text-align:left; color:inherit; transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
  }
  .etapa:hover{ background:var(--sup); box-shadow:var(--s1); transform:translateY(-2px); }
  .etapa .cab{ display:flex; align-items:center; gap:6px; }
  .etapa .bola{ width:11px; height:11px; border-radius:50%; border:2px solid var(--linha); flex:0 0 auto; }
  .etapa.feito .bola{ background:#2E9E63; border-color:#2E9E63; }
  .etapa.meio .bola{ background:linear-gradient(90deg,#D89A2A 50%,#fff 50%); border-color:#D89A2A; }
  .etapa .cab em{ font-style:normal; font-family:var(--dado); font-size:0.55rem; letter-spacing:0.14em; color:var(--fraco); }
  .etapa .n{ font-family:var(--display); font-weight:700; font-size:1.55rem; letter-spacing:-0.035em; line-height:1; margin:9px 0 2px; font-variant-numeric:tabular-nums; }
  .etapa.falta .n{ color:#CFC8BE; }
  .etapa .q{ display:block; font-family:var(--dado); font-size:0.55rem; letter-spacing:0.11em; text-transform:uppercase; color:var(--fraco); }

  /* ---------- abas ---------- */
  .abas-caixa{ position:sticky; top:56px; z-index:30; background:var(--papel); padding:8px 0 2px; margin:-8px 0 -2px; }
  .abas{ display:flex; gap:5px; overflow-x:auto; scrollbar-width:none; padding:2px; }
  .abas::-webkit-scrollbar{ display:none; }
  .tab{
    display:flex; align-items:center; gap:8px; white-space:nowrap; flex:0 0 auto;
    background:var(--sup); border:1px solid var(--linha); border-radius:100px; padding:8px 15px;
    font-family:var(--display); font-weight:600; font-size:0.83rem; color:var(--fraco);
    transition:background .14s ease, color .14s ease, border-color .14s ease;
  }
  .tab:hover{ background:var(--sup2); color:var(--tinta); }
  .tab[aria-selected="true"]{ background:var(--tinta); border-color:var(--tinta); color:#fff; box-shadow:var(--s1); }
  .tab .ponto{ width:7px; height:7px; border-radius:50%; background:var(--linha); flex:0 0 auto; }
  .tab .ponto.cheio{ background:#2E9E63; }
  .tab .ponto.meio{ background:#D89A2A; }
  .tab .ponto.alerta{ background:#C0392B; }
  .tab[aria-selected="true"] .ponto{ box-shadow:0 0 0 2px rgba(255,255,255,.25); }

  /* ---------- volta contextual ---------- */
  .voltar{
    display:inline-flex; align-items:center; gap:7px; background:var(--laranja-fraco); border:none;
    border-radius:100px; padding:6px 14px 6px 11px; color:var(--laranja-forte);
    font-family:var(--dado); font-size:0.66rem; letter-spacing:0.08em; text-transform:uppercase;
  }
  .voltar:hover{ background:#FFE3D2; }

  /* ---------- seções numeradas dentro da aba ---------- */
  .sec{ display:grid; grid-template-columns:44px minmax(0,1fr); gap:0 18px; }
  @media (max-width:640px){ .sec{ grid-template-columns:minmax(0,1fr); gap:10px; } .sec .num{ display:none; } }
  .sec .num{ font-family:var(--display); font-weight:700; font-size:1.15rem; color:var(--laranja); letter-spacing:-0.02em; line-height:1.2; }
  .sec h3{ font-family:var(--display); font-size:1.12rem; margin:0 0 4px; letter-spacing:-0.015em; }
  .sec .quando{
    display:block; margin-top:8px; font-family:var(--dado); font-size:0.58rem;
    letter-spacing:0.1em; text-transform:uppercase; color:var(--tinta);
  }

  /* ---------- placares ---------- */
  .placares{ display:flex; gap:10px; flex-wrap:wrap; margin:24px 0 22px; }
  .placares .p{ background:var(--sup2); border:1px solid var(--linha); border-radius:11px; padding:13px 16px; min-width:112px; }
  .placares .p b{ display:block; font-family:var(--display); font-size:1.7rem; font-weight:700; letter-spacing:-0.035em; line-height:1; font-variant-numeric:tabular-nums; }
  .placares .p span{ font-family:var(--dado); font-size:0.55rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--fraco); }
  .placares .p.destaca{ background:var(--sup); box-shadow:var(--s1); border-color:transparent; }
  .minibarra{ height:4px; border-radius:100px; background:var(--linha2); margin-top:9px; }
  .minibarra i{ display:block; height:100%; border-radius:100px; background:#2E9E63; }

  /* ---------- estados ---------- */
  .chip{
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
    font-size:0.76rem; font-weight:600; padding:4px 11px; border-radius:100px;
    border:1px solid transparent; line-height:1.3;
  }
  .chip::before{ content:''; width:6px; height:6px; border-radius:50%; background:currentColor; flex:0 0 auto; }
  .chip.ok{ background:var(--ok-f); color:var(--ok); border-color:var(--ok-b); }
  .chip.alerta{ background:var(--al-f); color:var(--al); border-color:var(--al-b); }
  .chip.espera{ background:var(--es-f); color:var(--es); border-color:var(--es-b); }
  .chip.andamento{ background:var(--an-f); color:var(--an); border-color:var(--an-b); }
  .chip.neutro{ background:var(--nt-f); color:var(--nt); border-color:var(--nt-b); }
  .chip.roxo{ background:var(--roxo-fraco); color:#6A00C7; border-color:#E3D0F8; }

  /* ---------- tabelas ---------- */
  table{ width:100%; border-collapse:separate; border-spacing:0; font-size:0.89rem; }
  th{
    text-align:left; font-family:var(--dado); font-size:0.55rem; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--fraco); padding:0 14px 10px 0; font-weight:400; white-space:nowrap;
  }
  td{ padding:14px 14px 14px 0; border-top:1px solid var(--linha2); vertical-align:top; line-height:1.45; }
  td .forte{ font-weight:600; }
  .wrap{ overflow-x:auto; }

  /* ---------- botões ---------- */
  .btn{
    font-family:var(--display); font-weight:700; font-size:0.82rem;
    padding:10px 17px; border-radius:100px; border:1.5px solid var(--tinta);
    background:var(--tinta); color:#fff; transition:transform .12s ease, box-shadow .14s ease, background .14s ease;
  }
  .btn:hover{ background:var(--laranja); border-color:var(--laranja); box-shadow:var(--s1); transform:translateY(-1px); }
  .btn.ghost{ background:transparent; color:var(--tinta); border-color:var(--linha); }
  .btn.ghost:hover{ background:var(--sup2); color:var(--tinta); border-color:var(--tinta); box-shadow:none; }
  .btn.small{ font-size:0.74rem; padding:7px 13px; }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; transform:none; }

  /* ---------- formulários ---------- */
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-family:var(--dado); font-size:0.58rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--fraco); margin-bottom:5px; }
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px; border:1px solid var(--linha); border-radius:9px; background:var(--sup2);
    transition:border-color .14s ease, background .14s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ background:var(--sup); border-color:var(--tinta); }
  .field textarea{ min-height:70px; resize:vertical; }
  .grid2{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:0 16px; }
  .grid3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0 16px; }
  @media (max-width:640px){ .grid2,.grid3{ grid-template-columns:minmax(0,1fr); } }
  .dica{ display:block; font-size:0.76rem; color:var(--fraco); line-height:1.4; margin-top:5px; }

  details > summary{
    list-style:none; cursor:pointer; display:inline-flex; align-items:center; gap:7px;
    font-family:var(--dado); font-size:0.64rem; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--fraco); background:var(--sup2); border:1px dashed var(--linha); border-radius:100px; padding:8px 15px;
  }
  details > summary::-webkit-details-marker{ display:none; }
  details > summary:hover{ color:var(--tinta); border-color:var(--tinta); }
  details[open] > summary{ background:var(--tinta); color:#fff; border-style:solid; border-color:var(--tinta); }
  .card{ background:var(--sup); border-radius:var(--r); box-shadow:var(--s1); padding:20px 22px; margin-bottom:16px; }
  .card.flat{ background:var(--sup2); box-shadow:none; border:1px solid var(--linha); }

  /* ---------- respostas do formulário ---------- */
  .qa{ margin-bottom:18px; padding-left:15px; border-left:2px solid var(--laranja); }
  .qa.vazia{ border-left-color:var(--linha); }
  .qa .q{ font-size:0.78rem; color:var(--fraco); margin-bottom:3px; line-height:1.35; }
  .qa .a{ font-size:0.97rem; white-space:pre-wrap; line-height:1.5; }
  .qa.vazia .a{ color:#BDB6AD; font-style:italic; }
  .secname{
    font-family:var(--dado); font-size:0.58rem; letter-spacing:0.15em; text-transform:uppercase;
    color:var(--laranja); border-bottom:1px solid var(--linha); padding-bottom:7px; margin:30px 0 16px;
  }
  .secname:first-child{ margin-top:0; }

  /* ---------- agora ---------- */
  .pend{
    display:block; width:100%; text-align:left; background:var(--sup); border:1px solid var(--linha);
    border-left:4px solid var(--linha); border-radius:11px; padding:13px 16px; margin-bottom:9px; line-height:1.4;
    color:inherit; transition:transform .14s ease, box-shadow .14s ease;
  }
  .pend:hover{ box-shadow:var(--s1); transform:translateX(3px); }
  .pend.alta{ border-left-color:var(--laranja); }
  .pend.media{ border-left-color:var(--roxo); }
  .pend.baixa{ border-left-color:var(--linha); }
  .pend .quem{ font-family:var(--dado); font-size:0.56rem; letter-spacing:0.13em; text-transform:uppercase; color:var(--fraco); }
  .pend .oq{ font-size:0.97rem; font-weight:600; margin-top:3px; }
  .pend .porq{ font-size:0.84rem; color:var(--fraco); margin-top:3px; }
  .placar{ display:flex; gap:10px; flex-wrap:wrap; margin:20px 0 8px; }
  .placar .n{ background:var(--sup2); border:1px solid var(--linha); border-radius:11px; padding:12px 16px; min-width:106px; }
  .placar .n b{ font-family:var(--display); font-size:1.7rem; font-weight:700; display:block; line-height:1; letter-spacing:-0.035em; }
  .placar .n span{ font-family:var(--dado); font-size:0.55rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--fraco); }
  .placar .n.alta{ background:var(--laranja-fraco); border-color:#FFD9C2; }
  .placar .n.media{ background:var(--roxo-fraco); border-color:#E3D0F8; }

  /* ---------- explicação da aba ---------- */
  .expl{ margin:0 0 4px; }
  .expl p{ margin:0; font-size:0.87rem; color:var(--fraco); line-height:1.5; max-width:66ch; }

  /* ---------- diversos ---------- */
  .vazio{ padding:30px 24px; text-align:center; color:var(--fraco); font-size:0.9rem; border:1px dashed var(--linha); border-radius:11px; background:var(--sup2); }
  .vazio strong{ display:block; font-family:var(--display); color:var(--tinta); font-size:1rem; margin-bottom:5px; }
  .erro{ background:var(--al-f); border:1px solid var(--al-b); border-radius:10px; padding:12px 15px; font-size:0.86rem; color:var(--al); }
  .login{ max-width:400px; margin:9vh auto; background:var(--sup); border-radius:18px; box-shadow:var(--s2); padding:34px; }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%,16px);
    background:var(--tinta); color:#fff; padding:12px 22px; border-radius:100px;
    font-family:var(--display); font-weight:700; font-size:0.85rem; box-shadow:var(--s2);
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  /* ---------- transição de conteúdo ---------- */
  @keyframes sobe{ from{ opacity:0; transform:translateY(7px); } to{ opacity:1; transform:none; } }
  .entra{ animation:sobe .26s cubic-bezier(.2,.7,.3,1) both; }

  /* ---------- celular: a lateral vira gaveta ---------- */
  @media (max-width:900px){
    .shell{ grid-template-columns:minmax(0,1fr); padding:14px; gap:14px; }
    .menu-btn{ display:inline-block; }
    .side{
      position:fixed; inset:56px 0 auto 0; z-index:35; border-radius:0 0 var(--r) var(--r);
      box-shadow:var(--s2); max-height:calc(100vh - 56px); overflow-y:auto;
      transform:translateY(-8px); opacity:0; visibility:hidden; pointer-events:none;
      transition:opacity .18s ease, transform .18s ease, visibility .18s;
    }
    /* visibility, e não só opacity: gaveta fechada não pode ser alcançada pelo
       Tab nem lida por leitor de tela. */
    .side.aberta{ transform:none; opacity:1; visibility:visible; pointer-events:auto; }
    .abas-caixa{ top:56px; }
    .bloco{ padding:20px 18px; }
  }
  @media (max-width:680px){
    .topbar{ padding:0 14px; gap:10px; }
    .topbar .brand{ white-space:nowrap; font-size:0.76rem; letter-spacing:0.1em; }

  // Tradução do banco para português. O painel nunca mostra o valor cru:

      coleta:'Coleta de dados', relatorio:'Relatório', conteudo:'Conteúdo', reuniao:'Reunião',

    },
  };

  const rotulo = (grupo, valor) => {
    const g = ROTULOS[grupo] || {};
    const r = g[valor];
    if(!r) return valor || '—';
    return Array.isArray(r) ? r[0] : r;
  };
  const corDe = (grupo, valor) => {
    const r = (ROTULOS[grupo] || {})[valor];
    return Array.isArray(r) ? r[1] : 'neutro';
  };
  // Devolve o HTML de um chip já escapado.
  const chip = (grupo, valor) =>
    '<span class="chip '+corDe(grupo,valor)+'">'+esc(rotulo(grupo,valor))+'</span>';
  // Opções de select no formato [valor, rótulo], para o banco continuar recebendo o enum.
  const opcoesDe = grupo => Object.keys(ROTULOS[grupo]).map(k => [k, rotulo(grupo,k)]);

  // Lista padrão de acessos. Existe para ninguém descobrir no dia 20 que faltava um.
  const ACESSOS_PADRAO = [
    'Perfil da Empresa (Google)',
    'Instagram',
    'WhatsApp comercial',
    'Site e hospedagem',
    'Domínio e DNS',
    'Meta Business Suite',
    'Google Analytics',
    'Banco de fotos e material de marca',
  ];

  const ESTAGIOS = ['prospect','onboarding','ativo','pausado','encerrado'];

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const state = {
    user:null, membro:false, carregando:true,
    clientes:[], inbox:[], vista:{ tipo:'agora' }, aba:'respostas',
    detalhe:{ onboarding:null, metas:[], baselines:[], marcos:[], conformidade:[], horas:[], acessos:[], pagina:null, correcoes:[] },
    erro:null, modoLogin:'link', linkEnviadoPara:null, editandoPV:false,
    gaveta:false, voltarPara:null,
    tudo:{ acessos:[], metas:[], baselines:[], marcos:[], conformidade:[], horas:[] },
  };

  const app = document.getElementById('app');

  // ---------- navegação ----------
  // O endereço é a fonte da verdade da tela. Sem isso, atualizar a página
  // devolvia todo mundo pro começo, o botão de voltar do navegador saía do
  // painel inteiro, e não dava pra mandar "olha esse cliente" pra Bia.
  function rotaAtual(){
    const h = (location.hash || '').replace(/^#\/?/, '');
    const [a, b, c] = h.split('/').filter(Boolean);
    if(a === 'c' && b) return { tipo:'cliente', id:b, aba:c || null };
    if(a === 'inbox') return { tipo:'inbox' };
    if(a === 'novo') return { tipo:'novo' };
    return { tipo:'agora' };
  }

  function enderecoDe(vista, aba){
    if(vista.tipo === 'cliente') return '#/c/' + vista.id + '/' + (aba || state.aba || 'respostas');
    if(vista.tipo === 'inbox') return '#/inbox';
    if(vista.tipo === 'novo') return '#/novo';
    return '#/agora';
  }

  // ir() troca a tela E o endereço. Nada muda de tela por outro caminho:
  // é o que mantém o botão de voltar do navegador sempre certo.
  let ignorarHash = false;
  function ir(vista, opts){
    opts = opts || {};
    const alvo = enderecoDe(vista, opts.aba);
    if(location.hash !== alvo){
      ignorarHash = true;
      if(opts.substituir) location.replace(alvo); else location.hash = alvo;
      setTimeout(()=>{ ignorarHash = false; }, 0);
    }
    aplicarRota(vista, opts);
  }

  function aplicarRota(vista, opts){
    opts = opts || {};
    state.gaveta = false;
    if(vista.tipo === 'cliente'){
      const trocouCliente = !(state.vista.tipo === 'cliente' && state.vista.id === vista.id);
      state.vista = { tipo:'cliente', id:vista.id };
      state.aba = (opts.aba && ABAS.some(a => a[0] === opts.aba)) ? opts.aba : (state.aba || 'respostas');
      if(trocouCliente){
        state.editandoPV = false;
        state.detalhe = { onboarding:null, metas:[], baselines:[], marcos:[], conformidade:[], horas:[], acessos:[], pagina:null, correcoes:[] };
        render();
        carregarDetalhe(vista.id).then(render);
        return;
      }
    } else {
      state.vista = { tipo:vista.tipo };
      state.voltarPara = null;
    }
    render();
  }

  window.addEventListener('hashchange', ()=>{
    if(ignorarHash) return;   // fomos nós que mexemos; aplicarRota já rodou
    const r = rotaAtual();
    state.voltarPara = null;  // veio do botão do navegador: a volta contextual não vale mais
    aplicarRota(r, { aba:r.aba });
  });

  const el = (t, a, h) => { const n=document.createElement(t); if(a) for(const k in a){ if(k==='class') n.className=a[k]; else if(k.startsWith('on')) n.addEventListener(k.slice(2), a[k]); else n.setAttribute(k, a[k]); } if(h!==undefined) n.innerHTML=h; return n; };
  const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  let toastTimer;
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2800);
  }

  const dataBR = s => { if(!s) return '—'; const d = new Date(s); return isNaN(d) ? s : d.toLocaleDateString('pt-BR'); };
  const soData = s => s ? String(s).slice(0,10).split('-').reverse().join('/') : '—';

  // ---------- dados ----------

  async function carregarTudo(){
    state.erro = null;
    // As seis tabelas vêm inteiras, sem filtro de cliente: é o que a tela Agora
    // precisa pra cruzar tudo. São dezenas de linhas no total, não milhares —
    // no dia em que forem, isso vira uma view no banco, não mais selects aqui.
    const [cli, inbox, ac, me, ba, ma, co, ho] = await Promise.all([
      sb.from('clientes').select('*').order('nome'),
      sb.from('onboarding_respostas').select('*').is('cliente_id', null).order('recebido_em', { ascending:false }),
      sb.from('acessos').select('*'),
      sb.from('metas').select('*'),
      sb.from('baselines').select('*'),
      sb.from('marcos').select('*'),
      sb.from('conformidade_itens').select('*'),
      sb.from('horas').select('*'),
    ]);
    if(cli.error) state.erro = cli.error.message;
    state.clientes = cli.data || [];
    state.inbox = inbox.data || [];
    state.tudo = {
      acessos: ac.data || [], metas: me.data || [], baselines: ba.data || [],
      marcos: ma.data || [], conformidade: co.data || [], horas: ho.data || [],
    };
  }

  async function carregarDetalhe(clienteId){
    const d = state.detalhe;
    const [on, me, ba, ma, co, ho, ac, pg, cr] = await Promise.all([
      sb.from('onboarding_respostas').select('*').eq('cliente_id', clienteId).order('recebido_em',{ascending:false}).limit(1),
      sb.from('metas').select('*').eq('cliente_id', clienteId).order('registrado_em'),
      sb.from('baselines').select('*').eq('cliente_id', clienteId).order('congelado_em'),
      sb.from('marcos').select('*').eq('cliente_id', clienteId).order('ordem').order('data_prevista'),
      sb.from('conformidade_itens').select('*').eq('cliente_id', clienteId).order('norma'),
      sb.from('horas').select('*').eq('cliente_id', clienteId).order('data',{ascending:false}),
      sb.from('acessos').select('*').eq('cliente_id', clienteId).order('ordem').order('recurso'),
      sb.from('paginas').select('*').eq('cliente_id', clienteId).limit(1),
      sb.from('correcoes').select('*').eq('cliente_id', clienteId).order('corrigido_em'),
    ]);
    d.onboarding = (on.data && on.data[0]) || null;
    d.metas = me.data || []; d.baselines = ba.data || []; d.marcos = ma.data || [];
    d.conformidade = co.data || []; d.horas = ho.data || []; d.acessos = ac.data || [];
    d.pagina = (pg.data && pg.data[0]) || null;
    d.correcoes = cr.data || [];
  }

  async function inserir(tabela, linha){
    const { error } = await sb.from(tabela).insert(linha);
    if(error){ toast('Não deu: ' + error.message); return false; }
    toast('Salvo.');
    return true;
  }

  async function atualizar(tabela, id, campos){
    const { error } = await sb.from(tabela).update(campos).eq('id', id);
    if(error){ toast('Não deu: ' + error.message); return false; }
    return true;
  }

  async function apagar(tabela, id){
    const { error } = await sb.from(tabela).delete().eq('id', id);
    if(error){ toast('Não deu: ' + error.message); return false; }
    toast('Removido.');
    return true;
  }

  // ---------- render ----------

  function render(){
    app.innerHTML = '';
    if(state.carregando){ app.appendChild(el('div',{class:'vazio'},'Carregando…')); return; }
    if(!state.user){ app.appendChild(telaLogin()); return; }

    shell.appendChild(lateral());
    shell.appendChild(conteudo());
    app.appendChild(shell);
    if(state.gaveta) app.appendChild(el('div',{
      style:'position:fixed;inset:56px 0 0 0;z-index:34;background:rgba(26,24,21,.28)',
      onclick:()=>{ state.gaveta = false; render(); }}));
  }

  function topbar(){
    const bar = el('div',{class:'topbar'});

    esq.appendChild(el('button',{class:'brand', onclick:()=>ir({tipo:'agora'})},
      '<span class="dot"></span>Central Bora'));
    bar.appendChild(esq);
    const who = el('div',{class:'who'});
    who.appendChild(el('span',{},esc(state.user.email)));
    who.appendChild(el('button',{class:'linkbtn', onclick:sair},'sair'));
    bar.appendChild(who);
    return bar;
  }

  function telaLogin(){
    const box = el('div',{class:'login'});
    box.appendChild(el('p',{class:'rot laranja'},'Uso interno da Bora Postar'));
    box.appendChild(el('h1',{class:'page'},'Central Bora'));

    // Confirmação depois de enviar o link
    if(state.linkEnviadoPara){
      box.appendChild(el('p',{class:'muted'},
        'Link enviado para <strong>'+esc(state.linkEnviadoPara)+'</strong>. Abra o e-mail e clique nele — você volta pra cá já conectado. O link vale por 1 hora e serve uma vez só.'));
      const acoes = el('div',{style:'margin-top:18px;display:flex;gap:10px;flex-wrap:wrap'});
      acoes.appendChild(el('button',{class:'btn ghost small', onclick:()=>{ state.linkEnviadoPara=null; state.erro=null; render(); }},'Usar outro e-mail'));
      box.appendChild(acoes);
      return box;
    }

    const porSenha = state.modoLogin === 'senha';
    box.appendChild(el('p',{class:'muted'}, porSenha
      ? 'Entre com a senha da sua conta do Supabase.'
      : 'Digite seu e-mail que a gente manda um link de acesso. Sem senha pra lembrar nem pra compartilhar.'));

    const form = el('form');
    form.appendChild(campo('E-mail','email','email'));
    if(porSenha) form.appendChild(campo('Senha','senha','password'));
    if(state.erro) form.appendChild(el('div',{class:'erro'}, esc(state.erro)));

    const btn = el('button',{class:'btn', type:'submit'}, porSenha ? 'Entrar' : 'Enviar link de acesso');
    form.appendChild(btn);

    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const email = form.querySelector('[name=email]').value.trim();
      if(!email){ state.erro = 'Falta o e-mail.'; render(); return; }
      btn.disabled = true;
      state.erro = null;

      if(porSenha){
        btn.textContent = 'Entrando…';
        const password = form.querySelector('[name=senha]').value;
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if(error){ state.erro = 'E-mail ou senha não conferem.'; render(); return; }
        await iniciarSessao();
        return;
      }

      btn.textContent = 'Enviando…';
      // shouldCreateUser: false — só entra quem já foi criado no Supabase.
      // Sem isso, qualquer pessoa criaria conta neste projeto, que é o mesmo do app.
      const { error } = await sb.auth.signInWithOtp({
        email,
        options: { shouldCreateUser: false, emailRedirectTo: window.location.origin },
      });
      if(error){
        const m = (error.message || '').toLowerCase();
        if(m.includes('not allowed') || m.includes('signups')){
          state.erro = 'Não existe conta com esse e-mail. Peça pra criarem a sua no Supabase antes.';
        } else if(m.includes('rate') || m.includes('limit') || m.includes('seconds')){
          state.erro = 'Muitos pedidos seguidos. Espere alguns minutos e tente de novo.';
        } else {
          state.erro = 'Não deu pra enviar o link agora: ' + error.message;
        }
        render();
        return;
      }
      state.linkEnviadoPara = email;
      render();
    });

    box.appendChild(form);

    const alt = el('p',{style:'margin:18px 0 0'});
    alt.appendChild(el('button',{class:'linkbtn', type:'button', style:'color:#6E6E6E',
      onclick:()=>{ state.modoLogin = porSenha ? 'link' : 'senha'; state.erro=null; render(); }},
      porSenha ? 'voltar pro link por e-mail' : 'entrar com senha'));
    box.appendChild(alt);
    return box;
  }

  function campo(rot, nome, tipo, valor, dica){
    const f = el('div',{class:'field'});
    f.appendChild(el('label',{for:'f_'+nome},esc(rot)));
    f.appendChild(el('input',{id:'f_'+nome, name:nome, type:tipo||'text', value:valor==null?'':valor}));
    if(dica) f.appendChild(el('span',{class:'dica'}, esc(dica)));
    return f;
  }

    const m = el('main');

    m.appendChild(el('h1',{class:'page'},'Esta conta não é da agência'));
    m.appendChild(el('p',{class:'muted'},'A Central é restrita a quem tem <code>is_agency</code> marcado no perfil. Se você deveria estar aqui, peça pra marcarem sua conta.'));
    m.appendChild(el('p',{},'')).appendChild(el('button',{class:'btn ghost', onclick:sair},'Sair'));
    return m;
  }

  function lateral(){
    const s = el('div',{class:'side'+(state.gaveta?' aberta':'')});

    const pend = pendencias();
    const altas = pend.filter(p => p.urgencia === 'alta').length;
    s.appendChild(el('h4',{},'Painel'));
    const ba = el('button',{class:'navitem'+(state.vista.tipo==='agora'?' active':''), onclick:()=>ir({tipo:'agora'})});
    ba.innerHTML = '<b>Agora</b><span class="sub">'+(pend.length
      ? (altas ? altas+' urgente'+(altas===1?'':'s')+' de '+pend.length : pend.length+' em aberto')
      : 'nada em aberto')+'</span>';
    s.appendChild(ba);

    const h1 = el('h4',{},'Caixa de entrada');
    if(state.inbox.length) h1.appendChild(el('span',{class:'pill'}, String(state.inbox.length)));
    s.appendChild(h1);
    const bi = el('button',{class:'navitem'+(state.vista.tipo==='inbox'?' active':''), onclick:()=>ir({tipo:'inbox'})});
    bi.innerHTML = state.inbox.length
      ? '<b>Respostas sem cliente</b><span class="sub">'+state.inbox.length+' aguardando</span>'
      : '<b>Respostas sem cliente</b><span class="sub">nada pendente</span>';
    s.appendChild(bi);

    s.appendChild(el('h4',{},'Clientes'));
    if(!state.clientes.length){
      s.appendChild(el('div',{class:'navitem muted'},'Nenhum cliente ainda'));
    } else {
      state.clientes.forEach(c=>{
        const b = el('button',{class:'navitem'+(state.vista.tipo==='cliente'&&state.vista.id===c.id?' active':''), onclick:()=>abrirCliente(c.id)});
        b.innerHTML = '<b>'+esc(c.nome)+'</b><span class="sub">'+esc(rotulo('estagio',c.estagio))+'</span>';
        s.appendChild(b);
      });
    }
    const wrap = el('div',{class:'act'});
    wrap.appendChild(el('button',{class:'btn ghost small', onclick:()=>ir({tipo:'novo'})},'+ Novo cliente'));
    s.appendChild(wrap);
    return s;
  }

  function conteudo(){
    if(state.vista.tipo==='agora') return telaAgora();
    if(state.vista.tipo==='inbox') return telaInbox();
    if(state.vista.tipo==='novo') return telaNovoCliente();
    return telaCliente();
  }

  // ---------- agora ----------

  // Regra: uma pendência só existe se der pra apontar o que fazer e onde.
  // "Melhorar o Instagram" não é pendência. "Acesso ao Meta Business bloqueado
  // há 12 dias" é. Nada aqui é opinião: tudo sai de um campo vazio, um status
  // ou uma data no banco.
  const HOJE = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
  const diasAte = iso => {
    if(!iso) return null;
    const d = new Date(String(iso).slice(0,10) + 'T00:00:00');
    return isNaN(d) ? null : Math.round((d - HOJE()) / 86400000);
  };
  const emDias = n => n === 0 ? 'hoje' : (n > 0 ? 'em ' + n + (n===1?' dia':' dias') : 'há ' + Math.abs(n) + (n===-1?' dia':' dias'));

  function pendencias(){
    const p = [];
    const t = state.tudo || { acessos:[], metas:[], baselines:[], marcos:[], conformidade:[], horas:[] };
    const add = (urgencia, cliente, aba, oq, porq) => p.push({ urgencia, cliente, aba, oq, porq });

    // 1. Respostas que chegaram e não viraram cliente. Começa a envelhecer no minuto um.
    state.inbox.forEach(sub=>{
      const d = diasAte(sub.recebido_em);
      const velho = d !== null && d <= -3;
      add(velho ? 'alta' : 'media', null, null,
        'Vincular a resposta de ' + (sub.nome_informado || 'alguém sem nome'),
        'Chegou pelo formulário ' + (d === null ? '' : emDias(d)) + ' e ainda não está ligada a nenhum cliente.');
    });

    const ativos = state.clientes.filter(c => c.estagio === 'onboarding' || c.estagio === 'ativo');

    ativos.forEach(c=>{
      const meus = tab => t[tab].filter(l => l.cliente_id === c.id);

      // 2. Acessos. O gargalo mais documentado do onboarding (Lacuna #5).
      const ac = meus('acessos');
      const bloq = ac.filter(l => l.status === 'bloqueado');
      if(bloq.length) add('alta', c, 'acessos',
        bloq.length + ' acesso' + (bloq.length===1?'':'s') + ' bloqueado' + (bloq.length===1?'':'s'),
        bloq.map(l => l.recurso).join(', ') + '. Bloqueado não destrava sozinho: precisa de uma ligação, não de mais um lembrete.');
      const parados = ac.filter(l => l.status === 'solicitado' && diasAte(l.solicitado_em) !== null && diasAte(l.solicitado_em) <= -5);
      if(parados.length) add('alta', c, 'acessos',
        parados.length + ' acesso' + (parados.length===1?'':'s') + ' pedido' + (parados.length===1?'':'s') + ' e sem resposta',
        parados.map(l => l.recurso + ' (' + emDias(diasAte(l.solicitado_em)) + ')').join(', ') + '.');
      const naoPedidos = ac.filter(l => l.status === 'pendente');
      if(naoPedidos.length) add('media', c, 'acessos',
        naoPedidos.length + ' acesso' + (naoPedidos.length===1?'':'s') + ' que ninguém pediu ainda',
        naoPedidos.map(l => l.recurso).join(', ') + '.');
      if(!ac.length) add('media', c, 'acessos',
        'Nenhum acesso registrado',
        'Sem a lista de acessos, a primeira semana descobre o que falta no pior momento possível.');

      // 3. Baseline. Congelar antes de mexer, ou não há como provar nada depois (Lacuna #3).
      if(!meus('baselines').length) add('alta', c, 'baseline',
        'Baseline não congelado',
        'Qualquer coisa publicada antes disso vira resultado que não dá pra provar. Congelar é a primeira tarefa, não a última.');

      // 4. Metas pre-registradas.
      const metas = meus('metas');
      if(!metas.length) add('media', c, 'metas',
        'Nenhuma meta pré-registrada',
        'Sem sucesso e fracasso escritos antes, os números do dia 90 se explicam sozinhos — e sempre a favor da agência.');
      else {
        const semFracasso = metas.filter(m => !(m.fracasso || '').trim());
        if(semFracasso.length) add('media', c, 'metas',
          semFracasso.length + ' meta' + (semFracasso.length===1?'':'s') + ' sem critério de fracasso',
          semFracasso.map(m => m.metrica).join(', ') + '. Meta sem fracasso declarado não é meta, é torcida.');
      }

      // 5. Primeiro valor: a promessa pequena com data (Lacuna #5).
      const pv = (c.primeiro_valor_prometido || '').trim();
      if(!pv) add('alta', c, 'respostas',
        'Primeiro valor não definido',
        'Precisa estar dito no kickoff, com data entre 14 e 30 dias. Depois disso já é tarde.');
      else if(!c.primeiro_valor_data) add('alta', c, 'respostas',
        'Primeiro valor sem data',
        '"' + pv + '" — promessa sem data não cobra ninguém.');
      else {
        const d = diasAte(c.primeiro_valor_data);
        if(d < 0) add('alta', c, 'respostas', 'Primeiro valor atrasado ' + emDias(d),
          '"' + pv + '". Atrasar isso custa mais que atrasar um post: é a promessa que sustenta a relação até o número se mexer.');
        else if(d <= 7) add('media', c, 'respostas', 'Primeiro valor vence ' + emDias(d),
          '"' + pv + '"');
      }

      // 6. Conformidade. Não conforme é publicação que pode ter que sair do ar.
      const co = meus('conformidade');
      const ruins = co.filter(l => l.status === 'nao_conforme');
      if(ruins.length) add('alta', c, 'conformidade',
        ruins.length + ' item' + (ruins.length===1?'':'s') + ' fora da norma',
        ruins.map(l => (l.norma ? l.norma + ': ' : '') + l.item).join(' | '));
      const aVer = co.filter(l => l.status === 'pendente');
      if(aVer.length) add('media', c, 'conformidade',
        aVer.length + ' item' + (aVer.length===1?'':'s') + ' de conformidade sem veredito',
        aVer.map(l => l.item).join(' | '));

      // 7. Marcos com data.
      meus('marcos').filter(m => !m.data_cumprida && m.data_prevista).forEach(m=>{
        const d = diasAte(m.data_prevista);
        const dele = m.responsavel === 'cliente';
        if(d < 0) add('alta', c, 'marcos', 'Marco atrasado ' + emDias(d) + ': ' + m.titulo,
          dele ? 'É do cliente. Atraso do cliente não se cobra por mensagem no dia seguinte ao prazo, se combina de novo com data nova.' : 'É nosso.');
        else if(d <= 7) add('media', c, 'marcos', 'Marco vence ' + emDias(d) + ': ' + m.titulo,
          dele ? 'Depende do cliente — avisar hoje, não no dia.' : 'É nosso.');
      });

      // 8. Horas. Bloco G: só dá pra decidir o que automatizar sabendo onde o tempo vai.
      if(c.estagio === 'ativo'){
        const ult = meus('horas').map(h => diasAte(h.data)).filter(x => x !== null).sort((a,b)=>b-a)[0];
        if(ult === undefined) add('baixa', c, 'horas', 'Nenhuma hora lançada',
          'Sem horas, não dá pra saber se o cliente dá lucro nem o que vale automatizar.');
        else if(ult <= -14) add('baixa', c, 'horas', 'Sem horas lançadas ' + emDias(ult),
          'O último lançamento foi ' + emDias(ult) + '. Registro que atrasa duas semanas vira chute.');
      }
    });

    const peso = { alta:0, media:1, baixa:2 };
    return p.sort((a,b)=> peso[a.urgencia] - peso[b.urgencia]
      || String(a.cliente ? a.cliente.nome : '').localeCompare(String(b.cliente ? b.cliente.nome : '')));
  }

  function telaAgora(){
    const m = el('main');
    m.appendChild(el('p',{class:'rot laranja'},'O que está esperando por nós'));
    m.appendChild(el('h1',{class:'page'},'Agora'));
    m.appendChild(el('p',{class:'muted'},'Tudo o que o banco sabe que está em aberto, em uma lista só. Cada linha leva direto pro lugar de resolver.'));

    const pend = pendencias();
    if(!pend.length){
      m.appendChild(el('div',{class:'vazio', style:'margin-top:22px'},'Nada em aberto. Ou está tudo em dia, ou falta registrar — as duas coisas parecem iguais daqui.'));
      return m;
    }

    const conta = u => pend.filter(p => p.urgencia === u).length;
    const resumo = el('div',{class:'placar'});
    [['alta','urgente'],['media','esta semana'],['baixa','quando der']].forEach(([u,rot])=>{
      const n = conta(u);
      if(!n) return;
      const b = el('div',{class:'n '+u});
      b.appendChild(el('b',{}, String(n)));
      b.appendChild(el('span',{}, rot));
      resumo.appendChild(b);
    });
    m.appendChild(resumo);

    let atual = null;
    pend.forEach(p=>{
      if(p.urgencia !== atual){
        atual = p.urgencia;
        const rot = { alta:'Urgente', media:'Esta semana', baixa:'Quando der' }[atual];
        m.appendChild(el('div',{class:'secname'}, rot));
      }
      const b = el('button',{class:'pend '+p.urgencia, onclick:()=>{
        if(p.cliente){ state.voltarPara = 'agora'; abrirCliente(p.cliente.id, p.aba); }
        else ir({tipo:'inbox'});
      }});
      b.appendChild(el('div',{class:'quem'}, p.cliente ? esc(p.cliente.nome) : 'Caixa de entrada'));
      b.appendChild(el('div',{class:'oq'}, esc(p.oq)));
      if(p.porq) b.appendChild(el('div',{class:'porq'}, esc(p.porq)));
      m.appendChild(b);
    });

    return m;
  }

  // ---------- caixa de entrada ----------

    const m = el('main');
    m.appendChild(el('p',{class:'rot laranja'},'Chegou pelo formulário'));
    m.appendChild(el('h1',{class:'page'},'Respostas sem cliente'));
    m.appendChild(el('p',{class:'muted'},'Cada envio do formulário cai aqui. Vincule a um cliente que já existe ou crie um a partir das respostas.'));

    if(!state.inbox.length){
      m.appendChild(el('div',{class:'vazio', style:'margin-top:22px'},'Nada pendente. Quando alguém enviar o formulário, aparece aqui.'));

    }

    state.inbox.forEach(sub=>{
      const c = el('div',{class:'card', style:'margin-top:18px'});

      cab.appendChild(el('div',{},'<strong class="grotesk" style="font-size:1.1rem">'+esc(sub.nome_informado||'Sem nome informado')+'</strong>'));
      cab.appendChild(el('span',{class:'mono muted', style:'font-size:0.7rem'}, dataBR(sub.recebido_em)+' · '+contarRespondidas(sub.respostas)+'/24 respondidas'));

      if(previa) c.appendChild(el('p',{class:'muted', style:'margin:10px 0 0'}, esc(previa.slice(0,240))));

      const acoes = el('div',{style:'margin-top:16px;display:flex;gap:9px;flex-wrap:wrap;align-items:center'});
      acoes.appendChild(el('button',{class:'btn small', onclick:()=>criarClienteDaSubmissao(sub)},'Criar cliente com estas respostas'));

      if(state.clientes.length){

      det.appendChild(blocoRespostas(sub.respostas));

  function contarRespondidas(r){
    if(!r) return 0;
    return Object.values(r).filter(v=>typeof v==='string' && v.trim()).length;
  }

  async function criarClienteDaSubmissao(sub){
    const nome = (sub.nome_informado || '').trim() || 'Cliente sem nome';
    const { data, error } = await sb.from('clientes')
      .insert({ nome, nome_preferido: sub.nome_informado || null, estagio:'prospect' })
      .select('id').single();
    if(error){ toast('Não deu: ' + error.message); return; }
    await atualizar('onboarding_respostas', sub.id, { cliente_id: data.id });
    toast('Cliente criado.');
    await carregarTudo();
    abrirCliente(data.id);
  }

  // ---------- novo cliente ----------

  function telaNovoCliente(){
    const m = el('main');
    m.appendChild(el('p',{class:'rot laranja'},'Cadastro'));
    m.appendChild(el('h1',{class:'page'},'Novo cliente'));
    const form = el('form',{class:'card', style:'margin-top:18px'});
    const g = el('div',{class:'grid2'});
    g.appendChild(campo('Nome','nome'));
    g.appendChild(campo('Como prefere ser chamado','nome_preferido'));
    g.appendChild(campo('Vertical','vertical'));
    g.appendChild(campoSelect('Em que pé está','estagio',opcoesDe('estagio'),'prospect',

  // Aceita 'valor' solto ou o par ['valor_no_banco','Rótulo em português'].
  function campoSelect(rot, nome, opcoes, valor, dica){
    const f = el('div',{class:'field'});
    f.appendChild(el('label',{for:'f_'+nome},esc(rot)));
    const s = el('select',{id:'f_'+nome, name:nome});
    opcoes.forEach(o=>{
      const v = Array.isArray(o) ? o[0] : o;
      const t = Array.isArray(o) ? o[1] : o;
      const op = el('option',{value:v}, esc(t));
      if(v===valor) op.setAttribute('selected','selected');
      s.appendChild(op);
    });
    f.appendChild(s);
    if(dica) f.appendChild(el('span',{class:'dica'}, esc(dica)));
    return f;
  }

  function lerForm(form){
    const out = {};
    form.querySelectorAll('input,select,textarea').forEach(i=>{
      if(!i.name) return;
      if(i.type==='checkbox'){ out[i.name] = i.checked; return; }
      const v = i.value.trim();
      out[i.name] = v === '' ? null : (i.type==='number' ? Number(v) : v);
    });
    return out;
  }

  // ---------- ficha do cliente ----------

  function abrirCliente(id, aba){
    ir({ tipo:'cliente', id }, { aba: aba || 'respostas' });
  }

  function clienteAtual(){ return state.clientes.find(c=>c.id===state.vista.id); }

  function telaCliente(){
    const c = clienteAtual();
    const m = el('main');
    if(!c){ m.appendChild(el('div',{class:'vazio'},'Cliente não encontrado.')); return m; }

    // ---- capa: nome grande, e as três contas que respondem "como vai isso"
    const capa = el('div',{class:'bloco alto'});
    if(state.voltarPara === 'agora'){
      const v = el('button',{class:'voltar', onclick:()=>ir({tipo:'agora'})},'&larr;&nbsp; voltar pro Agora');
      capa.appendChild(v);
    }
    capa.appendChild(el('p',{class:'rot laranja', style:'margin-top:'+(state.voltarPara==='agora'?'14px':'0')},
      esc(c.vertical || 'sem vertical definida')));
    capa.appendChild(el('h1',{class:'page capa'}, esc(c.nome)));

    const selos = el('div',{style:'display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px'});
    const caixaSel = el('span',{class:'selo on'});
    const sel = el('select');
    ESTAGIOS.forEach(e2=>{ const o = el('option',{value:e2}, rotulo('estagio',e2)); if(e2===c.estagio) o.setAttribute('selected','selected'); sel.appendChild(o); });
    sel.addEventListener('change', async ()=>{
      if(await atualizar('clientes', c.id, { estagio: sel.value })){ toast('Estágio atualizado.'); await carregarTudo(); render(); }
    });
    caixaSel.appendChild(sel);
    selos.appendChild(caixaSel);
    if(c.responsavel) selos.appendChild(el('span',{class:'selo'},'resp. ' + esc(c.responsavel)));
    if(c.brand_profile_id) selos.appendChild(el('span',{class:'selo'},'marca vinculada no app'));
    capa.appendChild(selos);

    const etapas = etapasDoCliente(c);
    const prontas = etapas.filter(e => e.feito >= e.total).length;
    const dia = c.inicio_contrato ? Math.max(0, -diasAte(c.inicio_contrato)) : null;
    const acessosUteis = state.detalhe.acessos.filter(a => a.status !== 'nao_aplicavel');
    const acessosOk = acessosUteis.filter(a => a.status === 'recebido').length;

    const fila = el('div',{class:'capa-fila'});
    const cifra = (grande, pequeno, rotulo, destaque) => {
      const d = el('div');
      d.innerHTML = '<span class="cifra">' + (destaque ? '<u>' : '') + esc(grande) + (destaque ? '</u>' : '')
        + (pequeno ? '<em>' + esc(pequeno) + '</em>' : '') + '</span>'
        + '<p class="rot">' + esc(rotulo) + '</p>';
      return d;
    };
    fila.appendChild(cifra(prontas, '/' + etapas.length, 'Etapas de pé', true));
    if(dia !== null) fila.appendChild(cifra(dia, '/90', 'Dias de contrato'));
    if(acessosUteis.length) fila.appendChild(cifra(acessosOk, '/' + acessosUteis.length, 'Acessos em mãos'));
    capa.appendChild(fila);
    m.appendChild(capa);

    m.appendChild(termometro(c));
    m.appendChild(blocoPrimeiroValor(c));

    // ---- abas: lista de verdade, com estado visível e navegação por teclado
    const caixaAbas = el('div',{class:'abas-caixa'});
    const tabs = el('div',{class:'abas', role:'tablist', 'aria-label':'Seções do cliente'});
    ABAS.forEach(([k,rot])=>{
      const est = estadoDaAba(k, c);
      const b = el('button',{
        class:'tab', role:'tab', id:'tab-'+k,
        'aria-selected': String(state.aba===k),
        tabindex: state.aba===k ? '0' : '-1',
        onclick:()=>irAba(k),
      });
      b.innerHTML = '<span class="ponto ' + est + '"></span>' + esc(rot);
      tabs.appendChild(b);
    });
    // Setas andam entre as abas, Home e End vão pras pontas. É o que a lista
    // de abas deve fazer, e é de graça pra quem navega sem mouse.
    tabs.addEventListener('keydown', (e)=>{
      const i = ABAS.findIndex(a => a[0] === state.aba);
      let j = null;
      if(e.key === 'ArrowRight') j = (i + 1) % ABAS.length;
      else if(e.key === 'ArrowLeft') j = (i - 1 + ABAS.length) % ABAS.length;
      else if(e.key === 'Home') j = 0;
      else if(e.key === 'End') j = ABAS.length - 1;
      if(j === null) return;
      e.preventDefault();
      irAba(ABAS[j][0]);
      const alvo = document.getElementById('tab-' + ABAS[j][0]);
      if(alvo){ alvo.focus(); alvo.scrollIntoView({ block:'nearest', inline:'center' }); }
    });
    caixaAbas.appendChild(tabs);
    m.appendChild(caixaAbas);

    const p = el('div',{class:'bloco entra', role:'tabpanel', 'aria-labelledby':'tab-'+state.aba});
    const sec = el('div',{class:'sec'});
    sec.appendChild(el('span',{class:'num'}, String(ABAS.findIndex(a=>a[0]===state.aba) + 1).padStart(2,'0')));
    const dentro = el('div');
    dentro.appendChild(explicacaoAba(state.aba));
    if(state.aba==='respostas') dentro.appendChild(abaRespostas());
    if(state.aba==='pagina') dentro.appendChild(abaPagina(c));
    if(state.aba==='acessos') dentro.appendChild(abaAcessos(c));
    if(state.aba==='metas') dentro.appendChild(abaMetas(c));
    if(state.aba==='baseline') dentro.appendChild(abaBaseline(c));
    if(state.aba==='marcos') dentro.appendChild(abaMarcos(c));
    if(state.aba==='conformidade') dentro.appendChild(abaConformidade(c));
    if(state.aba==='horas') dentro.appendChild(abaHoras(c));
    sec.appendChild(dentro);
    p.appendChild(sec);
    m.appendChild(p);
    return m;
  }

  function irAba(k){
    if(state.aba === k) return;
    state.aba = k;
    ir(state.vista, { aba:k, substituir:true });   // trocar de aba não enche o histórico
  }

  // O pontinho na aba diz se aquilo está resolvido, pela metade ou vazio —
  // então dá pra ver onde estão os buracos sem clicar em nada.
  function estadoDaAba(k, c){
    const d = state.detalhe;
    if(k === 'respostas') return d.onboarding ? 'cheio' : '';
    if(k === 'acessos'){
      if(!d.acessos.length) return '';
      if(d.acessos.some(a => a.status === 'bloqueado')) return 'alerta';
      const uteis = d.acessos.filter(a => a.status !== 'nao_aplicavel');
      const ok = uteis.filter(a => a.status === 'recebido').length;
      return ok >= uteis.length ? 'cheio' : (ok ? 'meio' : '');
    }
    if(k === 'metas'){
      if(!d.metas.length) return '';
      const completas = d.metas.filter(x => (x.fracasso||'').trim()).length;
      return completas >= d.metas.length ? 'cheio' : 'meio';
    }
    if(k === 'baseline') return d.baselines.length ? 'cheio' : '';
    if(k === 'marcos'){
      if(!d.marcos.length) return '';
      const atrasado = d.marcos.some(x => !x.data_cumprida && x.data_prevista && diasAte(x.data_prevista) < 0);
      if(atrasado) return 'alerta';
      return d.marcos.every(x => x.data_cumprida) ? 'cheio' : 'meio';
    }
    if(k === 'conformidade'){
      if(!d.conformidade.length) return '';
      if(d.conformidade.some(x => x.status === 'nao_conforme')) return 'alerta';
      return d.conformidade.some(x => x.status === 'pendente') ? 'meio' : 'cheio';
    }
    if(k === 'horas') return d.horas.length ? 'cheio' : '';
    if(k === 'pagina') return (d.pagina && d.pagina.gerada_em) ? 'cheio' : '';
    return '';
  }

  // Diz, em uma linha, o que a aba é e quando se preenche. Sem isso são sete
  // tabelas idênticas e ninguém sabe por onde começar.
  function explicacaoAba(chave){
    const a = ABAS.find(x => x[0] === chave);
    const box = el('div',{class:'expl'});
    if(!a) return box;
    box.appendChild(el('h3',{}, esc(a[2])));
    box.appendChild(el('p',{}, esc(a[3]) + '<span class="quando">' + esc(a[4]) + '</span>'));
    return box;
  }

  // Termômetro: as seis etapas que precisam estar de pé antes de o trabalho
  // virar rotina. Cada uma leva para a aba onde se resolve.
  function etapasDoCliente(c){
    const d = state.detalhe;
    const acessosUteis = d.acessos.filter(a => a.status !== 'nao_aplicavel');
    const acessosOk = acessosUteis.filter(a => a.status === 'recebido').length;
    const metasComFracasso = d.metas.filter(m => (m.fracasso || '').trim()).length;
    const confSemVeredito = d.conformidade.filter(i => i.status === 'pendente').length;
    const temPV = !!(c.primeiro_valor_prometido || '').trim() && !!c.primeiro_valor_data;
    const respondidas = d.onboarding ? contarRespondidas(d.onboarding.respostas) : 0;
    const diasPV = c.primeiro_valor_data ? diasAte(c.primeiro_valor_data) : null;

    return [
      { rot:'Respostas', aba:'respostas', feito: d.onboarding ? 1 : 0, total:1,
        cifra: d.onboarding ? respondidas + '/24' : '—', qual: d.onboarding ? 'respondidas' : 'nada vinculado' },
      { rot:'Acessos', aba:'acessos', feito: acessosOk, total: acessosUteis.length || 1,
        cifra: acessosUteis.length ? acessosOk + '/' + acessosUteis.length : '—',
        qual: acessosUteis.length ? 'em mãos' : 'lista não criada' },
      { rot:'Baseline', aba:'baseline', feito: d.baselines.length ? 1 : 0, total:1,
        cifra: d.baselines.length ? String(d.baselines.length) : '—',
        qual: d.baselines.length ? 'congelados' : 'nada congelado' },
      { rot:'Metas', aba:'metas', feito: metasComFracasso, total: d.metas.length || 1,
        cifra: d.metas.length ? metasComFracasso + '/' + d.metas.length : '—',
        qual: d.metas.length ? 'com fracasso' : 'nenhuma meta' },
      { rot:'Primeiro valor', aba:'respostas', feito: temPV ? 1 : 0, total:1,
        cifra: diasPV === null ? '—' : (diasPV < 0 ? Math.abs(diasPV) + 'd' : diasPV + 'd'),
        qual: diasPV === null ? 'sem data' : (diasPV < 0 ? 'de atraso' : 'pra vencer') },
      { rot:'Conformidade', aba:'conformidade',
        feito: d.conformidade.length ? d.conformidade.length - confSemVeredito : 0,
        total: d.conformidade.length || 1,
        cifra: d.conformidade.length ? (d.conformidade.length - confSemVeredito) + '/' + d.conformidade.length : '—',
        qual: d.conformidade.length ? 'com veredito' : 'nada avaliado' },
    ];
  }

  function termometro(c){
    const etapas = etapasDoCliente(c);
    const prontas = etapas.filter(e => e.feito >= e.total).length;
    const pct = Math.round((prontas / etapas.length) * 100);

    const box = el('div',{class:'bloco'});
    const topo = el('div',{class:'termo-topo'});
    topo.appendChild(el('p',{class:'rot'},'Como está o onboarding'));
    topo.appendChild(el('span',{style:'font-family:var(--display);font-weight:700;font-size:1.05rem'},
      prontas + ' de ' + etapas.length + ' etapas de pé'));
    box.appendChild(topo);

    const barra = el('div',{class:'trilha'});
    barra.appendChild(el('i',{style:'width:'+pct+'%'}));
    box.appendChild(barra);

    const grade = el('div',{class:'etapas'});
    etapas.forEach((e2, i)=>{
      const estado = e2.feito >= e2.total ? 'feito' : (e2.feito > 0 ? 'meio' : 'falta');
      const b = el('button',{class:'etapa '+estado, onclick:()=>irAba(e2.aba)});
      b.innerHTML = '<span class="cab"><span class="bola"></span><em>' + String(i+1).padStart(2,'0') + ' ' + esc(e2.rot.toUpperCase()) + '</em></span>'
        + '<span class="n">' + esc(e2.cifra) + '</span>'
        + '<span class="q">' + esc(e2.qual) + '</span>';
      grade.appendChild(b);
    });
    box.appendChild(grade);
    return box;
  }

  // Primeiro valor: a promessa pequena com data marcada que sustenta a relacao
  // enquanto o numero que o cliente quer ver ainda nao se moveu (Lacuna #5).
  function blocoPrimeiroValor(c){
    const box = el('div',{class:'card', style:'margin-top:18px;border-width:2px'});
    const tem = !!(c.primeiro_valor_prometido || '').trim();

    const topo = el('div',{style:'display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:baseline'});
    topo.appendChild(el('p',{class:'rot laranja', style:'margin:0'},'Primeiro valor prometido'));
    topo.appendChild(el('button',{class:'linkbtn', style:'color:#6E6E6E',
      onclick:()=>{ state.editandoPV = !state.editandoPV; render(); }}, state.editandoPV ? 'cancelar' : (tem ? 'editar' : 'definir')));
    box.appendChild(topo);

    if(!state.editandoPV){
      if(tem){
        box.appendChild(el('p',{style:'margin:8px 0 0;font-size:1.05rem;line-height:1.45'}, esc(c.primeiro_valor_prometido)));
        const linha = el('div',{style:'margin-top:10px;display:flex;gap:9px;flex-wrap:wrap;align-items:center'});
        if(c.primeiro_valor_data){
          const hoje = new Date(); hoje.setHours(0,0,0,0);
          const alvo = new Date(c.primeiro_valor_data + 'T00:00:00');
          const dias = Math.round((alvo - hoje) / 86400000);
          linha.appendChild(el('span',{class:'selo'},'até ' + soData(c.primeiro_valor_data)));
          if(dias > 0) linha.appendChild(el('span',{class:'selo'}, 'faltam ' + dias + (dias === 1 ? ' dia' : ' dias')));
          else if(dias === 0) linha.appendChild(el('span',{class:'selo aviso'},'é hoje'));
          else linha.appendChild(el('span',{class:'selo aviso'}, 'atrasado há ' + Math.abs(dias) + (dias === -1 ? ' dia' : ' dias')));
        } else {
          linha.appendChild(el('span',{class:'selo aviso'},'sem data — promessa sem data não conta'));
        }
        box.appendChild(linha);
      } else {
        box.appendChild(el('p',{class:'muted', style:'margin:10px 0 0'},
          'Nada declarado ainda. Primeiro valor não é o resultado prometido: é a primeira vez que o cliente percebe que a decisão foi certa — e precisa acontecer entre 14 e 30 dias, com data dita no kickoff.'));
      }
      return box;
    }

    const form = el('form',{style:'margin-top:14px'});
    const g = el('div',{class:'grid2'});
    g.appendChild(campo('O que ele vai perceber, e quando','primeiro_valor_prometido','text', c.primeiro_valor_prometido || ''));
    g.appendChild(campo('Data prometida','primeiro_valor_data','date', c.primeiro_valor_data || ''));
    form.appendChild(g);
    form.appendChild(el('p',{class:'muted', style:'margin:0 0 12px;font-size:0.84rem'},
      'Candidatos que funcionam em 14 dias: ele passa a saber quantas pessoas chegam por dia e por onde; o tempo de resposta cai de horas para minutos; o diagnóstico de conformidade; o perfil corrigido com antes e depois. Ranqueamento e cliente novo não servem — chegam tarde demais.'));
    form.appendChild(el('button',{class:'btn small', type:'submit'},'Salvar'));
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const d = lerForm(form);
      if(await atualizar('clientes', c.id, d)){
        toast('Primeiro valor registrado.');
        state.editandoPV = false;
        await carregarTudo(); render();
      }
    });
    box.appendChild(form);
    return box;
  }

  // Placar reaproveitado no topo das abas: número grande, rótulo pequeno.
  function placar(itens){
    const box = el('div',{class:'placares'});
    itens.forEach(i=>{
      if(i.esconderSeZero && !i.valor) return;
      const p = el('div',{class:'p'+(i.destaca?' destaca':'')});
      p.appendChild(el('b',{}, String(i.valor)));
      p.appendChild(el('span',{}, esc(i.rotulo)));
      if(i.de){
        const b = el('div',{class:'minibarra'});
        b.appendChild(el('i',{style:'width:'+Math.round((i.parte/i.de)*100)+'%'}));
        p.appendChild(b);
      }
      box.appendChild(p);
    });
    return box;
  }

  function abaAcessos(c){
    const box = el('div');
    const linhas = state.detalhe.acessos;
    const uteis = linhas.filter(l => l.status !== 'nao_aplicavel');
    const recebidos = uteis.filter(l => l.status === 'recebido').length;
    const travados = linhas.filter(l => l.status === 'bloqueado').length;
    const naoPedidos = linhas.filter(l => l.status === 'pendente').length;

    if(linhas.length){
      box.appendChild(placar([
        { rotulo:'Na nossa mão', valor: recebidos + ' de ' + uteis.length, destaca:true,
          parte:recebidos, de:Math.max(uteis.length,1) },
        { rotulo:'Travados', valor: travados, esconderSeZero:true },
        { rotulo:'Ninguém pediu', valor: naoPedidos, esconderSeZero:true },
      ]));
    } else {
      const wrap = el('div',{style:'margin:0 0 18px'});
      wrap.appendChild(el('button',{class:'btn small', onclick:async()=>{
        const novas = ACESSOS_PADRAO.map((recurso, i) => ({ cliente_id:c.id, recurso, ordem:i }));
        if(await inserir('acessos', novas)){ await carregarDetalhe(c.id); render(); }
      }},'Criar a lista padrão de acessos'));
      wrap.appendChild(el('span',{class:'dica'},'Cria as 8 contas que a gente sempre precisa, todas como "ainda não pedimos". Depois é só ir mudando o status.'));
      box.appendChild(wrap);
    }

    box.appendChild(secao({
      tabela:'acessos', cliente:c, linhas,
      vazio:{ titulo:'Nenhum acesso mapeado ainda',
              texto:'Comece pela lista padrão acima e vá marcando quem detém cada conta.' },
      rotuloAdd:'+ adicionar acesso',
      colunas:[
        {rotulo:'Conta', chave:'recurso', forte:true},
        {rotulo:'Situação', chave:'status', chip:'acessos_status'},
        {rotulo:'Com quem está', chave:'quem_detem'},
        {rotulo:'Pedimos em', valor:l=> l.solicitado_em ? soData(l.solicitado_em) : null},
        {rotulo:'Chegou em', valor:l=> l.recebido_em ? soData(l.recebido_em) : null},
        {rotulo:'Observação', chave:'nota'},
      ],
      campos:[
        {rotulo:'Qual conta', nome:'recurso', dica:'Ex.: Instagram, WhatsApp comercial, Perfil da Empresa'},
        {rotulo:'Situação', nome:'status', grupo:'acessos_status', padrao:'pendente'},
        {rotulo:'Com quem está', nome:'quem_detem', dica:'A pessoa de verdade. "Sobrinho da dona" é resposta válida e útil.'},
        {rotulo:'Pedimos em', nome:'solicitado_em', tipo:'date'},
        {rotulo:'Chegou em', nome:'recebido_em', tipo:'date'},
        {rotulo:'Observação', nome:'nota', tipo:'textarea', dica:'O que está atrapalhando, ou o que precisa ser feito antes.'},
      ],
      validar:d=> d.recurso ? null : 'Diga qual é o acesso.',
    }));
    return box;
  }

  function abaRespostas(){
    const on = state.detalhe.onboarding;
    if(!on){
      const v = el('div',{class:'vazio'});
      v.appendChild(el('strong',{},'Nenhuma resposta vinculada'));
      v.appendChild(el('span',{},'Quando alguém enviar o formulário, a resposta cai na caixa de entrada. De lá, você liga ela a este cliente.'));
      return v;
    }
    const box = el('div');
    box.appendChild(el('p',{class:'mono muted', style:'font-size:0.7rem;margin:0 0 18px'},
      'Recebido em '+dataBR(on.recebido_em)+' · '+contarRespondidas(on.respostas)+' de 24 respondidas'));
    box.appendChild(blocoRespostas(on.respostas));
    return box;
  }

  function blocoRespostas(respostas){
    const box = el('div');
    const r = respostas || {};
    SECOES.forEach(sec=>{
      box.appendChild(el('p',{class:'secname'}, esc(sec.titulo)));
      sec.perguntas.forEach(([chave, pergunta])=>{
        const v = (r[chave]||'').trim();
        const d = el('div',{class:'qa'+(v?'':' vazia')});
        d.appendChild(el('div',{class:'q'}, esc(pergunta)));
        d.appendChild(el('div',{class:'a'}, v ? esc(v) : 'Não respondido'));
        box.appendChild(d);
      });
    });
    return box;
  }

  // ---------- página de 90 dias do cliente ----------

  // Folha de estilo da página do cliente. Vive aqui como texto porque o
  // arquivo gerado precisa ser um HTML só, sem nada carregado de fora
  // além da fonte — pra poder ser mandado por WhatsApp e continuar funcionando.
  const CSS_PAGINA_CLIENTE = `
:root{
    --papel:#FBFAF8;
    --superficie:#FFFFFF;
    --tinta:#0A0A0A;
    --cinza:#6B6864;
    --linha:#E3DFDA;
    --laranja:#FF5E00;
    --roxo:#8800FF;
    --nosso:#0A0A0A;
    --deles:#8800FF;
    --display:'Space Grotesk','Segoe UI',sans-serif;
    --corpo:'Archivo','Helvetica Neue',Arial,sans-serif;
    --dado:'Space Mono','SFMono-Regular',Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --papel:#0C0B0A;
      --superficie:#151412;
      --tinta:#F4F2EF;
      --cinza:#9C9791;
      --linha:#2E2B27;
      --laranja:#FF7A2E;
      --roxo:#B166FF;
      --nosso:#F4F2EF;
      --deles:#B166FF;
    }
  }
  :root[data-theme="dark"]{
    --papel:#0C0B0A;
    --superficie:#151412;
    --tinta:#F4F2EF;
    --cinza:#9C9791;
    --linha:#2E2B27;
    --laranja:#FF7A2E;
    --roxo:#B166FF;
    --nosso:#F4F2EF;
    --deles:#B166FF;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--papel); color:var(--tinta);
    font-family:var(--corpo); font-size:16px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .folha{ max-width:760px; margin:0 auto; padding:0 22px 96px; }

  .rotulo{
    font-family:var(--dado); font-size:0.66rem; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--cinza); margin:0;
  }
  .rotulo.laranja{ color:var(--laranja); }

  /* ---- cabeçalho ---- */
  header{ padding:56px 0 34px; border-bottom:3px solid var(--tinta); }
  header h1{
    font-family:var(--display); font-weight:700; font-size:clamp(2.1rem,7vw,3.1rem);
    line-height:1.02; letter-spacing:-0.025em; margin:14px 0 0; text-wrap:balance;
  }
  header h1 em{ font-style:normal; color:var(--laranja); }
  .subcab{
    display:flex; flex-wrap:wrap; gap:10px 26px; margin-top:22px;
    font-family:var(--dado); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--cinza);
  }
  .subcab b{ color:var(--tinta); font-weight:700; }

  .aviso{
    margin:26px 0 0; padding:16px 18px; background:var(--superficie);
    border:1px solid var(--linha); border-left:4px solid var(--laranja);
    font-size:0.94rem; line-height:1.55;
  }

  /* ---- seções ---- */
  section{ padding-top:52px; }
  section > h2{
    font-family:var(--display); font-weight:700; font-size:1.5rem; letter-spacing:-0.015em;
    margin:8px 0 6px; text-wrap:balance;
  }
  section > p.intro{ color:var(--cinza); font-size:0.95rem; margin:0 0 22px; max-width:62ch; }

  /* ---- promessa ---- */
  .promessa{
    background:var(--tinta); color:var(--papel); padding:30px 28px;
    display:grid; gap:16px;
  }
  .promessa .rotulo{ color:var(--laranja); }
  .promessa p{
    font-family:var(--display); font-weight:500; font-size:clamp(1.15rem,3.6vw,1.5rem);
    line-height:1.32; margin:0; letter-spacing:-0.01em;
  }
  .promessa .data{
    font-family:var(--dado); font-size:0.74rem; letter-spacing:0.08em; text-transform:uppercase;
    border-top:1px solid rgba(255,255,255,0.22); padding-top:14px; color:#C9C5C0;
  }
  .promessa .data b{ color:var(--laranja); }

  /* ---- tabelas ---- */
  .rolagem{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:0.9rem; }
  th{
    font-family:var(--dado); font-size:0.62rem; letter-spacing:0.11em; text-transform:uppercase;
    color:var(--cinza); font-weight:400; text-align:left;
    padding:0 14px 8px 0; border-bottom:2px solid var(--tinta); white-space:nowrap;
  }
  td{ padding:12px 14px 12px 0; border-bottom:1px solid var(--linha); vertical-align:top; line-height:1.45; }
  tr:last-child td{ border-bottom:none; }
  td.num{ font-family:var(--dado); font-variant-numeric:tabular-nums; white-space:nowrap; font-size:0.95rem; }
  td.ressalva{ color:var(--cinza); font-size:0.82rem; line-height:1.4; }
  .metrica{ font-weight:600; }

  /* ---- metas ---- */
  .meta{ border-top:1px solid var(--linha); padding:20px 0; }
  .meta:first-of-type{ border-top:2px solid var(--tinta); }
  .meta h3{
    font-family:var(--display); font-size:1.02rem; font-weight:700; margin:0 0 3px; letter-spacing:-0.01em;

  .meta .tipo{
    font-family:var(--dado); font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase;

  /* ---- trilhos ---- */
  .trilhos{ display:grid; gap:0; }
  .passo{
    display:grid; grid-template-columns:88px 1fr; gap:0 20px;
    padding:16px 0 16px 0; border-bottom:1px solid var(--linha);
  }
  .passo:first-child{ border-top:2px solid var(--tinta); }
  .passo .quando{
    font-family:var(--dado); font-size:0.72rem; letter-spacing:0.06em; color:var(--cinza);
    font-variant-numeric:tabular-nums; padding-top:3px;
  }
  .passo .conteudo{ border-left:3px solid var(--nosso); padding-left:16px; }
  .passo.deles .conteudo{ border-left-color:var(--deles); }
  .passo h3{ font-family:var(--display); font-size:1rem; font-weight:700; margin:0; letter-spacing:-0.005em; }
  .passo p{ margin:4px 0 0; font-size:0.9rem; color:var(--cinza); line-height:1.45; }
  .dono{
    font-family:var(--dado); font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase;
    margin-left:9px; padding:2px 6px; white-space:nowrap; vertical-align:2px;
  }
  .dono.nos{ border:1px solid var(--linha); color:var(--cinza); }
  .dono.cliente{ background:var(--deles); color:#fff; }
  @media (max-width:520px){
    .passo{ grid-template-columns:1fr; gap:6px; }
    .passo .quando{ padding-top:0; }
    .passo .conteudo{ border-left-width:3px; }
  }

  /* ---- o que depende de vocês ---- */
  .voces{ border:2px solid var(--deles); background:var(--superficie); padding:26px 24px; }
  .voces > .rotulo{ color:var(--deles); }
  .voces h2{ font-family:var(--display); font-size:1.35rem; margin:10px 0 6px; letter-spacing:-0.015em; }
  .voces > p{ color:var(--cinza); font-size:0.93rem; margin:0 0 20px; }
  .lista{ display:grid; gap:0; }
  .item{ display:flex; gap:14px; align-items:flex-start; padding:13px 0; border-top:1px solid var(--linha); }
  .item:first-child{ border-top:none; padding-top:0; }
  .caixa{
    width:16px; height:16px; border:2px solid var(--deles); flex:0 0 auto; margin-top:3px;

  // reescrito ao salvar — por isso editar, salvar, reabrir e editar de novo

  function coletar(){
    var blocos = {}, mudancas = [], extras = {}, itens = {};
    editaveis().forEach(function(n){
      var txt = limpa(n.innerText);
      var orig = limpa(n.getAttribute('data-orig'));
      var fonte = n.getAttribute('data-fonte');
      if(fonte === 'bloco'){
        if(txt !== orig) blocos[n.getAttribute('data-slot')] = txt;
      } else if(fonte === 'extra-secao'){
        var id = n.getAttribute('data-id');

      } else if(fonte === 'extra-item'){

  }
})();

  // Monta o arquivo que o cliente lê. Mesmo objeto em dois momentos: no dia 0 é o
  // plano, no dia 90 é o relatório. Sai daqui com os dados desta ficha, sem
  // ninguém redigitar nada — e sem inventar: o que não está no banco não aparece.
  function montarPaginaCliente(c){
    const d = state.detalhe;
    const blocos = (d.pagina && d.pagina.blocos) || {};
    const nome = c.nome_preferido || c.nome;
    const base = c.inicio_contrato ? new Date(c.inicio_contrato + 'T00:00:00') : HOJE();
    const dia = Math.max(0, Math.round((HOJE() - base) / 86400000));
    const maisDias = n => {
      const x = new Date(base); x.setDate(x.getDate() + n);
      return x.toLocaleDateString('pt-BR', { day:'2-digit', month:'short' }).replace('.','');
    };
    const E = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const porExtenso = iso => {
      if(!iso) return '';
      const x = new Date(String(iso).slice(0,10) + 'T00:00:00');

    };

    // Todo trecho editável carrega de onde veio e qual era o valor original.
    // data-orig é gravado aqui, e não pelo editor ao abrir: assim o arquivo pode
    // ser salvo e reaberto várias vezes sem perder a referência do que a Central
    // tem — a lista de mudanças continua correta na terceira edição.
    const edBloco = (slot, texto) =>
      ' data-ed="1" data-fonte="bloco" data-slot="' + slot + '" data-orig="' + E(texto) + '"';
    const edFato = (tabela, id, campo, texto) =>
      ' data-ed="1" data-fonte="' + tabela + '" data-id="' + id + '" data-campo="' + campo + '" data-orig="' + E(texto) + '"';
    const B = (slot, padrao) => {
      const v = blocos[slot];
      return (v != null && String(v).trim()) ? String(v) : padrao;
    };
    // Bloco de prosa: o texto que sai é o override, se houver; o data-orig é
    // sempre o padrão, para o editor saber o que de fato mudou.
    const prosa = (slot, padrao) => ({ txt: B(slot, padrao), attr: edBloco(slot, padrao) });

    // depois que o cliente leu — em vez de trocar em silêncio.
    const notaCorrecao = id => {

      return '<p class="correcao">Corrigido em ' + E(soData(ultima.corrigido_em || new Date().toISOString()))
        + (ultima.motivo ? ' — ' + E(ultima.motivo) : '') + '</p>';
    };

    // --- ponto de partida
    const linhasBase = d.baselines.map(b => '<tr>'
      + '<td class="metrica"><span' + edFato('baselines', b.id, 'metrica', b.metrica) + '>' + E(b.metrica) + '</span></td>'
      + '<td class="num">' + E(b.valor != null ? b.valor + (b.unidade ? ' ' + b.unidade : '') : (b.valor_texto || '?')) + '</td>'

        + '<div class="marcos-meta">'
        +   '<div><p class="rotulo">Dia 30</p><p' + edFato('metas', m.id, 'sucesso_30', m.sucesso_30 || '') + '>' + E(m.sucesso_30 || 'Sem meta') + '</p></div>'
        +   '<div><p class="rotulo">Dia 90</p><p' + edFato('metas', m.id, 'sucesso_90', m.sucesso_90 || '') + '>' + E(m.sucesso_90 || 'Sem meta') + '</p></div>'

        + notaCorrecao(m.id)

    const passos = d.marcos.slice().sort((a,b)=>

        : '—';

    const marcosDeles = d.marcos.filter(m => m.responsavel === 'cliente' && !m.data_cumprida);
    const extras = Array.isArray(blocos.itens_extra) ? blocos.itens_extra : [];

    const itemHtml = (oq, obs, attrOq, attrObs, removivel) =>
      '<div class="item"' + (removivel ? ' data-extra-item="1"' : '') + '><div class="caixa"></div><div class="corpo">'
      + '<div class="oq"' + (attrOq||'') + '>' + E(oq) + '</div>'

    // acesso se mexe na Central, onde a tela Agora também enxerga.

    const INTRO_PARTIDA = prosa('intro_partida', 'Congelado antes de mexermos em qualquer coisa. A última coluna é o que há de frágil em cada número — dizemos agora para ninguém tratar estimativa como medida daqui a três meses.');

    return '<!doctype html>\n<html lang="pt-BR">\n<head>\n<meta charset="utf-8">\n'
