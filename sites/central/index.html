          + (x.confianca === 'pouco'
            ? 'Isso é pouco demais pra concluir qualquer coisa: uma gravação longa a mais muda a margem inteira. Olhe como rascunho.'
            : 'Já dá pra ver tendência, mas ainda não pra mexer em preço. A conta fica firme com o mês fechado.')));
      }
      m.appendChild(av);
    }

    // --- falta o custo mensal
    if(x.custoHora == null){
      const f = el('div',{class:'bloco falta'});
      f.appendChild(el('p',{class:'rot laranja'},'Falta um número'));
      f.appendChild(el('h2',{class:'titulo-bloco'},'Quanto a Bora custa por mês'));
      f.appendChild(el('p',{class:'intro'},
        'Sem isso não existe custo por hora, e sem custo por hora não existe margem. '
        + 'Some o que sai todo mês independentemente de quantos clientes existem: ferramentas, impostos, '
        + 'contador, internet, e o pró-labore que vocês dois querem tirar. É um alvo, não um extrato — '
        + 'melhor um número aproximado hoje que nenhum número.'));
      f.appendChild(el('button',{class:'btn', style:'margin-top:16px',
        onclick:()=>{ const i = document.querySelector('#custo-mensal'); if(i){ i.focus(); i.scrollIntoView({block:'center'}); } }},
        'Preencher agora'));
      m.appendChild(f);
    }

    // --- os números do mês
    const nums = el('div',{class:'bloco'});
    nums.appendChild(el('p',{class:'rot'},'O mês em quatro números'));
    nums.appendChild(placar([
      { rotulo:'Custo por hora', valor: x.custoHora == null ? '—' : reais(x.custoHora), destaca:true },
      { rotulo:'Receita contratada', valor: reais(x.receitaMes) },
      { rotulo:'Horas apontadas', valor: emHoras(x.minTotal) },
      { rotulo:'Delas, em cliente', valor: emHoras(x.minCliente),
        parte:x.minCliente, de:Math.max(x.minTotal,1) },
    ]));

    // A conta à mostra. Número que ninguém consegue refazer não é usado —
    // é obedecido ou ignorado, e as duas coisas são ruins.
    const conta = el('details',{class:'expl'});
    conta.appendChild(el('summary',{},'Como o custo por hora é calculado'));
    const p = el('div',{class:'corpo-expl'});
    p.appendChild(el('p',{},
      x.pessoas + (x.pessoas === 1 ? ' pessoa' : ' pessoas') + ' × ' + x.horaSem + ' h por semana × 4,345 semanas = <b>'
      + x.horasDisponiveis.toFixed(0) + ' h por mês</b> de tempo existente.'));
    p.appendChild(el('p',{},
      'Nem todo esse tempo é entregável: proposta, reunião interna, erro e conserto não viram fatura. '
      + 'A pesquisa põe a utilização sustentável entre 70% e 75% — acima disso queima gente. '
      + 'A ' + porcento(x.utilAlvo) + ' sobram <b>' + x.horasFaturaveis.toFixed(0) + ' h faturáveis por mês</b>.'));
    p.appendChild(el('p',{}, x.custoMensal == null
      ? 'Falta o custo mensal da agência pra fechar a conta.'
      : reais(x.custoMensal) + ' de custo mensal ÷ ' + x.horasFaturaveis.toFixed(0)
        + ' h = <b>' + reais(x.custoHora) + ' por hora</b>. É esse o número que cada hora de trabalho precisa cobrir antes de sobrar lucro.'));
    conta.appendChild(p);
    nums.appendChild(conta);
    m.appendChild(nums);

    // --- margem por cliente
    const mc = el('div',{class:'bloco'});
    mc.appendChild(el('p',{class:'rot'},'Margem de entrega, cliente por cliente'));
    mc.appendChild(el('p',{class:'intro', style:'margin-bottom:16px'},
      'Receita menos o custo das horas que ele consumiu, sobre a receita. O alvo de ' + porcento(x.margemAlvo)
      + ' por conta vem da pesquisa (Parakeeto, via Bloco A). Quem está no topo da lista é quem está pior.'));
    if(!x.porCliente.length){
      mc.appendChild(el('p',{class:'dica'},'Nenhum cliente ativo, em onboarding ou pausado.'));
    } else {
      const tab = el('div',{class:'rolagem'});
      const t = el('table');
      t.innerHTML = '<thead><tr><th>Cliente</th><th>Recebe</th><th>Horas</th>'
        + '<th>R$ por hora</th><th>Custo da entrega</th><th>Margem</th></tr></thead>';
      const tb = el('tbody');
      x.porCliente.forEach(l=>{
        const tr = el('tr');
        const td1 = el('td');
        td1.appendChild(el('button',{class:'linkbtn', onclick:()=>abrirCliente(l.c.id,'horas')}, esc(l.c.nome)));
        if(!l.min) td1.appendChild(el('span',{class:'dica', style:'display:block;margin:2px 0 0'},'sem horas apontadas'));
        tr.appendChild(td1);
        tr.appendChild(el('td',{class:'num-col'}, l.receita ? reais(l.receita) : '<span class="dica">sem valor na ficha</span>'));
        tr.appendChild(el('td',{class:'num-col'}, emHoras(l.min)));
        tr.appendChild(el('td',{class:'num-col'}, l.reaisHora == null ? '—' : reais(l.reaisHora)));
        tr.appendChild(el('td',{class:'num-col'}, l.custo == null ? '—' : reais(l.custo)));
        const tdm = el('td');
        if(l.margem == null) tdm.appendChild(el('span',{class:'dica'},
          !l.receita ? 'falta o valor mensal' : (x.custoHora == null ? 'falta o custo mensal' : '—')));
        else tdm.appendChild(medidor(l.margem, x.margemAlvo));
        tr.appendChild(tdm);
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      tab.appendChild(t);
      mc.appendChild(tab);
      const pior = x.porCliente.find(l => l.margem != null && l.margem < x.margemAlvo);
      if(pior && x.confianca === 'ok'){
        mc.appendChild(el('p',{class:'intro', style:'margin-top:16px'},
          '<b>' + esc(pior.c.nome) + '</b> está abaixo do alvo. As saídas são três, nesta ordem: '
          + 'cortar escopo (o que está sendo entregue e não foi combinado?), '
          + 'reduzir o tempo por entrega, ou reajustar o preço no fim do contrato. '
          + 'A pesquisa avisa que retainer sem escopo definido vira contrato ilimitado, '
          + 'e que os maiores clientes acabam sendo os menos lucrativos justamente por isso.'));
      }
    }
    m.appendChild(mc);

    // --- onde vai o tempo
    const ot = el('div',{class:'bloco'});
    ot.appendChild(el('p',{class:'rot'},'Onde vai o tempo'));
    const visao = el('div',{class:'visao', style:'margin:14px 0 18px'});
    [['tipo','Tipo de trabalho'],['cliente','Cliente'],['quem','Quem fez']].forEach(([k,rot])=>{
      visao.appendChild(el('button',{'aria-selected':String(state.visaoTempo === k),
        onclick:()=>{ state.visaoTempo = k; render(); }}, rot));
    });
    ot.appendChild(visao);
    if(!x.noMes.length){
      ot.appendChild(el('p',{class:'dica'},'Nada apontado neste mês.'));

      const chave = h => {
        if(state.visaoTempo === 'cliente'){
          const c = h.cliente_id && state.clientes.find(y => y.id === h.cliente_id);
          return c ? c.nome : 'Interno (sem cliente)';

        if(state.visaoTempo === 'quem') return h.quem || 'Sem dono';
        return rotulo('horas_categoria', h.categoria) || 'Outro';

        .sort((a,b)=> b.valor - a.valor);

      ot.appendChild(el('p',{class:'dica', style:'margin-top:14px'},

        + 'não automatize um processo que você ainda não executou dez vezes à mão.'));
    }
    m.appendChild(ot);

    // --- quanto custa uma peça
    if(x.pecas && x.minConteudo){
      const porPeca = x.minConteudo / x.pecas;
      const pp = el('div',{class:'bloco'});
      pp.appendChild(el('p',{class:'rot'},'Quanto custa uma peça'));
      pp.appendChild(el('p',{class:'intro'},
        '<b>' + x.pecas + (x.pecas === 1 ? ' peça foi ao ar' : ' peças foram ao ar') + '</b> neste mês, '
        + 'e o trabalho de conteúdo (gravar, editar, publicar) somou <b>' + emHoras(x.minConteudo) + '</b>. '
        + 'Dá <b>' + emHoras(Math.round(porPeca)) + ' por peça</b>'
        + (x.custoHora == null ? '.' : ', ou <b>' + reais((porPeca/60) * x.custoHora) + ' de custo cada uma</b>.')));
      pp.appendChild(el('p',{class:'dica', style:'margin-top:12px'},
        'Conta as peças das tarefas de publicação concluídas — o que foi ao ar de verdade. '
        + 'Contar de novo na gravação e na edição contaria a mesma peça três vezes, e é esse número '
        + 'que decide se o pacote de dez peças cabe no preço.'));
      m.appendChild(pp);
    }

    // --- capacidade
    const cap = el('div',{class:'bloco'});
    cap.appendChild(el('p',{class:'rot'},'Quanto ainda cabe'));
    if(x.cabem == null){
      cap.appendChild(el('p',{class:'intro'},
        'Depende de saber quantas horas um cliente consome por mês, e isso só aparece depois de um mês apontado.'));
    } else {
      cap.appendChild(el('p',{class:'intro'},
        'Um cliente consumiu, em média, <b>' + emHoras(Math.round(x.mediaMinCliente)) + '</b> neste mês. '
        + 'Com ' + x.horasFaturaveis.toFixed(0) + ' h faturáveis, cabem <b>'
        + Math.floor(x.cabem) + (Math.floor(x.cabem) === 1 ? ' cliente' : ' clientes') + '</b> como esse — '
        + 'contando que o resto da operação continue igual.'));
      const jaTem = x.porCliente.length;
      cap.appendChild(el('p',{class:'intro', style:'margin-top:10px'},
        'Hoje são ' + jaTem + (jaTem === 1 ? ' cliente' : ' clientes') + '. '
        + (jaTem >= Math.floor(x.cabem)
          ? 'A conta diz que a agenda está no limite: cliente novo daqui exige tirar trabalho de outro lugar ou subir o preço.'
          : 'Sobram ' + (Math.floor(x.cabem) - jaTem) + ' vagas pela conta das horas — o gargalo real pode ser outro.')));
    }
    m.appendChild(cap);

    // --- configuração
    m.appendChild(blocoConfigEconomia(x));
    return m;
  }

      { c:'margem_alvo', r:'Margem de entrega desejada', pct:true, passo:'1',
        d:'Quanto da mensalidade deve sobrar depois de pagar as horas. O alvo de mercado por conta é 70%.' },

    const grade = el('div',{class:'props economia'});
    campos.forEach(f=>{

      const linha = el('div',{class:'prop alto'});

      rot.appendChild(el('span',{class:'dica', style:'display:block;margin:3px 0 0;max-width:44ch'}, esc(f.d)));
      linha.appendChild(rot);
      const cx = el('div',{class:'v', style:'display:flex;gap:8px;align-items:center'});
      const bruto = e[f.c];
      const i = el('input',{ type:'number', step:f.passo, min:'0',

      if(f.id) i.id = f.id;
      i.addEventListener('change', async ()=>{

        if(f.pct){
          if(v <= 0 || v > 100){ toast('Use um número entre 1 e 100.'); i.value = Math.round(Number(bruto)*100); return; }
          v = v/100;
        }
        if(!f.pct && v <= 0 && f.c !== 'custo_mensal'){ toast('Precisa ser maior que zero.'); i.value = bruto; return; }
        await grava(f.c, v);
      });
      cx.appendChild(i);
      if(f.pct) cx.appendChild(el('span',{class:'dica', style:'margin:0'},'%'));
      if(f.c === 'custo_mensal') cx.appendChild(el('span',{class:'dica', style:'margin:0'},'por mês'));
      linha.appendChild(cx);
      grade.appendChild(linha);
    });
    box.appendChild(grade);
    return box;
  }

  // ---------- por onde se perde (funil) ----------

  // A oportunidade guardava só onde está. Agora um gatilho no banco anota toda
  // mudança de etapa, e isso responde duas perguntas que antes não tinham
  // resposta: onde a conversa morre, e quanto tempo leva do primeiro contato
  // até fechar. Não dava pra reconstruir depois — por isso o registro começou
  // antes de o funil encher.
  function blocoPorOndeSePerde(){
    const ev = state.funilEventos || [];
    const box = el('div',{class:'bloco'});
    box.appendChild(el('p',{class:'rot'},'Por onde se perde'));

    const porOp = {};
    ev.forEach(e => { (porOp[e.oportunidade_id] = porOp[e.oportunidade_id] || []).push(e); });
    const trilhas = Object.keys(porOp).map(id => porOp[id].slice()
      .sort((a,b)=> String(a.em).localeCompare(String(b.em))));

    const fechados = trilhas.filter(t => t[t.length-1].para === 'fechado');
    const perdidos = trilhas.filter(t => t[t.length-1].para === 'perdido');

    if(trilhas.length < 5){
      box.appendChild(el('p',{class:'intro'},
        'A Central passou a anotar cada mudança de etapa. Com ' + trilhas.length
        + (trilhas.length === 1 ? ' oportunidade registrada' : ' oportunidades registradas')
        + ', ainda não há o que ler aqui — mas o histórico já está sendo guardado, '
        + 'e ele não daria pra reconstruir depois. Volte quando tiver umas quinze.'));
      return box;
    }

    const ORDEM = ['mapeado','contatado','conversando','reuniao','proposta'];
    const itens = ORDEM.map(et=>{
      const passaram = trilhas.filter(t => t.some(e => e.para === et)).length;
      const morreram = perdidos.filter(t=>{
        const i = t.findIndex(e => e.para === et);
        return i >= 0 && t[i+1] && t[i+1].para === 'perdido';
      }).length;
      return { etapa:et, passaram, morreram };
    }).filter(i => i.passaram);

    box.appendChild(el('p',{class:'intro', style:'margin-bottom:16px'},
      trilhas.length + ' oportunidades registradas · ' + fechados.length + ' fecharam · '
      + perdidos.length + ' se perderam.'));
    box.appendChild(barras(
      itens.map(i => ({ rotulo: rotulo('etapa_funil', i.etapa) + ' — perdeu ' + i.morreram + ' de ' + i.passaram,
        valor: i.passaram ? i.morreram / i.passaram : 0 })),
      v => Math.round(v*100) + '%'));

    if(fechados.length){
      const dias = fechados.map(t=>
        Math.round((new Date(t[t.length-1].em) - new Date(t[0].em)) / 86400000)).sort((a,b)=>a-b);
      const meio = dias[Math.floor(dias.length/2)];
      box.appendChild(el('p',{class:'intro', style:'margin-top:16px'},
        'Do primeiro registro até fechar, a mediana é de <b>' + meio
        + (meio === 1 ? ' dia' : ' dias') + '</b>. É esse o prazo que precisa caber no seu caixa.'));
    }
    return box;
  }

  // ---------- estúdio ----------

  // O que este lugar é e o que ele não é. Ele monta e exporta a peça — o
  // trabalho chato de diagramar dez slides no mesmo padrão, contar caractere de
  // legenda e lembrar da assinatura obrigatória. Ele NÃO escreve por você: não
  // há modelo de linguagem aqui, e não vai haver enquanto a chave tiver que
  // morar dentro de uma página estática, onde qualquer um lê o código-fonte.
  // O que ele faz é sair do papel em branco: escolhe o formato, preenche o
  // esqueleto com o que a ficha do cliente já sabe, e deixa você reescrever.

  const FORMATOS_PECA = [
    ['4:5', 'Retrato', 1080, 1350, 'O que ocupa mais tela no feed'],
    ['1:1', 'Quadrado', 1080, 1080, 'Clássico, cabe em qualquer lugar'],
  ];
  const medidas = f => FORMATOS_PECA.find(x => x[0] === f) || FORMATOS_PECA[0];

  const PRESETS_PECA = [
    ['papel',  'Papel',  'Fundo claro, texto escuro'],
    ['tinta',  'Tinta',  'Fundo escuro, texto claro'],
    ['cliente','Cor do cliente', 'Usa a cor guardada na ficha dele'],
  ];

  // Contraste é decidido aqui, não no olho: texto escuro ou claro conforme a
  // luminância do fundo. Uma peça bonita e ilegível não serve.
  function tintaSobre(fundo){
    const h = String(fundo || '#FFFFFF').replace('#','');
    const n = h.length === 3 ? h.split('').map(x=>x+x).join('') : h;
    const [r,g,b] = [0,2,4].map(i => parseInt(n.slice(i,i+2),16) / 255)
      .map(v => v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4));
    const L = 0.2126*r + 0.7152*g + 0.0722*b;
    return L > 0.42 ? '#141210' : '#FFFFFF';
  }
  const misturar = (a, b, t) => {
    const p = s => { const h = s.replace('#',''); const n = h.length===3 ? h.split('').map(x=>x+x).join('') : h;
      return [0,2,4].map(i => parseInt(n.slice(i,i+2),16)); };
    const [x,y] = [p(a), p(b)];
    return '#' + [0,1,2].map(i => Math.round(x[i]*(1-t) + y[i]*t).toString(16).padStart(2,'0')).join('');
  };

  function coresDoDeck(deck){
    const cor = deck.cor || '#FF5E00';
    const c2 = deck.cor2 || cor;
    if(deck.preset === 'tinta') return { fundo:'#141210', tinta:'#F5F2EC', apoio:'#9A938B', destaque:cor, faixa:c2 };
    if(deck.preset === 'cliente'){
      const t = tintaSobre(cor);
      return { fundo:cor, tinta:t, apoio: misturar(t, cor, 0.35), destaque:t, faixa:t };
    }
    return { fundo:'#F5F2EC', tinta:'#141210', apoio:'#6E675F', destaque:cor, faixa:c2 };
  }

  // ---------- conformidade do texto ----------

  // Profissões com conselho: o registro tem que aparecer na peça. Em educação
  // física isso é o Art. 4º da Resolução CONFEF 508/2023, e o Bloco C anotou
  // que é "a regra mais dura e a mais ignorada do mercado". Se está guardado na
  // ficha, o estúdio assina sozinho — e se não está, avisa antes de exportar.
  const REGULADAS = [
    ['educação física','CREF'], ['educacao fisica','CREF'], ['personal','CREF'],
    ['nutri','CRN'], ['odonto','CRO'], ['dentist','CRO'],
    ['medic','CRM'], ['psic','CRP'], ['advoc','OAB'], ['direito','OAB'],
  ];
  function conselhoDe(c){
    const v = String((c && c.vertical) || '').toLowerCase();
    const achou = REGULADAS.find(([chave]) => v.includes(chave));
    return achou ? achou[1] : null;
  }

  // Nada aqui é opinião sobre o texto: é uma lista de padrões que a pesquisa
  // aponta como risco. "Grave" é o que viola norma com folga; "aviso" é o que
  // depende de como for feito. O Bloco C é explícito: antes e depois honesto,
  // com autorização e sem prazo, não viola artigo nenhum que a gente tenha
  // achado — o que viola é "emagreça 10kg em 30 dias".
  const REGRAS_TEXTO = [
    { re:/\bgarant(o|e|ia|ido|idos|ida|idas)\b/i, nivel:'grave', oq:'promete resultado garantido',
      porq:'Resultado garantido é afirmação sem lastro e cai no Art. 5º XVII do Código de Ética, além do CDC.' },
    { re:/\bem\s+\d+\s*(dias?|semanas?|mes(es)?)\b/i, nivel:'grave', oq:'promete prazo',
      porq:'Prazo de resultado é o exemplo que a pesquisa dá de violação com folga.' },
    { re:/\b\d+\s*(kg|quilos?|cm|centímetros?)\b/i, nivel:'grave', oq:'promete número',
      porq:'Número prometido é promessa de resultado, mesmo sem a palavra "garantia".' },
    { re:/(queim\w+|elimin\w+|secar?)\s+(a\s+)?gordura\s+localizada/i, nivel:'grave',
      oq:'afirma queima de gordura localizada',
      porq:'É o exemplo de afirmação sem base técnica citado no Bloco C.' },
    { re:/\b(cura|curar|tratamento definitivo|milagr\w+)\b/i, nivel:'grave', oq:'fala em cura',
      porq:'Cura é termo de saúde e exige lastro que uma peça de rede social não tem.' },
    { re:/\bantes e depois\b/i, nivel:'aviso', oq:'usa antes e depois',
      porq:'Não é proibido por artigo: precisa de autorização de imagem, contexto, e nenhum prazo ou garantia junto.' },
    { re:/\bdepoimento\b/i, nivel:'aviso', oq:'usa depoimento',
      porq:'Mesma régua do antes e depois: autorização e nada de prazo ou número.' },
    { re:/\b(o melhor|a melhor|melhor que|mais barato que|o mais barato)\b/i, nivel:'aviso',
      oq:'compara com concorrente',
      porq:'Art. 10 § 2º veda aviltamento de honorários e concorrência desleal.' },
  ];

  function checarTexto(texto, cliente){
    const t = String(texto || '');
    const achados = [];
    REGRAS_TEXTO.forEach(r=>{
      const m = t.match(r.re);
      if(m) achados.push({ nivel:r.nivel, oq:r.oq, porq:r.porq, trecho:m[0] });
    });
    // Conformidade já registrada na ficha do cliente, para não repetir aviso
    // sobre o que já tem veredito escrito.
    const barrados = cliente
      ? (state.tudo.conformidade || []).filter(x => x.cliente_id === cliente.id && x.status === 'nao_conforme')
      : [];
    barrados.forEach(x => achados.push({ nivel:'grave', oq:'ficha marca "não pode publicar": ' + x.item,
      porq:(x.norma ? x.norma + '. ' : '') + 'Isso está registrado na aba Conformidade dele.', trecho:'' }));
    return achados;
  }

  function blocoConformidade(texto, cliente, assinatura){
    const achados = checarTexto(texto, cliente);
    const valeAssinatura = assinatura !== false;
    const conselho = valeAssinatura ? conselhoDe(cliente) : null;
    const box = el('div',{class:'confere'});
    if(conselho && !String(assinatura || '').trim()){
      achados.unshift({ nivel:'grave', oq:'sem o registro ' + conselho + ' na peça',
        porq:'Profissão com conselho exige nome e número do registro na publicidade digital. '
          + 'Preencha na ficha do cliente e a assinatura entra sozinha em toda peça.', trecho:'' });
    }
    if(!achados.length){
      box.appendChild(el('p',{class:'dica', style:'margin:0'},
        conselho ? 'Nada apanhado, e a assinatura ' + conselho + ' está na peça.'
          : (valeAssinatura ? 'Nada apanhado pela conferência.'
             : 'Nada apanhado no texto. A assinatura do conselho é conferida na peça que for ao ar.')));
      return { box, achados };
    }
    achados.forEach(a=>{
      const l = el('p',{class:'aviso-conf ' + a.nivel});
      l.innerHTML = '<b>' + esc(a.nivel === 'grave' ? 'Não publique assim' : 'Confira antes') + '</b> — '
        + esc(a.oq) + (a.trecho ? ' (“' + esc(a.trecho) + '”)' : '') + '. ' + esc(a.porq);
      box.appendChild(l);
    });
    return { box, achados };
  }

  // ---------- desenho da peça ----------

  const FONTE_T = '"Space Grotesk","Segoe UI",sans-serif';
  const FONTE_C = '"Archivo","Helvetica Neue",Arial,sans-serif';
  const FONTE_D = '"Space Mono","SFMono-Regular",Consolas,monospace';

  function quebrar(g, texto, larg){
    const linhas = [];
    String(texto == null ? '' : texto).split('\n').forEach(par=>{
      let linha = '';
      par.split(/\s+/).filter(Boolean).forEach(p=>{
        const tent = linha ? linha + ' ' + p : p;
        if(linha && g.measureText(tent).width > larg){ linhas.push(linha); linha = p; }
        else linha = tent;
      });
      linhas.push(linha);
    });
    return linhas;
  }

  // Encolhe até caber. Sem isto, um título de doze palavras vaza pra fora do
  // slide e só se descobre depois de exportar.
  function ajustar(g, texto, larg, alt, fonte, peso, max, min){
    for(let s = max; s >= min; s -= 2){
      g.font = peso + ' ' + s + 'px ' + fonte;
      const ls = quebrar(g, texto, larg);
      if(ls.length * (s * 1.14) <= alt) return { tam:s, linhas:ls, lh:s * 1.14 };
    }
    g.font = peso + ' ' + min + 'px ' + fonte;
    return { tam:min, linhas:quebrar(g, texto, larg), lh:min * 1.14 };
  }

  function desenharSlide(cv, slide, deck, i, escala){
    const [ , , L, A] = medidas(deck.formato);
    escala = escala || 1;
    cv.width = Math.round(L * escala);
    cv.height = Math.round(A * escala);
    const g = cv.getContext('2d');
    g.save();
    g.scale(escala, escala);
    const c = coresDoDeck(deck);
    g.fillStyle = c.fundo; g.fillRect(0, 0, L, A);

    const m = deck.margem === 'compacta' ? 66 : 92;    // margem
    const larg = L - m*2;
    const total = (deck.slides || []).length;
    const al = slide.alinha || deck.alinha || 'esq';
    const centro = al === 'centro';
    const x = centro ? L/2 : m;
    g.textAlign = centro ? 'center' : 'left';

    // Faixa de identidade no topo. Repetida em todos os slides: é a repetição
    // visual que faz o conjunto parecer profissional.
    if(deck.faixa !== false){
      g.fillStyle = c.faixa;
      g.fillRect(centro ? (L-108)/2 : m, m, 108, 8);
    }

    // Numeração, sempre no mesmo canto
    if(total > 1 && deck.numerar !== false){
      g.fillStyle = c.apoio;
      g.font = '700 26px ' + FONTE_D;
      g.textAlign = 'right';
      g.fillText(String(i+1).padStart(2,'0') + '/' + String(total).padStart(2,'0'), L - m, m + 12);
      g.textAlign = centro ? 'center' : 'left';
    }

    const baseAssin = A - m;
    const topo = m + 150;               // abaixo da faixa e da numeração
    const base = baseAssin - 84;        // acima da assinatura, com respiro
    const areaTexto = base - topo;

    // Monta o bloco inteiro antes de escrever, pra saber a altura e poder
    // posicionar. Sem isso todo slide fica com o texto empilhado no topo e
    // dois terços de vazio embaixo — que foi o primeiro desenho e estava feio.
    const pedacos = [];
    if(slide.tipo === 'capa' || slide.tipo === 'fim'){
      if(slide.titulo){
        const t = ajustar(g, slide.titulo, larg, areaTexto * 0.66, FONTE_T, '700', 104, 38);
        pedacos.push(Object.assign({}, t, { cor:c.tinta, fonte:FONTE_T, peso:'700', depois:26 }));
      }
      if(slide.texto){
        const usado = pedacos.reduce((h,x)=> h + x.linhas.length*x.lh + x.depois, 0);
        const s2 = ajustar(g, slide.texto, larg, Math.max(60, areaTexto - usado), FONTE_C, '400', 44, 24);
        pedacos.push(Object.assign({}, s2, { cor:c.apoio, fonte:FONTE_C, peso:'400', depois:0 }));
      }
    } else {
      if(slide.titulo){
        const t = ajustar(g, slide.titulo, larg, areaTexto * 0.38, FONTE_T, '700', 76, 32);
        pedacos.push(Object.assign({}, t, { cor:c.tinta, fonte:FONTE_T, peso:'700', depois:24 }));
      }
      if(slide.texto){
        const usado = pedacos.reduce((h,x)=> h + x.linhas.length*x.lh + x.depois, 0);
        const s2 = ajustar(g, slide.texto, larg, Math.max(60, areaTexto - usado), FONTE_C, '400',
          slide.titulo ? 52 : 72, 26);
        pedacos.push(Object.assign({}, s2, { cor: slide.titulo ? c.apoio : c.tinta,
          fonte: slide.titulo ? FONTE_C : FONTE_T, peso: slide.titulo ? '400' : '700', depois:0 }));
      }
    }

    const altBloco = pedacos.reduce((h,x)=> h + x.linhas.length*x.lh + x.depois, 0);
    // Capa e fecho assentam embaixo, como cartaz; conteúdo fica centrado no
    // miolo, que é onde o polegar para quando o carrossel passa.
    let y = (slide.tipo === 'capa' || slide.tipo === 'fim')
      ? base - altBloco
      : topo + Math.max(0, (areaTexto - altBloco) / 2);
    y = Math.max(topo, y);

    pedacos.forEach(pc=>{
      g.font = pc.peso + ' ' + pc.tam + 'px ' + pc.fonte;
      g.fillStyle = pc.cor;
      pc.linhas.forEach(l => { g.fillText(l, x, y + pc.tam); y += pc.lh; });
      y += pc.depois;
    });

    // Assinatura. Fica em todo slide, mesma posição, de propósito: é assim que
    // a regra de registro profissional deixa de depender de alguém lembrar.
    if(deck.assinatura){
      g.fillStyle = c.apoio;
      g.font = '400 24px ' + FONTE_D;
      g.fillText(String(deck.assinatura).slice(0, 64), x, baseAssin);
    }
    g.restore();
    return cv;
  }

  // Uma peça sai como um PNG por slide, que é como o Instagram recebe carrossel.
  async function baixarSlides(deck, nome){
    const [ , , L ] = medidas(deck.formato);
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const slides = deck.slides || [];
    for(let i = 0; i < slides.length; i++){
      const cv = document.createElement('canvas');
      desenharSlide(cv, slides[i], deck, i, 1);
      const url = await new Promise(r => cv.toBlob(b => r(URL.createObjectURL(b)), 'image/png'));
      const a = document.createElement('a');
      a.href = url;
      a.download = (nome || 'peca').replace(/[^\w\-]+/g,'-').toLowerCase()
        + '-' + String(i+1).padStart(2,'0') + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      await new Promise(r => setTimeout(r, 180));   // navegador engasga com downloads em rajada
    }
  }

  // ---------- roteiros ----------

  // Os quatro primeiros vieram do plano de conteúdo que a gente escreveu pro
  // Rafa e a Letícia: são formatos que já foram pensados pra esse público, não
  // uma lista genérica de internet.
  const FORMATOS_ROTEIRO = [
    { k:'discorda', nome:'A dupla discorda', seg:45,
      d:'Os dois discordam de um ponto técnico. Sem vencedor no fim.',
      partes:[
        ['Gancho', 'A pergunta que separa os dois, dita nos primeiros 3 segundos'],
        ['Um lado', 'O argumento do primeiro, curto'],
        ['O outro lado', 'O argumento do segundo'],
        ['Onde os dois concordam', 'O que sobra de verdade — é isso que fica'],
        ['Chamada', 'O que a pessoa faz agora'],
      ] },
    { k:'corrige', nome:'Corrige aí', seg:40,
      d:'Um faz o movimento com um erro comum, o outro entra e corrige.',
      partes:[
        ['Gancho', 'O erro, mostrado antes de explicado'],
        ['Por que dói', 'A consequência, sem termo técnico'],
        ['Como corrigir', 'O ajuste, em uma frase'],
        ['Chamada', ''],
      ] },
    { k:'objecao', nome:'Antes de mais nada', seg:40,
      d:'Uma objeção real dita em voz alta, e respondida.',
      partes:[
        ['A objeção', '"Não tenho tempo", "estou fora de forma demais pra começar"…'],
        ['Por que ela faz sentido', 'Concordar primeiro, senão ninguém escuta o resto'],
        ['O que muda o jogo', 'A resposta honesta, sem promessa'],
        ['Chamada', ''],
      ] },
    { k:'dor', nome:'Por que dói aí', seg:55,
      d:'Uma dor comum explicada com clareza. Autoridade sem prometer nada.',
      partes:[
        ['Gancho', 'A dor, nomeada como a pessoa a chama'],
        ['O que está acontecendo', 'A explicação, no corpo de quem fala'],
        ['O que costuma ajudar', 'Sem prescrever, sem prazo'],
        ['Chamada', ''],
      ] },
    { k:'livre', nome:'Livre', seg:45, d:'Três partes e mais nada.',
      partes:[['Gancho',''],['Desenvolvimento',''],['Chamada','']] },
  ];
  const formatoRoteiro = k => FORMATOS_ROTEIRO.find(f => f.k === k) || FORMATOS_ROTEIRO[0];

  // Fala tranquila em português dá por volta de 2,6 palavras por segundo. Serve
  // pra dizer "isso não cabe em 30 segundos" antes de gravar, não depois.
  function segundosDe(texto){
    const n = String(texto || '').split(/\s+/).filter(Boolean).length;
    return n ? Math.round(n / 2.6) : 0;
  }
  function roteiroEmTexto(r){
    const f = formatoRoteiro(r.formato);
    return f.partes.map(([rot], i) => {
      const v = (r.partes || [])[i];
      return v && String(v).trim() ? rot.toUpperCase() + '\n' + String(v).trim() : null;
    }).filter(Boolean).join('\n\n');
  }

  // ---------- a marca de cada cliente ----------

  // Toda peça começa com o jeito daquele cliente já aplicado. Sem isto, cada
  // carrossel sai um pouco diferente do anterior — e é justamente a repetição
  // visual que faz um perfil parecer profissional sem parecer publicidade.
  const MARCA_PADRAO = {
    cor2:'', preset:'papel', formato:'4:5', alinha:'esq', margem:'folgada',
    numerar:true, faixa:true,
    tom:'', evitar:'', chamada:'', hashtags:'', publico:'',
  };
  function marcaDe(c){
    return Object.assign({}, MARCA_PADRAO, (c && c.marca) || {});
  }
  async function salvarMarca(c, campos){
    const nova = Object.assign({}, marcaDe(c), campos);
    const { error } = await sb.from('clientes').update({ marca:nova }).eq('id', c.id);
    if(error){ toast('Não deu: ' + error.message); return false; }
    c.marca = nova;
    return true;
  }

  // ---------- o que o formulário dele já respondeu ----------

  const respostasDe = id => {
    const r = (state.respostas || []).find(x => x.cliente_id === id);
    return (r && r.respostas) || null;
  };

  // Frases inteiras, do jeito que a pessoa escreveu. É de propósito: a melhor
  // linha de abertura que um cliente tem quase sempre já está dita por ele na
  // resposta do formulário, e reescrever costuma piorar.
  function frasesDe(texto){
    return String(texto || '')
      .split(/(?<=[.!?…])\s+|\n+/)
      .map(x => x.trim().replace(/^["“”'\-–—\s]+|["“”'\s]+$/g,''))
      .filter(x => x.length >= 24 && x.length <= 190);
  }

  // Cada sugestão diz de qual pergunta veio. Sem a origem, vira palpite; com
  // ela, dá pra conferir se está sendo bem usada.
  const FONTES_SUGESTAO = [
    { chave:'motivo_comeco',       oq:'gancho',  rot:'O que fez começar' },
    { chave:'gosta_mais',          oq:'gancho',  rot:'O que mais gosta' },
    { chave:'elogio_frequente',    oq:'tema',    rot:'O elogio que sempre recebem' },
    { chave:'diferencial',         oq:'tema',    rot:'O diferencial' },
    { chave:'entrega_orgulho',     oq:'tema',    rot:'A entrega de que se orgulham' },
    { chave:'faz_procurar',        oq:'objecao', rot:'O que faz procurarem' },
    { chave:'pesa_cansa',          oq:'objecao', rot:'O que pesa no dia a dia' },
    { chave:'cliente_ideal',       oq:'publico', rot:'O cliente ideal' },
    { chave:'descricao_outros',    oq:'tom',     rot:'Como descrevem o jeito deles' },
    { chave:'referencia_inspiracao', oq:'tom',   rot:'A referência que inspira' },
    { chave:'sonho_maior',         oq:'gancho',  rot:'O sonho por trás' },
    { chave:'espaco_livre',        oq:'gancho',  rot:'O que quiseram contar' },
  ];
  const PERGUNTA = chave => {
    let achou = '';
    SECOES.forEach(s => s.perguntas.forEach(([k, p]) => { if(k === chave) achou = p; }));
    return achou;
  };

  function sugestoesDe(cliente, oQue){
    const r = respostasDe(cliente && cliente.id);
    if(!r) return [];
    const fora = [];
    FONTES_SUGESTAO.filter(f => !oQue || f.oq === oQue).forEach(f=>{
      frasesDe(r[f.chave]).slice(0,2).forEach(fr=>{
        if(!fora.some(x => x.frase === fr)) fora.push({ frase:fr, de:f.rot, chave:f.chave, oq:f.oq });
      });
    });
    return fora;
  }

  // O painel de sugestões. Aparece em toda ferramenta do estúdio quando há um
  // cliente escolhido e ele já respondeu o formulário.
  function blocoSugestoes(cliente, oQue, usar){
    const box = el('div',{class:'bloco-conf'});
    box.appendChild(el('p',{class:'rot'},'Do formulário dele'));
    if(!cliente){
      box.appendChild(el('p',{class:'dica', style:'margin:8px 0 0'},
        'Escolha um cliente aí em cima e as respostas dele viram sugestão aqui.'));
      return box;
    }
    const sug = sugestoesDe(cliente, oQue);
    if(!sug.length){
      box.appendChild(el('p',{class:'dica', style:'margin:8px 0 0'},
        respostasDe(cliente.id)
          ? 'Ele respondeu o formulário, mas as respostas úteis pra este tipo de peça vieram curtas demais.'
          : 'Este cliente ainda não tem formulário respondido ligado à ficha dele.'));
      return box;
    }
    box.appendChild(el('p',{class:'dica', style:'margin:8px 0 14px'},
      'Frases que eles mesmos escreveram. Usar a palavra do cliente soa melhor que reescrever — '
      + 'e é a única prova social que não depende de depoimento.'));
    sug.slice(0,8).forEach(s=>{
      const l = el('div',{class:'sugest'});
      const c = el('div',{class:'corpo'});
      c.appendChild(el('p',{class:'frase'}, '“' + esc(s.frase) + '”'));
      c.appendChild(el('p',{class:'de'}, esc(s.de)));
      l.appendChild(c);
      if(usar) l.appendChild(el('button',{class:'btn ghost small', onclick:()=>usar(s)},'usar'));
      l.appendChild(el('button',{class:'linkbtn', onclick:async()=>{
        try { await navigator.clipboard.writeText(s.frase); toast('Copiado.'); }
        catch(e){ toast('O navegador não deixou copiar.'); }
      }},'copiar'));
      box.appendChild(l);
    });
    return box;
  }

  // ---------- o prompt ----------

  // Não há modelo de linguagem dentro da Central, e a chave não pode morar numa
  // página estática. O que dá pra fazer sem chave nenhuma é montar o pedido
  // inteiro — quem é o cliente, como ele fala, o que a profissão dele proíbe,
  // e em que formato a resposta precisa voltar — pra colar em qualquer IA e
  // trazer o resultado de volta pelo botão "Colar a resposta".
  function promptDaPeca(peca, cliente){
    const m = marcaDe(cliente);
    const r = respostasDe(cliente && cliente.id) || {};
    const L = [];
    L.push('Você vai escrever conteúdo para redes sociais de um cliente de uma agência.');
    L.push('Responda em português do Brasil, no formato pedido no fim. Sem introdução e sem comentário.');
    L.push('');
    L.push('## QUEM É O CLIENTE');
    if(cliente) L.push('Nome: ' + cliente.nome + (cliente.vertical ? ' — ' + cliente.vertical : ''));
    ['o_que_faz','cliente_ideal','faz_procurar','diferencial','elogio_frequente',
     'descricao_outros','sonho_maior','referencia_inspiracao'].forEach(k=>{
      const v = String(r[k] || '').trim();
      if(v) L.push('- ' + PERGUNTA(k) + '\n  ' + v.replace(/\n+/g,' '));
    });
    if(m.publico) L.push('- Público, como a agência resumiu: ' + m.publico);
    L.push('');
    L.push('## COMO ELE FALA');
    L.push(m.tom ? m.tom : 'Tom: direto, sem jargão, sem frase motivacional. Escreva como quem explica pra um conhecido.');
    if(m.evitar) L.push('NÃO use, em hipótese alguma: ' + m.evitar);
    L.push('');

    const conselho = conselhoDe(cliente);
    L.push('## REGRAS QUE NÃO PODEM SER QUEBRADAS');
    L.push('- Nada de promessa de prazo ("em 30 dias"), número de resultado ("10kg") ou garantia.');
    L.push('- Nada de afirmação sem base técnica ("queima gordura localizada"), cura ou milagre.');
    L.push('- Nada de comparação depreciativa com concorrente.');
    if(conselho){
      L.push('- Profissão com conselho (' + conselho + '): tudo que for afirmado precisa de base técnica '
        + 'defensável. A assinatura com nome e registro entra na arte, você não precisa escrevê-la.');
    }
    L.push('');

    L.push('## O QUE EU PRECISO');
    if(peca.tipo === 'carrossel'){
      const d = peca.dados;
      L.push('Um carrossel de ' + d.slides.length + ' slides para Instagram.');
      L.push('Slide 1 é a capa (título curto e forte, no máximo 8 palavras). '
        + 'O último é o fecho, com uma chamada' + (m.chamada ? ' na linha de "' + m.chamada + '"' : '') + '.');
      L.push('Os do meio trazem um ponto cada, com título de até 5 palavras e texto de até 35 palavras.');
      const jaTem = d.slides.map((s,i)=> (s.titulo||s.texto) ? ('Slide ' + (i+1) + ': ' + (s.titulo||'') + ' ' + (s.texto||'')).trim() : null).filter(Boolean);
      if(jaTem.length){ L.push(''); L.push('O que já está escrito, para melhorar em vez de recomeçar:');
        jaTem.forEach(x => L.push('  ' + x)); }
      L.push('');
      L.push('## FORMATO DA RESPOSTA (exatamente assim, sem nada além disso)');
      for(let i = 1; i <= d.slides.length; i++){
        L.push('SLIDE ' + i);
        L.push('Titulo: ...');
        L.push('Texto: ...');
        L.push('');
      }
    } else if(peca.tipo === 'roteiro'){
      const f = formatoRoteiro(peca.dados.formato);
      L.push('Um roteiro de vídeo curto no formato "' + f.nome + '": ' + f.d);
      L.push('Alvo de ' + f.seg + ' segundos falados — cerca de ' + Math.round(f.seg * 2.6) + ' palavras no total.');
      if(peca.dados.tema) L.push('Tema: ' + peca.dados.tema);
      const jaTem = f.partes.map(([rot], i)=>{
        const v = (peca.dados.partes || [])[i];
        return v && v.trim() ? rot + ': ' + v.trim() : null; }).filter(Boolean);
      if(jaTem.length){ L.push(''); L.push('O que já está escrito, para melhorar em vez de recomeçar:');
        jaTem.forEach(x => L.push('  ' + x)); }
      L.push('');
      L.push('## FORMATO DA RESPOSTA (exatamente assim, sem nada além disso)');
      f.partes.forEach(([rot]) => { L.push(rot.toUpperCase() + ': ...'); });
    } else {
      L.push('Uma legenda de Instagram.');
      L.push('O gancho é a primeira linha e precisa caber em 125 caracteres — é o que aparece antes do "mais".');
      L.push('O corpo tem no máximo 4 parágrafos curtos.');
      if(m.chamada) L.push('A chamada final deve ser na linha de: ' + m.chamada);
      L.push('Cinco hashtags, específicas, sem as genéricas de milhões de posts.');
      if(m.hashtags) L.push('Hashtags que ele já usa: ' + m.hashtags);
      L.push('');
      L.push('## FORMATO DA RESPOSTA (exatamente assim, sem nada além disso)');
      L.push('GANCHO: ...');
      L.push('CORPO: ...');
      L.push('CHAMADA: ...');
      L.push('HASHTAGS: ...');
    }

    const sug = sugestoesDe(cliente).slice(0,6);
    if(sug.length){
      L.push('');
      L.push('## FRASES DELES, PARA APROVEITAR O TOM (não copie literalmente todas)');
      sug.forEach(s => L.push('- "' + s.frase + '" (' + s.de + ')'));
    }
    return L.join('\n');
  }

  // A volta. O que a IA devolveu entra nos campos certos, e não num textão que
  // alguém teria que recortar à mão — que é onde esse tipo de ida e volta morre.
  function lerResposta(texto, peca){
    const t = String(texto || '').replace(/\r/g,'');
    const semAcento = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
    if(peca.tipo === 'carrossel'){
      const blocos = t.split(/^\s*SLIDE\s*\d+\s*$/mi).slice(1);
      if(!blocos.length) return 0;
      let n = 0;
      blocos.forEach((b, i)=>{
        if(i >= peca.dados.slides.length){
          peca.dados.slides.push({ tipo:'conteudo', titulo:'', texto:'' });
        }
        const linhas = b.split('\n').map(x=>x.trim()).filter(Boolean);
        let tit = '', txt = [];
        linhas.forEach(l=>{
          const c = semAcento(l);
          if(/^TITULO\s*:/.test(c)) tit = l.replace(/^[^:]*:\s*/,'');
          else if(/^TEXTO\s*:/.test(c)) txt.push(l.replace(/^[^:]*:\s*/,''));
          else if(tit || txt.length) txt.push(l);
          else tit = l;
        });
        peca.dados.slides[i].titulo = tit;
        peca.dados.slides[i].texto = txt.join('\n');
        n++;
      });
      return n;
    }
    // Um varredor só para roteiro e legenda: acha cada rótulo seguido de ':' no
    // texto sem acento, e pega até o próximo rótulo conhecido. É mais burro que
    // uma expressão regular esperta, e por isso não quebra com a resposta que
    // vem com uma linha a mais no meio.
    const fatiar = (rotulos)=>{
      const alvo = semAcento(t);
      const pos = rotulos.map(r=>({ r, i: alvo.indexOf(semAcento(r) + ':') })).filter(x => x.i >= 0);
      return pos.map(x=>{
        const fim = pos.reduce((f,y)=> (y.i > x.i && y.i < f) ? y.i : f, t.length);
        return { rotulo:x.r, valor: t.slice(x.i, fim).replace(/^[^:]*:\s*/,'').trim() };
      });
    };

    if(peca.tipo === 'roteiro'){
      const f = formatoRoteiro(peca.dados.formato);
      const nomes = f.partes.map(([rot]) => rot);
      const achados = fatiar(nomes);
      if(!achados.length) return 0;
      peca.dados.partes = peca.dados.partes || [];
      let n = 0;
      achados.forEach(a=>{
        const i = nomes.indexOf(a.rotulo);
        if(i >= 0 && a.valor){ peca.dados.partes[i] = a.valor; n++; }
      });
      return n;
    }

    const mapa = { GANCHO:'gancho', CORPO:'corpo', CHAMADA:'chamada', HASHTAGS:'hashtags' };
    const achados = fatiar(Object.keys(mapa));
    let n = 0;
    achados.forEach(a=>{ if(a.valor){ peca.dados[mapa[a.rotulo]] = a.valor; n++; } });
    return n;
  }

  function blocoPrompt(peca, cliente, depoisDeColar){
    const box = el('div',{class:'bloco-conf'});
    box.appendChild(el('p',{class:'rot'},'Pedir pra uma IA'));
    box.appendChild(el('p',{class:'dica', style:'margin:8px 0 14px'},
      'A Central monta o pedido inteiro — quem é o cliente pelas respostas do formulário, como ele fala, '
      + 'o que a profissão dele proíbe e em que formato a resposta precisa voltar. '
      + 'Copie, cole em qualquer IA, e traga a resposta de volta aqui embaixo.'));

    const acoes = el('div',{style:'display:flex;gap:9px;flex-wrap:wrap;align-items:center'});
    acoes.appendChild(el('button',{class:'btn ghost small', onclick:async()=>{
      const p = promptDaPeca(peca, cliente);
      try { await navigator.clipboard.writeText(p); toast('Prompt copiado — ' + p.length + ' caracteres.'); }
      catch(e){ toast('O navegador não deixou copiar. Abra "ver o prompt" e copie à mão.'); }
    }},'Copiar o prompt'));
    const ver = el('details',{class:'expl', style:'width:100%'});
    ver.appendChild(el('summary',{},'ver o prompt'));
    const pre = el('pre',{class:'prompt-cru'});
    ver.addEventListener('toggle', ()=>{ if(ver.open) pre.textContent = promptDaPeca(peca, cliente); });
    ver.appendChild(pre);
    box.appendChild(acoes);
    box.appendChild(ver);

    const colar = el('div',{class:'campo-longo', style:'margin-top:14px'});
    colar.appendChild(el('span',{},'Colar a resposta'));
    const ta = el('textarea',{rows:'4', placeholder:'Cole aqui o que a IA respondeu, no formato que o prompt pediu.'});
    colar.appendChild(ta);
    const aplicar = el('button',{class:'btn small', style:'margin-top:10px', onclick:()=>{
      const n = lerResposta(ta.value, peca);
      if(!n){ toast('Não reconheci o formato. Confira se a resposta veio como o prompt pediu.'); return; }
      ta.value = '';
      toast(n + (n === 1 ? ' campo preenchido.' : ' campos preenchidos.'));
      if(depoisDeColar) depoisDeColar();
    }},'Preencher com a resposta');
    colar.appendChild(aplicar);
    box.appendChild(colar);
    return box;
  }

  // ---------- a tela ----------

  function assinaturaDe(c){
    if(!c) return '';
    const reg = String(c.registro_profissional || '').trim();
    if(!reg) return '';
    const quem = String(c.contato_nome || c.nome_preferido || c.nome || '').trim();
    return quem ? quem + ' · ' + reg : reg;
  }

  function pecaNova(tipo, clienteId){
    const c = clienteId && state.clientes.find(x => x.id === clienteId);
    const m = marcaDe(c);
    if(tipo === 'roteiro') return { tipo, titulo:'', cliente_id:clienteId || null,
      dados:{ formato:'corrige', tema:'', partes:[] } };
    if(tipo === 'legenda') return { tipo, titulo:'', cliente_id:clienteId || null,
      dados:{ gancho:'', corpo:'', chamada:m.chamada || '', hashtags:m.hashtags || '' } };
    // Tudo o que a marca dele define já vem aplicado: é isso que faz a peça
    // deste mês sair igual à do mês passado sem ninguém reconfigurar nada.
    return { tipo:'carrossel', titulo:'', cliente_id:clienteId || null,
      dados:{ formato:m.formato, preset:m.preset, cor:(c && c.cor) || null, cor2:m.cor2 || '',
        alinha:m.alinha, margem:m.margem, numerar:m.numerar !== false, faixa:m.faixa !== false,
        assinatura:assinaturaDe(c),
        slides:[ { tipo:'capa', titulo:'', texto:'' },
                 { tipo:'conteudo', titulo:'', texto:'' },
                 { tipo:'fim', titulo:'', texto:'' } ] } };
  }

  const FERRAMENTAS = [
    ['carrossel','Carrossel','Slides prontos pra postar, exportados em PNG'],
    ['roteiro','Roteiro','O que vai ser dito, na ordem, com o tempo estimado'],
    ['legenda','Legenda','Gancho, corpo, chamada e hashtags, com a contagem'],
    ['marca','Marca','O jeito de cada cliente, aplicado sozinho em toda peça nova'],
  ];

  function telaEstudio(){
    const m = el('main');
    if(!state.estudio) state.estudio = { ferramenta:'carrossel', peca:null, rascunho:{} };
    if(!state.estudio.rascunho) state.estudio.rascunho = {};
    const E = state.estudio;

    const cabeca = el('div',{class:'bloco'});
    cabeca.appendChild(el('p',{class:'rot laranja'},'Produção'));
    cabeca.appendChild(el('h1',{class:'page'},'Estúdio'));
    cabeca.appendChild(el('p',{class:'intro'},
      'Monta e exporta a peça: carrossel em PNG, roteiro com tempo estimado, legenda com a contagem. '
      + 'Ele confere a peça contra as regras da profissão do cliente antes de você publicar — '
      + 'e não escreve por você (o porquê está no fim da tela).'));

    const fer = el('div',{class:'visao', style:'margin-top:18px'});
    FERRAMENTAS.forEach(([k, rot, ajuda])=>{
      fer.appendChild(el('button',{'aria-selected':String(E.ferramenta === k), title:ajuda,
        onclick:()=>{
          // Trocar de ferramenta não joga fora o que está aberto: o rascunho
          // fica guardado por ferramenta e volta quando você voltar.
          E.rascunho[E.ferramenta] = E.peca;
          E.ferramenta = k;
          E.peca = E.rascunho[k] || null;
          render();
        }}, rot));
    });
    cabeca.appendChild(fer);
    m.appendChild(cabeca);

    if(E.ferramenta === 'marca'){ m.appendChild(telaMarca()); return m; }
    if(!E.peca){ m.appendChild(blocoPecasSalvas()); return m; }
    m.appendChild(E.peca.tipo === 'carrossel' ? editorCarrossel()
      : E.peca.tipo === 'roteiro' ? editorRoteiro() : editorLegenda());
    m.appendChild(blocoSemIA());
    return m;
  }

  function blocoPecasSalvas(){
    const E = state.estudio;
    const box = el('div',{class:'bloco'});
    const f = FERRAMENTAS.find(x => x[0] === E.ferramenta);
    box.appendChild(el('p',{class:'rot'}, esc(f[1])));
    box.appendChild(el('p',{class:'intro', style:'margin-bottom:18px'}, esc(f[2])));

    const acoes = el('div',{style:'display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px'});
    acoes.appendChild(el('button',{class:'btn', onclick:()=>{
      E.peca = pecaNova(E.ferramenta, null); render();
    }}, '+ ' + (E.ferramenta === 'legenda' ? 'nova legenda' : 'novo ' + f[1].toLowerCase())));
    state.clientes.filter(c => c.estagio === 'onboarding' || c.estagio === 'ativo').slice(0,4).forEach(c=>{
      acoes.appendChild(el('button',{class:'btn ghost small', onclick:()=>{
        E.peca = pecaNova(E.ferramenta, c.id); render();
      }}, 'para ' + esc(c.nome)));
    });
    box.appendChild(acoes);

    const minhas = (state.pecas || []).filter(p => p.tipo === E.ferramenta && !foiEscondido(p));
    if(!minhas.length){
      const v = el('div',{class:'vazio'});
      v.appendChild(el('strong',{},'Nada guardado ainda'));
      v.appendChild(el('span',{},'O que você montar aqui fica salvo e dá pra duplicar no mês seguinte.'));
      box.appendChild(v);
      return box;
    }
    minhas.forEach(p=>{
      const c = p.cliente_id && state.clientes.find(x => x.id === p.cliente_id);
      const l = el('div',{class:'item-peca'});
      const b = el('button',{class:'corpo', onclick:()=>{
        E.peca = { id:p.id, tipo:p.tipo, titulo:p.titulo, cliente_id:p.cliente_id,
          dados: JSON.parse(JSON.stringify(p.dados || {})) };
        render();
      }});
      b.appendChild(el('div',{class:'tit'}, esc(p.titulo || 'Sem nome')));
      const sub = [];
      if(c) sub.push(c.nome);
      if(p.tipo === 'carrossel') sub.push(((p.dados||{}).slides||[]).length + ' slides');
      if(p.tipo === 'roteiro') sub.push(formatoRoteiro((p.dados||{}).formato).nome);
      sub.push(soData(p.criado_em));
      b.appendChild(el('div',{class:'sub'}, esc(sub.join(' · '))));
      l.appendChild(b);
      l.appendChild(el('button',{class:'linkbtn', onclick:async()=>{
        const { error } = await sb.from('pecas').insert({ cliente_id:p.cliente_id, tipo:p.tipo,
          titulo:(p.titulo || 'Sem nome') + ' (cópia)', dados:p.dados });
        if(error){ toast('Não deu: ' + error.message); return; }
        await carregarTudo(); render(); toast('Duplicada.');
      }},'duplicar'));
      l.appendChild(el('button',{class:'linkbtn', onclick:()=>{
        removerComVolta('pecas', p.id, p.titulo || 'a peça', async()=>{ await carregarTudo(); render(); });
      }},'remover'));
      box.appendChild(l);
    });
    return box;
  }

  // Guardar é o mesmo para os três: a peça é sempre {titulo, cliente_id, dados}.
  async function salvarPeca(depois){
    const E = state.estudio, p = E.peca;
    const titulo = String(p.titulo || '').trim();
    if(!titulo){ toast('Dê um nome pra peça antes de guardar.'); return false; }
    const linha = { cliente_id:p.cliente_id || null, tipo:p.tipo, titulo, dados:p.dados };
    if(p.id){
      const { error } = await sb.from('pecas').update(linha).eq('id', p.id);
      if(error){ toast('Não deu: ' + error.message); return false; }
    } else {
      const { data, error } = await sb.from('pecas').insert(linha).select().single();
      if(error){ toast('Não deu: ' + error.message); return false; }
      p.id = data.id;
    }
    toast('Guardada.');
    await carregarTudo();
    if(depois) depois();
    return true;
  }

  // Cabeçalho comum dos três editores: nome, cliente e os botões de guardar.
  function cabecaEditor(box, extras){
    const E = state.estudio, p = E.peca;
    const topo = el('div',{class:'topo-editor'});
    const nome = el('input',{class:'titulo-p', type:'text', placeholder:'Nome da peça (só pra você achar depois)',
      value:p.titulo || ''});
    nome.addEventListener('input', ()=>{ p.titulo = nome.value; });
    topo.appendChild(nome);
    const sel = el('select',{'aria-label':'Cliente da peça'});
    sel.appendChild(el('option',{value:''},'Sem cliente'));
    state.clientes.forEach(c => sel.appendChild(el('option',{value:c.id}, esc(c.nome))));
    sel.value = p.cliente_id || '';
    sel.addEventListener('change', ()=>{
      p.cliente_id = sel.value || null;
      const c = state.clientes.find(x => x.id === p.cliente_id);
      if(c){
        const mc = marcaDe(c);
        if(p.tipo === 'carrossel'){
          if(c.cor) p.dados.cor = c.cor;
          p.dados.cor2 = mc.cor2 || '';
          p.dados.preset = mc.preset; p.dados.formato = mc.formato;
          p.dados.alinha = mc.alinha; p.dados.margem = mc.margem;
          p.dados.numerar = mc.numerar !== false; p.dados.faixa = mc.faixa !== false;
          const a = assinaturaDe(c);
          if(a) p.dados.assinatura = a;
        }
        if(p.tipo === 'legenda'){
          if(!String(p.dados.chamada || '').trim() && mc.chamada) p.dados.chamada = mc.chamada;
          if(!String(p.dados.hashtags || '').trim() && mc.hashtags) p.dados.hashtags = mc.hashtags;
        }
      }
      render();
    });
    topo.appendChild(sel);
    box.appendChild(topo);
    if(extras) box.appendChild(extras);
    return topo;
  }

  function peEditor(box, oQueMais){
    const pe = el('div',{class:'pe-editor'});
    pe.appendChild(el('button',{class:'btn', onclick:()=>salvarPeca(render)},'Guardar'));
    (oQueMais || []).forEach(b => pe.appendChild(b));
    pe.appendChild(el('span',{style:'flex:1'}));
    pe.appendChild(el('button',{class:'btn ghost small', onclick:()=>{
      state.estudio.rascunho[state.estudio.ferramenta] = null;
      state.estudio.peca = null; render();
    }},'Voltar à lista'));
    box.appendChild(pe);
  }

  // ---------- a marca, por cliente ----------

  function telaMarca(){
    const E = state.estudio;
    const box = el('div',{class:'bloco'});
    box.appendChild(el('p',{class:'rot'},'Marca'));
    box.appendChild(el('p',{class:'intro', style:'margin-bottom:18px'},
      'O jeito de cada cliente, guardado uma vez. Toda peça nova dele já nasce assim — '
      + 'e é a repetição, mais que qualquer arte isolada, que faz um perfil parecer profissional.'));

    const escolha = el('div',{class:'visao', style:'margin-bottom:22px;flex-wrap:wrap'});
    state.clientes.forEach(c=>{
      escolha.appendChild(el('button',{'aria-selected':String(E.marcaDe === c.id),
        onclick:()=>{ E.marcaDe = c.id; render(); }}, esc(c.nome)));
    });
    box.appendChild(escolha);

    const c = state.clientes.find(x => x.id === E.marcaDe);
    if(!c){
      box.appendChild(el('p',{class:'dica'},'Escolha um cliente pra abrir a marca dele.'));
      return box;
    }
    const m = marcaDe(c);
    const grava = async campos => {
      if(await salvarMarca(c, campos)){ toast('Salvo.'); pintarExemplo(); }
    };

    const grade = el('div',{class:'estudio'});
    const lado = el('div',{class:'lado-editor'});
    const previa = el('div',{class:'lado-previa'});
    grade.appendChild(lado); grade.appendChild(previa);
    box.appendChild(grade);

    // Um exemplo de verdade, com o texto do próprio cliente quando houver:
    // ver o resultado é o que faz alguém mexer nas opções com alguma intenção.
    const cv = el('canvas',{class:'previa-cv'});
    previa.appendChild(cv);
    previa.appendChild(el('p',{class:'dica', style:'margin:10px 0 0;text-align:center'},
      'Como uma capa dele vai sair'));
    function pintarExemplo(){
      const mm = marcaDe(c);
      const sug = sugestoesDe(c)[0];
      const deck = { formato:mm.formato, preset:mm.preset, cor:c.cor || '#FF5E00', cor2:mm.cor2,
        alinha:mm.alinha, margem:mm.margem, numerar:mm.numerar !== false, faixa:mm.faixa !== false,
        assinatura:assinaturaDe(c) || (c.nome_preferido || c.nome),
        slides:[{}, {}, {}] };
      desenharSlide(cv, { tipo:'capa',
        titulo: sug ? sug.frase.slice(0,64) : 'Um título de exemplo aqui',
        texto: mm.chamada || 'A linha de apoio da capa' }, deck, 0, 0.6);
      cv.style.width = '100%';
    }

    const campoP = (rot, dentro, dica) => {
      const l = el('div',{class:'campo-p'});
      l.appendChild(el('span',{}, esc(rot)));
      l.appendChild(dentro);
      lado.appendChild(l);
      if(dica) lado.appendChild(el('p',{class:'dica campo-dica'}, esc(dica)));
    };
    const escolher = (rot, campo, opcoes, dica) => {
      const g = el('div',{class:'chips'});
      opcoes.forEach(([k, nome])=>{
        g.appendChild(el('button',{class:'chip-p', 'aria-pressed':String(marcaDe(c)[campo] === k),
          onclick:async()=>{ if(await grava({ [campo]:k })) render(); }}, esc(nome)));
      });
      campoP(rot, g, dica);
    };
    const ligar = (rot, campo, dica) => {
      const g = el('div',{class:'chips'});
      [[true,'Mostrar'],[false,'Esconder']].forEach(([k, nome])=>{
        g.appendChild(el('button',{class:'chip-p', 'aria-pressed':String((marcaDe(c)[campo] !== false) === k),
          onclick:async()=>{ if(await grava({ [campo]:k })) render(); }}, nome));
      });
      campoP(rot, g, dica);
    };
    const texto = (rot, campo, dica, longo) => {
      if(longo){
        const cx = el('div',{class:'campo-longo'});
        cx.appendChild(el('span',{}, esc(rot)));
        const t = el('textarea',{rows:'3', placeholder:dica || ''});
        t.value = marcaDe(c)[campo] || '';
        t.addEventListener('change', ()=>grava({ [campo]: t.value.trim() }));
        cx.appendChild(t);
        lado.appendChild(cx);
        return;
      }
      const i = el('input',{type:'text', value:marcaDe(c)[campo] || '', placeholder:dica || ''});
      i.addEventListener('change', ()=>grava({ [campo]: i.value.trim() }));
      campoP(rot, i);
    };

    lado.appendChild(el('p',{class:'rot laranja', style:'margin-top:4px'},'Como a peça dele parece'));
    const cor = el('input',{type:'color', value:c.cor || '#FF5E00', class:'cor-peca'});
    cor.addEventListener('change', async ()=>{
      const { error } = await sb.from('clientes').update({ cor:cor.value }).eq('id', c.id);
      if(error){ toast('Não deu: ' + error.message); return; }
      c.cor = cor.value; toast('Salvo.'); pintarExemplo();
    });
    campoP('Cor principal', cor, 'A cor da marca dele. Também aparece na ficha do cliente.');
    const cor2 = el('input',{type:'color', value:m.cor2 || c.cor || '#FF5E00', class:'cor-peca'});
    cor2.addEventListener('change', ()=>grava({ cor2:cor2.value }));
    campoP('Cor da faixa', cor2, 'A faixinha do topo pode ser de outra cor. Deixe igual à principal se preferir.');
    escolher('Visual padrão', 'preset', PRESETS_PECA.map(x=>[x[0], x[1]]));
    escolher('Formato padrão', 'formato', FORMATOS_PECA.map(x=>[x[0], x[1]]));
    escolher('Alinhamento', 'alinha', [['esq','À esquerda'],['centro','Centralizado']],
      'À esquerda lê mais rápido; centralizado pesa mais na capa.');
    escolher('Respiro', 'margem', [['folgada','Folgado'],['compacta','Compacto']],
      'Folgado sobra ar em volta; compacto cabe mais texto.');
    ligar('Faixa no topo', 'faixa');
    ligar('Numeração', 'numerar', 'O "01/05" no canto. Só aparece quando o carrossel tem mais de um slide.');

    lado.appendChild(el('p',{class:'rot laranja', style:'margin-top:26px'},'Como ele fala'));
    texto('Tom de voz', 'tom',
      'Ex.: direto, sem jargão, sem frase motivacional. Explica como quem conversa com um conhecido.', true);
    texto('Nunca usar', 'evitar',
      'Palavras, formatos e assuntos proibidos por eles. Ex.: frase motivacional sobre pôr do sol, dança de trend.', true);
    texto('Público', 'publico', 'Uma linha sobre quem lê. Ex.: 30 a 50 anos, sedentários voltando a treinar.');
    texto('Chamada padrão', 'chamada', 'Ex.: chama no direct que a gente olha o seu.');
    texto('Hashtags de sempre', 'hashtags', '#fortaleza #treinoaoarlivre …');

    pintarExemplo();

    // As respostas do formulário viram sugestão pros dois campos de texto
    // acima: tom e público saem quase prontos do que ele já escreveu.
    box.appendChild(blocoSugestoes(c, 'tom', async s=>{
      const atual = String(marcaDe(c).tom || '').trim();
      if(await grava({ tom: atual ? atual + ' ' + s.frase : s.frase })) render();
    }));
    return box;
  }

  // ---------- carrossel ----------

  function editorCarrossel(){
    const E = state.estudio, p = E.peca, d = p.dados;
    const cliente = p.cliente_id && state.clientes.find(x => x.id === p.cliente_id);
    const box = el('div',{class:'bloco'});
    cabecaEditor(box);

    const grade = el('div',{class:'estudio'});
    const lado = el('div',{class:'lado-editor'});
    const previa = el('div',{class:'lado-previa'});
    grade.appendChild(lado);
    grade.appendChild(previa);
    box.appendChild(grade);

    // --- prévia
    const cv = el('canvas',{class:'previa-cv'});
    const legenda = el('p',{class:'dica', style:'margin:10px 0 0;text-align:center'});
    const setas = el('div',{class:'setas-previa'});
    if(d.slideAtual == null) d.slideAtual = 0;

    // A conferência mora aqui em cima porque roda junto com a prévia: quem
    // digita "em 30 dias" precisa ver o aviso na hora, não no clique de
    // exportar. O bloco só é encaixado na tela lá embaixo.
    const conf = el('div',{class:'bloco-conf'});
    conf.appendChild(el('p',{class:'rot'},'Conferência'));
    const textoTodo = () => d.slides.map(x => (x.titulo||'') + ' ' + (x.texto||'')).join('\n');
    function conferir(){
      conf.querySelectorAll('.confere').forEach(n => n.remove());
      const r = blocoConformidade(textoTodo(), cliente, d.assinatura);
      conf.appendChild(r.box);
      return r.achados;
    }

    function pintar(){
      d.slideAtual = Math.max(0, Math.min(d.slides.length - 1, d.slideAtual));
      // Desenhado com folga e exibido em 100% da coluna: assim a prévia é
      // nítida em tela retina e continua sendo o mesmo desenho da exportação.
      desenharSlide(cv, d.slides[d.slideAtual] || {}, d, d.slideAtual, 0.6);
      cv.style.width = '100%';
      legenda.textContent = 'Slide ' + (d.slideAtual+1) + ' de ' + d.slides.length
        + ' · ' + medidas(d.formato)[2] + '×' + medidas(d.formato)[3];
      setas.innerHTML = '';
      d.slides.forEach((s, i)=>{
        setas.appendChild(el('button',{class:'ponto' + (i === d.slideAtual ? ' on' : ''),
          'aria-label':'Ver o slide ' + (i+1),
          onclick:()=>{ d.slideAtual = i; pintar(); }}, String(i+1)));
      });
      conferir();
    }
    previa.appendChild(cv);
    previa.appendChild(legenda);
    previa.appendChild(setas);

    // --- formato, preset, cor, assinatura
    const opcoes = el('div',{class:'opcoes-peca'});
    const linhaOpc = (rot, dentro) => {
      const l = el('div',{class:'campo-p'});
      l.appendChild(el('span',{}, esc(rot)));
      l.appendChild(dentro);
      opcoes.appendChild(l);
    };
    const gForm = el('div',{class:'chips'});
    FORMATOS_PECA.forEach(([k, rot, L, A, ajuda])=>{
      gForm.appendChild(el('button',{class:'chip-p', 'aria-pressed':String(d.formato === k), title:ajuda,
        onclick:()=>{ d.formato = k; render(); }}, rot + ' ' + L + '×' + A));
    });
    linhaOpc('Formato', gForm);
    const gPre = el('div',{class:'chips'});
    PRESETS_PECA.forEach(([k, rot, ajuda])=>{
      gPre.appendChild(el('button',{class:'chip-p', 'aria-pressed':String(d.preset === k), title:ajuda,
        onclick:()=>{ d.preset = k; pintar(); gPre.querySelectorAll('.chip-p').forEach((x,i)=>
          x.setAttribute('aria-pressed', String(PRESETS_PECA[i][0] === k))); }}, rot));
    });
    linhaOpc('Visual', gPre);
    const cores = el('div',{style:'display:flex;gap:8px;align-items:center;flex-wrap:wrap'});
    const cor = el('input',{type:'color', value:d.cor || '#FF5E00', class:'cor-peca', title:'cor principal'});
    cor.addEventListener('input', ()=>{ d.cor = cor.value; pintar(); });
    const cor2 = el('input',{type:'color', value:d.cor2 || d.cor || '#FF5E00', class:'cor-peca', title:'cor da faixa'});
    cor2.addEventListener('input', ()=>{ d.cor2 = cor2.value; pintar(); });
    cores.appendChild(cor);
    cores.appendChild(el('span',{class:'dica', style:'margin:0'},'principal'));
    cores.appendChild(cor2);
    cores.appendChild(el('span',{class:'dica', style:'margin:0'},'faixa'));
    linhaOpc('Cores', cores);

    const gAl = el('div',{class:'chips'});
    [['esq','À esquerda'],['centro','Centralizado']].forEach(([k, rot])=>{
      gAl.appendChild(el('button',{class:'chip-p', 'aria-pressed':String((d.alinha||'esq') === k),
        onclick:()=>{ d.alinha = k; render(); }}, rot));
    });
    linhaOpc('Alinhamento', gAl);

    const gMar = el('div',{class:'chips'});
    [['folgada','Folgado'],['compacta','Compacto']].forEach(([k, rot])=>{
      gMar.appendChild(el('button',{class:'chip-p', 'aria-pressed':String((d.margem||'folgada') === k),
        onclick:()=>{ d.margem = k; render(); }}, rot));
    });
    linhaOpc('Respiro', gMar);

    const gEx = el('div',{class:'chips'});
    [['faixa','Faixa'],['numerar','Numeração']].forEach(([campo, rot])=>{
      gEx.appendChild(el('button',{class:'chip-p', 'aria-pressed':String(d[campo] !== false),
        onclick:()=>{ d[campo] = d[campo] === false; render(); }}, rot));
    });
    linhaOpc('Mostrar', gEx);
    const assin = el('input',{type:'text', value:d.assinatura || '',
      placeholder: conselhoDe(cliente) ? 'Nome · ' + conselhoDe(cliente) + ' 000000-G/CE' : 'Assinatura no rodapé'});
    assin.addEventListener('input', ()=>{ d.assinatura = assin.value; pintar(); });
    linhaOpc('Assinatura', assin);
    if(cliente){
      opcoes.appendChild(el('button',{class:'btn ghost small', style:'margin-top:10px;justify-self:start',
        onclick:()=>{
          const mc = marcaDe(cliente);
          Object.assign(d, { preset:mc.preset, formato:mc.formato, alinha:mc.alinha, margem:mc.margem,
            numerar:mc.numerar !== false, faixa:mc.faixa !== false, cor2:mc.cor2 || '',
            cor: cliente.cor || d.cor, assinatura: assinaturaDe(cliente) || d.assinatura });
          render(); toast('Voltou pro padrão de ' + cliente.nome + '.');
        }}, 'Voltar ao padrão de ' + esc(cliente.nome)));
    }
    if(conselhoDe(cliente)){
      opcoes.appendChild(el('p',{class:'dica campo-dica'},
        'Profissão com conselho: o registro ' + conselhoDe(cliente) + ' precisa aparecer na peça, não só na bio. '
        + (assinaturaDe(cliente) ? 'Veio da ficha do cliente.'
          : 'Preencha "registro profissional" na ficha dele e ele entra sozinho nas próximas.')));
    }
    lado.appendChild(opcoes);

    // --- slides
    const lista = el('div',{class:'slides'});
    lado.appendChild(lista);
    function desenharLista(){
      lista.innerHTML = '';
      d.slides.forEach((s, i)=>{
        const cx = el('div',{class:'slide-ed' + (i === d.slideAtual ? ' ativo' : '')});
        const cab = el('div',{class:'cab'});
        cab.appendChild(el('span',{class:'n'}, String(i+1).padStart(2,'0')));
        const tipos = el('div',{class:'chips'});
        [['capa','Capa'],['conteudo','Conteúdo'],['fim','Fecho']].forEach(([k, rot])=>{
          tipos.appendChild(el('button',{class:'chip-p', 'aria-pressed':String(s.tipo === k),
            onclick:()=>{ s.tipo = k; d.slideAtual = i; desenharLista(); pintar(); }}, rot));
        });
        cab.appendChild(tipos);
        const mover = el('div',{style:'margin-left:auto;display:flex;gap:2px'});
        mover.appendChild(el('button',{class:'linkbtn', 'aria-label':'Subir o slide ' + (i+1), disabled:i===0?'':null,
          onclick:()=>{ if(i===0) return; const x=d.slides[i-1]; d.slides[i-1]=d.slides[i]; d.slides[i]=x;
            d.slideAtual=i-1; desenharLista(); pintar(); }},'↑'));
        mover.appendChild(el('button',{class:'linkbtn', 'aria-label':'Descer o slide ' + (i+1),
          onclick:()=>{ if(i>=d.slides.length-1) return; const x=d.slides[i+1]; d.slides[i+1]=d.slides[i]; d.slides[i]=x;
            d.slideAtual=i+1; desenharLista(); pintar(); }},'↓'));
        mover.appendChild(el('button',{class:'linkbtn', 'aria-label':'Remover o slide ' + (i+1),
          onclick:()=>{ if(d.slides.length<=1){ toast('Um carrossel precisa de pelo menos um slide.'); return; }
            d.slides.splice(i,1); if(d.slideAtual>=d.slides.length) d.slideAtual=d.slides.length-1;
            desenharLista(); pintar(); }},'×'));
        cab.appendChild(mover);
        cx.appendChild(cab);

        const t = el('input',{type:'text', value:s.titulo || '', placeholder:'Título do slide'});
        t.addEventListener('input', ()=>{ s.titulo = t.value; d.slideAtual = i; pintar(); });
        t.addEventListener('focus', ()=>{ d.slideAtual = i; pintar(); });
        cx.appendChild(t);
        const x = el('textarea',{rows:'3', placeholder:'Texto do slide (opcional)'});
        x.value = s.texto || '';
        x.addEventListener('input', ()=>{ s.texto = x.value; d.slideAtual = i; pintar(); });
        x.addEventListener('focus', ()=>{ d.slideAtual = i; pintar(); });
        cx.appendChild(x);
        lista.appendChild(cx);
      });
      const add = el('button',{class:'btn ghost small', onclick:()=>{
        if(d.slides.length >= 10){ toast('Dez slides é o limite do Instagram.'); return; }
        d.slides.splice(d.slides.length - (d.slides[d.slides.length-1].tipo === 'fim' ? 1 : 0), 0,
          { tipo:'conteudo', titulo:'', texto:'' });
        desenharLista(); pintar();
      }},'+ slide');
      lista.appendChild(add);
    }
    desenharLista();
    pintar();

    // --- sugestões, IA e conferência
    box.appendChild(blocoSugestoes(cliente, null, s2=>{
      const al = d.slides[d.slideAtual] || d.slides[0];
      if(!al.titulo) al.titulo = s2.frase; else al.texto = (al.texto ? al.texto + ' ' : '') + s2.frase;
      desenharLista(); pintar();
    }));
    box.appendChild(blocoPrompt(p, cliente, ()=>{ desenharLista(); pintar(); }));
    box.appendChild(conf);

    const baixar = el('button',{class:'btn', onclick:async()=>{
      const achados = conferir();
      const graves = achados.filter(a => a.nivel === 'grave');
      if(graves.length){
        toast('Confira os avisos graves antes de exportar.');
        conf.scrollIntoView({ block:'center' });
        return;
      }
      baixar.disabled = true;
      baixar.textContent = 'Exportando…';
      try { await baixarSlides(d, p.titulo || 'carrossel'); }
      finally { baixar.disabled = false; baixar.textContent = 'Baixar os ' + d.slides.length + ' PNG'; }
    }}, 'Baixar os ' + d.slides.length + ' PNG');
    peEditor(box, [baixar]);
    return box;
  }

  // ---------- roteiro ----------

  function editorRoteiro(){
    const E = state.estudio, p = E.peca, d = p.dados;
    const cliente = p.cliente_id && state.clientes.find(x => x.id === p.cliente_id);
    const f = formatoRoteiro(d.formato);
    const box = el('div',{class:'bloco'});
    cabecaEditor(box);

    const gForm = el('div',{class:'chips', style:'margin:16px 0 6px'});
    FORMATOS_ROTEIRO.forEach(x=>{
      gForm.appendChild(el('button',{class:'chip-p', 'aria-pressed':String(d.formato === x.k), title:x.d,
        onclick:()=>{ d.formato = x.k; d.partes = []; render(); }}, x.nome));
    });
    box.appendChild(gForm);
    box.appendChild(el('p',{class:'dica', style:'margin:0 0 18px'}, esc(f.d) + ' Alvo: ' + f.seg + ' segundos.'));

    const tema = el('input',{type:'text', class:'titulo-p campo-largo', value:d.tema || '',
      placeholder:'Tema em uma linha. Ex.: agachamento com o joelho pra dentro'});
    tema.addEventListener('input', ()=>{ d.tema = tema.value; });
    box.appendChild(tema);

    const relogio = el('p',{class:'relogio'});
    const partes = el('div',{class:'partes'});
    box.appendChild(partes);
    box.appendChild(relogio);

    function contar(){
      const txt = f.partes.map((_, i) => (d.partes||[])[i] || '').join(' ');
      const s = segundosDe(txt);
      relogio.className = 'relogio' + (s > f.seg * 1.25 ? ' longo' : '');
      relogio.textContent = s
        ? '≈ ' + s + ' segundos falados (alvo do formato: ' + f.seg + ')'
          + (s > f.seg * 1.25 ? ' — está longo. Cortar agora custa menos que regravar.' : '')
        : 'Escreva alguma coisa e o tempo aparece aqui.';
      conferir();
    }
    function desenharPartes(){
      partes.innerHTML = '';
      f.partes.forEach(([rot, ajuda], i)=>{
        const cx = el('div',{class:'campo-longo'});
        cx.appendChild(el('span',{}, esc(rot)));
        const t = el('textarea',{rows: i === 0 ? '2' : '3', placeholder: ajuda || ''});
        t.value = (d.partes || [])[i] || '';

        cliente_id: p.cliente_id || null, estado:'pendente', prioridade:'normal', passos:[],

      const { data, error } = await sb.from('tarefas').insert(linha).select().single();
      if(error){ toast('Não deu: ' + error.message); return; }

        e.preventDefault(); col.classList.remove('alvo');

  const ETAPAS_FUNIL = [
    ['mapeado',     'Mapeado',     'Está na lista, ninguém falou ainda'],
    ['contatado',   'Contatado',   'Mandamos mensagem, sem resposta'],
    ['conversando', 'Conversando', 'Respondeu, conversa aberta'],
    ['reuniao',     'Reunião',     'Reunião marcada ou feita'],
    ['proposta',    'Proposta',    'Proposta enviada, esperando resposta'],
    ['fechado',     'Fechou',      'Virou cliente'],
    ['perdido',     'Perdido',     'Não vai acontecer, e sabemos por quê'],
  ];
  const ETAPA_ROT = Object.fromEntries(ETAPAS_FUNIL.map(e => [e[0], e[1]]));
  const idxEtapa = e => ETAPAS_FUNIL.findIndex(x => x[0] === e);

  const dinheiro = v => v == null || v === ''
    ? '—'
    : Number(v).toLocaleString('pt-BR', { style:'currency', currency:'BRL', maximumFractionDigits:0 });

  async function salvarOportunidade(id, campos){
    const { error } = await sb.from('oportunidades').update(campos).eq('id', id);
    if(error){ toast('Não deu: ' + error.message); return false; }
    return true;

  async function moverOportunidade(o, etapa){
    if(o.etapa === etapa) return;
    const antes = o.etapa;
    o.etapa = etapa;                         // otimista: a tela responde na hora
    o.movido_em = new Date().toISOString();
    render();
    if(!await salvarOportunidade(o.id, { etapa })){
      o.etapa = antes;                       // não gravou: desfaz
      render();
      return;
    }
    if(etapa === 'fechado' && !o.cliente_id){
      toast('Fechou. Crie o cliente pelo botão do cartão.');
    }
    await carregarTudo();
    render();
  }

  function colunaFunil(chave, rot, ajuda){
    const col = el('div',{class:'coluna', 'data-etapa':chave});
    const linhas = state.oportunidades
      .filter(o => o.etapa === chave && !foiEscondido(o))
      .sort((a,b)=> (a.ordem||0) - (b.ordem||0) || String(a.nome).localeCompare(String(b.nome)));

    const cab = el('div',{class:'cab'});
    cab.appendChild(el('span',{class:'titulo'}, esc(rot)));
    cab.appendChild(el('span',{class:'conta'}, String(linhas.length)));
    col.appendChild(cab);
    col.appendChild(el('p',{class:'soma'}, esc(ajuda)));

    const pilha = el('div',{class:'pilha'});
    linhas.forEach(o => pilha.appendChild(cartaoLead(o)));
    if(!linhas.length) pilha.appendChild(el('p',{class:'mini', style:'padding:4px 2px'},'vazio'));
    col.appendChild(pilha);

    const novo = el('button',{class:'novo', onclick:()=>novaOportunidade(chave)},'+ oportunidade');
    col.appendChild(novo);

    // Arrastar: a coluna aceita o cartão e se marca enquanto ele está por cima.
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('alvo'); });
    col.addEventListener('dragleave', ()=> col.classList.remove('alvo'));
    col.addEventListener('drop', async e=>{
      e.preventDefault(); col.classList.remove('alvo');
      const id = e.dataTransfer.getData('text/plain');
      const o = state.oportunidades.find(x => x.id === id);
      if(o) await moverOportunidade(o, chave);
    });
    return col;
  }

  function cartaoLead(o){
    const c = el('div',{class:'lead', draggable:'true', tabindex:'0'});
    c.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', o.id);
      e.dataTransfer.effectAllowed = 'move';
      c.classList.add('arrastando');
    });
    c.addEventListener('dragend', ()=> c.classList.remove('arrastando'));

    c.appendChild(el('div',{class:'nome'}, esc(o.nome)));

    const linha = el('div',{class:'linha'});
    if(o.valor_mensal != null) linha.appendChild(el('span',{class:'valor'}, esc(dinheiro(o.valor_mensal))));
    if(o.bairro) linha.appendChild(el('span',{class:'mini'}, esc(o.bairro)));
    if(o.origem) linha.appendChild(el('span',{class:'mini'}, esc(o.origem)));
    if(linha.childNodes.length) c.appendChild(linha);

    const parado = o.movido_em ? Math.abs(diasAte(o.movido_em)) : null;
    if((o.proxima_acao || '').trim()){
      const d = o.proxima_acao_em ? diasAte(o.proxima_acao_em) : null;
      const quando = d === null ? 'sem data' : emDias(d);
      const atrasada = d !== null && d < 0;
      const p = el('p',{class:'acao'});
      p.innerHTML = '<b>' + esc(o.proxima_acao) + '</b><br>' + esc(quando);
      if(atrasada) p.style.color = 'var(--al)';
      c.appendChild(p);
    } else if(o.etapa !== 'fechado' && o.etapa !== 'perdido'){
      c.appendChild(el('p',{class:'acao', style:'color:var(--es)'},'Sem próxima ação'));

      c.appendChild(el('p',{class:'mini', style:'margin-top:6px'},'parado há ' + parado + ' dias'));

      c.appendChild(el('p',{class:'acao'}, esc(o.perdido_motivo)));
    }

    // Alternativa ao arrastar. Existe por acessibilidade, mas na prática é o
    // que se usa no celular, onde arrastar entre colunas é sofrimento.
    const i = idxEtapa(o.etapa);
    const setas = el('div',{class:'setas'});
    const bVolta = el('button',{type:'button', title:'voltar uma etapa',
      onclick:e=>{ e.stopPropagation(); moverOportunidade(o, ETAPAS_FUNIL[i-1][0]); }},'←');
    if(i <= 0) bVolta.setAttribute('disabled','disabled');
    const bAvanca = el('button',{type:'button', title:'avançar uma etapa',
      onclick:e=>{ e.stopPropagation(); moverOportunidade(o, ETAPAS_FUNIL[i+1][0]); }},'→');
    if(i >= ETAPAS_FUNIL.length - 1) bAvanca.setAttribute('disabled','disabled');
    setas.appendChild(bVolta);
    setas.appendChild(bAvanca);
    setas.appendChild(el('button',{type:'button', title:'abrir na lista',
      onclick:e=>{ e.stopPropagation(); state.buscaLista = o.nome; ir({tipo:'lista'}); }},'⋯'));
    if(o.etapa === 'fechado' && !o.cliente_id){
      setas.appendChild(el('button',{type:'button', title:'criar cliente com estes dados',
        style:'width:auto;padding:0 8px', onclick:e=>{ e.stopPropagation(); virarCliente(o); }},'virar cliente'));
    }
    c.appendChild(setas);

    c.addEventListener('keydown', e=>{
      if(e.key === 'ArrowRight' && i < ETAPAS_FUNIL.length - 1){ e.preventDefault(); moverOportunidade(o, ETAPAS_FUNIL[i+1][0]); }
      if(e.key === 'ArrowLeft' && i > 0){ e.preventDefault(); moverOportunidade(o, ETAPAS_FUNIL[i-1][0]); }
    });
    return c;
  }

  function listaFiltrada(){
    const q = (state.buscaLista || '').trim().toLowerCase();
    let linhas = state.oportunidades.filter(o => !foiEscondido(o));
    if(q) linhas = linhas.filter(o => COLUNAS_LISTA.some(c =>
      String(o[c.chave] == null ? '' : o[c.chave]).toLowerCase().includes(q)));
    const { campo, desc } = state.ordemLista;
    linhas.sort((a,b)=>{
      let x = a[campo], y = b[campo];
      if(campo === 'etapa'){ x = idxEtapa(x); y = idxEtapa(y); }
      // Vazio vai sempre pro fim, nos dois sentidos. Ordenar por valor e ver
      // primeiro quem não tem valor nenhum é o oposto do que se quer.
      const vx = x == null || x === '', vy = y == null || y === '';
      if(vx && vy) return 0;
      if(vx) return 1;
      if(vy) return -1;
      const r = (typeof x === 'number' && typeof y === 'number')
        ? x - y : String(x).localeCompare(String(y), 'pt-BR', { numeric:true });
      return desc ? -r : r;
    });
    return linhas;
  }

  function gradeLista(){
