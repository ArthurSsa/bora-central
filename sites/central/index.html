  /* ---- impressão: o cliente pode salvar em PDF ---- */
  @media print{
    #barra, #caixa-copia, #aviso-edicao, .tirar, .tirar-secao, .mais-item{ display:none !important; }
    body{ background:#fff; color:#000; font-size:11pt; }
    .folha{ max-width:none; padding:0; }
    .cartao, .meta, .eixo, .voces, .aviso{ box-shadow:none; border:1px solid #CCC; }
    .promessa{ background:#fff !important; color:#000 !important; border:2px solid #000; }
    .promessa .rotulo, .promessa .data b{ color:#000 !important; }
    .promessa .data{ border-top-color:#999; color:#333; }
    section{ padding-top:26px; break-inside:avoid; }
    .meta, .passo, .item{ break-inside:avoid; }
    header{ padding-top:0; }
  }
`;

  // Editor que viaja dentro da página gerada. Fica inerte até alguém abrir o
  // arquivo com #editar no fim do endereço — o cliente recebe o mesmo arquivo
  // e nunca vê barra nenhuma.
  const JS_PAGINA_CLIENTE = `
(function(){
  'use strict';
  // A barra de edição só existe com #editar no fim do endereço. O arquivo que o
  // cliente recebe é exatamente este, e ele nunca vê nada disso.
  var ligado = location.hash === '#editar';
  var barra = document.getElementById('barra');
  var editando = false;
  var contador = 0;
  var botaoEditar = null;
  var novoId = function(p){ contador++; return p + '-' + Date.now().toString(36) + '-' + contador; };
  var limpa = function(s){ return String(s == null ? '' : s).replace(/ /g, ' ').trim(); };

  function editaveis(){ return Array.prototype.slice.call(document.querySelectorAll('[data-ed]')); }

  function marcar(lig){
    editando = lig;
    editaveis().forEach(function(n){
      if(lig) n.setAttribute('contenteditable','true'); else n.removeAttribute('contenteditable');
    });
    document.body.classList.toggle('editando', lig);
    document.querySelectorAll('.tirar,.tirar-secao,.mais-item').forEach(function(b){ b.hidden = !lig; });
    if(botaoEditar) botaoEditar.textContent = lig ? 'Parar de editar' : 'Editar textos';
  }

  // Junta o que mudou. Compara sempre com data-orig, que veio da Central e não é
  // reescrito ao salvar — por isso editar, salvar, reabrir e editar de novo
  // continua produzindo a lista certa.
  function coletar(){
    var blocos = {}, mudancas = [], extras = {}, itens = {};
    editaveis().forEach(function(n){
      var txt = limpa(n.innerText);
      var orig = limpa(n.getAttribute('data-orig'));
      var fonte = n.getAttribute('data-fonte');
      if(fonte === 'bloco'){
        if(txt !== orig) blocos[n.getAttribute('data-slot')] = txt;
      } else if(fonte === 'extra-secao'){
        var id = n.getAttribute('data-id');
        extras[id] = extras[id] || { id: id };
        extras[id][n.getAttribute('data-campo')] = txt;
      } else if(fonte === 'extra-item'){
        var idi = n.getAttribute('data-id');
        itens[idi] = itens[idi] || { id: idi };
        itens[idi][n.getAttribute('data-campo')] = txt;
      } else if(fonte){
        if(txt !== orig){
          mudancas.push({ t: fonte, id: n.getAttribute('data-id'), c: n.getAttribute('data-campo'), de: orig, para: txt });
        }
      }
    });
    var listaExtras = Object.keys(extras).map(function(k){ return extras[k]; })
      .filter(function(s){ return limpa(s.titulo) || limpa(s.texto); });
    var listaItens = Object.keys(itens).map(function(k){ return itens[k]; })
      .filter(function(s){ return limpa(s.oq); });
    // Manda a lista mesmo vazia quando havia extras na página: é assim que
    // remover uma seção chega até a Central.
    if(listaExtras.length || document.querySelector('[data-extra-secao]')) blocos.extras = listaExtras;
    if(listaItens.length || document.querySelector('[data-extra-item]')) blocos.itens_extra = listaItens;
    return { v: 1, cliente: document.body.getAttribute('data-cliente'), em: new Date().toISOString(),
             blocos: blocos, mudancas: mudancas };
  }

  function baixar(){
    var estava = editando;
    marcar(false);
    var clone = document.documentElement.cloneNode(true);
    // Só o que é transitório sai. A barra fica, vazia e escondida, e os botões
    // de acrescentar ficam escondidos: é o que permite reabrir o arquivo salvo
    // com #editar e continuar de onde parou. Quem abre sem #editar não vê nada
    // disso, porque o script apaga esses botões no carregamento.
    ['#caixa-copia','#aviso-edicao'].forEach(function(sel){
      var n = clone.querySelector(sel); if(n) n.remove();
    });
    var b = clone.querySelector('#barra');
    if(b){ b.innerHTML = ''; b.setAttribute('hidden',''); }
    clone.querySelectorAll('.tirar,.tirar-secao,.mais-item').forEach(function(x){ x.setAttribute('hidden',''); });
    clone.querySelectorAll('[contenteditable]').forEach(function(x){ x.removeAttribute('contenteditable'); });
    var html = '<!doctype html>\\n' + clone.outerHTML;
    var url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
    var a = document.createElement('a');
    var nome = (document.body.getAttribute('data-nome') || 'cliente').toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').slice(0,40).replace(/^-|-$/g,'');
    a.href = url; a.download = '90-dias-' + (nome || 'cliente') + '.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    if(estava) marcar(true);
    aviso('Arquivo salvo. É esse que você manda pro cliente.');
  }

  function copiar(){
    var texto = JSON.stringify(coletar());
    var caixa = document.getElementById('caixa-copia');
    if(!caixa){
      caixa = document.createElement('div');
      caixa.id = 'caixa-copia';
      var p = document.createElement('p');
      p.textContent = 'Cole isto na Central, em "Trazer alterações da página":';
      caixa.appendChild(p);
      var t = document.createElement('textarea');
      t.id = 'copia-texto'; t.readOnly = true;
      caixa.appendChild(t);
      var f = document.createElement('button');
      f.type = 'button'; f.textContent = 'fechar';
      f.onclick = function(){ caixa.remove(); };
      caixa.appendChild(f);
      document.body.appendChild(caixa);
    }
    var alvo = document.getElementById('copia-texto');
    alvo.value = texto;
    alvo.focus(); alvo.select();
    var ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){}
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(texto).then(function(){}, function(){});
    }
    aviso(ok ? 'Copiado. Agora cole na Central.' : 'Selecione o texto da caixa e copie à mão.');
  }

  var timer;
  function aviso(msg){
    var n = document.getElementById('aviso-edicao');
    if(!n){ n = document.createElement('div'); n.id = 'aviso-edicao'; document.body.appendChild(n); }
    n.textContent = msg; n.classList.add('vendo');
    clearTimeout(timer); timer = setTimeout(function(){ n.classList.remove('vendo'); }, 3400);
  }

  function novaSecao(){
    var id = novoId('sec');
    var s = document.createElement('section');
    s.setAttribute('data-extra-secao','1'); s.setAttribute('data-id', id);
    s.innerHTML = '<p class="rotulo">Seção</p>'
      + '<h2 data-ed="1" data-fonte="extra-secao" data-id="' + id + '" data-campo="titulo" data-orig="">Título da seção</h2>'
      + '<p class="intro" data-ed="1" data-fonte="extra-secao" data-id="' + id + '" data-campo="texto" data-orig="">Escreva aqui.</p>'
      + '<button class="tirar-secao" type="button">remover esta seção</button>';
    var caixaVoces = document.querySelector('.voces');
    var ancora = caixaVoces ? caixaVoces.parentNode : null;
    if(ancora && ancora.parentNode) ancora.parentNode.insertBefore(s, ancora);
    else document.querySelector('.folha').appendChild(s);
    ligarBotoes(); marcar(true);
    s.querySelector('h2').focus();
  }

  function novoItem(){
    var id = novoId('item');
    var div = document.createElement('div');
    div.className = 'item'; div.setAttribute('data-extra-item','1');
    div.innerHTML = '<div class="caixa"></div><div class="corpo">'
      + '<div class="oq" data-ed="1" data-fonte="extra-item" data-id="' + id + '" data-campo="oq" data-orig="">O que vocês precisam fazer</div>'
      + '<div class="obs" data-ed="1" data-fonte="extra-item" data-id="' + id + '" data-campo="obs" data-orig="">Detalhe, se precisar.</div>'
      + '</div><button class="tirar" type="button" title="remover">&times;</button>';
    document.querySelector('.voces .lista').appendChild(div);
    ligarBotoes(); marcar(true);
    div.querySelector('.oq').focus();
  }

  function ligarBotoes(){
    document.querySelectorAll('.tirar').forEach(function(b){
      b.onclick = function(){ var i = b.parentNode; if(i) i.remove(); };
    });
    document.querySelectorAll('.tirar-secao').forEach(function(b){
      b.onclick = function(){ var s = b.parentNode; if(s) s.remove(); };
    });
    document.querySelectorAll('.mais-item').forEach(function(b){ b.onclick = novoItem; });
  }

  if(ligado){
    barra.hidden = false;
    var faz = function(rot, fn, cls){
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = rot; if(cls) b.className = cls;
      b.onclick = fn; barra.appendChild(b); return b;
    };
    var dica = document.createElement('span');
    dica.className = 'dica-barra';
    dica.textContent = 'Clique em qualquer texto e escreva';
    barra.appendChild(dica);
    botaoEditar = faz('Parar de editar', function(){ marcar(!editando); }, 'principal');
    faz('+ seção', novaSecao);
    faz('Baixar versão editada', baixar);
    faz('Copiar alterações', copiar);
    ligarBotoes();
    marcar(true);
  } else {
    document.querySelectorAll('.tirar,.tirar-secao,.mais-item').forEach(function(b){ b.remove(); });
  }
})();
`;

  // Monta o arquivo que o cliente lê. Mesmo objeto em dois momentos: no dia 0 é o
  // plano, no dia 90 é o relatório. Sai daqui com os dados desta ficha, sem
  // ninguém redigitar nada — e sem inventar: o que não está no banco não aparece.
  function montarPaginaCliente(c){
    const d = state.detalhe;
    const blocos = (d.pagina && d.pagina.blocos) || {};
    const nome = c.nome_preferido || c.nome;
    const base = c.inicio_contrato ? new Date(c.inicio_contrato + 'T00:00:00') : HOJE();
    const dia = Math.max(0, Math.round((HOJE() - base) / 86400000));
    const maisDias = n => {
      const x = new Date(base); x.setDate(x.getDate() + n);
      return x.toLocaleDateString('pt-BR', { day:'2-digit', month:'short' }).replace('.','');
    };
    const E = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const porExtenso = iso => {
      if(!iso) return '';
      const x = new Date(String(iso).slice(0,10) + 'T00:00:00');
      return x.toLocaleDateString('pt-BR', { day:'numeric', month:'long', year:'numeric' });
    };

    // Todo trecho editável carrega de onde veio e qual era o valor original.
    // data-orig é gravado aqui, e não pelo editor ao abrir: assim o arquivo pode
    // ser salvo e reaberto várias vezes sem perder a referência do que a Central
    // tem — a lista de mudanças continua correta na terceira edição.
    const edBloco = (slot, texto) =>
      ' data-ed="1" data-fonte="bloco" data-slot="' + slot + '" data-orig="' + E(texto) + '"';
    const edFato = (tabela, id, campo, texto) =>
      ' data-ed="1" data-fonte="' + tabela + '" data-id="' + id + '" data-campo="' + campo + '" data-orig="' + E(texto) + '"';
    const B = (slot, padrao) => {
      const v = blocos[slot];
      return (v != null && String(v).trim()) ? String(v) : padrao;
    };
    // Bloco de prosa: o texto que sai é o override, se houver; o data-orig é
    // sempre o padrão, para o editor saber o que de fato mudou.
    const prosa = (slot, padrao) => ({ txt: B(slot, padrao), attr: edBloco(slot, padrao) });

    // Correções já registradas, por registro, para a página assumir o que mudou
    // depois que o cliente leu — em vez de trocar em silêncio.
    const notaCorrecao = id => {
      const cs = (d.correcoes || []).filter(x => x.registro_id === id);
      if(!cs.length) return '';
      const ultima = cs[cs.length - 1];
      return '<p class="correcao">Corrigido em ' + E(soData(ultima.corrigido_em || new Date().toISOString()))
        + (ultima.motivo ? ' — ' + E(ultima.motivo) : '') + '</p>';
    };

    const AVISO = prosa('aviso', 'Esta página é o plano hoje e o relatório no dia 90 — mesmo link, atualizado por nós. Enquanto os números não se movem ela mostra o que combinamos e o que falta. Quando começarem a se mover, mostra o que aconteceu, incluindo o que não deu certo.');

    // --- ponto de partida
    const linhasBase = d.baselines.map(b => '<tr>'
      + '<td class="metrica"><span' + edFato('baselines', b.id, 'metrica', b.metrica) + '>' + E(b.metrica) + '</span></td>'
      + '<td class="num-col">' + E(b.valor != null ? b.valor + (b.unidade ? ' ' + b.unidade : '') : (b.valor_texto || '?')) + '</td>'
      + '<td>' + E(rotulo('baselines_fonte', b.fonte)) + '</td>'
      + '<td class="ressalva"><span' + edFato('baselines', b.id, 'limitacao', b.limitacao || '') + '>' + E(b.limitacao || '—') + '</span>' + notaCorrecao(b.id) + '</td>'
      + '</tr>').join('\n          ');

    // --- pré-registro
    const blocosMeta = d.metas.map(m => {
      const frac = (m.fracasso || '').trim();
      return '<div class="meta">'
        + '<h3><span' + edFato('metas', m.id, 'metrica', m.metrica) + '>' + E(m.metrica) + '</span>'
        +   '<span class="tipo">' + E(rotulo('metas_tipo', m.tipo)) + '</span></h3>'
        + '<div class="marcos-meta">'
        +   '<div><p class="rotulo">Dia 30</p><p' + edFato('metas', m.id, 'sucesso_30', m.sucesso_30 || '') + '>' + E(m.sucesso_30 || 'Sem meta') + '</p></div>'
        +   '<div><p class="rotulo">Dia 90</p><p' + edFato('metas', m.id, 'sucesso_90', m.sucesso_90 || '') + '>' + E(m.sucesso_90 || 'Sem meta') + '</p></div>'
        + '</div>'
        + (frac ? '<div class="fracasso"><b>Deu errado se</b><span' + edFato('metas', m.id, 'fracasso', frac) + '>' + E(frac) + '</span></div>' : '')
        + notaCorrecao(m.id)
        + '</div>';
    }).join('\n      ');

    // --- ordem das coisas
    const passos = d.marcos.slice().sort((a,b)=>
      String(a.data_prevista||'9999').localeCompare(String(b.data_prevista||'9999')) || (a.ordem||0)-(b.ordem||0)
    ).map(m => {
      const deles = m.responsavel === 'cliente';
      const quando = m.data_prevista
        ? new Date(m.data_prevista + 'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.','')
        : '—';
      return '<div class="passo' + (deles ? ' deles' : '') + '">'
        + '<div class="quando">' + E(quando) + (m.data_cumprida ? '<br><span class="feito">feito</span>' : '') + '</div>'
        + '<div class="conteudo">'
        +   '<h3><span' + edFato('marcos', m.id, 'titulo', m.titulo) + '>' + E(m.titulo) + '</span>'
        +     '<span class="dono ' + (deles ? 'cliente' : 'nos') + '">' + (deles ? 'vocês' : 'nós') + '</span></h3>'
        +   '<p' + edFato('marcos', m.id, 'descricao', m.descricao || '') + '>' + E(m.descricao || '') + '</p>'
        + '</div></div>';
    }).join('\n      ');

    // --- a coluna deles
    const faltando = d.acessos.filter(a => a.status === 'pendente' || a.status === 'solicitado' || a.status === 'bloqueado');
    const marcosDeles = d.marcos.filter(m => m.responsavel === 'cliente' && !m.data_cumprida);
    const extras = Array.isArray(blocos.itens_extra) ? blocos.itens_extra : [];

    const itemHtml = (oq, obs, attrOq, attrObs, removivel) =>
      '<div class="item"' + (removivel ? ' data-extra-item="1"' : '') + '><div class="caixa"></div><div class="corpo">'
      + '<div class="oq"' + (attrOq||'') + '>' + E(oq) + '</div>'
      + '<div class="obs"' + (attrObs||'') + '>' + E(obs || '') + '</div>'
      + '</div>' + (removivel ? '<button class="tirar" type="button" title="remover">×</button>' : '') + '</div>';

    // O texto do item de acesso é montado a partir de dois campos (quem detém e
    // nota), então não tem como voltar pra um campo só. Fica não editável aqui:
    // acesso se mexe na Central, onde a tela Agora também enxerga.
    const listaDeles = [].concat(
      faltando.map(a => itemHtml('Acesso ao ' + a.recurso,
        [a.quem_detem ? 'Está com ' + a.quem_detem + '.' : '', a.nota || ''].filter(Boolean).join(' '),
        '', '', false)),
      marcosDeles.map(m => itemHtml(m.titulo, m.descricao || '',
        edFato('marcos', m.id, 'titulo', m.titulo), edFato('marcos', m.id, 'descricao', m.descricao || ''), false)),
      extras.map(x => itemHtml(x.oq || '', x.obs || '',
        ' data-ed="1" data-fonte="extra-item" data-id="' + E(x.id) + '" data-campo="oq" data-orig=""',
        ' data-ed="1" data-fonte="extra-item" data-id="' + E(x.id) + '" data-campo="obs" data-orig=""', true))
    );
    const totalDeles = faltando.length + marcosDeles.length + extras.length;

    const VOCES_INTRO = prosa('voces_intro', totalDeles
      ? totalDeles + (totalDeles === 1 ? ' coisa, e o plano espera por ela.' : ' coisas, e o plano inteiro espera por elas.')
      : 'Nada travado do lado de vocês.');

    // --- seções livres, escritas por nós na própria página
    const secoesExtra = (Array.isArray(blocos.extras) ? blocos.extras : []).map(s =>
      '<section data-extra-secao="1" data-id="' + E(s.id) + '">'
      + '<p class="rotulo">Seção</p>'
      + '<h2 data-ed="1" data-fonte="extra-secao" data-id="' + E(s.id) + '" data-campo="titulo" data-orig="">' + E(s.titulo || '') + '</h2>'
      + '<p class="intro" data-ed="1" data-fonte="extra-secao" data-id="' + E(s.id) + '" data-campo="texto" data-orig="">' + E(s.texto || '') + '</p>'
      + '<button class="tirar-secao" type="button">remover esta seção</button>'
      + '</section>').join('\n');

    // ---- linha do tempo dos 90 dias
    // Um eixo só (dia 0 a 90). Cada marco é um ponto na data em que cai, cheio
    // se já aconteceu. Preto é nosso, roxo é de vocês — e a mesma informação
    // aparece em palavra na lista abaixo, porque cor sozinha não basta.
    const comData = d.marcos.filter(m => m.data_prevista);
    const posDe = iso => {
      const x = new Date(String(iso).slice(0,10) + 'T00:00:00');
      const n = Math.round((x - base) / 86400000);
      return Math.max(0, Math.min(100, (n / 90) * 100));
    };
    const cumpridos = d.marcos.filter(m => m.data_cumprida).length;
    const posHoje = Math.max(0, Math.min(100, (dia / 90) * 100));

    const eixo = comData.length ? ('<div class="eixo">'
      + '<p class="rotulo">Os 90 dias</p>'
      + '<div class="pista">'
      +   '<span class="base"></span>'
      +   '<span class="feito" style="width:' + posHoje.toFixed(1) + '%"></span>'
      +   comData.map(m => '<span class="marca' + (m.responsavel === 'cliente' ? ' cli' : '')
            + (m.data_cumprida ? ' ok' : '') + '" style="left:' + posDe(m.data_prevista).toFixed(1) + '%"'
            + ' title="' + E(m.titulo) + '"></span>').join('')
      +   '<span class="hoje' + (posHoje > 85 ? ' fim' : (posHoje < 8 ? ' ini' : ''))
            + '" style="left:' + posHoje.toFixed(1) + '%"><span>hoje</span></span>'
      + '</div>'
      + '<div class="reguas"><span>Dia 0</span><span>30</span><span>60</span><span>90</span></div>'
      + '<div class="legenda">'
      +   '<span><i></i>Cheio: já aconteceu</span>'
      +   '<span class="vaz"><i></i>Vazado: ainda não</span>'
      +   '<span class="cli"><i></i>Roxo: depende de vocês</span>'
      + '</div></div>') : '';

    const pv = (c.primeiro_valor_prometido || '').trim();
    const INTRO_PARTIDA = prosa('intro_partida', 'Congelado antes de mexermos em qualquer coisa. A última coluna é o que há de frágil em cada número — dizemos agora para ninguém tratar estimativa como medida daqui a três meses.');
    const INTRO_PRE = prosa('intro_preregistro', 'Escrito antes de começar, de propósito. Se só combinássemos o sucesso, qualquer número do dia 90 se explicaria — e sempre a favor de quem fez o trabalho. O critério de fracasso está aí para vocês poderem cobrar.');
    const INTRO_PASSOS = prosa('intro_passos', 'A barra preta é nossa, a roxa é de vocês.');
    const RES_TITULO = prosa('resultados_titulo', dia < 30 ? 'Ainda não há o que mostrar' : 'O que aconteceu até aqui');
    const RES_TEXTO = prosa('resultados_texto', dia < 30
      ? 'E é assim que deve estar no começo. Esta seção fica vazia até existir número comparável com o ponto de partida — colocar gráfico bonito aqui antes disso seria enfeite.'
      : 'Escreva aqui o que subiu, o que não subiu e o que a gente errou — nessa ordem, porque a terceira é a que faz as outras duas valerem alguma coisa. Compare com o ponto de partida e com o critério de fracasso, sem editar nenhum dos dois.');

    // Numeração das seções: só conta a que de fato existe, senão a página
    // sai com 01, 03, 04 e o pulo parece erro.
    let nSec = 0;
    const num = () => String(++nSec).padStart(2,'0');
    const cab = (n, titulo, slot, intro, slotIntro) =>
      '    <div class="sec-cab"><span class="num">' + n + '</span><div>'
      + '<h2' + prosa(slot, titulo).attr + '>' + E(B(slot, titulo)) + '</h2>'

  function abaPagina(c){
    const box = el('div');
    const d = state.detalhe;
    const faltas = [];
    if(!(c.primeiro_valor_prometido||'').trim()) faltas.push('o primeiro valor prometido');
    if(!d.baselines.length) faltas.push('o ponto de partida');
    if(!d.metas.length) faltas.push('as metas');
    if(!d.marcos.length) faltas.push('os passos');

    const gerada = d.pagina && d.pagina.gerada_em;
    box.appendChild(placar([
      { rotulo:'Números de partida', valor:d.baselines.length },
      { rotulo:'Metas', valor:d.metas.length },
      { rotulo:'Passos', valor:d.marcos.length },
      { rotulo:'Textos seus na página', valor:Object.keys((d.pagina && d.pagina.blocos) || {}).length },
      { rotulo:'Correções', valor:(d.correcoes||[]).length, esconderSeZero:true },
    ]));

    if(faltas.length){
      const av = el('div',{class:'erro', style:'margin:0 0 18px'});
      av.innerHTML = 'A página sai mesmo assim, mas sem <strong>' + faltas.map(esc).join('</strong>, <strong>')
        + '</strong>. Seção sem dado simplesmente não aparece — nada é inventado.';
      box.appendChild(av);
    }
    if(gerada){
      box.appendChild(el('p',{class:'muted', style:'margin:0 0 18px;font-size:0.86rem'},
        'Já gerada em ' + dataBR(gerada) + '. A partir daqui, mudar meta ou baseline é correção do que o cliente já leu — a página passa a mostrar a data da correção.'));
    }

    const acoes = el('div',{style:'display:flex;gap:10px;flex-wrap:wrap;align-items:center'});
    // Anotar "gerada em" é escrituração; entregar o arquivo é o serviço.
    // A anotação acontece depois e nunca pode derrubar a entrega — falha de
    // rede aqui não pode ser o motivo de você ficar sem a página.
    const anotar = ()=>{
      if(gerada) return;
      Promise.resolve().then(()=>marcarGerada(c)).catch(err=>console.warn('Não deu pra anotar a geração:', err));
    };
    acoes.appendChild(el('button',{class:'btn', onclick:()=>{
      const html = montarPaginaCliente(c);
      const slug = (c.nome_preferido || c.nome || 'cliente').toLowerCase()
        .normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').slice(0,40).replace(/^-|-$/g,'');
      const url = URL.createObjectURL(new Blob([html], { type:'text/html;charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url; a.download = '90-dias-' + (slug || 'cliente') + '.html';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      toast('Página baixada.');
      anotar();
    }},'Baixar a página'));
    acoes.appendChild(el('button',{class:'btn ghost', onclick:()=>{
      const html = montarPaginaCliente(c);
      const url = URL.createObjectURL(new Blob([html], { type:'text/html;charset=utf-8' }));
      const w = window.open(url + '#editar', '_blank');
      if(!w) toast('O navegador bloqueou a janela. Libere pop-up para este site.');
      setTimeout(()=>URL.revokeObjectURL(url), 60000);
      anotar();
    }},'Abrir para editar'));
    box.appendChild(acoes);

    box.appendChild(el('p',{class:'dica', style:'margin-top:12px;max-width:68ch'},
      '"Abrir para editar" abre a página com o modo de edição ligado: clique em qualquer texto e escreva. '
      + 'Lá dentro dá pra acrescentar seções e itens, baixar a versão editada e copiar as alterações pra colar aqui embaixo. '
      + 'O que o cliente recebe é o arquivo baixado, sem barra de edição — ela só aparece com #editar no fim do endereço.'));

    box.appendChild(caixaColar(c));
    if((d.correcoes||[]).length) box.appendChild(listaCorrecoes());
    return box;
  }

  // Insert ou update explícito. Upsert resolveria, mas depende de o servidor
  // preservar coluna ausente do payload — e perder gerada_em em silêncio
  // apagaria justamente o que marca que o cliente já leu a página.
  async function salvarPagina(c, campos){
    const existente = state.detalhe.pagina;
    const { error } = existente
      ? await sb.from('paginas').update(campos).eq('cliente_id', c.id)
      : await sb.from('paginas').insert(Object.assign({ cliente_id:c.id }, campos));
    if(error){ toast('Não deu pra salvar a página: ' + error.message); return false; }
    return true;
  }

  async function marcarGerada(c){
    try{
      if(await salvarPagina(c, { gerada_em:new Date().toISOString() })){
        await carregarDetalhe(c.id);
        if(state.vista.tipo === 'cliente' && state.vista.id === c.id) render();
      }
    }catch(err){ console.warn('Não deu pra anotar a geração:', err); }
  }

  // Cola das alterações feitas na página. Nunca aplica direto: mostra o que vai
  // mudar e espera confirmação, porque isto é texto colado de fora.
  function caixaColar(c){
    const box = el('div',{class:'card flat', style:'margin-top:26px'});
    box.appendChild(el('p',{class:'rot laranja', style:'margin:0 0 4px'},'Trazer alterações da página'));
    box.appendChild(el('p',{class:'muted', style:'margin:0 0 12px;font-size:0.87rem'},
      'Cole aqui o que o botão "Copiar alterações" da página gerou. Nada é salvo antes de você conferir a lista.'));

    const ta = el('textarea',{class:'colar-pagina',
      style:'width:100%;min-height:84px;padding:11px;border:1px solid var(--linha);border-radius:10px;background:var(--sup2);font-family:var(--dado);font-size:0.76rem'});
    box.appendChild(ta);
    const saida = el('div');
    const btn = el('button',{class:'btn small', style:'margin-top:10px'},'Conferir alterações');
    btn.addEventListener('click', ()=>{
      saida.innerHTML = '';
      let pacote;
      try{ pacote = JSON.parse(ta.value.trim()); }
      catch(err){ toast('Isso não parece o texto copiado da página.'); return; }
      if(!pacote || pacote.v !== 1){ toast('Formato não reconhecido.'); return; }
      if(pacote.cliente !== c.id){ toast('Esse texto é da página de outro cliente.'); return; }
      saida.appendChild(revisao(c, pacote));
    });
    box.appendChild(btn);
    box.appendChild(saida);
    return box;
  }

  function revisao(c, pacote){
    const box = el('div',{style:'margin-top:18px'});
    const mudancas = Array.isArray(pacote.mudancas) ? pacote.mudancas : [];
    const blocos = pacote.blocos || {};
    const nBlocos = Object.keys(blocos).length;

    if(!mudancas.length && !nBlocos){
      box.appendChild(el('div',{class:'vazio'},'Nada mudou em relação ao que já está aqui.'));
      return box;
    }

    if(nBlocos){
      box.appendChild(el('p',{class:'rot laranja', style:'margin:0 0 8px'}, nBlocos + (nBlocos===1?' texto da página':' textos da página')));
      box.appendChild(el('p',{class:'muted', style:'margin:0 0 16px;font-size:0.86rem'},
        'Títulos, aberturas, seções e itens escritos por você. Ficam guardados e voltam toda vez que a página for gerada de novo.'));
    }

    const delicadas = mudancas.filter(m => m.t === 'metas' || m.t === 'baselines');
    const campoMotivo = {};
    if(mudancas.length){
      box.appendChild(el('p',{class:'rot laranja', style:'margin:18px 0 8px'}, mudancas.length + (mudancas.length===1?' mudança nos dados':' mudanças nos dados')));
      mudancas.forEach((m, i)=>{
        const linha = el('div',{class:'card flat', style:'margin-bottom:10px;padding:12px 14px'});
        const delicada = m.t === 'metas' || m.t === 'baselines';
        const cab = el('div',{style:'display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px'});
        cab.innerHTML = '<span class="chip ' + (delicada ? 'espera' : 'neutro') + '">'
          + esc({metas:'Meta', baselines:'Ponto de partida', marcos:'Passo', acessos:'Acesso', clientes:'Primeiro valor'}[m.t] || m.t)
          + '</span><span class="mono muted" style="font-size:0.66rem">' + esc(m.c) + '</span>';
        linha.appendChild(cab);
        linha.appendChild(el('p',{style:'margin:0;font-size:0.86rem;color:var(--fraco);text-decoration:line-through'}, esc(m.de || '(vazio)')));
        linha.appendChild(el('p',{style:'margin:4px 0 0;font-size:0.93rem'}, esc(m.para || '(vazio)')));
        if(delicada && state.detalhe.pagina && state.detalhe.pagina.gerada_em){
          const f = el('div',{class:'field', style:'margin:12px 0 0'});
          f.appendChild(el('label',{},'Por que está mudando'));
          const inp = el('input',{type:'text', placeholder:'Aparece na página, ao lado do que foi corrigido'});
          f.appendChild(inp);
          f.appendChild(el('span',{class:'dica'},'O cliente já leu a versão anterior. Sem motivo, a correção não é registrada.'));
          linha.appendChild(f);
          campoMotivo[i] = inp;
        }
        box.appendChild(linha);
      });
    }

    if(delicadas.length && state.detalhe.pagina && state.detalhe.pagina.gerada_em){
      box.appendChild(el('div',{class:'erro', style:'margin:14px 0'},
        'Meta e ponto de partida são o pré-registro: foram escritos antes de começar, e o cliente já leu. '
        + 'Mudar não é proibido, mas fica registrado com data e motivo na própria página.'));
    }

    const aplicar = el('button',{class:'btn', style:'margin-top:8px'},'Aplicar tudo');
    aplicar.addEventListener('click', async ()=>{
      aplicar.disabled = true;
      const exigeMotivo = Object.keys(campoMotivo).some(i => !campoMotivo[i].value.trim());
      if(exigeMotivo){ toast('Escreva o motivo de cada correção antes de aplicar.'); aplicar.disabled = false; return; }

      if(nBlocos){
        const juntos = Object.assign({}, (state.detalhe.pagina && state.detalhe.pagina.blocos) || {}, blocos);
        if(!await salvarPagina(c, { blocos:juntos })){ aplicar.disabled = false; return; }
      }

      for(let i = 0; i < mudancas.length; i++){
        const m = mudancas[i];
        if(!['metas','baselines','marcos','acessos','clientes'].includes(m.t)) continue;
        const campos = {}; campos[m.c] = m.para === '' ? null : m.para;
        const { error } = await sb.from(m.t).update(campos).eq('id', m.id);
        if(error){ toast('Não deu em ' + m.t + ': ' + error.message); aplicar.disabled = false; return; }
        if(campoMotivo[i]){
          await sb.from('correcoes').insert({
            cliente_id:c.id, tabela:m.t, registro_id:m.id, campo:m.c,
            valor_antigo:m.de || null, valor_novo:m.para || null,
            motivo:campoMotivo[i].value.trim(),
            corrigido_por:(state.user && state.user.email) || null,
          });
        }
      }

      toast('Alterações aplicadas.');
      await carregarTudo();
      await carregarDetalhe(c.id);
      render();
    });
    box.appendChild(aplicar);
    return box;
  }

  function listaCorrecoes(){
    const box = el('div',{style:'margin-top:26px'});
    box.appendChild(el('p',{class:'rot laranja', style:'margin:0 0 10px'},'Correções depois de o cliente ler'));
    const w = el('div',{class:'wrap'});
    const t = el('table');
    t.innerHTML = '<thead><tr><th>Quando</th><th>O que</th><th>Antes</th><th>Depois</th><th>Motivo</th><th>Quem</th></tr></thead>';
    const tb = el('tbody');
    state.detalhe.correcoes.slice().reverse().forEach(x=>{
      const tr = el('tr');
      [ soData(x.corrigido_em), x.campo, x.valor_antigo || '—', x.valor_novo || '—', x.motivo || '—', x.corrigido_por || '—' ]
        .forEach(v => tr.appendChild(el('td',{}, esc(v))));
      tb.appendChild(tr);
    });
    t.appendChild(tb); w.appendChild(t); box.appendChild(w);
    return box;
  }

  // ---------- tabela genérica com formulário de inclusão ----------

  function secao(opts){
    // opts: { ajuda, linhas, colunas, campos, tabela, cliente, vazio:{titulo,texto} }
    const box = el('div');
    if(opts.ajuda) box.appendChild(el('p',{class:'muted', style:'margin:0 0 16px'}, opts.ajuda));

    if(!opts.linhas.length){
      const v = el('div',{class:'vazio'});
      if(opts.vazio && opts.vazio.titulo){
        v.appendChild(el('strong',{}, esc(opts.vazio.titulo)));
        v.appendChild(el('span',{}, esc(opts.vazio.texto || '')));
      } else {
        v.textContent = (opts.vazio && opts.vazio.texto) || opts.vazio || 'Nada registrado ainda.';
      }
      box.appendChild(v);
    } else {
      const w = el('div',{class:'wrap'});
      const t = el('table');
      const thead = el('thead'); const trh = el('tr');
      opts.colunas.forEach(col=> trh.appendChild(el('th',{}, esc(col.rotulo))));
      trh.appendChild(el('th',{},''));
      thead.appendChild(trh); t.appendChild(thead);
      const tb = el('tbody');
      opts.linhas.forEach(l=>{
        const tr = el('tr');
        opts.colunas.forEach(col=>{
          const td = el('td');
          if(col.chip){
            td.innerHTML = chip(col.chip, l[col.chave]);
          } else {
            const v = col.valor ? col.valor(l) : l[col.chave];
            const vazio = (v===null||v===undefined||v==='');
            td.innerHTML = vazio ? '<span class="muted">—</span>'
              : (col.forte ? '<span class="forte">'+esc(v)+'</span>' : esc(v));
          }
          tr.appendChild(td);
        });
        const acao = el('td',{style:'text-align:right;white-space:nowrap'});
        acao.appendChild(el('button',{class:'btn ghost small', onclick:async()=>{
          if(await apagar(opts.tabela, l.id)){ await carregarDetalhe(opts.cliente.id); render(); }
        }},'remover'));
        tr.appendChild(acao);
        tb.appendChild(tr);
      });
      t.appendChild(tb); w.appendChild(t); box.appendChild(w);
    }

    const det = el('details',{style:'margin-top:22px'});
    det.appendChild(el('summary',{class:'mono', style:'font-size:0.7rem;cursor:pointer;letter-spacing:0.08em;text-transform:uppercase;color:var(--fraco)'}, opts.rotuloAdd || '+ adicionar'));
    const form = el('form',{class:'card flat', style:'margin-top:12px'});
    const g = el('div',{class: opts.colunasForm===3 ? 'grid3' : 'grid2'});
    opts.campos.forEach(c=>{
      const opcoes = c.grupo ? opcoesDe(c.grupo) : c.opcoes;
      if(opcoes) g.appendChild(campoSelect(c.rotulo, c.nome, opcoes, c.padrao, c.dica));
      else if(c.tipo==='textarea'){
        const f = el('div',{class:'field', style:'grid-column:1/-1'});
        f.appendChild(el('label',{for:'f_'+c.nome}, esc(c.rotulo)));
        f.appendChild(el('textarea',{id:'f_'+c.nome, name:c.nome}));
        if(c.dica) f.appendChild(el('span',{class:'dica'}, esc(c.dica)));
        g.appendChild(f);
      }
      else g.appendChild(campo(c.rotulo, c.nome, c.tipo, c.padrao, c.dica));
    });
    form.appendChild(g);
    form.appendChild(el('button',{class:'btn small', type:'submit'},'Salvar'));
    form.addEventListener('submit', async e=>{
      e.preventDefault();
      const dados = lerForm(form);
      dados.cliente_id = opts.cliente.id;
      if(opts.validar){ const erro = opts.validar(dados); if(erro){ toast(erro); return; } }
      if(await inserir(opts.tabela, dados)){
        await carregarDetalhe(opts.cliente.id); render();
      }
    });
    det.appendChild(form);
    box.appendChild(det);
    return box;
  }

  function abaMetas(c){
    const linhas = state.detalhe.metas;
    const box = el('div');
    const completas = linhas.filter(l => (l.fracasso||'').trim()).length;
    if(linhas.length){
      box.appendChild(placar([
        { rotulo:'Metas', valor: linhas.length },
        { rotulo:'Com fracasso escrito', valor: completas + ' de ' + linhas.length, destaca:true,
          parte:completas, de:linhas.length },
        { rotulo:'Sinais antecedentes', valor: linhas.filter(l=>l.tipo==='antecedente').length },
      ]));
      if(completas < linhas.length){
        box.appendChild(el('div',{class:'erro', style:'margin:0 0 18px'},
          (linhas.length - completas) + (linhas.length - completas === 1 ? ' meta está' : ' metas estão')
          + ' sem critério de fracasso. Enquanto isso durar, o relatório do dia 90 se explica sozinho.'));
      }
    }
    box.appendChild(secao({
      tabela:'metas', cliente:c, linhas,
      vazio:{ titulo:'Nenhuma meta pré-registrada',

  function abaBaseline(c){

      colunas:[
        {rotulo:'O que', chave:'metrica', forte:true},

        {rotulo:'Onde mediu', nome:'fonte', grupo:'baselines_fonte', padrao:'perfil_empresa'},
        {rotulo:'Quanto (número)', nome:'valor', tipo:'number'},
        {rotulo:'Unidade', nome:'unidade', dica:'Ex.: contas, posts, dias, BRL'},
        {rotulo:'Ou em texto, se não for número', nome:'valor_texto'},
        {rotulo:'Começo do período', nome:'janela_inicio', tipo:'date', dica:'Ideal: 90 dias para trás. Se não houver histórico, deixe vazio e diga isso na limitação.'},
        {rotulo:'Fim do período', nome:'janela_fim', tipo:'date'},

  function abaMarcos(c){
    const linhas = state.detalhe.marcos;
    const box = el('div');
    const cumpridos = linhas.filter(l => l.data_cumprida).length;
    const atrasados = linhas.filter(l => !l.data_cumprida && l.data_prevista && diasAte(l.data_prevista) < 0).length;
    if(linhas.length){
      box.appendChild(placar([
        { rotulo:'Cumpridos', valor: cumpridos + ' de ' + linhas.length, destaca:true, parte:cumpridos, de:linhas.length },
        { rotulo:'Atrasados', valor: atrasados, esconderSeZero:true },
        { rotulo:'Do cliente', valor: linhas.filter(l=>l.responsavel==='cliente').length },
      ]));
    }
    box.appendChild(secao({
      tabela:'marcos', cliente:c, linhas,
      vazio:{ titulo:'Nenhum marco definido',
              texto:'Três a cinco passos com data e dono. Os que forem do cliente entram na página que ele lê.' },
      rotuloAdd:'+ adicionar marco',
      colunas:[
        {rotulo:'Passo', chave:'titulo', forte:true},
        {rotulo:'Quem faz', chave:'responsavel', chip:'marcos_responsavel'},
        {rotulo:'Quando', valor:l=>{
          if(!l.data_prevista) return null;
          if(l.data_cumprida) return soData(l.data_prevista);
          const d = diasAte(l.data_prevista);
          return soData(l.data_prevista) + (d === null ? '' : ' · ' + emDias(d));
        }},
        {rotulo:'Situação', valor:l=> l.data_cumprida ? 'Feito em ' + soData(l.data_cumprida) : 'Em aberto'},
        {rotulo:'Detalhe', chave:'descricao'},
      ],
      campos:[
        {rotulo:'O passo', nome:'titulo', dica:'Ex.: acessos entregues, baseline congelado, primeira leva no ar'},
        {rotulo:'Quem faz', nome:'responsavel', grupo:'marcos_responsavel', padrao:'bora',
         dica:'O que for do cliente vira item da lista dele na página de 90 dias.'},
        {rotulo:'Data prevista', nome:'data_prevista', tipo:'date'},
        {rotulo:'Data em que foi feito', nome:'data_cumprida', tipo:'date', dica:'Deixe vazio até acontecer.'},
        {rotulo:'Detalhe', nome:'descricao', tipo:'textarea', dica:'Uma frase explicando o que é. Aparece na página do cliente.'},
      ],
      validar:d=> d.titulo ? null : 'O marco precisa de um título.',
    }));
    return box;
  }

  function abaConformidade(c){
    const linhas = state.detalhe.conformidade;
    const box = el('div');
    const bloqueia = linhas.filter(l => l.status === 'nao_conforme').length;
    const semVeredito = linhas.filter(l => l.status === 'pendente').length;
    if(linhas.length){
      box.appendChild(placar([
        { rotulo:'Pode publicar', valor: linhas.filter(l=>l.status==='conforme').length, destaca:true },
        { rotulo:'Não pode publicar', valor: bloqueia, esconderSeZero:true },
        { rotulo:'Sem veredito', valor: semVeredito, esconderSeZero:true },
      ]));
      if(bloqueia){
        box.appendChild(el('div',{class:'erro', style:'margin:0 0 18px'},
          bloqueia + (bloqueia===1 ? ' item está' : ' itens estão') + ' fora da norma. Publicar assim pode obrigar a tirar do ar depois.'));
      }
    }
    box.appendChild(secao({
      tabela:'conformidade_itens', cliente:c, linhas,
      vazio:{ titulo:'Nada avaliado ainda',
              texto:'Se a profissão do cliente for regulada, isso precisa estar resolvido antes da primeira peça sair.' },
      rotuloAdd:'+ adicionar item',
      colunas:[
        {rotulo:'O que', chave:'item', forte:true},
        {rotulo:'Veredito', chave:'status', chip:'conformidade_status'},
        {rotulo:'Regra que se aplica', chave:'norma'},
        {rotulo:'Quem decidiu', chave:'aprovado_por'},
        {rotulo:'Quando', valor:l=> l.aprovado_em ? dataBR(l.aprovado_em) : null},
        {rotulo:'Observação', chave:'nota'},
      ],
      campos:[
        {rotulo:'O que está sendo avaliado', nome:'item', dica:'Ex.: antes e depois de aluno, depoimento, promessa de resultado'},
        {rotulo:'Veredito', nome:'status', grupo:'conformidade_status', padrao:'pendente'},
        {rotulo:'Regra que se aplica', nome:'norma', dica:'Ex.: CONFEF 508/2023 Art. 4º. Se não souber, escreva a dúvida e deixe sem veredito.'},
        {rotulo:'Área', nome:'vertical'},
        {rotulo:'Quem decidiu', nome:'aprovado_por', dica:'Quem assinou embaixo. É o que protege a agência depois.'},
        {rotulo:'Observação', nome:'nota', tipo:'textarea'},
      ],
      validar:d=> d.item ? null : 'Descreva o item.',

  function abaHoras(c){
    const linhas = state.detalhe.horas;
    const total = linhas.reduce((s,l)=>s+(l.minutos||0),0);
    const fat = linhas.filter(l=>l.faturavel).reduce((s,l)=>s+(l.minutos||0),0);
    const box = el('div');
    box.appendChild(el('p',{class:'intro', style:'margin:0 0 18px'},
      'O jeito mais barato de encher isto é não digitar nada: marque hora de começo e fim nas tarefas '
      + 'deste cliente na Agenda, e ao concluir o tempo é apontado sozinho. '
      + 'Estas horas viram a margem de entrega dele na tela Economia.'));
    const atalho = el('div',{style:'display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px'});
    atalho.appendChild(el('button',{class:'btn ghost small', onclick:()=>abrirCliente(c.id,'agenda')},'Ver a agenda dele'));
    atalho.appendChild(el('button',{class:'btn ghost small', onclick:()=>ir({tipo:'economia'})},'Abrir Economia'));
    box.appendChild(atalho);
    if(linhas.length){
      box.appendChild(placar([
        { rotulo:'Horas no total', valor:(total/60).toFixed(1)+' h', destaca:true },
        { rotulo:'Faturáveis', valor:(fat/60).toFixed(1)+' h', parte:fat, de:Math.max(total,1) },
        { rotulo:'Lançamentos', valor:linhas.length },
      ]));
    }
    box.appendChild(secao({
      tabela:'horas', cliente:c, linhas,
      vazio:{ titulo:'Nenhuma hora lançada',
              texto:'Sem isso não dá pra saber se o preço cobre o custo, nem o que vale a pena automatizar.' },
      rotuloAdd:'+ lançar horas',
      colunasForm:3,
      colunas:[
        {rotulo:'Dia', valor:l=> soData(l.data)},
        {rotulo:'O que foi feito', chave:'atividade', forte:true},
        {rotulo:'Tipo', valor:l=> rotulo('horas_categoria', l.categoria)},
        {rotulo:'Tempo', valor:l=> l.minutos >= 60 ? (l.minutos/60).toFixed(1)+' h' : l.minutos+' min'},
        {rotulo:'Quem', chave:'quem'},
        {rotulo:'Cobra do cliente', valor:l=> l.faturavel ? 'Sim' : 'Não'},
        {rotulo:'De onde veio', valor:l=> l.tarefa_id ? 'da agenda' : 'lançado à mão'},
      ],
      campos:[
        {rotulo:'Dia', nome:'data', tipo:'date', padrao:new Date().toISOString().slice(0,10)},
        {rotulo:'Quantos minutos', nome:'minutos', tipo:'number', dica:'Uma hora e meia = 90'},
        {rotulo:'Quem fez', nome:'quem'},
        {rotulo:'Tipo', nome:'categoria', grupo:'horas_categoria', padrao:'conteudo'},
        {rotulo:'Cobra do cliente', nome:'faturavel', opcoes:[['true','Sim'],['false','Não']], padrao:'true',
         dica:'Reunião de venda e retrabalho nosso não se cobra — mas se lança, senão a conta do custo mente.'},
        {rotulo:'O que foi feito', nome:'atividade'},
      ],
      validar:d=>{
        if(!d.atividade) return 'Descreva a atividade.';
        if(!d.minutos || d.minutos<=0) return 'Minutos precisa ser maior que zero.';
        d.faturavel = String(d.faturavel) === 'true';
        return null;
      },
    }));
    return box;
  }

  // ---------- sessão ----------

  // O link de acesso volta com os tokens no fragmento da URL. O supabase-js
  // consome sozinho — mas só depois de terminar de iniciar. Por isso a barra
  // é limpa DEPOIS do getSession(): limpar antes jogava a sessão fora, e o
  // login dava certo no Supabase enquanto a tela voltava pro e-mail.
  function lerErroDoLink(){
    const h = window.location.hash || '';
    if(h.includes('error')){
      const p = new URLSearchParams(h.replace(/^#/, ''));
      const d = (p.get('error_description') || '').toLowerCase();
      state.erro = (d.includes('expired') || d.includes('invalid'))
        ? 'Esse link expirou ou já foi usado. Peça um novo.'
        : 'O link não funcionou: ' + (p.get('error_description') || p.get('error'));
    }
  }
  function limparBarraDoLink(){
    const h = window.location.hash || '';
    if(h.includes('access_token') || h.includes('error')){
      history.replaceState(null, '', window.location.pathname + window.location.search);
    }
  }

  async function iniciarSessao(){
    state.carregando = true; render();
    lerErroDoLink();
    const { data:{ session } } = await sb.auth.getSession();
    limparBarraDoLink();
    state.user = session ? session.user : null;
    if(state.user){
      const { data, error } = await sb.rpc('is_bora_member');
      state.membro = !error && data === true;
      if(state.membro){
        await carregarTudo();
        // A fila e as peças vêm à parte: o número na aba Fábrica acende sem segurar a abertura.
        carregarFabrica().then(render);
        // Respeita o endereço com que a pessoa chegou: link mandado pela Bia,
        // aba recarregada, favorito. Cliente que não existe mais cai no Agora.
        const r = rotaAtual();
        if(r.tipo === 'cliente' && state.clientes.some(c => c.id === r.id)){
          state.vista = { tipo:'cliente', id:r.id };
          state.aba = (r.aba && ABAS.some(a => a[0] === r.aba)) ? r.aba : 'respostas';
          carregarDetalhe(r.id).then(render);
        } else if(r.tipo === 'pedido'){
          state.vista = { tipo:'pedido', id:r.id };
        } else if(['inbox','novo','funil','lista','agenda','listas','clientes','perfil','economia','criar','fabrica'].includes(r.tipo)){
          state.vista = { tipo:r.tipo };
        } else {
          state.vista = { tipo: ((state.perfil || {}).tela_inicial) || 'agora' };
        }
      }
    }
    state.carregando = false;
    render();
  }

  async function sair(){
    await sb.auth.signOut();
    state.user = null; state.membro = false; state.clientes = []; state.inbox = [];
    state.tudo = { acessos:[], metas:[], baselines:[], marcos:[], conformidade:[], horas:[] };
    state.economia = null; state.funilEventos = []; state.estudio = null; state.criar = null; state.fabrica = null;
    state.respostas = [];
    state.vista = { tipo:'agora' };
    state.linkEnviadoPara = null; state.modoLogin = 'link'; state.erro = null;
    render();
  }

  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape' && painelAberto){ fecharPainel(); return; }
    if(e.key === 'Escape' && state.gaveta){ state.gaveta = false; render(); return; }
    if((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')){
      const campo = document.querySelector('.buscatopo input');
      if(campo){ e.preventDefault(); campo.focus(); campo.select(); }
    }
  });

  // O ícone da aba é a própria marca, montada a partir do LOGO — um arquivo só,
  // sem cópia pra sair de sincronia. O currentColor não vale num favicon (ele
  // não herda nada da página), então o SVG leva a própria regra de cor dentro.
  (function favicon(){
    const marca = LOGO.replace('>', '><style>:root{color:#1A1815}'
      + '@media(prefers-color-scheme:dark){:root{color:#F2EEE8}}</style>');
    const l = document.createElement('link');
    l.rel = 'icon';
    l.href = 'data:image/svg+xml,' + encodeURIComponent(marca);
    document.head.appendChild(l);
  })();

  aplicarTema();   // antes de tudo, senão a tela pisca branca no modo escuro
  iniciarSessao();
})();
</script>
