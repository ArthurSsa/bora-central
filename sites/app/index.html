<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F2EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12100E" media="(prefers-color-scheme: dark)">
<title>Bora — seus posts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  /* ==================================================================
     O app do cliente — o mesmo papel morno do Estúdio, com bem menos coisa.
     Quem usa é o dono do negócio, no celular, entre um atendimento e outro:
     uma pergunta por tela, botão grande, nenhuma palavra de designer.

     A laranja da marca é forma (barra, selo, o ponto da logo). Quando tem
     texto em cima, o fundo é a laranja-forte — branco sobre a laranja da
     marca dá 3,06:1 e não passa. Mesma regra do Estúdio e da Central.
     ================================================================== */
  :root{
    --papel:#F5F2EC; --sup:#FFFFFF; --sup2:#FBF9F5;
    --tinta:#1A1815; --fraco:#6E675F; --linha:#E8E2D8;
    --laranja:#FF5E00; --laranja-forte:#B84300; --laranja-fraco:#FFF1E8; --sobre-laranja:#FFFFFF;
    --roxo:#8800FF;
    --ok:#1C6B45; --ok-f:#EAF3EE;
    --al:#A93226; --al-f:#FBEAE7;
    --es:#8A5A05; --es-f:#FBF1DE;
    --an:#1B4F8F; --an-f:#E9F0F9;
    --nt:#6D665F; --nt-f:#F1EEE8;
    --s1:0 1px 2px rgba(26,24,21,.04), 0 6px 22px rgba(26,24,21,.06);
    --r:16px;
    --display:'Space Grotesk','Segoe UI',sans-serif;
    --corpo:'Archivo','Helvetica Neue',Arial,sans-serif;
    --dado:'Space Mono','SFMono-Regular',Consolas,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --papel:#12100E; --sup:#1B1815; --sup2:#221E1A;
      --tinta:#F2EEE8; --fraco:#A09890; --linha:#302B26;
      --laranja:#FF7A2E; --laranja-forte:#FF9A5C; --laranja-fraco:#2E1B0E; --sobre-laranja:#12100E;
      --roxo:#B166FF;
      --ok:#7FD6A6; --ok-f:#16291F;
      --al:#FF9382; --al-f:#2E1714;
      --es:#EFC873; --es-f:#2B2110;
      --an:#9CC0F2; --an-f:#152131;
      --nt:#B8B0A7; --nt-f:#262119;
      --s1:0 1px 2px rgba(0,0,0,.5), 0 6px 22px rgba(0,0,0,.4);
      color-scheme:dark;
    }
  }

  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--papel); color:var(--tinta);
    font-family:var(--corpo); font-size:16px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button{ font-family:inherit; cursor:pointer; color:inherit; }
  input,textarea{ font-family:var(--corpo); font-size:1rem; color:var(--tinta); }
  *:focus-visible{ outline:2.5px solid var(--roxo); outline-offset:2px; border-radius:4px; }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
  h1,h2,h3{ font-family:var(--display); letter-spacing:-0.02em; margin:0; }
  h1{ font-size:1.7rem; line-height:1.12; }
  h2{ font-size:1.12rem; }
  p{ margin:0; }
  .rot{ font-family:var(--dado); font-size:0.66rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--fraco); }
  .fraco{ color:var(--fraco); }
  .pilha > * + *{ margin-top:12px; }
  .pilha-g > * + *{ margin-top:28px; }

  /* ---------- moldura ---------- */
  .topo{
    position:sticky; top:0; z-index:5; background:var(--papel);
    display:flex; align-items:center; gap:12px; padding:12px 16px;
    border-bottom:1px solid var(--linha);
  }
  .marca{ display:flex; align-items:center; gap:8px; text-decoration:none; color:var(--tinta); flex-shrink:0; }
  .marca svg{ height:30px; width:auto; display:block; }
  .quem{ margin-left:auto; min-width:0; display:flex; align-items:center; gap:10px; }
  .quem .nome{ font-weight:600; font-size:0.92rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .quem select{
    max-width:52vw; font:inherit; font-weight:600; font-size:0.9rem; color:var(--tinta);
    background:var(--sup); border:1px solid var(--linha); border-radius:10px; padding:6px 8px;
  }
  .linkbtn{ background:none; border:none; padding:4px 2px; color:var(--laranja-forte); font-size:0.85rem; text-decoration:underline; }

  main{ max-width:720px; margin:0 auto; padding:20px 16px calc(96px + env(safe-area-inset-bottom)); }
  .abas{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    display:grid; grid-template-columns:repeat(4,1fr);
    background:var(--sup); border-top:1px solid var(--linha);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .abas a{
    display:flex; flex-direction:column; align-items:center; gap:2px; padding:9px 4px 10px;
    text-decoration:none; color:var(--fraco); font-size:0.78rem; font-weight:600;
  }
  .abas a svg{ width:22px; height:22px; }
  .abas a[aria-current="page"]{ color:var(--laranja-forte); }
  @media (min-width:900px){
    .corpo{ display:grid; grid-template-columns:220px minmax(0,1fr); max-width:1080px; margin:0 auto; gap:12px; }
    .abas{
      position:sticky; top:72px; align-self:start; display:flex; flex-direction:column; gap:4px;
      background:none; border:none; padding:20px 0 0 16px;
    }
    .abas a{ flex-direction:row; gap:10px; font-size:0.95rem; padding:10px 12px; border-radius:10px; }
    .abas a[aria-current="page"]{ background:var(--laranja-fraco); }
    main{ padding-bottom:48px; margin:0; }
  }

  /* ---------- blocos ---------- */
  .cartao{ background:var(--sup); border-radius:var(--r); box-shadow:var(--s1); padding:18px; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    min-height:48px; padding:0 22px; border-radius:100px; border:none;
    font-family:var(--display); font-weight:700; font-size:1rem; text-decoration:none;
  }
  .btn.pri{ background:var(--laranja-forte); color:var(--sobre-laranja); }
  .btn.sec{ background:var(--sup); color:var(--tinta); border:1.5px solid var(--linha); }
  .btn.cheio{ width:100%; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .botoes{ display:flex; gap:10px; flex-wrap:wrap; }
  .botoes .btn{ flex:1 1 140px; }
  .acoes .btn{ white-space:nowrap; padding:0 14px; }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    border:1.5px solid var(--linha); background:var(--sup); border-radius:100px;
    padding:9px 14px; font-size:0.92rem; font-weight:500;
  }
  .chip[aria-pressed="true"]{ border-color:var(--laranja-forte); background:var(--laranja-fraco); color:var(--tinta); font-weight:600; }

  .campo label{ display:block; font-weight:600; margin-bottom:6px; }
  .campo textarea, .campo input[type=email], .campo input[type=date]{
    width:100%; border:1.5px solid var(--linha); border-radius:12px; background:var(--sup);
    padding:12px 14px; line-height:1.45;
  }
  .campo textarea{ min-height:120px; resize:vertical; }
  .contador{ font-family:var(--dado); font-size:0.72rem; color:var(--fraco); text-align:right; margin-top:4px; }

  .aviso{ border-radius:12px; padding:12px 14px; font-size:0.95rem; }
  .aviso.erro{ background:var(--al-f); color:var(--al); }
  .aviso.ok{ background:var(--ok-f); color:var(--ok); }
  .aviso.info{ background:var(--an-f); color:var(--an); }

  .selo{ display:inline-block; font-size:0.78rem; font-weight:600; padding:3px 10px; border-radius:100px; white-space:nowrap; }
  .selo.produzindo{ background:var(--an-f); color:var(--an); }
  .selo.para_aprovar{ background:var(--laranja-fraco); color:var(--laranja-forte); }
  .selo.aprovado, .selo.agendado, .selo.publicado{ background:var(--ok-f); color:var(--ok); }
  .selo.rascunho, .selo.cancelado{ background:var(--nt-f); color:var(--nt); }

  /* ---------- Hoje ---------- */
  .tipos{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  @media (min-width:600px){ .tipos{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
  .tipo{
    display:flex; flex-direction:column; align-items:flex-start; gap:8px; text-align:left;
    background:var(--sup); border:none; border-radius:var(--r); box-shadow:var(--s1);
    padding:16px 14px; min-height:132px; text-decoration:none; color:var(--tinta);
  }
  .tipo svg{ width:30px; height:30px; color:var(--laranja-forte); }
  .tipo b{ font-family:var(--display); font-size:1rem; line-height:1.2; }
  .tipo span{ font-size:0.84rem; color:var(--fraco); line-height:1.35; }
  .tipo[aria-disabled="true"]{ box-shadow:none; background:var(--sup2); cursor:default; }
  .tipo[aria-disabled="true"] svg{ color:var(--fraco); }
  .tipo .breve{ margin-top:auto; font-family:var(--dado); font-size:0.66rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--fraco); }

  .lista{ display:flex; flex-direction:column; gap:10px; }
  .linha-ped{
    display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--tinta);
    background:var(--sup); border-radius:14px; box-shadow:var(--s1); padding:10px 12px;
  }
  .miniatura{ width:52px; aspect-ratio:4/5; border-radius:8px; background:var(--sup2); object-fit:cover; flex-shrink:0; border:1px solid var(--linha); }
  .linha-ped .txt{ min-width:0; flex:1; }
  .linha-ped .tit{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .linha-ped .sub{ font-size:0.82rem; color:var(--fraco); }
  .linha-ped.chama{ outline:2px solid var(--laranja-forte); outline-offset:-2px; }

  /* ---------- pedido ---------- */
  .passos{ display:flex; gap:6px; }
  .passos i{ flex:1; height:4px; border-radius:4px; background:var(--linha); }
  .passos i.feito{ background:var(--laranja); }
  .resumo dt{ font-size:0.82rem; color:var(--fraco); margin-top:12px; }
  .resumo dt:first-child{ margin-top:0; }
  .resumo dd{ margin:2px 0 0; font-weight:500; }
  .amostras{ display:flex; gap:6px; margin-top:6px; }
  .amostras i{ width:28px; height:28px; border-radius:8px; border:1px solid var(--linha); display:block; }

  /* ---------- acompanhamento ---------- */
  .voltar{ display:inline-flex; align-items:center; gap:4px; color:var(--fraco); text-decoration:none; font-size:0.92rem; }
  .cabeca{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .barra{ height:10px; border-radius:10px; background:var(--linha); overflow:hidden; }
  .barra i{ display:block; height:100%; background:var(--laranja); border-radius:10px; transition:width .5s ease; }
  .etapa{ font-family:var(--display); font-weight:700; font-size:1.2rem; }
  /* ---------- sugestões do plano ---------- */
  .sugestoes{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .sugestao{ background:var(--sup); border-radius:14px; box-shadow:var(--s1); padding:14px; display:flex; flex-direction:column; gap:10px; }
  .sugestao p{ font-weight:600; line-height:1.35; }
  .sugestao .btn{ align-self:flex-start; min-height:40px; font-size:0.92rem; padding:0 18px; }

  /* ---------- data de ir ao ar ---------- */
  .data-ar{ display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:6px 14px; font-size:0.95rem; padding:0 2px; }

  /* ---------- calendário ---------- */
  .mes-nav{ display:flex; align-items:center; gap:6px; }
  .mes-nav .chip{ padding:6px 12px; font-size:1rem; }
  .mes-nome{ font-family:var(--display); font-weight:600; min-width:7.5em; text-align:center; text-transform:capitalize; }
  .cal{ display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:4px; }
  .cal .sem{ text-align:center; font-family:var(--dado); font-size:0.7rem; color:var(--fraco); padding-bottom:2px; }
  .dia{
    min-height:58px; border:1px solid var(--linha); background:var(--sup); border-radius:10px;
    padding:4px; display:flex; flex-direction:column; align-items:center; gap:3px; font:inherit; min-width:0;
  }
  .dia.vazio{ border:none; background:none; }
  .dia.passado{ background:var(--sup2); }
  .dia .num{ font-size:0.82rem; font-weight:600; line-height:1; }
  .dia.passado .num{ color:var(--fraco); }
  .dia.hoje .num{ color:var(--laranja-forte); }
  .dia.hoje{ border-color:var(--laranja-forte); }
  .dia[aria-pressed="true"]{ outline:2.5px solid var(--laranja-forte); outline-offset:-1px; }
  .dia.alvo{ background:var(--laranja-fraco); }
  .dia .pecas{ display:flex; gap:2px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .dia .peca{ width:18px; aspect-ratio:4/5; border-radius:3px; background:var(--laranja); overflow:hidden; display:block; }
  .dia .peca img, .dia .peca video{ width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
  .dia .peca.foi{ opacity:.6; }
  .dia .mais{ font-size:0.66rem; color:var(--fraco); }
  @media (min-width:600px){ .dia{ min-height:78px; } .dia .peca{ width:26px; } }

  /* Carrossel: desliza de lado, uma imagem por vez, com a próxima aparecendo na borda. */
  .galeria{ display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:6px; overscroll-behavior-x:contain; }
  /* min-width:0 — sem ele a imagem não encolhe abaixo da largura própria e
     passa da tela, em vez de deixar a próxima aparecer na borda. */
  .galeria img, .galeria .img-vazia{ flex:0 0 86%; min-width:0; max-width:420px; aspect-ratio:4/5; border-radius:12px; scroll-snap-align:center; object-fit:cover; background:var(--sup2); box-shadow:var(--s1); display:block; }
  .galeria.antiga, .opcoes.antiga{ opacity:.55; }
  /* Capa: as três opções empilhadas, a escolhida com moldura. */
  .opcao{ display:block; width:100%; text-align:left; padding:0; border:2.5px solid transparent; border-radius:14px; background:none; }
  .opcao img, .opcao .img-vazia{ display:block; width:100%; aspect-ratio:16/9; border-radius:11px; object-fit:cover; background:var(--sup2); }
  .opcao .rotulo-opcao{ display:block; padding:6px 4px 2px; font-weight:600; font-size:0.92rem; }
  .opcao[aria-pressed="true"], .opcao.escolhida{ border-color:var(--laranja-forte); }
  .texto-entrega{ white-space:pre-wrap; line-height:1.55; }
  .titulos{ list-style:none; margin:0; padding:0; }
  .titulos li{ display:flex; gap:12px; align-items:baseline; justify-content:space-between; padding:8px 0; border-top:1px solid var(--linha); }
  .titulos li:first-child{ border-top:none; }
  .baixar .btn{ flex:0 1 auto; min-height:42px; padding:0 16px; font-size:0.92rem; }

  /* Só as laterais e o pé: o topo é do espaçamento entre blocos (.pilha-g). */
  .figura{ margin-left:0; margin-right:0; margin-bottom:0; }
  .previa{ display:block; width:100%; max-width:440px; aspect-ratio:4/5; margin:0 auto; border-radius:12px; background:var(--sup2); object-fit:contain; box-shadow:var(--s1); }
  .previa.antiga{ opacity:.55; }
  /* O reel é em pé, 9:16. A largura sai da altura da tela (35vh ≈ 62vh de
     altura), pra o vídeo inteiro caber acima da barra de Aprovar no celular. */
  video.previa{ aspect-ratio:9/16; width:min(100%, 340px, 35vh); max-width:none; object-fit:contain; background:#000; }
  .envio .nome-arquivo{ font-weight:600; overflow-wrap:anywhere; }
  .envio .linkbtn{ align-self:flex-start; cursor:pointer; }
  .envio.falhou{ outline:2px solid var(--al); outline-offset:-2px; }
  .erro-texto{ color:var(--al); font-size:0.92rem; }
  .versoes{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .versoes button{ border:2px solid transparent; background:none; padding:0; border-radius:10px; }
  .versoes button[aria-pressed="true"]{ border-color:var(--laranja-forte); }
  .versoes img{ width:56px; aspect-ratio:4/5; border-radius:8px; object-fit:cover; display:block; }
  .linha-tempo{ list-style:none; margin:0; padding:0; }
  .linha-tempo li{ display:flex; gap:12px; padding:7px 0; border-top:1px solid var(--linha); font-size:0.92rem; }
  .linha-tempo li:first-child{ border-top:none; }
  .linha-tempo time{ font-family:var(--dado); font-size:0.75rem; color:var(--fraco); flex-shrink:0; padding-top:2px; }
  .acoes{ position:sticky; bottom:calc(64px + env(safe-area-inset-bottom)); background:var(--papel); padding:12px 0 4px; }
  @media (min-width:900px){ .acoes{ bottom:0; } }

  /* ---------- marca ---------- */
  .cores{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .cor{ display:flex; gap:10px; align-items:flex-start; }
  .cor i{ width:40px; height:40px; border-radius:10px; flex-shrink:0; border:1px solid var(--linha); display:block; }
  .cor b{ display:block; font-size:0.92rem; }
  .cor small{ display:block; font-size:0.8rem; color:var(--fraco); line-height:1.35; }
  .combos{ display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px; }
  .combo .mini{ aspect-ratio:4/5; border-radius:10px; padding:12px; display:flex; flex-direction:column; justify-content:center; border:1px solid var(--linha); }
  .combo .mini b{ font-family:var(--display); font-size:1.3rem; line-height:1.05; }
  .combo .mini i{ display:block; width:36%; height:5px; margin-top:auto; border-radius:3px; }
  .combo p{ font-size:0.86rem; margin-top:6px; }
  .regra dt{ font-weight:600; margin-top:14px; }
  .regra dt:first-child{ margin-top:0; }
  .regra dd{ margin:3px 0 0; color:var(--tinta); }

  /* ---------- entrada ---------- */
  .entrada{ min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .entrada .cartao{ width:100%; max-width:400px; padding:28px 22px; }
  .entrada .marca svg{ height:44px; }

  .carregando{ padding:40px 0; text-align:center; color:var(--fraco); }
  .vazio{ text-align:center; padding:28px 12px; color:var(--fraco); }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  'use strict';

  const SUPABASE_URL = 'https://yxewmauwnxnrrhevlbtc.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_G_FuzadzmX2BwkRO81H3mw_xoYnthod';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const BALDE = 'pedidos';

  // O mesmo logotipo do Estúdio e da Central, em currentColor: vira com o tema.

      if(k === 'class') el.className = v;
      else if(k === 'html') el.innerHTML = v;
