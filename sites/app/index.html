<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F2EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12100E" media="(prefers-color-scheme: dark)">
<title>Bora — seus posts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  /* ==================================================================
     O app do cliente — o mesmo papel morno do Estúdio, com bem menos coisa.
     Quem usa é o dono do negócio, no celular, entre um atendimento e outro:
     uma pergunta por tela, botão grande, nenhuma palavra de designer.

     A laranja da marca é forma (barra, selo, o ponto da logo). Quando tem
     texto em cima, o fundo é a laranja-forte — branco sobre a laranja da
     marca dá 3,06:1 e não passa. Mesma regra do Estúdio e da Central.
     ================================================================== */
  :root{
    --papel:#F5F2EC; --sup:#FFFFFF; --sup2:#FBF9F5;
    --tinta:#1A1815; --fraco:#6E675F; --linha:#E8E2D8;
    --laranja:#FF5E00; --laranja-forte:#B84300; --laranja-fraco:#FFF1E8; --sobre-laranja:#FFFFFF;
    --roxo:#8800FF;
    --ok:#1C6B45; --ok-f:#EAF3EE;
    --al:#A93226; --al-f:#FBEAE7;
    --es:#8A5A05; --es-f:#FBF1DE;
    --an:#1B4F8F; --an-f:#E9F0F9;
    --nt:#6D665F; --nt-f:#F1EEE8;
    --s1:0 1px 2px rgba(26,24,21,.04), 0 6px 22px rgba(26,24,21,.06);
    --r:16px;
    --display:'Space Grotesk','Segoe UI',sans-serif;
    --corpo:'Archivo','Helvetica Neue',Arial,sans-serif;
    --dado:'Space Mono','SFMono-Regular',Consolas,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --papel:#12100E; --sup:#1B1815; --sup2:#221E1A;
      --tinta:#F2EEE8; --fraco:#A09890; --linha:#302B26;
      --laranja:#FF7A2E; --laranja-forte:#FF9A5C; --laranja-fraco:#2E1B0E; --sobre-laranja:#12100E;
      --roxo:#B166FF;
      --ok:#7FD6A6; --ok-f:#16291F;
      --al:#FF9382; --al-f:#2E1714;
      --es:#EFC873; --es-f:#2B2110;
      --an:#9CC0F2; --an-f:#152131;
      --nt:#B8B0A7; --nt-f:#262119;
      --s1:0 1px 2px rgba(0,0,0,.5), 0 6px 22px rgba(0,0,0,.4);
      color-scheme:dark;
    }
  }

  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--papel); color:var(--tinta);
    font-family:var(--corpo); font-size:16px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button{ font-family:inherit; cursor:pointer; color:inherit; }
  input,textarea{ font-family:var(--corpo); font-size:1rem; color:var(--tinta); }
  *:focus-visible{ outline:2.5px solid var(--roxo); outline-offset:2px; border-radius:4px; }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
  h1,h2,h3{ font-family:var(--display); letter-spacing:-0.02em; margin:0; }
  h1{ font-size:1.7rem; line-height:1.12; }
  h2{ font-size:1.12rem; }
  p{ margin:0; }
  .rot{ font-family:var(--dado); font-size:0.66rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--fraco); }
  .fraco{ color:var(--fraco); }
  .pilha > * + *{ margin-top:12px; }
  .pilha-g > * + *{ margin-top:28px; }

  /* ---------- moldura ---------- */
  .topo{
    position:sticky; top:0; z-index:5; background:var(--papel);
    display:flex; align-items:center; gap:12px; padding:12px 16px;
    border-bottom:1px solid var(--linha);
  }
  .marca{ display:flex; align-items:center; gap:8px; text-decoration:none; color:var(--tinta); flex-shrink:0; }
  .marca svg{ height:30px; width:auto; display:block; }
  .quem{ margin-left:auto; min-width:0; display:flex; align-items:center; gap:10px; }
  .quem .nome{ font-weight:600; font-size:0.92rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .quem select{
    max-width:52vw; font:inherit; font-weight:600; font-size:0.9rem; color:var(--tinta);
    background:var(--sup); border:1px solid var(--linha); border-radius:10px; padding:6px 8px;
  }
  .linkbtn{ background:none; border:none; padding:4px 2px; color:var(--laranja-forte); font-size:0.85rem; text-decoration:underline; }

  main{ max-width:720px; margin:0 auto; padding:20px 16px calc(96px + env(safe-area-inset-bottom)); }
  .abas{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    display:grid; grid-template-columns:repeat(3,1fr);
    background:var(--sup); border-top:1px solid var(--linha);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .abas a{
    display:flex; flex-direction:column; align-items:center; gap:2px; padding:9px 4px 10px;
    text-decoration:none; color:var(--fraco); font-size:0.78rem; font-weight:600;
  }
  .abas a svg{ width:22px; height:22px; }
  .abas a[aria-current="page"]{ color:var(--laranja-forte); }
  @media (min-width:900px){
    .corpo{ display:grid; grid-template-columns:220px minmax(0,1fr); max-width:1080px; margin:0 auto; gap:12px; }
    .abas{
      position:sticky; top:72px; align-self:start; display:flex; flex-direction:column; gap:4px;
      background:none; border:none; padding:20px 0 0 16px;
    }
    .abas a{ flex-direction:row; gap:10px; font-size:0.95rem; padding:10px 12px; border-radius:10px; }
    .abas a[aria-current="page"]{ background:var(--laranja-fraco); }
    main{ padding-bottom:48px; margin:0; }
  }

  /* ---------- blocos ---------- */
  .cartao{ background:var(--sup); border-radius:var(--r); box-shadow:var(--s1); padding:18px; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    min-height:48px; padding:0 22px; border-radius:100px; border:none;
    font-family:var(--display); font-weight:700; font-size:1rem; text-decoration:none;
  }
  .btn.pri{ background:var(--laranja-forte); color:var(--sobre-laranja); }
  .btn.sec{ background:var(--sup); color:var(--tinta); border:1.5px solid var(--linha); }
  .btn.cheio{ width:100%; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .botoes{ display:flex; gap:10px; flex-wrap:wrap; }
  .botoes .btn{ flex:1 1 140px; }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    border:1.5px solid var(--linha); background:var(--sup); border-radius:100px;
    padding:9px 14px; font-size:0.92rem; font-weight:500;
  }
  .chip[aria-pressed="true"]{ border-color:var(--laranja-forte); background:var(--laranja-fraco); color:var(--tinta); font-weight:600; }

  .campo label{ display:block; font-weight:600; margin-bottom:6px; }
  .campo textarea, .campo input[type=email], .campo input[type=date]{
    width:100%; border:1.5px solid var(--linha); border-radius:12px; background:var(--sup);
    padding:12px 14px; line-height:1.45;
  }
  .campo textarea{ min-height:120px; resize:vertical; }
  .contador{ font-family:var(--dado); font-size:0.72rem; color:var(--fraco); text-align:right; margin-top:4px; }

  .aviso{ border-radius:12px; padding:12px 14px; font-size:0.95rem; }
  .aviso.erro{ background:var(--al-f); color:var(--al); }
  .aviso.ok{ background:var(--ok-f); color:var(--ok); }
  .aviso.info{ background:var(--an-f); color:var(--an); }

  .selo{ display:inline-block; font-size:0.78rem; font-weight:600; padding:3px 10px; border-radius:100px; white-space:nowrap; }
  .selo.produzindo{ background:var(--an-f); color:var(--an); }
  .selo.para_aprovar{ background:var(--laranja-fraco); color:var(--laranja-forte); }
  .selo.aprovado, .selo.agendado, .selo.publicado{ background:var(--ok-f); color:var(--ok); }
  .selo.rascunho, .selo.cancelado{ background:var(--nt-f); color:var(--nt); }

  /* ---------- Hoje ---------- */
  .tipos{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  @media (min-width:600px){ .tipos{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
  .tipo{
    display:flex; flex-direction:column; align-items:flex-start; gap:8px; text-align:left;
    background:var(--sup); border:none; border-radius:var(--r); box-shadow:var(--s1);
    padding:16px 14px; min-height:132px; text-decoration:none; color:var(--tinta);
  }
  .tipo svg{ width:30px; height:30px; color:var(--laranja-forte); }
  .tipo b{ font-family:var(--display); font-size:1rem; line-height:1.2; }
  .tipo span{ font-size:0.84rem; color:var(--fraco); line-height:1.35; }
  .tipo[aria-disabled="true"]{ box-shadow:none; background:var(--sup2); cursor:default; }
  .tipo[aria-disabled="true"] svg{ color:var(--fraco); }
  .tipo .breve{ margin-top:auto; font-family:var(--dado); font-size:0.66rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--fraco); }

  .lista{ display:flex; flex-direction:column; gap:10px; }
  .linha-ped{
    display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--tinta);
    background:var(--sup); border-radius:14px; box-shadow:var(--s1); padding:10px 12px;
  }
  .miniatura{ width:52px; aspect-ratio:4/5; border-radius:8px; background:var(--sup2); object-fit:cover; flex-shrink:0; border:1px solid var(--linha); }
  .linha-ped .txt{ min-width:0; flex:1; }
  .linha-ped .tit{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .linha-ped .sub{ font-size:0.82rem; color:var(--fraco); }
  .linha-ped.chama{ outline:2px solid var(--laranja-forte); outline-offset:-2px; }

  /* ---------- pedido ---------- */
  .passos{ display:flex; gap:6px; }
  .passos i{ flex:1; height:4px; border-radius:4px; background:var(--linha); }
  .passos i.feito{ background:var(--laranja); }
  .resumo dt{ font-size:0.82rem; color:var(--fraco); margin-top:12px; }
  .resumo dt:first-child{ margin-top:0; }
  .resumo dd{ margin:2px 0 0; font-weight:500; }
  .amostras{ display:flex; gap:6px; margin-top:6px; }
  .amostras i{ width:28px; height:28px; border-radius:8px; border:1px solid var(--linha); display:block; }

  /* ---------- acompanhamento ---------- */
  .voltar{ display:inline-flex; align-items:center; gap:4px; color:var(--fraco); text-decoration:none; font-size:0.92rem; }
  .cabeca{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .barra{ height:10px; border-radius:10px; background:var(--linha); overflow:hidden; }
  .barra i{ display:block; height:100%; background:var(--laranja); border-radius:10px; transition:width .5s ease; }
  .etapa{ font-family:var(--display); font-weight:700; font-size:1.2rem; }
  /* Só as laterais e o pé: o topo é do espaçamento entre blocos (.pilha-g). */
  .figura{ margin-left:0; margin-right:0; margin-bottom:0; }
  .previa{ display:block; width:100%; max-width:440px; aspect-ratio:4/5; margin:0 auto; border-radius:12px; background:var(--sup2); object-fit:contain; box-shadow:var(--s1); }
  .previa.antiga{ opacity:.55; }
  .versoes{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .versoes button{ border:2px solid transparent; background:none; padding:0; border-radius:10px; }
  .versoes button[aria-pressed="true"]{ border-color:var(--laranja-forte); }
  .versoes img{ width:56px; aspect-ratio:4/5; border-radius:8px; object-fit:cover; display:block; }
  .linha-tempo{ list-style:none; margin:0; padding:0; }
  .linha-tempo li{ display:flex; gap:12px; padding:7px 0; border-top:1px solid var(--linha); font-size:0.92rem; }
  .linha-tempo li:first-child{ border-top:none; }
  .linha-tempo time{ font-family:var(--dado); font-size:0.75rem; color:var(--fraco); flex-shrink:0; padding-top:2px; }
  .acoes{ position:sticky; bottom:calc(64px + env(safe-area-inset-bottom)); background:var(--papel); padding:12px 0 4px; }
  @media (min-width:900px){ .acoes{ bottom:0; } }

  /* ---------- marca ---------- */
  .cores{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .cor{ display:flex; gap:10px; align-items:flex-start; }
  .cor i{ width:40px; height:40px; border-radius:10px; flex-shrink:0; border:1px solid var(--linha); display:block; }
  .cor b{ display:block; font-size:0.92rem; }
  .cor small{ display:block; font-size:0.8rem; color:var(--fraco); line-height:1.35; }
  .combos{ display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px; }
  .combo .mini{ aspect-ratio:4/5; border-radius:10px; padding:12px; display:flex; flex-direction:column; justify-content:center; border:1px solid var(--linha); }
  .combo .mini b{ font-family:var(--display); font-size:1.3rem; line-height:1.05; }
  .combo .mini i{ display:block; width:36%; height:5px; margin-top:auto; border-radius:3px; }
  .combo p{ font-size:0.86rem; margin-top:6px; }
  .regra dt{ font-weight:600; margin-top:14px; }
  .regra dt:first-child{ margin-top:0; }
  .regra dd{ margin:3px 0 0; color:var(--tinta); }

  /* ---------- entrada ---------- */
  .entrada{ min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .entrada .cartao{ width:100%; max-width:400px; padding:28px 22px; }
  .entrada .marca svg{ height:44px; }

  .carregando{ padding:40px 0; text-align:center; color:var(--fraco); }
  .vazio{ text-align:center; padding:28px 12px; color:var(--fraco); }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>
</head>

    { k:'reel',         nome:'Reel ou vídeo curto',     sub:'A partir do vídeo que você gravou',   icone:'reel',        ativo:false },
    { k:'capa',         nome:'Capa ou thumbnail',       sub:'A imagem que chama pro vídeo',        icone:'capa',        ativo:false },
    { k:'apresentacao', nome:'Vídeo de apresentação',   sub:'Contando o que o seu negócio faz',    icone:'apresentacao', ativo:false },
  ];
  const NOME_TIPO = Object.fromEntries(TIPOS.map(t => [t.k, t.nome]));

  const ESTADOS = {
    rascunho:     'Rascunho',
    produzindo:   'Fazendo',
    para_aprovar: 'Para você aprovar',
    aprovado:     'Aprovado',
    agendado:     'Agendado',
    publicado:    'Publicado',
    cancelado:    'Cancelado',
  };
  const FILTROS = [
    ['todos', 'Todos'], ['produzindo', 'Fazendo'], ['para_aprovar', 'Para aprovar'], ['aprovado', 'Aprovados'],
  ];
  const OBJETIVOS = ['Atrair gente nova', 'Vender', 'Ensinar algo', 'Contar uma novidade'];
  const TONS = ['Como sempre', 'Mais sério', 'Mais leve'];
  const ATALHOS = ['mais curto', 'outra cor da marca', 'mais sério', 'troca a foto'];
  const ROTULO_ATALHO = { 'mais curto':'Mais curto', 'outra cor da marca':'Outra cor da marca', 'mais sério':'Mais sério', 'troca a foto':'Troca a foto' };
  const MAX_AJUSTES = 5;

  const state = {
    carregando: true,
    user: null,
    clientes: [],
    clienteId: null,
    marca: null,
    pedidos: [],
    eventos: {},          // pedido_id -> eventos visíveis
    urls: {},             // caminho no balde -> link assinado
    rota: { nome:'hoje', arg:null },
    filtro: 'todos',
    novo: null,           // rascunho do pedido em 3 passos
    ajuste: null,         // { pedidoId, texto, atalhos:Set }
    versaoVista: {},      // pedido_id -> job_id da versão na tela
    aviso: null,          // { tipo, texto }
    enviandoLink: false,
    linkEnviadoPara: null,
    ocupado: false,
  };

  // ---------- utilidades ----------

  // Monta DOM sem innerHTML: todo texto que vem do banco entra como texto.
  // 'html' só recebe as constantes de ícone e logo, escritas aqui.
  function h(tag, props, ...filhos){
    const el = document.createElement(tag);
    for(const [k, v] of Object.entries(props || {})){
      if(v == null || v === false) continue;
      if(k === 'class') el.className = v;
      else if(k === 'html') el.innerHTML = v;
      else if(k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if(k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if(v === true) el.setAttribute(k, '');
      else el.setAttribute(k, String(v));
    }
    for(const f of filhos.flat(Infinity)){
      if(f == null || f === false) continue;
      el.append(f.nodeType ? f : String(f));
    }
    return el;
  }

  const lerLocal = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const gravarLocal = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };

  const fmtData = (iso) => new Date(iso).toLocaleDateString('pt-BR', { day:'2-digit', month:'short' });
  const fmtHora = (iso) => new Date(iso).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
  const fmtDia = (yyyyMmDd) => new Date(yyyyMmDd + 'T12:00:00').toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });
  const hojeIso = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };

  // A mensagem das funções do banco já é escrita pra quem pede ("espere uma
  // terminar"); o resto vira uma frase genérica, sem código de erro na cara.
  function mensagemDeErro(error){
    const m = (error && error.message) || '';
    if(/^[a-zà-ú]/i.test(m) && !/(fetch|network|jwt|permission denied|violates|syntax)/i.test(m)) return m.charAt(0).toUpperCase() + m.slice(1) + '.';
    if(/fetch|network/i.test(m)) return 'Sem conexão agora. Confira a internet e tente de novo.';
    return 'Algo não deu certo. Tente de novo em instantes.';
  }

  function avisar(tipo, texto){
    state.aviso = { tipo, texto };
    render();
    clearTimeout(avisar.t);
    if(tipo !== 'erro') avisar.t = setTimeout(() => { state.aviso = null; render(); }, 5000);
  }

  // ---------- rotas ----------

  function lerRota(){
    const partes = location.hash.replace(/^#\/?/, '').split('/');
    const nome = ['hoje', 'novo', 'pedido', 'pedidos', 'marca'].includes(partes[0]) ? partes[0] : 'hoje';
    return { nome, arg: partes[1] || null };
  }
  function ir(hash){ if(location.hash !== hash) location.hash = hash; }

  // Compara com a tela antes de agir: o hashchange que eu mesmo causei não
  // reaplica a rota. Foi uma corrida assim que quebrou a navegação da Central.
  window.addEventListener('hashchange', () => {
    const r = lerRota();
    if(r.nome === state.rota.nome && r.arg === state.rota.arg) return;
    state.rota = r;
    aoEntrarNaRota();
  });

  async function aoEntrarNaRota(){
    state.aviso = null;
    const { nome, arg } = state.rota;
    if(nome === 'novo'){
      const tipo = TIPOS.find(t => t.k === arg && t.ativo);
      if(!tipo){ ir('#/hoje'); return; }
      if(!state.novo || state.novo.tipo !== tipo.k) state.novo = { tipo:tipo.k, passo:1, texto:'', objetivo:null, tom:'Como sempre', data:'' };
    }
    if(nome === 'pedido' && arg){
      if(!state.pedidos.find(p => p.id === arg)) await carregarPedido(arg);
      await carregarEventos(arg);
      garantirUrls();
    }
    window.scrollTo(0, 0);
    render();
  }

  // ---------- dados ----------

  // O "!jobs_pedido_id_fkey" diz por qual ligação trazer as rodadas: desde que
  // o pedido guarda a rodada aprovada (job_aprovado), há dois caminhos entre
  // as tabelas, e sem a indicação o banco recusa a consulta inteira.
  const COLUNAS_PEDIDO = 'id, cliente_id, tipo, titulo, briefing, estado, publicar_em, ajustes, job_aprovado, aprovado_em, criado_em, atualizado_em, '
    + 'jobs!jobs_pedido_id_fkey(id, rodada, estado, etapa, progresso, saidas, erro, criado_em, atualizado_em)';

  async function carregarClientes(){
    const { data, error } = await sb.rpc('meus_clientes');
    if(error) throw error;
    state.clientes = data || [];
    const guardado = lerLocal('bora-app:cliente');
    state.clienteId = (state.clientes.find(c => c.id === guardado) || state.clientes[0] || {}).id || null;
  }

  async function carregarDoCliente(){
    if(!state.clienteId) return;
    const [marca, pedidos] = await Promise.all([
      sb.rpc('marca_do_cliente', { p_cliente: state.clienteId }),
      sb.from('pedidos').select(COLUNAS_PEDIDO).eq('cliente_id', state.clienteId).order('criado_em', { ascending:false }).limit(60),
    ]);
    if(marca.error) throw marca.error;
    if(pedidos.error) throw pedidos.error;
    state.marca = marca.data;
    state.pedidos = pedidos.data || [];
    escutarCliente();
    garantirUrls();
  }

  async function carregarPedido(id){
    const { data } = await sb.from('pedidos').select(COLUNAS_PEDIDO).eq('id', id).maybeSingle();
    if(data) juntarPedido(data);
  }

  async function carregarEventos(pedidoId){
    const p = state.pedidos.find(x => x.id === pedidoId);
    if(!p) return;
    const ids = (p.jobs || []).map(j => j.id);
    if(!ids.length){ state.eventos[pedidoId] = []; return; }
    const { data } = await sb.from('job_eventos').select('id, job_id, mensagem, criado_em')
      .in('job_id', ids).eq('visivel_cliente', true).order('id');
    state.eventos[pedidoId] = data || [];
  }

  function juntarPedido(novo){
    const i = state.pedidos.findIndex(p => p.id === novo.id);
    if(i < 0){ state.pedidos.unshift(novo); return; }
    state.pedidos[i] = Object.assign({}, state.pedidos[i], novo, { jobs: novo.jobs || state.pedidos[i].jobs });
  }

  // Atualização mais velha que a que já está na tela é ignorada: a leitura e
  // o tempo real correm em paralelo, e sem isto a barra volta de 45% pra 20%.
  function juntarJob(job){
    const p = state.pedidos.find(x => x.id === job.pedido_id);
    if(!p){ carregarPedido(job.pedido_id).then(agendarRender); return; }
    p.jobs = p.jobs || [];
    const i = p.jobs.findIndex(j => j.id === job.id);
    if(i >= 0 && Date.parse(p.jobs[i].atualizado_em) > Date.parse(job.atualizado_em)) return;
    if(i >= 0) p.jobs[i] = Object.assign({}, p.jobs[i], job); else p.jobs.push(job);
  }

  const jobsDe = (p) => (p.jobs || []).slice().sort((a, b) => Date.parse(a.criado_em) - Date.parse(b.criado_em));
  const prontos = (p) => jobsDe(p).filter(j => j.estado === 'pronto');
  const jobEmAndamento = (p) => jobsDe(p).filter(j => j.estado === 'na_fila' || j.estado === 'rodando').pop() || null;
  const ultimoJob = (p) => jobsDe(p).pop() || null;
  const pngDe = (job) => job && (job.saidas || []).find(s => s.papel === 'saida' && /png|jpeg/.test(s.mime || ''));

  // O balde é fechado: a imagem chega por link assinado, que vale uma hora.
  async function garantirUrls(){
    const faltam = [];
    for(const p of state.pedidos) for(const j of prontos(p)){
      const s = pngDe(j);
      if(s && !state.urls[s.caminho]) faltam.push(s.caminho);
    }
    if(!faltam.length) return;
    const { data } = await sb.storage.from(BALDE).createSignedUrls(faltam, 3600);
    for(const d of data || []) if(d.signedUrl) state.urls[d.path] = d.signedUrl;
    agendarRender();
  }

  // ---------- tempo real ----------

  let canal = null;
  function escutarCliente(){
    if(canal) sb.removeChannel(canal);
    const filtro = 'cliente_id=eq.' + state.clienteId;
    canal = sb.channel('cliente-' + state.clienteId)
      .on('postgres_changes', { event:'*', schema:'public', table:'pedidos', filter:filtro }, (m) => {
        if(m.eventType === 'DELETE') return;
        juntarPedido(m.new);
        agendarRender();
      })
      .on('postgres_changes', { event:'*', schema:'public', table:'jobs', filter:filtro }, (m) => {
        if(m.eventType === 'DELETE') return;
        juntarJob(m.new);
        if(m.new.estado === 'pronto') garantirUrls();
        agendarRender();
      })
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'job_eventos', filter:filtro }, (m) => {
        if(!m.new.visivel_cliente) return;
        const p = state.pedidos.find(x => (x.jobs || []).some(j => j.id === m.new.job_id));
        if(!p) return;
        const lista = state.eventos[p.id] = state.eventos[p.id] || [];
        if(!lista.some(e => e.id === m.new.id)) lista.push(m.new);
        agendarRender();
      })
      .subscribe();
  }

  // Tempo real não pode apagar o que a pessoa está digitando: com o foco num
  // campo, a tela espera ele sair pra redesenhar.
  let renderPendente = false;
  function agendarRender(){
    const ativo = document.activeElement;
    if(ativo && /^(TEXTAREA|INPUT|SELECT)$/.test(ativo.tagName) && document.getElementById('app').contains(ativo)){
      renderPendente = true;
      return;
    }
    requestAnimationFrame(render);
  }
  document.addEventListener('focusout', () => {
    if(!renderPendente) return;
    setTimeout(() => {
      const ativo = document.activeElement;
      if(ativo && /^(TEXTAREA|INPUT|SELECT)$/.test(ativo.tagName)) return;
      renderPendente = false;
      render();
    }, 0);
  });

  // ---------- ações ----------

  async function pedir(){
    const n = state.novo;
    state.ocupado = true; render();
    const briefing = { texto: n.texto.trim() };
    if(n.objetivo) briefing.objetivo = n.objetivo;
    if(n.tom && n.tom !== 'Como sempre') briefing.tom = n.tom;
    const publicarEm = n.data ? new Date(n.data + 'T12:00:00').toISOString() : null;
    const { data, error } = await sb.rpc('criar_pedido', {
      p_cliente: state.clienteId, p_tipo: n.tipo, p_briefing: briefing, p_publicar_em: publicarEm,
    });
    state.ocupado = false;
    if(error){ avisar('erro', mensagemDeErro(error)); return; }
    state.novo = null;
    await carregarPedido(data);
    await carregarEventos(data);
    ir('#/pedido/' + data);
  }

  async function aprovar(p){
    state.ocupado = true; render();
    const { error } = await sb.rpc('aprovar_pedido', { p_pedido: p.id });
    state.ocupado = false;
    if(error){ avisar('erro', mensagemDeErro(error)); return; }
    await carregarPedido(p.id);
    avisar('ok', 'Aprovado! A Bora cuida da publicação.');
  }

  async function enviarAjuste(p){
    const a = state.ajuste;
    state.ocupado = true; render();
    const { error } = await sb.rpc('pedir_ajuste', { p_pedido: p.id, p_texto: a.texto.trim(), p_atalhos: [...a.atalhos] });
    state.ocupado = false;
    if(error){ avisar('erro', mensagemDeErro(error)); return; }
    state.ajuste = null;
    delete state.versaoVista[p.id];
    await carregarPedido(p.id);
    await carregarEventos(p.id);
    avisar('info', 'Pedido de ajuste enviado. A nova versão aparece aqui.');
  }

  async function trocarCliente(id){
    state.clienteId = id;
    gravarLocal('bora-app:cliente', id);
    state.pedidos = []; state.marca = null; state.eventos = {}; state.novo = null; state.ajuste = null;
    state.carregando = true; render();
    try { await carregarDoCliente(); } catch(e){ avisar('erro', mensagemDeErro(e)); }
    state.carregando = false;
    if(state.rota.nome === 'pedido') ir('#/pedidos');
    render();
  }

  // ---------- telas ----------

  function render(){
    const app = document.getElementById('app');
    app.replaceChildren(state.user ? telaPrincipal() : telaEntrada());
  }

  function telaEntrada(){
    if(state.carregando) return h('div', { class:'entrada' }, h('p', { class:'carregando' }, 'Abrindo…'));
    const form = h('form', { class:'pilha', novalidate:true },
      h('div', { class:'campo' },
        h('label', { for:'email' }, 'Seu e-mail'),
        h('input', { id:'email', name:'email', type:'email', autocomplete:'email', inputmode:'email', required:true, placeholder:'voce@seunegocio.com.br' })),
      h('button', { class:'btn pri cheio', type:'submit', disabled: state.enviandoLink }, state.enviandoLink ? 'Enviando…' : 'Receber link de acesso'),
    );
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = form.email.value.trim();
      if(!email){ avisar('erro', 'Falta o e-mail.'); return; }
      state.enviandoLink = true; state.aviso = null; render();
      // shouldCreateUser: false — só entra quem a Bora cadastrou. Este projeto
      // é o mesmo do app antigo; sem isso qualquer pessoa criaria conta.
      const { error } = await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:false, emailRedirectTo: location.origin + location.pathname } });
      state.enviandoLink = false;
      if(error){
        const m = (error.message || '').toLowerCase();
        avisar('erro', m.includes('signup') || m.includes('not allowed')
          ? 'Esse e-mail ainda não tem acesso. Fale com a Bora.'
          : m.includes('rate') || m.includes('seconds')
            ? 'Muitos pedidos seguidos. Espere alguns minutos e tente de novo.'
            : 'Não deu pra enviar o link agora. Tente de novo em instantes.');
        return;
      }
      state.linkEnviadoPara = email;
      render();
    });
    return h('div', { class:'entrada' },
      h('div', { class:'cartao pilha-g' },
        h('div', { class:'marca', html: LOGO }),
        state.linkEnviadoPara
          ? h('div', { class:'pilha' },
              h('h1', {}, 'Confira o seu e-mail'),
              h('p', {}, 'Mandamos um link de acesso para ', h('b', {}, state.linkEnviadoPara), '. Abra por este mesmo aparelho.'),
              h('button', { class:'linkbtn', onclick: () => { state.linkEnviadoPara = null; render(); } }, 'Usar outro e-mail'))
          : h('div', { class:'pilha' },
              h('h1', {}, 'Entrar'),
              h('p', { class:'fraco' }, 'Sem senha: mandamos um link para o seu e-mail.'),
              state.aviso && h('div', { class:'aviso ' + state.aviso.tipo, role:'alert' }, state.aviso.texto),
              form)));
  }

  function telaPrincipal(){
    const cliente = state.clientes.find(c => c.id === state.clienteId);
    const topo = h('header', { class:'topo' },
      h('a', { class:'marca', href:'#/hoje', 'aria-label':'Início', html: LOGO }),
      h('div', { class:'quem' },
        state.clientes.length > 1
          ? h('select', { 'aria-label':'Para qual negócio', onchange: (e) => trocarCliente(e.target.value) },
              state.clientes.map(c => h('option', { value:c.id, selected: c.id === state.clienteId }, c.nome)))
          : cliente && h('span', { class:'nome' }, cliente.nome),
        h('button', { class:'linkbtn', onclick: sair }, 'Sair')));

    if(!state.clientes.length){
      return h('div', {}, topo, h('main', {}, h('div', { class:'cartao pilha' },
        h('h1', {}, 'Quase lá'),
        h('p', {}, 'O seu acesso ainda não foi ligado a um negócio. Fale com a Bora que a gente resolve.'))));
    }

    const aba = (hash, nome, icone, ativa) => h('a', { href:hash, 'aria-current': ativa ? 'page' : null, html: ICONE[icone] }, nome);
    const r = state.rota.nome;
    const abas = h('nav', { class:'abas', 'aria-label':'Seções' },
      aba('#/hoje', 'Hoje', 'hoje', r === 'hoje' || r === 'novo'),
      aba('#/pedidos', 'Pedidos', 'pedidos', r === 'pedidos' || r === 'pedido'),
      aba('#/marca', 'Minha marca', 'marca', r === 'marca'));

    let conteudo;
    if(state.carregando) conteudo = h('p', { class:'carregando' }, 'Carregando…');
    else if(r === 'novo' && state.novo) conteudo = telaNovo();
    else if(r === 'pedido') conteudo = telaPedido(state.rota.arg);
    else if(r === 'pedidos') conteudo = telaPedidos();
    else if(r === 'marca') conteudo = telaMarca();
    else conteudo = telaHoje();

    return h('div', {}, topo, h('div', { class:'corpo' }, abas,
      h('main', { id:'conteudo' },
        state.aviso && state.aviso.tipo === 'erro' && h('div', { class:'aviso erro', role:'alert', style:{ marginBottom:'16px' } }, state.aviso.texto),
        state.aviso && state.aviso.tipo !== 'erro' && h('div', { class:'aviso ' + state.aviso.tipo, role:'status', style:{ marginBottom:'16px' } }, state.aviso.texto),
        conteudo)));
  }

  function linhaPedido(p){
    const ultimo = prontos(p).pop();
    const s = pngDe(ultimo);
    const url = s && state.urls[s.caminho];
    const andamento = jobEmAndamento(p);
    const sub = p.estado === 'produzindo' && andamento
      ? (andamento.etapa && andamento.etapa !== 'preparando' ? andamento.etapa.charAt(0).toUpperCase() + andamento.etapa.slice(1) : 'Na fila')
      : (NOME_TIPO[p.tipo] || p.tipo) + ' · ' + fmtData(p.criado_em);
    return h('a', { class:'linha-ped' + (p.estado === 'para_aprovar' ? ' chama' : ''), href:'#/pedido/' + p.id },
      url ? h('img', { class:'miniatura', src:url, alt:'' }) : h('span', { class:'miniatura', 'aria-hidden':'true' }),
      h('span', { class:'txt' },
        h('span', { class:'tit', style:{ display:'block' } }, p.titulo || NOME_TIPO[p.tipo]),
        h('span', { class:'sub' }, sub)),
      h('span', { class:'selo ' + p.estado }, ESTADOS[p.estado] || p.estado));
  }

  function telaHoje(){
    const cliente = state.clientes.find(c => c.id === state.clienteId);
    const primeiro = cliente ? String(cliente.nome).split(' ')[0] : '';
    const andando = state.pedidos.filter(p => p.estado === 'produzindo' || p.estado === 'para_aprovar');
    return h('div', { class:'pilha-g' },
      h('div', { class:'pilha' },
        primeiro && h('p', { class:'rot' }, 'Olá, ' + primeiro),
        h('h1', {}, 'O que você quer criar hoje?')),
      h('div', { class:'tipos' }, TIPOS.map(t => t.ativo
        ? h('a', { class:'tipo', href:'#/novo/' + t.k, html: ICONE[t.icone] }, h('b', {}, t.nome), h('span', {}, t.sub))
        : h('div', { class:'tipo', 'aria-disabled':'true', html: ICONE[t.icone] }, h('b', {}, t.nome), h('span', {}, t.sub), h('span', { class:'breve' }, 'Em breve')))),
      andando.length > 0 && h('section', { class:'pilha', 'aria-labelledby':'em-andamento' },
        h('h2', { id:'em-andamento' }, 'Em andamento'),
        h('div', { class:'lista' }, andando.map(linhaPedido))));
  }

  // ---------- pedido em três passos ----------

  function telaNovo(){
    const n = state.novo;
    const tipo = TIPOS.find(t => t.k === n.tipo);
    const passos = h('div', { class:'passos', 'aria-hidden':'true' }, [1, 2, 3].map(i => h('i', { class: i <= n.passo ? 'feito' : '' })));
    const cabeca = h('div', { class:'pilha' },
      h('a', { class:'voltar', href:'#/hoje' }, '‹ Voltar'),
      passos,
      h('p', { class:'rot' }, tipo.nome + ' · passo ' + n.passo + ' de 3'));

    if(n.passo === 1){
      const contador = h('p', { class:'contador', 'aria-live':'polite' }, n.texto.length + ' / 800');
      const continuar = h('button', { class:'btn pri cheio', disabled: n.texto.trim().length < 3,
        onclick: () => { n.passo = 2; render(); window.scrollTo(0, 0); } }, 'Continuar');
      const area = h('textarea', { id:'texto', maxlength:'800', placeholder:'Ex.: Abrimos turma nova no laboratório, inscrições até sexta.',
        oninput: (e) => {
          n.texto = e.target.value;
          contador.textContent = n.texto.length + ' / 800';
          continuar.disabled = n.texto.trim().length < 3;
        } });
      area.value = n.texto;
      return h('div', { class:'pilha-g' }, cabeca,
        h('div', { class:'pilha' },
          h('h1', {}, 'O que o post precisa dizer?'),
          h('p', { class:'fraco' }, 'Uma ou duas frases, do seu jeito. A Bora transforma em post com a sua marca.')),
        h('div', { class:'campo' }, h('label', { for:'texto', class:'sr' }, 'O que o post precisa dizer'), area, contador),
        continuar);
    }

    if(n.passo === 2){
      const grupo = (titulo, opcoes, valor, definir, id) => h('fieldset', { class:'pilha', style:{ border:'none', padding:0, margin:0 } },
        h('legend', { style:{ fontWeight:600, padding:0, marginBottom:'8px' } }, titulo),
        h('div', { class:'chips', role:'group', 'aria-labelledby':id }, opcoes.map(o =>
          h('button', { class:'chip', type:'button', 'aria-pressed': String(valor === o), onclick: () => { definir(valor === o ? null : o); render(); } }, o))));
      const data = h('input', { id:'data', type:'date', min: hojeIso(), oninput: (e) => { n.data = e.target.value; } });
      data.value = n.data;
      return h('div', { class:'pilha-g' }, cabeca,
        h('h1', {}, 'Algumas escolhas'),
        grupo('Pra que serve esse post?', OBJETIVOS, n.objetivo, (v) => { n.objetivo = v; }, 'g-obj'),
        grupo('Que jeito ele tem?', TONS, n.tom, (v) => { n.tom = v || 'Como sempre'; }, 'g-tom'),
        h('div', { class:'campo' }, h('label', { for:'data' }, 'Quando vai ao ar? ', h('span', { class:'fraco', style:{ fontWeight:400 } }, '(se já souber)')), data),
        h('div', { class:'botoes' },
          h('button', { class:'btn sec', onclick: () => { n.passo = 1; render(); } }, 'Voltar'),
          h('button', { class:'btn pri', onclick: () => { n.passo = 3; render(); window.scrollTo(0, 0); } }, 'Continuar')));
    }

    // Passo 3: o que vai sair, em palavras de quem pede — sem pixel, sem fonte.
    const m = state.marca || {};
    const conj = (m.conjuntos || []).find(c => c.k === m.conjuntoPadrao) || (m.conjuntos || [])[0];
    const cores = conj ? [conj.fundo, conj.tinta || '#FFFFFF', conj.faixa || conj.destaque].filter(Boolean) : (m.paleta || []).slice(0, 3).map(p => p.cor);
    return h('div', { class:'pilha-g' }, cabeca,
      h('h1', {}, 'Confere antes de pedir'),
      h('dl', { class:'cartao resumo' },
        h('dt', {}, 'O que vai sair'),
        h('dd', {}, '1 post para o feed do Instagram, em pé'),
        h('dt', {}, 'Com o seu texto'),
        h('dd', {}, '“' + n.texto.trim() + '”'),
        (n.objetivo || n.tom !== 'Como sempre') && h('dt', {}, 'Do jeito que você escolheu'),
        (n.objetivo || n.tom !== 'Como sempre') && h('dd', {}, [n.objetivo, n.tom !== 'Como sempre' ? n.tom.toLowerCase() : null].filter(Boolean).join(' · ')),
        h('dt', {}, 'Nas cores da sua marca'),
        h('dd', {}, cores.length ? h('span', { class:'amostras' }, cores.map(c => h('i', { style:{ background:c }, title:c }))) : 'As cores cadastradas pela Bora'),
        n.data && h('dt', {}, 'Vai ao ar'),
        n.data && h('dd', {}, fmtDia(n.data)),
        h('dt', {}, 'Quando fica pronto'),
        h('dd', {}, 'Em poucos minutos. Você vê e aprova antes de qualquer coisa ir ao ar.')),
      h('div', { class:'botoes' },
        h('button', { class:'btn sec', onclick: () => { n.passo = 2; render(); } }, 'Voltar'),
        h('button', { class:'btn pri', disabled: state.ocupado, onclick: pedir }, state.ocupado ? 'Enviando…' : 'Pedir post')));
  }

  // ---------- acompanhamento ----------

  function telaPedido(id){
    const p = state.pedidos.find(x => x.id === id);
    if(!p) return h('div', { class:'pilha' }, h('a', { class:'voltar', href:'#/pedidos' }, '‹ Pedidos'), h('p', { class:'vazio' }, 'Não achamos esse pedido.'));

    const versoes = prontos(p);
    const andamento = jobEmAndamento(p);
    const ultimo = ultimoJob(p);
    const falhouDeVez = ultimo && ultimo.estado === 'falhou';
    const vistaId = state.versaoVista[p.id];
    const vista = versoes.find(v => v.id === vistaId) || (p.job_aprovado && versoes.find(v => v.id === p.job_aprovado)) || versoes[versoes.length - 1];
    const s = pngDe(vista);
    const url = s && state.urls[s.caminho];

    const blocos = [];

    if(p.estado === 'produzindo' && andamento){
      const pct = Math.round(Number(andamento.progresso) || 0);
      const etapa = andamento.estado === 'na_fila' ? 'Esperando a vez' : (andamento.etapa === 'preparando' || !andamento.etapa ? 'Preparando' : andamento.etapa.charAt(0).toUpperCase() + andamento.etapa.slice(1));
      blocos.push(h('div', { class:'cartao pilha' },
        h('p', { class:'rot' }, andamento.rodada === 'ajuste' ? 'Fazendo o ajuste' : 'Fazendo o seu post'),
        h('p', { class:'etapa', 'aria-live':'polite' }, etapa),
        h('div', { class:'barra', role:'progressbar', 'aria-valuemin':'0', 'aria-valuemax':'100', 'aria-valuenow':String(pct), 'aria-label':'Andamento' },
          h('i', { style:{ width: Math.max(pct, 4) + '%' } })),
        h('p', { class:'fraco', style:{ fontSize:'0.9rem' } }, 'Leva poucos minutos. Pode fechar esta tela: o pedido continua andando.')));
    }
    if(p.estado === 'produzindo' && !andamento && falhouDeVez){
      blocos.push(h('div', { class:'aviso info' }, 'A equipe da Bora vai finalizar este pedido e te avisa quando estiver pronto.'));
    }
    if(p.estado === 'aprovado'){
      // A data abreviada já termina em ponto ("25 de out."): a frase seguinte vem depois de travessão.
      blocos.push(h('div', { class:'aviso ok' }, 'Aprovado' + (p.aprovado_em ? ' em ' + fmtData(p.aprovado_em) : '') + ' — a Bora cuida da publicação.'));
    }

    if(vista){
      const legenda = andamento && andamento.rodada === 'ajuste' ? 'Versão anterior. O ajuste está sendo feito.' : null;
      blocos.push(h('figure', { class:'pilha figura' },
        url ? h('img', { class:'previa' + (legenda ? ' antiga' : ''), src:url, alt:'Prévia do post: ' + (p.titulo || '') })
            : h('div', { class:'previa', role:'img', 'aria-label':'Carregando a prévia' }),
        legenda && h('figcaption', { class:'fraco', style:{ textAlign:'center', fontSize:'0.9rem' } }, legenda)));
      if(versoes.length > 1){
        blocos.push(h('div', { class:'pilha' },
          h('p', { class:'rot' }, 'Versões'),
          h('div', { class:'versoes' }, versoes.map((v, i) => {
            const sv = pngDe(v); const uv = sv && state.urls[sv.caminho];
            return h('button', { type:'button', 'aria-pressed': String(v.id === vista.id), 'aria-label':'Versão ' + (i + 1),
              onclick: () => { state.versaoVista[p.id] = v.id; render(); } },
              uv ? h('img', { src:uv, alt:'' }) : h('span', { class:'miniatura' }));
          }))));
      }
      if(p.estado === 'aprovado' && url){
        blocos.push(h('a', { class:'btn sec cheio', href:url, download:'post.png', target:'_blank', rel:'noopener' }, 'Baixar a imagem'));
      }
    }

    if(p.estado === 'para_aprovar'){
      const restam = MAX_AJUSTES - (p.ajustes || 0);
      if(state.ajuste && state.ajuste.pedidoId === p.id){
        const a = state.ajuste;
        const podeEnviar = a.atalhos.size > 0 || a.texto.trim().length >= 3;
        const enviar = h('button', { class:'btn pri', disabled: !podeEnviar || state.ocupado, onclick: () => enviarAjuste(p) }, state.ocupado ? 'Enviando…' : 'Enviar ajuste');
        const area = h('textarea', { id:'ajuste', maxlength:'600', placeholder:'Ex.: troca “turma” por “grupo”.', style:{ minHeight:'90px' },
          oninput: (e) => { a.texto = e.target.value; enviar.disabled = !(a.atalhos.size > 0 || a.texto.trim().length >= 3); } });
        area.value = a.texto;
        blocos.push(h('div', { class:'cartao pilha' },
          h('h2', {}, 'O que mudar?'),
          h('div', { class:'chips', role:'group', 'aria-label':'Atalhos de ajuste' }, ATALHOS.map(t =>
            h('button', { class:'chip', type:'button', 'aria-pressed': String(a.atalhos.has(t)),
              onclick: () => { a.atalhos.has(t) ? a.atalhos.delete(t) : a.atalhos.add(t); render(); } }, ROTULO_ATALHO[t]))),
          h('div', { class:'campo' }, h('label', { for:'ajuste' }, 'Ou conte com as suas palavras'), area),
          h('p', { class:'fraco', style:{ fontSize:'0.85rem' } }, restam === 1 ? 'Este é o último ajuste antes de a equipe da Bora entrar.' : 'Você ainda pode pedir ' + restam + ' ajustes neste post.'),
          h('div', { class:'botoes' },
            h('button', { class:'btn sec', onclick: () => { state.ajuste = null; render(); } }, 'Cancelar'),
            enviar)));
      } else {
        blocos.push(h('div', { class:'acoes' }, h('div', { class:'botoes' },
          h('button', { class:'btn sec', disabled: restam <= 0 || state.ocupado,
            onclick: () => { state.ajuste = { pedidoId:p.id, texto:'', atalhos:new Set() }; render(); } }, 'Pedir ajuste'),
          h('button', { class:'btn pri', disabled: state.ocupado, onclick: () => aprovar(p) }, state.ocupado ? 'Aprovando…' : 'Aprovar'))));
      }
    }

    // O histórico separado por rodada, a mais recente em cima: com um ajuste,
    // "Desenhando o post" aparece duas vezes, e sem separação parece repetido.
    const eventos = state.eventos[p.id] || [];
    const rodadas = jobsDe(p).filter(j => eventos.some(e => e.job_id === j.id)).reverse();
    const nomeRodada = (j) => {
      const i = jobsDe(p).indexOf(j);
      return j.rodada === 'ajuste' ? 'Ajuste ' + jobsDe(p).slice(0, i + 1).filter(x => x.rodada === 'ajuste').length : 'Primeira versão';
    };
    return h('div', { class:'pilha-g' },
      h('div', { class:'pilha' },
        h('a', { class:'voltar', href:'#/pedidos' }, '‹ Pedidos'),
        h('div', { class:'cabeca' },
          h('h1', { style:{ fontSize:'1.35rem' } }, p.titulo || NOME_TIPO[p.tipo]),
          h('span', { class:'selo ' + p.estado }, ESTADOS[p.estado] || p.estado)),
        h('p', { class:'fraco', style:{ fontSize:'0.9rem' } }, (NOME_TIPO[p.tipo] || p.tipo) + ' · pedido em ' + fmtData(p.criado_em)
          + (p.publicar_em ? ' · vai ao ar ' + fmtData(p.publicar_em) : ''))),
      ...blocos,
      eventos.length > 0 && h('section', { class:'pilha', 'aria-labelledby':'historico' },
        h('h2', { id:'historico' }, 'O que aconteceu'),
        rodadas.map(j => h('div', { class:'pilha', style:{ marginTop:'14px' } },
          rodadas.length > 1 && h('p', { class:'rot' }, nomeRodada(j)),
          h('ol', { class:'linha-tempo' }, eventos.filter(e => e.job_id === j.id).reverse().map(e =>
            h('li', {}, h('time', { datetime:e.criado_em }, fmtHora(e.criado_em)), h('span', {}, e.mensagem.charAt(0).toUpperCase() + e.mensagem.slice(1)))))))));
  }

  // ---------- lista ----------

  function telaPedidos(){
    const lista = state.pedidos.filter(p => state.filtro === 'todos' || p.estado === state.filtro);
    return h('div', { class:'pilha-g' },
      h('h1', {}, 'Seus pedidos'),
      h('div', { class:'chips', role:'group', 'aria-label':'Mostrar' }, FILTROS.map(([k, nome]) => {
        const n = k === 'todos' ? state.pedidos.length : state.pedidos.filter(p => p.estado === k).length;
        return h('button', { class:'chip', type:'button', 'aria-pressed': String(state.filtro === k),
          onclick: () => { state.filtro = k; render(); } }, nome + (n ? ' · ' + n : ''));
      })),
      lista.length
        ? h('div', { class:'lista' }, lista.map(linhaPedido))
        : h('div', { class:'vazio pilha' },
            h('p', {}, state.pedidos.length ? 'Nenhum pedido aqui.' : 'Você ainda não fez nenhum pedido.'),
            !state.pedidos.length && h('a', { class:'btn pri', href:'#/novo/post-feed' }, 'Pedir o primeiro post')));
  }

  // ---------- marca ----------

  function telaMarca(){
    const m = state.marca;
    if(!m) return h('p', { class:'carregando' }, 'Carregando…');
    const regras = [
      ['Tom de voz', m.tom], ['Para quem', m.publico], ['Nunca', m.evitar], ['Sempre aparece', m.obrigatorios], ['Chamada que você usa', m.chamada],
    ].filter(([, v]) => v);
    const conjuntos = (m.conjuntos || []).filter(c => c && c.fundo);
    return h('div', { class:'pilha-g' },
      h('div', { class:'pilha' },
        h('h1', {}, 'Sua marca'),
        h('p', { class:'fraco' }, 'Toda peça sai com isto. Se algo não for mais assim, fale com a Bora que a gente atualiza.')),
      (m.paleta || []).length > 0 && h('section', { class:'pilha' },
        h('h2', {}, 'Cores'),
        h('div', { class:'cores' }, m.paleta.map(c => h('div', { class:'cor' },
          h('i', { style:{ background:c.cor }, 'aria-hidden':'true' }),
          h('span', {}, h('b', {}, c.nome || c.cor), c.uso && h('small', {}, c.uso)))))),
      conjuntos.length > 0 && h('section', { class:'pilha' },
        h('h2', {}, 'Combinações'),
        h('div', { class:'combos' }, conjuntos.map(c => h('div', { class:'combo' },
          h('div', { class:'mini', style:{ background:c.fundo, color:c.tinta || '#FFFFFF' }, 'aria-hidden':'true' },
            h('b', {}, 'Aa'), h('i', { style:{ background:c.faixa || c.destaque } })),
          h('p', {}, h('b', {}, c.nome), c.k === m.conjuntoPadrao && h('span', { class:'fraco' }, ' · a de sempre')))))),
      m.fonte && h('section', { class:'pilha' }, h('h2', {}, 'Letra'), h('p', {}, m.fonte)),
      regras.length > 0 && h('section', { class:'pilha' },
        h('h2', {}, 'Jeito de falar'),
        h('dl', { class:'cartao regra' }, regras.flatMap(([k, v]) => [h('dt', {}, k), h('dd', {}, v)]))));
  }

  // ---------- sessão ----------

  async function sair(){
    await sb.auth.signOut();
    if(canal){ sb.removeChannel(canal); canal = null; }
    Object.assign(state, { user:null, clientes:[], clienteId:null, pedidos:[], marca:null, eventos:{}, novo:null, ajuste:null, linkEnviadoPara:null, aviso:null });
    ir('#/hoje');
    render();
  }

  function lerRetornoDoLink(){
    const hsh = location.hash || '';
    if(hsh.includes('error')){
      const q = new URLSearchParams(hsh.replace(/^#/, ''));
      const d = (q.get('error_description') || '').toLowerCase();
      state.aviso = { tipo:'erro', texto: d.includes('expired') || d.includes('invalid') ? 'Esse link expirou ou já foi usado. Peça um novo.' : 'O link não funcionou. Peça um novo.' };
    }
    if(hsh.includes('access_token') || hsh.includes('error')) history.replaceState(null, '', location.pathname + location.search + '#/hoje');
  }

  // Uma vez só: ao abrir com sessão guardada, o supabase-js também avisa
  // "entrou", e sem esta trava a página carregava tudo duas vezes, em paralelo.
  let iniciando = null;
  function iniciar(){
    if(!iniciando) iniciando = carregarInicio().finally(() => { iniciando = null; });
    return iniciando;
  }

  async function carregarInicio(){
    lerRetornoDoLink();
    state.rota = lerRota();
    const { data:{ session } } = await sb.auth.getSession();
    state.user = session ? session.user : null;
    if(state.user){
      try {
        await carregarClientes();
        await carregarDoCliente();
      } catch(e){
        state.aviso = { tipo:'erro', texto: mensagemDeErro(e) };
      }
    }
    state.carregando = false;
    await aoEntrarNaRota();
  }

  sb.auth.onAuthStateChange((evento, session) => {
    if(evento === 'SIGNED_IN' && !state.user && !iniciando && session){
      state.user = session.user; state.carregando = true; render();
      iniciar();
    }
  });

  (function favicon(){
    const marca = LOGO.replace('>', '><style>:root{color:#1A1815}@media(prefers-color-scheme:dark){:root{color:#F2EEE8}}</style>');
    const l = document.createElement('link');
    l.rel = 'icon';
    l.href = 'data:image/svg+xml,' + encodeURIComponent(marca);
    document.head.appendChild(l);
  })();

  render();
  iniciar();
})();
</script>
</body>
</html>
